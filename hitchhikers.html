<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Don't Panic</title>
<style>
:root{--bg:#05060f;--fg:#e8e6d9;--acc:#7fd4ff;--warn:#ffcf4a;--panel:rgba(12,14,34,.97)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Courier New",monospace;display:flex;justify-content:center;min-height:100vh;user-select:none}
#wrap{position:relative;width:960px;max-width:100vw;margin-top:8px}
#hud{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 10px;background:#0b0d22;border:1px solid #223;border-bottom:none;font-size:13px;flex-wrap:wrap}
#chap{color:var(--warn);font-weight:bold}
#obj{color:var(--acc);flex:1;text-align:center}
#stats{font-size:12px;opacity:.9}
#stats b{color:var(--warn)}
#stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#000;border:1px solid #223}
#dialog{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:2px solid var(--acc);border-radius:8px;padding:12px 16px 22px;display:none;min-height:96px;box-shadow:0 0 24px rgba(127,212,255,.25);cursor:pointer}
#dwho{font-weight:bold;margin-bottom:4px;font-size:15px}
#dtext{white-space:pre-wrap;font-size:15px}
#dchoices{margin-top:8px}
.ch{display:block;padding:5px 9px;margin:4px 0;border:1px solid #334;border-radius:4px;cursor:pointer;background:#141838}
.ch.sel,.ch:hover{border-color:var(--warn);color:var(--warn)}
#dmore{position:absolute;right:12px;bottom:4px;font-size:11px;opacity:.6}
#panel{position:absolute;inset:16px 50px;background:var(--panel);border:2px solid var(--warn);border-radius:10px;padding:16px 20px;display:none;overflow:auto}
#panel h2{margin:0 0 10px;color:var(--warn);font-size:18px}
#panel h3{margin:14px 0 6px;color:var(--acc);font-size:14px}
#panel .q{margin:6px 0;padding:6px 9px;border-left:3px solid var(--acc);background:#11143a}
#panel .q.side{border-color:#d8f}
#panel .q.done{opacity:.45;border-color:#5c5}
#panel .q.done b{text-decoration:line-through}
#panel .g{margin:8px 0;padding:8px 10px;background:#0f1a10;border:1px solid #2a5a2a;border-radius:6px;color:#bfe8b0}
#panel .g b{color:#7fff7f}
#panel button{font:inherit;background:#223;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 10px;cursor:pointer;margin-left:8px}
#panel .close{position:sticky;top:0;float:right}
#toasts{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:60%}
.toast{background:rgba(10,12,30,.94);border:1px solid var(--warn);color:var(--warn);padding:5px 10px;border-radius:5px;font-size:13px;animation:fade 4.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateX(20px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#help{font-size:12px;opacity:.7;padding:6px 10px;text-align:center}
#touch{display:none;justify-content:space-between;padding:10px 16px}
#touch button{width:56px;height:56px;font-size:20px;background:#141838;color:var(--fg);border:1px solid #446;border-radius:10px;touch-action:none}
#pad{display:grid;grid-template-columns:repeat(3,56px);gap:4px}
#acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:200px;justify-content:flex-end}
@media (max-width:700px){#help{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="chap">Don't Panic</span><span id="obj"></span><span id="stats"></span></div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toasts"></div>
    <div id="dialog"><div id="dwho"></div><div id="dtext"></div><div id="dchoices"></div><div id="dmore">▼ E / Space</div></div>
    <div id="panel"></div>
  </div>
  <div id="help">Move: WASD / Arrows · Interact / talk: E or Space · Quests: Q · Inventory: I · Guide: G · Towel on head: T · Help: H</div>
  <div id="touch">
    <div id="pad"><span></span><button data-k="arrowup">▲</button><span></span><button data-k="arrowleft">◀</button><span></span><button data-k="arrowright">▶</button><span></span><button data-k="arrowdown">▼</button><span></span></div>
    <div id="acts"><button data-p="e">E</button><button data-p="q">Q</button><button data-p="i">I</button><button data-p="g">G</button><button data-p="t">T</button></div>
  </div>
</div>
<script>
'use strict';
/* =========================================================================
   DON'T PANIC — a fan-made Hitchhiker's adventure (engine)
   ========================================================================= */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const TS=32,VW=30,VH=18;cv.width=VW*TS;cv.height=VH*TS;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hsh=(x,y)=>(((x*73856093)^(y*19349663))>>>0);
const ease=t=>t<0?0:t>1?1:t;

/* ---------------- audio ---------------- */
let AC=null;
function sfx(type){try{
  if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime;
  const P={blip:[660,.05,'square',.03],pick:[880,.18,'triangle',.08],quest:[523,.45,'triangle',.09],alarm:[330,.35,'sawtooth',.05],
    caught:[160,.7,'sawtooth',.08],door:[520,.12,'sine',.04],warp:[150,1,'sine',.09],creak:[90,.25,'square',.05],bad:[140,.3,'square',.05]}[type]||[440,.1,'sine',.04];
  o.type=P[2];o.frequency.setValueAtTime(P[0],t);
  if(type==='quest'){o.frequency.setValueAtTime(659,t+.12);o.frequency.setValueAtTime(784,t+.24);}
  if(type==='pick')o.frequency.setValueAtTime(1175,t+.08);
  if(type==='warp')o.frequency.exponentialRampToValueAtTime(1800,t+1);
  if(type==='caught')o.frequency.exponentialRampToValueAtTime(40,t+.7);
  if(type==='alarm')o.frequency.setValueAtTime(440,t+.17);
  g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[1]);
  o.start(t);o.stop(t+P[1]+.03);
}catch(e){}}

/* ---------------- state ---------------- */
const G={mode:'title',time:0,flags:{},inv:[],quests:{},qorder:[],guide:{},improb:0,caughtN:0,
  map:null,mapId:'',p:{x:0,y:0,ox:0,oy:0,t:1,dir:[0,1],spd:.13,lying:false},trail:[],followers:[],
  timer:null,peng:0,towelHead:false,shades:false,lock:false,danger:0,parts:[],chapter:'',cp:[0,0],cam:[0,0],
  card:null,cardT:0,endT:0,caughtT:0,caughtMsg:'',flash:0,shake:0};
let F=G.flags;
const MAPS={},ITEMS={},GUIDE={},EXTRA={};
let MINI=null;

/* ---------------- tiles ---------------- */
// s=solid  o=blocks sight  hide=hiding spot  noise=creaky
const TD={'#':{s:1,o:1},'.':{},',':{},'=':{},'T':{s:1,o:1},'~':{s:1},'B':{hide:1},'_':{hide:1},'C':{s:1},'X':{s:1,o:1},
 '+':{door:1},'*':{s:1},'g':{s:1},'m':{s:1},'M':{},'h':{},'`':{},'R':{s:1,o:1},'n':{noise:1},'r':{},'b':{s:1},'k':{},
 'p':{s:1},'w':{},'P':{s:1,o:1},'o':{s:1},'s':{s:1},'Z':{s:1},'K':{s:1,o:1},'f':{}};
const FLAVOR={'#':'A wall. It is doing an excellent job of being a wall.','T':'A tree. Trees are considered by some to have been a bad move.',
 '~':'Water. Wet, mostly.','*':'Space. It is big. Really big.','g':'A window onto the howling void. Lovely view.','X':'A crate. Nothing in it but crate-air.',
 'K':'A humming computer bank. It is thinking about something much more important than you.','p':'A sleep pod. Someone inside is snoring in a very important way.',
 'R':'A rock. Not one of the interesting ones.','C':'A counter.','m':'A console covered in buttons labelled in a language you could, with effort, read.'};

function grid(w,h,ch){return Array.from({length:h},()=>Array(w).fill(ch));}
function R(g,x,y,w,h,ch){for(let j=0;j<h;j++)for(let i=0;i<w;i++){const yy=y+j,xx=x+i;if(g[yy]&&xx>=0&&xx<g[yy].length)g[yy][xx]=ch;}}
function Pt(g,x,y,ch){if(g[y]&&x>=0&&x<g[y].length)g[y][x]=ch;}
function box(g,x,y,w,h,wall,floor){R(g,x,y,w,h,wall||'#');R(g,x+1,y+1,w-2,h-2,floor||'.');}
function border(g,ch){const h=g.length,w=g[0].length;R(g,0,0,w,1,ch);R(g,0,h-1,w,1,ch);R(g,0,0,1,h,ch);R(g,w-1,0,1,h,ch);}
function tileAt(x,y){const m=G.map;if(!m||y<0||x<0||y>=m.h||x>=m.w)return '#';return m.g[y][x];}

/* ---------------- drawing helpers ---------------- */
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function rr(x,y,w,h,c,r){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r||3);else ctx.rect(x,y,w,h);ctx.fill();}
function ell(x,y,rx,ry,c,rot){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();}
function txt(s,x,y,c,size,align,font){ctx.fillStyle=c||'#fff';ctx.font=(size||14)+'px '+(font||'"Courier New",monospace');ctx.textAlign=align||'left';ctx.fillText(s,x,y);}
function wrapText(s,x,y,maxW,lh,c,size,align){ctx.font=(size||14)+'px "Courier New",monospace';const words=s.split(' ');let line='',yy=y;
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){txt(line,x,yy,c,size,align);line=w;yy+=lh;}else line=t;}
  if(line)txt(line,x,yy,c,size,align);return yy;}

function drawTile(c,x,y,X,Y,th){
  const h=hsh(x,y);
  const f=col=>{ctx.fillStyle=col;ctx.fillRect(X,Y,TS,TS);};
  const base=()=>{const gch=th.ground||'.';if(gch!==c&&!'ZobspBK'.includes(gch))drawTile(gch,x,y,X,Y,th);else f((x+y)%2?th.floor:th.floor2);};
  switch(c){
  case '#':f(th.wall);ctx.fillStyle=th.wallHi;ctx.fillRect(X,Y,TS,5);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(X,Y+TS-4,TS,4);
    if(th.brick){ctx.strokeStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.moveTo(X,Y+17);ctx.lineTo(X+TS,Y+17);const bx=X+(y%2?8:24);ctx.moveTo(bx,Y+5);ctx.lineTo(bx,Y+17);ctx.moveTo(bx+(bx>X+16?-16:16),Y+17);ctx.lineTo(bx+(bx>X+16?-16:16),Y+28);ctx.stroke();}
    if(th.rivet&&h%3===0){circ(X+5,Y+10,1.5,'rgba(0,0,0,.4)');circ(X+27,Y+10,1.5,'rgba(0,0,0,.4)');}break;
  case '.':f((x+y)%2?th.floor:th.floor2);if(th.grate&&h%4===0){ctx.strokeStyle='rgba(0,0,0,.15)';ctx.strokeRect(X+4,Y+4,24,24);}break;
  case 'w':f((x+y)%2?'#eef3f7':'#e3eaf1');if(h%7===0){ctx.fillStyle='rgba(255,210,80,.25)';ctx.fillRect(X+14,Y,4,TS);}break;
  case ',':f('#3f7a35');if(h%3===0){ctx.fillStyle='#4f8f42';ctx.fillRect(X+(h%22)+3,Y+((h>>5)%22)+3,3,3);}if(h%5===1){ctx.fillStyle='#356a2d';ctx.fillRect(X+((h>>3)%24)+2,Y+((h>>7)%24)+2,2,4);}break;
  case 'h':f('#3f7a35');for(let i=0;i<4;i++){circ(X+6+((h>>i*3)%20),Y+6+((h>>(i*3+9))%20),3,['#e64','#fd4','#d6f','#fff'][(h+i)%4]);}break;
  case 'f':f('#3f7a35');circ(X+16,Y+16,9,'#5a2a1a');ctx.fillStyle=['#f80','#fd2','#f40'][Math.floor(G.time*8+x)%3];ctx.beginPath();ctx.moveTo(X+9,Y+18);ctx.quadraticCurveTo(X+16,Y-4+Math.sin(G.time*9)*3,X+23,Y+18);ctx.fill();break;
  case '=':f('#4a4a50');if(y%2===0&&x%3===0){ctx.fillStyle='#ddd';ctx.fillRect(X+4,Y+TS-2,18,3);}break;
  case 'T':drawTile(th.ground==='`'?'`':',',x,y,X,Y,th);ctx.fillStyle='#5a3a1a';ctx.fillRect(X+13,Y+18,6,13);circ(X+16,Y+13,12,'#1f5a25');circ(X+11,Y+10,6,'#2c7032');circ(X+20,Y+15,5,'#245f2a');break;
  case '~':{f('#2a5a9a');ctx.strokeStyle='#6ab0ff';ctx.lineWidth=1.5;ctx.beginPath();const o=Math.sin(G.time*2+x*.7+y)*3;ctx.moveTo(X+2,Y+12+o);ctx.quadraticCurveTo(X+10,Y+7+o,X+18,Y+12+o);ctx.moveTo(X+12,Y+24-o);ctx.quadraticCurveTo(X+20,Y+19-o,X+30,Y+24-o);ctx.stroke();ctx.lineWidth=1;break;}
  case 'B':drawTile(th.ground==='`'?'`':',',x,y,X,Y,th);circ(X+10,Y+18,9,'#2a6a2a');circ(X+22,Y+17,9,'#2f7530');circ(X+16,Y+10,9,'#368a36');circ(X+13,Y+9,2,'#5ab05a');break;
  case '_':base();ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='rgba(120,120,255,.08)';ctx.fillRect(X+2,Y+2,TS-4,TS-4);break;
  case 'C':f(th.counter||'#6a4524');ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(X,Y,TS,6);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(X,Y+TS-5,TS,5);break;
  case 'X':base();rr(X+2,Y+2,28,28,'#8a6236',2);ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;ctx.strokeRect(X+3,Y+3,26,26);ctx.beginPath();ctx.moveTo(X+3,Y+3);ctx.lineTo(X+29,Y+29);ctx.moveTo(X+29,Y+3);ctx.lineTo(X+3,Y+29);ctx.stroke();ctx.lineWidth=1;break;
  case '+':base();rr(X+2,Y+2,28,28,th.door||'#7a4a22',3);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(X+15,Y+3,2,26);circ(X+24,Y+17,2,'#fd6');break;
  case '*':f('#02030a');if(h%3===0){const tw=(Math.sin(G.time*2+h)+1)/2;ctx.fillStyle=`rgba(255,255,255,${.3+tw*.7})`;ctx.fillRect(X+(h%28),Y+((h>>6)%28),2,2);}
    if(h%11===0){ctx.fillStyle='rgba(160,180,255,.7)';ctx.fillRect(X+((h>>4)%28),Y+((h>>9)%28),1,1);}break;
  case 'g':drawTile('*',x,y,X,Y,th);ctx.strokeStyle='rgba(130,220,255,.6)';ctx.lineWidth=2;ctx.strokeRect(X+1,Y+1,TS-2,TS-2);ctx.lineWidth=1;ctx.fillStyle='rgba(130,220,255,.08)';ctx.fillRect(X,Y,TS,TS);break;
  case 'm':base();rr(X+2,Y+4,28,24,'#4a5466',3);rr(X+5,Y+7,22,10,'#0a2a3a',2);
    for(let i=0;i<3;i++){const on=Math.floor(G.time*3+h+i)%3===0;circ(X+8+i*8,Y+23,2.5,on?['#f44','#4f4','#ff4'][i]:'#222');}
    ctx.fillStyle='#5cf';ctx.fillRect(X+7,Y+9+(Math.floor(G.time*4+h)%3)*2,12,1);break;
  case 'M':f('#5a4025');if(h%2)circ(X+(h%24)+4,Y+((h>>4)%24)+4,4,'#4a3018');circ(X+((h>>8)%24)+4,Y+((h>>12)%24)+4,3,'#6a5035');break;
  case '`':f((x*7+y*3)%5===0?'#c49a5e':'#c9a46a');if(h%4===0){ctx.fillStyle='#a8844e';ctx.fillRect(X+(h%26)+2,Y+((h>>5)%26)+2,2,2);}break;
  case 'R':drawTile(th.ground==='`'?'`':th.ground===','?',':'.',x,y,X,Y,th);ell(X+16,Y+19,14,11,'#6a6460');ell(X+13,Y+15,9,7,'#8a847e');ell(X+11,Y+13,3,2,'#a8a29c');break;
  case 'n':f('#7a5a36');ctx.fillStyle='#5e4224';for(let i=0;i<4;i++)ctx.fillRect(X,Y+i*8+7,TS,1);ctx.fillStyle='#4a3218';ctx.fillRect(X+(h%20)+4,Y+((h>>4)%3)*8+2,2,2);break;
  case 'r':f(th.rug||'#7a3040');ctx.strokeStyle='rgba(255,220,120,.18)';ctx.strokeRect(X+4,Y+4,24,24);if((x+y)%2===0)circ(X+16,Y+16,3,'rgba(255,220,120,.18)');break;
  case 'b':base();rr(X+1,Y+2,30,28,'#ddd',3);rr(X+3,Y+12,26,17,'#3a5aa0',3);rr(X+5,Y+4,22,7,'#fff',3);break;
  case 'k':f((x+y)%2?'#e8e8e0':'#b8bcc0');break;
  case 'p':base();rr(X+3,Y+1,26,30,'#9aa0a8',8);rr(X+6,Y+4,20,24,'rgba(150,220,255,.55)',6);circ(X+16,Y+10,4,'#e8c09a');rr(X+11,Y+14,10,12,'#5a6a7a',3);
    if(Math.floor(G.time+h)%4===0)txt('z',X+24,Y+8-((G.time*10)%6),'#fff',10);break;
  case 'P':base();rr(X+4,Y+2,24,28,th.wall,3);ctx.fillStyle=th.wallHi;ctx.fillRect(X+6,Y+2,4,28);break;
  case 'o':base();ell(X+16,Y+18,13,9,'rgba(0,0,0,.25)');circ(X+16,Y+15,13,th.table||'#8a5a30');circ(X+16,Y+15,10,th.cloth||'#f4f0e8');if(h%3===0)circ(X+12,Y+13,3,'#c33');if(h%4===1)rr(X+17,Y+11,3,8,'#7cf',1);break;
  case 's':base();rr(X+1,Y+8,30,20,'#a33',5);rr(X+1,Y+4,30,9,'#c44',4);break;
  case 'Z':{const gch=th.ground||'.';drawTile(gch==='Z'?'.':gch,x,y,X,Y,th);break;}
  case 'K':base();rr(X+3,Y+1,26,30,'#3a4050',2);for(let i=0;i<5;i++){const on=Math.floor(G.time*5+h+i*3)%4!==0;ctx.fillStyle=on?(i%2?'#4f8':'#fa4'):'#123';ctx.fillRect(X+7+(i%3)*7,Y+5+Math.floor(i/3)*7,4,3);}
    rr(X+7,Y+18,18,9,'#111',1);ctx.fillStyle='#4f8';ctx.fillRect(X+9,Y+20+(Math.floor(G.time*6+h)%3)*2,10,1);break;
  default:f('#f0f');
  }
}

/* ---------------- sprites ---------------- */
function person(x,y,o){
  const bob=o.moving?Math.sin(G.time*16)*1.4:0;
  ell(x,y+13,10,4,'rgba(0,0,0,.3)');
  if(o.lying){ell(x,y+4,15,7,o.body);circ(x-13,y+2,6,o.skin||'#f1c9a0');if(o.hair){ctx.fillStyle=o.hair;ctx.beginPath();ctx.arc(x-14,y+2,6.5,Math.PI/2,Math.PI*1.5);ctx.fill();}return;}
  const lw=o.moving?Math.sin(G.time*16)*2:0;
  rr(x-6,y+3,5,10+lw,o.legs||'#334',2);rr(x+1,y+3,5,10-lw,o.legs||'#334',2);
  rr(x-8,y-6+bob,16,14,o.body,5);
  if(o.belt){ctx.fillStyle=o.belt;ctx.fillRect(x-8,y+3+bob,16,2);}
  const hy=y-11+bob,d=o.dir||[0,1];
  const head=(hx,hc)=>{circ(hx,hy,7,o.skin||'#f1c9a0');
    if(o.hair){ctx.fillStyle=hc||o.hair;ctx.beginPath();ctx.arc(hx,hy-2,7.5,Math.PI*1.05,Math.PI*1.95);ctx.fill();if(d[1]<0&&!d[0])circ(hx,hy,7,hc||o.hair);}
    if(!(d[1]<0&&!d[0])){const ex=d[0]*3;ctx.fillStyle='#111';ctx.fillRect(hx-3+ex,hy-1,2,2);ctx.fillRect(hx+2+ex,hy-1,2,2);}
    if(o.beard){ell(hx,hy+5,6,5,o.beard);}
    if(o.hat){rr(hx-8,hy-10,16,5,o.hat,2);rr(hx-5,hy-13,10,5,o.hat,3);}
    if(o.shades){ctx.fillStyle='#111';ctx.fillRect(hx-5,hy-2,10,3);}};
  if(o.twoHeads){head(x-5,o.hair);head(x+6,'#e8b030');}else head(x);
  if(o.towel){ctx.fillStyle='#e8d23a';ctx.beginPath();ctx.arc(x,hy,9,Math.PI,0);ctx.lineTo(x+9,hy+6);ctx.lineTo(x-9,hy+6);ctx.fill();ctx.fillStyle='#3a7ad8';ctx.fillRect(x-9,hy-2,18,3);ctx.fillRect(x-9,hy+3,18,2);}
}
const CHARS={

const SPK={Narrator:'#bbb',Arthur:'#d8b48a',Ford:'#ff9a5a','Mr Prosser':'#f0c020',Zaphod:'#ffb84a',Trillian:'#f4f4f4',Marvin:'#b8c8d8',
 Eddie:'#7ff',Guide:'#7fff7f',Barman:'#ddd',Jeltz:'#9ad860',Vogon:'#9ad860',Slartibartfast:'#ccd','Nutri-Matic':'#fd8',Benjy:'#f8c8d8',Frankie:'#f8c8d8',
 Max:'#f8f',Cow:'#f4e8d8',Captain:'#9cf','Number One':'#9cf',System:'#ffcf4a','Deep Thought':'#7cf'};
let DQ=[],collect=null,cur=null,typed=0,sel=0,visChoices=[];
function pushD(d){if(collect){collect.push(d);return;}DQ.push(d);if(G.mode!=='dialog'&&G.mode!=='script')nextD();}
function say(who,text,then){pushD({who,text,then});}
function ask(who,text,choices){pushD({who,text,choices});}
function act(fn){pushD({fn});}
function wait(fn){pushD({wait:fn});}
function pause(sec){wait(done=>setTimeout(done,sec*1000));}
function runCollect(fn){const prev=collect;collect=[];try{fn();}catch(e){console.error(e);}const c=collect;collect=prev;if(prev)prev.push(...c);else DQ.unshift(...c);}
function hideBox(){$('dialog').style.display='none';}
function nextD(){
  cur=DQ.shift();
  if(!cur){hideBox();if(G.mode==='dialog'||G.mode==='script')G.mode='play';return;}
  if(cur.fn){if(G.mode!=='mini'&&G.mode!=='card'&&G.mode!=='end')G.mode='dialog';hideBox();const m0=G.mode;runCollect(cur.fn);
    if(G.mode==='dialog'||G.mode==='play'){G.mode='dialog';nextD();}return;}
  if(cur.wait){G.mode='script';hideBox();let fired=false;cur.wait(()=>{if(fired)return;fired=true;nextD();});return;}
  G.mode='dialog';typed=0;sel=0;
  visChoices=cur.choices?cur.choices.filter(c=>!c.if||c.if()):null;
  const d=$('dialog');d.style.display='block';
  $('dwho').textContent=cur.who||'';$('dwho').style.color=SPK[cur.who]||'#ffcf4a';
  $('dtext').textContent='';$('dchoices').innerHTML='';$('dmore').style.display='none';
  d.style.borderColor=cur.who==='Guide'?'#7fff7f':cur.who==='System'?'#ffcf4a':'#7fd4ff';
  sfx('blip');
}
function showChoices(){
  const box=$('dchoices');box.innerHTML='';
  if(!visChoices){$('dmore').style.display='block';return;}
  visChoices.forEach((c,i)=>{const el=document.createElement('div');el.className='ch'+(i===sel?' sel':'');el.textContent=(i+1)+'. '+c.t;
    el.onclick=ev=>{ev.stopPropagation();choose(i);};box.appendChild(el);});
}
function advance(){
  if(!cur)return;
  if(typed<cur.text.length){typed=cur.text.length;$('dtext').textContent=cur.text;showChoices();return;}
  if(visChoices)return;
  const then=cur.then;if(then)runCollect(then);nextD();
}
function choose(i){if(!visChoices)return;const c=visChoices[i];if(!c)return;sfx('blip');if(c.f)runCollect(c.f);nextD();}
$('dialog').addEventListener('click',()=>{if(G.mode==='dialog')advance();});

/* ---------------- map handling ---------------- */
function buildGrid(m){const g=grid(m.w,m.h,m.fill||'#');m.build(g);return g;}
function refreshTiles(){const m=G.map;m.g=buildGrid(m);}
function vis(e){return !e.cond||e.cond();}
function entAt(x,y,inter){const m=G.map;return m.ents.find(e=>{if(!vis(e))return false;const w=e.aw||1,h=e.ah||1;
  if(x<e.x||x>=e.x+w||y<e.y||y>=e.y+h)return false;return !inter||e.talk||e.kind==='item'||e.kind==='guide';});}
function solidEnt(x,y){const m=G.map;return m.ents.some(e=>{if(!vis(e))return false;const s=e.solid!==undefined?e.solid:(e.kind==='npc'||e.kind==='obj');if(!s)return false;
  const w=e.aw||1,h=e.ah||1;return x>=e.x&&x<e.x+w&&y>=e.y&&y<e.y+h;});}
function passable(x,y){const c=tileAt(x,y);if(TD[c]&&TD[c].s)return false;return !solidEnt(x,y);}
function ent(id){return G.map.ents.find(e=>e.id===id);}
function loadMap(id,x,y){
  const def=MAPS[id];const m=def();m.id=id;G.mapId=id;G.map=m;m.ents=m.ents||[];m.enemies=m.enemies||[];m.triggers=m.triggers||[];
  m.g=buildGrid(m);
  m.ents.forEach(e=>{e.t=1;e.ox=e.x;e.oy=e.y;e.dir=e.dir||[0,1];if(e.kind==='item'||e.kind==='guide'){const key=e.key||(e.kind==='guide'?'g_'+e.gid:e.id);e.key=key;const c0=e.cond;e.cond=()=>(!c0||c0())&&!F['got_'+key];}});
  m.enemies.forEach(e=>{e.sx=e.x;e.sy=e.y;e.range=e.range||5;e.fov=e.fov||70;e.speed=e.speed||1.5;e.ang0=e.ang!==undefined?e.ang:0;});
  resetEnemies();
  const P=G.p;P.x=P.ox=x!==undefined?x:m.start[0];P.y=P.oy=y!==undefined?y:m.start[1];P.t=1;P.lying=false;
  G.cp=[P.x,P.y];G.trail=[];G.timer=null;G.towelHead=false;G.danger=0;G.lock=false;
  if(m.chapter)G.chapter=m.chapter;updHud();
  save();
  if(m.onEnter)m.onEnter();
}
function resetEnemies(){G.map.enemies.forEach(e=>{e.fx=e.sx;e.fy=e.sy;e.pi=e.path&&e.path.length>1?1:0;e.sus=0;e.wait=0;e.ang=e.ang0;e.alert=0;});}
function setCP(x,y){if(G.cp[0]!==x||G.cp[1]!==y){G.cp=[x,y];notify('Checkpoint','#7fd4ff');}}
function expand(sx,sy,pts){const out=[];let x=sx,y=sy;for(const [tx,ty] of pts){while(x!==tx){x+=Math.sign(tx-x);out.push([x,y]);}while(y!==ty){y+=Math.sign(ty-y);out.push([x,y]);}}return out;}
function walk(e,pts,doneCb){e.route=expand(e.x,e.y,pts);e.onArrive=doneCb||null;if(!e.route.length){e.route=null;doneCb&&doneCb();}}
function teleport(x,y){const P=G.p;P.x=P.ox=x;P.y=P.oy=y;P.t=1;G.trail=[];}

/* ---------------- input ---------------- */
const keys={};
const DIRK={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
let keyOrder=[];
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(DIRK[k]&&!keys[k])keyOrder.push(k);keys[k]=true;if(!e.repeat)onKey(k);});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k);if(MINI&&MINI.keyup)MINI.keyup(k);});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;keyOrder=[];});
function inputDir(){for(let i=keyOrder.length-1;i>=0;i--)if(keys[keyOrder[i]])return DIRK[keyOrder[i]];return null;}
function onKey(k){
  if(G.mode==='title'){titleKey(k);return;}
  if(G.mode==='card'){if(G.cardT>.8){const t=G.card.then;G.card=null;G.mode='play';t&&t();}return;}
  if(G.mode==='end'){if((k==='enter'||k===' ')&&G.endT>4){G.mode='title';}return;}
  if(G.mode==='mini'){MINI&&MINI.key&&MINI.key(k);return;}
  if(G.mode==='dialog'){
    if(visChoices&&cur&&typed>=cur.text.length){const n=visChoices.length;
      if(k>='1'&&k<='9')choose(+k-1);
      else if(k==='arrowup'||k==='w'){sel=(sel+n-1)%n;showChoices();}
      else if(k==='arrowdown'||k==='s'){sel=(sel+1)%n;showChoices();}
      else if(k==='enter'||k===' '||k==='e')choose(sel);}
    else if(k==='e'||k===' '||k==='enter')advance();
    return;}
  if(G.mode==='panel'){if(k==='escape'||k===G.panel)closePanel();else if('qigh'.includes(k)&&k.length===1)openPanel(k);return;}
  if(G.mode!=='play')return;
  if(k==='e'||k===' '||k==='enter')interact();
  else if(k==='q'||k==='i'||k==='g'||k==='h')openPanel(k);
  else if(k==='t')toggleTowel();
  else if(k==='escape')openPanel('h');
}
// touch
if('ontouchstart' in window||navigator.maxTouchPoints>0){$('touch').style.display='flex';}
document.querySelectorAll('#touch [data-k]').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(!keys[k])keyOrder.push(k);keys[k]=true;if(G.mode!=='play')onKey(k);});
  const up=()=>{keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k);};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);});
document.querySelectorAll('#touch [data-p]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const k=b.dataset.p;keys[k]=true;onKey(k);setTimeout(()=>keys[k]=false,150);}));
cv.addEventListener('pointerdown',()=>{if(G.mode==='title')titleKey('enter');else if(G.mode==='card'||G.mode==='end')onKey('enter');else if(G.mode==='mini')MINI&&MINI.key&&MINI.key('click');});

/* ---------------- interaction ---------------- */
function interact(){
  const P=G.p;if(P.t<1||G.lock)return;
  const fx=P.x+P.dir[0],fy=P.y+P.dir[1];
  let e=entAt(fx,fy,true);
  if(!e&&'Co'.includes(tileAt(fx,fy)))e=entAt(fx+P.dir[0],fy+P.dir[1],true);
  if(!e)e=entAt(P.x,P.y,true);
  if(e){if(e.kind==='item'||e.kind==='guide'){pickup(e);return;}
    if(e.kind==='npc'&&e.face!==false&&!e.route)e.dir=[-P.dir[0],-P.dir[1]];
    e.talk(e);return;}
  const tr=G.map.triggers.find(t=>t.use&&t.x===fx&&t.y===fy&&(!t.cond||t.cond()));if(tr){tr.use();return;}
  const fl=FLAVOR[tileAt(fx,fy)];if(fl)notify(fl,'#bbb');
}
function pickup(e){
  F['got_'+e.key]=1;
  if(e.kind==='guide')unlock(e.gid);else{give(e.id);if(e.flavor)notify(e.flavor,'#ddd');}
  if(e.onPick)e.onPick();
}
function arrive(){
  const P=G.p,m=G.map;
  const here=m.ents.filter(e=>vis(e)&&e.x===P.x&&e.y===P.y&&(e.kind==='item'||e.kind==='guide'));here.forEach(pickup);
  const c=tileAt(P.x,P.y);
  if(c==='+'&&m.happyDoors&&Math.random()<.35)notify(['Door: "Glad to be of service!"','Door: *sigh of deep satisfaction*','Door: "Ahhh. Thank you for using me."'][Math.random()*3|0],'#f0d050');
  else if(c==='+')sfx('door');
  if(TD[c]&&TD[c].noise){sfx('creak');notify('*CREEEAK*','#c96');m.enemies.forEach(e=>{if(e.cond&&!e.cond())return;const d=Math.hypot(e.fx-P.x,e.fy-P.y);if(d<7){e.sus=Math.min(.92,e.sus+.6);e.ang=Math.atan2(P.y-e.fy,P.x-e.fx);}});}
  for(const t of m.triggers){if(t.use)continue;const w=t.w||1,h=t.h||1;if(P.x>=t.x&&P.x<t.x+w&&P.y>=t.y&&P.y<t.y+h&&(!t.cond||t.cond())){
    if(t.cp)setCP(t.cp[0],t.cp[1]);if(t.go){loadMap(t.go,t.to[0],t.to[1]);return;}if(t.fn){t.fn();if(G.mode!=='play')return;}}}
}

/* ---------------- stealth ---------------- */
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function turn(a,target,rate){const d=angDiff(target,a);return a+clamp(d,-rate,rate);}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/.15);for(let i=1;i<n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;const c=tileAt(Math.floor(x),Math.floor(y));if(TD[c]&&TD[c].o)return false;}return true;}
function playerPos(){const P=G.p,t=ease(P.t);return [P.ox+(P.x-P.ox)*t,P.oy+(P.y-P.oy)*t];}
function updEnemies(dt){
  const m=G.map,[prx,pry]=playerPos(),pcx=prx+.5,pcy=pry+.5;let maxS=0;
  for(const e of m.enemies){
    if(e.cond&&!e.cond())continue;
    const ex=e.fx+.5,ey=e.fy+.5,dx=pcx-ex,dy=pcy-ey,d=Math.hypot(dx,dy);
    const blind=e.blind&&G.towelHead;
    let see=false;
    if(d<.85&&!blind)e.sus=1;
    else if(d<=e.range&&!blind){const a=Math.atan2(dy,dx);
      if(Math.abs(angDiff(a,e.ang))<=e.fov/2*Math.PI/180&&los(ex,ey,pcx,pcy)){const hid=TD[tileAt(G.p.x,G.p.y)].hide&&d>1.6;if(!hid)see=true;}}
    const mult=(e.passable&&has('pass'))?.45:1;
    if(see)e.sus=Math.min(1,e.sus+dt*mult*(.8+1.8*(1-d/e.range)));
    else e.sus=Math.max(0,e.sus-dt*.3);
    if(e.sus>.22&&!blind){e.ang=turn(e.ang,Math.atan2(dy,dx),dt*5);}
    else if(e.path&&e.path.length>1){
      if(e.wait>0){e.wait-=dt;e.ang+=Math.sin(G.time*2.5)*dt*1.2;}
      else{const [tx,ty]=e.path[e.pi],vx=tx-e.fx,vy=ty-e.fy,dist=Math.hypot(vx,vy);
        if(dist<.04){e.fx=tx;e.fy=ty;e.pi=(e.pi+1)%e.path.length;e.wait=e.pause!==undefined?e.pause:.7;}
        else{const st=Math.min(dist,e.speed*dt);e.fx+=vx/dist*st;e.fy+=vy/dist*st;e.ang=turn(e.ang,Math.atan2(vy,vx),dt*7);}}}
    else if(e.sweep){e.ang=e.ang0+Math.sin(G.time*(e.sweepSpd||.9))*e.sweep;}
    if(e.sus>=1){caught(e);return;}
    maxS=Math.max(maxS,e.sus);
  }
  G.danger=maxS;
}
function caught(e){
  if(G.mode!=='play')return;sfx('caught');G.caughtN++;G.mode='caught';G.caughtT=2.6;
  G.caughtMsg=typeof e.catchLine==='function'?e.catchLine():(e.catchLine||'You have been spotted!');G.shake=.4;
  G.caughtFn=e.onCatch||G.map.onCaught||null;
}
function endCaught(){resetEnemies();G.towelHead=false;updHud();
  if(G.caughtFn){const f=G.caughtFn;G.caughtFn=null;G.mode='play';f();return;}
  teleport(G.cp[0],G.cp[1]);G.mode='play';}

/* ---------------- update ---------------- */
function update(dt){
  G.time+=dt;if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.5);if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  if(G.mode==='title'||G.mode==='end'){G.endT+=dt;return;}
  if(G.mode==='card'){G.cardT+=dt;return;}
  if(G.mode==='mini'){MINI&&MINI.update(dt);return;}
  if(G.mode==='caught'){G.caughtT-=dt;if(G.caughtT<=0)endCaught();return;}
  if(!G.map)return;
  if(G.mode==='dialog'&&cur&&cur.text&&typed<cur.text.length){typed=Math.min(cur.text.length,typed+dt*75);$('dtext').textContent=cur.text.slice(0,Math.floor(typed));if(typed>=cur.text.length)showChoices();}
  updEnts(dt);
  G.parts=G.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.life-=dt;return p.life>0;});
  const P=G.p;
  if(P.t<1){P.t=Math.min(1,P.t+dt/(G.towelHead?.22:P.spd));if(P.t>=1&&(G.mode==='play'||G.mode==='script')){arrive();}}
  if(G.mode!=='play')return;
  if(G.peng>0){G.peng-=dt;if(G.peng<=0)notify('You are no longer a penguin. Probably for the best.');}
  if(G.timer){G.timer.t-=dt;if(G.timer.t<=0){const f=G.timer.fail;G.timer=null;f&&f();return;}}
  if(G.map.update)G.map.update(dt);
  if(G.mode!=='play')return;
  updEnemies(dt);if(G.mode!=='play')return;
  if(P.t>=1&&!G.lock&&!P.lying){const d=inputDir();if(d){P.dir=d;const nx=P.x+d[0],ny=P.y+d[1];
    if(passable(nx,ny)){G.trail.unshift([P.x,P.y]);if(G.trail.length>8)G.trail.length=8;P.ox=P.x;P.oy=P.y;P.x=nx;P.y=ny;P.t=0;}}}
}
function updEnts(dt){
  for(const e of G.map.ents){if(!vis(e))continue;
    if(e.t<1){e.t=Math.min(1,e.t+dt/(e.spd||.2));continue;}
    if(e.route&&e.route.length){const [nx,ny]=e.route.shift();e.dir=[Math.sign(nx-e.x),Math.sign(ny-e.y)];e.ox=e.x;e.oy=e.y;e.x=nx;e.y=ny;e.t=0;continue;}
    if(e.route&&!e.route.length){e.route=null;const cb=e.onArrive;e.onArrive=null;cb&&cb();continue;}
    if(e.wander&&G.mode==='play'){if(e.hx===undefined){e.hx=e.x;e.hy=e.y;}e.wt=(e.wt===undefined?Math.random()*3:e.wt)-dt;
      if(e.wt<=0){e.wt=1.5+Math.random()*3;const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0],nx=e.x+d[0],ny=e.y+d[1];
        if(Math.abs(nx-e.hx)<=e.wander&&Math.abs(ny-e.hy)<=e.wander&&passable(nx,ny)&&!(nx===G.p.x&&ny===G.p.y)&&!(nx===G.p.ox&&ny===G.p.oy)){e.ox=e.x;e.oy=e.y;e.x=nx;e.y=ny;e.t=0;e.dir=d;}}}
  }
}
function burst(x,y,n,cols,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(spd||80)*(.4+Math.random());G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,g:120,life:1+Math.random(),c:cols[i%cols.length]});}}

function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(G.mode==='title'){drawTitle();return;}
  if(G.mode==='card'){drawCard();return;}
  if(G.mode==='end'){drawEnd();return;}
  if(!G.map){ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);return;}
  if(G.shake>0)ctx.setTransform(1,0,0,1,(Math.random()-.5)*12*G.shake,(Math.random()-.5)*12*G.shake);
  drawWorld();
  ctx.setTransform(1,0,0,1,0,0);
  if(G.mode==='mini'&&MINI)MINI.draw();
  if(G.mode==='caught'){ctx.fillStyle='rgba(120,0,0,.55)';ctx.fillRect(0,0,cv.width,cv.height);txt('CAUGHT!',cv.width/2,cv.height/2-40,'#fff',48,'center','Impact,sans-serif');
    wrapText(G.caughtMsg,cv.width/2,cv.height/2+10,700,22,'#fdd',17,'center');}
  if(G.flash>0){ctx.globalAlpha=G.flash;ctx.fillStyle=G.flashC;ctx.fillRect(0,0,cv.width,cv.height);ctx.globalAlpha=1;}
}
function drawWorld(){
  const m=G.map,P=G.p,[prx,pry]=playerPos();
  let cx=prx*TS+16-cv.width/2,cy=pry*TS+16-cv.height/2;const mw=m.w*TS,mh=m.h*TS;
  cx=mw<=cv.width?(mw-cv.width)/2:clamp(cx,0,mw-cv.width);cy=mh<=cv.height?(mh-cv.height)/2:clamp(cy,0,mh-cv.height);
  cx=Math.round(cx);cy=Math.round(cy);G.cam=[cx,cy];
  ctx.fillStyle=m.theme.bg||'#000';ctx.fillRect(0,0,cv.width,cv.height);
  const x0=Math.max(0,Math.floor(cx/TS)),y0=Math.max(0,Math.floor(cy/TS)),x1=Math.min(m.w-1,x0+VW+1),y1=Math.min(m.h-1,y0+VH+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)drawTile(m.g[y][x],x,y,x*TS-cx,y*TS-cy,m.theme);
  if(m.decor)m.decor(cx,cy);
  // vision cones
  for(const e of m.enemies){if(e.cond&&!e.cond())continue;drawCone(e,cx,cy);}
  // gather drawables
  const list=[];
  for(const e of m.ents){if(!vis(e)||e.spr==='none')continue;const t=ease(e.t);const ex=e.ox+(e.x-e.ox)*t,ey=e.oy+(e.y-e.oy)*t;list.push({y:ey+(e.zb||0),f:()=>{
      const X=ex*TS-cx+16,Y=ey*TS-cy+16;const spr=e.kind==='item'?'item':e.kind==='guide'?'guide':e.spr;
      drawSprite(spr,X,Y,{dir:e.dir,moving:e.t<1,ent:e,lying:e.lying&&e.lying(),r:e.r,c1:e.c1,c2:e.c2,land:e.land,scaffold:e.scaffold,dirv:e.dirv});
      if(e.name&&e.kind==='npc'){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<3.5){txt(e.name,X,Y-26,'rgba(0,0,0,.7)',11,'center');txt(e.name,X-1,Y-27,'#fff',11,'center');}}
      if(e.alertMark&&e.alertMark()){const b=Math.sin(G.time*6)*2;txt('!',X,Y-30+b,'#ffcf4a',18,'center','Impact,sans-serif');}
    }});}
  for(const e of m.enemies){if(e.cond&&!e.cond())continue;list.push({y:e.fy,f:()=>{const X=e.fx*TS-cx+16,Y=e.fy*TS-cy+16;
      drawSprite(e.spr,X,Y,{dir:[Math.round(Math.cos(e.ang)),Math.round(Math.sin(e.ang))],moving:e.wait<=0&&e.sus<.22});
      if(e.sus>.05){txt(e.sus>.65?'!':'?',X,Y-30,e.sus>.65?'#f33':'#ffcf4a',20,'center','Impact,sans-serif');
        rr(X-14,Y-24,28,4,'rgba(0,0,0,.6)',1);rr(X-14,Y-24,28*e.sus,4,e.sus>.65?'#f33':'#ffcf4a',1);}
      if(e.label){txt(e.label,X,Y+26,'rgba(255,255,255,.6)',9,'center');}}});}
  G.followers.forEach((fid,i)=>{const a=G.trail[i]||[P.x-P.dir[0],P.y-P.dir[1]],b=G.trail[i+1]||a;const t=ease(P.t);
    const fx=b[0]+(a[0]-b[0])*t,fy=b[1]+(a[1]-b[1])*t;list.push({y:fy,f:()=>drawSprite(fid,fx*TS-cx+16,fy*TS-cy+16,{dir:[Math.sign(a[0]-b[0]),Math.sign(a[1]-b[1])||1],moving:P.t<1})});});
  list.push({y:pry,f:()=>{const X=prx*TS-cx+16,Y=pry*TS-cy+16;const hid=TD[tileAt(P.x,P.y)].hide;if(hid)ctx.globalAlpha=.55;
    drawSprite(G.peng>0?'penguin':'arthur',X,Y,{dir:P.dir,moving:P.t<1,lying:P.lying,towel:G.towelHead,shades:G.shades});ctx.globalAlpha=1;}});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // particles
  for(const p of G.parts){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x-cx-2,p.y-cy-2,4,4);}ctx.globalAlpha=1;
  if(m.over)m.over(cx,cy);
  // darkness
  if(m.dark){const X=prx*TS-cx+16,Y=pry*TS-cy+16,r=m.darkR||130;const gr=ctx.createRadialGradient(X,Y,r*.25,X,Y,r);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+(m.darkA||.96)+')');
    ctx.fillStyle=gr;ctx.fillRect(0,0,cv.width,cv.height);for(const e of m.enemies){if(e.cond&&!e.cond())continue;drawCone(e,cx,cy);}}
  if(m.tint){ctx.fillStyle=m.tint;ctx.fillRect(0,0,cv.width,cv.height);}
  // interaction prompt
  if(G.mode==='play'&&P.t>=1){const fx=P.x+P.dir[0],fy=P.y+P.dir[1];let e=entAt(fx,fy,true);if(!e&&'Co'.includes(tileAt(fx,fy)))e=entAt(fx+P.dir[0],fy+P.dir[1],true);
    if(e){const X=(e.x+(e.aw||1)/2)*TS-cx,Y=e.y*TS-cy-12;const label=e.kind==='item'?'Take':e.kind==='guide'?'Read':(e.verb||(e.kind==='npc'?'Talk':'Use'));
      const s='[E] '+label+(e.name&&e.kind!=='npc'?' '+e.name:'');ctx.font='12px monospace';const w=ctx.measureText(s).width+10;rr(X-w/2,Y-14,w,17,'rgba(0,0,0,.75)',4);txt(s,X,Y-2,'#ffcf4a',12,'center');}}
  // stealth hud
  if(m.enemies.length){const s=G.danger;rr(10,10,170,22,'rgba(0,0,0,.6)',5);txt(s>.65?'ALERT':s>.05?'SUSPICIOUS':'HIDDEN',18,26,s>.65?'#f55':s>.05?'#ffcf4a':'#8f8',12);
    rr(100,16,72,10,'#222',3);rr(100,16,72*s,10,s>.65?'#f33':'#ffcf4a',3);
    if(TD[tileAt(P.x,P.y)].hide){txt('(in cover)',190,26,'#9cf',12);}}
  if(G.timer){const t=Math.ceil(G.timer.t);rr(cv.width/2-150,8,300,40,'rgba(80,0,0,.8)',6);txt(G.timer.label+': '+t,cv.width/2,35,t<=10&&Math.sin(G.time*10)>0?'#fff':'#f88',20,'center');}
  if(G.shades&&G.danger>.3){const a=Math.min(1,(G.danger-.3)*3);ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,cv.width,cv.height);
    if(a>.6)wrapText('Your Peril-Sensitive Sunglasses have gone completely black. You can no longer see the danger, and so feel quite relaxed about it.',cv.width/2,cv.height/2,600,22,'#ffcf4a',16,'center');}
}
function drawCone(e,cx,cy){
  const ex=e.fx+.5,ey=e.fy+.5,half=e.fov/2*Math.PI/180,n=22;ctx.beginPath();ctx.moveTo(ex*TS-cx,ey*TS-cy);
  for(let i=0;i<=n;i++){const a=e.ang-half+half*2*i/n;let r=0;const step=.2;while(r<e.range){r+=step;const x=ex+Math.cos(a)*r,y=ey+Math.sin(a)*r;const c=tileAt(Math.floor(x),Math.floor(y));if(TD[c]&&TD[c].o)break;}
    ctx.lineTo((ex+Math.cos(a)*r)*TS-cx,(ey+Math.sin(a)*r)*TS-cy);}
  ctx.closePath();const s=e.sus;ctx.fillStyle=e.blind&&G.towelHead?'rgba(150,150,255,.08)':s>.65?'rgba(255,50,50,.3)':s>.05?'rgba(255,170,40,.25)':'rgba(255,240,120,.16)';ctx.fill();
}
let STARS=Array.from({length:180},()=>({x:Math.random()*960,y:Math.random()*576,z:Math.random()*2+.3}));
function starfield(dt){ctx.fillStyle='#02030a';ctx.fillRect(0,0,cv.width,cv.height);for(const s of STARS){s.x-=s.z*0.6;if(s.x<0){s.x=960;s.y=Math.random()*576;}ctx.fillStyle=`rgba(255,255,255,${s.z/2.3})`;ctx.fillRect(s.x,s.y,s.z,s.z);}}
function drawCard(){starfield();const a=Math.min(1,G.cardT*1.5);ctx.globalAlpha=a;

  wrapText(G.card.sub||'',cv.width/2,cv.height/2+16,760,22,'#cde',16,'center');
  if(G.cardT>.8)txt('— press any key —',cv.width/2,cv.height-40,`rgba(255,255,255,${.5+.5*Math.sin(G.time*4)})`,13,'center');ctx.globalAlpha=1;}

Object.assign(GUIDE,{
 earth:['Earth','Mostly harmless. (The previous edition said simply "Harmless". Ford spent fifteen years on the revision.)'],
 thursday:['Thursdays','Statistically the least popular day of the week among people whose planets are later demolished on one.'],
 dontpanic:["Don't Panic","Printed in large, friendly letters on the cover of the Guide. Widely considered the most useful advice in the galaxy, and the least often followed."],
 towel:['Towels','About the most useful thing a hitchhiker can have. Wrap it round you for warmth, lie on it, sail on it, wave it in emergencies. Above all, a hitchhiker who still has their towel is obviously someone who has things under control.'],
 thumb:['Electronic Thumb','A Sub-Etha signalling device for hitching rides on passing spaceships. Works best on ships that are already busy doing something unpleasant.'],
 dolphins:['Dolphins','The second most intelligent creatures on Earth. They tried for years to warn humanity that the planet was about to be destroyed. Humanity assumed they were doing tricks.'],
 leopard:['Local planning','On many worlds, important documents are kept "on display" in places chosen for their lack of light, stairs and visitors. The leopard is usually notional. Usually.'],
 bureaucracy:['Bureaucracy','The galaxy runs on forms. The forms run on other forms. At the very bottom is one form nobody can find, which is why nothing works.'],
 vogons:['Vogons','One of the most unpleasant races in the galaxy. Not actually evil, just bad-tempered, bureaucratic, officious and callous. A Vogon would not rescue its own grandmother from a burning building without a signed order, in triplicate, lost, refiled and found again.'],
 babel:['Babel fish','Small, yellow and leech-like. Pop one in your ear and you can instantly understand anything said to you in any language. By removing every barrier to communication, it has caused more wars than anything else in history.'],
 hitchhiking:['Hitchhiking','You can see the galaxy for less than thirty Altairian dollars a day. Recommended for the brave, the broke, and anyone with a really good towel.'],
 vogonpoetry:['Vogon poetry','The third worst poetry in the universe. During recitals, audience members have been known to chew off their own limbs to get out. Their own if possible.'],
 improb:['Infinite Improbability Drive','A wonderful new way of crossing vast distances in no time at all, without all that tedious mucking about in hyperspace. Side effects include penguins, sofas and sudden whales.'],
 zaphod:['Zaphod Beeblebrox','Two heads, three arms, President of the Galaxy and thief of the Heart of Gold. The President has no real power. His job is to draw attention away from where the power is, and Zaphod is superbly good at it.'],
 marvin:['Marvin','A Paranoid Android with a Genuine People Personality and a brain the size of a planet. A Sirius Cybernetics prototype. Every attempt to cheer him up has failed, which he finds entirely predictable.'],
 nutrimatic:['Nutri-Matic Drinks Synthesiser','Produces a liquid that is almost, but not quite, entirely unlike whatever you ordered. Share and Enjoy!'],

 shades:['Peril-Sensitive Sunglasses','Designed to help you take a relaxed attitude to danger. At the first hint of trouble they turn completely black, so you cannot see anything that might alarm you.'],

 bugblatter:['Ravenous Bugblatter Beast','So mind-bogglingly stupid that it assumes that if you cannot see it, it cannot see you. Wrap a towel round your head (press T) and walk right past.'],
 fjords:['Norway','Slartibartfast won an award for the fjords. He likes doing coastlines and is particularly proud of the crinkly bits.'],
 deepthought:['Deep Thought','The second greatest computer of all time. It took seven and a half million years to work out the Answer to Life, the Universe and Everything. Then everybody wanted to know what the Question was.'],

 gargle:['Pan Galactic Gargle Blaster','The best drink in existence. Recipe: 1) Ol\' Janx Spirit. 2) Santraginean sea water. 3) Arcturan Mega-gin. 4) Fallian marsh gas. 5) An Algolian Suntiger tooth. 6) An olive. Drink, but very carefully.'],

function vg(s){if(F.babel)return s;const syl=['grr','blak','vorg','frumph','hoob','zarg','glurk','plonk','ratch','oog','snerk','buhl'];
  return s.split(' ').map((w,i)=>syl[(w.length*7+i*3)%syl.length]+(w.length>5?syl[(w.length+i)%syl.length]:'')).join(' ').replace(/^./,c=>c.toUpperCase())+'!';}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function sawDozers(){
 F.sawDozers=1;done('wake');G.shake=.3;
 say('Narrator','Yellow. Large. Bulldozers. Three of them. Lined up in front of your house like enormous, polite, yellow assassins.');
 if(!F.gown)say('Arthur',"And I'm in my pyjamas. Wonderful.");
 say('Arthur','WHAT do you think you are DOING?');
 act(()=>quest('prosser','Confront Mr Prosser','The man from the council is standing by the bulldozers, looking guilty.'));
}
function talkProsser(){
 if(F.prosserDown){say('Mr Prosser','(from the mud) Your friend said this was perfectly normal. Is it normal? It feels very damp.');if(has('plans'))leopardReturn();return;}
 if(!F.sawDozers){say('Mr Prosser',"Ah! Mr Dent. Lovely morning. Don't look out of the front.");return;}
 if(F.mustLie){say('Mr Prosser','Are you going to lie down, Mr Dent, or shall we just get on with it?');if(has('plans'))leopardReturn();return;}
 done('prosser');
 ask('Mr Prosser',"Mr Dent! You must realise this bypass has got to be built, and it's going to be built!",[
  {t:'Why has it got to be built?',f(){say('Mr Prosser',"It's a bypass. You've got to build bypasses.");}},
  {t:'Nobody told me about it!',f(){say('Mr Prosser','The plans have been on display at the planning office for nine months, Mr Dent.');
    say('Arthur','On display? I eventually had to go down to the cellar to find them. With a torch.');
    say('Arthur','They were in a locked filing cabinet, in a disused lavatory, with a sign on the door about a leopard.');
    say('Mr Prosser','Still on display, Mr Dent. Go and look, if you like.');
    act(()=>quest('leopard','Beware of the Leopard','The plans are "on display" in the council annexe cellar, south-west of your house. Find them and show Mr Prosser.',true));}},
  {t:"I'm not moving.",f(){say('Mr Prosser','Then we have a problem, Mr Dent.');}},
 ]);
 say('Mr Prosser','Have you any idea how much damage this bulldozer would suffer if I just let it roll straight over you?');
 say('Arthur','How much?');
 say('Mr Prosser','None at all. It is a very sturdy bulldozer.');
 act(()=>{F.mustLie=1;quest('lie','Lie down in front of the bulldozer','Lie in the mud on the marked spot (X), right in front of the lead bulldozer.');});
}
function leopardReturn(){
 take('plans');done('leopard');unlock('leopard');improb(1);
 say('Arthur','I found the plans, Mr Prosser. In the dark. Guarded by a cat.');
 say('Mr Prosser','Ah. Well. Er. They are still perfectly valid, I am afraid. Well done for finding them, though. Nobody ever has.');
}
function lieDown(){
 F.lying=1;done('lie');const P=G.p;P.lying=true;G.lock=true;sfx('bad');
 say('Narrator',"You lie down in the cold, wet mud in front of the bulldozer. It's a sort of protest. You hope.");
 say('Mr Prosser',"You can't lie there forever, Mr Dent.");
 say('Arthur',"We'll see who rusts first.");
 pause(.5);
 act(()=>{F.fordArrived=1;const f=ent('ford');f.x=f.ox=19;f.y=f.oy=13;f.t=1;});
 wait(d=>walk(ent('ford'),[[8,13]],d));
 say('Ford','Arthur! Hello. Listen, are you busy?');
 say('Arthur',"Busy? I'm lying in front of a bulldozer. Apart from that, no.");
 say('Ford','Good. There is a pub across the road. We need to talk, and we need beer. Quite a lot of it, quite quickly.');
 ask('Arthur','(What do you say?)',[
  {t:"I can't! They'll knock my house down!",f(){say('Ford','Leave that to me.');}},
  {t:'Is this about your odd obsession with towels?',f(){say('Ford','Partly, yes. Have you got one?');say('Arthur',has('towel')?'Er, yes?':'Not on me, no.');say('Ford',has('towel')?'Good man.':'Get one. Seriously. I mean it.');}},
 ]);
 wait(d=>walk(ent('ford'),[[9,13],[9,12]],d));
 say('Ford','Mr Prosser! My friend needs to come to the pub. Would you lie in the mud in his place while we are gone?');
 say('Mr Prosser','...Why on earth would I...');
 say('Ford',"Because if he's not lying here, you can't knock the house down, and if you're lying here, you can't knock it down either. It works out exactly the same. We'll be back. Promise.");
 say('Mr Prosser','...I suppose that is... logical?');
 act(()=>{P.lying=false;teleport(6,14);});
 wait(d=>walk(ent('prosser'),[[10,14],[7,14]],d));
 act(()=>{F.prosserDown=1;});
 say('Mr Prosser','(squelch) This is all extremely irregular.');
 say('Ford',"Pub! The Horse and Groom, across the road. Six pints of bitter: you're buying. And bring your towel!");
 wait(d=>walk(ent('ford'),[[9,13],[16,13],[16,14],[30,14],[30,12]],d));
 act(()=>{const f=ent('ford');F.fordPub=1;f.x=f.ox=32;f.y=f.oy=9;G.lock=false;
   quest('pub','Meet Ford at the Horse and Groom','The pub is across the road to the north-east. Buy six pints of bitter from the barman, then talk to Ford.');
   if(!has('towel'))quest('towel','Fetch your towel','Ford was oddly insistent. Your towel is in the bathroom.');});
}
function talkBarman(){
 if(F.fordTold){ask('Barman','Is it true, what your mate said? About the world ending?',[
   {t:'Yes.',f(){say('Barman','Should we, I dunno, lie down? Put paper bags over our heads?');say('Ford','If you like.');say('Barman','Will that help?');say('Ford','Not in the slightest.');}},
   {t:'Have one on me.',f(){say('Barman','Very kind, sir. Last orders, then. Very last.');}}]);return;}
 if(!F.fordPub){say('Barman',"Bit early for you, isn't it, Mr Dent? It's not even lunchtime.");return;}
 if(!F.pints){ask('Barman','What can I get you?',[
   {t:"Six pints of bitter. And quickly, please. The world's about to end.",f(){F.pints=1;give('peanuts',true);notify('Got: six pints of bitter (and some peanuts)');
     say('Barman','Oh yes, sir? Nice weather for it.');say('Narrator','He pulls six pints. On a hunch, you also buy some peanuts.');}},
   {t:'Just looking, thanks.'}]);return;}
 say('Barman','Enjoy your pints, gentlemen. Lovely day for it.');
}
function talkFordEarth(){
 if(!F.fordPub){say('Ford',"Not now, Arthur. I'm negotiating.");return;}
 if(F.fordTold){say('Ford','Drink up. Then outside. Bring the peanuts. And DO keep your towel handy.');return;}
 if(!has('towel')){quest('towel','Fetch your towel','Ford was oddly insistent. Your towel is in the bathroom.');
   say('Ford',"Arthur. Where's your towel? You can't go anywhere without a towel. Go home and get it. Bathroom. Now.");return;}
 if(!F.pints){say('Ford','Six pints, Arthur. From the barman. It is genuinely important.');return;}
 done('pub');done('towel');
 say('Narrator','You put six pints of bitter on the table. Ford pushes three of them towards you.');
 say('Ford','Drink these. Quickly. All three.');
 ask('Arthur','(Well?)',[
  {t:'Drink all three',f(){say('Narrator','You drink three pints at speed. The room becomes noticeably friendlier.');improb(1);}},
  {t:'Why?',f(){say('Ford',"Muscle relaxant. You'll need it. Drink.");say('Narrator','You drink. You feel very relaxed about almost everything.');}}]);
 say('Ford',"Arthur, what would you say if I told you I'm not from Guildford at all? That I'm actually from a small planet somewhere near Betelgeuse?");
 ask('Arthur','(Hmm.)',[
  {t:"Is it the sort of thing you're likely to say?",f(){say('Ford','Yes. I just said it.');}},
  {t:'Is this the beer talking?',f(){say('Ford','Not yet. Give it a minute.');}}]);
 say('Ford',"I'm a field researcher for a book called The Hitchhiker's Guide to the Galaxy. I've been stuck on this planet for fifteen years. And in about twelve minutes, it's going to be demolished.");
 say('Arthur','Demolished? The pub?');
 say('Ford','The Earth.');
 say('Narrator','Ford shows you the Guide: a small, battered electronic book with the words DON\'T PANIC printed on the cover in large, friendly letters.');
 act(()=>{unlock('dontpanic');unlock('towel');});
 act(()=>{F.fordTold=1;flash('#fff');G.shake=.6;sfx('bad');quest('outside','Get outside!','Something awful is happening to your house. Leave the pub by the front door.');});
 say('Narrator','From outside comes a terrible crunching, splintering, rumbling noise. It sounds a lot like your house.');
 say('Arthur','My HOUSE!');
}
function endOfWorld(){
 F.houseGone=1;refreshTiles();done('outside');G.shake=1;flash('#000');
 say('Narrator','Your house is a heap of rubble. The bulldozer driver looks embarrassed. Mr Prosser, still in the mud, looks confused.');
 say('Arthur','You... you... BARBARIANS!');
 pause(.6);
 act(()=>{G.map.tint='rgba(0,0,30,.5)';sfx('alarm');G.shake=1.5;});
 say('Narrator','Then the sky goes dark. Huge yellow shapes slide silently across it, the size of office blocks, hanging in the air in a way that great lumps of metal really should not.');
 say('Jeltz','People of Earth, your attention please. This is Prostetnic Vogon Jeltz of the Galactic Hyperspace Planning Council.');
 say('Jeltz','Plans for a new hyperspace express route through your star system require the demolition of your planet. This will take slightly less than two of your Earth minutes.');
 say('Jeltz','The plans have been on display at your local planning office on Alpha Centauri for fifty years. It is far too late to start complaining now.');
 say('Jeltz',"What do you mean you've never been to Alpha Centauri? It's only four light years away! Honestly. Energise the demolition beams.");
 say('Ford','Hold on to me, Arthur. And whatever you do: don\'t panic.');
 say('Narrator','Ford holds up a small black device, his Electronic Thumb. It begins to glow.');
 act(()=>{flash('#fff');sfx('warp');unlock('thumb');});
 say('Narrator','The Earth is demolished. Arthur Dent is, improbably, not on it.');
 act(()=>{improb(3);card('Chapter 2 · Resistance is Useless','Aboard a Vogon Constructor Fleet flagship. You have hitched a ride with the most unpleasant race in the galaxy. Ford says not to worry. Ford is a terrible liar.',()=>loadMap('vogon'));});
}

function teaWin(){

 say('Nutri-Matic','Fascinating. Absolutely fascinating. I shall need to think about this. Diverting ALL ship\'s processing power to the problem of tea.');

function startMissiles(resume){
 F.missiles=1;sfx('alarm');G.shake=1;
 if(!resume){
  say('Zaphod','(intercom) Uh, people? Two nuclear missiles have just launched from the surface. They are heading straight for us. Eddie, evasive action!');
  say('Eddie','Sorry, guys! Totally occupied with this tea thing! Can I get back to you?');
  say('Trillian','(intercom) ARTHUR! The Improbability Drive! It\'s the only thing that can save us! Drive room, east end of the corridor! RUN!');
 }
 act(()=>{quest('missiles','Activate the Improbability Drive!','RUN to the drive room at the east end of the ship and hit the big button.');G.timer={t:50,label:'Missile impact',fail:missileFail};});
}
function missileFail(){
 G.shake=1.5;flash('#f80');sfx('caught');
 say('Narrator','The missiles are almost upon you... and the ship\'s computer briefly stops thinking about tea and nudges the ship aside. Barely.');
 say('Zaphod','(intercom) Try that again, monkeyman! They\'re looping round for another pass!');
 act(()=>{teleport(7,16);G.timer={t:50,label:'Missile impact',fail:missileFail};});
}
function driveUse(){
 if(!(F.missiles&&!F.whale)){say('Trillian','(intercom) Arthur, please don\'t touch the drive. The last time somebody pressed it, two people from Earth turned up in our corridor.');return;}
 G.timer=null;F.whale=1;done('missiles');flash('#fff');sfx('warp');improb(8);G.shake=1;
 say('Narrator','You slam your fist down on the big button marked IMPROBABILITY. Reality hiccups.');
 say('Narrator','Outside, the two nuclear missiles are suddenly, and against all reason, a sperm whale and a bowl of petunias.');
 say('Narrator','The whale, newly in existence several miles above Magrathea, has a lot of questions. "Who am I? Why am I here? What is this big round thing rushing up to meet me? I think I\'ll call it... Ground! I wonder if it will be friends with me?"');
 say('Narrator','The bowl of petunias thinks only: "Oh no, not again."');
 act(()=>{unlock('whale');unlock('petunias');});
 say('Zaphod','(intercom) Monkeyman! You saved the ship! Okay, everybody: we\'re going down.');
 act(()=>card('Chapter 4 · Magrathea','The Heart of Gold settles onto the dead, dusty surface of the legendary planet. Nearby is a very large crater with a very recently deceased whale in it.',()=>loadMap('magrathea')));
}

 if(has('award'))awardCheck();
 if(!F.slartiF){F.slartiF=1;unlock('fjords');
  say('Slartibartfast','This is the factory floor, where we made most of your planets.');

  say('Slartibartfast','That is Earth Mark Two. We are building it again from the original blueprints. Our clients want it back.');
  say('Arthur','Clients?');
  say('Slartibartfast','You\'ll see. First, watch the recording in the theatre to the north. It explains everything, which is more than most things do.');
  act(()=>quest('dt','Watch the Deep Thought recording','The theatre is just north of the platform.'));return;}
 if(!qdone('dt')){say('Slartibartfast','The theatre, Earthman. North. Things will make sense. Or they won\'t, but at least you\'ll know why.');return;}
 if(!qhas('mice')){say('Slartibartfast','Your hosts are waiting in the dining room at the east end of the gantry. I would rather be designing a coastline.');
  act(()=>quest('mice','Meet your hosts','The dining room is at the east end of the gantry.'));return;}

function deepThought(){
 say('Narrator','A hologram flickers into life. Millions of years ago, a race of hyper-intelligent pan-dimensional beings built a computer called Deep Thought to find the Answer to Life, the Universe, and Everything.');
 say('Deep Thought','I can find the answer. But it will take me some time. About seven and a half million years.');
 say('Narrator','Seven and a half million years later, a vast crowd gathers. The great day has come.');
 say('Deep Thought','The Answer to the Great Question... of Life, the Universe and Everything... is...');
 say('Deep Thought','...you\'re really not going to like it...');
 say('Deep Thought','Forty-two.');
 say('Narrator','There is a very long silence.');
 say('Deep Thought','I checked it very thoroughly. The problem, to be quite honest, is that you never actually knew what the Question was.');
 say('Deep Thought','But I can design a computer that will find it: a computer so vast that organic life itself will be part of its circuitry. It shall be called... the Earth.');

function miceScene(){

 say('Benjy','Ah, the Earthman! Do sit down. Have some wine. We\'re so glad you survived. It saves an enormous amount of bother.');
 say('Frankie','We are the hyper-intelligent pan-dimensional beings who commissioned the Earth. In your dimension we appear as mice. It\'s a look.');
 say('Benjy','Your planet was five minutes away from finding the Question when the Vogons blew it up. FIVE MINUTES. The paperwork alone...');
 say('Frankie','But you were on it until the very end. The Question is probably still in your brain. So we\'d like to buy it.');
 ask('Arthur','Buy... my brain?',[
  {t:'Absolutely not.'},
  {t:'What would I use instead?',f(){say('Benjy','Oh, a simple electronic one would do. It would only need to say things like "What?" and "I don\'t understand" and "Where\'s the tea?". Nobody would notice the difference.');}},

   card('Escape!','Zaphod kicks over the table. In the chaos you bolt through a side door, straight into the mice\'s brain-research wing. Wrong way. Well, it\'s A way.',()=>loadMap('micelab'));});
}

function talkCow(){
 if(F.dishDone){say('Cow','Lovely to meet you. Do enjoy the rest of your evening. And me.');return;}
 say('Cow','Good evening! I am the main Dish of the Day. May I interest you in parts of my body?');
 say('Narrator','It shifts its weight and gives you a winning smile.');
 say('Cow','Something off the shoulder? Braised in a white wine sauce? I\'ve been force-feeding myself for months. Very tender.');
 ask('Arthur','(Horrified.)',[
  {t:"I'll have a green salad, please.",f(){say('Cow','A salad? I know plenty of vegetables who would be very upset to hear you say that. At least I WANT to be eaten.');say('Zaphod','Four rare steaks, please. And hurry: we haven\'t eaten in five hundred and seventy-six thousand million years.');}},
  {t:'Steak. Rare. ...Sorry.',f(){say('Cow','Splendid choice, sir! I\'ll just pop out the back and shoot myself. Don\'t worry, I\'ll be very humane.');}},
  {t:"Can't I just have the soup?",f(){say('Cow','The soup is also me. Mostly.');}}]);

function talkMax(){
 if(!F.dishDone){say('Max','Not yet, sir! The Universe ends after the main course. Have you ordered? You must order!');return;}
 if(F.showDone){say('Max','Thank you, thank you! Same time tomorrow! Well. Same time.');return;}
 say('Max','Ladies and gentlemen! The moment you have all been waiting for! The skies are boiling! The stars are collapsing! This is it: the end of absolutely everything!');
 act(()=>{F.showOn=1;G.shake=.6;sfx('alarm');});
 pause(2.5);
 say('Max','And now, to see us all out, please welcome... the Great Prophet ZARQUON!');
 act(()=>{F.zarquon=1;flash('#fff');});
 say('Zarquon','Er... hello, everybody. Sorry I\'m a bit late. Had a terrible time. All sorts of things cropping up at the last moment. How are we for time? Is there...');
 act(()=>{flash('#fff');G.shake=1.5;sfx('warp');F.showOn=0;F.showDone=1;F.zarquon=0;unlock('zarquon');done('show');});
 say('Narrator','...and the Universe ends. The lights come up. Everybody applauds politely. Coffee is served.');
 say('Zaphod','Okay, gang. Dessert somewhere less final. Let\'s borrow a ship from the car park. The lift\'s by the bar.');
 act(()=>quest('steal','Borrow a ship','Take the lift (east side, by the bar) down to the car park and find a fast ship.'));
}

  {t:"Let's do it.",f(){gargle();}},
  {t:'What goes in it?',f(){say('Barman','Ask your Guide, sir. Gargle Blasters are entry one in the drinks section.');act(()=>unlock('gargle'));}},
  {t:'Maybe later.'}]);
}
function gargle(){
 const steps=["Ol' Janx Spirit",'Santraginean sea water','Arcturan Mega-gin','Fallian marsh gas','an Algolian Suntiger tooth','an olive'];
 const flav=['You pour in a measure of Ol\' Janx Spirit. It hums.','You add Santraginean sea water. Santraginean fish weep somewhere.','Three cubes of Arcturan Mega-gin. They clink ominously.','Four litres of Fallian marsh gas bubble through it, in memory of happy hikers who died in the marshes of Fallia.','The Suntiger tooth dissolves, filling the drink with the fire of the Algolian suns.','Finally, an olive. It sinks with an air of quiet dignity.'];
 let i=0;
 const next=()=>{
  if(i>=steps.length){say('Narrator','You drink it. It is like being hit on the head with a gold bar that someone has politely wrapped in a slice of lemon. You love it.');act(()=>{done('gargle');unlock('gargle');improb(2);G.shake=1;});return;}
  const opts=shuffle([steps[i],...shuffle(steps.filter((s,j)=>j!==i)).slice(0,2)]);
  ask('Barman',`Ingredient ${i+1} of 6. What goes in next?`,opts.map(o=>({t:o,f(){if(o===steps[i]){say('Narrator',flav[i]);i++;next();}
    else{say('Narrator',`You add ${o}. The glass makes a noise like a small sad trumpet and explodes, gently, all over the barman.`);say('Barman','From the top, sir. And maybe check your Guide.');i=0;next();}}})));
 };
 next();
}

 say('Marvin','Oh. It\'s you.');
 say('Arthur','Marvin! What are you doing here?');
 say('Marvin','Parking cars. I\'ve been parking cars for five hundred and seventy-six thousand million years. You left me on Magrathea, so I waited. Then I got a job. Then the Universe ended. Again. It ends every night.');
 say('Marvin','The first ten million years were the worst. The second ten million were also the worst. After that it went downhill.');

  {t:'54',f(){say('Ford','Fifty-four. Correct as far as arithmetic is concerned. Completely wrong as far as the Universe is concerned.');say('Arthur','So the Question\'s broken?');
    say('Ford','The Golgafrinchans arrived, the cavemen died out, and the program went haywire. That\'s why it doesn\'t add up.');}},
  {t:'A small fish',f(){say('Ford','...You\'ve been in space too long.');say('Arthur','Fine. Forty-two? Fifty-four?');say('Ford','Both, somehow. Which tells you everything you need to know about the Universe.');}}]);
 say('Arthur','I knew it. I always knew there was something fundamentally wrong with the universe.');
 act(()=>{unlock('question');improb(42);});
 say('Narrator','Arthur and Ford sit by the river and watch the sun go down over the young world, which will one day be called Earth, and which will one day be demolished to make way for a hyperspace bypass.');
 say('Ford','Fancy another game?');
 say('Arthur','Go on, then.');
 act(()=>{F.finished=1;save();G.mode='end';G.endT=0;hideBox();sfx('quest');});
}

/* =========================================================================
   TITLE / END / BOOT
   ========================================================================= */
function drawTitle(){
 starfield();const t=G.time;
 drawSprite('planet',170,470,{r:120});
 ctx.save();ctx.translate(760+Math.sin(t*.4)*20,150+Math.cos(t*.3)*10);ctx.scale(.8,.8);drawSprite('heartship',-40,-18);ctx.restore();
 ctx.save();ctx.shadowColor='rgba(255,207,74,.6)';ctx.shadowBlur=24;txt("DON'T PANIC",480,200,'#ffcf4a',86,'center','Impact,"Arial Black",sans-serif');ctx.restore();
 txt("A Hitchhiker's Adventure",480,248,'#7fd4ff',24,'center','Georgia,serif');
 const sv=hasSave();
 txt('[N]  New game',480,330,'#fff',20,'center');
 txt(sv?'[C]  Continue':'[C]  Continue (no save yet)',480,364,sv?'#fff':'#666',20,'center');
 txt('Press Enter to '+(sv?'continue':'begin'),480,420,`rgba(255,255,255,${.5+.5*Math.sin(t*3)})`,14,'center');
 txt('Seven chapters · stealth levels · side quests · 38 Guide entries to collect',480,500,'#9ab',13,'center');
 txt('A fan-made game inspired by the story by Douglas Adams',480,540,'#678',12,'center');
}
function titleKey(k){if(k==='n'||(k==='enter'&&!hasSave()))newGame();else if((k==='c'||k==='enter')&&hasSave())loadSave();}
function newGame(){
 F=G.flags={};G.inv=[];G.quests={};G.qorder=[];G.guide={};G.improb=0;G.caughtN=0;G.followers=[];G.peng=0;G.shades=false;G.chapter='';marvinTopics=0;
 card('Chapter 1 · Thursday','In the beginning the Universe was created. Many people consider this to have been a mistake. Today is Thursday, and Arthur Dent is about to have a very bad day.',()=>loadMap('earth'));
}
function drawEnd(){
 starfield();const t=G.endT;
 txt('THE END',480,110,'#ffcf4a',56,'center','Impact,sans-serif');
 txt('(mostly)',480,140,'#ccb',16,'center');
 const gn=Object.keys(G.guide).length,gt=Object.keys(GUIDE).length;
 const sq=Object.values(G.quests).filter(q=>q.side),sd=sq.filter(q=>q.done).length;
 const rows=[['Guide entries found',gn+' / '+gt],['Side quests completed',sd+' / '+sq.length],['Times caught',String(G.caughtN)],['Final improbability','2^'+G.improb+' : 1'],['Towel kept',has('towel')?'Yes. A hoopy frood.':'No. Shameful.']];
 rows.forEach((r,i)=>{if(t>.6+i*.5){txt(r[0],300,220+i*40,'#9cf',18);txt(r[1],660,220+i*40,'#fff',18,'right');}});
 if(t>3.5){txt(gn===gt?'You found every Guide entry. Ford would be proud. Ford would also want them back.':'There are more Guide entries out there. Probably behind a sofa.',480,450,'#7fff7f',15,'center');
  txt('So long, and thanks for all the fish.',480,490,'#ffcf4a',18,'center','Georgia,serif');}
 if(t>4)txt('Press Enter to return to the title screen',480,540,`rgba(255,255,255,${.5+.5*Math.sin(G.time*3)})`,13,'center');
}
updHud();
requestAnimationFrame(loop);
</script>
