"Steamer!" yells a man in a black waistcoat. "Look out, guv'nor! Bang over'ead!"`,
  game:{type:'steamer', label:'Get down!', win:'afterbomb', lose:'afterbomb', fxWin:{hum:2}, fxLose:{health:-14},
    winText:'The rocket bomb lands two hundred metres up the street with a roar that seems to make the pavement heave. A shower of light objects pattering on your back. You get up covered in plaster.',
    loseText:'The blast catches you half-standing and throws you against a doorway. When you get up your ears are ringing and there is blood on your hand that is not, you think, yours.'}},
afterbomb:{title:'Where the bomb fell', loc:'steamer', art:'none',
  text:`A cloud of plaster dust hangs in the air. In the gutter, among the rubble, you see something that looks for a moment like a doll: a human hand, severed at the wrist, so white it might be plaster. You kick it into the gutter, and then, to avoid the crowd, turn down a side street to the right.

Within three or four minutes you are out of the area the bomb has affected, and the squalid swarming life of the streets is going on as though nothing has happened. It is nearly twenty hours. The drinking-shops the proles frequent are choked with customers.`,
  choices:[
    {t:'Go into the pub on the corner.', go:'pub'},
    talk('lottery', 'Stop at the Lottery stall.', `A group of men are arguing over the Lottery results, as savagely as if their lives depended on it. For millions of proles the Lottery is the principal if not the only reason for remaining alive. You happen to know — everyone in the Ministry knows — that the prizes are largely imaginary.`, {hum:1, item:'ticket'}),
    {t:'Walk on to the junk-shop where you bought the diary.', go:'shop'}
  ]},
pub:{title:'The Pub', loc:'pub', art:'none',
  text:`Inside, a deafening chorus of voices and a smell of sour beer. At the bar a very old man, bent-backed, with a fierce white moustache, is arguing with the barman about his glass.

"I arst you civil enough, didn't I?" he says. "You telling me you ain't got a pint mug in the 'ole bleeding boozer?"

"And what in hell's name is a pint?" says the barman.

"'Ark at 'im! Calls 'isself a barman and don't know what a pint is! A pint's the 'alf of a quart, an' there's four quarts to the gallon."

He must have been a grown man before the Revolution. He is one of the last links with the vanished world. If anyone alive can tell you what it was really like, it is this man.`,
  fx:{meet:'oldprole'},
  choices:[
    {t:'Buy him a drink, and ask him what it was like before.', go:'oldman', if:G => G.stats.cash >= 1, fx:{cash:-1, aff:{oldprole:15}, sus:2}},
    {t:'Leave. A Party member in a prole pub is conspicuous.', go:'shop', fx:{sus:-1}}
  ]},
oldman:{title:'The Pub', art:'none',
  text:`The barman fills two litre-glasses, and then, under the old man's glare, two half-litres. "'Alf a litre ain't enough," the old man grumbles. "It don't satisfy. And a 'ole litre's too much. It starts my bladder running."

You ask him: was life better before the Revolution than it is now? Were the capitalists in their top hats really as cruel as the history books say? Were people freer, happier?

He tells you about a top hat he once wore to his brother-in-law's funeral. About a man who shoved him on the Boat Race night. About the beer: "The beer was better," he says. "And cheaper! When I was a young man, mild beer — wallop we used to call it — was fourpence a pint."

It is hopeless. He remembers a million useless things. He does not remember the one thing you need.`,
  choices:[
    {t:'Keep asking, more plainly. Was it better?', go:'shop', fx:{hum:-2, sus:4}, res:`He looks at you suspiciously for a moment, then into his glass. You realise that the only people who could tell you are already dead, or are like this. When memory fails and written records are falsified — when that happens, the claim of the Party to have improved the conditions of life must be accepted, because there does not exist, and never again could exist, any standard against which it could be tested.`},
    {t:'Let him talk about the beer. Buy him his pint.', go:'shop', if:G => G.stats.cash >= 1, fx:{cash:-1, hum:5, aff:{oldprole:10}, food:1}, res:`He drinks it down with enormous satisfaction and tells you about a Boat Race, about a girl called Lil, about his old dad. None of it is history. All of it is life. You leave with a strange, sore warmth in your chest, as if you had been given something you cannot name.`},
    {t:'Thank him and go.', go:'shop'}
  ]},
shop:{title:'Mr Charrington\'s Shop', loc:'shop', w:'shop', art:'shop',
  text:`The little junk-shop where you bought the diary. Its proprietor, a man of perhaps sixty, frail and bowed, in an ancient velvet jacket, peers at you through thick spectacles. His voice is soft, his accent less debased than most proles'.

The place is full of rubbish: dented candlesticks, brass tables, cracked china. But on a table in the window something catches your eye: a round, smooth thing that gleams softly in the lamplight. A heavy lump of glass, curved on one side, flat on the other, and at the heart of it a strange pink convoluted object, like a rose or a sea anemone.

"It's coral, that is," says the old man. "It must have come from the Indian Ocean. They used to kind of embed it in the glass. That wasn't made less than a hundred years ago. More, by the look of it."

"It's a beautiful thing," you say.

"It is a beautiful thing. But there's not many that'd say so nowadays. Four dollars to you."`,
  fx:{meet:'charrington', aff:{charrington:5}},
  choices:[
    {t:'Buy the paperweight for four dollars.', if:G => G.stats.cash >= 4 && !has('paperweight'), fx:{cash:-4, item:'paperweight', hum:8, sus:2}, res:`You pay without haggling. It is a queer thing to possess, for a Party member: anything old, and for that matter anything beautiful, is always vaguely suspect. But it is so heavy in your pocket, and so pleasant. It is as if it were a little chunk of another age.`},
    talk('engraving', 'Ask about the steel engraving on the wall.', `A building with oblong windows and a small tower. "St Clement's Dane, its name was," says Mr Charrington, with an apologetic air. "There was a rhyme. Oranges and lemons, say the bells of St Clement's — " He hums the rest, slowly. "You owe me three farthings, say the bells of St Martin's… that's as far as I can get. A farthing, that was a small copper coin."`, {rhyme:[0, 1], aff:{charrington:5}, hum:3}),
    talk('upstairs', 'Let him show you the room upstairs.', `A narrow stair, a low-ceilinged room with a mahogany bed, a gateleg table, a twelve-hour clock with an old-fashioned glass face, and a window looking out on to a cobbled yard. No telescreen. "I never had one of those things," says the old man. "Too expensive." The wild idea occurs to you that you could rent it.`, {flag:'sawRoom', hum:2, map:'room'}),
    {t:'Leave, and walk home the long way.', go:'girlstreet'}
  ]},
girlstreet:{title:'The street outside', art:'none',
  text:`Twenty metres away, coming towards you on the pavement, is the dark-haired girl from the Fiction Department, in her blue overalls with the scarlet sash. For a moment she looks you full in the face, then walks quickly on as though she has not seen you.

There is no doubt now. She is following you. She must have followed you all the way here, for it is not credible that by chance she should happen to be walking on the same evening in the same obscure backstreet, kilometres from any quarter where Party members live. She is a spy of the Thought Police, or simply an amateur spy actuated by officiousness. It hardly matters which.`,
  choices:[
    {t:'Turn and follow her. Find out, here, in a back street.', go:'photo', fx:{sus:6, health:-2, hum:-2}, res:`You turn and go after her, the weight of the glass swinging in your pocket. You could smash her skull in with a cobblestone. But you have no strength. Your varicose ulcer is throbbing. After a few hundred metres you lose her, and stand in the road with your heart hammering, ashamed and sick.`},
    {t:'Hurry home and drink gin until you stop shaking.', go:'photo', fx:{health:-3, sus:2}},
    {t:'Smile at nobody. Walk home slowly, like a man with nothing in his pockets.', go:'photo', dt:3, fx:{sus:-4}}
  ]}
});

// ── VII. TWO AND TWO MAKE FOUR ──────────────────────────────────────────────
Object.assign(BEATS, {
photo:{chapter:7, chTitle:'Two and Two Make Four', date:'8 April 1984', map:'mansions', loc:'alcove', w:'victory', art:'telescreen',
  text:`In the alcove, late, you remember a photograph.

Eleven years ago. Jones, Aaronson and Rutherford: three of the original leaders of the Revolution, who confessed at their trials to having been in Eurasia, betraying military secrets, on a certain date. They were pardoned, reinstated, and arrested again; they had been seen, afterwards, sitting in the Chestnut Tree Café, ruined men, while the telescreen played a cracked, braying tune. Then they were shot.

And one day a scrap of newspaper slid out of the pneumatic tube on to your desk: half a page of the Times, with a photograph of the three men at a Party function in New York — on the very day they had confessed to being in Eurasia. Concrete evidence. A fragment of the abolished past, like a fossil bone.

You did what you had to do. You covered it with a sheet of paper, and ten minutes later, dropped it down the memory hole.`,
  choices:[
    {t:'"I did right. It was the only thing to do."', go:'twoplus', dt:5, fx:{sus:-5}},
    {t:'"It existed. I held it in my hand. That is enough."', go:'twoplus', fx:{hum:7}, log:'The photograph existed. I held it. Jones, Aaronson, Rutherford were innocent.'}
  ]},
twoplus:{title:'The Alcove, before dawn', art:'none',
  text:`In the end the Party will announce that two and two make five, and you will have to believe it. It is inevitable that they should make that claim sooner or later: the logic of their position demands it. Not merely the validity of experience, but the very existence of external reality is tacitly denied by their philosophy.

The Party told you to reject the evidence of your eyes and ears. It was their final, most essential command.

But the solid world exists. Stones are hard, water is wet, objects unsupported fall towards the earth's centre. With the feeling that you are speaking to O'Brien, and also that you are setting forth an important axiom, you dip the pen and write:`,
  choices:[
    {t:'Write it.', go:'fall', fx:{hum:10, sus:4, flag:'twoplustwo', song:'diary'}, log:'Freedom is the freedom to say that two plus two make four. If that is granted, all else follows.', res:`${DL('Freedom is the freedom to say that two plus two make four. If that is granted, all else follows.')}\n\nYou look at it for a long time. It is the truest thing you have ever written, and it will kill you.`},
    {t:'Write it — and then, carefully, ink it out.', go:'fall', dt:4, fx:{sus:-3, hum:2}}
  ]}
});


// ── PART TWO ── VIII. I LOVE YOU ────────────────────────────────────────────
Object.assign(BEATS, {
fall:{chapter:8, chTitle:'I Love You', date:'20 April 1984', map:'minitrue', loc:'corridor', w:'minitrue', art:'none',
  text:`It is the middle of the morning, and you have left the cubicle to go to the lavatory. A solitary figure is coming towards you from the other end of the long, brightly-lit corridor. It is the girl with dark hair. Her right arm is in a sling.

When she is perhaps four metres away she stumbles and falls almost flat on her face, with a sharp cry of pain. She must have fallen on the injured arm.

You stop short. The enemy who has been trying to kill you — and also a human creature, in pain and perhaps with a broken bone.`,
  choices:[
    {t:'Help her up.', go:'note', fx:{hum:4, aff:{julia:10}}, res:`"You're hurt?" you say.\n\n"It's nothing. My arm. It'll be all right in a second." Her face has turned a milky yellow colour. As you help her up, she slips something into your hand. A small flat thing. Then she is walking away, briskly, as though nothing has happened.`},
    {t:'Walk on. It is a trap.', go:'note', fx:{sus:-2, aff:{julia:-4}, hum:-3}, res:`You step round her. But she is up, somehow, in front of you, and as you pass she presses something into your hand, hard, with her good one. Then she is gone round the corner.`}
  ]},
note:{title:'Your Cubicle', loc:'cubicle', art:'none',
  text:`The thing in your hand is a scrap of paper folded into a square. Whatever is written on it must have some political meaning. Perhaps it is a summons, an order to commit suicide, a trap. Perhaps it is a message from the underground — from the Brotherhood.

You cannot open it with the telescreen in front of you. You must unfold it slowly, casually, among the other papers on your desk, without a flicker crossing your face. Facecrime, it is called: to wear an improper expression on your face is itself a punishable offence.`,
  game:{type:'diary', mode:'note', label:'Unfold the note', win:'noteread', lose:'noteread', fxWin:{hum:6, item:'note'}, fxLose:{sus:10, item:'note'},
    winText:'You manage it without a quiver. The words are in a large, unformed handwriting.',
    loseText:'Your hand trembles, and you are sure — almost sure — that a muscle in your face moved. You go on working. The words are still there.'}},
noteread:{title:'Your Cubicle', art:'none',
  text:`${DL('I love you.')}

For several seconds you are too stunned even to throw the incriminating thing into the memory hole. Then you read it again, just to make sure the words are really there.

For the rest of the morning it is very difficult to work. What is worse than having to focus your mind on a series of niggling jobs is the need to conceal your agitation from the telescreen. You feel as though a fire were burning in your belly.

For a week you try and fail to speak to her. Then, at last, in the canteen, at a table alone: "Victory Square, near the monument," she breathes, without looking up from her stew. "Nineteen hours."`,
  choices:[
    {t:'Drop the note in the memory hole, as you must.', go:'square', fx:{lose:'note', sus:-4}},
    {t:'Keep it, folded small, inside the diary.', go:'square', fx:{hum:4, sus:5, flag:'keptNote'}}
  ]},
square:{title:'Victory Square', map:'wild', loc:'square', w:'square', art:'hateweek',
  text:`Victory Square, at the foot of the fluted column on which the statue of Big Brother gazes southward towards the skies where he vanquished the Eurasian aeroplanes. A convoy of lorries is going past, full of Eurasian prisoners, mongolian faces gazing out with no curiosity at all.

The crowd pushes you together. You stand side by side, not looking at each other, and she speaks out of the corner of her mouth, giving directions as if she has done this a hundred times: Paddington Station; a train; a walk; a gate; a path across a field; a track with grass on it; a dead tree with moss on it. "Can you get Sunday off?"

"Yes."

For a moment her fingers find yours in the crush. It is only ten seconds. It seems a long time.`,
  choices:[{t:'Memorize every word of the route.', go:'train', fx:{hum:6, aff:{julia:12}, meet:'julia'}}]}
});

// ── IX. THE GOLDEN COUNTRY ──────────────────────────────────────────────────
Object.assign(BEATS, {
train:{chapter:9, chTitle:'The Golden Country', date:'Sunday, 6 May 1984', map:'country', loc:'station', w:'golden', art:'golden', travel:2,
  text:`The train is full of proles in holiday mood, an enormous family going out to "see a mother-in-law". You get off at a small station and walk. The air seems to kiss your skin. It is the second of May — no, a Sunday in May, the cuckoo somewhere far off.

There are patrols even out here, sometimes, at the edges of the woods. And the Thought Police could hide microphones anywhere: in the hollow of a tree, among the leaves. You had better not be seen going in the direction she gave you.`,
  game:{type:'sneak', map:'country', label:'Find your way to the clearing', win:'clearing', lose:'clearing', fxWin:{hum:4}, fxLose:{sus:14},
    winText:'Nobody sees you. Nobody you know of. The path dips into a hollow full of bluebells, and she is there.',
    loseText:'A man on the lane looked at you hard for a moment. Only a prole, perhaps. Perhaps not. You go on anyway; you have come too far to turn back.'}},
clearing:{title:'The Bluebell Wood', loc:'clearing', art:'golden', fx:{meet:'julia'},
  text:`She takes you to a tiny grassy knoll surrounded by tall saplings. "Here we are," she says. Her name is Julia. She knows yours already. She is twenty-six.

You are nervous; your body is old and your teeth are false. "I'm thirty-nine years old," you tell her. "I've got a wife I can't get rid of. I've got varicose veins. I've got five false teeth."

"I couldn't care less," says the girl.

She breaks off half a slab of chocolate — real chocolate, dark and shiny, wrapped in silver paper — and gives it to you. The first fragment melts on your tongue, and a memory stirs, something you cannot name.

"I knew you were against them," she says. "As soon as I saw you. It's your face."`,
  choices:[
    talk('hundreds', '"Have you done this before?"', `"Of course. Hundreds of times — well, scores of times, anyway."\n\n"With Party members?"\n\n"Yes, always with Party members."\n\nYour heart leaps. Scores of times: you wish it had been hundreds, thousands. Anything that hinted at corruption fills you with a wild hope. Who knows, perhaps the Party is rotten under the surface.`, {hum:3, item:'chocolate', aff:{julia:5}}),
    talk('sash', '"And the sash? The Anti-Sex League?"', `She laughs. "The more they make a show of it, the safer you are." She unwinds the scarlet sash and gives you one end of it as a joke. "It's the only way to get away with things. Do the little things, keep the big ones hidden."`, {item:'sash', aff:{julia:5}}),
    {t:'"Listen. The more men you\'ve had, the more I love you."', go:'thrush', fx:{hum:8, aff:{julia:15}}, res:`"Do you understand that?" you say.\n\n"Yes, perfectly."\n\n"I hate purity, I hate goodness! I don't want any virtue to exist anywhere. I want everyone to be corrupt to the bones."\n\n"Well then, I ought to suit you, dear. I'm corrupt to the bones."`},
    {t:'Say nothing. Just hold her, very still.', go:'thrush', fx:{hum:5, aff:{julia:10}}}
  ]},
thrush:{title:'The edge of the wood', loc:'pasture', song:'thrush', art:'golden',
  text:`On a bough not five metres away a thrush has alighted, and begins to pour out a torrent of song, as though for no one. You watch it, fascinated. For whom, for what, is that bird singing?

Beyond the trees is an old, rabbit-bitten pasture, a footpath wandering across it, a molehill here and there. In the ragged hedge on the other side the boughs of the elm trees sway very faintly in the breeze. Somewhere near at hand, though out of sight, there must be a stream with green pools where dace are swimming.

"It's the Golden Country," you murmur. "Almost."

Afterwards, lying in the sun, you think: their embrace was a battle, the climax a victory. It was a blow struck against the Party. It was a political act.`,
  choices:[
    {t:'"We could come here again."', go:'rent', fx:{hum:6, aff:{julia:6}}, log:'The Golden Country exists. I have walked in it.'},
    {t:'"They\'ll get us in the end. You know that."', go:'rent', fx:{hum:2, aff:{julia:-2}}, res:`"Yes," she says, unbothered, picking a bluebell. "But until then, we'll have a good time." She is not interested in the future, only in the next meeting, and the one after. You envy her that.`}
  ]}
});

// ── X. THE ROOM ─────────────────────────────────────────────────────────────
Object.assign(BEATS, {
rent:{chapter:10, chTitle:'The Room', date:'June 1984', map:'room', loc:'stairs', w:'shop', art:'room', travel:1,
  text:`It is lunacy. Of all the follies you could commit, this is the most obvious. But you have rented the room over Mr Charrington's shop, ten dollars a month, and Mr Charrington, who seems to have forgotten that there are such things as Party members, has asked no questions at all.

"Privacy," he said, with a vague air of benevolence, "was a very valuable thing. Everyone wanted a place where they could be alone occasionally."

From the yard below comes the voice of an enormous woman, solid as a Norman pillar, with brawny red forearms, hanging out nappies and singing as she works.`,
  fx:{cash:-3, meet:'prolewoman'}, song:'fancy',
  choices:[
    {t:'Wait for Julia by the window.', go:'julia_room'},
    {t:'Buy the glass paperweight on the way up.', if:G => !has('paperweight') && G.stats.cash >= 4, go:'julia_room', fx:{cash:-4, item:'paperweight', hum:6}}
  ]},
julia_room:{title:'The Room', loc:'bed', art:'room',
  text:`Julia comes in with a tool-bag, and from it, with the air of a conjuror, produces: real sugar, not saccharine. A loaf of white bread, not the sticky grey stuff. A pot of jam. A tin of milk. And coffee — real coffee — Inner Party coffee. The smell fills the room.

"Turn round, dear," she says. When you turn back she has painted her face. "I'm going to be a woman, not a Party comrade," she says. "And in this room I'm going to wear silk stockings and high-heeled shoes!"

Then something moves in the corner by the wainscot. A brown tail, a nose. Julia throws a shoe at it.

"Rats!" you say, in a low voice. "In this room!"`,
  fx:{item:['coffee'], food:3, health:4},
  choices:[
    {t:'"Of all horrors in the world — a rat." Tell her how you dream of them.', go:'paperweight', fx:{flag:'rats', hum:2, aff:{julia:4}}, res:`You have a nightmare that recurs: you are standing before a wall of darkness, and on the other side of it there is something unendurable, something too dreadful to be faced. You always wake before you find out what it is. But it is connected with the rats.\n\nJulia stuffs a piece of sacking into the hole. "I'll bring some plaster next time. We'll do it properly."`},
    {t:'Laugh it off. It\'s only a rat.', go:'paperweight', fx:{aff:{julia:2}}}
  ]},
paperweight:{title:'The Room, evening', loc:'paperweight', art:'room',
  text:G => `${has('paperweight') ? `You pick up the glass paperweight and gaze into it. What is inexhaustibly interesting is not the fragment of coral but the interior of the glass itself. There is such a depth of it, and yet it is almost as transparent as air. It is as though the surface of the glass were the arch of the sky, enclosing a tiny world with its atmosphere complete.\n\nThe paperweight is the room you are in, and the coral is Julia's life and your own, fixed in a sort of eternity at the heart of the crystal.` : `On the gateleg table there is nothing but the coffee cups. You remember the coral paperweight in the shop window below, and wish you had bought it.`}

Julia looks at the engraving of St Clement's over the bed. "What's that?" You recite Mr Charrington's lines. To your amazement she joins in.

"My grandfather used to say it to me when I was a little girl," she says. "I don't remember how it goes on. But I remember the end: Here comes a candle to light you to bed, here comes a chopper to chop off your head!"`,
  choices:[
    {t:'Go down and ask Mr Charrington for the line in between.', go:'obrien', fx:{rhyme:[2, 4], aff:{charrington:6}}, res:`"Old Bailey!" says Mr Charrington, delighted. "When will you pay me? say the bells of Old Bailey. It's come back to me." He says it softly, peering at you with great interest through the thick spectacles. You go back up the stairs with another fragment of the vanished world in your keeping.`},
    {t:'Say nothing. Just listen to the woman in the yard singing.', go:'obrien', fx:{rhyme:4, hum:5}, res:`She sings as though nothing in the world could stop her. Her song is a piece of trash churned out by a machine, and yet she has made it almost a pleasant sound. The birds sing, the proles sing. The Party does not sing.`}
  ]}
});

// ── XI. THE PLACE WHERE THERE IS NO DARKNESS ────────────────────────────────
Object.assign(BEATS, {
obrien:{chapter:11, chTitle:'The Place Where There Is No Darkness', date:'July 1984', map:'minitrue', loc:'corridor', w:'minitrue', art:'none',
  text:`It has happened at last. In the long corridor, O'Brien falls into step beside you. "I had been hoping for an opportunity of talking to you," he says. "I was reading one of your Newspeak articles in the Times the other day. You take a scholarly interest in Newspeak, I believe?"

He has noticed that you use two words that have become obsolete. Had you seen the Tenth Edition of the Dictionary? It has not been issued yet; he has an advance copy. "Perhaps you could pick it up at my flat."

Without hurry he takes out a small leather-covered notebook and a gold ink-pencil, scribbles an address, tears out the page and hands it to you. A thoughtcrime, delivered as innocently as a library book. Within a couple of minutes you have memorized it and dropped it into the memory hole.

The thing you have been waiting for has happened. The conspiracy you have dreamed of really exists, and you have reached the outer edges of it.`,
  fx:{item:'dictionary', aff:{obrien:10}, hum:3, sus:6},
  choices:[
    {t:'Go to O\'Brien\'s flat, with Julia, by separate ways.', go:'innerwalk'}
  ]},
innerwalk:{title:'The Inner Party District', map:'wild', loc:'obrien', w:'obrien', art:'none',
  text:`The Inner Party live in a different world: wide clean streets, big windows, trees along the pavements. Even the air smells different. Guards at the corners look at any blue overall with a flat, measuring stare. Party members of your grade have no reason to be here at all. If anyone stops you, you will say you are collecting a dictionary.`,
  game:{type:'sneak', map:'inner', label:'Reach O\'Brien\'s door', win:'obrienflat', lose:'obrienflat', fxWin:{hum:3}, fxLose:{sus:15},
    winText:'At the door a small dark-haired man in a white jacket — Martin, O\'Brien\'s servant — lets you in without a flicker of surprise. Julia is already there.',
    loseText:'A guard took your name at the corner. "A dictionary," you said. He wrote it down. Then you were at the door, and a servant was letting you in.'}},
obrienflat:{title:'O\'Brien\'s Flat', art:'obrien',
  text:`Everything is rich and spacious: the dark-coloured carpet, the soft air, the faint scent of good tobacco. O'Brien is sitting at a table under a green-shaded lamp. He looks up, rises, and then does something extraordinary. He presses a switch on the wall, and the voice from the telescreen stops.

"You can turn it off!" you say.

"Yes," says O'Brien, "we can turn it off. We have that privilege."

You speak first, because you must. "We believe that there is some kind of conspiracy, some kind of secret organisation working against the Party, and that you are involved in it. We want to join it and work for it. We are enemies of the Party. We are thought-criminals."

Martin brings a decanter of dark-red wine. O'Brien pours three glasses. "What shall it be this time?" he asks. "To the confusion of the Thought Police? To the death of Big Brother?"`,
  choices:[
    {t:'"To the past."', go:'oath', fx:{hum:5, aff:{obrien:6}}, res:`"The past is more important," agrees O'Brien gravely. You drink. The wine tastes of nothing you can name. It is the first wine you have ever drunk.`},
    {t:'"To the future."', go:'oath', fx:{hum:3, aff:{obrien:3}}}
  ]},
oath:{title:'O\'Brien\'s Flat', art:'obrien',
  text:G => `O'Brien begins to ask questions in a low, expressionless voice, as though this were routine, a sort of catechism, most of whose answers are known to him already.

"You are prepared to give your lives? To commit murder? To commit acts of sabotage which may cause the death of hundreds of innocent people? To betray your country to foreign powers? To cheat, to forge, to blackmail, to corrupt the minds of children? If, for example, it would somehow serve our interests to throw sulphuric acid in a child's face — are you prepared to do that?"

"Yes."

"You are prepared to lose your identity and live out the rest of your life as a waiter or a dock-worker? To commit suicide, if and when we order you to do so?"

"Yes."

"You are prepared, the two of you, to separate and never see one another again?"`,
  choices:[
    {t:'"No!" — Julia\'s answer, and yours.', go:'shoreditch', fx:{hum:10, aff:{julia:12}, flag:'refusedSeparation'}, res:`"No!" breaks in Julia.\n\nIt seems a long time before you answer too. For a moment you seem even to have been deprived of the power of speech. Then: "No."\n\n"You did well to tell me," says O'Brien. "It is necessary for us to know everything."`},

shoreditch:{title:'O\'Brien\'s Flat, leaving', art:'obrien',
  text:`O'Brien explains the Brotherhood. You will never see more than a handful of its members. You will receive orders and obey them. You will work in the dark. There is no possibility that any perceptible change will happen within your own lifetime. "We are the dead," he says. "Our only true life is in the future."

He promises you a book: Goldstein's book. It will reach you in a few days.

At the door you think of something. "Do you happen to know an old rhyme that begins, Oranges and lemons, say the bells of St Clement's?"

Again O'Brien nods. With a sort of grave courtesy he completes the stanza, as if it were a password.

"We shall meet again," you say, "in the place where there is no darkness?"

He nods, without any sign of surprise. "In the place where there is no darkness," he says, as though he has recognised the allusion.`,

// ── XII. HATE WEEK ──────────────────────────────────────────────────────────
Object.assign(BEATS, {
hateweek:{chapter:12, chTitle:'Hate Week', date:'Hate Week, 1984', map:'wild', loc:'square', w:'square', art:'hateweek', song:'hatesong',
  text:`Syme has vanished. A morning came, and he was missing from work: a few thoughtless people commented on his absence. On the next day nobody mentioned him. On the third day you went into the vestibule of the Records Department to look at the notice-board. One of the notices carried a printed list of the members of the Chess Committee, of whom Syme had been one. It looked almost exactly as it had looked before — nothing had been crossed out — but it was one name shorter. It was enough.

Syme has ceased to exist: he has never existed.

Now it is Hate Week. Banners, posters, processions, a new tune called the Hate Song played endlessly on the telescreens. Parsons is in his glory. And on the sixth day, in Victory Square, an Inner Party orator is twenty minutes into a speech against Eurasia when a messenger hurries up on to the platform and slips a scrap of paper into his hand.`,
  fx:{vaporize:'syme'},
  choices:[{t:'Watch.', go:'switch'}]},
switch:{title:'Victory Square, the sixth day', art:'hateweek',
  text:`He unrolls it and reads it without pausing in his speech. Nothing alters in his voice or manner, or in the content of what he is saying. But suddenly the names are different.

Without words said, a wave of understanding rolls through the crowd. Oceania is at war with Eastasia! Oceania has always been at war with Eastasia. Eurasia is an ally.

The banners and posters with which the square is decorated are all wrong! Quite half of them have faces on them that belong to the wrong enemy. It is sabotage! The agents of Goldstein have been at work! The crowd rips the posters from the walls, tears the streamers to rags and tramples them underfoot.

In the confusion a man you have never seen taps you on the shoulder. "Excuse me, I think you've dropped your brief-case." You take it without a word. It is heavy.`,
  fx:{item:'book', hum:3},
  choices:[{t:'Go back to the Ministry. Everyone is being called back.', go:'switchwork'}]},
switchwork:{title:'The Records Department', map:'minitrue', loc:'cubicle', art:'minitrue',
  text:`The voice from the telescreen is already calling: all members of the Records Department are to return to their posts. Every report and record of every kind, newspapers, books, pamphlets, films, sound-tracks, photographs, all have to be rectified at lightning speed. The war with Eurasia never happened. It has always been Eastasia.

You work eighteen hours a day, with the brief-case between your feet, the book in it unread.`,
  game:{type:'rectify', mode:'switch', label:'Rectify the war', win:'reading', lose:'reading', fxWin:{sus:-8}, fxLose:{sus:8, health:-4},
    winText:'By the sixth day the flow of cylinders slackens. Nobody in the world can now prove by documentary evidence that the war with Eurasia ever happened. You go home, and sleep for nine hours.',
    loseText:'You are slow, and make mistakes, and the cylinders keep coming. When it is over you are grey with exhaustion. A supervisor, passing, notes your number.'}}

// ── XIII. THE BOOK ──────────────────────────────────────────────────────────
Object.assign(BEATS, {
reading:{chapter:13, chTitle:'The Book', date:'Hate Week, 1984', map:'room', loc:'bed', w:'shop', art:'room',
  text:`In the room over Mr Charrington's, you open the brief-case. A heavy black volume, amateurishly bound, with no name or title on the cover. On the title page:

${PO('THE THEORY AND PRACTICE OF<br>OLIGARCHICAL COLLECTIVISM<br><small>by Emmanuel Goldstein</small>')}

The sweet summer air plays against your cheek. From somewhere far away floats the faint shouts of children. In the room itself there is no sound except the insect voice of the clock. You settle deeper into the armchair and begin to read.`,
  choices:[
    talk('ch1', 'Read Chapter I: Ignorance is Strength.', `The High, the Middle and the Low. Throughout recorded time the aim of the High has been to remain where they are; the aim of the Middle, to change places with the High; the aim of the Low, when they have one, to abolish all distinctions. The pattern has always repeated. Only now, with the techniques of surveillance, can the Party stop the wheel turning for ever.`, {song:'bookI', hum:4}),
    talk('ch3', 'Read Chapter III: War is Peace.', `The world is divided between three super-states: Oceania, Eurasia, Eastasia. None can conquer the others. They fight endlessly over a rough quadrilateral of disputed territory. The war is not meant to be won; it is meant to be continuous. Its real purpose is to use up the products of the machine without raising the general standard of living.`, {song:'bookIII', map:'oceania', hum:4}),
    talk('julia', 'Read it aloud to Julia.', `"Julia, are you awake?" you say. No answer. She is asleep, curled up like a cat, with her head on your arm. She was never interested in the book; she wanted only to be with you.\n\nYou realise that the book has told you nothing new. It has merely systematised what you knew already. You understand HOW. You do not understand WHY.`, {aff:{julia:5}, hum:2}),
    {t:'Put the book down. Go to the window.', go:'window', if:G => G.flags.t_ch1 || G.flags.t_ch3}
  ]},
window:{title:'The Window', loc:'window', art:'room', song:'fancy',
  text:`The washerwoman is still in the yard, singing, pegging out an endless line of nappies. She has been at it all day. How many children has she had? Fifteen, perhaps. Her body is shapeless, her forearms red, but she is beautiful, you think, in the way the thrush in the wood was beautiful.

If there is hope, it lies in the proles. They have stayed human. They have not become hardened inside.

"We are the dead," you say.

"We are the dead," echoes Julia dutifully.

You could do one thing, before the light goes. The diary is in your pocket.`,
  choices:[
    {t:'Wrap the diary pages in oilcloth and drop them over the wall into the proles\' yard.', if:G => has('diary'), go:'arrest', fx:{flag:'hidDiary', lose:'diary', hum:8}, res:`It lands among the bins with a soft sound. The woman does not look up. Nobody will look there; nobody looks at anything the proles have. Perhaps it will rot. Perhaps, one day, a child will find it.`},
    {t:'Keep the diary. It is yours.', go:'arrest'}
  ]},
arrest:{title:'The Room', art:'arrest',
  text:`"We are the dead," you say again.

"You are the dead," says an iron voice behind you.

You spring apart. Julia's face has turned the colour of paper. The voice came from behind the picture — the engraving of St Clement's.

"It was behind the picture," breathes Julia.

"It was behind the picture," says the voice. "Remain exactly where you are. Make no movement until you are ordered."

The picture falls to the floor, uncovering the telescreen behind it. The room is full of solid men in black uniforms with iron-shod boots and truncheons. Someone picks up the glass paperweight from the table and smashes it to pieces on the hearthstone. A tiny fragment of coral rolls across the mat. How small, you think, how small it always was.

"And by the way, while we are on the subject," says the voice, "Here comes a candle to light you to bed, here comes a chopper to chop off your head!"

Mr Charrington comes into the room. He is no longer stooped. His hair is black. He is a man of about thirty-five, with a cold, alert face. A member of the Thought Police.`,
  fx:G => ({flags:{arrested:true, rhyme4:true, pwSmashed:has('paperweight')}, lose:['paperweight', 'book', 'diary', 'coffee', 'chocolate', 'sash', 'note', 'dictionary'], aff:{charrington:-100}}),
  enter:G => { G.stats.sus = 100; },
  choices:[
    {t:'Stand still.', go:'cell', res:`One of them hits Julia in the solar plexus, and she doubles up like a pocket ruler. They carry her out. That is the last you see of her.`},
    {t:'Reach for Julia.', go:'cell', fx:{health:-15, hum:4, aff:{julia:6}}, res:`A boot comes down. A truncheon. When you can see again, she is gone. You did not even hear her go.`}
  ]}
});


// ── PART THREE ── XIV. THE MINISTRY OF LOVE ─────────────────────────────────
Object.assign(BEATS, {
cell:{chapter:14, chTitle:'The Ministry of Love', date:'Unknown', map:'miniluv', loc:'holding', w:'miniluv', art:'cell',
  text:`You do not know where you are. Presumably in the Ministry of Love, but there is no way of making certain. A high-ceilinged windowless cell with walls of glittering white porcelain. Concealed lamps flood it with cold light, and there is a low steady humming sound that you suppose has something to do with the air supply. Four telescreens, one in each wall.

There is a dull aching in your belly. You have not eaten since they took you. Hours or days, you cannot tell; the light never changes.

${TS('"Smith!" yells a voice from the telescreen. "6079 Smith W.! Hands out of pockets in the cells!"')}

The door opens. A soldier pushes in a mild, dreamy creature with very hairy ears: Ampleforth, the poet.`,
  fx:{meet:'ampleforth', food:-20, hum:-10},
  choices:[
    talk('ample', '"Ampleforth! What are you in for?"', `"There is only one offence, is there not?" he says, blinking. "We were producing a definitive edition of the poems of Kipling. I allowed the word 'God' to remain at the end of a line. I could not help it!" He is almost indignant. "It was impossible to change the line. The rhyme was 'rod'. Do you realise that there are only twelve rhymes to 'rod' in the entire language?"\n\nThe guards take him away. "Room 101," says the officer.`, {hum:3, aff:{ampleforth:8}}),
    {t:'Wait.', go:'parsonscell'}
  ]},
parsonscell:{title:'The Common Cell', art:'cell',
  text:`The next prisoner is Parsons. He is wearing khaki shorts and a sports shirt, and he is weeping.

"You here!" you say.

"Thoughtcrime!" he says, almost blubbering. "Do you know who denounced me? It was my little daughter. She listened at the keyhole. Heard what I was saying in my sleep, and nipped off to the patrols the very next day. Pretty smart for a nipper of seven, eh?" There is a sort of doleful pride in his voice. "I don't bear her any grudge for it. In fact I'm proud of her."

"What did you say?"

"'Down with Big Brother!' Yes, I said that! Said it over and over again, it seems." He drops his voice. "Between you and me, old man, I'm glad they got me before it went any further. You know what I'm going to say to them? 'Thank you,' I'm going to say, 'thank you for saving me before it was too late.'"`,
  choices:[
    {t:'Pity him.', go:'starving', fx:{hum:4, aff:{parsons:6}}},
    {t:'Envy him.', go:'starving', fx:{hum:-3}}
  ]},
starving:{title:'The Common Cell', art:'cell',
  text:`Later — always later — there is a man with a face like a skull, starving to death, his eyes enormous. A chinless man across from him reaches into his overalls and, with a guilty air, holds out a dirty piece of bread.

${TS('"Bumstead!" roars the voice from the telescreen. "2713 Bumstead J.! Let fall that piece of bread!"')}

The chinless man drops it. An officer comes in, and a guard with heavy arms; the guard smashes the chinless man in the mouth so that he flies across the cell. Then the officer turns to the skull-faced man. "Room 101."

The man flings himself on his knees. "Comrade! Officer! You don't have to take me to that place! Haven't I told you everything already? I've got a wife and three children. You can take the whole lot of them and cut their throats in front of my eyes, and I'll stand by and watch it. But not Room 101!"

The piece of bread is still lying on the floor.`,
  choices:[
    {t:'Pick up the bread and eat it.', go:'obrienenters', fx:{health:6, hum:-4}},
    {t:'Leave it where it lies.', go:'obrienenters', fx:{hum:4, health:-4}}
  ]},
obrienenters:{title:'Your Cell', loc:'cell', art:'cell',
  text:`They leave you alone. Hours. You think of Julia, and of O'Brien. O'Brien will have been arrested too. Perhaps somewhere in this building he is being tortured at this moment. Perhaps he will send you a razor blade, so that you can end it.

The door opens with a clang. O'Brien comes in.

"They've got you too!" you cry.

"They got me a long time ago," says O'Brien, with a mild, almost regretful irony. He steps aside. From behind him there emerges a broad-chested guard with a long black truncheon in his hand.

"You knew this, Winston," says O'Brien. "Don't deceive yourself. You did know it — you have always known it."`,
  choices:[{t:'Yes. You had always known it.', go:'bed', fx:{health:-10, hum:-12, aff:{obrien:-20}}, res:`The truncheon comes down on your elbow. The whole world fills with yellow light. You realise, writhing on the floor, that of all things in the world you have one wish: that the pain should stop. Nothing in the world is so bad as physical pain. In the face of pain there are no heroes, no heroes.`}]}

// ── XV. HOW MANY FINGERS? ───────────────────────────────────────────────────
Object.assign(BEATS, {
bed:{chapter:15, chTitle:'How Many Fingers?', loc:'bed', w:'miniluv', art:'fingers',
  text:`You are lying on something that feels like a camp bed, except that it is higher off the ground and you are fixed down so that you cannot move. Light is shining on your face. O'Brien is standing at your side, looking down at you. Beside him, a machine with a dial, the face marked with numbers up to a hundred.

"You are a slow learner, Winston," says O'Brien gently.

"How can I help it? How can I help seeing what is in front of my eyes? Two and two are four."

"Sometimes, Winston. Sometimes they are five. Sometimes they are three. Sometimes they are all of them at once. You must try harder. It is not easy to become sane."

He holds up his left hand, its back towards you, with the thumb hidden and the four fingers extended.`,
  game:{type:'fingers', label:'"How many fingers am I holding up?"', win:'lastman', lose:'lastman'}},
lastman:{title:'The Bed', song:'catechism', art:'fingers',
  text:`"Power is not a means; it is an end," says O'Brien. "One does not establish a dictatorship in order to safeguard a revolution; one makes the revolution in order to establish the dictatorship. The object of persecution is persecution. The object of torture is torture. The object of power is power."

He is not lying. He believes every word. That is the most terrible thing.

"If you want a picture of the future, imagine a boot stamping on a human face — for ever."

You say something feeble about the spirit of Man. "Something in the universe — I don't know, some spirit, some principle — that you will never overcome."

"You are the last man," says O'Brien. "You are the guardian of the human spirit. You shall see yourself as you are." He makes you stand before a mirror: a bowed, grey-coloured, skeleton-like thing.

"I have not betrayed Julia," you say.

O'Brien looks down at you thoughtfully. "No," he says, "no; that is perfectly true. You have not betrayed Julia."`,
  choices:[
    {t:'Hold on to that. It is the one thing left.', go:'slate', fx:{hum:8}},
    {t:'Weep.', go:'slate', fx:{hum:2, health:2}}
  ]},
slate:{title:'Your Cell, later', loc:'cell', art:'cell',
  text:`They feed you now. They let you wash. Your body is filling out. They have given you a slate and a stump of pencil, and you have begun to write the things they want, and to believe them, or almost.

${DL('FREEDOM IS SLAVERY')}
${DL('TWO AND TWO MAKE FIVE')}
${DL('GOD IS POWER')}

You accept everything. The past is alterable. The past has never been altered. Oceania is at war with Eastasia. Oceania has always been at war with Eastasia. Jones, Aaronson and Rutherford were guilty. You never saw the photograph that disproved their guilt. It never existed; you invented it.

And then, one night, half asleep, you hear yourself crying out loud:

"Julia! Julia! Julia, my love! Julia!"`,
  choices:[
    {t:'They will have heard. Let them.', go:'question', fx:{hum:8}, log:'Julia, Julia, Julia, my love.'},
    {t:'Say it was a dream. Only a dream.', go:'question', dt:6}
  ]},
question:{title:'Your Cell', art:'cell', fx:{hum:-12},
  text:`O'Brien comes in, not unkindly. "Tell me, Winston — and remember, no lies: you know that I am always able to detect a lie — tell me, what are your true feelings towards Big Brother?"

"I hate him."

"You hate him. Good. Then the time has come for you to take the last step. You must love Big Brother. It is not enough to obey him: you must love him."

He releases you towards the guards with a little push.

"Room 101," he says.`,
  choices:[{t:'Go.', go:'room101'}]}
});

// ── XVI. ROOM 101 ───────────────────────────────────────────────────────────
Object.assign(BEATS, {
room101:{chapter:16, chTitle:'Room 101', loc:'room101', w:'miniluv', art:'rats',
  text:`It is many metres underground, as deep down as it is possible to go. You are strapped upright in a chair, so tightly that you cannot even move your head. O'Brien is standing at your side.

"You asked me once," says O'Brien, "what was in Room 101. I told you that you knew the answer already. Everyone knows it. The thing that is in Room 101 is the worst thing in the world."

He carries over to you a wire cage, with a handle on top. There is something like a fencing mask fitted to the end of it, with the concave side outwards. In the cage, two great brown rats.

"In your case," says O'Brien, "the worst thing in the world happens to be rats."

The mask is coming closer. You can hear the shrill squeals of the rats. There is one thing, you know, only one, that can save you. You must interpose another human being, the body of another human being, between yourself and the rats.`,
  choices:[
    {t:'"Do it to Julia! Not me! Julia! I don\'t care what you do to her. Tear her face off, strip her to the bones. Not me! Julia! Not me!"', go:'chestnut', cls:'red', fx:{flag:'betrayed', hum:-30}, res:`You are falling backwards, into enormous depths, away from the rats. You are still strapped in the chair, but you have fallen through the floor, through the walls of the building, through the earth, through the oceans, through the atmosphere, into outer space.\n\nBut through the darkness that enveloped you, you hear another metallic click, and know that the cage door has clicked shut and not open.`},
    {t:'Hold her name in your mouth like a stone, and say nothing.', if:G => G.stats.hum >= 60 && G.ringUses <= 7 && !G.flags.sworeApart, go:'end_lastman', tag:'only the very last man could do this'}
  ]}

// ── XVII. THE CHESTNUT TREE ─────────────────────────────────────────────────
Object.assign(BEATS, {
chestnut:{chapter:17, chTitle:'The Chestnut Tree', date:'Some time later', map:'wild', loc:'chestnut', w:'chestnut', art:'chestnut', song:'chestnut',
  text:`The Chestnut Tree Café is almost empty. A ray of sunlight slanting through a window falls on dusty table-tops. It is the lonely hour of fifteen. A tinny music trickles from the telescreens.

You sit in your usual corner, gazing into an empty glass. Now and again you glance up at a vast face that looks down at you from the opposite wall. BIG BROTHER IS WATCHING YOU, the caption says. Unbidden, a waiter comes and fills your glass up with Victory Gin, shaking into it a few drops from another bottle with a quill through the cork. It is saccharine flavoured with cloves, the speciality of the café.

They always know your table. The chessboard is waiting, a problem set out: White to play and mate in two moves. White always mates. It is a kind of mystical truth.

Almost unconsciously, in the dust on the table, you trace with your finger:

${DL('2+2=5')}`,
  choices:[
    {t:'Remember the day you met Julia in the Park.', go:'julia_park'}
  ]},
julia_park:{title:'The Park, in March', art:'none',
  text:`You had seen her once. In the Park, on a vile, biting day in March. She was thicker, and stiffer. When you put your arm round her waist there was no response; it was like embracing a stone. She did not even try to get away.

"I betrayed you," she said baldly.

"I betrayed you," you said.

"Sometimes," she said, "they threaten you with something — something you can't stand up to, can't even think about. And then you say, 'Don't do it to me, do it to somebody else, do it to so-and-so.' And after that, you don't feel the same towards the other person any longer."

"No," you said, "you don't feel the same."

There did not seem to be anything more to say. You walked a little way together, and then she was gone.

Behind you, in the café, the telescreen breaks off its music. A trumpet call: a news flash from the African front. A great victory.`,
  choices:[
    {t:'Listen to the bulletin.', go:G => G.flags.hidDiary ? 'end_appendix' : 'end_brother'}
  ]}
});

// ── ENDINGS ─────────────────────────────────────────────────────────────────
Object.assign(BEATS, {
end_brother:{ending:'bad', title:'He Loved Big Brother', art:'bigbrother', text:`The voice from the telescreen is still pouring forth its tale of prisoners and booty and slaughter, but the shouting outside has died down a little. The waiters are returning to their work. One of them approaches with the gin bottle.

You sit in a blissful dream, paying no attention as your glass is filled up. You are not running or cheering any longer. You are back in the Ministry of Love, with everything forgiven, your soul white as snow. You are in the public dock, confessing everything, implicating everybody. You are walking down the white-tiled corridor, with the feeling of walking in sunlight, and an armed guard at your back. The long-hoped-for bullet is entering your brain.

You gaze up at the enormous face. Forty years it has taken you to learn what kind of smile was hidden beneath the dark moustache. O cruel, needless misunderstanding! O stubborn, self-willed exile from the loving breast! Two gin-scented tears trickle down the sides of your nose.

But it is all right, everything is all right, the struggle is finished. You have won the victory over yourself.

You love Big Brother.`},
end_lastman:{ending:'good', title:'The Last Man in Europe', art:'rats', text:`You say nothing.

The mask comes closer. You can feel the warmth of the rats' breath. You think of the thrush on the hazel bough, singing for no one. You think of a woman in a yard, pegging out nappies. You think of a girl in a bluebell wood, breaking a slab of chocolate in two. You do not say her name. You do not say anything at all.

What happened next is not in any record, and never will be. The record was rectified. But O'Brien, who was always able to detect a lie, stood for a long time afterwards with his spectacles in his hand, not resettling them.

To die hating them: that was freedom. They could make you say anything — anything — but they could not make you believe it. They could not get inside you.

They shot you in the back of the neck, in a white-tiled corridor, without warning, as they always do. You were not cured. You were the last man. And somewhere, outside, a thrush was singing.`},
end_appendix:{ending:'good', title:'The Principles of Newspeak', art:'golden', text:`You loved Big Brother. They made sure of that, and then they shot you, in the end, as they always do.

But some years later — how many, the record does not say, because the record no longer works the way it did — a child in a prole yard, digging among the bins for something to sell, found a parcel of oilcloth. Inside it, damp and foxed and nearly illegible, were pages written in a small, clumsy hand.

To the future or to the past, to a time when thought is free…

Freedom is the freedom to say that two plus two make four…

The pages passed from hand to hand. Nobody in that yard knew who W. Smith had been. Nobody needed to.

Later still, a scholar writing a dry appendix on a dead language called Newspeak wrote of it, quite naturally, in the past tense — as of something that had been, and was no longer. If there was hope, it lay in the proles. It always had.`},
end_goodparty:{ending:'bad', title:'A Good Party Member', art:'minitrue', text:`You never write another word that is your own.

You are promoted, twice. You are on the Chess Committee and the Hate Week sub-committee for streamers and flags. Your ulcer heals. You become, in time, a man of whom nobody has ever had anything to say. When Syme vanishes, you do not notice the gap in the list. When the enemy changes in the middle of a sentence, you change with it, and do not notice that either.

Sometimes, on very bright cold days in April, when the clocks strike thirteen, you feel a small, unaccountable tug, as if you had once put something down and forgotten where. Then the feeling passes.

You were never arrested. There was nothing in you to arrest.`},
fallen:{ending:'fail', title:'The Record Ends', text:`Your body gives out before they have finished with you, or before you have finished with yourself.

<em>But that is not how the record reads. The Ministry of Truth can rectify anything. Go back to the start of the chapter.</em>`},
vaporized:{ending:'fail', title:'Vaporized', art:'telescreen', text:`It always happens at night. The sudden jerk out of sleep, the rough hand shaking your shoulder, the lights glaring in your eyes, the ring of hard faces round the bed.

In the vast majority of cases there is no trial, no report of the arrest. People simply disappear. Your name is removed from the registers; every record of everything you ever did is wiped out; your one-time existence is denied and then forgotten. You are abolished, annihilated: vaporized is the usual word.

<em>You drew too much attention. Go back to the start of the chapter, and remember: the telescreen is always on.</em>`},
crimestop:{ending:'fail', title:'Crimestop', art:'bigbrother', text:`Crimestop: the faculty of stopping short, as though by instinct, at the threshold of any dangerous thought. You have learned it perfectly. You no longer need to doublethink. There is nothing left to think double about.

You are a good Party member now. There is nothing inside you that they would need to reach.

<em>You gave too much of yourself away to stay safe. Go back to the start of the chapter, and keep something back.</em>`}
});

  return `<div class="ending">${art}<div class="chaphead"><div class="cn">${g === 'fail' ? 'THE RECORD IS INCOMPLETE' : 'THE END'}</div></div><h2>${esc(b.title)}</h2><div class="rule"></div>

      <div class="article" style="border-color:#a3201b"><div class="hd" style="color:#a3201b">The present</div>${esc(q.fact)}</div>
      <div class="opts">${shuffle([q.a].concat(q.x)).map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answer(b.dataset.o));
  }
  function answer(o){
    if (lock || over) return; lock = true;
    const ok = o === qs[i].a; if (ok){ right++; SND.fx('good'); ui.msg.textContent = pick(['Into the memory hole with the original. Clean.','Accepted. The past has always been like this.','Up the tube it goes.']); }
    else { SND.fx('bad'); ui.msg.textContent = 'Inconsistent. A query comes back down the tube. (Correct: ' + qs[i].a + ')'; }
    SND.fx('splash'); i++; setTimeout(show, 1500);
  }
  show();
  const stop = ticker(dt => { if (over || lock) return; left -= dt; ui.hud.innerHTML = `<span>Cylinder <b>${i + 1}/${N}</b></span><span>Accepted <b>${right}</b></span><span>Time <b>${Math.ceil(left)}s</b></span>`;
    if (left <= 0){ lock = true; ui.msg.textContent = 'Too slow. The cylinder goes up the tube unfinished.'; SND.fx('bad'); i++; setTimeout(show, 1400); } });
  return {stop};
};

// ── Newspeak: Syme's test ───────────────────────────────────────────────────
const NEWSPEAK = [
  {q:'What is the Newspeak for "excellent" or "splendid"?', a:'plusgood', o:['plusgood','goodwise','supergood','bestful']},
  {q:'And for "very bad", the strongest possible?', a:'doubleplusungood', o:['doubleplusungood','superbad','plusbad','ungoodful']},
  {q:'What is the Newspeak for "bad"?', a:'ungood', o:['ungood','notgood','bad','minusgood']},
  {q:'The faculty of stopping short at the threshold of any dangerous thought?', a:'crimestop', o:['crimestop','thinkstop','goodthink','blackwhite']},
  {q:'Individualism and eccentricity; taking a solitary walk?', a:'ownlife', o:['ownlife','selfthink','unlife','freewalk']},
  {q:'An improper expression on your face?', a:'facecrime', o:['facecrime','looksin','ungoodface','thoughtface']},
  {q:'A person who has been vaporized, and never existed?', a:'unperson', o:['unperson','experson','nobody','deadthink']},
  {q:'What is the Newspeak name for the Ministry of Love?', a:'Miniluv', o:['Miniluv','Minilove','Lovemin','Minipax']},
  {q:'To believe that black is white, and to know it, and to forget you ever believed otherwise?', a:'blackwhite', o:['blackwhite','doubleknow','grayspeak','crimestop']},
  {q:'Orthodox in thought, and without needing to think?', a:'goodthinkful', o:['goodthinkful','plusright','thinkgood','oldthink']},
  {q:'The language spoken before Newspeak?', a:'Oldspeak', o:['Oldspeak','Prolespeak','Englishwise','Pastspeak']}
];
GAMES.newspeak = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Syme\'s Test', '', 'Answer five questions in Newspeak. Syme is watching your face more than your answers.');
  const qs = shuffle(NEWSPEAK.slice()).slice(0, 5); let i = 0, right = 0, left = 18, over = false, lock = false;
  const OK = ['"Exactly. You see the beauty of it."','"Good. Very good — plusgood, I should say."','Syme nods, delighted, his eyes bulging.'];
  const NO = ['"No, no. Still thinking in Oldspeak."','Syme looks at you with a kind of pity.','"You haven\'t a real appreciation of Newspeak."'];
  function show(){
    if (i >= qs.length){ over = true; return done({win:right >= 3, score:right / 5, msg:`You answered ${right} of 5.`}); }
    const q = qs[i]; left = 18; lock = false;
    ui.body.innerHTML = `<div class="riddle" style="font-family:'Special Elite',monospace">${esc(q.q)}</div><div class="opts">${shuffle(q.o.slice()).map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answer(b.dataset.o));
  }
  function answer(o){
    if (lock || over) return; lock = true;
    const ok = o === qs[i].a; if (ok){ right++; SND.fx('good'); } else SND.fx('bad');
    ui.msg.textContent = ok ? pick(OK) : pick(NO) + ` (It was: ${qs[i].a}.)`;
    i++; setTimeout(show, 1400);
  }
  show();
  const stop = ticker(dt => { if (over || lock) return; left -= dt; ui.hud.innerHTML = `<span>Word <b>${i + 1}/5</b></span><span>Right <b>${right}</b></span><span><b>${Math.ceil(left)}s</b></span>`;
    if (left <= 0){ ui.msg.textContent = 'Syme taps his spoon. "Too slow."'; lock = true; i++; setTimeout(show, 1300); } });
  return {stop};
};

// ── Steamer: rocket bombs in the prole streets ──────────────────────────────
GAMES.steamer = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Steamer!', '', 'Move along the street with <b>← →</b> (or A / D), or tap where you want to go. A shadow and a whistle mark where a rocket bomb will land. Be somewhere else. Picking up dropped coins is allowed. Probably.');
  const {c, x} = mkCanvas(ui.body, 760, 300);
  const GY = 240, DUR = 26;
  let px = 380, tx = 380, t = 0, bombs = [], coins = [], next = 1.2, hp = 3, over = false, inv = 0, cash = 0, dust = [];
  c.addEventListener('pointerdown', e => { const [xx] = canvasPos(c, e); tx = clamp(xx, 20, 740); });
  const keys = {};
  const stop = ticker(dt => {
    if (over) return;
    t += dt; next -= dt; inv = Math.max(0, inv - dt);
    if (keys.left) tx = px - 40; if (keys.right) tx = px + 40;
    tx = clamp(tx, 20, 740); px += clamp(tx - px, -260 * dt, 260 * dt);
    if (next <= 0 && t < DUR - 1.5){ next = Math.max(.5, 1.4 - t * .035) * rnd(.7, 1.2);
      bombs.push({x: Math.random() < .45 ? clamp(px + rnd(-60, 60), 30, 730) : rnd(30, 730), warn:1.3, r:70}); }
    if (Math.random() < dt * .5) coins.push({x:rnd(30, 730), l:5});
    bombs.forEach(b => { b.warn -= dt; if (b.warn <= 0 && !b.hit){ b.hit = true; SND.fx('boom');
      for (let i = 0; i < 18; i++) dust.push({x:b.x, y:GY, vx:rnd(-160, 160), vy:-rnd(80, 260), l:1});
      if (Math.abs(b.x - px) < b.r && inv <= 0){ hp--; inv = 1; ui.msg.textContent = pick(['The blast throws you flat.','Plaster and glass rain down on you.','Your ears sing. You are on the ground.']); }
      else ui.msg.textContent = pick(['A house folds up like cardboard.','Somebody screams, then stops.','Dust. Then the street goes on.']); } });
    bombs = bombs.filter(b => b.warn > -.6);
    coins.forEach(k => { k.l -= dt; if (Math.abs(k.x - px) < 16 && k.l > 0){ k.l = 0; cash++; SND.fx('click'); } }); coins = coins.filter(k => k.l > 0);
    dust.forEach(d => { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 400 * dt; d.l -= dt; }); dust = dust.filter(d => d.l > 0);
    // draw
    x.fillStyle = '#8e979c'; x.fillRect(0, 0, 760, 300);
    for (let i = 0; i < 12; i++){ const hx = i * 66; x.fillStyle = i % 2 ? '#6e6052' : '#7a6a5a'; x.fillRect(hx, 90 + (i % 3) * 10, 64, GY - 90 - (i % 3) * 10); x.fillStyle = '#2c2a26'; x.fillRect(hx + 12, 130, 12, 16); x.fillRect(hx + 40, 130, 12, 16); }
    x.fillStyle = '#4e4a44'; x.fillRect(0, GY, 760, 60);
    bombs.forEach(b => { if (b.warn > 0){ const a = 1 - b.warn / 1.3; x.fillStyle = `rgba(0,0,0,${.15 + a * .45})`; x.beginPath(); x.ellipse(b.x, GY + 8, b.r * (.4 + a * .6), 10, 0, 0, 7); x.fill();
        x.fillStyle = '#222'; x.fillRect(b.x - 3, GY - 260 + a * 240, 6, 18); } else { x.fillStyle = `rgba(255,200,120,${.6 + b.warn})`; x.beginPath(); x.arc(b.x, GY, b.r * (1 - b.warn), 0, 7); x.fill(); } });
    coins.forEach(k => { x.fillStyle = '#c8c0a0'; x.beginPath(); x.arc(k.x, GY + 14, 5, 0, 7); x.fill(); });
    dust.forEach(d => { x.fillStyle = `rgba(220,214,200,${d.l})`; x.fillRect(d.x, d.y, 4, 4); });
    x.globalAlpha = inv > 0 && Math.floor(t * 12) % 2 ? .4 : 1;
    x.fillStyle = '#1f3f73'; x.fillRect(px - 8, GY - 30, 16, 30); x.fillStyle = '#d6c6b0'; x.beginPath(); x.arc(px, GY - 38, 8, 0, 7); x.fill(); x.globalAlpha = 1;
    const prog = Math.min(1, t / DUR); x.fillStyle = 'rgba(0,0,0,.4)'; x.fillRect(20, 10, 720, 8); x.fillStyle = '#a3201b'; x.fillRect(20, 10, 720 * prog, 8);
    ui.hud.innerHTML = `<span>Luck <b>${'♦'.repeat(Math.max(0, hp))}</b></span><span>Coins <b>$${cash}</b></span>`;
    if (hp <= 0){ over = true; done({win:false, score:prog, fx: cash ? {cash} : null}); }
    else if (t >= DUR){ over = true; done({win:true, score:1, fx: cash ? {cash} : null, msg: cash ? `You picked up $${cash} from the gutter. Nobody saw. Probably.` : ''}); }
  });
  return {stop, key(e){ const d = KEYMAP[e.key]; if (d === 'left' || d === 'right'){ e.preventDefault(); keys[d] = true; } }, keyup(e){ const d = KEYMAP[e.key]; if (d) keys[d] = false; }};
};

// ── Fingers: O'Brien and the dial ───────────────────────────────────────────
GAMES.fingers = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'How Many Fingers?', '', 'O\'Brien always knows when you are lying. Telling the truth raises the dial. Lying lowers your humanity. You need to come through with your body, and something else, still intact.');
  const R = [
    {s:'"How many fingers am I holding up, Winston?"', o:[{t:'"Four."', k:'true'},{t:'"Five."', k:'lie'},{t:'"I don\'t know."', k:'yield'}]},
    {s:'"And if the Party says that it is not four but five — then how many?"', o:[{t:'"Four."', k:'true'},{t:'"Five! Five! Five!"', k:'lie'},{t:'"How can I help seeing what is in front of my eyes?"', k:'true'}]},
    {s:'"You are lying. You still think there are four. How many fingers, please?"', o:[{t:'"Four! Stop it, stop it!"', k:'true'},{t:'"Five! Stop it!"', k:'lie'},{t:'"I don\'t know. I don\'t know."', k:'yield'}]},
    {s:'"Better," says O\'Brien. "Do you remember writing in your diary, Freedom is the freedom to say that two plus two make four?"', o:[{t:'"Yes."', k:'true'},{t:'"No."', k:'lie'},{t:'"Whatever you wish me to remember."', k:'yield'}]},
    {s:'"Does Big Brother exist?"', o:[{t:'"Does he exist in the same way as I exist?"', k:'true'},{t:'"Of course he exists."', k:'yield'},{t:'"No."', k:'lie'}]},
    {s:'"Does the past exist concretely, in space? Is there somewhere a world of solid objects, where the past is still happening?"', o:[{t:'"No."', k:'yield'},{t:'"I do not know. I believe it does."', k:'true'},{t:'"There is no past."', k:'lie'}]},
    {s:'"How many fingers, Winston?"', o:[{t:'"I don\'t know. Four, five, six — in all honesty I don\'t know."', k:'yield'},{t:'"Four."', k:'true'},{t:'"Five."', k:'lie'}]}];
  const W = {true:[18, 6, -8], lie:[14, -9, -5], yield:[-6, -3, 0]};   // [dial, humanity, health]
  let i = 0, dial = 10, hum = 0, hp = 0, over = false;
  const dialSVG = v => { const a = Math.PI * (1 + v / 100); return `<svg viewBox="0 0 150 90"><path d="M15,80 A60,60 0 0,1 135,80" fill="none" stroke="#555" stroke-width="10"/><path d="M15,80 A60,60 0 0,1 ${75 + Math.cos(a) * 60},${80 + Math.sin(a) * 60}" fill="none" stroke="#a3201b" stroke-width="10"/><path d="M75,80 L${75 + Math.cos(a) * 52},${80 + Math.sin(a) * 52}" stroke="#111" stroke-width="3"/><text x="75" y="88" text-anchor="middle" font-family="Oswald,sans-serif" font-size="12">${Math.round(v)}</text></svg>`; };
  function show(){
    if (i >= R.length){ over = true;
      return done({win: hum >= 0, score:clamp(.5 + hum / 40, 0, 1), fx:{hum, health:hp},
        msg: hum >= 10 ? 'For a moment, just for a moment, you saw four fingers. You still see them.' : hum >= 0 ? 'You do not know any more how many there were. But you remember that you knew, once.' : 'You saw five. You really saw five. The dial goes back to zero, and you are grateful, and you love him for it.'}); }
    const r = R[i];
    ui.body.innerHTML = `<div class="art" style="cursor:default">${VIGNETTES.fingers()}</div><div class="smaugline">${esc(r.s)}</div>
      <div class="dial">${dialSVG(dial)}<span class="meta">the dial</span></div>
      <div class="choices">${shuffle(r.o.slice()).map(o => `<button class="choice talk" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answer(b.dataset.k));
    ui.hud.innerHTML = `<span>Question <b>${i + 1}/${R.length}</b></span>`;
  }
  function answer(k){
    if (over) return;
    const [d, h, p] = W[k]; dial = clamp(dial + d, 0, 100); hum += h; hp += p - Math.round(dial / 12);
    ui.msg.textContent = k === 'true' ? pick(['The needle swings up. Your body arches.','"You are a slow learner, Winston."']) : k === 'lie' ? pick(['"You are lying," he says gently. The needle climbs anyway.','"No, Winston, that is no use."']) : pick(['"Better," says O\'Brien.','The needle sinks a little. You almost weep with gratitude.']);
    SND.fx(k === 'yield' ? 'click' : 'hit');
    if (dial >= 100){ over = true; return done({win:false, score:0, fx:{hum, health:hp - 20}, msg:'The pain is too much. You go out like a light.'}); }
    i++; setTimeout(show, 900);
  }
  show();
  return {stop(){}};
};

// ═══ TITLE, MENU, BOOT ══════════════════════════════════════════════════════
function renderTitle(){
  const sv = tryLoad();
  $('#stage').innerHTML = `<div class="titlescr">${VIGNETTES.bigbrother()}
    <h1>Thoughtcrime</h1><div class="sub">being the diary of Winston Smith, of the Records Department, Ministry of Truth — April 1984</div>
    <div class="verse">WAR IS PEACE<br>FREEDOM IS SLAVERY<br>IGNORANCE IS STRENGTH</div>
    <div class="btns">${sv ? `<button class="btn gold" data-load>Continue — Chapter ${romanize(sv.chapter)}: ${esc(sv.chTitle || '')}</button>` : ''}<button class="btn" data-new>Begin: a bright cold day in April</button></div>
    <p class="meta" style="margin-top:18px;max-width:580px;margin-left:auto;margin-right:auto">Three parts, seventeen chapters, ${Object.keys(SONGS).length} texts and songs, ${Object.keys(MAPS).length} maps, two stealth maps and eight trials. Keep your <b>Humanity</b> and <b>Health</b>; watch your <b>Suspicion</b> — at 100 you are vaporized. <b>Doublethink</b> is always the safe choice, and it always costs you something. An unofficial game after George Orwell's novel; short quotations from the novel, connecting prose new.</p></div>`;
  wireStage();
  const nb = $('#stage').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Begin again? Your saved record will be lost.')) startNew(); };
}
function openMenu(){
  openModal(`<div class="ptitle" style="font-size:1.2rem;text-align:center">Menu</div>
    <div class="choices" style="max-width:420px">
      ${G && G.checkpoint ? `<button class="choice" id="mcp">↺ Rectify: back to the start of this chapter (${esc(G.chTitle)})</button>` : ''}
      <button class="choice" id="mhelp">How to play</button>
      <button class="choice" id="msnd">${SND.on ? '♪ Sound effects: on' : '♪ Sound effects: off'}</button>
      <button class="choice" id="mnew">Begin again</button>
      ${G ? '<button class="choice" id="mtitle">Back to the title page</button>' : ''}
    </div><p class="meta center">Your progress is saved automatically after every step. So is everything else.</p>`);
  const q = id => document.getElementById(id);
  if (q('mcp')) q('mcp').onclick = () => { if (confirm('Go back to the start of this chapter?')) restoreCheckpoint(); };
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.2rem">How to play</div><div class="text">${paras(`You are Winston Smith, thirty-nine, a clerk in the Records Department of the Ministry of Truth, and you have just bought a diary. Read, choose, and play your way through Oceania.

<b>Humanity</b> is what is inside you: memory, love, the knowledge that two and two make four. It grows when you hold on to the truth. At nothing, you have become a good Party member and the story ends. <b>Health</b> is your body. <b>Suspicion</b> is the Thought Police's interest in you; at 100 you are vaporized. <b>Rations</b> are eaten when you travel; <b>Dollars</b> buy things in the prole quarter.

Choices marked with a half-black circle are <b>doublethink</b>: the safe, orthodox way out. They lower suspicion — and cost humanity. How much humanity you have left by Room 101 decides how the story ends, and so does what you do with your diary.

Trials along the way: writing in the diary out of the telescreen's sight, the Two Minutes Hate, the Physical Jerks, rectifying the Times, Syme's Newspeak test, a rocket bomb, a stealth walk to the Golden Country and another to O'Brien's door (arrow keys, or click to walk; hide in bushes and doorways; R to doublethink), and O'Brien's dial. Every one can be skipped.

The side panel holds the London map with the record of your movements, the persons you know (and those who have become unpersons), your pockets, the texts and songs you have recorded (sing them), the maps you have reached, and your diary. There is a side-quest to recover an old rhyme, line by line.`)}</div>`);
  q('msnd').onclick = () => { SND.on = !SND.on; openMenu(); updateSoundBtn(); };
  q('mnew').onclick = () => { if (!G || confirm('Begin again? Your current progress will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; render(); };
}
function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound effects on' : 'Sound effects off'; }

$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    return;
  }
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#stage').querySelectorAll('.choices button'); const b = btns[+e.key - 1]; if (b) b.click();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; if (UI.game && UI.inst && UI.inst.keyup) UI.inst.keyup(e); });
window.addEventListener('blur', () => { UI.keys = {}; });

updateSoundBtn();
G = null;
render();
</script>
