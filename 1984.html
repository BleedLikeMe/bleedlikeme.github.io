<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thoughtcrime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d0e;--ink2:#5c4327;--ink3:#8a6c45;--parch:#f2e4c0;--parch2:#e6d09c;--edge:#a8834a;
  --gold:#c9a227;--gold2:#ffd76a;--red:#8b1e1e;--elf:#2f5f4f;--sea:#9fb4a8;--bg:#1a120b;--bg2:#2b1d12;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#140d07 radial-gradient(ellipse at 50% 0%,#3a2716 0%,#140d07 70%);color:var(--ink);
  font-family:'Crimson Pro',Georgia,'Times New Roman',serif;font-size:17px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.sview{position:relative}
.sdpad{display:none}
.hidden{display:none!important}

/* header */
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(#2e1f12,#1b120a);
  border-bottom:2px solid #6b4c22;color:#e9d6a6;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em;color:var(--gold2);
  text-shadow:0 0 8px rgba(255,190,60,.35);white-space:nowrap}
.brand span{display:block;font-size:.62rem;letter-spacing:.3em;color:#b99a62;font-weight:500}
#stats{display:flex;gap:12px;flex:1;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font-size:.9rem;min-width:110px}
.stat .lbl{color:#c8ad78;font-variant:small-caps;letter-spacing:.05em}
.bar{width:70px;height:8px;background:#0e0905;border:1px solid #6b4c22;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.ringicon{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 6px var(--gold);transition:all .5s}
.date{font-style:italic;color:#cdb47f;font-size:.88rem;margin-left:auto;white-space:nowrap}
.hbtns button{background:#3b2815;border:1px solid #7a5a2c;color:#f0dca8;border-radius:6px;padding:4px 10px;font-size:1rem;margin-left:4px}
.hbtns button:hover{background:#4d351c}

/* layout */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;max-width:1440px;margin:0 auto;padding:14px}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(140,100,40,.18),transparent 55%);
  border:1px solid var(--edge);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,30,.25)}
#stage{padding:18px 26px 26px;min-height:70vh}
#side{display:flex;flex-direction:column;min-height:70vh;max-height:calc(100vh - 90px);position:sticky;top:76px}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
#tabs button{flex:1;background:transparent;border:0;border-right:1px solid rgba(168,131,74,.4);padding:8px 4px;
  font-family:'Oswald',sans-serif;font-size:.72rem;color:var(--ink2);letter-spacing:.04em}
#tabs button.on{background:rgba(201,162,39,.22);color:var(--ink);font-weight:700}
#panel{padding:12px 14px;overflow-y:auto;flex:1}

/* stage */
.chaphead{text-align:center;margin-bottom:6px}
.chaphead .cn{font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.35em;color:var(--ink3)}
.chaphead h2{font-family:'Oswald',sans-serif;margin:2px 0 0;font-size:1.55rem;color:var(--ink);letter-spacing:.03em}
.chaphead .where{font-style:italic;color:var(--ink2);font-size:.95rem}
.rule{height:10px;margin:8px auto 12px;width:60%;background:radial-gradient(circle,var(--edge) 2px,transparent 3px) center/14px 10px repeat-x;opacity:.7}
.art{margin:0 auto 12px;max-width:760px;cursor:zoom-in;position:relative}
.art svg{width:100%;height:auto;display:block;border-radius:3px}
.art .hint{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--ink2);background:rgba(242,228,192,.85);padding:1px 6px;border-radius:3px}
.text{max-width:760px;margin:0 auto}
.text p{font-size:1.12rem;line-height:1.62;margin:0 0 .85em}
.text p.first::first-letter{font-family:'Special Elite',monospace;float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--red)}
.text .speech{color:#3b2a14}
.text em{color:#4a3518}
.choices{max-width:760px;margin:16px auto 0;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:rgba(252,251,247,.55);border:1px solid var(--edge);border-radius:4px;padding:10px 14px;
  font-size:1.05rem;color:var(--ink);transition:all .15s;position:relative}
.choice:hover{background:#ffffff;transform:translateX(3px);box-shadow:0 2px 8px rgba(90,60,20,.25)}
.choice .tag{font-size:.75rem;color:var(--ink3);font-variant:small-caps;margin-left:6px}
.choice.ring{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,215,106,.35),rgba(252,251,247,.5));}
.choice.ring::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-radius:50%;margin-right:8px;vertical-align:-1px;box-shadow:0 0 5px var(--gold)}
.choice.talk::before{content:'❝ ';color:var(--elf)}
.choice.go{font-weight:600}
.choice.game{border-style:double;border-width:3px}
.choice[disabled]{opacity:.45;pointer-events:none}
.choice.disabled-choice{opacity:.55;font-style:italic}
.result{max-width:760px;margin:10px auto;border-left:3px solid var(--edge);padding:6px 14px;background:rgba(252,251,247,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:2px 8px;border-radius:10px;border:1px solid var(--edge);background:#f2f0e8}
.chip.good{border-color:#4f7d3a;color:#2f5a1c;background:#eef6dc}
.chip.bad{border-color:#9c3b2b;color:#7a2416;background:#f8e2d8}
.chip.ring{border-color:var(--gold);background:#fff1b8;color:#6b4c00}
.btn{background:linear-gradient(#5b3f1f,#3c2912);color:#f6e4b4;border:1px solid #2a1a0a;border-radius:4px;padding:9px 18px;
  font-family:'Oswald',sans-serif;font-size:.9rem;letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.btn:hover{background:linear-gradient(#6d4c26,#4a3317)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--edge);box-shadow:none}
.btn.gold{background:linear-gradient(#e9c45a,#b88d1c);color:#2b1d0e;border-color:#7a5a10}
.center{text-align:center}

/* song card */
.song{max-width:560px;margin:14px auto;padding:14px 22px;background:rgba(255,252,240,.6);border:1px solid var(--edge);
  border-radius:4px;font-family:'Special Elite',monospace;position:relative}
.song h3{font-family:'Oswald',sans-serif;font-size:1rem;margin:0 0 2px;text-align:center}
.song .by{text-align:center;font-style:italic;font-size:.85rem;color:var(--ink3);margin-bottom:8px}
.song .st{margin:0 0 10px}
.song .ln{display:block;font-size:1.05rem;line-height:1.45;transition:color .2s,background .2s;padding:0 4px;border-radius:3px}
.song .ln.lit{background:rgba(201,162,39,.3);color:#000}
.song .sing{display:block;margin:6px auto 0}

/* side panels */
.ptitle{font-family:'Oswald',sans-serif;font-size:.95rem;margin:4px 0 8px;color:var(--ink);letter-spacing:.04em}
.char{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--edge)}
.char .av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;color:#fff;font-size:1rem;border:2px solid rgba(0,0,0,.25)}
.char .nm{font-weight:600}
.char .ds{font-size:.85rem;color:var(--ink2);line-height:1.3}
.char .here{font-size:.7rem;color:var(--elf);font-variant:small-caps;margin-left:4px}
.abar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.abar i{position:absolute;top:0;bottom:0;border-radius:3px}
.item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--edge)}
.item .ic{font-size:1.5rem;width:34px;text-align:center}
.item .nm{font-weight:600}.item .ds{font-size:.85rem;color:var(--ink2)}
.songli,.mapli{display:block;width:100%;text-align:left;background:rgba(252,251,247,.5);border:1px solid var(--edge);
  margin-bottom:6px;padding:7px 10px;border-radius:3px;font-size:.95rem;color:var(--ink)}
.songli small{display:block;color:var(--ink3);font-style:italic}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid button{padding:4px;background:rgba(252,251,247,.5);border:1px solid var(--edge);border-radius:3px;font-size:.75rem;color:var(--ink)}
.mapgrid svg{width:100%;height:auto;display:block}
.mapgrid .lock{opacity:.35;pointer-events:none}
.log{font-size:.88rem;line-height:1.35;padding:5px 0;border-bottom:1px dotted rgba(168,131,74,.5)}
.log b{color:var(--ink3);font-weight:400;font-style:italic}
.meta{font-size:.82rem;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .mbox{max-width:1100px;width:100%;max-height:94vh;overflow:auto;position:relative;padding:18px}
#modal .mclose{position:absolute;right:8px;top:6px;background:none;border:0;font-size:1.8rem;color:var(--ink2);z-index:2}

/* toasts */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;align-items:center}
.toast{background:#2b1d0e;color:#f3e2b2;border:1px solid var(--gold);padding:6px 14px;border-radius:16px;font-size:.92rem;
  animation:tin .3s ease-out,tout .5s 2.6s forwards;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.bad{border-color:#c2543f}.toast.good{border-color:#7fae58}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* wraith world flash */
body.wraith #wrap{filter:grayscale(1) blur(1.5px) contrast(1.3) brightness(.7);transition:filter .3s}
#eye{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 9% 18% at 50% 45%,#000 30%,transparent 32%),radial-gradient(ellipse 22% 26% at 50% 45%,#ff7a12 0%,#c22a00 45%,rgba(120,10,0,.6) 60%,transparent 75%)}
body.wraith #eye{opacity:.55}

/* games */
.gwrap{max-width:820px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.ghead .gt{font-family:'Oswald',sans-serif;font-size:1.1rem}
.ghud{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.ghud b{font-family:'Oswald',sans-serif}
canvas.gc{width:100%;height:auto;display:block;background:#000;border:2px solid #4a3317;border-radius:4px;touch-action:none}
.gmsg{min-height:1.6em;font-style:italic;text-align:center;margin:8px 0;color:var(--ink2)}
.gbar{height:16px;background:rgba(0,0,0,.15);border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin:4px 0}
.gbar i{display:block;height:100%;transition:width .08s}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin:10px auto}
.dpad button{font-size:1.3rem;border-radius:6px;border:1px solid var(--edge);background:#f2f0e8}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:12px;justify-content:center;margin:14px auto}
.pad{height:110px;border-radius:12px;border:3px solid rgba(0,0,0,.3);font-size:2.4rem;color:rgba(255,255,255,.9);transition:filter .1s,transform .1s}
.pad.lit{filter:brightness(1.8) drop-shadow(0 0 14px #fff);transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{padding:10px;border:1px solid var(--edge);background:rgba(252,251,247,.6);border-radius:4px;font-size:1rem}
.opts button:hover{background:#ffffff}
.riddle{font-family:'Special Elite',monospace;font-size:1.2rem;line-height:1.5;text-align:center;padding:14px;background:rgba(255,252,240,.5);border:1px solid var(--edge);border-radius:4px;white-space:pre-line}
.inline-input{font-family:'Special Elite',monospace;font-size:1.3rem;padding:6px 12px;border:1px solid var(--edge);border-radius:4px;background:#fffaf0;width:220px;text-align:center}
.qkeys{display:flex;gap:10px;justify-content:center;margin:12px 0}
.qkeys button{width:64px;height:64px;font-size:1.8rem;border-radius:8px;border:2px solid var(--edge);background:#f2f0e8}
.qkeys button.want{background:#ffe08a;border-color:#a57b00;box-shadow:0 0 12px #ffcc33}
.qprompt{font-size:3.2rem;text-align:center;font-family:'Oswald',sans-serif;margin:4px 0}
.tcell{cursor:pointer}

/* title */
.titlescr{text-align:center;padding:30px 10px}
.titlescr h1{font-family:'Oswald',sans-serif;font-size:2.8rem;margin:10px 0 0;letter-spacing:.06em;color:#3b2408}
.titlescr .sub{font-family:'Special Elite',monospace;font-style:italic;font-size:1.25rem;color:var(--ink2)}
.titlescr .verse{font-family:'Special Elite',monospace;font-size:1.1rem;line-height:1.6;margin:18px auto;max-width:480px;color:var(--ink2)}
.titlescr .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ending h2{font-family:'Oswald',sans-serif;text-align:center;font-size:1.8rem;margin:6px 0}
.etable{margin:10px auto;border-collapse:collapse;font-size:.95rem}
.etable td{padding:3px 10px;border-bottom:1px dotted var(--edge)}

/* the Ring makes you vanish: the world goes grey-gold and thin */
body.wraith #wrap{filter:grayscale(.8) sepia(.4) blur(1.2px) brightness(.82);transition:filter .3s}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);border:1px solid #6b4c00;vertical-align:-3px}
.greedicon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);transition:all .5s}
.choice.gold{border:1px solid #b88d1c;background:linear-gradient(90deg,rgba(233,196,90,.35),rgba(252,251,247,.5))}
.choice.gold::before{content:'◆ ';color:#a57b00}
.bid{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px dotted var(--edge)}
.bid .lot{flex:1}.bid .lot b{display:block}.bid .lot small{color:var(--ink2)}
.smaugline{font-family:'Special Elite',monospace;font-size:1.15rem;line-height:1.5;padding:12px 16px;background:rgba(60,10,0,.08);border-left:4px solid #8b1e1e;margin:8px 0}
@media (max-width:900px){
  #top{position:static;padding:8px 12px;gap:8px}
  .brand{flex:1}
  .hbtns{order:2}
  #stats{order:3;flex:0 0 100%;gap:8px 14px}
  .side-here{display:none}
  .sview{overflow:hidden;max-height:62vh;border-radius:4px}
  .sview canvas.gc{width:860px;max-width:none}
  .sdpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin:10px auto 0;user-select:none;-webkit-user-select:none}
  .sdpad button{font-size:1.4rem;border-radius:8px;border:1px solid var(--edge);background:#f2f0e8;touch-action:none}
  .sdpad button.on{background:#ffe08a}
  #wrap{grid-template-columns:minmax(0,1fr);padding:8px}
  #stage,#side{min-width:0}
  #side{position:static;max-height:none;min-height:0}
  #stage{padding:14px 14px 20px;min-height:0}
  .date{margin-left:0}
  .stat{min-width:0}.bar{width:48px}
  .text p{font-size:1.05rem}
  .opts{grid-template-columns:1fr}
  .brand{font-size:1.05rem}
}

/* ═══ OCEANIA: Ministry-issue paper, Party red, telescreen grey ═══ */
:root{
  --ink:#1f1f22;--ink2:#46464c;--ink3:#77767a;--parch:#e7e3d6;--parch2:#d6d1c2;--edge:#8e8a7e;
  --gold:#b3241d;--gold2:#e9e4d6;--red:#a3201b;--elf:#1f3f73;--sea:#9fb4b8;--bg:#121416;--bg2:#1d2023;
}
body{background:#0f1113 radial-gradient(ellipse at 50% 0%,#2b2f33 0%,#0f1113 70%);color:var(--ink)}
#top{background:linear-gradient(#24272a,#141618);border-bottom:3px solid var(--red);color:#e6e2d6}
.brand{font-family:'Oswald',sans-serif;color:#f2eee2;text-shadow:none;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:#c8453c;letter-spacing:.28em}
.stat .lbl{color:#b7b3a8}
.bar{background:#08090a;border-color:#55524c}
.date{color:#c9c4b6;font-family:'Special Elite',monospace;font-style:normal}
.hbtns button{background:#2c2f33;border-color:#5a5750;color:#eae6da}
.hbtns button:hover{background:#3a3e43}
.parch{background:var(--parch);background-image:
  repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(60,60,50,.16),transparent 55%);
  border:1px solid var(--edge);border-radius:2px;box-shadow:0 6px 24px rgba(0,0,0,.6),inset 0 0 40px rgba(60,60,50,.18)}
#tabs button{color:var(--ink2);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
#tabs button.on{background:rgba(163,32,27,.13);color:var(--red)}
.chaphead .cn{font-family:'Special Elite',monospace;color:var(--red);letter-spacing:.25em}
.chaphead h2{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chaphead .where{font-family:'Special Elite',monospace;font-style:normal;font-size:.88rem}
.rule{background:linear-gradient(90deg,transparent,var(--red) 20%,var(--red) 80%,transparent) center/100% 2px no-repeat;opacity:.75}
.text p.first::first-letter{font-family:'Oswald',sans-serif;font-weight:700;color:var(--red);font-size:3.1em;padding:6px 8px 0 0}
.text .tele{display:block;font-family:'Special Elite',monospace;background:#1d2124;color:#cfe0d6;padding:8px 12px;border-left:4px solid var(--red);margin:4px 0;font-size:.98rem;letter-spacing:.02em}
.text .diaryline{display:block;font-family:'Special Elite',monospace;color:#1d2b4a;font-size:1.08rem;padding:6px 14px;margin:4px 0;
  background:repeating-linear-gradient(#f6f2e4 0 25px,#c9d3e6 25px 26px);border-left:2px solid #c8453c}
.text .poster{display:block;text-align:center;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.18em;font-size:1.25rem;color:#f4f0e4;background:#1e1e20;padding:10px;border:3px solid var(--red);margin:6px auto;max-width:520px;line-height:1.5}
.text .oblq{color:#7a1612}
.choice{border-radius:2px}
.choice.talk::before{content:'» ';color:var(--red)}
.choice.dt{border:1px solid #333;background:linear-gradient(90deg,rgba(40,40,44,.14),rgba(252,251,247,.5))}
.choice.dt::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #222;margin-right:8px;vertical-align:-1px;background:linear-gradient(90deg,#222 50%,transparent 50%)}
.choice.red{border-color:var(--red);background:linear-gradient(90deg,rgba(163,32,27,.12),rgba(252,251,247,.5))}
.btn{background:linear-gradient(#3a3d42,#222428);color:#f0ece0;border:1px solid #111;border-radius:2px}
.btn.gold{background:linear-gradient(#b3241d,#7d1410);color:#fff;border-color:#4a0a08}
.chip.ring{border-color:var(--red);background:#f5dcd8;color:#7a1612}
.toast{background:#1d2023;color:#ece8dc;border-color:#77746c;border-radius:2px;font-family:'Special Elite',monospace;font-size:.86rem}
.toast.ring{border-color:#c8453c;color:#ffb4aa}
.song h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em}
.song .st .ln{font-family:'Special Elite',monospace}
.song .ln.lit{background:rgba(163,32,27,.18)}
.log{font-family:'Special Elite',monospace;color:#1d2b4a;font-size:.84rem}
.log b{color:#8a2a22;font-style:normal}
.titlescr h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.2em;color:#1a1a1c;font-size:3rem}
.titlescr .sub{font-family:'Special Elite',monospace;font-style:normal;font-size:1rem}

  background:repeating-linear-gradient(#f6f2e4 0 29px,#c9d3e6 29px 30px);border:1px solid var(--edge);white-space:pre-wrap;word-break:break-word}

  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
body.wraith #scan{opacity:1}
</style>

<body>
<header id="top">
  <div class="brand">Thoughtcrime<span>AIRSTRIP ONE · OCEANIA · 1984</span></div>
  <div id="stats"></div>
  <div class="hbtns"><button id="btnSound" title="Sound effects">♪</button><button id="btnMenu" title="Menu">☰</button></div>
</header>
<main id="wrap">
  <section id="stage" class="parch"></section>
  <aside id="side" class="parch"><nav id="tabs"></nav><div id="panel"></div></aside>
</main>
<div id="modal" class="hidden"><div class="mbox parch"><button class="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="toasts"></div>
<div id="scan"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   THOUGHTCRIME — an unofficial game after George Orwell's Nineteen Eighty-Four
   (1949). You are Winston Smith, of the Records Department.
   Quotations are taken from the novel, which is in the public domain in the
   UK and most of the world (not yet in the USA). Connecting prose, the
   invented verses marked as such, and all games are new.
   Built on the engine of burglar.html: utilities · ITEMS/CHARS · SND ·
   state & save · engine · MAPS · VIGNETTES · TEXTS · BEATS · GAMES · boot
   ═══════════════════════════════════════════════════════════════════════════ */

// ── UTILITIES ───────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffle(a, r){ r = r || Math.random; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const tx = t => typeof t === 'function' ? t(G) : (t || '');


// ── ITEMS ───────────────────────────────────────────────────────────────────
const ITEMS = {
  gin:      {n:'Victory Gin', ic:'🍶', d:'A square bottle with a plain white label. It gives off a sickly, oily smell, as of Chinese rice-spirit, and goes down like nitric acid.'},
  cigs:     {n:'Victory Cigarettes', ic:'🚬', d:'A crumpled packet. Hold them upright, or the tobacco falls out on to the floor.'},
  diary:    {n:'The Diary', ic:'📓', d:'A thick quarto-sized blank book with a red back and a marbled cover, bought for two dollars fifty in a junk-shop. Not illegal (nothing was illegal, since there were no longer any laws), but if detected it was reasonably certain to be punished by death.'},
  nib:      {n:'A Pen-nib', ic:'🖋️', d:'An archaic instrument, seldom used even for signatures. Bought furtively, because the creamy paper deserved to be written on with a real nib instead of being scratched with an ink-pencil.'},
  paperweight:{n:'Glass Paperweight', ic:'🔮', d:'A heavy lump of glass, curved on one side and flat on the other, making almost a hemisphere. At the heart of it, magnified by the curvature, a strange, pink, convoluted object that recalled a rose or a sea anemone. A fragment of coral.'},
  note:     {n:'A Scrap of Paper', ic:'✉️', d:'Folded small and pressed into your hand in the corridor. Three words, in a large unformed handwriting.'},
  chocolate:{n:'Real Chocolate', ic:'🍫', d:'Dark and shiny, wrapped in silver paper. Not the dull-brown crumbly stuff that tastes like the smoke of a rubbish fire.'},
  coffee:   {n:'Real Coffee', ic:'☕', d:'Inner Party coffee. And real sugar, and real milk, and a loaf of proper white bread. Julia knows people.'},
  dictionary:{n:'The Newspeak Dictionary', ic:'📘', d:'The tenth edition, lent by O\'Brien. Folded inside: a slip of paper with his address, written with an ink-pencil. A thoughtcrime in itself, delivered as innocently as a library book.'},
  book:     {n:'The Book', ic:'📕', d:'A heavy black volume, amateurishly bound, with no name or title on the cover. THE THEORY AND PRACTICE OF OLIGARCHICAL COLLECTIVISM, by Emmanuel Goldstein.'},
  sash:     {n:'A Scarlet Sash', ic:'🎗️', d:'The emblem of the Junior Anti-Sex League, which Julia wears wound several times round her waist. She gave you one end of it, once, as a joke.'},
  razor:    {n:'Razor Blades', ic:'🪒', d:'A packet of six. There has been a shortage of razor blades for months. A prole woman will give a great deal for one.'},
  ticket:   {n:'Lottery Ticket', ic:'🎟️', d:'The Lottery, with its weekly pay-out of enormous prizes, is the one public event to which the proles pay serious attention. The prizes are largely imaginary.'},
  bread:    {n:'A Crust of Bread', ic:'🍞', d:'Dirty, and very small. In the Ministry of Love, worth more than you could say.'}
};

// ── PERSONS ─────────────────────────────────────────────────────────────────
const CHARS = {
  bigbrother:{n:'Big Brother', c:'#1e1e20', d:'A man of about forty-five, with a heavy black moustache and ruggedly handsome features. His face looks down from every poster. Nobody has ever seen him. He will never die.'},
  goldstein:{n:'Emmanuel Goldstein', c:'#5a5a5a', d:'The Enemy of the People. A lean Jewish face with a great fuzzy aureole of white hair and a small goatee beard. The primal traitor, the earliest defiler of the Party\'s purity. Somewhere, still alive, still hatching his conspiracies.'},
  obrien:{n:'O\'Brien', c:'#2a2a3a', d:'A member of the Inner Party. A large, burly man with a thick neck and a coarse, humorous, brutal face. He has a trick of resettling his spectacles on his nose which is curiously disarming.'},
  julia:{n:'Julia', c:'#a3201b', d:'A bold-looking girl of about twenty-seven, with thick dark hair, a freckled face and swift, athletic movements. A narrow scarlet sash is wound round the waist of her overalls. She works on the novel-writing machines in the Fiction Department.'},
  syme:{n:'Syme', c:'#4a5a6a', d:'A philologist, a specialist in Newspeak. One of the enormous team of experts compiling the Eleventh Edition of the Newspeak Dictionary. Tiny, with dark hair and large, protuberant eyes, at once mournful and derisive.'},
  parsons:{n:'Tom Parsons', c:'#7a5a3a', d:'Your neighbour at Victory Mansions. A fattish but active man of paralysing stupidity, a mass of imbecile enthusiasms. He gives off a powerful smell of sweat.'},
  mrsparsons:{n:'Mrs Parsons', c:'#8a7a6a', d:'A colourless, crushed-looking woman, with wispy hair and a lined face. Frightened of her own children, as everyone is.'},
  charrington:{n:'Mr Charrington', c:'#6a6a5a', d:'The owner of the junk-shop. A man of perhaps sixty, frail and bowed, with a long, benevolent nose and mild eyes distorted by thick spectacles. He wears an ancient velvet jacket.'},
  oldprole:{n:'The Old Man in the Pub', c:'#7a6a4a', d:'Very old, with a bent back, a fierce white moustache and red-rimmed eyes. He must have been a grown man before the Revolution. He wants a pint, not a half-litre.'},
  ampleforth:{n:'Ampleforth', c:'#6a7a5a', d:'A mild, ineffectual, dreamy creature with very hairy ears and a surprising talent for juggling with rhymes and metres. He produces garbled versions of poems that have become ideologically offensive.'},
  tillotson:{n:'Tillotson', c:'#5a6a6a', d:'The small, dark-chinned man in the cubicle across the way. He works with a newspaper folded on his knee and his mouth very close to the speakwrite, and gives you a hostile flash of spectacles whenever you look up.'},
  ogilvy:{n:'Comrade Ogilvy', c:'#3a4a3a', d:'A hero of the Party, who at three refused all toys except a drum, a sub-machine gun and a model helicopter, and who never existed until you invented him one morning in April.'},
  withers:{n:'Comrade Withers', c:'#555', d:'Holder of the Order of Conspicuous Merit, Second Class.'},
  prolewoman:{n:'The Washerwoman', c:'#8a6a5a', d:'A monstrous woman, solid as a Norman pillar, with brawny red forearms and a sacking apron, who hangs out nappies in the yard below the room and sings all day long.'}
};

// ── SOUND ───────────────────────────────────────────────────────────────────
const SND = (() => {
  let ctx = null, on = false, master = null, playing = [], lineTimers = [];
  try { on = localStorage.getItem('thoughtcrimeSound') === '1'; } catch (e) {}
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = mf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .25, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05); playing.push(o);
  }
  function noise(t, dur, vol, freq){
    const c = ac(); if (!c) return;
    const b = c.createBuffer(1, Math.max(1, c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 3000;
    const g = c.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); playing.push(s);
  }
  function fx(kind){
    if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    switch (kind){
      case 'click': note(84, t, .06, 'square', .05); break;
      case 'good': note(72, t, .15, 'triangle', .2); note(76, t + .08, .15, 'triangle', .2); note(79, t + .16, .3, 'triangle', .2); break;
      case 'bad': note(52, t, .3, 'sawtooth', .12); note(47, t + .12, .4, 'sawtooth', .12); break;
      case 'ring': note(40, t, 1.4, 'sine', .3); note(47, t, 1.4, 'sine', .15); noise(t, 1.2, .08, 400); break;
      case 'hit': noise(t, .15, .3, 900); break;
      case 'boom': note(30, t, .6, 'sine', .5); noise(t, .4, .25, 200); break;
      case 'firework': noise(t, .5, .25, 1800); note(ri(80, 95), t, .2, 'sine', .08); break;
      case 'splash': noise(t, .35, .2, 1200); break;
      case 'shriek': { const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(500, t + .9);
        g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.05); break; }
      case 'step': noise(t, .05, .12, 500); break;
    }
  }
  function tone(m, dur, type, vol){ if (!on) return; const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  function toneAlways(m, dur, type, vol){ const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  // play a generated melody; onLine(i) fires as each line starts
  function sing(mel, onLine, onEnd){
    stop(); const c = ac(); if (!c) { if (onEnd) onEnd(); return; }
    const beat = 60 / mel.tempo; let t = c.currentTime + .15; const t0 = t;
    mel.lines.forEach((line, li) => {
      lineTimers.push(setTimeout(() => onLine && onLine(li), (t - t0) * 1000 + 150));
      line.forEach(([m, d]) => {
        note(m, t, d * beat * 1.6, mel.voice, .22); note(m + 12, t, d * beat * .8, 'sine', .05);
        if (mel.drum && d >= 1) noise(t, .05, .06, 4000);
        t += d * beat;
      });
      note(mel.root - 12, t - line.reduce((a, n) => a + n[1], 0) * beat, line.reduce((a, n) => a + n[1], 0) * beat, 'sine', mel.drone ? .08 : .03);
      t += beat * .5;
    });
    lineTimers.push(setTimeout(() => { if (onEnd) onEnd(); }, (t - t0) * 1000 + 300));
  }
  function stop(){ lineTimers.forEach(clearTimeout); lineTimers = []; playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = []; }
  return { fx, tone, toneAlways, sing, stop, ac,
    get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('thoughtcrimeSound', v ? '1' : '0'); } catch (e) {} } };
})();


// ── STATE ───────────────────────────────────────────────────────────────────
const SAVE_KEY = 'thoughtcrimeSave';
let G = null;
const UI = { tab:'map', game:null, inst:null, mapZoom:null };

function newGame(){
  return {
    version:1, beat:null, chapter:1, chTitle:'', date:'', map:'mansions', loc:'lobby',
    stats:{hum:45, health:100, sus:5, food:6, cash:6},
    aff:{obrien:0, julia:-10, syme:20, parsons:10, mrsparsons:10, charrington:0, oldprole:0, ampleforth:10},
    met:['bigbrother','goldstein','parsons','mrsparsons'],
    party:[], gone:[],
    items:['gin','cigs'], flags:{}, songs:[], maps:['wild','mansions'], seen:{}, route:['victory'],
    log:[], ringUses:0, games:{}, pending:null, checkpoint:null, ending:null, started:Date.now()
  };
}
function save(){ if (!G) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function tryLoad(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.version === 1 && BEATS[s.beat]) return s; } catch (e) {}
  return null;
}
function snapshot(){ const c = Object.assign({}, G); delete c.checkpoint; return JSON.parse(JSON.stringify(c)); }

const has = k => G.items.indexOf(k) >= 0;
const flag = k => !!G.flags[k];
const aff = k => G.aff[k] || 0;
const inParty = k => G.party.indexOf(k) >= 0;
const partOf = ch => ch <= 7 ? 1 : ch <= 13 ? 2 : 3;
const RHYME = [
  'Oranges and lemons, say the bells of St Clement\'s,',
  'You owe me three farthings, say the bells of St Martin\'s,',
  'When will you pay me? say the bells of Old Bailey,',
  'When I grow rich, say the bells of Shoreditch.',
  'Here comes a candle to light you to bed, here comes a chopper to chop off your head!'];
const rhymeCount = () => [0, 1, 2, 3, 4].filter(i => G.flags['rhyme' + i]).length;

// ── EFFECTS ─────────────────────────────────────────────────────────────────
const STAT_NAME = {hum:'Humanity', health:'Health', sus:'Suspicion', food:'Rations', cash:'Dollars'};
const STAT_MAX = {hum:100, health:100, sus:100, food:20, cash:999};
function applyFx(fx){
  const out = [];
  if (!fx) return out;
  ['hum','health','sus','food','cash'].forEach(k => {
    if (!fx[k]) return;
    if (k === 'sus' && G.flags.arrested) return;          // they have you already
    const before = G.stats[k];
    G.stats[k] = clamp(before + fx[k], k === 'hum' && G.flags.arrested ? 1 : 0, STAT_MAX[k]);
    const d = G.stats[k] - before; if (!d) return;
    const good = k === 'sus' ? d < 0 : d > 0;
    out.push({t:`${STAT_NAME[k]} ${d > 0 ? '+' : ''}${d}`, c: k === 'sus' && d > 0 ? 'ring' : good ? 'good' : 'bad'});
  });
  if (fx.aff) Object.keys(fx.aff).forEach(k => {
    const v = fx.aff[k]; G.aff[k] = clamp((G.aff[k] || 0) + v, -100, 100);
    const nm = (CHARS[k] ? CHARS[k].n : k).replace(/^(The |Mr |Mrs |Comrade )/, '').split(/[ (]/)[0];
    out.push({t:`${nm} ${v > 0 ? '♥+' + v : '♥' + v}`, c: v > 0 ? 'good' : 'bad'});
  });
  [].concat(fx.item || []).forEach(k => { if (!has(k)){ G.items.push(k); out.push({t:'Gained: ' + ITEMS[k].n, c:'good'}); } });
  [].concat(fx.lose || []).forEach(k => { const i = G.items.indexOf(k); if (i >= 0){ G.items.splice(i, 1); out.push({t:'Lost: ' + ITEMS[k].n, c:'bad'}); } });
  [].concat(fx.flag || []).forEach(k => { G.flags[k] = true; });
  if (fx.flags) Object.assign(G.flags, fx.flags);
  [].concat(fx.song || []).forEach(k => { if (learnSong(k)) out.push({t:'Text recorded: ' + SONGS[k].title, c:'good'}); });
  [].concat(fx.map || []).forEach(k => { if (unlockMap(k)) out.push({t:'New map: ' + MAPS[k].title, c:'good'}); });
  [].concat(fx.meet || []).forEach(k => { if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.join || []).forEach(k => { if (G.party.indexOf(k) < 0) G.party.push(k); if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.leave || []).forEach(k => { const i = G.party.indexOf(k); if (i >= 0) G.party.splice(i, 1); });
  [].concat(fx.vaporize || []).forEach(k => { if (G.gone.indexOf(k) < 0){ G.gone.push(k); out.push({t:(CHARS[k] ? CHARS[k].n : k) + ' is an unperson', c:'bad'}); } });
  [].concat(fx.rhyme || []).forEach(i => {
    if (G.flags['rhyme' + i]) return; G.flags['rhyme' + i] = true;
    out.push({t:'A line remembered: "' + RHYME[i].split(',')[0] + '…"', c:'good'});
    if ([0, 1, 2, 3].every(j => G.flags['rhyme' + j]) && learnSong('oranges')) out.push({t:'The whole rhyme: Oranges and Lemons', c:'good'});
  });
  return out;
}
// Doublethink: the safe, easy way through — a face of quiet optimism, a
// belief held and not held. It lowers nobody's guard but your own.
function ringUse(cost){
  G.ringUses++;
  const out = applyFx({hum: -(cost || 3)});
  wraithFlash();
  return out;
}
function wraithFlash(){
  SND.fx('ring');
  document.body.classList.add('wraith');
  setTimeout(() => { if (!UI.ringHeld) document.body.classList.remove('wraith'); }, 1500);
}
function learnSong(k){ if (!SONGS[k] || G.songs.indexOf(k) >= 0) return false; G.songs.push(k); return true; }
function unlockMap(k){ if (!MAPS[k] || G.maps.indexOf(k) >= 0) return false; G.maps.push(k); return true; }
function addLog(t){ G.log.unshift({d:G.date, t}); if (G.log.length > 150) G.log.length = 150; }
function markSeen(map, loc){ if (!G.seen[map]) G.seen[map] = []; if (G.seen[map].indexOf(loc) < 0) G.seen[map].push(loc); }

function toast(chips){
  const box = $('#toasts');
  chips.forEach((c, i) => setTimeout(() => {
    const d = document.createElement('div'); d.className = 'toast ' + (c.c || ''); d.textContent = c.t;
    box.appendChild(d); setTimeout(() => d.remove(), 3300);
  }, i * 220));
}

// ── BEAT ENGINE ─────────────────────────────────────────────────────────────
function failCheck(b, id){
  if (b.ending) return null;
  if (G.stats.health <= 0 && id !== 'fallen') return 'fallen';
  if (!G.flags.arrested && G.stats.sus >= 100 && id !== 'vaporized') return 'vaporized';
  if (!G.flags.arrested && G.stats.hum <= 0 && id !== 'crimestop') return 'crimestop';
  return null;
}
function goBeat(id){
  const b = BEATS[id];
  if (!b){ console.error('Missing beat', id); return; }
  const re = G.beat === id;
  G.beat = id; G.pending = null;
  if (re){ save(); render(); return; }
  if (b.chapter){ G.chapter = b.chapter; G.chTitle = b.chTitle; G.checkpoint = null; G.checkpoint = snapshot(); }
  let chips = [];
  if (b.date) G.date = b.date;
  if (b.map){ G.map = b.map; unlockMap(b.map); }
  if (b.loc){ G.loc = b.loc; markSeen(G.map, b.loc); }
  if (b.w && G.route[G.route.length - 1] !== b.w) G.route.push(b.w);
  if (b.fx) chips = chips.concat(applyFx(typeof b.fx === 'function' ? b.fx(G) : b.fx));
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) learnSong(sg);
  if (b.travel){
    const need = b.travel;
    if (G.stats.food >= need) chips = chips.concat(applyFx({food:-need}));
    else { const short = need - G.stats.food; chips = chips.concat(applyFx({food:-G.stats.food, health:-6 * short, hum:-2 * short}));
      chips.push({t:'Hungry. The stew was a long time ago.', c:'bad'}); }
  }
  if (b.enter) b.enter(G);
  if (b.log) addLog(tx(b.log));
  const f = failCheck(b, id); if (f){ save(); return goBeat(f); }
  if (chips.length) toast(chips);
  save();
  render();
  window.scrollTo(0, 0);
}
function visibleChoices(b){ return (b.choices ? tx(b.choices) : []).filter(c => !c.if || c.if(G)); }
function choose(i){
  const b = BEATS[G.beat], c = visibleChoices(b)[i]; if (!c) return;
  SND.fx('click');
  let chips = applyFx(typeof c.fx === 'function' ? c.fx(G) : c.fx);
  if (c.dt) chips = chips.concat(ringUse(c.dt === true ? 3 : c.dt));
  if (c.act) c.act(G);
  let next = typeof c.go === 'function' ? c.go(G) : (c.go || G.beat);
  const f = failCheck(BEATS[next] || {}, next); if (f) next = f;
  const res = tx(c.res);
  if (res){ G.pending = {text:res, chips, next}; save(); render(); window.scrollTo(0, 0); }
  else { if (chips.length) toast(chips); goBeat(next); }
}
function continuePending(){ const n = G.pending.next; G.pending = null; goBeat(n); }

// ── RENDER ──────────────────────────────────────────────────────────────────
function paras(t, first){
  return String(t).split(/\n\s*\n/).map((p, i) => `<p class="${first && i === 0 ? 'first' : ''}">${p.trim()}</p>`).join('');
}
function chipHTML(chips){ return chips && chips.length ? `<div class="chips">${chips.map(c => `<span class="chip ${c.c || ''}">${esc(c.t)}</span>`).join('')}</div>` : ''; }
function locName(map, loc){
  const m = MAPS[map]; if (!m) return ''; const p = m.places.find(p => p.k === loc); return p ? p.n : '';
}
function headerHTML(b){
  return `<div class="chaphead"><div class="cn">PART ${['ONE','TWO','THREE'][partOf(G.chapter) - 1]} · CHAPTER ${romanize(G.chapter)}</div><h2>${esc(G.chTitle || '')}</h2>
    <div class="where">${esc(b.title || locName(G.map, G.loc))}</div></div><div class="rule"></div>`;
}
function romanize(n){ const r = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]]; let s = ''; r.forEach(([k, v]) => { while (n >= v){ s += k; n -= v; } }); return s; }
function artHTML(b){
  if (b.art === 'none') return '';
  if (b.art && VIGNETTES[b.art]) return `<div class="art" data-vig="${b.art}">${VIGNETTES[b.art]()}</div>`;
  const map = b.map || G.map;
  return `<div class="art" data-map="${map}">${drawMap(map, {here:G.loc, small:true})}<span class="hint">click to enlarge</span></div>`;
}
function render(){
  renderStats(); renderSide();
  if (!G){ renderTitle(); return; }
  if (UI.game) return;
  const st = $('#stage'), b = BEATS[G.beat];
  if (b.ending){ st.innerHTML = renderEnding(b); wireStage(); return; }
  let h = headerHTML(b);
  if (G.pending){
    h += `<div class="text">${paras(G.pending.text, true)}</div>${G.pending.chips.length ? `<div class="result">${chipHTML(G.pending.chips)}</div>` : ''}
      <div class="choices"><button class="choice go" data-cont>Continue…</button></div>`;
    st.innerHTML = h; wireStage(); return;
  }
  h += artHTML(b);
  h += `<div class="text">${paras(tx(b.text), true)}</div>`;
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) h += songCard(sg);
  if (b.game){
    const gc = tx(b.game);
    h += `<div class="choices"><button class="choice game go" data-game>${esc(gc.label || 'Begin')}</button>
      <button class="choice" data-skip>Let the Party decide <span class="tag">skip the game · an average outcome</span></button></div>`;
  } else {
    const cs = visibleChoices(b);
    h += `<div class="choices">${cs.map((c, i) => {
      const cls = ['choice', c.dt ? 'dt' : '', c.talk ? 'talk' : '', c.cls || ''].join(' ');
      return `<button class="${cls}" data-c="${i}">${tx(c.t)}${c.tag ? `<span class="tag">${tx(c.tag)}</span>` : ''}${c.dt ? '<span class="tag">doublethink</span>' : ''}</button>`;
    }).join('')}</div>`;
  }
  st.innerHTML = h; wireStage();
}
function wireStage(){
  const st = $('#stage');
  st.querySelectorAll('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c));
  const cont = st.querySelector('[data-cont]'); if (cont) cont.onclick = continuePending;
  const gb = st.querySelector('[data-game]'); if (gb) gb.onclick = () => startGame(tx(BEATS[G.beat].game));
  const sk = st.querySelector('[data-skip]'); if (sk) sk.onclick = () => { const gc = tx(BEATS[G.beat].game); UI.game = gc; finishGame({win: Math.random() < .55, score: .5, msg:'You let things take their course. Things always do.', fx: gc.skipFx}); };
  const art = st.querySelector('.art'); if (art) art.onclick = () => art.dataset.map ? openMap(art.dataset.map) : null;
  st.querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(el.dataset.sing, el.closest('.song')));
  st.querySelectorAll('[data-checkpoint]').forEach(el => el.onclick = restoreCheckpoint);
  st.querySelectorAll('[data-new]').forEach(el => el.onclick = startNew);
  st.querySelectorAll('[data-load]').forEach(el => el.onclick = () => { G = tryLoad(); render(); });
}
function restoreCheckpoint(){
  if (!G.checkpoint) return;
  const cp = G.checkpoint; G = JSON.parse(JSON.stringify(cp)); G.checkpoint = cp; G.pending = null;
  UI.game = null; if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null;
  save(); closeModal(); render(); toast([{t:'The record has been rectified. Back to the start of the chapter.'}]);
}
function startNew(){ SND.stop(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = newGame(); closeModal(); goBeat('start'); }

function renderStats(){
  const el = $('#stats');
  if (!G){ el.innerHTML = ''; return; }
  const s = G.stats;
  const bar = (v, c) => `<span class="bar"><i style="width:${v}%;background:${c}"></i></span>`;
  const glow = 2 + s.sus / 4, gc = s.sus > 70 ? '#ff2a1a' : s.sus > 40 ? '#ff8a5a' : '#8a857a';
  el.innerHTML = `
    <span class="stat" title="Humanity: what is inside you, that they cannot get at. At nothing, you have become a good Party member."><span class="lbl">humanity</span>${bar(s.hum, 'linear-gradient(90deg,#3c5a8a,#b8cbe8)')}</span>
    <span class="stat" title="Health: at nothing, your story ends"><span class="lbl">health</span>${bar(s.health, 'linear-gradient(90deg,#7a1612,#d0473c)')}</span>
    <span class="stat" title="Suspicion: the Thought Police's interest in you. At 100 you are vaporized."><span class="eyeicon" style="box-shadow:0 0 ${glow}px ${gc}"></span><span class="lbl">suspicion</span> ${G.flags.arrested ? '<b style="color:#ff8a7a">KNOWN</b>' : s.sus}</span>
    <span class="stat" title="Rations: meals and coupons">🥫 <span class="lbl">rations</span> ${s.food}</span>
    <span class="stat" title="Dollars in your pocket"><span class="dollar">$</span> ${s.cash}</span>
    <span class="date">${esc(G.date || '')}</span>`;
}

  const p = $('#panel');
  if (!G){ p.innerHTML = `<div class="ptitle">Airstrip One</div>${drawMap('wild', {small:true})}<p class="meta">Chief city of Airstrip One, itself the third most populous of the provinces of Oceania.</p>`; return; }
  let h = '';
  if (UI.tab === 'map'){
    h = `<div class="ptitle">London, Airstrip One</div><div class="art" data-map="wild">${drawMap('wild', {small:true, worldRoute:true})}</div>
      <p class="meta">${G.route.length} place${G.route.length === 1 ? '' : 's'} on the record of your movements. The Thought Police have the same record. Click to enlarge.</p>
      <div class="side-here"><div class="ptitle">Here</div><div class="art" data-map="${G.map}">${drawMap(G.map, {here:G.loc, small:true})}</div></div>`;
  } else if (UI.tab === 'fellow'){
    h = `<div class="ptitle">Persons &amp; Unpersons</div>`;
    const order = Object.keys(CHARS).filter(k => G.met.indexOf(k) >= 0);
    h += order.map(k => {
      const c = CHARS[k], a = G.aff[k], gone = G.gone.indexOf(k) >= 0;
      const ab = a === undefined || gone ? '' : `<div class="abar"><i style="left:${a >= 0 ? 50 : 50 + a / 2}%;width:${Math.abs(a) / 2}%;background:${a >= 0 ? '#3c5a8a' : '#a3201b'}"></i></div>`;
      return `<div class="char ${gone ? 'gone' : ''}"><div class="av" style="background:${c.c}">${c.n.replace(/^(The |Mr |Mrs |Comrade )/, '')[0]}</div><div style="flex:1"><span class="nm">${esc(c.n)}</span>${gone ? '<span class="here" style="color:#a3201b">unperson</span>' : ''}<div class="ds">${gone ? 'He did not exist: he had never existed.' : esc(c.d)}</div>${ab}</div></div>`;
    }).join('');
  } else if (UI.tab === 'pack'){
    h = `<div class="ptitle">In Your Pockets</div>` + (G.items.length ? G.items.map(k => `<div class="item"><div class="ic">${ITEMS[k].ic}</div><div><div class="nm">${esc(ITEMS[k].n)}</div><div class="ds">${esc(ITEMS[k].d)}</div></div></div>`).join('') : '<p class="meta">Nothing. They took everything.</p>')
      + `<p class="meta">$${G.stats.cash}. You have doublethought ${G.ringUses} time${G.ringUses === 1 ? '' : 's'}.${rhymeCount() ? ` Lines of the old rhyme remembered: ${rhymeCount()} of 5.` : ''}</p>`;
  } else if (UI.tab === 'songs'){
    h = `<div class="ptitle">Texts, Songs &amp; Slogans (${G.songs.length}/${Object.keys(SONGS).length})</div>`
      + (G.songs.length ? G.songs.map(k => `<button class="songli" data-song="${k}">${esc(SONGS[k].title)}<small>${esc(SONGS[k].by)}</small></button>`).join('') : '<p class="meta">Nothing recorded yet.</p>');
  } else if (UI.tab === 'maps'){
    h = `<div class="ptitle">Maps (${G.maps.length}/${Object.keys(MAPS).length})</div><div class="mapgrid">`
      + Object.keys(MAPS).map(k => G.maps.indexOf(k) >= 0
        ? `<button data-map="${k}">${drawMap(k, {thumb:true})}${esc(MAPS[k].title)}</button>`
        : `<button class="lock">${'<svg viewBox="0 0 100 70"><rect width="100" height="70" fill="#cfcbbd"/><rect x="10" y="28" width="80" height="14" fill="#1e1e20"/></svg>'}Classified</button>`).join('') + `</div>`;
  } else if (UI.tab === 'log'){
    h = `<div class="ptitle">The Diary of W. Smith</div>` + (G.log.length ? G.log.map(l => `<div class="log"><b>${esc(l.d)}</b> — ${esc(l.t)}</div>`).join('') : '<p class="meta">Nothing written yet. To mark the paper is the decisive act.</p>');
  }

  p.querySelectorAll('[data-song]').forEach(el => el.onclick = () => openSong(el.dataset.song));
}

// geometry + map drawing (shared with ringbearer.html)
function pointInPoly(x, y, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function smoothPath(pts, closed){
  const L = pts.length, f = n => n.toFixed(1);
  if (L < 3) return 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join('L') + (closed ? 'Z' : '');
  const at = i => closed ? pts[(i + L) % L] : pts[clamp(i, 0, L - 1)];
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  const n = closed ? L : L - 1;
  for (let i = 0; i < n; i++){
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${f(c1x)},${f(c1y)} ${f(c2x)},${f(c2y)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + (closed ? 'Z' : '');
}
function samplePolyline(pts, step){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / step));
    for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}

function drawMap(k, o){

      const pts = G.route.map(P).filter(Boolean).map(p => [p.x, p.y]);
      if (pts.length > 1) s += `<path d="${smoothPath(pts)}" fill="none" stroke="#a31f1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
      pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#a31f1f"/>`; });
      const last = pts[pts.length - 1];
      if (last) s += hereMarker(last[0], last[1]);

      let far = -1; m.route.forEach((key, i) => { if (seen.indexOf(key) >= 0) far = i; });

function songMelody(k){
  const s = SONGS[k];
  if (s._mel) return s._mel;
  const SC = {major:[0,2,4,5,7,9,11], mixo:[0,2,4,5,7,9,10], dorian:[0,2,3,5,7,9,10], aeolian:[0,2,3,5,7,8,10]}[s.mode];
  const r = seeded(hash(k)), root = s.mode === 'major' || s.mode === 'mixo' ? 62 : 60;
  const deg2m = d => root + 12 * Math.floor(d / 7) + SC[((d % 7) + 7) % 7];
  const lines = [];
  // one musical phrase per text line; phrases A/B repeat across stanzas
  const phrase = (len, end, seedR) => {
    const out = []; let d = Math.floor(seedR() * 5);
    for (let i = 0; i < len; i++){
      const last = i === len - 1;
      if (last) d = end;
      else { const st = seedR(); d += st < .35 ? 1 : st < .7 ? -1 : st < .85 ? 2 : -2; d = clamp(d, -2, 9); }
      const dur = last ? 2 : (seedR() < .25 && i < len - 2 ? .5 : 1);
      out.push([deg2m(d), dur]);
      if (dur === .5) out.push([deg2m(d + (seedR() < .5 ? 1 : -1)), .5]);
    }
    return out;
  };
  const phrases = [0, 1, 2, 3].map(i => phrase(7 + (i % 2), i === 3 ? 0 : i === 1 ? 4 : 2, seeded(hash(k + i))));
  s.v.forEach(st => st.forEach((ln, i) => lines.push(phrases[(i + (st.length === 2 ? i : 0)) % 4])));
  return (s._mel = {lines, tempo:s.tempo, voice: s.drum ? 'square' : 'triangle', root, drone:!!s.drone, drum:!!s.drum});
}

  const s = SONGS[k];

  const st = s.v.map(stz => `<div class="st">${stz.map(l => `<span class="ln" data-l="${li++}">${esc(l)}</span>`).join('')}</div>`).join('');
  return `<div class="song"><h3>${esc(s.title)}</h3><div class="by">${esc(s.by)}</div>${st}${s.read ? '' : `<button class="btn gold sing" data-sing="${k}">♪ Sing it</button>`}</div>`;
}
function singSong(k, card){
  const mel = songMelody(k), lines = card ? card.querySelectorAll('.ln') : [];
  const btn = card && card.querySelector('.sing');
  if (btn){ if (btn.dataset.on){ SND.stop(); lines.forEach(l => l.classList.remove('lit')); btn.textContent = '♪ Sing it'; delete btn.dataset.on; return; }
    btn.dataset.on = 1; btn.textContent = '■ Stop'; }
  SND.sing(mel, i => { lines.forEach(l => l.classList.remove('lit')); if (lines[i]) lines[i].classList.add('lit'); },
    () => { lines.forEach(l => l.classList.remove('lit')); if (btn){ btn.textContent = '♪ Sing it'; delete btn.dataset.on; } });
}

Object.assign(BEATS, {
start:{chapter:1, chTitle:'A Bright Cold Day in April', date:'4 April 1984', map:'mansions', loc:'lobby', w:'victory', art:'mansions',
  text:`It was a bright cold day in April, and the clocks were striking thirteen.

You are Winston Smith, thirty-nine, of the Records Department, and you come in from the street with your chin tucked down against a gritty wind that follows you through the glass doors. The hallway smells of boiled cabbage and old rag mats. On the end wall, too big for indoors, a coloured poster: an enormous face, a man of about forty-five with a heavy black moustache. The eyes follow you whichever way you move.

${PO('BIG BROTHER IS WATCHING YOU')}

The lift is not working. It seldom is, and the current is cut off in daylight hours anyway: economy, in preparation for Hate Week. Your flat is seven flights up, and there is a varicose ulcer above your right ankle.`,
  choices:[
    talk('poster', 'Look back at the face on the poster.', `It is one of those pictures contrived so that the eyes follow you about. Nobody has ever seen Big Brother. He is a face on the hoardings, a voice on the telescreen. Below him, on the landing, someone has scrawled nothing at all, which is wise.`, {hum:-1}),
    {t:'Climb slowly, resting on every landing.', go:'flat', fx:{health:-2}, res:`You go up slowly, resting several times on the way. On each landing, opposite the lift-shaft, the poster with the enormous face gazes from the wall. By the seventh, your ankle is throbbing and your breath is short.`},
    {t:'Take the stairs at a Party member\'s brisk pace.', go:'flat', fx:{health:-6, sus:-2}, res:`You take them at a trot, as if anyone were timing you. Perhaps someone is. At the top you lean on the door-frame with the blood singing in your ears.`}
  ]},
flat:{title:'Flat 7, Victory Mansions', loc:'flat', art:'telescreen', song:'slogans',
  text:`Inside the flat a fruity voice is reading a list of figures to do with pig-iron production. It comes from an oblong metal plaque like a dulled mirror set into the right-hand wall: the telescreen. You can dim it. You cannot shut it off.

The telescreen receives and transmits at once. Any sound above a very low whisper will be picked up; so will any movement within its field of vision. There is no way of knowing whether you are being watched at any given moment. You live, from habit become instinct, on the assumption that you always are.

Through the window, a mile away, the Ministry of Truth rises above the grimy landscape, a vast pyramid of glittering white concrete. You can just read, on its face, the three slogans of the Party.

But the room has an odd shape. Beside the window is a shallow alcove, out of the telescreen's line of sight, perhaps meant for bookshelves. And in the table drawer, wrapped in a newspaper, is a book with creamy blank pages that you bought in a junk-shop in the prole quarter, for two dollars fifty.`,
  choices:[
    talk('window', 'Look out of the window at the four Ministries.', `Four pyramids dwarf the city: Truth, which concerns itself with lies; Peace, which concerns itself with war; Love, which maintains law and order; Plenty, which is responsible for starvation. In Newspeak, Minitrue, Minipax, Miniluv, Miniplenty.\n\nThe Ministry of Love is the really frightening one. There are no windows in it at all.`, {map:'wild'}),
    talk('gin', 'Pour a teacupful of Victory Gin.', `It goes down like nitric acid, and you have the sensation of being hit on the back of the head with a rubber club. Then the world looks more cheerful. You light a Victory Cigarette and hold it carefully upright.`, {health:-2, hum:2}),
    {t:'Sit in the alcove. Take out the book and an ink-pen.', go:'write', fx:{item:['diary','nib'], hum:4, sus:2, meet:'obrien'}, log:'Began a diary.'},
    {t:'Leave the book in the drawer. Better yet, burn it.', go:'goodparty', cls:'dt', res:`You take it out, look at it a long time, and feed it page by page into the stove. The creamy paper burns well. You feel nothing but a small, dull relief, like a tooth that has stopped aching because the nerve has died.`}
  ]},
goodparty:{title:'An Evening at Home', art:'none',
  text:`You are sure. Quite sure. A Party member has no business with diaries, any more than with solitude or memory.

You go to the Community Centre that evening, and play table tennis, and drink several glasses of gin, and sit through a lecture entitled "Ingsoc in relation to chess". You are very tired when you get home, and sleep without dreams.`,
  choices:[{t:'Go on as you are.', go:'end_goodparty'},{t:'No — wait. Fish the half-burned cover out of the ashes.', go:'flat', fx:{hum:5}, res:`The cover is singed but whole, and some of the pages survived. You smooth them flat with a shaking hand. There is still enough to write on. There will always be enough.`}]},
write:{title:'The Alcove', loc:'alcove', art:'telescreen',
  text:`To mark the paper is the decisive act. You dip the pen in the ink and falter for just a second. Then you write, in small clumsy letters:

${DL('April 4th, 1984.')}

For whom are you writing this diary? For the future, for the unborn. Either the future will resemble the present, in which case it will not listen to you, or it will be different, and your predicament will be meaningless.

Keep your back to the telescreen. Keep the movement small. Write.`,

Object.assign(BEATS, {
written:{title:'The Alcove, later', art:'none',
  text:`You look down at the page. Over and over, in large neat capitals:

${DL('DOWN WITH BIG BROTHER<br>DOWN WITH BIG BROTHER<br>DOWN WITH BIG BROTHER<br>DOWN WITH BIG BROTHER')}

A tremor of panic. It makes no difference whether you write it or refrain. The Thought Police will get you just the same. You have committed — would have committed even if you had never set pen to paper — the essential crime that contains all others. Thoughtcrime, they call it.

Thoughtcrime does not entail death: thoughtcrime IS death.

Then there is a knocking at the door.`,

    {t:'Before you go: set a grain of whitish dust on the corner of the cover.', go:'parsons', fx:{flag:'dust', hum:2}, res:`A tell-tale. If anyone moves the book, the speck will be gone. You place it with the tip of a finger, very carefully, and go to the door.`}

parsons:{title:'The Parsons\' Flat', map:'mansions', loc:'parsons', art:'none',
  text:`It is Mrs Parsons from down the hall, a colourless, crushed-looking woman with dust in the creases of her face. "Oh, comrade," she begins in a dreary, whining sort of voice. Her kitchen sink is blocked. Tom is out.

The Parsons' flat is bigger than yours and dingier: battered furniture, hockey sticks, boxing gloves, a burst football, the banners of the Spies and the Youth League. Two children, a boy of nine and a girl of seven, both in the grey shorts and red neckerchiefs of the Spies, burst out from behind the table. The boy points a toy automatic pistol at you.

diary2:{title:'The Alcove, at night', map:'mansions', loc:'alcove', art:'telescreen',
  text:`Back in the alcove, you take up the pen again. The diary will be reduced to ashes and you to vapour. Only the Thought Police will read what you have written, before they wipe it out of existence and out of memory.

hate:{chapter:2, chTitle:'Two Minutes Hate', date:'5 April 1984', map:'minitrue', loc:'hateroom', w:'minitrue', art:'hate',
  text:`It is nearly eleven hundred, and in the Records Department they are dragging chairs out of the cubicles into the centre of the hall, facing the big telescreen, for the Two Minutes Hate.

Two people come in that you know by sight. One is a girl from the Fiction Department, bold-looking, dark-haired, a narrow scarlet sash wound round the waist of her overalls: the emblem of the Junior Anti-Sex League. You dislike her on sight. The other is O'Brien, a member of the Inner Party, a large burly man with a coarse, humorous, brutal face, who has a way of resettling his spectacles on his nose that is curiously disarming.

    lines:['Goldstein\'s sheep-like face fills the screen. Hiss!','He is abusing Big Brother. He is demanding freedom of speech! Shout him down!','Behind his head march the endless Eurasian columns. Jeer!','People are leaping up and down in their places, shouting at the tops of their voices. Shout!','The girl behind you is crying "Swine! Swine! Swine!" Join in!','A little sandy-haired woman flings a dictionary at the screen. Cheer!','B-B! … B-B! … B-B! Chant!'],

hate2:{title:'The end of the Hate', song:'bbchant', art:'none',
  text:`The face of Goldstein melts into the face of Big Brother, black-haired, black-moustachio'd, full of power and mysterious calm. The little sandy-haired woman flings herself over the chair in front of her and murmurs something like "My Saviour!" Then the whole group breaks into the deep, slow, rhythmical chant: B-B! … B-B!

// ── III. THE PHYSICAL JERKS ─────────────────────────────────────────────────
Object.assign(BEATS, {
dream:{chapter:3, chTitle:'The Physical Jerks', date:'6 April 1984', map:'mansions', loc:'flat', art:'golden',
  text:`You dream of your mother, who disappeared when you were ten or eleven. She is somewhere deep below you, with your little sister in her arms, in the saloon of a sinking ship, looking up at you through darkening water. They are going down so that you can stay up here. You know it, and they know it, and there is no reproach in their faces.

Then you are standing on short springy turf on a summer evening. An old, rabbit-bitten pasture, a footpath, an elm hedge swaying in the breeze, a clear slow stream somewhere out of sight with dace in it. The Golden Country, you call it, in your dreams.

The dark-haired girl is coming towards you across the field. With a single movement she tears off her clothes and flings them aside, and the gesture seems to annihilate a whole culture, a whole system of thought, as though Big Brother and the Party could be swept into nothingness by one splendid movement of the arm.

You wake with the word "Shakespeare" on your lips.`,

jerks:{title:'07:15, Flat 7', art:'telescreen',

jerks2:{title:'Touching your toes', art:'none',
  text:`While your body bends and stretches, your mind slips away into the labyrinthine world of doublethink.

At this moment Oceania is at war with Eurasia and in alliance with Eastasia. But you know — you happen to know — that only four years ago it was the other way about. Where does that knowledge exist? Only in your own consciousness, which in any case must soon be annihilated. And if everyone accepts the lie the Party imposes, if all records tell the same tale, then the lie passes into history and becomes truth.

${PO('Who controls the past controls the future:<br>who controls the present controls the past.')}

ogilvy:{title:'Your Cubicle', loc:'memhole', art:'none',
  text:`A harder job arrives. In a Times of last December, Big Brother's Order for the Day praised one Comrade Withers. But Comrade Withers is now in disgrace. He has not been tried; he has simply vanished. He is an unperson. He does not exist; he never existed.

  text:`The canteen is low-ceilinged and deep underground, and the smell of its stew — a sourish composite smell of bad coffee, metallic stew and dirty clothes — rolls out to meet you. From the grille at the end of the counter you are handed a metal pannikin of pinkish-grey stew, a hunk of bread, a cube of cheese, a mug of milkless Victory Coffee and one saccharine tablet.

At a table under the telescreen sits Syme, your friend, if you can be said to have friends: a philologist working on the Eleventh Edition of the Newspeak Dictionary. Tiny, dark-haired, with large protuberant eyes, at once mournful and derisive, that seem to search your face closely while he speaks to you.

syme2:{title:'The Canteen', song:'newspeak', art:'none',
  text:`"Don't you see that the whole aim of Newspeak is to narrow the range of thought?" Syme leans closer. "In the end we shall make thoughtcrime literally impossible, because there will be no words in which to express it. By 2050, at the very latest, not a single human being will be alive who could understand such a conversation as we are having now."

// ── VI. IF THERE IS HOPE ────────────────────────────────────────────────────

  text:`You have done it again: skipped an evening at the Community Centre. It is never safe. In Newspeak there is a word for it, ownlife, meaning individualism and eccentricity. But the April air has tempted you, and you have wandered off into the labyrinth of London, north and east, into the prole streets.
