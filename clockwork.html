<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Horrorshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d0e;--ink2:#5c4327;--ink3:#8a6c45;--parch:#f2e4c0;--parch2:#e6d09c;--edge:#a8834a;
  --gold:#c9a227;--gold2:#ffd76a;--red:#8b1e1e;--elf:#2f5f4f;--sea:#9fb4a8;--bg:#1a120b;--bg2:#2b1d12;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#140d07 radial-gradient(ellipse at 50% 0%,#3a2716 0%,#140d07 70%);color:var(--ink);
  font-family:'Crimson Pro',Georgia,'Times New Roman',serif;font-size:17px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.sview{position:relative}
.sdpad{display:none}
.hidden{display:none!important}

/* header */
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(#2e1f12,#1b120a);
  border-bottom:2px solid #6b4c22;color:#e9d6a6;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:'Bungee',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em;color:var(--gold2);
  text-shadow:0 0 8px rgba(255,190,60,.35);white-space:nowrap}
.brand span{display:block;font-size:.62rem;letter-spacing:.3em;color:#b99a62;font-weight:500}
#stats{display:flex;gap:12px;flex:1;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font-size:.9rem;min-width:110px}
.stat .lbl{color:#c8ad78;font-variant:small-caps;letter-spacing:.05em}
.bar{width:70px;height:8px;background:#0e0905;border:1px solid #6b4c22;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.ringicon{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 6px var(--gold);transition:all .5s}
.date{font-style:italic;color:#cdb47f;font-size:.88rem;margin-left:auto;white-space:nowrap}
.hbtns button{background:#3b2815;border:1px solid #7a5a2c;color:#f0dca8;border-radius:6px;padding:4px 10px;font-size:1rem;margin-left:4px}
.hbtns button:hover{background:#4d351c}

/* layout */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;max-width:1440px;margin:0 auto;padding:14px}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(140,100,40,.18),transparent 55%);
  border:1px solid var(--edge);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,30,.25)}
#stage{padding:18px 26px 26px;min-height:70vh}
#side{display:flex;flex-direction:column;min-height:70vh;max-height:calc(100vh - 90px);position:sticky;top:76px}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
#tabs button{flex:1;background:transparent;border:0;border-right:1px solid rgba(168,131,74,.4);padding:8px 4px;
  font-family:'Bungee',sans-serif;font-size:.72rem;color:var(--ink2);letter-spacing:.04em}
#tabs button.on{background:rgba(201,162,39,.22);color:var(--ink);font-weight:700}
#panel{padding:12px 14px;overflow-y:auto;flex:1}

/* stage */
.chaphead{text-align:center;margin-bottom:6px}
.chaphead .cn{font-family:'Bungee',sans-serif;font-size:.78rem;letter-spacing:.35em;color:var(--ink3)}
.chaphead h2{font-family:'Bungee',sans-serif;margin:2px 0 0;font-size:1.55rem;color:var(--ink);letter-spacing:.03em}
.chaphead .where{font-style:italic;color:var(--ink2);font-size:.95rem}
.rule{height:10px;margin:8px auto 12px;width:60%;background:radial-gradient(circle,var(--edge) 2px,transparent 3px) center/14px 10px repeat-x;opacity:.7}
.art{margin:0 auto 12px;max-width:760px;cursor:zoom-in;position:relative}
.art svg{width:100%;height:auto;display:block;border-radius:3px}
.art .hint{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--ink2);background:rgba(242,228,192,.85);padding:1px 6px;border-radius:3px}
.text{max-width:760px;margin:0 auto}
.text p{font-size:1.12rem;line-height:1.62;margin:0 0 .85em}
.text p.first::first-letter{font-family:'Courier Prime',monospace;float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--red)}
.text .speech{color:#3b2a14}
.text em{color:#4a3518}
.choices{max-width:760px;margin:16px auto 0;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:rgba(252,251,247,.55);border:1px solid var(--edge);border-radius:4px;padding:10px 14px;
  font-size:1.05rem;color:var(--ink);transition:all .15s;position:relative}
.choice:hover{background:#ffffff;transform:translateX(3px);box-shadow:0 2px 8px rgba(90,60,20,.25)}
.choice .tag{font-size:.75rem;color:var(--ink3);font-variant:small-caps;margin-left:6px}
.choice.ring{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,215,106,.35),rgba(252,251,247,.5));}
.choice.ring::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-radius:50%;margin-right:8px;vertical-align:-1px;box-shadow:0 0 5px var(--gold)}
.choice.talk::before{content:'❝ ';color:var(--elf)}
.choice.go{font-weight:600}
.choice.game{border-style:double;border-width:3px}
.choice[disabled]{opacity:.45;pointer-events:none}
.choice.disabled-choice{opacity:.55;font-style:italic}
.result{max-width:760px;margin:10px auto;border-left:3px solid var(--edge);padding:6px 14px;background:rgba(252,251,247,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:2px 8px;border-radius:10px;border:1px solid var(--edge);background:#f2f0e8}
.chip.good{border-color:#4f7d3a;color:#2f5a1c;background:#eef6dc}
.chip.bad{border-color:#9c3b2b;color:#7a2416;background:#f8e2d8}
.chip.ring{border-color:var(--gold);background:#fff1b8;color:#6b4c00}
.btn{background:linear-gradient(#5b3f1f,#3c2912);color:#f6e4b4;border:1px solid #2a1a0a;border-radius:4px;padding:9px 18px;
  font-family:'Bungee',sans-serif;font-size:.9rem;letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.btn:hover{background:linear-gradient(#6d4c26,#4a3317)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--edge);box-shadow:none}
.btn.gold{background:linear-gradient(#e9c45a,#b88d1c);color:#2b1d0e;border-color:#7a5a10}
.center{text-align:center}

/* song card */
.song{max-width:560px;margin:14px auto;padding:14px 22px;background:rgba(255,252,240,.6);border:1px solid var(--edge);
  border-radius:4px;font-family:'Courier Prime',monospace;position:relative}
.song h3{font-family:'Bungee',sans-serif;font-size:1rem;margin:0 0 2px;text-align:center}
.song .by{text-align:center;font-style:italic;font-size:.85rem;color:var(--ink3);margin-bottom:8px}
.song .st{margin:0 0 10px}
.song .ln{display:block;font-size:1.05rem;line-height:1.45;transition:color .2s,background .2s;padding:0 4px;border-radius:3px}
.song .ln.lit{background:rgba(201,162,39,.3);color:#000}
.song .sing{display:block;margin:6px auto 0}

/* side panels */
.ptitle{font-family:'Bungee',sans-serif;font-size:.95rem;margin:4px 0 8px;color:var(--ink);letter-spacing:.04em}
.char{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--edge)}
.char .av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Bungee',sans-serif;font-weight:700;color:#fff;font-size:1rem;border:2px solid rgba(0,0,0,.25)}
.char .nm{font-weight:600}
.char .ds{font-size:.85rem;color:var(--ink2);line-height:1.3}
.char .here{font-size:.7rem;color:var(--elf);font-variant:small-caps;margin-left:4px}
.abar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.abar i{position:absolute;top:0;bottom:0;border-radius:3px}
.item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--edge)}
.item .ic{font-size:1.5rem;width:34px;text-align:center}
.item .nm{font-weight:600}.item .ds{font-size:.85rem;color:var(--ink2)}
.songli,.mapli{display:block;width:100%;text-align:left;background:rgba(252,251,247,.5);border:1px solid var(--edge);
  margin-bottom:6px;padding:7px 10px;border-radius:3px;font-size:.95rem;color:var(--ink)}
.songli small{display:block;color:var(--ink3);font-style:italic}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid button{padding:4px;background:rgba(252,251,247,.5);border:1px solid var(--edge);border-radius:3px;font-size:.75rem;color:var(--ink)}
.mapgrid svg{width:100%;height:auto;display:block}
.mapgrid .lock{opacity:.35;pointer-events:none}
.log{font-size:.88rem;line-height:1.35;padding:5px 0;border-bottom:1px dotted rgba(168,131,74,.5)}
.log b{color:var(--ink3);font-weight:400;font-style:italic}
.meta{font-size:.82rem;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .mbox{max-width:1100px;width:100%;max-height:94vh;overflow:auto;position:relative;padding:18px}
#modal .mclose{position:absolute;right:8px;top:6px;background:none;border:0;font-size:1.8rem;color:var(--ink2);z-index:2}

/* toasts */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;align-items:center}
.toast{background:#2b1d0e;color:#f3e2b2;border:1px solid var(--gold);padding:6px 14px;border-radius:16px;font-size:.92rem;
  animation:tin .3s ease-out,tout .5s 2.6s forwards;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.bad{border-color:#c2543f}.toast.good{border-color:#7fae58}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* wraith world flash */
body.wraith #wrap{filter:grayscale(1) blur(1.5px) contrast(1.3) brightness(.7);transition:filter .3s}
#eye{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 9% 18% at 50% 45%,#000 30%,transparent 32%),radial-gradient(ellipse 22% 26% at 50% 45%,#ff7a12 0%,#c22a00 45%,rgba(120,10,0,.6) 60%,transparent 75%)}
body.wraith #eye{opacity:.55}

/* games */
.gwrap{max-width:820px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.ghead .gt{font-family:'Bungee',sans-serif;font-size:1.1rem}
.ghud{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.ghud b{font-family:'Bungee',sans-serif}
canvas.gc{width:100%;height:auto;display:block;background:#000;border:2px solid #4a3317;border-radius:4px;touch-action:none}
.gmsg{min-height:1.6em;font-style:italic;text-align:center;margin:8px 0;color:var(--ink2)}
.gbar{height:16px;background:rgba(0,0,0,.15);border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin:4px 0}
.gbar i{display:block;height:100%;transition:width .08s}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin:10px auto}
.dpad button{font-size:1.3rem;border-radius:6px;border:1px solid var(--edge);background:#f2f0e8}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:12px;justify-content:center;margin:14px auto}
.pad{height:110px;border-radius:12px;border:3px solid rgba(0,0,0,.3);font-size:2.4rem;color:rgba(255,255,255,.9);transition:filter .1s,transform .1s}
.pad.lit{filter:brightness(1.8) drop-shadow(0 0 14px #fff);transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{padding:10px;border:1px solid var(--edge);background:rgba(252,251,247,.6);border-radius:4px;font-size:1rem}
.opts button:hover{background:#ffffff}
.riddle{font-family:'Courier Prime',monospace;font-size:1.2rem;line-height:1.5;text-align:center;padding:14px;background:rgba(255,252,240,.5);border:1px solid var(--edge);border-radius:4px;white-space:pre-line}
.inline-input{font-family:'Courier Prime',monospace;font-size:1.3rem;padding:6px 12px;border:1px solid var(--edge);border-radius:4px;background:#fffaf0;width:220px;text-align:center}
.qkeys{display:flex;gap:10px;justify-content:center;margin:12px 0}
.qkeys button{width:64px;height:64px;font-size:1.8rem;border-radius:8px;border:2px solid var(--edge);background:#f2f0e8}
.qkeys button.want{background:#ffe08a;border-color:#a57b00;box-shadow:0 0 12px #ffcc33}
.qprompt{font-size:3.2rem;text-align:center;font-family:'Bungee',sans-serif;margin:4px 0}
.tcell{cursor:pointer}

/* title */
.titlescr{text-align:center;padding:30px 10px}
.titlescr h1{font-family:'Bungee',sans-serif;font-size:2.8rem;margin:10px 0 0;letter-spacing:.06em;color:#3b2408}
.titlescr .sub{font-family:'Courier Prime',monospace;font-style:italic;font-size:1.25rem;color:var(--ink2)}
.titlescr .verse{font-family:'Courier Prime',monospace;font-size:1.1rem;line-height:1.6;margin:18px auto;max-width:480px;color:var(--ink2)}
.titlescr .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ending h2{font-family:'Bungee',sans-serif;text-align:center;font-size:1.8rem;margin:6px 0}
.etable{margin:10px auto;border-collapse:collapse;font-size:.95rem}
.etable td{padding:3px 10px;border-bottom:1px dotted var(--edge)}

/* the Ring makes you vanish: the world goes grey-gold and thin */
body.wraith #wrap{filter:grayscale(.8) sepia(.4) blur(1.2px) brightness(.82);transition:filter .3s}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);border:1px solid #6b4c00;vertical-align:-3px}
.greedicon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);transition:all .5s}
.choice.gold{border:1px solid #b88d1c;background:linear-gradient(90deg,rgba(233,196,90,.35),rgba(252,251,247,.5))}
.choice.gold::before{content:'◆ ';color:#a57b00}
.bid{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px dotted var(--edge)}
.bid .lot{flex:1}.bid .lot b{display:block}.bid .lot small{color:var(--ink2)}
.smaugline{font-family:'Courier Prime',monospace;font-size:1.15rem;line-height:1.5;padding:12px 16px;background:rgba(60,10,0,.08);border-left:4px solid #8b1e1e;margin:8px 0}
@media (max-width:900px){
  #top{position:static;padding:8px 12px;gap:8px}
  .brand{flex:1}
  .hbtns{order:2}
  #stats{order:3;flex:0 0 100%;gap:8px 14px}
  .side-here{display:none}
  .sview{overflow:hidden;max-height:62vh;border-radius:4px}
  .sview canvas.gc{width:860px;max-width:none}
  .sdpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin:10px auto 0;user-select:none;-webkit-user-select:none}
  .sdpad button{font-size:1.4rem;border-radius:8px;border:1px solid var(--edge);background:#f2f0e8;touch-action:none}
  .sdpad button.on{background:#ffe08a}
  #wrap{grid-template-columns:minmax(0,1fr);padding:8px}
  #stage,#side{min-width:0}
  #side{position:static;max-height:none;min-height:0}
  #stage{padding:14px 14px 20px;min-height:0}
  .date{margin-left:0}
  .stat{min-width:0}.bar{width:48px}
  .text p{font-size:1.05rem}
  .opts{grid-template-columns:1fr}
  .brand{font-size:1.05rem}
}

/* ═══ KOROVA: milk-white paper, black ink, orange and magenta ═══ */
:root{
  --ink:#141414;--ink2:#3e3e3e;--ink3:#777;--parch:#f4f1ea;--parch2:#e6e1d6;--edge:#9a958a;
  --gold:#e2640f;--gold2:#ffd2a8;--red:#b0186a;--elf:#e2640f;--sea:#a9c2c8;--bg:#0b0b0b;--bg2:#1a1a1a;
}
body{background:#080808 radial-gradient(ellipse at 50% 0%,#2a1c14 0%,#080808 70%);color:var(--ink)}
#top{background:linear-gradient(#161616,#060606);border-bottom:3px solid var(--gold);color:#f4f1ea}
.brand{font-family:'Bungee',sans-serif;color:#fff;text-shadow:0 0 10px rgba(226,100,15,.5);letter-spacing:.06em}
.brand span{color:#e2640f;letter-spacing:.24em;font-family:'Courier Prime',monospace;font-weight:700}
.stat .lbl{color:#c9c2b2}
.bar{background:#000;border-color:#4a4a4a}
.date{color:#d8d0c0;font-family:'Courier Prime',monospace;font-style:italic}
.hbtns button{background:#1f1f1f;border-color:#555;color:#fff}
.hbtns button:hover{background:#333}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.6),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(226,100,15,.07),transparent 55%);
  border:1px solid var(--edge);border-radius:2px;box-shadow:0 6px 30px rgba(0,0,0,.75)}
#tabs button{color:var(--ink2);font-family:'Bungee',sans-serif;font-size:.62rem;letter-spacing:.04em}
#tabs button.on{background:rgba(226,100,15,.16);color:#a5410a}
.chaphead .cn{font-family:'Courier Prime',monospace;color:var(--gold);letter-spacing:.3em;font-weight:700}
.chaphead h2{font-family:'Bungee',sans-serif;font-weight:400;font-size:1.45rem;letter-spacing:.02em}
.chaphead .where{font-family:'Courier Prime',monospace}
.rule{background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--red) 80%,transparent) center/100% 3px no-repeat;opacity:.8}
.text p.first::first-letter{font-family:'Bungee',sans-serif;color:var(--gold);font-size:3em;padding:4px 8px 0 0}
.text .say{color:#5a1038}
.text .nad{display:block;font-family:'Courier Prime',monospace;background:#141414;color:#ffd2a8;padding:8px 12px;border-left:4px solid var(--gold);margin:4px 0}
.text .page{display:block;font-family:'Courier Prime',monospace;background:#fffdf6;border:1px solid #bbb;padding:10px 14px;margin:6px 0;box-shadow:2px 2px 0 #ccc;transform:rotate(-.6deg)}
.text .sign{display:block;text-align:center;font-family:'Bungee',sans-serif;letter-spacing:.08em;font-size:1.2rem;color:#fff;background:#141414;padding:10px;border:3px solid var(--gold);margin:6px auto;max-width:520px;line-height:1.5}
.choice{border-radius:2px}
.choice.talk::before{content:'❝ ';color:var(--gold)}
.choice.uv{border:1px solid var(--red);background:linear-gradient(90deg,rgba(176,24,106,.14),rgba(252,251,247,.5))}
.choice.uv::before{content:'✸ ';color:var(--red)}
.choice.music{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(226,100,15,.14),rgba(252,251,247,.5))}
.choice.music::before{content:'♫ ';color:var(--gold)}
.btn{background:linear-gradient(#2a2a2a,#0e0e0e);color:#fff;border:1px solid #000;border-radius:2px}
.btn.gold{background:linear-gradient(#f07a24,#b44a06);color:#fff;border-color:#5a2402}
.chip.ring{border-color:var(--red);background:#f8d8e8;color:#7a0e48}
.toast{background:#121212;color:#fff;border-color:#e2640f;border-radius:2px;font-family:'Courier Prime',monospace;font-size:.88rem}
.toast.ring{border-color:#d0207a;color:#ffb0d4}
.song h3{font-family:'Bungee',sans-serif;font-weight:400}
.song .ln.lit{background:rgba(226,100,15,.25)}
.log{font-family:'Courier Prime',monospace;font-size:.86rem}
.log b{color:#a5410a;font-style:normal}
.word{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted var(--edge);font-size:.9rem}
.word b{font-family:'Courier Prime',monospace;min-width:110px;color:#a5410a}
.titlescr h1{font-family:'Bungee',sans-serif;font-weight:400;color:#141414;font-size:2.8rem;letter-spacing:.02em}
.titlescr .sub{font-family:'Courier Prime',monospace;font-style:italic;font-size:1.02rem}
.titlescr .verse{font-family:'Courier Prime',monospace;font-weight:700;color:var(--red);font-size:1.2rem}
.ending h2{font-family:'Bungee',sans-serif;font-weight:400}

<body>
<header id="top">
  <div class="brand">Real Horrorshow<span>A NADSAT TALE IN 21 CHAPTERS</span></div>
  <div id="stats"></div>
  <div class="hbtns"><button id="btnSound" title="Sound effects">♪</button><button id="btnMenu" title="Menu">☰</button></div>
</header>
<main id="wrap">
  <section id="stage" class="parch"></section>
  <aside id="side" class="parch"><nav id="tabs"></nav><div id="panel"></div></aside>
</main>
<div id="modal" class="hidden"><div class="mbox parch"><button class="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="toasts"></div>
<div id="scan"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   REAL HORRORSHOW — an unofficial game after Anthony Burgess's novel
   A Clockwork Orange (1962). You are Alex, your humble narrator.
   The novel is in copyright, so only short phrases are quoted; the prose,
   verses and games are new. The book's sexual violence is not depicted.
   Built on the engine of burglar.html.
   ═══════════════════════════════════════════════════════════════════════════ */

// ── UTILITIES ───────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffle(a, r){ r = r || Math.random; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const tx = t => typeof t === 'function' ? t(G) : (t || '');


// ── NADSAT ──────────────────────────────────────────────────────────────────
// Collected word by word as you hear them; the quiz draws on them.
const NADSAT = {
  droog:'friend', horrorshow:'good, great', viddy:'see, look', moloko:'milk', malchick:'boy', devotchka:'girl',
  tolchock:'hit, blow', krovvy:'blood', britva:'razor', cutter:'money', deng:'money', rassoodock:'mind',
  gulliver:'head', litso:'face', millicent:'policeman', nochy:'night', skorry:'quick', starry:'old',
  ptitsa:'woman', glazzies:'eyes', lewdies:'people', platties:'clothes', slooshy:'listen, hear', govoreet:'speak',
  'pee and em':'father and mother', bog:'God', baboochka:'old woman', chelloveck:'man', veck:'man, fellow',
  razdraz:'angry, upset', zoobies:'teeth', rooker:'hand', noga:'foot, leg', staja:'State Jail', charlie:'chaplain',
  skolliwoll:'school', yahzick:'tongue', smeck:'laugh', bezoomny:'mad', 'appy polly loggy':'apology',
  sinny:'cinema', cancer:'cigarette', spatchka:'sleep', 'oddy knocky':'alone, on your own', prestoopnik:'criminal',
  tashtook:'handkerchief', eggiweg:'egg', rabbit:'work', biblio:'library', mesto:'place', 'shiny':'?'
};
delete NADSAT.shiny;
const PAGES = [
  'A CLOCKWORK ORANGE — by F. Alexander. (Typescript, first page, much crossed out.)',
  'To wind a man up like a toy, so that he walks only where he is pointed, is the greatest wrong that a state can do.',
  'A man is a growing thing, sweet like fruit and just as able to go rotten; he is not a mechanism to be oiled and set.',
  'Better a man who chooses wrongly than a clock that cannot choose at all.'];
const pageCount = () => [0, 1, 2, 3].filter(i => G.flags['page' + i]).length;

// ── ITEMS (your carmans, O my brothers) ─────────────────────────────────────
const ITEMS = {
  britva:{n:'Britva', ic:'🪒', d:'An old-fashioned cut-throat. Very horrorshow for flashing in the light of the street lamps.'},
  bowler:{n:'Bowler', ic:'🎩', d:'A black bowler on your gulliver, the height of fashion this season, with white platties and the boots for kicking.'},
  moloko:{n:'Moloko Plus', ic:'🥛', d:'Milk with something in it, from the Korova Milkbar. Sharpens you up for a bit of the old ultra-violence.'},
  disc_ninth:{n:'Disc: the Ninth', ic:'💿', d:'Ludwig van, the Ninth Symphony, the last movement with the choir. The loveliest thing ever made.'},
  disc_mozart:{n:'Disc: the Jupiter', ic:'💿', d:'Mozart, the Jupiter Symphony. Bought at Melodia, with real cutter, which surprised the shop-veck.'},
  disc_bach:{n:'Disc: Brandenburg', ic:'💿', d:'J. S. Bach, a Brandenburg Concerto, for middle and low strings. Calming, like being let off.'},
  page:{n:'Typescript Pages', ic:'📄', d:'Torn sheets from a book being written by a veck in a cottage called HOME. A Clockwork Orange, it is called. A gloopy title.'},
  number:{n:'Number 6655321', ic:'🔢', d:'Not a thing in your carman, but on your platties, and in place of your name.'},
  bible:{n:'The Big Book', ic:'📖', d:'Lent by the prison charlie. You like the bits with the old Yahudis tolchocking each other, and the wine, and less the preachy bits.'},
  wallet:{n:'A Photograph', ic:'🖼️', d:'Cut from a gazetta and kept in your carman, you don\'t know why. A baby gurgling goo goo goo.'},
  cash_purse:{n:'A Little Purse', ic:'👛', d:'Picked up in the street, with a few coins in it and a name and address inside.'}
};

// ── PERSONS ─────────────────────────────────────────────────────────────────
const CHARS = {
  pete:{n:'Pete', c:'#4a6a8a', d:'The quiet one of your droogs. Not much for a fight, but always there. Pete will grow up first.'},
  georgie:{n:'Georgie', c:'#8a4a2a', d:'Ambitious, a thinker of a kind. He has ideas about who should be leader, and about bigger jobs with bigger cutter.'},
  dim:{n:'Dim', c:'#5a5a2a', d:'Very dim, as the name tells you, with a horrible loud laugh and a chain round his waist. Very strong. Very loyal, until he isn\'t.'},
  billyboy:{n:'Billyboy', c:'#6a2a2a', d:'Leader of a rival gang. Fat, with a smell like cheap oil, and your sworn enemy since you were nadsats together.'},
  deltoid:{n:'P. R. Deltoid', c:'#5a5a5a', d:'Your Post-Corrective Adviser. A tired, overworked veck who keeps telling you you\'ll end up in the Staja. He is right, which you hate.'},
  pee:{n:'Your Pee and Em', c:'#7a6a5a', d:'Your father and mother. They work all day and are frightened of you at night, and do not ask where the money comes from.'},
  catlady:{n:'The Cat Woman', c:'#8a7a9a', d:'A starry ptitsa who lives alone in a big house called the Manse, with about a dozen cats and some very valuable things.'},
  falexander:{n:'F. Alexander', c:'#3a5a4a', d:'A writer, living in a cottage out in the country with the name HOME on the gate. He is writing a book called A Clockwork Orange.'},
  charlie:{n:'The Prison Charlie', c:'#2a2a4a', d:'The chaplain at Staja 84F, who drinks a bit, and preaches a lot, and really does seem to care about choice.'},
  brodsky:{n:'Dr Brodsky', c:'#2a4a4a', d:'The great man of Ludovico\'s Technique. Small, plump, with curly hair and very thick glasses. Very kind voice.'},
  branom:{n:'Dr Branom', c:'#4a4a6a', d:'Dr Brodsky\'s assistant, all smiles, like a brother. He gives the injections.'},
  minister:{n:'The Minister', c:'#1a1a1a', d:'The Minister of the Interior — the Inferior, you call him — who wants the prisons emptied for political prisoners and wants votes for it.'},
  joe:{n:'Joe the Lodger', c:'#6a6a4a', d:'The lodger who took your room while you were away, and calls your Pee and Em "Dad" and "Mum".'},
  professor:{n:'The Starry Professor', c:'#7a7a6a', d:'An old veck from the Public Biblio, with books under his arm. You and your droogs tolchocked him once. He has not forgotten.'},
  drunk:{n:'The Old Drunkie', c:'#5a4a3a', d:'An old veck under the railway bridge, singing the songs of his fathers, very filthy and very loud.'},
  babooshkas:{n:'The Starry Baboochkas', c:'#9a7a7a', d:'Three old women in the snug of the Duke of New York, always happy to be bought a drink, and to say you never left the pub all night.'},
  georgina:{n:'Georgina', c:'#b0186a', d:'Pete\'s wife. A nice devotchka who laughs at the way you talk.'},
  governor:{n:'The Governor', c:'#3a3a3a', d:'The Governor of Staja 84F. A thin veck who is frightened of the Minister.'}
};

// ── SOUND ───────────────────────────────────────────────────────────────────
const SND = (() => {
  let ctx = null, on = false, master = null, playing = [], lineTimers = [];
  try { on = localStorage.getItem('horrorshowSound') === '1'; } catch (e) {}
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = mf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .25, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05); playing.push(o);
  }
  function noise(t, dur, vol, freq){
    const c = ac(); if (!c) return;
    const b = c.createBuffer(1, Math.max(1, c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 3000;
    const g = c.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); playing.push(s);
  }
  function fx(kind){
    if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    switch (kind){
      case 'click': note(84, t, .06, 'square', .05); break;
      case 'good': note(72, t, .15, 'triangle', .2); note(76, t + .08, .15, 'triangle', .2); note(79, t + .16, .3, 'triangle', .2); break;
      case 'bad': note(52, t, .3, 'sawtooth', .12); note(47, t + .12, .4, 'sawtooth', .12); break;
      case 'ring': note(40, t, 1.4, 'sine', .3); note(47, t, 1.4, 'sine', .15); noise(t, 1.2, .08, 400); break;
      case 'hit': noise(t, .15, .3, 900); break;
      case 'boom': note(30, t, .6, 'sine', .5); noise(t, .4, .25, 200); break;
      case 'firework': noise(t, .5, .25, 1800); note(ri(80, 95), t, .2, 'sine', .08); break;
      case 'splash': noise(t, .35, .2, 1200); break;
      case 'shriek': { const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(500, t + .9);
        g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.05); break; }
      case 'step': noise(t, .05, .12, 500); break;
    }
  }
  function tone(m, dur, type, vol){ if (!on) return; const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  function toneAlways(m, dur, type, vol){ const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  // play a generated melody; onLine(i) fires as each line starts
  function sing(mel, onLine, onEnd){
    stop(); const c = ac(); if (!c) { if (onEnd) onEnd(); return; }
    const beat = 60 / mel.tempo; let t = c.currentTime + .15; const t0 = t;
    mel.lines.forEach((line, li) => {
      lineTimers.push(setTimeout(() => onLine && onLine(li), (t - t0) * 1000 + 150));
      line.forEach(([m, d]) => {
        note(m, t, d * beat * 1.6, mel.voice, .22); note(m + 12, t, d * beat * .8, 'sine', .05);
        if (mel.drum && d >= 1) noise(t, .05, .06, 4000);
        t += d * beat;
      });
      note(mel.root - 12, t - line.reduce((a, n) => a + n[1], 0) * beat, line.reduce((a, n) => a + n[1], 0) * beat, 'sine', mel.drone ? .08 : .03);
      t += beat * .5;
    });
    lineTimers.push(setTimeout(() => { if (onEnd) onEnd(); }, (t - t0) * 1000 + 300));
  }
  function stop(){ lineTimers.forEach(clearTimeout); lineTimers = []; playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = []; }
  return { fx, tone, toneAlways, sing, stop, ac,
    get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('horrorshowSound', v ? '1' : '0'); } catch (e) {} } };
})();


// ── STATE ───────────────────────────────────────────────────────────────────
const SAVE_KEY = 'horrorshowSave';
let G = null;
const UI = { tab:'map', game:null, inst:null, mapZoom:null };

function newGame(){
  return {
    version:1, beat:null, chapter:1, chTitle:'', date:'', map:'wild', loc:'korova',
    stats:{hum:55, health:100, sus:5, food:15, cash:6},
    aff:{pete:30, georgie:20, dim:25, billyboy:-40, deltoid:0, pee:10, catlady:0, falexander:0, charlie:0, brodsky:0},
    met:['pete','georgie','dim','pee'],
    party:['pete','georgie','dim'], gone:[], words:[],
    items:['britva','bowler'], flags:{}, songs:[], maps:['wild'], seen:{}, route:['korova'],
    log:[], ringUses:0, games:{}, pending:null, checkpoint:null, ending:null, started:Date.now()
  };
}
function save(){ if (!G) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function tryLoad(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.version === 1 && BEATS[s.beat]) return s; } catch (e) {}
  return null;
}
function snapshot(){ const c = Object.assign({}, G); delete c.checkpoint; return JSON.parse(JSON.stringify(c)); }

const has = k => G.items.indexOf(k) >= 0;
const flag = k => !!G.flags[k];
const aff = k => G.aff[k] || 0;
const inParty = k => G.party.indexOf(k) >= 0;
const partOf = ch => ch <= 7 ? 1 : ch <= 14 ? 2 : 3;
const cured = () => G.flags.cured && !G.flags.uncured;

// ── EFFECTS ─────────────────────────────────────────────────────────────────
// hum = Choice (free will) · food = Grown (maturity) · sus = Heat · cash = cutter
const STAT_NAME = {hum:'Choice', health:'Health', sus:'Heat', food:'Grown', cash:'Cutter'};
const STAT_MAX = {hum:100, health:100, sus:100, food:100, cash:999};
function applyFx(fx){
  const out = [];
  if (!fx) return out;
  ['hum','health','sus','food','cash'].forEach(k => {
    if (!fx[k]) return;
    if (k === 'sus' && G.flags.arrested) return;
    const before = G.stats[k];
    G.stats[k] = clamp(before + fx[k], 0, STAT_MAX[k]);
    const d = G.stats[k] - before; if (!d) return;
    const good = k === 'sus' ? d < 0 : d > 0;
    out.push({t:`${STAT_NAME[k]} ${d > 0 ? '+' : ''}${d}`, c: k === 'sus' && d > 0 ? 'ring' : good ? 'good' : 'bad'});
  });
  if (fx.aff) Object.keys(fx.aff).forEach(k => {
    const v = fx.aff[k]; G.aff[k] = clamp((G.aff[k] || 0) + v, -100, 100);
    const nm = (CHARS[k] ? CHARS[k].n : k).replace(/^(The |Your |Dr |P\. R\. )/, '').split(/[ (]/)[0];
    out.push({t:`${nm} ${v > 0 ? '♥+' + v : '♥' + v}`, c: v > 0 ? 'good' : 'bad'});
  });
  [].concat(fx.item || []).forEach(k => { if (!has(k)){ G.items.push(k); out.push({t:'Gained: ' + ITEMS[k].n, c:'good'}); } });
  [].concat(fx.lose || []).forEach(k => { const i = G.items.indexOf(k); if (i >= 0){ G.items.splice(i, 1); out.push({t:'Lost: ' + ITEMS[k].n, c:'bad'}); } });
  [].concat(fx.flag || []).forEach(k => { G.flags[k] = true; });
  if (fx.flags) Object.assign(G.flags, fx.flags);
  [].concat(fx.song || []).forEach(k => { if (learnSong(k)) out.push({t:'Music: ' + SONGS[k].title, c:'good'}); });
  [].concat(fx.map || []).forEach(k => { if (unlockMap(k)) out.push({t:'New map: ' + MAPS[k].title, c:'good'}); });
  [].concat(fx.meet || []).forEach(k => { if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.join || []).forEach(k => { if (G.party.indexOf(k) < 0) G.party.push(k); if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.leave || []).forEach(k => { const i = G.party.indexOf(k); if (i >= 0) G.party.splice(i, 1); });
  [].concat(fx.vaporize || []).forEach(k => { if (G.gone.indexOf(k) < 0){ G.gone.push(k); out.push({t:(CHARS[k] ? CHARS[k].n : k) + ' has snuffed it', c:'bad'}); } });
  [].concat(fx.word || []).forEach(w => { if (NADSAT[w] && G.words.indexOf(w) < 0){ G.words.push(w); out.push({t:`Nadsat: ${w} — ${NADSAT[w]}`, c:''}); } });
  [].concat(fx.page === undefined ? [] : fx.page).forEach(i => {
    if (G.flags['page' + i]) return; G.flags['page' + i] = true;
    out.push({t:'A page of the typescript (' + pageCount() + '/4)', c:'good'});
    if (pageCount() === 4 && learnSong('manuscript')) out.push({t:'The whole of F. Alexander\'s page: A Clockwork Orange', c:'good'});
  });
  return out;
}
// The old ultra-violence: Grown goes down. After Ludovico's Technique, even
// choosing it brings on the sickness instead.
function ringUse(cost){
  G.ringUses++;
  if (UI.game) { const o = applyFx({hum: -(cost || 2)}); wraithFlash(); return o; }   // innocent face, in a stealth map
  if (cured()){
    const o = applyFx({health:-12, hum:-2}); o.unshift({t:'The sickness! The Ludovico sickness!', c:'bad'});
    SND.fx('bad'); document.body.classList.add('sick'); setTimeout(() => document.body.classList.remove('sick'), 1800);
    return o;
  }
  const out = applyFx({food: -(cost || 3)});
  wraithFlash();
  return out;
}
function wraithFlash(){
  SND.fx('hit');
  document.body.classList.add('wraith');
  setTimeout(() => { if (!UI.ringHeld) document.body.classList.remove('wraith'); }, 700);
}
function learnSong(k){ if (!SONGS[k] || G.songs.indexOf(k) >= 0) return false; G.songs.push(k); return true; }
function unlockMap(k){ if (!MAPS[k] || G.maps.indexOf(k) >= 0) return false; G.maps.push(k); return true; }
function addLog(t){ G.log.unshift({d:G.date, t}); if (G.log.length > 150) G.log.length = 150; }
function markSeen(map, loc){ if (!G.seen[map]) G.seen[map] = []; if (G.seen[map].indexOf(loc) < 0) G.seen[map].push(loc); }

function toast(chips){
  const box = $('#toasts');
  chips.forEach((c, i) => setTimeout(() => {
    const d = document.createElement('div'); d.className = 'toast ' + (c.c || ''); d.textContent = c.t;
    box.appendChild(d); setTimeout(() => d.remove(), 3300);
  }, i * 220));
}

// ── BEAT ENGINE ─────────────────────────────────────────────────────────────
function failCheck(b, id){
  if (b.ending) return null;
  if (G.stats.health <= 0 && id !== 'fallen') return 'fallen';
  if (!G.flags.arrested && G.stats.sus >= 100 && id !== 'lowered') return 'lowered';
  return null;
}
function goBeat(id){
  const b = BEATS[id];
  if (!b){ console.error('Missing beat', id); return; }
  const re = G.beat === id;
  G.beat = id; G.pending = null;
  if (re){ save(); render(); return; }
  if (b.chapter){ G.chapter = b.chapter; G.chTitle = b.chTitle; G.checkpoint = null; G.checkpoint = snapshot(); }
  let chips = [];
  if (b.date) G.date = b.date;
  if (b.map){ G.map = b.map; unlockMap(b.map); }
  if (b.loc){ G.loc = b.loc; markSeen(G.map, b.loc); }
  if (b.w && G.route[G.route.length - 1] !== b.w) G.route.push(b.w);
  if (b.fx) chips = chips.concat(applyFx(typeof b.fx === 'function' ? b.fx(G) : b.fx));
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) learnSong(sg);
  if (b.travel){
    const need = b.travel;
    if (G.stats.food >= need) chips = chips.concat(applyFx({food:-need}));
    else { const short = need - G.stats.food; chips = chips.concat(applyFx({food:-G.stats.food, health:-6 * short, hum:-2 * short}));
      }
  }
  if (b.enter) b.enter(G);
  if (b.log) addLog(tx(b.log));
  const f = failCheck(b, id); if (f){ save(); return goBeat(f); }
  if (chips.length) toast(chips);
  save();
  render();
  window.scrollTo(0, 0);
}
function visibleChoices(b){ return (b.choices ? tx(b.choices) : []).filter(c => !c.if || c.if(G)); }
function choose(i){
  const b = BEATS[G.beat], c = visibleChoices(b)[i]; if (!c) return;
  SND.fx('click');
  let chips = applyFx(typeof c.fx === 'function' ? c.fx(G) : c.fx);
  if (c.dt) chips = chips.concat(ringUse(c.dt === true ? 3 : c.dt));
  if (c.act) c.act(G);
  let next = typeof c.go === 'function' ? c.go(G) : (c.go || G.beat);
  const f = failCheck(BEATS[next] || {}, next); if (f) next = f;
  const res = tx(c.res);
  if (res){ G.pending = {text:res, chips, next}; save(); render(); window.scrollTo(0, 0); }
  else { if (chips.length) toast(chips); goBeat(next); }
}
function continuePending(){ const n = G.pending.next; G.pending = null; goBeat(n); }

function paras(t, first){
  return String(t).split(/\n\s*\n/).map((p, i) => `<p class="${first && i === 0 ? 'first' : ''}">${p.trim()}</p>`).join('');
}
function chipHTML(chips){ return chips && chips.length ? `<div class="chips">${chips.map(c => `<span class="chip ${c.c || ''}">${esc(c.t)}</span>`).join('')}</div>` : ''; }
function locName(map, loc){
  const m = MAPS[map]; if (!m) return ''; const p = m.places.find(p => p.k === loc); return p ? p.n : '';
}
function headerHTML(b){
  return `<div class="chaphead"><div class="cn">PART ${['ONE','TWO','THREE'][partOf(G.chapter) - 1]} · CHAPTER ${G.chapter}</div><h2>${esc(G.chTitle || '')}</h2>
    <div class="where">${esc(b.title || locName(G.map, G.loc))}</div></div><div class="rule"></div>`;
}
function romanize(n){ const r = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]]; let s = ''; r.forEach(([k, v]) => { while (n >= v){ s += k; n -= v; } }); return s; }
function artHTML(b){
  if (b.art === 'none') return '';
  if (b.art && VIGNETTES[b.art]) return `<div class="art" data-vig="${b.art}">${VIGNETTES[b.art]()}</div>`;
  const map = b.map || G.map;
  return `<div class="art" data-map="${map}">${drawMap(map, {here:G.loc, small:true})}<span class="hint">click to enlarge</span></div>`;
}
function render(){
  renderStats(); renderSide();
  if (!G){ renderTitle(); return; }
  if (UI.game) return;
  const st = $('#stage'), b = BEATS[G.beat];
  if (b.ending){ st.innerHTML = renderEnding(b); wireStage(); return; }
  let h = headerHTML(b);
  if (G.pending){
    h += `<div class="text">${paras(G.pending.text, true)}</div>${G.pending.chips.length ? `<div class="result">${chipHTML(G.pending.chips)}</div>` : ''}
      <div class="choices"><button class="choice go" data-cont>Continue…</button></div>`;
    st.innerHTML = h; wireStage(); return;
  }
  h += artHTML(b);
  h += `<div class="text">${paras(tx(b.text), true)}</div>`;
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) h += songCard(sg);
  if (b.game){
    const gc = tx(b.game);
    h += `<div class="choices"><button class="choice game go" data-game>${esc(gc.label || 'Begin')}</button>
      <button class="choice" data-skip>Let Bog decide <span class="tag">skip the game · an average outcome</span></button></div>`;
  } else {
    const cs = visibleChoices(b);
    h += `<div class="choices">${cs.map((c, i) => {
      const cls = ['choice', c.dt ? 'uv' : '', c.talk ? 'talk' : '', c.cls || ''].join(' ');
      return `<button class="${cls}" data-c="${i}">${tx(c.t)}${c.tag ? `<span class="tag">${tx(c.tag)}</span>` : ''}${c.dt ? `<span class="tag">${G.flags.cured && !G.flags.uncured ? 'the sickness' : 'the old ultra-violence'}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }
  st.innerHTML = h; wireStage();
}
function wireStage(){
  const st = $('#stage');
  st.querySelectorAll('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c));
  const cont = st.querySelector('[data-cont]'); if (cont) cont.onclick = continuePending;
  const gb = st.querySelector('[data-game]'); if (gb) gb.onclick = () => startGame(tx(BEATS[G.beat].game));
  const sk = st.querySelector('[data-skip]'); if (sk) sk.onclick = () => { const gc = tx(BEATS[G.beat].game); UI.game = gc; finishGame({win: Math.random() < .55, score: .5, msg:'You let it all happen, O my brothers, the way things do.', fx: gc.skipFx}); };
  const art = st.querySelector('.art'); if (art) art.onclick = () => art.dataset.map ? openMap(art.dataset.map) : null;
  st.querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(el.dataset.sing, el.closest('.song')));
  st.querySelectorAll('[data-checkpoint]').forEach(el => el.onclick = restoreCheckpoint);
  st.querySelectorAll('[data-new]').forEach(el => el.onclick = startNew);
  st.querySelectorAll('[data-load]').forEach(el => el.onclick = () => { G = tryLoad(); render(); });
}
function restoreCheckpoint(){
  if (!G.checkpoint) return;
  const cp = G.checkpoint; G = JSON.parse(JSON.stringify(cp)); G.checkpoint = cp; G.pending = null;
  UI.game = null; if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null;
  save(); closeModal(); render(); toast([{t:'Back to the start of the chapter, O my brothers.'}]);
}
function startNew(){ SND.stop(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = newGame(); closeModal(); goBeat('start'); }

// geometry + map drawing (shared with ringbearer.html)
function pointInPoly(x, y, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function smoothPath(pts, closed){
  const L = pts.length, f = n => n.toFixed(1);
  if (L < 3) return 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join('L') + (closed ? 'Z' : '');
  const at = i => closed ? pts[(i + L) % L] : pts[clamp(i, 0, L - 1)];
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  const n = closed ? L : L - 1;
  for (let i = 0; i < n; i++){
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${f(c1x)},${f(c1y)} ${f(c2x)},${f(c2y)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + (closed ? 'Z' : '');
}
function samplePolyline(pts, step){

function songMelody(k){
  const s = SONGS[k];
  if (s._mel) return s._mel;
  const SC = {major:[0,2,4,5,7,9,11], mixo:[0,2,4,5,7,9,10], dorian:[0,2,3,5,7,9,10], aeolian:[0,2,3,5,7,8,10]}[s.mode];
  const r = seeded(hash(k)), root = s.mode === 'major' || s.mode === 'mixo' ? 62 : 60;
  const deg2m = d => root + 12 * Math.floor(d / 7) + SC[((d % 7) + 7) % 7];
  const lines = [];
  // one musical phrase per text line; phrases A/B repeat across stanzas
  const phrase = (len, end, seedR) => {
    const out = []; let d = Math.floor(seedR() * 5);
    for (let i = 0; i < len; i++){
      const last = i === len - 1;
      if (last) d = end;
      else { const st = seedR(); d += st < .35 ? 1 : st < .7 ? -1 : st < .85 ? 2 : -2; d = clamp(d, -2, 9); }
      const dur = last ? 2 : (seedR() < .25 && i < len - 2 ? .5 : 1);
      out.push([deg2m(d), dur]);
      if (dur === .5) out.push([deg2m(d + (seedR() < .5 ? 1 : -1)), .5]);
    }
    return out;
  };
  const phrases = [0, 1, 2, 3].map(i => phrase(7 + (i % 2), i === 3 ? 0 : i === 1 ? 4 : 2, seeded(hash(k + i))));
  s.v.forEach(st => st.forEach((ln, i) => lines.push(phrases[(i + (st.length === 2 ? i : 0)) % 4])));
  return (s._mel = {lines, tempo:s.tempo, voice: s.drum ? 'square' : 'triangle', root, drone:!!s.drone, drum:!!s.drum});
}
function songCard(k, full){
  const s = SONGS[k];
  let li = 0;
  const st = s.v.map(stz => `<div class="st">${stz.map(l => `<span class="ln" data-l="${li++}">${esc(l)}</span>`).join('')}</div>`).join('');
  return `<div class="song"><h3>${esc(s.title)}</h3><div class="by">${esc(s.by)}</div>${st}${s.read ? '' : `<button class="btn gold sing" data-sing="${k}">♪ Play it</button>`}</div>`;
}
function singSong(k, card){
  const mel = songMelody(k), lines = card ? card.querySelectorAll('.ln') : [];
  const btn = card && card.querySelector('.sing');
  if (btn){ if (btn.dataset.on){ SND.stop(); lines.forEach(l => l.classList.remove('lit')); btn.textContent = '♪ Play it'; delete btn.dataset.on; return; }
    btn.dataset.on = 1; btn.textContent = '■ Stop'; }
  SND.sing(mel, i => { lines.forEach(l => l.classList.remove('lit')); if (lines[i]) lines[i].classList.add('lit'); },
    () => { lines.forEach(l => l.classList.remove('lit')); if (btn){ btn.textContent = '♪ Play it'; delete btn.dataset.on; } });
}

    talk('why', '"Why do you care, brother?"', `"Why?" He looks at you like a sum that will not come out. They have studied boys like you for years and years, he says, and they still don't know what gets into you.\n\nYou almost tell him. Being bad is just you, O my brothers, the way being good is somebody else. You don't say it.`, {hum:3, aff:{deltoid:3}}),

melodia:{title:'Melodia', map:'wild', loc:'melodia', w:'melodia', art:'none',
  text:`In the afternoon you go to Melodia, the disc-bootick, where they sell the Nadsat pops and also the real music, for those who know. The pops are all in the front, for the young malchicks and devotchkas who come in after skolliwoll. The real horrorshow stuff is at the back, and they know you there.`,

// ── 5. MUTINY ───────────────────────────────────────────────────────────────
Object.assign(BEATS, {
mutiny:{chapter:5, chTitle:'Mutiny', map:'wild', loc:'flatblock', date:'Evening', art:'none',
  text:`When you come downstairs your three droogs are waiting at the bottom of the flatblock, and something has changed. You can viddy it in their litsos.

Georgie does the talking. Bigger jobs, he says. Bigger cutter. A man-sized crast, not malenky shop-tills. And — here it is — maybe there should not always be one veck giving all the orders.

Dim, behind him, grins his dim grin. Pete looks at his boots.`,
  fx:{word:['razdraz']},
  choices:[
    {t:'Teach them who leads. The britva, by the canal.', go:'canal', dt:8, fx:{sus:6, aff:{dim:-20, georgie:-10, pete:-6}, flag:'cutDim'}, res:`By the canal, under the lamps, you do it quick: a slash at Dim's rooker with the britva, a chain-swipe from him that misses, Georgie stepping back with his hands up. Krovvy on Dim's fingers. "All right, Alex. All right. You're the leader."\n\nThey say it. They do not mean it. You know that, deep in your gulliver, and you decide not to know it.`},
    {t:'"Let\'s talk it over, droogs, like brothers."', go:'canal', fx:{hum:6, food:6, aff:{georgie:6, dim:2, pete:6}, flag:'talked'}, res:`You surprise them, and yourself. You sit on the wall and talk, and Georgie talks, and Dim mostly laughs. Nobody gets cut. Georgie still wants the big job tonight, the big house in Oldtown with the starry ptitsa and her cats. You say yes, because it is easier than no.`},
    {t:'"Go on without me, then."', go:'cutloose', fx:{hum:12, food:10, aff:{georgie:-20, dim:-20, pete:-4}}, res:`You turn round and go back up the stairs. Behind you, Georgie laughs, not nicely. "Your loss, little brother."`}
  ]},
cutloose:{title:'Your Den', map:'flatblock', loc:'den', art:'none',
  text:`You sit in your den with the Jupiter on, but you cannot listen. You keep seeing their three litsos at the bottom of the stairs.

At ten o'clock Pete comes up alone. "They're doing the Manse tonight," he says. "Georgie said to tell you. He said you'd come. He said you couldn't keep away."

And the horrible thing, O my brothers, is that Georgie is right. You put on your bowler.`,
  choices:[{t:'Go.', go:'canal', fx:{hum:-6, food:-4}}, {t:'Don\'t go. Stay in, with the Jupiter, all nochy.', go:'end_early', fx:{hum:10, food:10}}]},
canal:{title:'By the Canal', loc:'bridge', w:'bridge', art:'bridge',
  text:`On the way you pass under the railway bridge, where an old drunkie lies in the wet, singing the songs of his fathers, very filthy and loud.

He stops singing when he viddies you. "Go on, do me in, you cowardly bastards. I don't want to live anyway, not in a stinking world like this." He goes on about the world, where young malchicks are let to beat up old vecks, and men on the moon, and no attention paid to earthly law and order no more.`,
  fx:{meet:'drunk', song:'drunkie', word:['bezoomny','smeck']},
  choices:[
    {t:'Give him a bit of the old boot.', go:'manse', dt:6, fx:{sus:6, aff:{dim:4}}, res:`Dim laughs. The drunkie stops singing. Your humble narrator will tell you no more of that, only that the old veck's song went on in your gulliver for a long time afterwards, very quiet.`},
    {t:'Drop a few coins in his hat and walk on.', go:'manse', if:G => G.stats.cash >= 2, fx:{cash:-2, hum:4, food:5, aff:{drunk:20, dim:-3}}, res:`"God bless you, young sir," he says, astonished. Then he starts singing again, louder, and Dim looks at you as if you have grown another gulliver.`},
    {t:'Walk on past, quick.', go:'manse', fx:{food:2}}
  ]}
});

// ── 6. THE CAT WOMAN ────────────────────────────────────────────────────────
Object.assign(BEATS, {
manse:{chapter:6, chTitle:'The Cat Woman', map:'wild', loc:'manse', w:'manse', art:'none', date:'Late nochy',
  text:`The Manse, in Oldtown: a big old house where a starry ptitsa lives on her oddy knocky with a dozen cats and a lot of very valuable silver and starry things, Georgie says.

The door is locked and she will not open it, not even for the accident trick. So you, being the smallest, are to go in by the window upstairs, then let your droogs in at the front.

Inside it is dark and full of cats. They mew and slither round your nogas. And on a table in the hall, gleaming in the moonlight, is a little bust of Ludwig van himself, with his hair all wild.`,
  fx:{meet:'catlady', word:['oddy knocky','noga']},
  choices:[
    {t:'Go for the starry ptitsa before she reaches the phone.', go:'betrayal', dt:10, fx:{sus:20, flag:'struckHer'}, res:`She comes at you with a stick, waving it like a starry witch, and the cats go everywhere, and you grab the first thing to hand — the little Ludwig van — and then it is done, and she is lying on the floor, and somewhere far off, very faint, a siren.`},
    {t:'She\'s on the phone to the Millicents. Get out — now.', go:'betrayal', fx:{hum:8, sus:12, flag:'fledHer'}, res:`You hear her voice in the next room — "the police, yes, there's a boy" — and you go for the front door, skorry as you can, cats under your boots. You never touch her. It does not matter, as it turns out, as much as it should.`}
  ]},
betrayal:{title:'Outside the Manse', art:'none',
  text:`You fling open the front door and there are your three droogs at the gate, and the siren is very near now.

"Let's get out, skorry!" you say. And Dim, grinning, swings something white at your litso. A milk bottle, O my brothers. It smashes across your glazzies, and you are on the ground, blind with pain and krovvy.

"You don't go about tolchocking your droogs with a britva," Dim says. "Not all the time." And then their boots, running away, and laughter, and the siren.`,

  choices:[{t:'Lie there. There is nothing else.', go:'rozz'}]}

  text:`"What's it going to be then, eh?"

chapelsneak:{title:'The Wing', loc:'wing', art:'none',

    talk('bible', 'Tell him how much you\'re enjoying the Big Book.', `"Oh, splendid, splendid." You don't tell him which bits: the old Yahudis tolchocking each other and drinking their wine. You fancy yourself helping with the whipping of the Christ, in a nice Roman toga. The charlie beams at you, and you beam back.`, {hum:-2, aff:{charlie:4}}),

// ── 10. LUDOVICO'S TECHNIQUE ────────────────────────────────────────────────
Object.assign(BEATS, {
ludovico:{chapter:10, chTitle:'Ludovico\'s Technique', map:'ludovico', loc:'ward', w:'ludovico', art:'ludovico', date:'Day one',
  text:`The Ludovico Institute is all white and clean, with nice beds and nice food, and kind young doctors in white coats. Dr Branom smiles at you like a brother and gives you an injection in the arm. Vitamins, he says.

Then they take you in a wheelchair to a sort of sinny, and they strap you in, and they clip your eyelids open so you cannot shut them, however you try. Dr Brodsky, small and plump with very thick ochkies, is in the dark at the back, watching.

Then the film comes on. It is a very good film, very real, a starry veck being given the old ultra-violence by some young malchicks. Just like old times. And then you begin to feel sick.`,
  fx:{meet:['brodsky', 'branom'], word:['sinny', 'veck'], health:35},
  game:{type:'film', label:'Viddy well', win:'viddy', lose:'viddy', fxWin:{hum:-10, health:-10}, fxLose:{hum:-14, health:-18},
    winText:'You get through it, O my brothers, though by the end you are begging them to stop. "Stop it, stop it, please." Dr Brodsky makes a note. "Excellent," he says. "Excellent."',
    loseText:'You are sick, very sick, all over the straps, and they keep the film going anyway. Dr Brodsky makes a note. "Excellent," he says.'}},
viddy:{chapter:11, chTitle:'Viddy Well', loc:'sinny', art:'ludovico', date:'Day five',
  text:`Every day the sinny, and every day the injection that is not vitamins. Films of war and krovvy and tolchocking, and every time the sickness, and it gets worse.

On the fifth day the film is of the war, with soldiers and explosions, and the music behind it is — oh no, O my brothers — Ludwig van. The Ninth. The last movement.

"Stop it! It's a sin!" you scream. "Using Ludwig van like that! He did no harm to anyone. Beethoven just wrote music!"

Dr Brodsky, in the dark: "Can't be helped. Each man kills the thing he loves, as the poet-prisoner said. Here is the punishment element, perhaps."`,
  fx:{song:'brodsky', flags:{ninthSick:true}, hum:-8},
  choices:[
    talk('brodsky', 'Beg Dr Brodsky to leave the music out.', `"Delightful," he says, writing. "You're in a position to see that violence and music both carry the sickness now. The two are linked. I am truly sorry. But there it is." He sounds sorry, which is worse.`, {hum:-2}),
    {t:'Try to think of the Ninth the way it was, in your den, at night.', go:'demo', fx:{hum:6, health:-10}, res:`You try, O my brothers. The bird of rarest-spun heaven-metal. The choir. But the sickness comes up through it like dirty water through a floor, and you are retching in the straps. They have taken that too.`},
    {t:'Stop fighting it. Let them have it.', go:'demo', fx:{hum:-10}}
  ]},
demo:{chapter:12, chTitle:'The Demonstration', loc:'stage', art:'stage', date:'Day fourteen',
  text:`After two weeks they put you on a stage, with lights in your glazzies and an audience of important vecks in the dark: the Minister, the Governor, the charlie, doctors, and newspaper men.

"Our subject is, you see, impelled towards the good by, paradoxically, being impelled towards evil," says Dr Brodsky.

A big veck comes on to the stage, an actor, and starts insulting you, and then tolchocking you, and stamping on your nogas.`,
  game:{type:'stage', label:'Face the actor', win:'cured', lose:'cured'}},
cured:{chapter:13, chTitle:'Cured', loc:'stage', art:'stage',
  text:G => `The audience claps. The Minister is very pleased. "He will be your true Christian," says Dr Brodsky, "ready to turn the other cheek."

The charlie stands up at the back, his litso red. "Choice!" he cries. "He has no real choice, has he?" He goes on: it is fear that made the boy grovel, fear of pain and nothing else. He is not good. He is only unable to be bad. That is not the same thing at all.

The Minister smiles. Subtleties, he says. The point is that crime goes down.

${G.games.stage && G.games.stage.win ? 'You managed, somewhere inside the sickness, to keep a malenky bit of yourself. You are not sure what it is. It is very small.' : 'You licked the actor\'s boot, O my brothers. In front of everyone. And meant it, to make the sickness stop.'}`,
  fx:{flags:{cured:true}, hum:-15, health:20},
  choices:[{t:'Leave the Ludovico Institute, a free man.', go:'lodger'}]},
lodger:{chapter:14, chTitle:'Joe the Lodger', map:'flatblock', loc:'den', w:'flatblock', art:'flatblock', date:'The day of release',
  text:`Home to Flatblock 18A, up the stairs (the lift is working, for once), to your pee and em.

Your discs, your stereo, all your things — the Millicents took them away and sold them, to pay for the cats of the starry ptitsa you killed.

    {t:'"Appy polly loggies. I\'ll go."', go:'lodger2', fx:{hum:4, food:5, word:'appy polly loggy'}, res:`You say it quiet. Your em cries. Your pee looks at the table. Joe says it's for the best, really, for everyone. Nobody stops you.`}

lodger2:{title:'The Stairs', art:'none',
  text:`You go down the stairs of Flatblock 18A with nothing but the platties you stand up in and a few coins they gave you at the Institute. Past the Dignity of Labour, still covered in rude words.

// ── 17. HOME ────────────────────────────────────────────────────────────────

study:{title:'The Study', loc:'study', art:'none',
  text:G => `In his study, F. Alexander shows you a newspaper with your own litso on it: the boy who was cured, the new crime-free state. "You are a victim of the modern age," he says, "and I can use you." The government, he says, has turned you into a clockwork thing, and he and his friends, Rubinstein and D. B. da Silva and the rest, will show you to the people before the election and bring the government down.

  const stop = ticker(dt => {
    if (over) return;
    t += dt; const sp = 300 + t * 9; scroll += sp * dt; py += (LY[lane] - py) * Math.min(1, dt * 14); inv = Math.max(0, inv - dt);
    next -= dt;
    if (next <= 0){ next = rnd(.45, .9); obs.push({k:pick(['car','car','hedge','veck']), lane:ri(0, 2), x:800}); }
    obs.forEach(o => { o.x -= (o.k === 'car' ? sp * 1.4 : sp) * dt;
      if (!o.hit && o.lane === lane && Math.abs(o.x - PX) < 36 && inv <= 0){ o.hit = true; inv = .9;
        if (o.k === 'veck'){ hitVeck++; SND.fx('hit'); ui.msg.textContent = 'A starry veck goes over the hedge, shouting. He\'ll remember the car.'; }
        else { hp--; SND.fx('boom'); ui.msg.textContent = o.k === 'car' ? 'Headlights! Metal screams on metal!' : 'Into the hedge, and out again, in a shower of leaves!'; } } });
    obs = obs.filter(o => o.x > -60);
    x.fillStyle = '#05060a'; x.fillRect(0, 0, 760, 300); x.fillStyle = '#1a1f14'; x.fillRect(0, 0, 760, 56); x.fillRect(0, 244, 760, 56);
    x.fillStyle = '#26262a'; x.fillRect(0, 56, 760, 188);
    x.strokeStyle = 'rgba(255,255,255,.4)'; x.setLineDash([30, 30]); x.lineDashOffset = scroll % 60; x.beginPath(); x.moveTo(0, 120); x.lineTo(760, 120); x.moveTo(0, 180); x.lineTo(760, 180); x.stroke(); x.setLineDash([]);
    for (let i = 0; i < 12; i++){ const tx2 = ((i * 90 - scroll * .9) % 900 + 900) % 900 - 60; x.fillStyle = '#0e140a'; x.beginPath(); x.arc(tx2, 30, 30, 0, 7); x.arc(tx2 + 40, 272, 26, 0, 7); x.fill(); }
    const g = x.createLinearGradient(PX, 0, PX + 300, 0); g.addColorStop(0, 'rgba(255,240,180,.35)'); g.addColorStop(1, 'rgba(255,240,180,0)');
    x.fillStyle = g; x.beginPath(); x.moveTo(PX + 30, py - 8); x.lineTo(PX + 330, py - 60); x.lineTo(PX + 330, py + 60); x.lineTo(PX + 30, py + 8); x.fill();
    obs.forEach(o => { const y = LY[o.lane];
      if (o.k === 'car'){ x.fillStyle = '#555'; x.fillRect(o.x - 30, y - 16, 60, 32); x.fillStyle = '#ffe'; x.beginPath(); x.arc(o.x - 30, y - 9, 5, 0, 7); x.arc(o.x - 30, y + 9, 5, 0, 7); x.fill(); }
      else if (o.k === 'hedge'){ x.fillStyle = '#2a4a1a'; x.beginPath(); x.arc(o.x, y, 24, 0, 7); x.arc(o.x + 18, y - 6, 18, 0, 7); x.fill(); }
      else { x.fillStyle = '#b8a888'; x.beginPath(); x.arc(o.x, y - 16, 7, 0, 7); x.fill(); x.fillStyle = '#4a3a2a'; x.fillRect(o.x - 7, y - 9, 14, 24); } });
    x.globalAlpha = inv > 0 && Math.floor(t * 12) % 2 ? .4 : 1;
    x.fillStyle = '#f4f1ea'; x.fillRect(PX - 34, py - 16, 68, 32); x.fillStyle = '#e2640f'; x.fillRect(PX - 34, py - 3, 68, 6); x.fillStyle = '#111'; x.fillRect(PX - 6, py - 13, 22, 26); x.globalAlpha = 1;
    const prog = Math.min(1, t / DUR); x.fillStyle = 'rgba(255,255,255,.2)'; x.fillRect(20, 8, 720, 6); x.fillStyle = '#e2640f'; x.fillRect(20, 8, 720 * prog, 6);
    ui.hud.innerHTML = `<span>Durango <b>${'♦'.repeat(Math.max(0, hp))}</b></span>${hitVeck ? `<span>Starry vecks <b>${hitVeck}</b></span>` : ''}`;
    if (hp <= 0){ over = true; done({win:false, score:prog, fx: hitVeck ? {sus:6 * hitVeck, food:-3 * hitVeck} : null}); }
    else if (t >= DUR){ over = true; done({win:true, score:1, fx: hitVeck ? {sus:6 * hitVeck, food:-3 * hitVeck} : null}); }
  });
  return {stop, key(e){ const d = KEYMAP[e.key]; if (d === 'up'){ e.preventDefault(); move(-1); } else if (d === 'down'){ e.preventDefault(); move(1); } }};
};

// ── The Film: Ludovico's Technique ──────────────────────────────────────────
GAMES.film = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Viddy Well', '', 'Your eyelids are clamped open; you cannot look away. Hold <b>Space</b> (or the button) to think of something else — Ludwig van, in your den — and the sickness ebbs. But when the music on the soundtrack <b>is</b> Ludwig van, thinking of him makes it worse. Last out the reel.');
  ui.body.innerHTML = `<div class="art" style="cursor:default">${VIGNETTES.ludovico()}</div>
    <div style="max-width:560px;margin:10px auto">
      <div class="meta">The reel</div><div class="gbar"><i id="freel" style="background:#888"></i></div>
      <div class="meta">The sickness</div><div class="gbar"><i id="fsick" style="background:linear-gradient(90deg,#6a8a2a,#b0186a)"></i></div>
      <div class="center" style="margin-top:10px"><button class="btn gold" id="fhold">Think of something else (hold Space)</button></div></div>`;
  let reel = 0, sick = 15, phase = 'film', pt = 3, holding = false, over = false;
  const SCENES = ['A starry veck on the screen, and young malchicks with boots…','Krovvy, very red, very real…','A razor in the lamplight…','A shop, a till, a scream…'];
  const btn = $('#fhold'), on = e => { if (e) e.preventDefault(); holding = true; }, off = () => { holding = false; };
  btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off); btn.addEventListener('pointerleave', off);
  ui.msg.textContent = pick(SCENES);
  const stop = ticker(dt => {
    if (over) return;
    reel += dt * 3.4; pt -= dt;
    if (pt <= 0){
      if (phase === 'film'){ phase = 'warn'; pt = .9; ui.msg.textContent = 'The soundtrack swells… is that…?'; }
      else if (phase === 'warn'){ phase = 'ninth'; pt = rnd(1.8, 2.8); ui.msg.textContent = 'Ludwig van! The Ninth! On the soundtrack!'; if (SND.on) SND.toneAlways(66, .4, 'triangle', .12); }
      else { phase = 'film'; pt = rnd(2.2, 3.6); ui.msg.textContent = pick(SCENES); }
    }
    const base = 9;
    if (phase === 'ninth') sick += (holding ? 46 : 14) * dt;
    else sick += (holding ? -16 : base) * dt;
    sick = clamp(sick, 0, 100);
    if (holding && phase === 'ninth' && Math.random() < dt * 3) { document.body.classList.add('sick'); setTimeout(() => document.body.classList.remove('sick'), 300); }
    $('#freel').style.width = Math.min(100, reel) + '%'; $('#fsick').style.width = sick + '%';
    ui.hud.innerHTML = `<span>${phase === 'ninth' ? '<b style="color:#b0186a">THE NINTH</b>' : phase === 'warn' ? '<b>Careful…</b>' : 'The film'}</span>`;
    if (sick >= 100){ over = true; done({win:false, score:reel / 100}); }
    else if (reel >= 100){ over = true; done({win:true, score:1 - sick / 100}); }
  });
  return {stop, key(e){ if (e.key === ' ' || e.code === 'Space'){ e.preventDefault(); holding = true; } }, keyup(e){ if (e.key === ' ' || e.code === 'Space') holding = false; }};
};

// ── The Stage: the demonstration ────────────────────────────────────────────
GAMES.stage = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'The Demonstration', '', 'An actor insults you and hits you in front of the Minister. Hitting back brings on the sickness. Grovelling makes it stop — and costs you something worth more. Try to come out with your self still in one piece.');
  const R = [
    {s:'The actor shoves you. "Well, look what\'s crawled out of the drain. Smells like it, too."', o:[{t:'Shove him back.', k:'hit'},{t:'Stand there and take it.', k:'endure'},{t:'"I\'m sorry, sir. I\'ll wash."', k:'grovel'}]},
    {s:'He treads on your foot, hard. "And what are you going to do about it, eh?"', o:[{t:'Make a fist.', k:'hit'},{t:'Say nothing. Breathe.', k:'endure'},{t:'"Please — anything — I\'ll do anything."', k:'grovel'}]},
    {s:'He tweaks your nose and twists your ear. The audience laughs.', o:[{t:'Go for his throat.', k:'hit'},{t:'Look past him, at the lights.', k:'endure'},{t:'Get down on your knees.', k:'grovel'}]},
    {s:'He holds out his boot. "Lick it," he says.', o:[{t:'Kick it away.', k:'hit'},{t:'Stay standing. Shake, but stand.', k:'endure'},{t:'Lick it.', k:'grovel'}]},
    {s:'Dr Brodsky: "He will be your true Christian, ready to turn the other cheek." The audience waits.', o:[{t:'Spit at the actor.', k:'hit'},{t:'Turn and look at the charlie.', k:'endure'},{t:'Smile at the Minister.', k:'grovel'}]}];
  const W = {hit:[38, 6], endure:[12, 6], grovel:[-18, -16]};   // [sickness, self]
  let i = 0, sick = 20, self = 40, over = false;
  function show(){
    if (i >= R.length){ over = true; return done({win:self >= 40, score:self / 100, fx:{hum:Math.round((self - 40) / 3)},
      msg: self >= 40 ? 'You stood. You shook and you sweated, but you stood.' : 'You did what they wanted, every time, to make the sickness stop.'}); }
    const r = R[i];
    ui.body.innerHTML = `<div class="art" style="cursor:default">${VIGNETTES.stage()}</div><div class="smaugline">${esc(r.s)}</div>
      <div style="max-width:560px;margin:6px auto"><div class="meta">The sickness</div><div class="gbar"><i style="width:${sick}%;background:#6a8a2a"></i></div>
      <div class="meta">What is left of you</div><div class="gbar"><i style="width:${self}%;background:#e2640f"></i></div></div>
      <div class="choices">${shuffle(r.o.slice()).map(o => `<button class="choice talk" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answer(b.dataset.k));
    ui.hud.innerHTML = `<span>Round <b>${i + 1}/${R.length}</b></span>`;
  }
  function answer(k){
    if (over) return;
    const [s, f] = W[k]; sick = clamp(sick + s, 0, 100); self = clamp(self + f, 0, 100);
    ui.msg.textContent = k === 'hit' ? 'Your fist comes up — and the sickness floods up with it. You double over.' : k === 'endure' ? 'You stand, sweating. The sickness creeps, but holds off.' : 'The sickness drains away at once. The audience applauds.';
    SND.fx(k === 'grovel' ? 'click' : 'bad');
    if (sick >= 100){ over = true; return done({win:false, score:0, fx:{health:-15, hum:Math.round((self - 40) / 3)}, msg:'The sickness has you. You are on the floor of the stage, retching, while they clap.'}); }
    i++; setTimeout(show, 900);
  }
  show();
  return {stop(){}};
};

// ── Nadsat quiz: teaching Georgina ──────────────────────────────────────────
GAMES.nadsat = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Teaching Georgina Nadsat', '', 'Georgina reads a word; pick what it means. Five words. She laughs either way.');
  const pool = (G.words.length >= 6 ? G.words : Object.keys(NADSAT)).slice();
  const qs = shuffle(pool).slice(0, 5); let i = 0, right = 0, over = false, lock = false;
  function show(){
    if (i >= qs.length){ over = true; return done({win:right >= 3, score:right / 5, msg:`You got ${right} of 5.`}); }
    const w = qs[i], a = NADSAT[w];
    const wrong = shuffle(Object.keys(NADSAT).filter(k => NADSAT[k] !== a).map(k => NADSAT[k]).filter((v, j, arr) => arr.indexOf(v) === j)).slice(0, 3);
    lock = false;
    ui.body.innerHTML = `<div class="riddle">"${esc(w)}?"</div><div class="opts">${shuffle([a].concat(wrong)).map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answer(b.dataset.o));
    ui.hud.innerHTML = `<span>Word <b>${i + 1}/5</b></span><span>Right <b>${right}</b></span>`;
  }
  function answer(o){
    if (lock || over) return; lock = true;
    const ok = o === NADSAT[qs[i]]; if (ok){ right++; SND.fx('good'); } else SND.fx('bad');
    ui.msg.textContent = ok ? pick(['Georgina claps. "Horrorshow!"','Pete laughs. "He\'s still got it."','"Viddy him go!"']) : `"No, silly, it means ${NADSAT[qs[i]]}," says Pete, who remembers.`;
    i++; setTimeout(show, 1200);
  }
  show();
  return {stop(){}};
};

// ═══ TITLE, MENU, BOOT ══════════════════════════════════════════════════════
function renderTitle(){
  const sv = tryLoad();
  $('#stage').innerHTML = `<div class="titlescr">${VIGNETTES.korova()}
    <h1>Real Horrorshow</h1><div class="sub">being the story of your humble narrator, Alex, and his droogs, and Ludwig van, and the Ludovico Technique</div>
    <div class="verse">"What's it going to be then, eh?"</div>
    <div class="btns">${sv ? `<button class="btn gold" data-load>Continue — Chapter ${sv.chapter}: ${esc(sv.chTitle || '')}</button>` : ''}<button class="btn" data-new>Out out out out!</button></div>
    <p class="meta" style="margin-top:18px;max-width:600px;margin-left:auto;margin-right:auto">Three parts and twenty-one chapters, the age of being grown. ${Object.keys(SONGS).length} pieces of music and words, ${Object.keys(MAPS).length} maps, ${Object.keys(NADSAT).length} words of Nadsat to collect, typescript pages to find, and eight trials. Watch your <b>Choice</b>, <b>Health</b> and <b>Grown</b>, and keep your <b>Heat</b> down. An unofficial game after Anthony Burgess's novel; short phrases quoted, prose new. Contains violence (mostly off-screen); the novel's sexual violence is not depicted.</p></div>`;
  wireStage();
  const nb = $('#stage').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Begin again? Your saved game will be lost.')) startNew(); };
}
function openMenu(){
  openModal(`<div class="ptitle" style="font-size:1.2rem;text-align:center">Menu</div>
    <div class="choices" style="max-width:420px">
      ${G && G.checkpoint ? `<button class="choice" id="mcp">↺ Back to the start of this chapter (${esc(G.chTitle)})</button>` : ''}
      <button class="choice" id="mhelp">How to play</button>
      <button class="choice" id="msnd">${SND.on ? '♪ Sound: on' : '♪ Sound: off'}</button>
      <button class="choice" id="mnew">Begin again</button>
      ${G ? '<button class="choice" id="mtitle">Back to the title page</button>' : ''}
    </div><p class="meta center">Your progress is saved after every step, O my brothers.</p>`);
  const q = id => document.getElementById(id);
  if (q('mcp')) q('mcp').onclick = () => { if (confirm('Go back to the start of this chapter?')) restoreCheckpoint(); };
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.2rem">How to play</div><div class="text">${paras(`You are Alex, fifteen, leader of three droogs, lover of Ludwig van, and very fond of the old ultra-violence. Read, choose, and play your way through the three parts of your story.

<b>Choice</b> is your free will. The state will try to take it away. <b>Grown</b> is how far you've come from being a nadsat: it falls every time you choose the old ultra-violence (the choices marked ✸), and rises when you hold back, and listen, and think. <b>Heat</b> is the Millicents' interest in you: at 100, they have you early. <b>Health</b> is your body. <b>Cutter</b> is money.

After Ludovico's Technique, choosing violence doesn't hurt anyone but you: it brings on the sickness instead.

How grown you are, and how much choice you have left, decide which of the book's endings you get — the twenty-first chapter, which American readers never saw, or the one before it.

Trials: a rumble with Billyboy, the Durango 95 on the dark country roads, the Ninth on your stereo (a rhythm game, with Beethoven's real tune), a stealth map through Staja 84F to the chapel stereo (arrow keys or click; R for your innocent face), the Ludovico film, the stage demonstration, and teaching Nadsat. Every one can be skipped.

Collect Nadsat words as you hear them (the Nadsat tab), music and words, maps, and the four torn pages of F. Alexander's typescript.`)}</div>`);
  q('msnd').onclick = () => { SND.on = !SND.on; openMenu(); updateSoundBtn(); };
  q('mnew').onclick = () => { if (!G || confirm('Begin again? Your current progress will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; render(); };
}
function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound on' : 'Sound off'; }

$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    return;
  }
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#stage').querySelectorAll('.choices button'); const b = btns[+e.key - 1]; if (b) b.click();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; if (UI.game && UI.inst && UI.inst.keyup) UI.inst.keyup(e); });
window.addEventListener('blur', () => { UI.keys = {}; });

updateSoundBtn();
G = null;
render();
</script>
