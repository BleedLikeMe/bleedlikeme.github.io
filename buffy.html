<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<title>SLAYER — Sunnydale Nights</title>
<style>
  :root{
    --bg:#0b0710; --bg2:#140a1c; --panel:#1a0f24; --panel2:#211430;
    --purple:#8b2fc9; --purple2:#a855e6; --blood:#b3122d; --blood2:#e8283f;
    --gold:#d4af37; --gold2:#f0cf5f; --text:#e8dfee; --dim:#a894ba; --line:#3a2450;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;}
  body{overscroll-behavior-y:contain;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse at 50% -10%, #2a1240 0%, transparent 60%),
      radial-gradient(ellipse at 90% 110%, #1a0620 0%, transparent 55%),
      linear-gradient(180deg,var(--bg2),var(--bg));
    color:var(--text); font-family:Georgia,'Times New Roman',serif;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:1200px;margin:0 auto;padding:16px;
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
  }
  .hidden{display:none !important;}
  button{
    font-family:inherit; cursor:pointer; background:linear-gradient(180deg,var(--panel2),var(--panel));
    color:var(--text); border:1px solid var(--line); border-radius:6px; padding:11px 14px;
    font-size:14px; transition:.15s; min-height:44px; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  button:active:not(:disabled){border-color:var(--purple2); box-shadow:0 0 10px rgba(168,85,230,.45); color:#fff;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.danger:active:not(:disabled){border-color:var(--blood2); box-shadow:0 0 10px rgba(232,40,63,.45);}
  button.gold:active:not(:disabled){border-color:var(--gold2); box-shadow:0 0 10px rgba(240,207,95,.45);}
  @media (hover:hover) and (pointer:fine){
    button:hover:not(:disabled){border-color:var(--purple2); box-shadow:0 0 10px rgba(168,85,230,.45); color:#fff;}
    button.danger:hover:not(:disabled){border-color:var(--blood2); box-shadow:0 0 10px rgba(232,40,63,.45);}
    button.gold:hover:not(:disabled){border-color:var(--gold2); box-shadow:0 0 10px rgba(240,207,95,.45);}
  }
  input[type=text]{
    font-family:inherit; background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:6px; font-size:16px; min-height:44px;
  }

  /* ---- Title screen ---- */
  #titleScreen{min-height:90vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  #titleScreen h1{
    font-size:64px; letter-spacing:14px; margin:0; color:var(--blood2);
    text-shadow:0 0 18px rgba(232,40,63,.6), 0 0 40px rgba(139,47,201,.4);
    animation:flicker 5s infinite;
  }
  @keyframes flicker{
    0%,19%,21%,23%,55%,57%,100%{opacity:1;}
    20%,22%,56%{opacity:.75;}
  }
  #titleScreen .sub{color:var(--dim); letter-spacing:4px; margin:6px 0 24px; font-size:15px;}
  #titleScreen .blurb{max-width:520px; color:var(--dim); font-size:14px; line-height:1.6; margin-bottom:22px;}
  #diffPicker{display:flex; gap:8px; margin-bottom:16px;}
  #diffPicker button.active{border-color:var(--gold2); color:#fff; box-shadow:0 0 8px rgba(240,207,95,.4);}
  #titleButtons{display:flex; flex-direction:column; gap:12px; align-items:center;}
  #titleButtons button{width:220px; padding:12px; font-size:15px;}
  #hallOfFame{margin-top:26px; max-width:440px; width:100%;}
  .hofRow{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); padding:4px 0; border-bottom:1px dotted #2a1a3a;}

  /* ---- Header ---- */
  #statBar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:12px;
  }
  #statBar .name{font-size:20px; letter-spacing:2px; color:var(--gold2); margin-right:auto;}
  .statItem{font-size:13px; color:var(--dim); display:flex; align-items:center; gap:6px;}
  .barOuter{width:110px; height:12px; background:#000; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .barInner{height:100%; transition:width .3s;}
  .hpBar{background:linear-gradient(90deg,var(--blood),var(--blood2));}
  .hpBar.low{background:linear-gradient(90deg,#5a0d0d,#ff2b2b); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .xpBar{background:linear-gradient(90deg,#6a4a10,var(--gold2));}
  .apDots span{color:var(--line); font-size:16px;}
  .apDots span.full{color:var(--purple2); text-shadow:0 0 6px var(--purple2);}
  #abandonLink{font-size:11px; color:var(--dim); text-decoration:underline; cursor:pointer; margin-left:8px;}
  .headerLink{font-size:11px; color:var(--dim); text-decoration:underline; cursor:pointer; margin-left:8px;}
  #saveIoRow{display:flex; gap:10px; margin-bottom:14px;}
  #saveIoRow button{padding:7px 12px; font-size:12px;}

  /* ---- Layout ---- */
  #mainLayout{display:grid; grid-template-columns:170px 1fr 230px; gap:12px;}
  @media (max-width:880px){
    #mainLayout{grid-template-columns:1fr;}
    #locNav{order:1;}
    #content{order:0;}
    #sidePanel{order:2;}
  }
  #locNav{display:flex; flex-direction:column; gap:8px;}
  #locNav button{text-align:left;}
  @media (max-width:880px){
    #locNav{
      flex-direction:row; flex-wrap:nowrap; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:4px; scrollbar-width:thin;
    }
    #locNav button{text-align:center; white-space:nowrap; flex:0 0 auto;}
  }
  #locNav button.active{border-color:var(--purple2); background:linear-gradient(180deg,#33195a,var(--panel2)); color:#fff;}
  #content{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px;
    min-height:360px;
  }
  #content h2{margin-top:0; color:var(--gold2); letter-spacing:1px; font-size:20px;}
  #content .flavor{color:var(--dim); font-size:14px; line-height:1.6; margin-bottom:16px;}
  .actionGrid{display:flex; flex-wrap:wrap; gap:10px;}
  #sidePanel{display:flex; flex-direction:column; gap:12px;}
  .sideBox{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px;}
  .sideBox h3{margin:0 0 8px; font-size:13px; letter-spacing:1px; color:var(--purple2); text-transform:uppercase;}
  .scoobyRow{display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--dim);}
  .scoobyRow.on{color:var(--text);}
  .scoobyRow .dot{color:var(--gold2);}
  .invRow{display:flex; justify-content:space-between; font-size:13px; padding:2px 0;}

  /* ---- Log ---- */
  #logPanel{
    margin-top:12px; background:#0a0510; border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; max-height:150px; overflow-y:auto; font-family:'Courier New',monospace; font-size:12.5px;
  }
  #logPanel div{padding:2px 0; color:var(--dim); border-bottom:1px dotted #2a1a3a;}
  #logPanel div:first-child{color:var(--gold2);}

  /* ---- Shop ---- */
  .shopItem{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
  }
  .shopItem .info b{color:var(--text);} .shopItem .info div{font-size:12px; color:var(--dim);}

  /* ---- Combat ---- */
  .combatWrap{display:flex; flex-direction:column; gap:14px;}
  .vsRow{display:flex; justify-content:space-between; gap:20px;}
  .fighter{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px; position:relative; overflow:visible;}
  .fighter h3{margin:0 0 8px; font-size:16px; color:var(--gold2);}
  .fighter .barOuter{width:100%; height:14px;}
  .combatBtns{display:flex; flex-wrap:wrap; gap:8px;}
  .combatBtns button{flex:1 1 130px;}
  .dmgPop{position:absolute; top:8px; left:50%; font-weight:bold; font-size:20px; pointer-events:none; animation:dmgFloat .9s ease-out forwards; text-shadow:0 0 6px rgba(0,0,0,.8);}
  .dmgPop.dmg{color:var(--blood2);}
  .dmgPop.heal{color:#6ee7b7;}
  @keyframes dmgFloat{0%{opacity:1; transform:translate(-50%,0);} 100%{opacity:0; transform:translate(-50%,-40px);}}
  .shake{animation:shakeAnim .4s;}
  @keyframes shakeAnim{0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}}

  /* ---- End overlay ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,1,8,.88); display:flex; align-items:center; justify-content:center; z-index:50;
    padding:16px; overflow-y:auto;
  }
  .endCard{
    max-width:520px; width:100%; background:var(--panel); border:1px solid var(--purple2); border-radius:12px; padding:32px;
    text-align:center; box-shadow:0 0 40px rgba(139,47,201,.5); margin:auto;
  }
  .endCard h2{font-size:28px; letter-spacing:2px; margin-top:0;}
  .endCard p{color:var(--dim); line-height:1.6;}

  @media (max-width:480px){
    #titleScreen h1{font-size:44px; letter-spacing:8px;}
    #app{padding:10px; padding-left:max(10px, env(safe-area-inset-left)); padding-right:max(10px, env(safe-area-inset-right));}
    .statItem{font-size:12px;}
    .barOuter{width:80px;}
    .vsRow{gap:10px;}
    .fighter{padding:10px;}
    .combatBtns button{flex:1 1 100%;}
    #titleButtons button{width:100%;}
    .endCard{padding:20px;}
    .shopItem{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="titleScreen">
    <h1>SLAYER</h1>
    <div class="sub">S U N N Y D A L E &nbsp; N I G H T S</div>
    <div class="blurb">Into every generation a Slayer is born. Patrol the cemeteries, train with your Watcher, rally the Scooby Gang, and stop what's coming before Sunnydale pays the price.</div>
    <div id="diffPicker"></div>
    <div id="titleButtons">
      <input type="text" id="nameInput" placeholder="Your name, Slayer (default: Buffy)" maxlength="20">
      <button class="gold" onclick="startNewGame()">New Game</button>
      <button id="continueBtn" onclick="continueGame()">Continue</button>
    </div>
    <div id="saveIoRow">
      <button id="exportBtn" onclick="exportSave()">Export Save</button>
      <button onclick="triggerImport()">Import Save</button>
    </div>
    <input type="file" id="importFileInput" accept=".json,application/json" class="hidden" onchange="importSaveFile(event)">
    <div id="hallOfFame"></div>
  </div>

  <div id="gameScreen" class="hidden">
    <div id="statBar"></div>
    <div id="mainLayout">
      <nav id="locNav"></nav>
      <main id="content"></main>
      <aside id="sidePanel"></aside>
    </div>
    <div id="logPanel"></div>
  </div>

  <div id="endOverlay" class="hidden overlay">
    <div class="endCard" id="endCard"></div>
  </div>

</div>

<script>
'use strict';

// ============================== DATA ==============================

const DIFFICULTIES = {
  easy:   {label:'Easy',   enemyMult:0.85, startMoney:25, startStakes:10},
  normal: {label:'Normal', enemyMult:1.0,  startMoney:15, startStakes:8},
  hard:   {label:'Hard',   enemyMult:1.25, startMoney:10, startStakes:6},
};

const LOCATIONS = {
  library:   {name:"Sunnydale High Library", desc:"Dusty stacks, older-than-old tomes, and Giles hovering with a raised eyebrow. The best place to train and dig up lore on what's crawling around town."},
  bronze:    {name:"The Bronze", desc:"Sunnydale's one and only nightclub. Loud band, cheap drinks, and — if you know where to look — the rest of the Scooby Gang."},
  mall:      {name:"Sunnydale Mall", desc:"Stakes, holy water, and the occasional bargain on stylish stakeout wear. A Slayer's got to shop somewhere."},
  cemetery:  {name:"Restfield Cemetery", desc:"Row after row of freshly (and not-so-freshly) dug graves. Prime real estate for the recently risen. This is where the real work happens."},
  home:      {name:"Summers Residence", desc:"Home. Mom's up watching television, the porch light's on, and your bed has never looked better. Rest up before tomorrow night."},
  magicbox:  {name:"The Magic Box", desc:"A cramped occult shop stuffed with candles, crystals, and books nobody but Giles could love. Deeper lore and rarer gear than the mall could ever offer.", locked:true, unlockFlag:'magicboxUnlocked'},
  sewers:    {name:"Sunnydale Sewers", desc:"A dank maze of tunnels running under the whole town. Whatever doesn't want to be found up top ends up down here.", locked:true, unlockFlag:'sewersUnlocked'},
  hellmouth: {name:"The Hellmouth", desc:"A crack in the earth beneath the school that leads somewhere no one should go. Something ancient is stirring down there.", locked:true, unlockFlag:'hellmouthUnlocked'},
  mansion:   {name:"The Old Mansion", desc:"An abandoned mansion on Crawford Street, its windows boarded, its halls gone cold. Something familiar and terrible is waiting inside.", locked:true, unlockFlag:'mansionUnlocked'},
  factory:   {name:"The Old Factory", desc:"A rusted-out factory by the rail yard, draped in dust sheets and candlelight. Spike always did have a flair for the dramatic.", locked:true, unlockFlag:'factoryUnlocked'},
};

function E(id,name,hp,atkMin,atkMax,xp,mMin,mMax,opts){
  return Object.assign({id,name,hp,maxHp:hp,atkMin,atkMax,xp,mMin,mMax,vamp:true},opts||{});
}
const ENEMIES = [
  E('fledgling','Fledgling Vampire',18,3,6,10,2,6,{tier:1}),
  E('newvamp','Newly Risen Vampire',22,4,8,13,3,7,{tier:1}),
  E('thug','Vampire Thug',28,5,9,16,4,9,{tier:1}),
  E('minion','Order Minion',38,6,11,24,6,12,{tier:2,minDay:8}),
  E('demon','Bezoar Demon',34,5,10,22,5,10,{tier:2,minDay:10,vamp:false}),
  E('polgara','Polgara Demon',50,8,13,32,8,16,{tier:3,minDay:18,vamp:false}),
  E('ordervamp','Order Elite Vampire',55,9,15,38,9,18,{tier:4,minDay:16}),
  E('sewerdemon','Sewer-Dweller Demon',60,10,16,40,10,20,{tier:4,minDay:22,vamp:false}),
];
const SPIKE    = E('spike','Spike',72,9,15,60,0,0,{unique:true});
const ANOINTED = E('anointed','The Anointed One',45,7,12,45,0,0,{unique:true});
const DRUSILLA = E('drusilla','Drusilla',85,11,18,70,0,0,{unique:true});
const ASSASSIN = E('assassin','Order Assassin',30,6,11,20,4,9,{unique:true});
const MASTER   = E('master','The Master',175,12,20,500,0,0,{unique:true});
const ANGELUS  = E('angelus','Angelus',220,15,25,1000,0,0,{unique:true});
const REUNITED = E('reunited','Spike & Drusilla',210,14,24,1000,0,0,{unique:true});

const STORY_BEATS = [
  {day:1,  id:'intro',    text:"Giles: \"Buffy, you carry a great responsibility now — Sunnydale sits atop a Hellmouth. Patrol the cemeteries by night, and do try to keep up with your reading.\""},
  {day:3,  id:'howls',    text:"Strange howls echo from Restfield Cemetery after dark. Something new is prowling Sunnydale."},
  {day:8,  id:'order',    text:"Giles: \"I've found reference to something called 'The Order' — vampires organized under a mysterious Anointed One. Be careful out there.\""},
  {day:10, id:'demons',   text:"Not everything that goes bump in the night is a vampire. The Hellmouth draws all manner of demons to Sunnydale."},
  {day:12, id:'anointed', text:"Whispers speak of a child-like figure commanding The Order from the shadows — they call him the Anointed One.", effect:G=>{G.flags.anointedIncoming=true;}},
  {day:14, id:'spike',    text:"A cocky, bleach-blond vampire has rolled into town in a beat-up DeSoto. Locals are already whispering the name 'Spike.' He's looking for a reputation — and you're the obvious target.", effect:G=>{G.flags.spikeIncoming=true;}},
  {day:17, id:'three',    text:"Giles finds an old prophecy fragment: the Order has sent three assassins to end the Slayer before she grows any stronger. They won't come one at a time.", effect:G=>{G.flags.threeIncoming=true;}},
  {day:20, id:'stirring', text:"Giles goes pale flipping through an old text. \"It speaks of a Master vampire, trapped beneath Sunnydale. The signs... they suggest he's close to breaking free.\"", effect:G=>{G.flags.masterStirring=true;}},
  {dayOffset:2,  season:2, id:'s2_quiet',  text:"The Hellmouth is sealed again, but something else has crept into town in the confusion. The Bronze is buzzing about a dark-haired woman who talks to the dolls in a shop window like they're listening back."},
  {dayOffset:6,  season:2, id:'s2_dru',    text:"Giles: \"Her name is Drusilla. Older than Spike, and by all accounts, far more dangerous. She's not here by accident.\"", effect:G=>{G.flags.drusillaIncoming=true;}},
  {dayOffset:10, season:2, id:'s2_climax', text:"Whatever's coming, it's coming soon. Giles urges you to finish your research and be ready.", effect:G=>{G.flags.season2ClimaxReady=true;}},
];

const SHOP_ITEMS = [
  {id:'stake5',   name:'Bundle of Stakes ×5',  cost:10, desc:'Sharpened, whittled, ready to dust.', effect:G=>{G.stakes+=5;}},
  {id:'holy1',    name:'Vial of Holy Water',   cost:15, desc:'Blessed at the local church. Vamps hate this.', effect:G=>{G.holyWater+=1;}},
  {id:'cross1',   name:'Silver Cross',         cost:12, desc:'Wards off one attack in a pinch.', effect:G=>{G.crosses+=1;}},
  {id:'firstaid', name:'First Aid Kit',        cost:8,  desc:'Patches you up for 25 HP.', effect:G=>{G.health=Math.min(G.maxHealth,G.health+25);}},
];
const SHOP_ITEMS2 = [
  {id:'mrpointy',    name:'Mr. Pointy (Enchanted Stake)', cost:60, once:true, desc:'A perfectly balanced, faintly blessed stake. Permanently +5 Strength.', effect:G=>{G.strength+=5;}},
  {id:'armor',       name:'Reinforced Leather Jacket',    cost:45, once:true, desc:'Permanently reduces all damage taken by 10%.', effect:G=>{G.armor=clamp((G.armor||0)+0.1,0,0.5);}},
  {id:'crossbow',    name:'Crossbow',                     cost:35, once:true, desc:'Unlocks the Crossbow attack in combat. Needs bolts to fire — buy those separately.', effect:G=>{G.hasCrossbow=true;}},
  {id:'bolts3',      name:'Quiver of Bolts ×3',           cost:15, desc:'Ammunition for the crossbow. Doesn\'t come with one.', effect:G=>{G.bolts=(G.bolts||0)+3;}},
  {id:'vigorpotion', name:'Potion of Fortitude',          cost:20, desc:'+30% damage on your next 3 attacks.', effect:G=>{G.fortitudeCharges=(G.fortitudeCharges||0)+3;}},
];

const ACHIEVEMENTS = [
  {id:'first_blood',    name:'First Blood',       desc:'Win your first fight.',                        check:G=>G.stats.kills>=1},
  {id:'grave_shift',    name:'Grave Shift',       desc:'Dust 10 vampires and demons.',                  check:G=>G.stats.kills>=10},
  {id:'veteran',        name:'Veteran Slayer',    desc:'Dust 25 vampires and demons.',                  check:G=>G.stats.kills>=25},
  {id:'full_gang',      name:'Scooby Squad',      desc:'Recruit Willow, Xander, Cordelia, and Angel.',  check:G=>G.scoobies.willow&&G.scoobies.xander&&G.scoobies.cordelia&&G.scoobies.angel},
  {id:'spike_dusted',   name:'Big Bad Blond',     desc:'Defeat Spike.',                                 check:G=>!!G.flags.spikeDefeated},
  {id:'anointed_gone',  name:'No More Prophecy',  desc:'Defeat the Anointed One.',                      check:G=>!!G.flags.anointedDefeated},
  {id:'three_crowd',    name:"Three's a Crowd",   desc:'Survive an ambush by three Order assassins at once.', check:G=>!!G.flags.threeDefeated},
  {id:'harvest_undone',  name:'The Harvest Undone',desc:'Defeat The Master.',                           check:G=>G.season>=2},
  {id:'close_call',     name:'Nine Lives',        desc:'Survive a fight with under 10 HP remaining.',   check:G=>!!G.stats.closeCall},
  {id:'high_roller',    name:'High Roller',       desc:'Carry $150 or more.',                           check:G=>G.money>=150},
  {id:'well_equipped',  name:'Well Equipped',     desc:'Own Mr. Pointy, armor, and a crossbow.',        check:G=>!!G.flags.bought_mrpointy && !!G.flags.bought_armor && !!G.flags.bought_crossbow},
  {id:'tight_knit',     name:'Tight-Knit',        desc:'Get any Scooby\'s bond to 100.',                 check:G=>Object.values(G.bonds||{}).some(v=>v>=100)},
  {id:'drama_queen',    name:'Group Drama',       desc:'Navigate at least 3 Scooby Gang conflicts.',    check:G=>Object.keys(G.flags).filter(k=>k.indexOf('sevent_')===0).length>=3},
  {id:'chosen_one',     name:'The Chosen One',    desc:'Win the game.',                                 check:G=>!!G.win},
];

const SCOOBY_HANGOUT_FLAVOR = {
  willow: [
    "Willow shows you a new spell she's nervous to try. You're delighted; she's terrified. Very on brand.",
    "You and Willow talk research strategy over frozen yogurt. It's a surprisingly good system.",
    "Willow rants about a computer science professor for ten straight minutes. You nod supportively.",
    "\"I found something in the network logs,\" Willow says, like that's a sentence that makes sense to you. You trust her completely anyway.",
  ],
  xander: [
    "Xander does a full stand-up routine about his own many humiliations. It's better than it sounds.",
    "You and Xander split a large order of fries and talk about anything except vampires for once.",
    "Xander tries to teach you a card game with rules he's clearly making up as he goes.",
    "\"You know I've got your back, right?\" Xander says, and for once, isn't joking.",
  ],
  cordelia: [
    "Cordelia gives you a brutally honest assessment of your patrol wardrobe. You take some of it to heart.",
    "Cordelia complains about the Cordettes for twenty minutes, then admits she doesn't even like them that much.",
    "You catch a rare, unguarded moment where Cordelia actually asks if you're doing okay. You almost don't recognize her being sincere.",
    "\"Obviously I don't care,\" Cordelia says, in a tone that means she cares a great deal.",
  ],
  oz: [
    "Oz says about four words the entire hangout. Somehow it's still a good conversation.",
    "You watch Dingoes Ate My Baby rehearse. Oz plays like the rest of the world isn't on fire, which helps.",
    "\"Full moon's coming up,\" Oz mentions, casually, like he's talking about the weather. He kind of is.",
    "Oz offers you half his sandwich without being asked. It's oddly one of the nicer things anyone's done for you this week.",
  ],
  angel: [
    "You and Angel talk on a rooftop until the sky starts going gray. Neither of you mentions the time.",
    "Angel tells you a story from decades ago like it happened last week. It's disorienting how old he actually is.",
    "\"Be careful out there,\" Angel says, and it lands heavier than it should, coming from him.",
    "You catch Angel watching you with an expression he clearly didn't mean for you to see.",
  ],
};

const SCOOBY_EVENTS = [

const EVENT_SOURCES = [
  {events:SCOOBY_EVENTS, flagPrefix:'sevent_'},
  {events:GILES_EVENTS, flagPrefix:'gevent_'},
  {events:JOYCE_EVENTS, flagPrefix:'jevent_'},
  {events:SNYDER_EVENTS, flagPrefix:'snevent_'},
  {events:MAYOR_EVENTS, flagPrefix:'mevent_'},
  {events:SIDE_QUESTS, flagPrefix:'quest_'},
];
function findEventSource(id){
  for(const src of EVENT_SOURCES){
    const ev = src.events.find(e=>e.id===id);
    if(ev) return {ev, flagPrefix:src.flagPrefix};
  }
  return null;
}

// ============================== STATE ==============================

const SAVE_KEY = 'slayerSave_v1';
const HOF_KEY = 'slayerHallOfFame_v1';
let G = null;
let selectedDifficulty = 'normal';

function newGame(name, difficulty, opts){
  opts = opts || {};
  const diffKey = DIFFICULTIES[difficulty] ? difficulty : 'normal';
  const diff = DIFFICULTIES[diffKey];
  G = {
    name: name || 'Buffy',
    difficulty: diffKey,
    ngPlus: !!opts.ngPlus,
    day:1, ap:4, apMax:4,
    health:100, maxHealth:100,
    strength:6 + (opts.ngPlus ? Math.round(opts.bonusLevel*0.5) : 0),
    research:0, charm:5,
    money: diff.startMoney + (opts.ngPlus ? 50 : 0),
    stakes: diff.startStakes, holyWater:2, crosses:1, bolts:0,
    armor:0, hasCrossbow:false, fortitudeCharges:0,
    xp:0, level:1, xpToNext:40,
    scoobyMorale:30,
    scoobies:{willow:false,xander:false,cordelia:false,angel:false,oz:false},
    bonds:{},
    angelMood:'normal', angelBroodUntil:0, angelBroodCount:0,
    season:1, masterDefeatDay:null,
    flags:{},
    location:'library',
    combat:null,
    choiceEvent:null,
    log:[],
    stats:{kills:0, closeCall:false},
    achievements:{},
    gameOver:false, win:false,
  };
  if(opts.ngPlus){
    G.maxHealth += opts.bonusLevel*4;
    G.health = G.maxHealth;
  }
  checkStoryBeats();
  save();
  showGameScreen();
  render();
}

function save(){ if(G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }
function tryLoad(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  try{ G = normalizeSave(JSON.parse(raw)); return true; }catch(e){ return false; }
}

function validateSave(obj){
  return !!obj && typeof obj==='object'
    && typeof obj.day==='number' && typeof obj.health==='number'
    && !!obj.scoobies && !!obj.flags && Array.isArray(obj.log);
}

function normalizeSave(g){
  if(g.bonds==null) g.bonds = {};
  if(g.choiceEvent===undefined) g.choiceEvent = null;
  if(g.bolts==null) g.bolts = 0;
  if(g.armor==null) g.armor = 0;
  if(g.hasCrossbow==null) g.hasCrossbow = false;
  if(g.fortitudeCharges==null) g.fortitudeCharges = 0;
  if(g.scoobies.oz===undefined) g.scoobies.oz = false;
  if(g.stats==null) g.stats = {kills:0, closeCall:false};
  if(g.achievements==null) g.achievements = {};
  if(g.season==null) g.season = 1;
  if(g.masterDefeatDay===undefined) g.masterDefeatDay = null;
  if(g.angelBroodCount==null) g.angelBroodCount = 0;
  return g;
}

function exportSave(){
  let data;
  if(G){
    data = JSON.stringify(G, null, 2);
  } else {
    data = localStorage.getItem(SAVE_KEY);
    if(!data){ alert("No save to export."); return; }
  }
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const nameForFile = ((G && G.name) || 'slayer').replace(/[^a-z0-9]/gi,'_').toLowerCase();
  const daySuffix = G ? `_day${G.day}` : '';
  const a = document.createElement('a');
  a.href = url;
  a.download = `slayer-save-${nameForFile}${daySuffix}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport(){
  document.getElementById('importFileInput').click();
}

function importSaveFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    event.target.value = '';
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ alert("Couldn't import that file — it isn't valid JSON."); return; }
    if(!validateSave(parsed)){ alert("Couldn't import that file — it doesn't look like a Slayer save."); return; }
    if(!confirm(G ? "Replace your current game with this imported save?" : "Load this save? Any existing save will be overwritten.")) return;
    G = normalizeSave(parsed);
    save();
    showGameScreen();
    render();
  };
  reader.onerror = ()=>{ event.target.value=''; alert("Couldn't read that file."); };
  reader.readAsText(file);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function logMsg(text){
  G.log.unshift(text);
  if(G.log.length>60) G.log.length = 60;
}

// ============================== BOOT ==============================

function showGameScreen(){
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
}
function showTitleScreen(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('titleScreen').classList.remove('hidden');
  renderDiffPicker();
  renderHallOfFame();
  refreshTitleButtons();
}
function refreshTitleButtons(){
  const hasSave = !!localStorage.getItem(SAVE_KEY);
  document.getElementById('continueBtn').disabled = !hasSave;
  document.getElementById('exportBtn').disabled = !hasSave;
}

function pickDifficulty(key){ selectedDifficulty = key; renderDiffPicker(); }
function renderDiffPicker(){
  const el = document.getElementById('diffPicker');
  if(!el) return;
  el.innerHTML = Object.keys(DIFFICULTIES).map(k=>{
    const d = DIFFICULTIES[k];
    return `<button class="${selectedDifficulty===k?'active':''}" onclick="pickDifficulty('${k}')">${d.label}</button>`;
  }).join('');
}

function recordHallOfFame(win){
  let hof = [];
  try{ hof = JSON.parse(localStorage.getItem(HOF_KEY)) || []; }catch(e){ hof = []; }
  hof.unshift({name:G.name, day:G.day, level:G.level, win:!!win, ngPlus:!!G.ngPlus});
  if(hof.length>10) hof.length = 10;
  localStorage.setItem(HOF_KEY, JSON.stringify(hof));
}
function renderHallOfFame(){
  const el = document.getElementById('hallOfFame');
  if(!el) return;
  let hof = [];
  try{ hof = JSON.parse(localStorage.getItem(HOF_KEY)) || []; }catch(e){ hof = []; }
  if(!hof.length){ el.innerHTML = ''; return; }
  el.innerHTML = '<h3 style="color:var(--purple2);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:0 0 8px">Hall of Fame</h3>' +
    hof.map(r=>`<div class="hofRow"><span>${escapeHtml(r.name)}${r.ngPlus?' (NG+)':''}</span><span>${r.win?'Victorious':'Fell'} — Day ${r.day}, Lv.${r.level}</span></div>`).join('');
}

function startNewGame(){
  if(localStorage.getItem(SAVE_KEY)){
    if(!confirm("This will overwrite your existing save. Continue?")) return;
  }
  const name = document.getElementById('nameInput').value.trim();
  newGame(name, selectedDifficulty);
}
function continueGame(){
  if(tryLoad()){ showGameScreen(); render(); }
  else alert("No saved game found.");
}
function abandonGame(){
  if(!confirm("Abandon this Slayer's story and return to the title screen? Your save will be erased.")) return;
  localStorage.removeItem(SAVE_KEY);
  G = null;
  showTitleScreen();
}

window.addEventListener('DOMContentLoaded', ()=>{
  refreshTitleButtons();
  renderDiffPicker();
  renderHallOfFame();
});

// ============================== STORY / RECRUITS ==============================

function checkStoryBeats(){
  for(const beat of STORY_BEATS){
    if(beat.season && G.season<beat.season) continue;
    const dayReq = beat.dayOffset!=null ? (G.masterDefeatDay==null ? Infinity : G.masterDefeatDay+beat.dayOffset) : beat.day;
    if(G.day>=dayReq && !G.flags['beat_'+beat.id]){
      G.flags['beat_'+beat.id] = true;
      logMsg(beat.text);
      if(beat.effect) beat.effect(G);
    }
  }
  checkUnlocks();
}

function checkUnlocks(){
  if(G.flags.masterStirring && G.research>=20 && !G.flags.hellmouthUnlocked){
    G.flags.hellmouthUnlocked = true;
    logMsg("The entrance to the Hellmouth beneath the school library has been located. When you're ready, it's time to end this.");
  }
  if(G.flags.beat_order && !G.flags.sewersUnlocked){
    G.flags.sewersUnlocked = true;
    logMsg("Following whispered rumors, you find a way down into the sewers beneath Sunnydale. Something's living down there.");
  }
  if(G.research>=15 && !G.flags.magicboxUnlocked){
    G.flags.magicboxUnlocked = true;
    logMsg("A cryptic classifieds ad leads you to a new occult shop just off Main Street — The Magic Box.");
  }
  if(G.season>=2 && G.flags.season2ClimaxReady && G.research>=35){
    if(G.angelMood==='angelus' && !G.flags.mansionUnlocked){
      G.flags.mansionUnlocked = true;
      logMsg("You've traced Angelus back to an old mansion on the edge of town. This ends tonight.");
    } else if(G.angelMood!=='angelus' && !G.flags.factoryUnlocked){
      G.flags.factoryUnlocked = true;
      logMsg("You've found Spike and Drusilla's hideout — an abandoned factory by the old rail yard. This ends tonight.");
    }
  }
}

function checkRecruits(source){
  if(!G.scoobies.willow && G.research>=10 && G.day>=4){
    G.scoobies.willow = true;
    G.bonds.willow = 50;
    logMsg("Willow: \"I've been cross-referencing the lore books — I think I can help you research this stuff way faster. Team-up?\" Willow joins the Scooby Gang!");
  }
  if(!G.scoobies.xander && G.charm>=8 && G.day>=3){
    G.scoobies.xander = true;
    G.bonds.xander = 50;
    logMsg("Xander: \"Hey, misery loves company, and I make a mean thermos of coffee for stakeouts. I'm in.\" Xander joins the Scooby Gang!");
  }
  if(!G.scoobies.cordelia && source==='mall' && G.charm>=12){
    G.scoobies.cordelia = true;
    G.bonds.cordelia = 50;
    logMsg("Cordelia: \"Okay, I don't do vampires, but I do know where everything's on sale. Consider me your fashion — I mean, intelligence — consultant.\" Cordelia joins the Scooby Gang!");
  }
  if(!G.scoobies.oz && source==='bronze' && G.charm>=15 && G.day>=10){
    G.scoobies.oz = true;
    G.bonds.oz = 50;
    logMsg("Oz: \"Hey.\" That's pretty much it, but he starts showing up when it counts. Oz joins the Scooby Gang!");
  }
}

function bondOf(key){
  return G.bonds[key]!=null ? G.bonds[key] : 50;
}

function cordeliaDiscount(){
  return G.scoobies.cordelia ? clamp(0.05 + bondOf('cordelia')/1000, 0.05, 0.2) : 0;
}

// ============================== ACTIONS ==============================

function spendAP(n){
  if(G.ap<n){ logMsg("You're out of energy for tonight. Head home and rest."); render(); return false; }
  G.ap -= n;
  return true;
}

function goLocation(id){
  const loc = LOCATIONS[id];
  if(loc.locked && !G.flags[loc.unlockFlag]) return;
  G.location = id;
  render();
}

function actionTrain(){
  if(!spendAP(1)) return;
  G.strength += 1;
  let bonus = "";
  if(Math.random()<0.2){ G.strength += 1; bonus = " A breakthrough — that's extra strength banked."; }
  logMsg("You run drills until your arms shake. Strength increased." + bonus);
  maybeTriggerEvent(SNYDER_EVENTS, 'snevent_', 0.15);
  save(); render();
}

function actionSpar(){
  if(!spendAP(2)) return;
  G.strength += 2;
  let bonus = "";

function maybeTriggerEvent(events, flagPrefix, chance){
  const eligible = events.filter(ev => !G.flags[flagPrefix+ev.id] && ev.requires(G));
  if(!eligible.length) return false;
  if(Math.random()<chance){
    G.choiceEvent = eligible[randInt(0,eligible.length-1)].id;
    return true;
  }
  return false;
}

function resolveChoiceEvent(evId, choiceId){
  const src = findEventSource(evId);
  if(!src){ G.choiceEvent = null; render(); return; }
  const ev = src.ev;
  const choice = ev.choices.find(c=>c.id===choiceId);
  if(!choice) return;
  ['willow','xander','cordelia','oz','angel','giles','joyce'].forEach(k=>{ if(G.bonds[k]==null) G.bonds[k] = 50; });
  const result = choice.effect(G);
  G.flags[src.flagPrefix+ev.id] = true;
  if(G.choiceEvent===evId) G.choiceEvent = null; // unless effect() chained to a follow-up stage
  if(result) logMsg(result);
  save(); render();
}

// ============================== COMBAT ==============================

function spawnEnemyInstance(base){
  const dayBonusHp = Math.floor(G.day/5)*3;
  const dayBonusAtk = Math.floor(G.day/6);
  const diff = DIFFICULTIES[G.difficulty] || DIFFICULTIES.normal;
  const mult = diff.enemyMult * (G.ngPlus ? 1.15 : 1);
  const hp = Math.round((base.hp+dayBonusHp)*mult);
  const atkMin = Math.round((base.atkMin+dayBonusAtk)*mult);
  const atkMax = Math.round((base.atkMax+dayBonusAtk)*mult);
  return Object.assign({}, base, {hp, maxHp:hp, atkMin, atkMax});
}

function pickScriptedUnique(){
  if(G.flags.spikeIncoming){ G.flags.spikeIncoming=false; return SPIKE; }
  if(G.flags.anointedIncoming){ G.flags.anointedIncoming=false; return ANOINTED; }
  if(G.flags.drusillaIncoming){ G.flags.drusillaIncoming=false; return DRUSILLA; }
  return null;
}

function rollPatrolEvent(){
  const r = Math.random();
  if(r<0.10) return 'money';
  if(r<0.16) return 'item';
  if(r<0.22) return 'civilian';
  if(r<0.26) return 'quiet';
  return 'fight';
}

function resolvePatrolEvent(kind){
  if(kind==='money'){
    const amt = randInt(5,15);
    G.money += amt;
    logMsg(`You find $${amt} dropped near an overturned headstone. Score.`);
  } else if(kind==='item'){
    const pick = randInt(0,2);
    if(pick===0){ G.stakes+=2; logMsg("You find a stash of sharpened stakes left behind by... someone. You're not going to ask."); }
    else if(pick===1){ G.holyWater+=1; logMsg("A dropped vial of holy water, unbroken. Lucky."); }
    else { G.crosses+=1; logMsg("A silver cross, half-buried in the dirt. Yours now."); }
  } else if(kind==='civilian'){
    G.scoobyMorale = clamp(G.scoobyMorale+8,0,100);
    G.xp += 5;
    logMsg("You spot a lost tourist about to wander into a nest and steer them back to well-lit streets. Small victories.");
    checkLevelUp();
  } else if(kind==='quiet'){
    logMsg("A quiet night. Not everything in a cemetery wants to kill you. Mostly.");
  }
  save(); render();
}

function newCombat(enemy, extra){
  return Object.assign({enemy, usedWillow:false, usedXander:false, usedAngel:false, usedOz:false, round:1, tipOff:false, lootMult:1, isFinal:false}, extra||{});
}

function checkWaveEncounter(){
  if(G.flags.threeIncoming){
    G.flags.threeIncoming = false;
    startWaveEncounter([ASSASSIN, ASSASSIN, ASSASSIN]);
    save(); render();
    return true;
  }
  return false;
}

function startWaveEncounter(bases){
  const instances = bases.map(b=>spawnEnemyInstance(b));
  const first = instances.shift();
  G.combat = newCombat(first, {waveQueue:instances, waveTotal:bases.length, waveIndex:1});
  logMsg("Three shapes drop from the shadows, surrounding you. The Order sent its assassins after all — and they came together.");
}

function actionPatrol(){
  if(!spendAP(1)) return;

  if(checkWaveEncounter()) return;

  if(!G.scoobies.angel && G.angelMood!=='angelus' && G.day>=6 && G.charm>=10 && Math.random()<0.25){
    G.scoobies.angel = true;
    G.bonds.angel = 50;
    logMsg("A mysterious stranger in a long coat pulls a vampire off you before it can land the killing blow. \"You fight well,\" he says, vanishing into the fog before you can ask his name. You'll come to know him as Angel.");
    save(); render();
    return;
  }

  let base = pickScriptedUnique();
  if(!base){
    const roll = rollPatrolEvent();
    if(roll!=='fight'){ resolvePatrolEvent(roll); return; }
    const pool = ENEMIES.filter(e => (!e.minDay || G.day>=e.minDay) && e.tier<=3);
    base = pool[randInt(0,pool.length-1)];
  }
  const enemy = spawnEnemyInstance(base);
  G.combat = newCombat(enemy, {tipOff:!!G.flags.tipOff});
  G.flags.tipOff = false;
  logMsg(`Patrol: you round a mausoleum and come face to face with ${enemy.name}.`);
  save(); render();
}

function actionPatrolSewers(){
  if(!spendAP(1)) return;
  if(checkWaveEncounter()) return;
  let base = pickScriptedUnique();
  if(!base){
    const roll = rollPatrolEvent();
    if(roll!=='fight'){ resolvePatrolEvent(roll); return; }
    const pool = ENEMIES.filter(e => (!e.minDay || G.day>=e.minDay) && e.tier>=2);
    base = pool.length ? pool[randInt(0,pool.length-1)] : ENEMIES[0];
  }
  const enemy = spawnEnemyInstance(base);
  G.combat = newCombat(enemy, {tipOff:!!G.flags.tipOff, lootMult:1.3});
  G.flags.tipOff = false;
  logMsg(`You wade deeper into the tunnels and come face to face with ${enemy.name}.`);
  save(); render();
}

function actionDescend(){
  if(G.season>=2){ logMsg("The Hellmouth has gone quiet. Whatever's coming next, it's not from down there."); render(); return; }
  if(!confirm("This is it — the final battle against The Master. Make sure you're prepared. Descend into the Hellmouth?")) return;
  const enemy = spawnEnemyInstance(MASTER);
  G.combat = newCombat(enemy, {isFinal:true});
  logMsg("You descend into the dark beneath Sunnydale High. At the bottom, chained in ancient stone, The Master opens his eyes.");
  save(); render();
}

function actionFinalBattle(locId){
  const label = locId==='mansion' ? 'Angelus' : 'Spike and Drusilla';
  if(!confirm(`This is it — the final battle against ${label}. Make sure you're prepared. Proceed?`)) return;
  const base = locId==='mansion' ? ANGELUS : REUNITED;
  const enemy = spawnEnemyInstance(base);
  G.combat = newCombat(enemy, {isFinal:true});
  logMsg(locId==='mansion'
    ? "You step through the mansion's rotting front door. Angelus is waiting, exactly as cruel as the stories promised."
    : "The factory is lit by dozens of candles. Spike and Drusilla are waiting for you, arm in arm.");
  save(); render();
}

function moraleReduction(){ return clamp(G.scoobyMorale/500, 0, 0.2); }

function enemyAttack(mitigation){
  const c = G.combat;
  if(!c) return 0;
  const enraged = c.enemy.hp <= c.enemy.maxHp*0.3;
  let dmg = randInt(c.enemy.atkMin, c.enemy.atkMax);
  if(enraged) dmg = Math.round(dmg*1.35);
  dmg = Math.round(dmg * (1-mitigation) * (1-moraleReduction()) * (1-(G.armor||0)));
  dmg = Math.max(0,dmg);
  G.health = clamp(G.health - dmg, 0, G.maxHealth);
  logMsg(`${c.enemy.name}${enraged?' (enraged, fighting harder as it goes down)':''} strikes for ${dmg} damage.`);
  c.round += 1;
  if(G.health>0 && G.health<10) G.stats.closeCall = true;
  if(G.health<=0){ endCombatDefeat(); return dmg; }
  return dmg;
}

function checkLevelUp(){
  let leveled = false;
  while(G.xp>=G.xpToNext){
    G.xp -= G.xpToNext;
    G.level += 1;
    G.maxHealth += 8;
    G.health = Math.min(G.maxHealth, G.health+8);
    G.strength += 1;
    G.xpToNext = G.level*40;
    leveled = true;
  }
  if(leveled) logMsg(`You feel it in your bones — Slayer strength grows. You reached level ${G.level}!`);
}

function popFighter(index, amount, cls){
  const fighters = document.querySelectorAll('#content .fighter');
  const el = fighters[index];
  if(!el || !amount) return;
  const span = document.createElement('div');
  span.className = 'dmgPop ' + (cls||'dmg');
  span.textContent = (cls==='heal'?'+':'-') + amount;
  el.appendChild(span);
  setTimeout(()=>{ if(span.parentNode) span.parentNode.removeChild(span); }, 900);
  if(cls!=='heal'){
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 400);
  }
}

function checkAchievements(){
  for(const a of ACHIEVEMENTS){
    if(!G.achievements[a.id] && a.check(G)){
      G.achievements[a.id] = true;
      logMsg(`<span style="color:var(--gold2)">★ Achievement Unlocked: ${a.name}</span> — ${a.desc}`);
    }
  }
}

function endCombatVictory(){
  const c = G.combat;
  const enemy = c.enemy;

  if(enemy.id==='master'){
    G.money += 100;
    G.xp += enemy.xp;
    G.season = 2;
    G.masterDefeatDay = G.day;
    logMsg("Dust settles where an ancient evil stood a moment before. The Hellmouth falls silent... but something tells you this isn't over.");
    checkLevelUp();
    G.combat = null;
    checkStoryBeats();
    checkUnlocks();
    save(); render();
    return;
  }
  if(enemy.id==='angelus' || enemy.id==='reunited'){
    G.win = true;
    G.combat = null;
    save();
    recordHallOfFame(true);
    showEnd(true, enemy.id);
    return;
  }

  const moneyMul = (c.tipOff?1.5:1) * (c.lootMult||1);
  const money = Math.round(randInt(enemy.mMin,enemy.mMax)*moneyMul);
  G.money += money;
  G.xp += enemy.xp;
  G.stats.kills += 1;
  logMsg(`${VICTORY_FLAVOR[randInt(0,VICTORY_FLAVOR.length-1)]} You gain ${enemy.xp} XP and find $${money}.`);
  if(Math.random()<0.2){ G.stakes += 1; logMsg("You retrieve your stake from the dust."); }
  if(enemy.id==='spike'){ G.flags.spikeDefeated=true; logMsg("Spike snarls and flees Sunnydale, nursing his wounded pride. You won't see him again for a good while."); }
  if(enemy.id==='anointed'){ G.flags.anointedDefeated=true; logMsg("The Anointed One shatters like porcelain, a child's face frozen in surprise. The Order scatters without their prophesied leader."); }
  if(enemy.id==='drusilla'){ G.flags.drusillaDefeated=true; logMsg("Drusilla laughs even as she crumbles. \"You'll dance with the devil yet, Slayer.\" And then she's gone."); }
  checkLevelUp();

  if(c.waveQueue && c.waveQueue.length){
    c.enemy = c.waveQueue.shift();
    c.waveIndex = (c.waveIndex||1) + 1;
    logMsg(`One assassin falls, but the others close in. Assassin ${c.waveIndex} of ${c.waveTotal}.`);
    checkUnlocks();
    save(); render();
    return;
  }
  if(c.waveTotal){
    G.flags.threeDefeated = true;
    logMsg("The last assassin crumbles. The Order's hit squad is gone — nobody sends three after the Slayer and lives to report back.");
  }

  G.combat = null;
  checkUnlocks();
  save(); render();
}

function endCombatDefeat(){
  G.combat = null;
  G.gameOver = true;
  save();
  recordHallOfFame(false);
  showEnd(false);
}

function combatStake(){
  const c = G.combat; if(!c) return;
  let dmg;
  if(G.stakes>0){
    G.stakes -= 1;
    dmg = G.strength + randInt(2,7);
    if(G.fortitudeCharges>0){ dmg = Math.round(dmg*1.3); G.fortitudeCharges--; }
    logMsg(`You drive a stake home for ${dmg} damage.`);
  } else {
    dmg = Math.max(1,Math.round(G.strength/2));
    logMsg(`Out of stakes — you throw a punch instead for ${dmg} damage.`);
  }
  c.enemy.hp = clamp(c.enemy.hp - dmg, 0, c.enemy.maxHp);
  if(c.enemy.hp<=0){ endCombatVictory(); return; }
  const dmgTaken = enemyAttack(0);
  render(); save();
  popFighter(1, dmg, 'dmg');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}

function combatQuip(){
  const c = G.combat; if(!c) return;
  const debuff = clamp((10+G.charm*2)/100, 0.1, 0.6);
  logMsg(`You quip: ${QUIP_LINES[randInt(0,QUIP_LINES.length-1)]}`);
  const reactions = UNIQUE_QUIP_REACTIONS[c.enemy.id] || (c.enemy.vamp ? VAMP_QUIP_REACTIONS : DEMON_QUIP_REACTIONS);
  logMsg(reactions[randInt(0,reactions.length-1)]);
  const dmgTaken = enemyAttack(debuff);
  render(); save();
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}

function combatHolyWater(){
  const c = G.combat; if(!c || G.holyWater<=0) return;
  G.holyWater -= 1;
  let dmg;
  if(c.enemy.vamp){
    dmg = Math.round(G.strength*1.5) + 10;
    logMsg(`Holy water sears ${c.enemy.name} for ${dmg} damage — it shrieks in agony.`);
  } else {
    dmg = Math.round(G.strength/2);
    logMsg(`Holy water splashes over ${c.enemy.name}. It barely notices, dealing only ${dmg} damage.`);
  }
  c.enemy.hp = clamp(c.enemy.hp - dmg, 0, c.enemy.maxHp);
  if(c.enemy.hp<=0){ endCombatVictory(); return; }
  const dmgTaken = enemyAttack(0);
  render(); save();
  popFighter(1, dmg, 'dmg');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}

function combatCross(){
  const c = G.combat; if(!c || G.crosses<=0) return;
  G.crosses -= 1;
  logMsg("You brandish a silver cross. It recoils, attack blocked entirely.");
  enemyAttack(1);
  render(); save();
}

function combatDodge(){
  const c = G.combat; if(!c) return;
  let dmg = 0;
  if(G.research>=15 && Math.random()<0.3){
    dmg = Math.round(G.strength/2);
    c.enemy.hp = clamp(c.enemy.hp - dmg, 0, c.enemy.maxHp);
  }
  logMsg("You weave out of the way, reflexes honed by training." + (dmg>0 ? ` Reading up on its kind pays off — you counter for ${dmg} damage.` : ""));
  if(c.enemy.hp<=0){ endCombatVictory(); return; }
  const dmgTaken = enemyAttack(0.6);
  render(); save();
  if(dmg>0) popFighter(1, dmg, 'dmg');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}

function combatCrossbow(){
  const c = G.combat; if(!c || !G.hasCrossbow || G.bolts<=0) return;
  G.bolts -= 1;
  let dmg = Math.round(G.strength*1.3) + 12;
  if(G.fortitudeCharges>0){ dmg = Math.round(dmg*1.3); G.fortitudeCharges--; }
  c.enemy.hp = clamp(c.enemy.hp - dmg, 0, c.enemy.maxHp);
  logMsg(`You fire the crossbow — a bolt slams into ${c.enemy.name} for ${dmg} damage.`);
  if(c.enemy.hp<=0){ endCombatVictory(); return; }
  const dmgTaken = enemyAttack(0);
  render(); save();
  popFighter(1, dmg, 'dmg');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}

function combatFlee(){
  const c = G.combat; if(!c) return;
  if(c.isFinal){ logMsg("There's no running from this one."); render(); return; }
  const chance = clamp(50 + (G.strength - 10), 10, 90);
  if(randInt(1,100)<=chance){
    logMsg("You slip away into the shadows before it can react.");
    G.combat = null;
    save(); render();
  } else {
    logMsg("You try to flee, but it's faster than you thought.");
    const dmgTaken = enemyAttack(0);
    render(); save();
    if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
  }
}

  c.usedWillow = true;
  const dmg = 8 + Math.round(G.research*1.2) + Math.round(bondOf('willow')/10);

}
function combatCallXander(){

  c.usedXander = true;
  const healAmt = 15 + Math.round(bondOf('xander')/10);
  G.health = Math.min(G.maxHealth, G.health+healAmt);
  logMsg(`Xander covers your back and shoves a granola bar at you between swings. You recover ${healAmt} HP.`);
  const dmgTaken = enemyAttack(0);
  render(); save();
  popFighter(0, healAmt, 'heal');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}
function combatCallAngel(){
  const c = G.combat; if(!c || !G.scoobies.angel || c.usedAngel || G.angelMood==='brooding') return;
  c.usedAngel = true;
  const dmg = 15 + Math.floor(G.day/2) + Math.round(bondOf('angel')/10);
  c.enemy.hp = clamp(c.enemy.hp - dmg, 0, c.enemy.maxHp);
  logMsg(`Angel appears from the shadows and lands a brutal blow for ${dmg} damage before melting back into the dark.`);
  if(c.enemy.hp<=0){ endCombatVictory(); return; }
  const dmgTaken = enemyAttack(0);
  render(); save();
  popFighter(1, dmg, 'dmg');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}
function combatCallOz(){
  const c = G.combat; if(!c || !G.scoobies.oz || c.usedOz) return;
  c.usedOz = true;
  const fullMoon = (G.day % 7)===0;
  let dmg;
  if(fullMoon){
    dmg = 25 + Math.floor(G.day/2) + Math.round(bondOf('oz')/10);
    logMsg(`It's a full moon — Oz isn't quite Oz right now. Something feral crashes into ${c.enemy.name} for ${dmg} damage.`);
  } else {
    dmg = 10 + Math.round(bondOf('oz')/20);
    logMsg("Oz shows up, guitar case in hand, and calmly helps you land a solid hit.");
  }
  c.enemy.hp = clamp(c.enemy.hp - dmg, 0, c.enemy.maxHp);
  if(c.enemy.hp<=0){ endCombatVictory(); return; }
  const dmgTaken = enemyAttack(0);
  render(); save();
  popFighter(1, dmg, 'dmg');
  if(dmgTaken>0) popFighter(0, dmgTaken, 'dmg');
}

// ============================== ENDINGS ==============================

function showEnd(win, bossId){
  const card = document.getElementById('endCard');
  if(win){
    let title, body;
    if(bossId==='angelus'){
      title = "ANGELUS FALLS";
      body = `The demon wearing Angel's face is gone. Somewhere, underneath all that, you have to believe there was a man worth grieving for. Sunnydale is safe — for now, and at a cost only you will carry, ${escapeHtml(G.name)}.`;
    } else {
      title = "SPIKE &amp; DRUSILLA, UNDONE";
      body = `Sunnydale's newest power couple didn't even last a season. Dust settles over the factory floor, and for once, the night is quiet. Nicely done, ${escapeHtml(G.name)}.`;
    }
    card.innerHTML = `
      <h2 style="color:var(--gold2)">${title}</h2>
      <p>${body}</p>
      <p>Final stats — Day ${G.day} · Level ${G.level} · Strength ${G.strength} · Research ${G.research}</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap">
        <button class="gold" onclick="restartToTitle()">Play Again</button>
        <button onclick="newGamePlus()">New Game+</button>
      </div>
    `;
  } else {
    card.innerHTML = `
      <h2 style="color:var(--blood2)">DUST TO DUST</h2>
      <p>The fangs find their mark. Your vision fades to black in a cemetery that will forget your name by morning...</p>
      <p>Fortunately, Slayers have a habit of coming back. Reached Day ${G.day} · Level ${G.level}.</p>
      <button class="danger" onclick="restartToTitle()">Try Again</button>
    `;
  }
  document.getElementById('endOverlay').classList.remove('hidden');
}
function restartToTitle(){
  document.getElementById('endOverlay').classList.add('hidden');
  localStorage.removeItem(SAVE_KEY);
  G = null;
  showTitleScreen();
}
function newGamePlus(){
  document.getElementById('endOverlay').classList.add('hidden');
  const name = G.name;
  const bonusLevel = G.level;
  localStorage.removeItem(SAVE_KEY);
  G = null;
  newGame(name, 'normal', {ngPlus:true, bonusLevel});
}

// ============================== RENDER ==============================

function render(){
  if(!G) return;
  checkAchievements();
  renderHeader();
  renderNav();
  renderContent();
  renderSide();
  renderLog();
}

function renderHeader(){
  const hpPct = clamp(100*G.health/G.maxHealth,0,100);
  const xpPct = clamp(100*G.xp/G.xpToNext,0,100);
  let dots = "";
  for(let i=0;i<G.apMax;i++) dots += `<span class="${i<G.ap?'full':''}">${'♦'}</span>`;
  document.getElementById('statBar').innerHTML = `
    <div class="name">${escapeHtml(G.name)} <span style="font-size:12px;color:var(--dim)">Lv.${G.level}</span></div>
    <div class="statItem">Day ${G.day}</div>
    <div class="statItem">HP <div class="barOuter"><div class="barInner hpBar ${hpPct<30?'low':''}" style="width:${hpPct}%"></div></div></div>
    <div class="statItem">XP <div class="barOuter"><div class="barInner xpBar" style="width:${xpPct}%"></div></div></div>
    <div class="statItem apDots">${dots}</div>
    <div class="statItem">$${G.money}</div>
    <span class="headerLink" onclick="exportSave()">export save</span>
    <span class="headerLink" onclick="triggerImport()">import save</span>
    <span id="abandonLink" onclick="abandonGame()">abandon</span>
  `;
}

function renderNav(){
  let html = "";
  for(const id in LOCATIONS){
    const loc = LOCATIONS[id];
    if(loc.locked && !G.flags[loc.unlockFlag]) continue;
    html += `<button class="${G.location===id?'active':''}" onclick="goLocation('${id}')">${loc.name}</button>`;
  }
  document.getElementById('locNav').innerHTML = html;
}

function renderContent(){
  const el = document.getElementById('content');
  if(G.combat){ el.innerHTML = renderCombatHtml(); return; }
  if(G.choiceEvent){ el.innerHTML = renderChoiceEventHtml(); return; }

  const loc = LOCATIONS[G.location];
  let actions = "";
  switch(G.location){
    case 'library':
      actions = `
        <div class="actionGrid">
          <button onclick="actionTrain()" ${G.ap<1?'disabled':''}>Train (1 AP) — +Strength</button>
          <button onclick="actionSpar()" ${G.ap<2?'disabled':''}>Spar with Giles (2 AP) — ++Strength</button>
          <button onclick="actionResearch()" ${G.ap<1?'disabled':''}>Research (1 AP) — +Research</button>
          <button onclick="actionGiles()">Talk to Giles (free, once/day)</button>
        </div>`;
      break;
    case 'bronze':{
      const scoobyBtn = (key,label) => G.scoobies[key]
        ? `<button onclick="actionHangoutWith('${key}')" ${G.ap<1?'disabled':''}>One-on-One with ${label} (1 AP)</button>` : '';
      actions = `
        <div class="actionGrid">
          <button onclick="actionHangout()" ${G.ap<1?'disabled':''}>Hang Out with the Gang (1 AP) — +Charm, +Morale</button>
          ${scoobyBtn('willow','Willow')}
          ${scoobyBtn('xander','Xander')}
          ${scoobyBtn('cordelia','Cordelia')}
          ${scoobyBtn('oz','Oz')}
          ${scoobyBtn('angel','Angel')}
          <button onclick="actionRumor()" ${G.ap<1?'disabled':''}>Ask Around (1 AP) — better loot tonight</button>
        </div>`;
      break;
    }
    case 'mall':
      actions = `<div>${SHOP_ITEMS.map(i=>{
        let cost = Math.ceil(i.cost*(1-cordeliaDiscount()));
        return `<div class="shopItem"><div class="info"><b>${i.name}</b><div>${i.desc}</div></div><button onclick="buyItem('${i.id}')" ${G.money<cost?'disabled':''}>Buy ($${cost})</button></div>`;
      }).join('')}</div>`;
      break;
    case 'magicbox':
      actions = `
        <div class="actionGrid">
          <button onclick="actionResearchDeep()" ${G.ap<1?'disabled':''}>Study Rare Texts (1 AP) — +2 Research</button>
        </div>
        <div style="margin-top:14px">${SHOP_ITEMS2.map(i=>{
          const owned = i.once && G.flags['bought_'+i.id];
          let cost = Math.ceil(i.cost*(1-cordeliaDiscount()));
          return `<div class="shopItem"><div class="info"><b>${i.name}</b><div>${i.desc}</div></div><button onclick="buyItem2('${i.id}')" ${owned||G.money<cost?'disabled':''}>${owned?'Owned':'Buy ($'+cost+')'}</button></div>`;
        }).join('')}</div>`;
      break;
    case 'cemetery':
      actions = `<div class="actionGrid"><button onclick="actionPatrol()" ${G.ap<1?'disabled':''}>Patrol (1 AP)</button></div>`;
      break;
    case 'sewers':
      actions = `<div class="actionGrid"><button onclick="actionPatrolSewers()" ${G.ap<1?'disabled':''}>Search the Tunnels (1 AP)</button></div>`;
      break;
    case 'home':{
      const joyceHeal = G.flags.joyceKnows ? 8 : (G.flags.joyceInDenial ? 3 : 5);
      actions = `
        <div class="actionGrid">
          <button onclick="actionJoyce()">Talk to Mom (free, once/day) — +${joyceHeal} HP</button>
          <button class="gold" onclick="actionRest()">Sleep &amp; End the Day</button>
        </div>`;
      break;
    }
    case 'hellmouth':
      actions = G.season>=2
        ? `<div class="flavor">The crack in the earth has gone still and silent. For now.</div>`
        : `<div class="actionGrid"><button class="danger" onclick="actionDescend()">Descend and Face The Master</button></div>`;
      break;
    case 'mansion':
      actions = `<div class="actionGrid"><button class="danger" onclick="actionFinalBattle('mansion')">Confront Angelus</button></div>`;
      break;
    case 'factory':
      actions = `<div class="actionGrid"><button class="danger" onclick="actionFinalBattle('factory')">Confront Spike &amp; Drusilla</button></div>`;
      break;
  }
  el.innerHTML = `<h2>${loc.name}</h2><div class="flavor">${loc.desc}</div>${actions}`;
}

function renderChoiceEventHtml(){
  const src = findEventSource(G.choiceEvent);
  if(!src){ G.choiceEvent = null; return ''; }
  const ev = src.ev;
  const text = typeof ev.text==='function' ? ev.text(G) : ev.text;
  return `
    <h2>${ev.title}</h2>
    <div class="flavor">${text}</div>
    <div class="actionGrid">
      ${ev.choices.map(c=>`<button onclick="resolveChoiceEvent('${ev.id}','${c.id}')">${c.label}</button>`).join('')}
    </div>
  `;
}

function renderCombatHtml(){
  const c = G.combat;
  const e = c.enemy;
  const hpPct = clamp(100*G.health/G.maxHealth,0,100);
  const ehpPct = clamp(100*e.hp/e.maxHp,0,100);
  const canWillow = G.scoobies.willow && !c.usedWillow;
  const canXander = G.scoobies.xander && !c.usedXander;
  const canAngel = G.scoobies.angel && !c.usedAngel && G.angelMood!=='brooding';
  const canOz = G.scoobies.oz && !c.usedOz;
  return `
    <h2>Combat: ${e.name}${c.waveTotal?` (${c.waveIndex} of ${c.waveTotal})`:''}</h2>
    <div class="combatWrap">
      <div class="vsRow">
        <div class="fighter">
          <h3>${escapeHtml(G.name)}</h3>
          <div class="barOuter"><div class="barInner hpBar ${hpPct<30?'low':''}" style="width:${hpPct}%"></div></div>
          <div style="font-size:12px;color:var(--dim);margin-top:4px">${G.health} / ${G.maxHealth} HP</div>
        </div>
        <div class="fighter">
          <h3>${e.name}</h3>
          <div class="barOuter"><div class="barInner hpBar" style="width:${ehpPct}%"></div></div>
          <div style="font-size:12px;color:var(--dim);margin-top:4px">${e.hp} / ${e.maxHp} HP</div>
        </div>
      </div>
      <div class="combatBtns">
        <button onclick="combatStake()">Stake (${G.stakes} left)</button>
        <button onclick="combatQuip()">Quip</button>
        <button onclick="combatDodge()">Dodge</button>
        <button onclick="combatHolyWater()" ${G.holyWater<=0?'disabled':''}>Holy Water (${G.holyWater})</button>
        <button onclick="combatCross()" ${G.crosses<=0?'disabled':''}>Cross (${G.crosses})</button>
        ${G.hasCrossbow?`<button onclick="combatCrossbow()" ${G.bolts<=0?'disabled':''}>Crossbow (${G.bolts})</button>`:''}
        ${canWillow?'<button onclick="combatCallWillow()">Call Willow</button>':''}
        ${canXander?'<button onclick="combatCallXander()">Call Xander</button>':''}
        ${canAngel?'<button onclick="combatCallAngel()">Call Angel</button>':''}
        ${canOz?'<button onclick="combatCallOz()">Call Oz</button>':''}
        <button class="danger" onclick="combatFlee()" ${c.isFinal?'disabled':''}>Flee</button>
      </div>
    </div>
  `;
}

function renderSide(){
  const s = G.scoobies;
  const scoobyRow = (key, label, on) => {
    if(!on) return `<div class="scoobyRow"><span>${label}</span><span class="dot">○</span></div>`;
    const bond = G.bonds[key]!=null ? G.bonds[key] : 50;
    return `<div class="scoobyRow on"><span>${label}</span><span class="dot" title="Bond: ${bond}/100">${bond}</span></div>`;
  };
  const unlockedCount = Object.keys(G.achievements).length;
  const angelLabel = s.angel ? (G.angelMood==='brooding'?'Angel (brooding)':'Angel') : (G.angelMood==='angelus'?'Angel (lost)':'Angel');
  document.getElementById('sidePanel').innerHTML = `
    <div class="sideBox">
      <h3>Scooby Gang</h3>
      ${scoobyRow('giles', 'Giles (Watcher)', true)}
      ${scoobyRow('willow', 'Willow', s.willow)}
      ${scoobyRow('xander', 'Xander', s.xander)}
      ${scoobyRow('cordelia', 'Cordelia', s.cordelia)}
      ${scoobyRow('oz', 'Oz', s.oz)}
      ${scoobyRow('angel', angelLabel, s.angel)}
      <div style="font-size:12px;color:var(--dim);margin-top:8px">Morale: ${G.scoobyMorale}/100 &middot; numbers show individual bond</div>
    </div>
    <div class="sideBox">
      <h3>Inventory</h3>
      <div class="invRow"><span>Stakes</span><span>${G.stakes}</span></div>
      <div class="invRow"><span>Holy Water</span><span>${G.holyWater}</span></div>
      <div class="invRow"><span>Crosses</span><span>${G.crosses}</span></div>
      ${G.hasCrossbow?`<div class="invRow"><span>Crossbow Bolts</span><span>${G.bolts}</span></div>`:''}
      ${G.armor>0?`<div class="invRow"><span>Armor</span><span>-${Math.round(G.armor*100)}% dmg</span></div>`:''}
      ${G.fortitudeCharges>0?`<div class="invRow"><span>Fortitude</span><span>${G.fortitudeCharges} left</span></div>`:''}
    </div>
    <div class="sideBox">
      <h3>Slayer Stats</h3>
      <div class="invRow"><span>Strength</span><span>${G.strength}</span></div>
      <div class="invRow"><span>Research</span><span>${G.research}</span></div>
      <div class="invRow"><span>Charm</span><span>${G.charm}</span></div>
    </div>
    <div class="sideBox">
      <h3>Achievements (${unlockedCount}/${ACHIEVEMENTS.length})</h3>
      ${ACHIEVEMENTS.map(a=>`<div class="scoobyRow ${G.achievements[a.id]?'on':''}" title="${escapeHtml(a.desc)}"><span>${a.name}</span><span class="dot">${G.achievements[a.id]?'★':'○'}</span></div>`).join('')}
    </div>
  `;
}

function renderLog(){
  document.getElementById('logPanel').innerHTML = G.log.map(l=>`<div>${l}</div>`).join('');
}
</script>
</body>
</html>
