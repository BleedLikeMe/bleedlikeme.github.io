<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Multi Lottery Machine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap');

  * { box-sizing: border-box; }

  /* .drumBlock's own `display:flex` otherwise wins a specificity tie against
     the browser default `[hidden]{display:none}`, so a hidden bonus drum
     (UK Lotto / Polish Lotto, which have no separate bonus pool) would still
     render as an empty ghost circle without this. */
  [hidden] { display: none !important; }

  html, body {
    max-width: 100%;
  }
  /* overflow-x:hidden on the combined selector above would put it on BOTH html and body — and per the CSS
     spec, an element with one overflow axis non-visible and the other left unset gets that axis forced to
     auto, so both independently become overflow-y:auto. Two nested "scrollable" containers is an ambiguous
     setup that silently breaks native touch-drag scrolling on mobile (found and fixed on buffy.html, same
     pattern): document.scrollingElement/scrollTo() resolve it fine for JS, so it looks correct in any
     programmatic check, but a real finger-drag scrolls nothing. Keeping the horizontal clamp on html only
     leaves a single, unambiguous scroller. */
  html {
    overflow-x: hidden;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #5b2a86 0%, #2d1a4a 55%, #150c26 100%);
    font-family: 'Baloo 2', 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
    color: #fff;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    text-align: center;
    padding: 24px 16px 60px;
    max-width: 820px;
    width: 100%;
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2.3rem);
    font-weight: 800;
    margin: 0 0 10px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    letter-spacing: 1px;
  }

  .gameSelectRow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .gameSelectRow label {
    font-size: 0.9rem;
    opacity: 0.8;
    font-weight: 600;
  }

  select#gameSelect {
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
  }
  select#gameSelect option {
    color: #1c1233;
    background: #fff;
  }
  select#gameSelect:disabled { opacity: 0.5; cursor: not-allowed; }

  .subtitle {
    opacity: 0.75;
    margin-bottom: 18px;
    font-size: 0.95rem;
  }

  .drums {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }

  .drumBlock {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .drumLabel {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    /* The chute graphic pokes up above its .stage by ~6% of the drum's
       rendered width (up to ~26px at the 420px main-drum max-width), so
       this needs to clear that or the chute overlaps the label text. */
    margin-bottom: 28px;
  }

  .stage {
    position: relative;
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .stage-small {
    max-width: 210px;
  }

  .chute {
    position: absolute;
    top: -6%;
    left: 50%;
    transform: translateX(-50%);
    width: 9.5%;
    height: 7%;
    min-width: 20px;
    min-height: 14px;
    background: linear-gradient(180deg, #cfd8ff, #8a97c9);
    border: 3px solid #4b4f7a;
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25);
    z-index: 3;
  }

  canvas.drum {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #dfe7ff 8%, #b9c4ea 40%, #8892c4 100%);
    box-shadow:
      0 0 0 10px #3a2c5e,
      0 0 0 16px #1c1233,
      0 20px 40px rgba(0,0,0,0.5),
      inset 0 0 40px rgba(0,0,0,0.15);
  }

  .controls {
    margin: 22px 0 10px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 14px 26px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 8px 14px rgba(0,0,0,0.3);
    transition: transform 0.08s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #drawBtn { background: linear-gradient(180deg,#ffd166,#f2a90c); color: #3a2600; }
  #resetBtn { background: linear-gradient(180deg,#ef476f,#c22a4d); color: #fff; }

  .status {
    min-height: 26px;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 8px 0 4px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

  .remaining {
    font-size: 0.8rem;
    opacity: 0.65;
    margin-bottom: 18px;
  }

  .results {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .resultsBonus {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,0.2);
  }

  .bonusDivider {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.65;
    margin-bottom: 10px;
  }

  .bonusRow {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .slot {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.4rem;
    background: rgba(255,255,255,0.08);
    border: 3px dashed rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.4);
    position: relative;
  }

  .slot.slot-bonus {
    width: 54px;
    height: 54px;
    font-size: 1.2rem;
    border-color: rgba(255,214,102,0.5);
  }

  .slot.filled {
    border-style: solid;
    color: #fff;
    text-shadow: 0 2px 2px rgba(0,0,0,0.4);
    box-shadow: 0 6px 12px rgba(0,0,0,0.35), inset 0 -6px 10px rgba(0,0,0,0.25), inset 0 4px 8px rgba(255,255,255,0.4);
  }

  .sorted {
    margin-top: 22px;
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .sorted.show { opacity: 0.9; }
  .sorted b { font-size: 1.05rem; }

  .flyer {
    position: fixed;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 2px rgba(0,0,0,0.4);
    box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 -6px 10px rgba(0,0,0,0.25), inset 0 4px 8px rgba(255,255,255,0.45);
    z-index: 50;
    pointer-events: none;
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  @media (max-width: 700px) {
    .drums { gap: 22px; }
    .stage, .stage-small { max-width: 320px; }
  }

  @media (max-width: 420px) {
    .wrap { padding: 16px 10px 40px; }
    .slot { width: 46px; height: 46px; font-size: 1.1rem; border-width: 2px; }
    .slot.slot-bonus { width: 40px; height: 40px; font-size: 1rem; }
    .results, .bonusRow { gap: 8px; }
    .controls { gap: 10px; }
    button { padding: 12px 20px; font-size: 0.9rem; }
    .chute { border-width: 2px; }
    .stage, .stage-small { max-width: 260px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1 id="gameTitle">🎱 Multi Lottery Draw Machine 🎱</h1>

  <div class="gameSelectRow">
    <label for="gameSelect">Choose a draw:</label>
    <select id="gameSelect"></select>
  </div>

  <div class="subtitle" id="subtitle">Drawing 6 numbers from a pool of 1–59</div>

  <div class="drums" id="drumsWrap">
    <div class="drumBlock" id="mainDrumBlock">
      <div class="drumLabel" id="mainDrumLabel">Main Numbers</div>
      <div class="stage">
        <div class="chute"></div>
        <canvas class="drum" id="drumMain" width="440" height="440"></canvas>
      </div>
    </div>
    <div class="drumBlock" id="bonusDrumBlock" hidden>
      <div class="drumLabel" id="bonusDrumLabel">Bonus</div>
      <div class="stage stage-small">
        <div class="chute"></div>
        <canvas class="drum" id="drumBonus" width="220" height="220"></canvas>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="drawBtn">🎉 Start Draw</button>
    <button id="resetBtn">🔄 Reset</button>
  </div>

  <div class="status" id="status">Press "Start Draw" to begin.</div>
  <div class="remaining" id="remaining">Balls in drum: 59</div>

  <div class="results" id="resultsMain"></div>
  <div class="results resultsBonus" id="resultsBonus" hidden></div>

  <div class="sorted" id="sorted">Sorted result: <b id="sortedNums">–</b></div>
</div>

<canvas id="confetti"></canvas>

<script>
(() => {
  // ---------- Game definitions ----------
  // Numbers verified online (Sep 2026): National Lottery / EuroMillions official
  // rules pages and Totalizator Sportowy (Poland Lotto) game info.
  //
  // Ball colours are also based on real machines, not guesswork:
  //  - UK Lotto: banded by number (lottery.co.uk/lotto/colours) — 1-9 white,
  //    10-19 blue, 20-29 pink, 30-39 green, 40-49 yellow, 50-59 purple. The
  //    Bonus Ball is drawn from that same physical set, so it just carries
  //    whichever band colour its own number falls in — it has no colour of
  //    its own (hence `bonus.accent: null` below).
  //  - EuroMillions: main balls are a uniform claret/dark red, Lucky Stars a
  //    uniform gold (lottery.merseyworld.com/Info/FAQ_Euro.html).
  //  - Thunderball: main balls uniform dark blue, the Thunderball itself
  //    uniform dark red (lottery.merseyworld.com/Thunderball/Info/FAQ.html).
  //  - Set For Life: main balls uniform white, the Life Ball uniform
  //    turquoise (mylotterylife.co.uk/set-for-life-results-history/).
  //  - Poland Lotto: current (2012-) Smartplay Saturn machine draws uniform
  //    yellow balls for the main Lotto game.
  const GAMES = {
    lotto: {
      label: 'UK Lotto',
      emoji: '🎱',
      subtitle: 'Drawing 6 Main Numbers + 1 Bonus Ball from a pool of 1–59',
      main: { count: 6, max: 59, label: 'Main Numbers', colorFn: lottoBandColor },
      bonus: { count: 1, max: 59, label: 'Bonus Ball', separate: false, accent: null }
    },
    euromillions: {
      label: 'EuroMillions',
      emoji: '⭐',
      subtitle: 'Drawing 5 Main Numbers from 1–50 + 2 Lucky Stars from 1–12',
      main: { count: 5, max: 50, label: 'Main Numbers', colorFn: solidColor('#7a1f2b') },
      bonus: { count: 2, max: 12, label: 'Lucky Star', accentLabel: 'Lucky Stars', separate: true, accent: '#e0a72e' }
    },
    thunderball: {
      label: 'Thunderball',
      emoji: '⚡',
      subtitle: 'Drawing 5 Main Numbers from 1–39 + 1 Thunderball from 1–14',
      main: { count: 5, max: 39, label: 'Main Numbers', colorFn: solidColor('#1c3f8f') },
      bonus: { count: 1, max: 14, label: 'Thunderball', separate: true, accent: '#9e2a2b' }
    },
    setforlife: {
      label: 'Set For Life',
      emoji: '💷',
      subtitle: 'Drawing 5 Main Numbers from 1–47 + 1 Life Ball from 1–10',
      main: { count: 5, max: 47, label: 'Main Numbers', colorFn: solidColor('#f2f2f2') },
      bonus: { count: 1, max: 10, label: 'Life Ball', separate: true, accent: '#14b8a6' }
    },
    poland: {
      label: 'Polish Lotto (Lotto Poland)',
      emoji: '🇵🇱',
      subtitle: 'Drawing 6 Main Numbers from a pool of 1–49 — no bonus number',
      main: { count: 6, max: 49, label: 'Main Numbers', colorFn: solidColor('#ffd60a') },
      bonus: null
    }
  };
  const GAME_ORDER = ['lotto', 'euromillions', 'thunderball', 'setforlife', 'poland'];

  let currentGame = 'lotto';
  let mainSlots = [];
  let bonusSlots = [];
  let drawing = false;

  // ---------- DOM ----------
  const gameSelect = document.getElementById('gameSelect');
  const titleEl = document.getElementById('gameTitle');
  const subtitleEl = document.getElementById('subtitle');
  const mainDrumLabelEl = document.getElementById('mainDrumLabel');
  const bonusDrumBlockEl = document.getElementById('bonusDrumBlock');
  const bonusDrumLabelEl = document.getElementById('bonusDrumLabel');

  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusEl = document.getElementById('status');
  const remainingEl = document.getElementById('remaining');
  const resultsMainEl = document.getElementById('resultsMain');
  const resultsBonusEl = document.getElementById('resultsBonus');
  const sortedEl = document.getElementById('sorted');
  const sortedNumsEl = document.getElementById('sortedNums');

  // ---------- Colour helpers ----------
  function shade(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + percent;
    let g = ((num >> 8) & 0xff) + percent;
    let b = (num & 0xff) + percent;
    r = Math.min(255, Math.max(0, r));
    g = Math.min(255, Math.max(0, g));
    b = Math.min(255, Math.max(0, b));
    return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
  }

  // UK Lotto's real 1-59 colour bands (lottery.co.uk/lotto/colours).
  function lottoBandColor(n) {
    if (n <= 9) return '#f2f2f2';
    if (n <= 19) return '#1f6fd6';
    if (n <= 29) return '#ec4899';
    if (n <= 39) return '#16a34a';
    if (n <= 49) return '#facc15';
    return '#7c3aed';
  }

  function solidColor(hex) {
    return () => hex;
  }

  // Picks a legible number colour (and matching outline) for a given ball
  // background — real balls use dark text on light balls (white/yellow) and
  // white text on dark ones, rather than always-white numbers.
  function textColorFor(bg) {
    const num = parseInt(bg.slice(1), 16);
    const r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6
      ? { fill: '#1c1233', outline: 'rgba(255,255,255,0.55)' }
      : { fill: '#ffffff', outline: 'rgba(0,0,0,0.35)' };
  }

  function calcBallRadius(drumRadius, max) {
    const r = (drumRadius * 0.6) / Math.sqrt(max);
    return Math.max(9, Math.min(16, r));
  }

  // ---------- Drum factory ----------
  // Each drum is an independent physics/render unit so a "separate pool"
  // bonus draw (Lucky Stars, Thunderball, Life Ball) can run its own drum
  // side-by-side with the main one, while games whose bonus comes from the
  // same pool (Lotto's Bonus Ball) just keep drawing from the main drum.
  function makeDrum(canvas) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const center = { x: W / 2, y: H / 2 };
    const drumRadius = W / 2 - 14;
    return {
      canvas, ctx, W, H, center, drumRadius,
      nozzle: { x: center.x, y: center.y - drumRadius + 4 },
      ballR: 14,
      max: 0,
      colorFn: null,
      balls: [],
      sprites: {},
      spriteSize: 0,
      agitating: false,
      active: true,
      paddleAngle: 0,
      leaveResolvers: {}
    };
  }

  function initBalls(drum) {
    drum.balls = [];
    const { center, drumRadius, ballR, max } = drum;
    for (let n = 1; n <= max; n++) {
      let x, y, placed = false, tries = 0;
      while (!placed && tries < 500) {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.random() * (drumRadius - ballR - 4);
        x = center.x + Math.cos(ang) * rad;
        y = center.y + Math.sin(ang) * rad;
        placed = drum.balls.every(b => Math.hypot(b.x - x, b.y - y) > ballR * 2 + 1);
        tries++;
      }
      const ang = Math.random() * Math.PI * 2;
      const speed = 0.5 + Math.random() * 0.7;
      drum.balls.push({
        n, x, y,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        r: ballR,
        state: 'idle'
      });
    }
  }

  // Pre-rendered ball sprites: drawing a gradient + stroked text per ball, per
  // frame is expensive on low-power mobile GPUs. Bake each ball's look once
  // into an offscreen canvas and just drawImage() it every frame instead.
  function buildSprites(drum) {
    drum.sprites = {};
    const ballR = drum.ballR;
    const PAD = 4;
    const SIZE = ballR * 2 + PAD * 2;
    drum.spriteSize = SIZE;
    for (let n = 1; n <= drum.max; n++) {
      const off = document.createElement('canvas');
      off.width = SIZE; off.height = SIZE;
      const octx = off.getContext('2d');
      const cx = SIZE / 2, cy = SIZE / 2;
      const color = drum.colorFn(n, drum.max);

      octx.beginPath();
      octx.arc(cx, cy, ballR, 0, Math.PI * 2);
      const grad = octx.createRadialGradient(
        cx - ballR * 0.4, cy - ballR * 0.4, ballR * 0.2,
        cx, cy, ballR
      );
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.25, color);
      grad.addColorStop(1, shade(color, -25));
      octx.fillStyle = grad;
      octx.fill();
      octx.lineWidth = 1.5;
      octx.strokeStyle = shade(color, -40);
      octx.stroke();

      const textColor = textColorFor(color);
      octx.fillStyle = textColor.fill;
      octx.font = `bold ${Math.round(ballR * 0.82)}px "Baloo 2", sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.lineWidth = 2.2;
      octx.strokeStyle = textColor.outline;
      octx.strokeText(n, cx, cy + 0.5);
      octx.fillText(n, cx, cy + 0.5);

      drum.sprites[n] = off;
    }
  }

  function configureDrum(drum, max, colorFn) {
    drum.max = max;
    drum.colorFn = colorFn;
    drum.ballR = calcBallRadius(drum.drumRadius, max);
    buildSprites(drum);
    initBalls(drum);
  }

  // ---------- Physics ----------
  function stepDrum(drum) {
    const boost = drum.agitating ? 2.1 : 1;
    const { center, drumRadius, nozzle, balls } = drum;

    for (const b of balls) {
      if (b.state === 'leaving') {
        const dx = nozzle.x - b.x, dy = nozzle.y - b.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        if (dist < 9) {
          const resolve = drum.leaveResolvers[b.n];
          delete drum.leaveResolvers[b.n];
          drum.balls = drum.balls.filter(x => x !== b);
          if (resolve) resolve();
          continue;
        }
        b.vx = (b.vx + (dx / dist) * 0.9) * 0.85;
        b.vy = (b.vy + (dy / dist) * 0.9) * 0.85;
        b.x += b.vx;
        b.y += b.vy;
        continue;
      }

      b.vx += (Math.random() - 0.5) * 0.16 * boost;
      b.vy += (Math.random() - 0.5) * 0.16 * boost;

      const sp = Math.hypot(b.vx, b.vy);
      const maxSp = 2.4 * boost;
      if (sp > maxSp) { b.vx *= maxSp / sp; b.vy *= maxSp / sp; }

      b.x += b.vx;
      b.y += b.vy;

      const dc = Math.hypot(b.x - center.x, b.y - center.y);
      if (dc + b.r > drumRadius) {
        const nx = (b.x - center.x) / dc, ny = (b.y - center.y) / dc;
        b.x = center.x + nx * (drumRadius - b.r);
        b.y = center.y + ny * (drumRadius - b.r);
        const dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * 0.92;
        b.vy = (b.vy - 2 * dot * ny) * 0.92;
      }
    }

    const list = drum.balls;
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (a.state === 'leaving' || b.state === 'leaving') continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist > 0 && dist < minDist) {
          const nx = dx / dist, ny = dy / dist;
          const overlap = (minDist - dist) / 2;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          const relVx = b.vx - a.vx, relVy = b.vy - a.vy;
          const relSpeed = relVx * nx + relVy * ny;
          if (relSpeed < 0) {
            a.vx += relSpeed * nx; a.vy += relSpeed * ny;
            b.vx -= relSpeed * nx; b.vy -= relSpeed * ny;
          }
        }
      }
    }

    drum.paddleAngle += (drum.agitating ? 0.09 : 0.02);
  }

  // ---------- Rendering ----------
  function renderDrum(drum) {
    const { ctx, W, H, center, drumRadius } = drum;
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.translate(center.x, center.y);
    ctx.rotate(drum.paddleAngle);
    ctx.fillStyle = 'rgba(90,70,150,0.35)';
    const paddleLen = drumRadius * 0.55;
    const paddleW = drumRadius * 0.17;
    for (let i = 0; i < 3; i++) {
      ctx.rotate((Math.PI * 2) / 3);
      ctx.beginPath();
      ctx.ellipse(0, paddleLen, paddleW, paddleLen, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const half = drum.spriteSize / 2;
    for (const b of drum.balls) {
      ctx.drawImage(drum.sprites[b.n], b.x - half, b.y - half, drum.spriteSize, drum.spriteSize);
    }
  }

  function loop() {
    stepDrum(mainDrum);
    renderDrum(mainDrum);
    if (bonusDrum.active) {
      stepDrum(bonusDrum);
      renderDrum(bonusDrum);
    }
    requestAnimationFrame(loop);
  }

  // ---------- Draw sequence ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function waitForLeave(drum, n) {
    return new Promise(resolve => { drum.leaveResolvers[n] = resolve; });
  }

  function pageXY(drum, canvasX, canvasY) {
    const rect = drum.canvas.getBoundingClientRect();
    const sx = rect.width / drum.W, sy = rect.height / drum.H;
    return { x: rect.left + canvasX * sx, y: rect.top + canvasY * sy, scale: (sx + sy) / 2 };
  }

  function flyToSlot(drum, number, color, slotEl) {
    return new Promise(resolve => {
      const start = pageXY(drum, drum.nozzle.x, drum.nozzle.y);
      const size = drum.ballR * 2 * start.scale;
      const slotRect = slotEl.getBoundingClientRect();
      const endX = slotRect.left + slotRect.width / 2 - size / 2;
      const endY = slotRect.top + slotRect.height / 2 - size / 2;
      const startX = start.x - size / 2;
      const startY = start.y - size / 2;

      const textColor = textColorFor(color);

      const flyer = document.createElement('div');
      flyer.className = 'flyer';
      flyer.style.width = size + 'px';
      flyer.style.height = size + 'px';
      flyer.style.left = startX + 'px';
      flyer.style.top = startY + 'px';
      flyer.style.background = `radial-gradient(circle at 35% 30%, #fff 0%, ${color} 30%, ${shade(color, -25)} 100%)`;
      flyer.style.fontSize = (size * 0.42) + 'px';
      flyer.style.color = textColor.fill;
      flyer.textContent = number;
      document.body.appendChild(flyer);

      const dx = endX - startX, dy = endY - startY;
      const anim = flyer.animate([
        { transform: 'translate(0px,0px) scale(1) rotate(0deg)', offset: 0 },
        { transform: `translate(${dx * 0.5}px, ${dy * 0.4 - 70}px) scale(1.15) rotate(180deg)`, offset: 0.55 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.95) rotate(320deg)`, offset: 1 }
      ], { duration: 850, easing: 'cubic-bezier(.3,.6,.3,1)' });

      anim.onfinish = () => {
        flyer.remove();
        slotEl.classList.add('filled');
        slotEl.style.background = `radial-gradient(circle at 35% 30%, #fff 0%, ${color} 30%, ${shade(color, -25)} 100%)`;
        slotEl.style.color = textColor.fill;
        slotEl.textContent = number;
        slotEl.animate([
          { transform: 'scale(1.3)' },
          { transform: 'scale(1)' }
        ], { duration: 260, easing: 'ease-out' });
        resolve();
      };
    });
  }

  let audioCtx;
  function beep(freq = 660, dur = 0.12) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* audio not available */ }
  }

  function updateRemaining() {
    const game = GAMES[currentGame];
    let txt = `Main pool: ${mainDrum.balls.length} / ${mainDrum.max} remaining`;
    if (game.bonus && game.bonus.separate) {
      txt += `  •  ${game.bonus.accentLabel || game.bonus.label} pool: ${bonusDrum.balls.length} / ${bonusDrum.max} remaining`;
    }
    remainingEl.textContent = txt;
  }

  function buildSlots(game) {
    resultsMainEl.innerHTML = '';
    mainSlots = [];
    for (let i = 0; i < game.main.count; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = '?';
      resultsMainEl.appendChild(slot);
      mainSlots.push(slot);
    }

    bonusSlots = [];
    resultsBonusEl.innerHTML = '';
    if (game.bonus) {
      resultsBonusEl.hidden = false;
      const label = document.createElement('div');
      label.className = 'bonusDivider';
      label.textContent = game.bonus.accentLabel || game.bonus.label;
      resultsBonusEl.appendChild(label);
      const row = document.createElement('div');
      row.className = 'bonusRow';
      for (let i = 0; i < game.bonus.count; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot slot-bonus';
        slot.textContent = '?';
        row.appendChild(slot);
        bonusSlots.push(slot);
      }
      resultsBonusEl.appendChild(row);
    } else {
      resultsBonusEl.hidden = true;
    }
  }

  function resetStatusAndSorted() {
    statusEl.textContent = 'Press "Start Draw" to begin.';
    sortedEl.classList.remove('show');
    sortedNumsEl.textContent = '–';
  }

  function setGame(key) {
    currentGame = key;
    const game = GAMES[key];

    titleEl.textContent = `${game.emoji} ${game.label} Draw Machine ${game.emoji}`;
    subtitleEl.textContent = game.subtitle;
    mainDrumLabelEl.textContent = game.main.label;

    configureDrum(mainDrum, game.main.max, game.main.colorFn);

    if (game.bonus && game.bonus.separate) {
      bonusDrum.active = true;
      bonusDrumBlockEl.hidden = false;
      bonusDrumLabelEl.textContent = game.bonus.accentLabel || game.bonus.label;
      configureDrum(bonusDrum, game.bonus.max, solidColor(game.bonus.accent));
    } else {
      bonusDrum.active = false;
      bonusDrumBlockEl.hidden = true;
    }

    buildSlots(game);
    updateRemaining();
    resetStatusAndSorted();
  }

  function resetAll() {
    if (drawing) return;
    setGame(currentGame);
  }

  async function startDraw() {
    if (drawing) return;
    drawing = true;
    drawBtn.disabled = true;
    resetBtn.disabled = true;
    gameSelect.disabled = true;

    const game = GAMES[currentGame];
    buildSlots(game);
    resetStatusAndSorted();
    statusEl.textContent = '🌀 Mixing the balls...';
    mainDrum.agitating = true;
    if (bonusDrum.active) bonusDrum.agitating = true;
    await sleep(1300);

    const drawnMain = [];
    for (let i = 0; i < game.main.count; i++) {
      statusEl.textContent = `Drawing ${game.main.label} ${i + 1} of ${game.main.count}...`;
      await sleep(500);

      const idx = Math.floor(Math.random() * mainDrum.balls.length);
      const chosen = mainDrum.balls[idx];
      chosen.state = 'leaving';
      beep(520 + i * 40);

      await waitForLeave(mainDrum, chosen.n);
      await flyToSlot(mainDrum, chosen.n, mainDrum.colorFn(chosen.n, mainDrum.max), mainSlots[i]);
      drawnMain.push(chosen.n);
      updateRemaining();
      beep(880, 0.15);
      await sleep(350);
    }

    const drawnBonus = [];
    if (game.bonus) {
      // Lotto's Bonus Ball comes from the same drum/pool as the main
      // numbers; every other game's bonus balls have their own separate pool.
      const bonusSourceDrum = game.bonus.separate ? bonusDrum : mainDrum;
      for (let i = 0; i < game.bonus.count; i++) {
        const label = game.bonus.accentLabel || game.bonus.label;
        statusEl.textContent = game.bonus.count > 1
          ? `Drawing ${label} ${i + 1} of ${game.bonus.count}...`
          : `Drawing the ${label}...`;
        await sleep(500);

        const idx = Math.floor(Math.random() * bonusSourceDrum.balls.length);
        const chosen = bonusSourceDrum.balls[idx];
        chosen.state = 'leaving';
        beep(700 + i * 40);

        await waitForLeave(bonusSourceDrum, chosen.n);
        await flyToSlot(bonusSourceDrum, chosen.n, bonusSourceDrum.colorFn(chosen.n, bonusSourceDrum.max), bonusSlots[i]);
        drawnBonus.push(chosen.n);
        updateRemaining();
        beep(980, 0.15);
        await sleep(350);
      }
    }

    mainDrum.agitating = false;
    if (bonusDrum.active) bonusDrum.agitating = false;

    const totalDrawn = game.main.count + (game.bonus ? game.bonus.count : 0);
    statusEl.textContent = `🎉 All ${totalDrawn} ball${totalDrawn === 1 ? '' : 's'} drawn!`;

    const sortedMain = [...drawnMain].sort((a, b) => a - b).join(' – ');
    if (game.bonus) {
      const sortedBonus = [...drawnBonus].sort((a, b) => a - b).join(' – ');
      const label = game.bonus.accentLabel || game.bonus.label;
      sortedNumsEl.textContent = `${sortedMain}  +  ${label}: ${sortedBonus}`;
    } else {
      sortedNumsEl.textContent = sortedMain;
    }
    sortedEl.classList.add('show');
    launchConfetti();

    drawBtn.disabled = false;
    resetBtn.disabled = false;
    gameSelect.disabled = false;
    drawing = false;
  }

  drawBtn.addEventListener('click', startDraw);
  resetBtn.addEventListener('click', resetAll);
  gameSelect.addEventListener('change', () => {
    if (drawing) { gameSelect.value = currentGame; return; }
    setGame(gameSelect.value);
  });

  // ---------- Confetti ----------
  const confettiCanvas = document.getElementById('confetti');
  const cctx = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let confettiRunning = false;

  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function launchConfetti() {
    const colors = ['#ef476f', '#f2994a', '#ffd166', '#06d6a0', '#118ab2', '#7b2cbf', '#ffffff'];
    confettiParticles = [];
    for (let i = 0; i < 160; i++) {
      confettiParticles.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * confettiCanvas.height * 0.5,
        vx: (Math.random() - 0.5) * 2.5,
        vy: 2 + Math.random() * 3,
        size: 5 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 0,
        maxLife: 260 + Math.random() * 100
      });
    }
    if (!confettiRunning) {
      confettiRunning = true;
      confettiLoop();
    }
  }

  function confettiLoop() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    for (const p of confettiParticles) {
      p.life++;
      if (p.life > p.maxLife) continue;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.rot += p.vr;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      cctx.restore();
    }
    if (alive) {
      requestAnimationFrame(confettiLoop);
    } else {
      confettiRunning = false;
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  // ---------- Init ----------
  const mainDrum = makeDrum(document.getElementById('drumMain'));
  const bonusDrum = makeDrum(document.getElementById('drumBonus'));
  bonusDrum.active = false;

  for (const key of GAME_ORDER) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = GAMES[key].label;
    gameSelect.appendChild(opt);
  }
  gameSelect.value = currentGame;

  if (document.fonts && document.fonts.ready) {
    // Rebuild once the web font finishes loading so numbers don't stay stuck
    // in the fallback font baked into the first pass of sprites.
    document.fonts.ready.then(() => {
      if (mainDrum.max) buildSprites(mainDrum);
      if (bonusDrum.active && bonusDrum.max) buildSprites(bonusDrum);
    }).catch(() => {});
  }

  setGame(currentGame);
  loop();
})();
</script>
</body>
</html>
