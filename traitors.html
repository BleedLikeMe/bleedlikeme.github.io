<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Traitors at Ardross</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans+SC:wght@500;700&family=IM+Fell+English+SC&display=swap">
<style>
:root{
  /* Layout: a candlelit stage (dialogue + choices) beside a castle ledger of contestants, with a sticky HUD strip. Single dark world: Highland castle at night. */
  --bg:#150e0d; --panel:#221714; --raise:#2e201b; --raise2:#3a2922; --line:#4b342b;
  --ink:#f2e7d3; --muted:#b9a38b; --dim:#86715f;
  --gold:#e2b45a; --gold2:#9f7a30; --blood:#d0453a; --blood2:#6a1c18; --faith:#8db79a; --faith2:#2d4a39;
  --paper:#eadcbf; --paper-ink:#2b1d14; --tartan:rgba(160,40,40,.08); --tartan2:rgba(226,180,90,.035);
  --display:'IM Fell English SC',Georgia,'Times New Roman',serif;
  --body:'Alegreya',Georgia,serif;
  --label:'Alegreya Sans SC','Gill Sans','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:repeating-linear-gradient(90deg,var(--tartan) 0 3px,transparent 3px 52px),repeating-linear-gradient(0deg,var(--tartan) 0 3px,transparent 3px 52px),repeating-linear-gradient(90deg,var(--tartan2) 0 14px,transparent 14px 26px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
#hud .in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.brand{font-family:var(--display);font-size:1.25rem;color:var(--gold);letter-spacing:.06em;margin-right:auto}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-family:var(--label);font-size:.7rem;letter-spacing:.1em;color:var(--dim)}
.stat b{font-variant-numeric:tabular-nums;font-weight:600}
.role{font-family:var(--label);letter-spacing:.12em;font-size:.8rem;padding:4px 10px;border-radius:2px;border:1px solid}
.role.F{color:var(--faith);border-color:var(--faith2);background:var(--faith2)}
.role.F{color:var(--ink)}
.role.T{color:var(--ink);border-color:var(--blood);background:var(--blood2)}
.dots{letter-spacing:2px;color:var(--blood)}
.dots i{font-style:normal;color:var(--line)}
.items{display:flex;gap:6px}
.item{font-family:var(--label);font-size:.72rem;letter-spacing:.08em;border:1px solid var(--gold2);color:var(--gold);padding:2px 7px;border-radius:2px}
.pace{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--label);font-size:.75rem;letter-spacing:.08em;padding:4px 8px;border-radius:2px;cursor:pointer}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:16px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}

/* Stage */
#stage{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.head{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
#loc{font-family:var(--display);font-size:1.7rem;color:var(--gold);line-height:1.1;text-wrap:balance}
#sub{font-family:var(--label);letter-spacing:.1em;font-size:.8rem;color:var(--muted)}
#log{padding:16px 18px;display:flex;flex-direction:column;gap:11px;min-height:280px;max-height:58vh;overflow-y:auto;cursor:default}
@media (max-width:920px){#log{max-height:none;min-height:200px}}
.line{display:flex;gap:11px;align-items:flex-start;animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--label);font-weight:700;font-size:.85rem;background:hsl(var(--h) 26% 30%);color:var(--ink);border:1px solid hsl(var(--h) 30% 45%)}
.av.you{border:2px solid var(--gold)}
.av-c{background:var(--gold);color:var(--paper-ink);border-color:var(--gold);font-family:var(--display);font-size:1.1rem}
.bub{min-width:0;max-width:62ch}
.bub b{display:block;font-family:var(--label);font-size:.78rem;letter-spacing:.09em;color:var(--muted)}
.bub p{margin:1px 0 0}
.line.cl .bub b{color:var(--gold)}
.line.cl .bub p{font-style:italic}
.line.me{flex-direction:row-reverse}
.line.me .bub{background:var(--raise);padding:6px 12px;border-radius:10px 2px 10px 10px;text-align:right}
.line.narr p{margin:0 0 0 49px;color:var(--muted);font-style:italic;max-width:64ch}
.line.narr.big p{margin-left:0;font-style:normal;color:var(--ink);font-size:1.05rem}
.reveal{text-align:center;padding:14px 8px;border-block:1px solid var(--line);animation:up .6s ease both}
.reveal span{display:block;font-family:var(--label);letter-spacing:.14em;font-size:.85rem;color:var(--muted)}
.reveal strong{font-family:var(--display);font-size:2.4rem;font-weight:400;letter-spacing:.05em}
.reveal.rt strong{color:var(--blood)} .reveal.rf strong{color:var(--faith)}
.letter{align-self:center;max-width:420px;width:100%;background:var(--paper);color:var(--paper-ink);padding:20px 24px;font-family:var(--display);font-size:1.15rem;line-height:1.45;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:rotate(-1deg);animation:up .6s ease both}
.letter.black{background:#0d0909;color:var(--blood);border:1px solid var(--blood2)}
.letter small{display:block;margin-top:10px;text-align:right;font-size:.95rem}

/* Panel */
#panel{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#panel:empty{display:none}
.prompt{font-family:var(--label);letter-spacing:.07em;color:var(--gold);font-size:.92rem}
.prompt .q{display:block;font-family:var(--body);letter-spacing:0;color:var(--ink);font-size:1.1rem;margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.choice{text-align:left;background:var(--raise);border:1px solid var(--line);padding:10px 13px;border-radius:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--gold);background:var(--raise2)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice small{color:var(--muted);font-size:.85rem}
.choice.primary{background:var(--gold);color:var(--paper-ink);border-color:var(--gold);font-weight:600}
.choice.primary small{color:var(--paper-ink)}
.choice.ghost{background:transparent}
.choice.danger{border-color:var(--blood2)}
.choice.tr{border-color:var(--blood2);background:var(--blood2)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.person{display:flex;gap:9px;align-items:center;text-align:left;background:var(--raise);border:1px solid var(--line);padding:7px 9px;border-radius:3px;cursor:pointer}
.person:hover,.person.sel{border-color:var(--gold);background:var(--raise2)}
.person.sel{box-shadow:inset 0 0 0 1px var(--gold)}
.person span{min-width:0;display:flex;flex-direction:column}
.person small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .av{width:32px;height:32px;font-size:.75rem}

/* Title */
.hero{padding:18px 0 6px}
.eyebrow{font-family:var(--label);letter-spacing:.18em;font-size:.8rem;color:var(--muted)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.8rem,9vw,5.4rem);line-height:.95;margin:.15em 0 .1em;color:var(--gold);letter-spacing:.04em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--blood)}
.lede{font-size:1.15rem;max-width:56ch;margin:.3em 0 0}
.how{margin:14px 0 0;padding-left:1.3em;color:var(--muted);max-width:64ch}
.how li{margin:3px 0}.how b{color:var(--ink);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-family:var(--label);letter-spacing:.08em;font-size:.78rem;color:var(--muted)}
.form input{font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
.fate{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.95rem}
.fate label{display:flex;gap:6px;align-items:center;cursor:pointer}
.fineprint{font-size:.8rem;color:var(--dim)}

/* Side */
#side{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px;font-family:var(--label);letter-spacing:.1em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
#board,#journal{padding:10px;display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow-y:auto}
@media (max-width:920px){#board,#journal{max-height:none}}
.card{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 7px;border-radius:3px;border:1px solid transparent}
.card .av{width:34px;height:34px;font-size:.75rem}
.card.you{border-color:var(--line);background:var(--raise)}
.card.gone{opacity:.55}
.card.gone .ci b{text-decoration:line-through;text-decoration-color:var(--dim)}
.ci{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ci b{font-weight:600}
.ci small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buzz{font-size:.7rem;letter-spacing:1px;color:var(--blood)}
.buzz i{font-style:normal;color:var(--line)}
.tag{font-family:var(--label);font-size:.7rem;letter-spacing:.08em;padding:3px 7px;border-radius:2px;border:1px solid var(--line);background:none;color:var(--muted);white-space:nowrap}
button.tag{cursor:pointer}
.tag.t{border-color:var(--blood);color:var(--blood)}
.tag.f{border-color:var(--faith2);color:var(--faith)}
.tag.a{border-color:var(--gold2);color:var(--gold)}
.tag.m{border-color:var(--dim);color:var(--dim)}
.sidenote{font-size:.8rem;color:var(--dim);padding:2px 7px 6px}
.j{font-size:.92rem;border-left:2px solid var(--line);padding:2px 0 2px 9px}
.j small{display:block;font-family:var(--label);letter-spacing:.08em;font-size:.7rem;color:var(--dim)}
.j.clue{border-color:var(--gold2)} .j.tell{border-color:var(--blood2)} .j.event{border-color:var(--faith2)}

/* Mini-games */
.mg{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mg-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-family:var(--label);letter-spacing:.08em}
.mg-h b{color:var(--gold)} .mg-h span{color:var(--muted)}
.stones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;width:100%;margin:0 auto}
.stone{aspect-ratio:1.3;max-width:100%;font-size:2.2rem;background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer;transition:all .12s}
.stone:disabled{cursor:default}
.stone.lit,.stone.tap{background:var(--gold);color:var(--paper-ink);box-shadow:0 0 28px var(--gold)}
.mg.fail .stone{border-color:var(--blood2)}
.range{position:relative;height:46px;border-radius:3px;border:1px solid var(--line);background:linear-gradient(90deg,var(--raise) 0 25%,var(--raise2) 25% 34%,var(--blood2) 34% 41%,var(--gold2) 41% 46.5%,var(--gold) 46.5% 53.5%,var(--gold2) 53.5% 59%,var(--blood2) 59% 66%,var(--raise2) 66% 75%,var(--raise) 75%)}
.mk{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);box-shadow:0 0 8px var(--ink);transform:translateX(-1px)}
.shots{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}
.shot{font-family:var(--label);border:1px solid var(--line);padding:2px 9px;border-radius:2px;font-variant-numeric:tabular-nums}
.shot.hi{border-color:var(--gold);color:var(--gold)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:56px;height:56px;font-size:1.7rem;background:var(--raise);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.slot:hover{border-color:var(--gold)}
.hist{display:flex;flex-direction:column;gap:4px;font-size:1.1rem}
.hist div{display:flex;gap:14px;align-items:center}
.hist .runes{letter-spacing:.3em}
.hist .fb{font-size:.85rem;color:var(--muted);font-family:var(--label);letter-spacing:.05em}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{font-family:var(--label);font-size:.82rem;border:1px solid var(--line);padding:3px 8px;border-radius:2px;font-variant-numeric:tabular-nums}
.tally span.lead{border-color:var(--blood);color:var(--ink);background:var(--blood2)}

/* End */
.end h2{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,8vw,4rem);margin:.1em 0 0;line-height:1;text-wrap:balance}
.end.win h2{color:var(--gold)} .end.lose h2{color:var(--blood)}
.end p{font-size:1.1rem;max-width:58ch}
.statrow{display:flex;flex-wrap:wrap;gap:8px 26px;margin:10px 0}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-top:10px}
.foot{margin-top:14px;font-size:.78rem;color:var(--dim)}

.exit{border:1px dashed var(--line);padding:10px 14px;border-radius:3px;background:var(--bg);animation:up .5s ease both}
.exit small{display:block;font-family:var(--label);letter-spacing:.12em;font-size:.72rem;color:var(--dim)}
.exit p{margin:4px 0 0;font-style:italic}
.recap{border-block:1px solid var(--gold2);padding:10px 4px;animation:up .5s ease both}
.recap small{font-family:var(--display);color:var(--gold);font-size:1.1rem;letter-spacing:.04em}
.recap ul{margin:6px 0 0;padding-left:1.2em;color:var(--muted)}
.recap li{margin:2px 0}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.check input{width:18px;height:18px}
.ledger{display:none}
@media (max-width:920px){
  body{font-size:16px}
  #hud .in{gap:4px 14px;padding-block:6px}
  .brand{display:none}
  .role{font-size:.68rem;padding:3px 7px}
  .stat small{font-size:.62rem}
  .stat b{font-size:.92rem}
  .pace,.ledger{font-size:.68rem;padding:3px 6px}
  .ledger{display:inline-block;background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--label);letter-spacing:.08em;border-radius:2px;cursor:pointer}
  .grid{margin-top:10px;gap:14px}
  .head{padding:10px 14px 8px}
  #loc{font-size:1.35rem}
  #log{padding:12px 14px;max-height:52svh;min-height:180px}
  #panel{position:sticky;bottom:0;z-index:3;background:var(--panel);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:62svh;overflow-y:auto;box-shadow:0 -10px 24px rgba(0,0,0,.45)}
  .choices{grid-template-columns:minmax(0,1fr)}
  .choice{min-height:46px;padding:9px 12px}
  .people{grid-template-columns:repeat(2,minmax(0,1fr))}
  .person{min-height:46px}
  .line.narr p{margin-left:0}
  .av{width:32px;height:32px;font-size:.75rem}
  .bub{max-width:100%}
  .stone{font-size:1.8rem}
  .slot{width:52px;height:52px}
  .reveal strong{font-size:1.9rem}
  .hero h1{font-size:clamp(2.6rem,14vw,4rem)}
}
.power{position:relative;height:30px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:linear-gradient(90deg,var(--raise) 0 39%,var(--raise2) 39% 56.5%,var(--gold2) 56.5% 71.3%,var(--gold) 71.3% 84.3%,var(--blood2) 84.3%)}
.power .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(242,231,211,.55);border-right:3px solid var(--ink)}
.hold{touch-action:none;user-select:none;-webkit-user-select:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;width:100%;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;width:100%;margin:0 auto}
.cell{aspect-ratio:1;max-width:100%;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:1.6rem;color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:background .12s}
.cell:disabled{cursor:default}
.cell.gold{background:var(--gold);color:var(--paper-ink)}
.cell.bad{background:var(--blood2)}
.cell.lit{background:var(--gold);box-shadow:0 0 26px var(--gold);color:var(--paper-ink)}
.cell.face{background:var(--raise2)}
.cell .av{width:70%;height:70%;font-size:1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header id="hud" hidden><div class="in">
  <div class="brand">The Traitors</div>
  <div class="stat"><small>DAY</small><b id="hDay">-</b></div>
  <div class="stat"><small>PRIZE POT</small><b id="hPot">£0</b></div>
  <div class="stat"><small>IN THE CASTLE</small><b id="hAlive">16</b></div>
  <div class="stat"><small>SUSPICION ON YOU</small><b class="dots" id="hHeat"></b></div>
  <div class="items" id="hItems"></div>
  <span class="role F" id="hRole">FAITHFUL</span>
  <button class="pace" id="pace" type="button" title="Dialogue speed">PACE: NORMAL</button>
  <button class="pace" id="snd" type="button" title="Sound effects">SOUND: OFF</button>
  <button class="ledger" id="ledgerBtn" type="button">LEDGER ↓</button>
</div></header>

<div class="wrap">
  <div class="grid">
    <section id="stage" aria-label="Scene">
      <div class="head"><div id="loc">Ardross Castle</div><div id="sub">The Scottish Highlands</div></div>
      <div id="log" aria-live="polite"></div>
      <div id="panel"></div>
    </section>
    <aside id="side" aria-label="Castle ledger">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabBoard" aria-selected="true">The Castle</button>
        <button type="button" role="tab" id="tabJournal" aria-selected="false">Your Journal</button>
      </div>
      <div id="board"></div>
      <div id="journal" hidden></div>
    </aside>
  </div>
  <p class="foot">An unofficial fan game inspired by the BBC's The Traitors. Not affiliated with the BBC or the show's makers. All contestants are fictional.</p>
</div>

<script>
// ===================== utilities =====================
const $=s=>document.querySelector(s);
const R=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const argmax=(arr,f)=>{let b=null,bv=-Infinity;for(const x of arr){const v=f(x);if(v>bv){bv=v;b=x}}return b};
const money=n=>'£'+Math.round(n).toLocaleString('en-GB');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fill=(t,o)=>t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!==undefined?o[k]:m);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const END=Symbol('end');
const logEl=$('#log'),panel=$('#panel');

const PACES={SLOW:1.5,NORMAL:1,FAST:.45,INSTANT:0};
let pace='NORMAL';try{const v=localStorage.getItem('traitors_pace');if(v&&v in PACES)pace=v}catch(e){}
const paceBtn=$('#pace');
function showPace(){paceBtn.textContent='PACE: '+pace}
showPace();
$('#ledgerBtn').onclick=()=>$('#side').scrollIntoView({behavior:'smooth',block:'start'});
// ---- sound: synthesised in the browser, starts only after a click ----
let AC=null,soundOn=false;
try{soundOn=localStorage.getItem('traitors_sound')==='1'}catch(e){}
const sndBtn=$('#snd');
function showSnd(){sndBtn.textContent='SOUND: '+(soundOn?'ON':'OFF')}
showSnd();
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}
function setSound(on){soundOn=on;showSnd();try{localStorage.setItem('traitors_sound',on?'1':'0')}catch(e){}if(on)audio()}
sndBtn.onclick=()=>{setSound(!soundOn);if(soundOn)sfx('faithful')};
function tone(f,dur,{type='sine',vol=.15,at=0,attack=.01,cut=0,slide=0}={}){
  const a=audio();if(!a)return;const t=a.currentTime+at;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let node=o;if(cut){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);node=fl}
  node.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,{vol=.2,at=0,cut=800}={}){
  const a=audio();if(!a)return;const t=a.currentTime+at;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=b;f.type='lowpass';f.frequency.value=cut;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);
}
function sfx(n){
  if(!soundOn)return;
  try{
    if(n==='pipes'){
      tone(110,8,{type:'sawtooth',vol:.035,attack:.5,cut:900});tone(220,8,{type:'sawtooth',vol:.025,attack:.5,cut:1100});
      const tune=[[440,.3],[494,.3],[554,.6],[659,.3],[587,.3],[554,.3],[494,.3],[440,.6],[392,.3],[440,.3],[494,.9],[554,.3],[659,.3],[740,.3],[659,.6],[554,.3],[494,.3],[440,1.1]];
      let t=.5;tune.forEach(([f,d])=>{if(d>=.6)tone(784,.05,{type:'square',vol:.025,at:t-.05,cut:3000});tone(f,d*.95,{type:'square',vol:.03,at:t,attack:.02,cut:2400});t+=d});
    }else if(n==='heart'){tone(62,.18,{vol:.45,slide:40});tone(56,.2,{vol:.3,at:.2,slide:38})}
    else if(n==='gong'){tone(98,3.5,{vol:.22,attack:.005});tone(147,3,{vol:.1});tone(233,2.4,{vol:.05});noise(.3,{vol:.06,cut:3000})}
    else if(n==='traitor'){noise(.7,{vol:.22,cut:400});[55,65.4,82.4].forEach(f=>tone(f,2.2,{type:'sawtooth',vol:.08,cut:600}))}
    else if(n==='faithful'){[440,554,659].forEach((f,i)=>tone(f,1.6,{vol:.06,at:i*.08,attack:.03}))}
    else if(n==='murder'){tone(311,1.5,{type:'triangle',vol:.08});tone(440,1.5,{type:'triangle',vol:.07});tone(80,1.2,{vol:.3,slide:40})}
  }catch(e){}
}

let skipper=null;
function wait(ms){return new Promise(r=>{const t=setTimeout(()=>{skipper=null;r()},ms);skipper=()=>{clearTimeout(t);skipper=null;r()}})}

let P=[],sus=[],S={};
const you=()=>P[0];
const alive=()=>P.filter(p=>p.alive);
const aliveIds=()=>alive().map(p=>p.id);
const npcsAlive=()=>alive().filter(p=>!p.isYou);
const traitorsAlive=()=>alive().filter(p=>p.role==='T');
const isT=id=>P[id].role==='T';
const N=id=>P[id].name;
const pace_m=()=>PACES[pace];

function setup(o){
  const cast=shuffle(CAST.map(c=>({...c}))).slice(0,CAST_IN_GAME);
  P=[{id:0,name:o.name,init:o.init,age:o.age,job:o.job,isYou:true,per:0,voice:.7,role:'F',alive:true,fate:null,note:'',trust:.5,ally:false,known:null,hue:40,open:[]}];
  cast.forEach((c,k)=>P.push(Object.assign(c,{id:k+1,init:c.name[0],isYou:false,role:'F',alive:true,fate:null,note:'?',trust:rnd(.42,.58),ally:false,known:null,hue:(k*53+10)%360})));
  const n=P.length;
  sus=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?0:rnd(14,32)));
  S={day:0,pot:0,fate:o.fate,shield:null,shieldPublic:false,dagger:null,seerYou:null,npcSeer:null,deathList:null,deathListActive:false,deathListDone:false,pendingMurder:null,murderFailed:false,youThreat:0,journal:[],votes:[],recruits:0,traitorOut:false,traitorPlan:null,lastVictim:null,lastVictimDay:-1,schedule:makeSchedule(),wasRecruited:false,stats:{chats:0,clues:0,missions:0}};
}
function makeTraitor(id){
  P[id].role='T';
  P.forEach(q=>{if(q.role==='T'&&q.id!==id){sus[id][q.id]=0;sus[q.id][id]=0}});
  if(id===0)P.forEach(q=>{if(q.role==='T'&&q.id!==0)q.known='T'});
  else if(you().role==='T')P[id].known='T';
}
function heat(j){
  const xs=npcsAlive().filter(p=>p.id!==j&&!(isT(p.id)&&isT(j))).map(p=>sus[p.id][j]);
  return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0;
}
function bump(i,j,a){if(i===j||P[i].isYou)return;if(isT(i)&&isT(j))return;sus[i][j]=clamp(sus[i][j]+a,0,100)}
function avgTrust(){const n=npcsAlive();return n.length?n.reduce((a,p)=>a+p.trust,0)/n.length:.5}
function spread(j,a,{src=null,only=null}={}){
  (only||npcsAlive().map(p=>p.id)).forEach(i=>{
    if(i===j||!P[i].alive)return;
    let m=1;
    if(src===0)m=.5+P[i].trust;else if(src!=null&&src!==i)m=.6+P[src].voice*.6;
    bump(i,j,a*m*rnd(.7,1.3));
  });
}
function journal(text,kind='event',about=null){S.journal.push({day:S.day,text,kind,about});if(kind==='clue'||kind==='tell')S.stats.clues++;renderJournal()}

function drift(){
  const al=aliveIds();
  npcsAlive().forEach(p=>{const i=p.id;al.forEach(j=>{
    if(j===i||(isT(i)&&isT(j)))return;
    let d=rnd(-4,4);
    if(!isT(i)&&isT(j))d+=p.per*rnd(0,j===0?3.5:6);
    d+=.12*(heat(j)-sus[i][j]);
    d+=.05*(30-sus[i][j]);
    sus[i][j]=clamp(sus[i][j]+d,0,100);
  })});
}
function topSuspect(i,pool){
  const c=(pool||aliveIds()).filter(j=>j!==i);
  if(!c.length)return null;
  if(isT(i)){
    const mates=c.filter(j=>isT(j)&&heat(j)>62);
    if(mates.length&&Math.random()<.45)return mates[0];
    const fs=c.filter(j=>!isT(j));
    if(!fs.length)return R(c);
    return argmax(fs,j=>heat(j)*.7+sus[i][j]*.3+rnd(0,14)-(j===0&&P[i].ally?30:0));
  }
  return argmax(c,j=>sus[i][j]+rnd(0,10)-(j===0&&P[i].ally?25:0));
}
function voteTarget(i,pool){
  const c=pool.filter(j=>j!==i);
  if(!c.length)return null;
  if(isT(i)){
    if(S.traitorPlan!=null&&c.includes(S.traitorPlan)&&!isT(S.traitorPlan)&&Math.random()<.85)return S.traitorPlan;
    const mates=c.filter(j=>isT(j)&&heat(j)>60);
    if(mates.length&&Math.random()<.5)return mates[0];
    const fs=c.filter(j=>!isT(j));
    if(!fs.length)return R(c);
    return argmax(fs,j=>heat(j)+rnd(0,15));
  }
  return argmax(c,j=>sus[i][j]*.75+heat(j)*.25+rnd(0,12)-(j===0&&P[i].ally?25:0));
}
function tellFor(i,boost=0){
  if(P[i].isYou)return null;
  const t=isT(i);
  if(Math.random()>(t?.28+boost:.08))return null;
  const mates=traitorsAlive().filter(q=>q.id!==i&&!q.isYou);
  const others=npcsAlive().filter(q=>q.id!==i);
  const M=t&&mates.length?R(mates).name:(others.length?R(others).name:'the fire');
  return fill(R(TELLS),{X:N(i),M});
}
async function maybeTell(i,boost=0){const t=tellFor(i,boost);if(t){await say('narr',t);journal(t,'tell',i)}}
function pickSpeakers(n){
  const pool=npcsAlive().map(p=>p.id),out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((a,i)=>a+P[i].voice+.2,0);let r=Math.random()*tot,k=0;
    for(;k<pool.length;k++){r-=P[pool[k]].voice+.2;if(r<=0)break}
    out.push(pool.splice(Math.min(k,pool.length-1),1)[0]);
  }
  return out;
}
function murderScores(pool){
  const tr=traitorsAlive();
  return pool.map(j=>{
    let threat=j===0?clamp(S.youThreat,0,100):(tr.length?tr.reduce((a,t)=>a+sus[j][t.id],0)/tr.length:30);
    let s=threat*.6+(100-heat(j))*.35+rnd(0,25);
    if(j===0&&S.day<=1)s*=.6;
    if(S.shieldPublic&&S.shield===j)s-=200;
    return {j,s};
  }).sort((a,b)=>b.s-a.s);
}
function murderPool(){

  if(S.deathListActive&&S.deathList){const l=pool.filter(j=>S.deathList.includes(j));if(l.length)pool=l}

async function gameRunes(levels,title){
  panel.innerHTML='';
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Watch the stones...</span></div><div class="stones"></div>`);
  panel.appendChild(box);
  const stones=box.querySelector('.stones'),st=box.querySelector('.st');
  const btns=RUNES.map(r=>{const b=el('button','stone',r);b.type='button';b.disabled=true;stones.appendChild(b);return b});
  let done=0;
  for(const len of levels){
    const seq=Array.from({length:len},()=>Math.floor(Math.random()*6));
    st.textContent=`Round ${done+1} of ${levels.length} · watch ${len} runes`;
    await sleep(700);
    for(const k of seq){btns[k].classList.add('lit');await sleep(520);btns[k].classList.remove('lit');await sleep(170)}
    st.textContent='Your turn. Repeat the sequence.';
    btns.forEach(b=>b.disabled=false);
    const ok=await new Promise(r2=>{let pos=0;btns.forEach((b,k)=>b.onclick=()=>{b.classList.add('tap');setTimeout(()=>b.classList.remove('tap'),160);if(k!==seq[pos])r2(false);else if(++pos===seq.length)r2(true)})});
    btns.forEach(b=>{b.onclick=null;b.disabled=true});
    if(!ok){st.textContent='Wrong rune! The stones go dark.';box.classList.add('fail');await sleep(1200);break}
    done++;st.textContent='Correct!';await sleep(500);
  }
  panel.innerHTML='';
  await say('narr',`You completed ${done} of ${levels.length} sequences.`);
  return done/levels.length;
}
async function gameArchery(arrows,spd,title){
  panel.innerHTML='';
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Loose when the marker crosses the gold.</span></div><div class="range"><div class="mk"></div></div><div class="shots"></div>`);
  const btn=el('button','choice primary','Loose arrow');btn.type='button';
  box.appendChild(btn);panel.appendChild(box);btn.focus({preventScroll:true});
  const mk=box.querySelector('.mk'),shots=box.querySelector('.shots'),st=box.querySelector('.st');
  let pos=0,running=true,sp=spd,phase=Math.random()*6,last=performance.now();
  function frame(t){if(!running)return;phase+=(t-last)/1000*sp*2.3;last=t;pos=(Math.sin(phase)+1)/2;mk.style.left=(pos*100)+'%';requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  let total=0;
  for(let a=0;a<arrows;a++){
    st.textContent=`Arrow ${a+1} of ${arrows}`;
    await new Promise(r=>{btn.onclick=r});
    const d=Math.abs(pos-.5),pts=d<.035?10:d<.09?6:d<.16?3:d<.25?1:0;
    total+=pts;shots.appendChild(el('span','shot'+(pts>=6?' hi':''),pts===10?'GOLD 10':pts?pts:'MISS'));
    sp*=1.15;
  }
  running=false;btn.disabled=true;await sleep(700);panel.innerHTML='';
  await say('narr',`You scored ${total} out of ${arrows*10}.`);
  return total/(arrows*10);
}
async function gameQuiz(n,title){
  const qs=shuffle(QUIZ.slice()).slice(0,n);let c=0;
  for(let k=0;k<qs.length;k++){
    const q=qs[k];
    const opts=shuffle(q.a.map((t,i)=>({label:t,value:i===0})));
    const ok=await choose(opts,`${title} · Question ${k+1} of ${n}<span class="q">${q.q}</span>`);
    if(ok){c++;await say('narr',`Correct: ${q.a[0]}.`)}else await say('narr',`Wrong. It was ${q.a[0]}.`);
  }
  await say('narr',`You got ${c} out of ${n}.`);
  return c/n;
}
async function gameCrypt(tries,title){
  const code=Array.from({length:4},()=>Math.floor(Math.random()*6));
  panel.innerHTML='';
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Four runes. ${tries} attempts. Tap a slot to change its rune.</span></div><div class="slots"></div><div class="hist"></div>`);
  const btn=el('button','choice primary','Try the lock');btn.type='button';
  box.appendChild(btn);panel.appendChild(box);
  const guess=[0,1,2,3],slots=box.querySelector('.slots'),hist=box.querySelector('.hist'),st=box.querySelector('.st');
  guess.forEach((g,i)=>{const s=el('button','slot',RUNES[g]);s.type='button';s.setAttribute('aria-label','Slot '+(i+1));s.onclick=()=>{guess[i]=(guess[i]+1)%6;s.textContent=RUNES[guess[i]]};slots.appendChild(s)});
  let solved=false,t=0;
  for(;t<tries;t++){
    await new Promise(r=>{btn.onclick=r});
    let exact=0;const ca=[0,0,0,0,0,0],cb=[0,0,0,0,0,0];
    guess.forEach((g,i)=>{if(g===code[i])exact++;else{ca[code[i]]++;cb[g]++}});
    const near=ca.reduce((a,v,i)=>a+Math.min(v,cb[i]),0);
    hist.appendChild(el('div','',`<span class="runes">${guess.map(g=>RUNES[g]).join('')}</span><span class="fb">${exact} in place · ${near} elsewhere</span>`));
    st.textContent=`${tries-t-1} attempts left. “In place” = right rune, right slot.`;
    if(exact===4){solved=true;t++;break}
  }
  btn.disabled=true;await sleep(800);panel.innerHTML='';
  if(solved){await say('narr',`The lock clunks open after ${t} ${t===1?'try':'tries'}!`);return clamp(1.15-t*.1,.35,1)}
  await say('narr',`The lock holds. The answer was ${code.map(g=>RUNES[g]).join('')}.`);return .1;
}
async function gameCoffin(){
  await say('narr',"They lower you into a wooden coffin in a freshly dug grave. The lid slams. Darkness. A microphone crackles: every minute you last puts £1,500 in the pot.");
  let banked=0,minute=0;const per=1500;
  while(minute<10){
    const risk=minute===0?0:.05+minute*.06;
    const c=await choose([{label:`Stay in (+${money(per)})`,sub:minute?`Panic risk: ${Math.round(risk*100)}%`:'Nothing bad can happen yet',value:'stay'},{label:'Hit the panic button',sub:`Bank ${money(banked)}`,value:'out',disabled:minute===0,cls:'ghost'}],`Minute ${minute} · Banked so far: ${money(banked)}`);
    if(c==='out'){await say('narr',`You press the button. Daylight. You climb out with ${money(banked)} earned.`);break}
    if(Math.random()<risk){await say('narr',R(COFFIN_PANIC));banked=Math.round(banked/2/500)*500;await say('narr',`In the scramble, half the money is lost. ${money(banked)} saved.`);break}
    minute++;banked+=per;await say('narr',R(COFFIN_EVENTS));
    if(minute===10)await say('narr',"Ten minutes! The lid opens to a roar from the team. Legend.");
  }
  return clamp(banked/12000,0,1);
}

async function gameBridge(steps){
  await say('narr',"You step onto the bridge. It sways. Far below, the river roars and the net looks very small.");
  let made=0;
  for(let i=0;i<steps;i++){
    const safe=Math.random()<.5?'L':'R';
    const adv=R(npcsAlive()).id;
    let honest=isT(adv)?Math.random()<.35:Math.random()<.85;
    if(you().role==='T'&&isT(adv))honest=true;
    const says=honest?safe:(safe==='L'?'R':'L'),word=says==='L'?'left':'right';
    await say(adv,R([`Go ${word}! Definitely ${word}!`,`${word[0].toUpperCase()+word.slice(1)}! Trust me!`,`It's the ${word} one. I'm sure.`]));
    const c=await choose([{label:'Step left',value:'L'},{label:'Step right',value:'R'}],`Plank ${i+1} of ${steps} · ${N(adv)} says ${word}`);
    if(c===safe){
      made++;await say('narr',R(["Solid. You breathe out.","It holds! The team cheers.","It creaks... but it holds."]));
      if(c!==says){journal(`On the bridge, ${N(adv)} shouted the wrong way. You ignored them, luckily.`,'tell',adv);await say('narr',`So ${N(adv)} was wrong. Interesting.`)}
    }else{
      await say('narr',"The plank gives way! You drop, screaming, into the net.");
      if(c===says){journal(`On the bridge, ${N(adv)} sent you the wrong way.`,'tell',adv);await say('narr',`${N(adv)} told you ${word}. Mistake... or sabotage?`)}
      break;
    }
  }
  await say('narr',`You crossed ${made} of ${steps} planks.`);
  return made/steps;
}
async function gameCaber(throws,title){
  panel.innerHTML='';
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Hold the button to lift. Let go in the gold.</span></div><div class="power"><div class="fill"></div></div><div class="shots"></div>`);
  const btn=el('button','choice primary hold','Hold to lift, release to toss');btn.type='button';
  box.appendChild(btn);panel.appendChild(box);btn.focus({preventScroll:true});
  const fill=box.querySelector('.fill'),shots=box.querySelector('.shots'),st=box.querySelector('.st');
  let total=0;
  for(let t=0;t<throws;t++){
    st.textContent=`Throw ${t+1} of ${throws} · hold, then release in the gold`;
    fill.style.width='0';
    const v=await new Promise(res=>{
      let start=null,raf=0,cur=0,fin=false;
      const step=ts=>{cur=(ts-start)/1150;fill.style.width=Math.min(cur/1.15,1)*100+'%';if(cur>1.15)done(cur);else raf=requestAnimationFrame(step)};
      const done=x=>{if(fin)return;fin=true;cancelAnimationFrame(raf);btn.onpointerdown=btn.onpointerup=btn.onpointerleave=btn.onkeydown=btn.onkeyup=btn.onclick=null;res(x)};
      const down=e=>{e.preventDefault();if(start!=null)return;start=performance.now();raf=requestAnimationFrame(step)};
      const up=()=>{if(start!=null)done(cur)};
      btn.onpointerdown=down;btn.onpointerup=up;btn.onpointerleave=up;
      btn.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)down(e)};
      btn.onkeyup=e=>{if(e.key===' '||e.key==='Enter')up()};
      btn.onclick=()=>{if(start==null)done(Math.random()*1.1)};
    });
    const pts=v>1?0:v>=.82?10:v>=.65?6:v>=.45?3:1;
    total+=pts;
    shots.appendChild(el('span','shot'+(pts>=6?' hi':''),v>1?'TOPPLED':pts===10?'PERFECT 10':pts));
    await sleep(450);
  }
  btn.disabled=true;await sleep(500);panel.innerHTML='';
  await say('narr',`You scored ${total} out of ${throws*10}.${total>=24?' The crowd goes wild. A piper plays you off.':''}`);
  return total/(throws*10);
}
async function gameBarrels(levels,title){
  panel.innerHTML='';
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Watch for the gold...</span></div><div class="grid4"></div>`);
  panel.appendChild(box);
  const g=box.querySelector('.grid4'),st=box.querySelector('.st');
  const cells=Array.from({length:12},()=>{const b=el('button','cell','◎');b.type='button';b.disabled=true;g.appendChild(b);return b});
  let found=0,possible=0;
  for(let r=0;r<levels.length;r++){
    const k=levels[r];possible+=k;
    const gold=new Set(shuffle([...Array(12).keys()]).slice(0,k));
    cells.forEach(c=>{c.className='cell';c.disabled=true});
    st.textContent=`Cask ${r+1} of ${levels.length} · remember ${k} golden barrels`;
    await sleep(500);
    gold.forEach(i=>cells[i].classList.add('gold'));
    await sleep(900+k*220);
    cells.forEach(c=>c.classList.remove('gold'));
    st.textContent=`Find the ${k} golden barrels`;
    const got=await new Promise(res=>{
      let n=0;
      cells.forEach((c,i)=>{c.disabled=false;c.onclick=()=>{c.disabled=true;if(gold.has(i)){c.classList.add('gold');if(++n===k)res(n)}else{c.classList.add('bad');res(n)}}});
    });
    cells.forEach(c=>{c.onclick=null;c.disabled=true});
    found+=got;
    st.textContent=got===k?'All found!':`Wrong barrel. ${got} of ${k} found.`;
    gold.forEach(i=>cells[i].classList.add('gold'));
    await sleep(800);
  }
  panel.innerHTML='';
  await say('narr',`You found ${found} of ${possible} golden barrels.`);
  return found/possible;
}
async function gameSeance(total,title){
  panel.innerHTML='';
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Snuff each candle while it's lit.</span></div><div class="grid3"></div>`);
  panel.appendChild(box);
  const g=box.querySelector('.grid3'),st=box.querySelector('.st');
  const cells=Array.from({length:9},()=>{const b=el('button','cell','🕯');b.type='button';g.appendChild(b);return b});
  let hits=0,last=-1;
  for(let n=0;n<total;n++){
    let i;do{i=Math.floor(Math.random()*9)}while(i===last);last=i;
    const windowMs=Math.max(520,1050-n*45);
    st.textContent=`Flame ${n+1} of ${total} · ${hits} snuffed`;
    await sleep(250+Math.random()*450);
    cells[i].classList.add('lit');
    const hit=await new Promise(res=>{
      const t=setTimeout(()=>{cleanup();res(false)},windowMs);
      const cleanup=()=>cells.forEach(c=>c.onclick=null);
      cells.forEach((c,k)=>c.onclick=()=>{clearTimeout(t);cleanup();res(k===i)});
    });
    cells[i].classList.remove('lit');
    if(hit)hits++;else{cells[i].classList.add('bad');setTimeout(()=>cells[i].classList.remove('bad'),250)}
  }
  await sleep(400);panel.innerHTML='';
  await say('narr',`You snuffed ${hits} of ${total} candles.${hits<total/2?' Something in the dark laughs.':''}`);
  return hits/total;
}
async function gamePortraits(title){
  panel.innerHTML='';
  const faces=shuffle(P.slice(1)).slice(0,6);
  const deck=shuffle([...faces,...faces]);
  const turns=12;
  const box=el('div','mg',`<div class="mg-h"><b>${title}</b><span class="st">Find the pairs. ${turns} turns.</span></div><div class="grid4"></div>`);
  panel.appendChild(box);
  const g=box.querySelector('.grid4'),st=box.querySelector('.st');
  const cells=deck.map(()=>{const b=el('button','cell','?');b.type='button';g.appendChild(b);return b});
  let pairs=0,used=0;
  const show=i=>{cells[i].classList.add('face');cells[i].innerHTML=avatar(deck[i])};
  const hide=i=>{cells[i].classList.remove('face');cells[i].textContent='?'};
  while(used<turns&&pairs<6){
    const pick=()=>new Promise(res=>cells.forEach((c,i)=>{c.onclick=c.disabled?null:()=>{cells.forEach(x=>x.onclick=null);res(i)}}));
    const a=await pick();show(a);cells[a].disabled=true;
    const b=await pick();show(b);cells[b].disabled=true;
    used++;
    if(deck[a]===deck[b]){pairs++;cells[a].classList.add('gold');cells[b].classList.add('gold')}
    else{await sleep(750);hide(a);hide(b);cells[a].disabled=false;cells[b].disabled=false}
    st.textContent=`${pairs} of 6 pairs · ${turns-used} turns left`;
  }
  await sleep(600);panel.innerHTML='';
  await say('narr',`You matched ${pairs} of 6 pairs.`);
  return pairs/6;
}

async function night(){
  const first=S.day===0;
  S.traitorPlan=null;
  const tr=traitorsAlive();
  let recruitMode=null;
  if(!first){
    if(tr.length===0&&alive().length>5)recruitMode='claudia';
    else if(tr.length>0&&tr.length<3&&S.traitorOut&&alive().length>6&&S.recruits<2)recruitMode='traitors';
    else if(S.day===4&&S.recruits===0&&tr.length>0&&alive().length>6&&Math.random()<.5)recruitMode='traitors';
  }
  S.traitorOut=false;
  const quiet=!!S.noMurderTonight&&!recruitMode;S.noMurderTonight=false;
  const deathListNight=!first&&!recruitMode&&!quiet&&S.day===3&&!S.deathListDone;
  const tvt=!first&&!recruitMode&&!quiet&&!deathListNight&&!S.deathListActive&&!S.tvtDone&&S.day>=3&&traitorsAlive().length>=3&&Math.random()<.5;
  if(tvt)S.tvtDone=true;
  const mode={first,recruitMode,deathListNight,quiet,tvt};
  let victim=null;
  if(you().role==='T')victim=await turretYou(mode);
  else victim=await nightFaithful(mode);
  if(S.deathListActive){S.deathListActive=false;S.deathList=null}
  if(victim!=null){
    if(S.shield===victim){
      S.murderFailed=true;S.pendingMurder=null;
      if(victim===0){await say('narr',"A knock at your door at 3am. A letter slides under it, then slides back out again. You clutch your shield and grin in the dark. It worked.");journal('The Traitors tried to murder you. Your shield saved you.','event')}
    }else{
      S.pendingMurder=victim;
      if(victim===0)await murderedYou();
    }
  }
  S.shield=null;S.shieldPublic=false;S.dagger=null;
}
async function turretYou({first,recruitMode,deathListNight,quiet,tvt}){
  scene('The Turret',first?'Night one · The Traitors meet':`Night ${S.day} · The Traitors' conclave`);
  const mates=traitorsAlive().filter(p=>!p.isYou);
  await say('narr',R(TURRET_OPEN));
  if(first){
    await say('claudia',"Traitors. Welcome to the turret. Hoods down, please. Take a good look at each other.");
    for(const m of mates)await say(m.id,R(["No WAY. You?! Oh, this is going to be fun.","I knew it'd be me. I just knew.","Right. Game faces on. Nobody cries at breakfast.","Oh my God. Oh my God. Okay. Okay. I'm fine."]));
    await say('claudia',"You'll meet here each night. And each night you'll choose a Faithful to murder.");
    await say('claudia',"If one of you is banished, the rest of you carry on. And sometimes I may let you recruit.");
    await say('claudia',"Tonight, you'll commit your first murder. Choose carefully. Breakfast will be very revealing.");
  }else{
    await say('claudia',R(["Good evening, Traitors.","Traitors. Welcome back. Lovely cloaks.","Evening. Shall we get down to business?"]));
    if(!mates.length)await say('narr',"You're alone in the turret tonight. Just you, the candles and Claudia's raised eyebrow.");
    else{
      const m=R(mates);
      if(heat(0)>55)await say(m.id,`You're getting a lot of heat, ${N(0)}. Keep your head down tomorrow, yeah?`);
      else if(S.lastBanished!=null&&P[S.lastBanished].role==='T')await say(m.id,`${N(S.lastBanished)} is gone. We have to be smarter. Much smarter.`);
      else await say(m.id,R(["They haven't a clue. Not a clue.","Did you see their faces at the Round Table? Brilliant.","I nearly laughed when they banished that Faithful. Nearly."]));
    }
  }
  if(recruitMode){
    return await youRecruit(mates);
  }
  if(quiet){await say('claudia',"No murder tonight, Traitors. You've had your fun at dinner. Get some sleep.");return null}
  if(tvt){
    await say('claudia',"Tonight, Traitors, I have a twist. No Faithful will die tonight. Instead... one of you will.");

async function runVote(pool,voters){
  const ballots={};
  if(voters.includes(0)&&you().alive)ballots[0]=await pickPerson(`Write a name on your slate.${S.dagger===0?' Your Dagger makes this vote count twice.':''}`,pool.filter(j=>j!==0));
  voters.forEach(i=>{if(i!==0)ballots[i]=voteTarget(i,pool)});
  const tally={};pool.forEach(j=>tally[j]=0);
  const tb=el('div','tally');panel.innerHTML='';panel.appendChild(el('div','prompt','The slates'));panel.appendChild(tb);
  const render=()=>{const mx=Math.max(...Object.values(tally));tb.innerHTML=pool.filter(j=>tally[j]>0).sort((a,b)=>tally[b]-tally[a]).map(j=>`<span class="${tally[j]===mx?'lead':''}">${j===0?'You':N(j)} · ${tally[j]}</span>`).join('')||'<span>No votes yet</span>'};
  render();
  for(const i of shuffle(voters.slice())){
    const t=ballots[i];if(t==null)continue;
    const w=S.dagger===i?2:1;
    sfx('heart');
    if(i===0)await say(0,`I've written ${N(t)}.${w>1?' And I\'m using the Dagger.':''}`);
    else await say(i,(w>1?'I\'m using the Dagger. ':'')+fill(R(VOTE_LINES),{X:t===0?N(0):N(t)}));
    tally[t]+=w;render();
    if(t===0&&i!==0&&P[i].ally){P[i].ally=false;P[i].note='?';await say('narr',`${N(i)}. Your ally. Wrote your name.`);journal(`${N(i)} broke your alliance and voted for you.`,'event',i)}
    S.votes.push({day:S.day,voter:i,target:t});
  }
  return tally;
}
async function resolveBanish(pool,voters){
  let tally=await runVote(pool,voters);
  let mx=Math.max(...Object.values(tally));let top=pool.filter(j=>tally[j]===mx);
  const second=Object.values(tally).sort((a,b)=>b-a)[1]||0;
  if(top.length===1&&mx>=voters.length*.6)await say('claudia',R(CL_LANDSLIDE));
  else if(top.length===1&&mx-second<=1)await say('claudia',R(CL_CLOSE));
  if(top.length>1){
    await say('claudia',`We have a tie between ${top.map(j=>j===0?N(0):N(j)).join(' and ')}. Everyone else will now vote again, choosing only between them.`);
    const v2=voters.filter(v=>!top.includes(v));
    if(v2.length){tally=await runVote(top,v2);mx=Math.max(...Object.values(tally));top=top.filter(j=>tally[j]===mx)}
    if(top.length>1){await say('claudia',"Still a tie. Then fate decides. Please, each draw a stone from the bag.");const b=R(top);await say('narr',`${b===0?'You draw':N(b)+' draws'} the black stone.`);top=[b]}
  }
  panel.innerHTML='';
  return top[0];
}

// ===================== main loop =====================
async function main(){
  try{
    const o=await titleScreen();
    if(o.resume){
      P=o.resume.P;sus=o.resume.sus;S=o.resume.S;updateHUD();
      if(o.resume.phase==='finale'){await finale();return}
      await runFrom(o.resume.phase);return;
    }
    setup(o);updateHUD();
    await arrival();
    await selection();
    await night();
    S.day=1;
    await runFrom('breakfast');
  }catch(e){if(e!==END){console.error(e);block(`<p>Something went wrong: ${esc(e.message)}</p>`,'');const b=el('button','choice primary','Start again');b.onclick=()=>main();panel.innerHTML='';panel.appendChild(b)}}
}
async function runFrom(phase){
  const PH=['breakfast','mission','afternoon','dinner','rt','night'];
  let k=Math.max(0,PH.indexOf(phase));
  while(true){
    for(;k<PH.length;k++){
      const ph=PH[k];checkpoint(ph);
      if(ph==='breakfast'){await breakfast();if(alive().length<=4){checkpoint('finale');await finale();return}}
      else if(ph==='mission')await mission();
      else if(ph==='afternoon')await afternoon();
      else if(ph==='dinner'){await dinner();if(alive().length<=4){checkpoint('finale');await finale();return}}
      else if(ph==='rt'){await roundTable();if(alive().length<=5){S.day++;checkpoint('finale');await finale();return}}
      else{await night();S.day++}
    }
    k=0;
  }
}

  const n=argmax(npcsAlive().map(p=>p.id),j=>heat(j)+rnd(0,20));
  if(n!=null&&Math.random()<.6){
    S.pot-=cost;S.shield=n;S.shieldPublic=true;updateHUD();
    await say(n,"I'll have it. Sorry. I'm not getting murdered tonight.");spread(n,3);
    await say('narr',`${money(cost)} comes out of the pot. A few people mutter.`);
    journal(`${N(n)} paid ${money(cost)} from the pot for tonight's shield.`,'event',n);
  }else await say('narr',"Nobody takes it. The shield stays in the Armoury, gleaming.");
}
async function dinner(){
  if(S.day<2||npcsAlive().length<3)return;
  scene('The Banqueting Hall',`Day ${S.day} · Dinner`);
  await say('narr',R(DINNER_OPEN));
  const plain=!S.plainDone&&S.day>=5&&alive().length>=7&&traitorsAlive().length>0;
  if(plain&&you().role==='T'){
    block(`Murder in plain sight.<br>Tonight, at dinner, in front of everyone.<small>C.</small>`,'letter black');
    if(pace_m())await wait(1500*pace_m());
    await say('narr',"The envelope was waiting in your cloak pocket. Your mouth goes dry.");
  }
  const seats=await pickMany('Pick the two people you sit between',npcsAlive().map(p=>p.id),2,'Take your seat');
  for(const n of seats){
    const p=P[n];
    if(p.ally){
      const x=argmax(npcsAlive().filter(q=>q.id!==n).map(q=>q.id),j=>sus[j][0]);
      if(x!=null&&sus[x][0]>40){await say(n,fill(R(ALLY_REPORT),{X:N(x)}));journal(`At dinner, your ally ${p.name} warned you about ${N(x)}.`,'chat',x)}
      else await say(n,R(ALLY_SAFE));
    }else{
      const others=npcsAlive().filter(q=>q.id!==n);
      const a=others.length?R(others).id:null,b=a!=null?topSuspect(a):null;
      if(a!=null&&b!=null&&b!==n){await say(n,fill(R(RUMOUR),{A:N(a),B:b===0?'you':N(b)}));journal(`At dinner, ${p.name} said ${N(a)} suspects ${b===0?'YOU':N(b)}.`,'chat',b)}
      else await say(n,R(["This venison is incredible. Is it weird I'm enjoying myself?","I'm too nervous to eat. Pass the potatoes."]));
    }
    p.trust=clamp(p.trust+.05);bump(n,0,-3);
    await maybeTell(n,.05);
  }
  const across=shuffle(npcsAlive().filter(p=>!seats.includes(p.id)).map(p=>p.id));
  if(across.length>=2)await say('narr',fill(R(DINNER_ACROSS),{A:N(across[0]),B:N(across[1])}));
  if(plain)await plainSight();
  const fallen=P.filter(p=>!p.alive&&!p.isYou);
  const opts=[{label:'“To the Faithfuls! May we find every last Traitor.”',value:'f'}];
  if(fallen.length)opts.push({label:'“To absent friends.”',value:'a'});
  opts.push({label:'“To Claudia\'s fringe. The only thing here we can trust.”',value:'c'});
  if(you().role==='T')opts.push({label:'“To the Traitors... wherever they are.”',sub:'Bold. Very bold.',value:'t',cls:'tr'});
  opts.push({label:'Stay seated and sip your wine',value:'s',cls:'ghost'});
  const t=await choose(opts,'Someone taps a glass. Everyone looks at you for a toast.');
  if(t==='f'){await say(0,"To the Faithfuls! May we find every last Traitor.");npcsAlive().forEach(p=>p.trust=clamp(p.trust+.03));await say('narr',"Glasses clink. A few people look at each other over the rims.")}
  else if(t==='a'){await say(0,`To absent friends. ${fallen.slice(-3).map(p=>p.name).join(', ')}.`);spread(0,-3);await say('narr',"A respectful silence. Someone wipes away a tear.")}
  else if(t==='c'){await say(0,"To Claudia's fringe. The only thing in this castle we can trust.");if(Math.random()<.7){npcsAlive().forEach(p=>p.trust=clamp(p.trust+.04));await say('narr',"The table roars. Even the waiters laugh.")}else await say('narr',"Polite chuckles. Tough crowd.")}
  else if(t==='t'){await say(0,"To the Traitors... wherever they are.");if(Math.random()<.5){spread(0,-5);await say('narr',"A gasp, then laughter. Nobody thinks a real Traitor would dare.")}else{spread(0,8);await say(R(npcsAlive()).id,"That's a weird thing to toast. Just saying.")}}
  else await say('narr',"You sip your wine and watch the room over the rim of the glass.");
  if(alive().length>4)await cont('To the Round Table');
}
async function plainSight(){
  S.plainDone=true;S.noMurderTonight=true;
  const pool=murderPool().filter(j=>!(S.shieldPublic&&S.shield===j));
  if(!pool.length)return;
  let v,drop;
  if(you().role==='T'){
    v=await pickPerson('Who will you murder in plain sight?',pool);
    const meth=await choose(PLAIN_METHODS.map((m,i)=>({label:m.label,sub:`Risk of being seen: ${m.risk<.3?'low':m.risk<.4?'medium':'high'}`,value:i})),'How will you do it?');
    const mom=await choose(PLAIN_MOMENTS.map((m,i)=>({label:m.label,value:i})),'And when?');
    const risk=PLAIN_METHODS[meth].risk*PLAIN_MOMENTS[mom].m;
    await say('narr',fill(PLAIN_METHODS[meth].doit,{V:N(v)}));
    const w=shuffle(npcsAlive().filter(p=>!isT(p.id)&&p.id!==v)).find(p=>Math.random()<risk*p.per*.7);
    if(w){bump(w.id,0,40);await say('narr',`You look up. ${w.name} is staring straight at you. Then looks away, very slowly.`);journal(`${w.name} may have seen you commit the plain-sight murder.`,'chat',w.id)}
    else await say('narr',"Nobody saw a thing. Your heart is going like a drum.");
    drop=PLAIN_METHODS[meth].drop;
    journal(`You murdered ${N(v)} in plain sight at dinner.`,'event',v);
  }else{
    const npcT=traitorsAlive().filter(p=>!p.isYou);
    const murderer=R(npcT).id;
    v=murderScores(pool)[0].j;drop=R(PLAIN_METHODS).drop;
    const c=await choose([{label:'Watch the drinks',value:'d'},{label:'Watch everyone\'s hands',value:'h'},{label:'Just enjoy your dinner',value:'e',cls:'ghost'}],'Something feels off tonight. What do you keep an eye on?');
    if(c!=='e'){
      const real=Math.random()<(c==='h'?.7:.6);
      const fake=npcsAlive().filter(p=>p.id!==v&&p.id!==murderer);
      const x=real||!fake.length?murderer:R(fake).id;
      const vt=v===0?'your':N(v)+"'s";
      const t=fill(R(c==='d'?["{X} leans across to top up {V} glass.","{X} lingers by the wine bottles a little too long, right by {V} glass."]:["{X}'s hand brushes {V} jacket on the way past.","{X} slides something small under the table, towards {V} seat."]),{X:N(x),V:vt});
      await say('narr',t);journal(t,'clue',x);
    }
  }
  if(pace_m())await wait(1200*pace_m());
  if(S.shield===v){await say('narr',`${v===0?'You feel':N(v)+' feels'} something... then out comes a shield. The murder fails! The table erupts.`,'big');S.shield=null;return}
  sfx('murder');
  if(v===0){await say('narr',"You reach for your glass and freeze. MURDERED, etched into the bottom. In plain sight, in front of everyone.",'big');if(pace_m())await wait(1500*pace_m());await gameOver('poisoned')}
  await say('narr',`${N(v)} ${drop}`,'big');
  P[v].alive=false;P[v].fate='murdered';S.lastVictim=v;S.lastVictimDay=S.day;S.plainVictim=v;
  if(you().role!=='T')journal(`${N(v)} was murdered in plain sight at dinner.`,'event',v);
  updateHUD();
  await say(v,R(["Are you KIDDING me? At DINNER?","Right in front of all of you. And none of you saw it. Unbelievable.","Well. Enjoy the trifle."]));
  await exitInterview(v,'murdered');
  for(const r of shuffle(npcsAlive().map(p=>p.id)).slice(0,2))await say(r,R(["Who was sat next to them? WHO?","It happened right in front of us!","Nobody leave this table."]));
}
async function confrontation(){
  const ts=traitorsAlive().filter(p=>!p.isYou),fs=npcsAlive().filter(p=>p.role==='F');
  await say('narr',"Cloaks off. Champagne corks pop. And then the shouting starts.");
  if(!ts.length&&you().role==='F'){await say('narr',"The Faithfuls scream, hug and jump up and down on the lawn. Claudia joins in. Her fringe survives.");await cont('See the result');return}
  for(const t of ts.slice(0,2)){if(!fs.length)break;const f=R(fs);await say(f.id,fill(R(CONF_F),{T:t.name}));await say(t.id,R(CONF_T))}
  const myT=ts.find(t=>t.ally);
  if(you().role==='F'&&myT){
    await say(myT.id,`${N(0)}... I'm so sorry. You were my ally. My real one.`);
    const c=await choose([{label:'“How could you?”',value:1},{label:'“Fair play. You got me.”',value:2},{label:'Throw your champagne at them',value:3}],`${myT.name} was a Traitor all along.`);
    if(c===1){await say(0,"How could you? I trusted you. I DEFENDED you.");await say(myT.id,"I know. That's what made it so hard.")}
    else if(c===2){await say(0,"Fair play. You absolutely got me.");await say(myT.id,"Come here. Hug. Please.")}
    else{await say('narr',`You throw a glass of champagne over ${myT.name}. Claudia applauds.`);await say(myT.id,"...I deserved that.")}
  }else if(you().role==='T'&&fs.length){
    const f=argmax(fs,p=>p.trust);
    await say(f.id,`${N(0)}. You. YOU. You looked me in the eye every single day.`);
    const c=await choose([{label:'Apologise',value:1},{label:'“It\'s a game!”',value:2},{label:'Take a bow',value:3}],`${f.name} wants answers.`);
    if(c===1){await say(0,"I'm so sorry. Truly. You were the hardest one to lie to.");await say(f.id,"...Fine. Buy me a drink with my money.")}
    else if(c===2){await say(0,"It's a GAME! It says Traitors on the tin!");await say(f.id,"I'm going to need a minute.")}
    else{await say('narr',"You sweep into a deep, theatrical bow. Half the lawn boos. The other half cheers.")}
  }
  await cont('See the result');
}

renderBoard();renderJournal();
main();
