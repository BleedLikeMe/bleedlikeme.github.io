<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyond the Wardrobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d0e;--ink2:#5c4327;--ink3:#8a6c45;--parch:#f2e4c0;--parch2:#e6d09c;--edge:#a8834a;
  --gold:#c9a227;--gold2:#ffd76a;--red:#8b1e1e;--elf:#2f5f4f;--sea:#9fb4a8;--bg:#1a120b;--bg2:#2b1d12;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#140d07 radial-gradient(ellipse at 50% 0%,#3a2716 0%,#140d07 70%);color:var(--ink);
  font-family:'EB Garamond',Georgia,'Times New Roman',serif;font-size:17px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.sview{position:relative}
.sdpad{display:none}
.hidden{display:none!important}

/* header */
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(#2e1f12,#1b120a);
  border-bottom:2px solid #6b4c22;color:#e9d6a6;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:'Cinzel',serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em;color:var(--gold2);
  text-shadow:0 0 8px rgba(255,190,60,.35);white-space:nowrap}
.brand span{display:block;font-size:.62rem;letter-spacing:.3em;color:#b99a62;font-weight:500}
#stats{display:flex;gap:12px;flex:1;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font-size:.9rem;min-width:110px}
.stat .lbl{color:#c8ad78;font-variant:small-caps;letter-spacing:.05em}
.bar{width:70px;height:8px;background:#0e0905;border:1px solid #6b4c22;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.ringicon{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 6px var(--gold);transition:all .5s}
.date{font-style:italic;color:#cdb47f;font-size:.88rem;margin-left:auto;white-space:nowrap}
.hbtns button{background:#3b2815;border:1px solid #7a5a2c;color:#f0dca8;border-radius:6px;padding:4px 10px;font-size:1rem;margin-left:4px}
.hbtns button:hover{background:#4d351c}

/* layout */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;max-width:1440px;margin:0 auto;padding:14px}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(140,100,40,.18),transparent 55%);
  border:1px solid var(--edge);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,30,.25)}
#stage{padding:18px 26px 26px;min-height:70vh}
#side{display:flex;flex-direction:column;min-height:70vh;max-height:calc(100vh - 90px);position:sticky;top:76px}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
#tabs button{flex:1;background:transparent;border:0;border-right:1px solid rgba(168,131,74,.4);padding:8px 4px;
  font-family:'Cinzel',serif;font-size:.72rem;color:var(--ink2);letter-spacing:.04em}
#tabs button.on{background:rgba(201,162,39,.22);color:var(--ink);font-weight:700}
#panel{padding:12px 14px;overflow-y:auto;flex:1}

/* stage */
.chaphead{text-align:center;margin-bottom:6px}
.chaphead .cn{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.35em;color:var(--ink3)}
.chaphead h2{font-family:'Cinzel',serif;margin:2px 0 0;font-size:1.55rem;color:var(--ink);letter-spacing:.03em}
.chaphead .where{font-style:italic;color:var(--ink2);font-size:.95rem}
.rule{height:10px;margin:8px auto 12px;width:60%;background:radial-gradient(circle,var(--edge) 2px,transparent 3px) center/14px 10px repeat-x;opacity:.7}
.art{margin:0 auto 12px;max-width:760px;cursor:zoom-in;position:relative}
.art svg{width:100%;height:auto;display:block;border-radius:3px}
.art .hint{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--ink2);background:rgba(242,228,192,.85);padding:1px 6px;border-radius:3px}
.text{max-width:760px;margin:0 auto}
.text p{font-size:1.12rem;line-height:1.62;margin:0 0 .85em}
.text p.first::first-letter{font-family:'IM Fell English',serif;float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--red)}
.text .speech{color:#3b2a14}
.text em{color:#4a3518}
.choices{max-width:760px;margin:16px auto 0;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:rgba(255,250,235,.55);border:1px solid var(--edge);border-radius:4px;padding:10px 14px;
  font-size:1.05rem;color:var(--ink);transition:all .15s;position:relative}
.choice:hover{background:#fff8e2;transform:translateX(3px);box-shadow:0 2px 8px rgba(90,60,20,.25)}
.choice .tag{font-size:.75rem;color:var(--ink3);font-variant:small-caps;margin-left:6px}
.choice.ring{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,215,106,.35),rgba(255,250,235,.5));}
.choice.ring::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-radius:50%;margin-right:8px;vertical-align:-1px;box-shadow:0 0 5px var(--gold)}
.choice.talk::before{content:'❝ ';color:var(--elf)}
.choice.go{font-weight:600}
.choice.game{border-style:double;border-width:3px}
.choice[disabled]{opacity:.45;pointer-events:none}
.choice.disabled-choice{opacity:.55;font-style:italic}
.result{max-width:760px;margin:10px auto;border-left:3px solid var(--edge);padding:6px 14px;background:rgba(255,250,235,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:2px 8px;border-radius:10px;border:1px solid var(--edge);background:#fff5d8}
.chip.good{border-color:#4f7d3a;color:#2f5a1c;background:#eef6dc}
.chip.bad{border-color:#9c3b2b;color:#7a2416;background:#f8e2d8}
.chip.ring{border-color:var(--gold);background:#fff1b8;color:#6b4c00}
.btn{background:linear-gradient(#5b3f1f,#3c2912);color:#f6e4b4;border:1px solid #2a1a0a;border-radius:4px;padding:9px 18px;
  font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.btn:hover{background:linear-gradient(#6d4c26,#4a3317)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--edge);box-shadow:none}
.btn.gold{background:linear-gradient(#e9c45a,#b88d1c);color:#2b1d0e;border-color:#7a5a10}
.center{text-align:center}

/* song card */
.song{max-width:560px;margin:14px auto;padding:14px 22px;background:rgba(255,252,240,.6);border:1px solid var(--edge);
  border-radius:4px;font-family:'IM Fell English',serif;position:relative}
.song h3{font-family:'Cinzel',serif;font-size:1rem;margin:0 0 2px;text-align:center}
.song .by{text-align:center;font-style:italic;font-size:.85rem;color:var(--ink3);margin-bottom:8px}
.song .st{margin:0 0 10px}
.song .ln{display:block;font-size:1.05rem;line-height:1.45;transition:color .2s,background .2s;padding:0 4px;border-radius:3px}
.song .ln.lit{background:rgba(201,162,39,.3);color:#000}
.song .sing{display:block;margin:6px auto 0}

/* side panels */
.ptitle{font-family:'Cinzel',serif;font-size:.95rem;margin:4px 0 8px;color:var(--ink);letter-spacing:.04em}
.char{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--edge)}
.char .av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;color:#fff;font-size:1rem;border:2px solid rgba(0,0,0,.25)}
.char .nm{font-weight:600}
.char .ds{font-size:.85rem;color:var(--ink2);line-height:1.3}
.char .here{font-size:.7rem;color:var(--elf);font-variant:small-caps;margin-left:4px}
.abar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.abar i{position:absolute;top:0;bottom:0;border-radius:3px}
.item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--edge)}
.item .ic{font-size:1.5rem;width:34px;text-align:center}
.item .nm{font-weight:600}.item .ds{font-size:.85rem;color:var(--ink2)}
.songli,.mapli{display:block;width:100%;text-align:left;background:rgba(255,250,235,.5);border:1px solid var(--edge);
  margin-bottom:6px;padding:7px 10px;border-radius:3px;font-size:.95rem;color:var(--ink)}
.songli small{display:block;color:var(--ink3);font-style:italic}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid button{padding:4px;background:rgba(255,250,235,.5);border:1px solid var(--edge);border-radius:3px;font-size:.75rem;color:var(--ink)}
.mapgrid svg{width:100%;height:auto;display:block}
.mapgrid .lock{opacity:.35;pointer-events:none}
.log{font-size:.88rem;line-height:1.35;padding:5px 0;border-bottom:1px dotted rgba(168,131,74,.5)}
.log b{color:var(--ink3);font-weight:400;font-style:italic}
.meta{font-size:.82rem;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .mbox{max-width:1100px;width:100%;max-height:94vh;overflow:auto;position:relative;padding:18px}
#modal .mclose{position:absolute;right:8px;top:6px;background:none;border:0;font-size:1.8rem;color:var(--ink2);z-index:2}

/* toasts */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;align-items:center}
.toast{background:#2b1d0e;color:#f3e2b2;border:1px solid var(--gold);padding:6px 14px;border-radius:16px;font-size:.92rem;
  animation:tin .3s ease-out,tout .5s 2.6s forwards;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.bad{border-color:#c2543f}.toast.good{border-color:#7fae58}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* wraith world flash */
body.wraith #wrap{filter:grayscale(1) blur(1.5px) contrast(1.3) brightness(.7);transition:filter .3s}
#eye{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 9% 18% at 50% 45%,#000 30%,transparent 32%),radial-gradient(ellipse 22% 26% at 50% 45%,#ff7a12 0%,#c22a00 45%,rgba(120,10,0,.6) 60%,transparent 75%)}
body.wraith #eye{opacity:.55}

/* games */
.gwrap{max-width:820px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.ghead .gt{font-family:'Cinzel',serif;font-size:1.1rem}
.ghud{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.ghud b{font-family:'Cinzel',serif}
canvas.gc{width:100%;height:auto;display:block;background:#000;border:2px solid #4a3317;border-radius:4px;touch-action:none}
.gmsg{min-height:1.6em;font-style:italic;text-align:center;margin:8px 0;color:var(--ink2)}
.gbar{height:16px;background:rgba(0,0,0,.15);border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin:4px 0}
.gbar i{display:block;height:100%;transition:width .08s}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin:10px auto}
.dpad button{font-size:1.3rem;border-radius:6px;border:1px solid var(--edge);background:#fff5d8}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:12px;justify-content:center;margin:14px auto}
.pad{height:110px;border-radius:12px;border:3px solid rgba(0,0,0,.3);font-size:2.4rem;color:rgba(255,255,255,.9);transition:filter .1s,transform .1s}
.pad.lit{filter:brightness(1.8) drop-shadow(0 0 14px #fff);transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{padding:10px;border:1px solid var(--edge);background:rgba(255,250,235,.6);border-radius:4px;font-size:1rem}
.opts button:hover{background:#fff8e2}
.riddle{font-family:'IM Fell English',serif;font-size:1.2rem;line-height:1.5;text-align:center;padding:14px;background:rgba(255,252,240,.5);border:1px solid var(--edge);border-radius:4px;white-space:pre-line}
.inline-input{font-family:'IM Fell English',serif;font-size:1.3rem;padding:6px 12px;border:1px solid var(--edge);border-radius:4px;background:#fffaf0;width:220px;text-align:center}
.qkeys{display:flex;gap:10px;justify-content:center;margin:12px 0}
.qkeys button{width:64px;height:64px;font-size:1.8rem;border-radius:8px;border:2px solid var(--edge);background:#fff5d8}
.qkeys button.want{background:#ffe08a;border-color:#a57b00;box-shadow:0 0 12px #ffcc33}
.qprompt{font-size:3.2rem;text-align:center;font-family:'Cinzel',serif;margin:4px 0}
.tcell{cursor:pointer}

/* title */
.titlescr{text-align:center;padding:30px 10px}
.titlescr h1{font-family:'Cinzel',serif;font-size:2.8rem;margin:10px 0 0;letter-spacing:.06em;color:#3b2408}
.titlescr .sub{font-family:'IM Fell English',serif;font-style:italic;font-size:1.25rem;color:var(--ink2)}
.titlescr .verse{font-family:'IM Fell English',serif;font-size:1.1rem;line-height:1.6;margin:18px auto;max-width:480px;color:var(--ink2)}
.titlescr .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ending h2{font-family:'Cinzel',serif;text-align:center;font-size:1.8rem;margin:6px 0}
.etable{margin:10px auto;border-collapse:collapse;font-size:.95rem}
.etable td{padding:3px 10px;border-bottom:1px dotted var(--edge)}

/* the Ring makes you vanish: the world goes grey-gold and thin */
body.wraith #wrap{filter:grayscale(.8) sepia(.4) blur(1.2px) brightness(.82);transition:filter .3s}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);border:1px solid #6b4c00;vertical-align:-3px}
.greedicon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);transition:all .5s}
.choice.gold{border:1px solid #b88d1c;background:linear-gradient(90deg,rgba(233,196,90,.35),rgba(255,250,235,.5))}
.choice.gold::before{content:'◆ ';color:#a57b00}
.bid{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px dotted var(--edge)}
.bid .lot{flex:1}.bid .lot b{display:block}.bid .lot small{color:var(--ink2)}
.smaugline{font-family:'IM Fell English',serif;font-size:1.15rem;line-height:1.5;padding:12px 16px;background:rgba(60,10,0,.08);border-left:4px solid #8b1e1e;margin:8px 0}
@media (max-width:900px){
  #top{position:static;padding:8px 12px;gap:8px}
  .brand{flex:1}
  .hbtns{order:2}
  #stats{order:3;flex:0 0 100%;gap:8px 14px}
  .side-here{display:none}
  .sview{overflow:hidden;max-height:62vh;border-radius:4px}
  .sview canvas.gc{width:860px;max-width:none}
  .sdpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin:10px auto 0;user-select:none;-webkit-user-select:none}
  .sdpad button{font-size:1.4rem;border-radius:8px;border:1px solid var(--edge);background:#fff5d8;touch-action:none}
  .sdpad button.on{background:#ffe08a}
  #wrap{grid-template-columns:minmax(0,1fr);padding:8px}
  #stage,#side{min-width:0}
  #side{position:static;max-height:none;min-height:0}
  #stage{padding:14px 14px 20px;min-height:0}
  .date{margin-left:0}
  .stat{min-width:0}.bar{width:48px}
  .text p{font-size:1.05rem}
  .opts{grid-template-columns:1fr}
  .brand{font-size:1.05rem}
}

/* ═══ NARNIA: snow-light paper, midnight ink, the Lion's gold, a red robin ═══ */
:root{
  --ink:#1c2433;--ink2:#3e4c64;--ink3:#7686a0;--parch:#f2f5f8;--parch2:#dfe6ee;--edge:#9aa8bc;
  --gold:#c99a2a;--gold2:#ffe2a0;--red:#b0302a;--elf:#2f6a4f;--sea:#a9c2d0;--bg:#0e1626;--bg2:#1a2438;
}
body{background:#0b1220 radial-gradient(ellipse at 50% 0%,#2a3a58 0%,#0b1220 70%)}
#top{background:linear-gradient(#22304a,#0e1626);border-bottom:2px solid #c99a2a;color:#eef2f8}
.brand{color:#ffe2a0;text-shadow:0 0 10px rgba(255,220,140,.35)}
.brand span{color:#b8c8e0}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.7),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(80,110,160,.12),transparent 55%);
  border:1px solid var(--edge);box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 40px rgba(90,120,170,.15)}
#tabs button.on{background:rgba(201,154,42,.18);color:#6a4a0a}
.chaphead .cn{color:#9a7414}
.text p.first::first-letter{color:var(--gold)}
.text .rune{display:block;font-family:'IM Fell English',serif;font-style:italic;text-align:center;margin:6px auto;max-width:520px;padding:10px;border:1px solid #8a8a7a;background:linear-gradient(#e8e4da,#d8d2c4);color:#3a3426;letter-spacing:.04em}
.text .aslan{display:block;font-family:'IM Fell English',serif;font-size:1.15rem;color:#6a4a0a;padding:8px 14px;border-left:4px solid var(--gold);background:rgba(201,154,42,.1);margin:6px 0}
.pov{color:var(--red);font-style:italic}
.choice.tdelight{border:1px solid #c890b0;background:linear-gradient(90deg,rgba(220,150,190,.18),rgba(255,250,235,.5))}
.choice.tdelight::before{content:'◆ ';color:#c060a0}
.choice.lion{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,215,106,.3),rgba(255,250,235,.5));font-weight:600}
.choice.lion::before{content:'☀ ';color:#b07a00}
.chip.ring{border-color:#5a7aa0;background:#e0e8f4;color:#2a3a5a}
.toast{background:#1a2438;border-color:#c99a2a;color:#eef2f8}
.toast.ring{border-color:#8ab0e0}
.thaw{display:inline-block;width:70px;height:8px;border-radius:5px;background:linear-gradient(90deg,#dfe9f6,#9fc0e0);border:1px solid #4a5a74;position:relative;overflow:hidden}
.thaw i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6a9a4a,#c8e070)}
.noticeicon{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#bcd4f0 50%,#3a5a8a);border:1px solid #1a2a44;transition:all .5s}
/* the easy way: a sweet white frost creeps over the page */
body.wraith #wrap{filter:saturate(.3) brightness(1.15) contrast(.9);transition:filter .3s}
#scan{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(220,235,255,.75))}
body.wraith #scan{opacity:1}
/* falling snow; fades as the spell breaks */
#snow{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity 2s;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 120px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent),radial-gradient(2.5px 2.5px at 60px 220px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 260px,#fff,transparent);
  background-size:300px 300px;animation:snowfall 14s linear infinite;opacity:.6}
@keyframes snowfall{from{background-position:0 0}to{background-position:-120px 600px}}
@media (prefers-reduced-motion:reduce){#snow{animation:none}}
</style>
</head>
<body>
<div id="snow"></div>
<header id="top">
  <div class="brand">Beyond the Wardrobe<span>A TALE OF NARNIA</span></div>
  <div id="stats"></div>
  <div class="hbtns"><button id="btnSound" title="Sound effects">♪</button><button id="btnMenu" title="Menu">☰</button></div>
</header>
<main id="wrap">
  <section id="stage" class="parch"></section>
  <aside id="side" class="parch"><nav id="tabs"></nav><div id="panel"></div></aside>
</main>
<div id="modal" class="hidden"><div class="mbox parch"><button class="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="toasts"></div>
<div id="scan"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   BEYOND THE WARDROBE — an unofficial game after C. S. Lewis's The Lion, the
   Witch and the Wardrobe (1950). The novel is in copyright, so only short
   phrases are quoted; prose and verses here are new (the carol is
   traditional). Built on the burglar.html engine.
   Stats (engine keys): hum = Faith · health = Warmth · sus = the Witch's
   Notice · food = Provisions · cash = the Thaw (0–100).
   ═══════════════════════════════════════════════════════════════════════════ */

// ── UTILITIES ───────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffle(a, r){ r = r || Math.random; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const tx = t => typeof t === 'function' ? t(G) : (t || '');

// ── SOUND ───────────────────────────────────────────────────────────────────
const SND = (() => {
  let ctx = null, on = false, master = null, playing = [], lineTimers = [];
  try { on = localStorage.getItem('narniaSound') === '1'; } catch (e) {}
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = mf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .25, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05); playing.push(o);
  }
  function noise(t, dur, vol, freq){
    const c = ac(); if (!c) return;
    const b = c.createBuffer(1, Math.max(1, c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 3000;
    const g = c.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); playing.push(s);
  }
  function fx(kind){
    if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    switch (kind){
      case 'click': note(84, t, .06, 'square', .05); break;
      case 'good': note(72, t, .15, 'triangle', .2); note(76, t + .08, .15, 'triangle', .2); note(79, t + .16, .3, 'triangle', .2); break;
      case 'bad': note(52, t, .3, 'sawtooth', .12); note(47, t + .12, .4, 'sawtooth', .12); break;
      case 'ring': note(40, t, 1.4, 'sine', .3); note(47, t, 1.4, 'sine', .15); noise(t, 1.2, .08, 400); break;
      case 'hit': noise(t, .15, .3, 900); break;
      case 'boom': note(30, t, .6, 'sine', .5); noise(t, .4, .25, 200); break;
      case 'firework': noise(t, .5, .25, 1800); note(ri(80, 95), t, .2, 'sine', .08); break;
      case 'splash': noise(t, .35, .2, 1200); break;
      case 'shriek': { const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(500, t + .9);
        g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.05); break; }
      case 'step': noise(t, .05, .12, 500); break;
    }
  }
  function tone(m, dur, type, vol){ if (!on) return; const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  function toneAlways(m, dur, type, vol){ const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  // play a generated melody; onLine(i) fires as each line starts
  function sing(mel, onLine, onEnd){
    stop(); const c = ac(); if (!c) { if (onEnd) onEnd(); return; }
    const beat = 60 / mel.tempo; let t = c.currentTime + .15; const t0 = t;
    mel.lines.forEach((line, li) => {
      lineTimers.push(setTimeout(() => onLine && onLine(li), (t - t0) * 1000 + 150));
      line.forEach(([m, d]) => {
        note(m, t, d * beat * 1.6, mel.voice, .22); note(m + 12, t, d * beat * .8, 'sine', .05);
        if (mel.drum && d >= 1) noise(t, .05, .06, 4000);
        t += d * beat;
      });
      note(mel.root - 12, t - line.reduce((a, n) => a + n[1], 0) * beat, line.reduce((a, n) => a + n[1], 0) * beat, 'sine', mel.drone ? .08 : .03);
      t += beat * .5;
    });
    lineTimers.push(setTimeout(() => { if (onEnd) onEnd(); }, (t - t0) * 1000 + 300));
  }
  function stop(){ lineTimers.forEach(clearTimeout); lineTimers = []; playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = []; }
  return { fx, tone, toneAlways, sing, stop, ac,
    get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('narniaSound', v ? '1' : '0'); } catch (e) {} } };
})();


// ── STATE ───────────────────────────────────────────────────────────────────
const SAVE_KEY = 'narniaSave';
let G = null;
const UI = { tab:'map', game:null, inst:null, mapZoom:null };

function newGame(){
  return {
    version:1, beat:null, chapter:1, chTitle:'', date:'', map:'house', loc:'spareroom',
    stats:{hum:50, health:100, sus:0, food:2, cash:0},
    aff:{peter:20, susan:20, edmund:-10, professor:10, tumnus:0, beaver:0, mrsbeaver:0, aslan:0, witch:0},
    met:['peter', 'susan', 'edmund', 'professor'],
    party:['peter', 'susan', 'edmund'], gone:[],
    items:[], flags:{}, songs:[], maps:['house'], seen:{}, route:['house'],
    log:[], ringUses:0, games:{}, pending:null, checkpoint:null, ending:null, started:Date.now()
  };
}
function save(){ if (!G) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function tryLoad(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.version === 1 && BEATS[s.beat]) return s; } catch (e) {}
  return null;
}
function snapshot(){ const c = Object.assign({}, G); delete c.checkpoint; return JSON.parse(JSON.stringify(c)); }

const has = k => G.items.indexOf(k) >= 0;
const flag = k => !!G.flags[k];
const aff = k => G.aff[k] || 0;
const inParty = k => G.party.indexOf(k) >= 0;

// ── EFFECTS ─────────────────────────────────────────────────────────────────
const STAT_NAME = {hum:'Faith', health:'Warmth', sus:'The Witch\'s Notice', food:'Provisions', cash:'The Thaw'};
const STAT_MAX = {hum:100, health:100, sus:100, food:20, cash:100};
function applyFx(fx){
  const out = [];
  if (!fx) return out;
  ['hum','health','sus','food','cash'].forEach(k => {
    if (!fx[k]) return;
    const before = G.stats[k];
    G.stats[k] = clamp(before + fx[k], 0, STAT_MAX[k]);
    const d = G.stats[k] - before; if (!d) return;
    if (k === 'cash'){ out.push({t: d > 0 ? 'The thaw spreads… (spring ' + G.stats.cash + '%)' : 'The cold tightens', c: d > 0 ? 'good' : 'bad'}); return; }
    const good = k === 'sus' ? d < 0 : d > 0;
    out.push({t:`${STAT_NAME[k]} ${d > 0 ? '+' : ''}${d}`, c: k === 'sus' && d > 0 ? 'ring' : good ? 'good' : 'bad'});
  });
  if (fx.aff) Object.keys(fx.aff).forEach(k => {
    const v = fx.aff[k]; G.aff[k] = clamp((G.aff[k] || 0) + v, -100, 100);
    const nm = (CHARS[k] ? CHARS[k].n : k).replace(/^(The |Mr |Mrs )/, '').split(' ')[0];
    out.push({t:`${nm} ${v > 0 ? '♥+' + v : '♥' + v}`, c: v > 0 ? 'good' : 'bad'});
  });
  [].concat(fx.item || []).forEach(k => { if (!has(k)){ G.items.push(k); out.push({t:'Gained: ' + ITEMS[k].n, c:'good'}); } });
  [].concat(fx.lose || []).forEach(k => { const i = G.items.indexOf(k); if (i >= 0){ G.items.splice(i, 1); out.push({t:'Gone: ' + ITEMS[k].n, c:'bad'}); } });
  [].concat(fx.flag || []).forEach(k => { G.flags[k] = true; });
  if (fx.flags) Object.assign(G.flags, fx.flags);
  [].concat(fx.song || []).forEach(k => { if (learnSong(k)) out.push({t:'Song: ' + SONGS[k].title, c:'good'}); });
  [].concat(fx.map || []).forEach(k => { if (unlockMap(k)) out.push({t:'New map: ' + MAPS[k].title, c:'good'}); });
  [].concat(fx.meet || []).forEach(k => { if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.join || []).forEach(k => { if (G.party.indexOf(k) < 0) G.party.push(k); if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.leave || []).forEach(k => { const i = G.party.indexOf(k); if (i >= 0) G.party.splice(i, 1); });
  return out;
}
// The easy way: Turkish-Delight choices, sweet and cold. They cost Faith.
// In the stealth maps, standing like a statue costs Warmth instead.
function ringUse(cost){
  G.ringUses++;
  const out = UI.game ? applyFx({health: -Math.round(1.5 * (cost || 2))}) : applyFx({hum: -2 * (cost || 4)});
  wraithFlash();
  return out;
}
function wraithFlash(){
  SND.fx('ring');
  document.body.classList.add('wraith');
  setTimeout(() => { if (!UI.ringHeld) document.body.classList.remove('wraith'); }, 1200);
}
function learnSong(k){ if (!SONGS[k] || G.songs.indexOf(k) >= 0) return false; G.songs.push(k); return true; }
function unlockMap(k){ if (!MAPS[k] || G.maps.indexOf(k) >= 0) return false; G.maps.push(k); return true; }
function addLog(t){ G.log.unshift({d:G.date, t}); if (G.log.length > 150) G.log.length = 150; }
function markSeen(map, loc){ if (!G.seen[map]) G.seen[map] = []; if (G.seen[map].indexOf(loc) < 0) G.seen[map].push(loc); }

function toast(chips){
  const box = $('#toasts');
  chips.forEach((c, i) => setTimeout(() => {
    const d = document.createElement('div'); d.className = 'toast ' + (c.c || ''); d.textContent = c.t;
    box.appendChild(d); setTimeout(() => d.remove(), 3300);
  }, i * 220));
}

// ── BEAT ENGINE ─────────────────────────────────────────────────────────────
function failCheck(b, id){
  if (b.ending) return null;
  if (G.stats.health <= 0 && id !== 'frozen') return 'frozen';
  if (G.stats.sus >= 100 && id !== 'stone') return 'stone';
  return null;
}
function goBeat(id){
  const b = BEATS[id];
  if (!b){ console.error('Missing beat', id); return; }
  const re = G.beat === id;
  G.beat = id; G.pending = null;
  if (re){ save(); render(); return; }
  if (b.chapter){ G.chapter = b.chapter; G.chTitle = b.chTitle; G.checkpoint = null; G.checkpoint = snapshot(); }
  let chips = [];
  if (b.date) G.date = b.date;
  if (b.map){ G.map = b.map; unlockMap(b.map); }
  if (b.loc){ G.loc = b.loc; markSeen(G.map, b.loc); }
  if (b.w && G.route[G.route.length - 1] !== b.w) G.route.push(b.w);
  if (b.fx) chips = chips.concat(applyFx(typeof b.fx === 'function' ? b.fx(G) : b.fx));
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) learnSong(sg);
  if (b.travel){
    const need = b.travel;
    if (G.stats.food >= need) chips = chips.concat(applyFx({food:-need}));
    else { const short = need - G.stats.food; chips = chips.concat(applyFx({food:-G.stats.food, health:-6 * short, hum:-2 * short}));
      }
  }
  if (b.enter) b.enter(G);
  if (b.log) addLog(tx(b.log));
  const f = failCheck(b, id); if (f){ save(); return goBeat(f); }
  if (chips.length) toast(chips);
  save();
  render();
  window.scrollTo(0, 0);
}
function visibleChoices(b){ return (b.choices ? tx(b.choices) : []).filter(c => !c.if || c.if(G)); }
function choose(i){
  const b = BEATS[G.beat], c = visibleChoices(b)[i]; if (!c) return;
  SND.fx('click');
  let chips = applyFx(typeof c.fx === 'function' ? c.fx(G) : c.fx);
  if (c.dt) chips = chips.concat(ringUse(c.dt === true ? 3 : c.dt));
  if (c.act) c.act(G);
  let next = typeof c.go === 'function' ? c.go(G) : (c.go || G.beat);
  const f = failCheck(BEATS[next] || {}, next); if (f) next = f;
  const res = tx(c.res);
  if (res){ G.pending = {text:res, chips, next}; save(); render(); window.scrollTo(0, 0); }
  else { if (chips.length) toast(chips); goBeat(next); }
}
function continuePending(){ const n = G.pending.next; G.pending = null; goBeat(n); }

// ── RENDER ──────────────────────────────────────────────────────────────────
function paras(t, first){
  return String(t).split(/\n\s*\n/).map((p, i) => `<p class="${first && i === 0 ? 'first' : ''}">${p.trim()}</p>`).join('');
}
function chipHTML(chips){ return chips && chips.length ? `<div class="chips">${chips.map(c => `<span class="chip ${c.c || ''}">${esc(c.t)}</span>`).join('')}</div>` : ''; }
function locName(map, loc){
  const m = MAPS[map]; if (!m) return ''; const p = m.places.find(p => p.k === loc); return p ? p.n : '';
}
function headerHTML(b){
  return `<div class="chaphead"><div class="cn">CHAPTER ${romanize(G.chapter)}</div><h2>${esc(G.chTitle || '')}</h2>
    <div class="where">${esc(b.title || locName(G.map, G.loc))}${b.pov ? ` <span class="pov">· as ${esc(b.pov)}</span>` : ''}</div></div><div class="rule"></div>`;
}
function romanize(n){ const r = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]]; let s = ''; r.forEach(([k, v]) => { while (n >= v){ s += k; n -= v; } }); return s; }
function artHTML(b){
  if (b.art === 'none') return '';
  if (b.art && VIGNETTES[b.art]) return `<div class="art" data-vig="${b.art}">${VIGNETTES[b.art]()}</div>`;
  const map = b.map || G.map;
  return `<div class="art" data-map="${map}">${drawMap(map, {here:G.loc, small:true})}<span class="hint">click to enlarge</span></div>`;
}
function render(){
  renderStats(); renderSide();
  if (!G){ renderTitle(); return; }
  if (UI.game) return;
  const st = $('#stage'), b = BEATS[G.beat];
  if (b.ending){ st.innerHTML = renderEnding(b); wireStage(); return; }
  let h = headerHTML(b);
  if (G.pending){
    h += `<div class="text">${paras(G.pending.text, true)}</div>${G.pending.chips.length ? `<div class="result">${chipHTML(G.pending.chips)}</div>` : ''}
      <div class="choices"><button class="choice go" data-cont>Continue…</button></div>`;
    st.innerHTML = h; wireStage(); return;
  }
  h += artHTML(b);
  h += `<div class="text">${paras(tx(b.text), true)}</div>`;
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) h += songCard(sg);
  if (b.game){
    const gc = tx(b.game);
    h += `<div class="choices"><button class="choice game go" data-game>${esc(gc.label || 'Begin')}</button>
      <button class="choice" data-skip>Let the robin decide <span class="tag">skip the game · an average outcome</span></button></div>`;
  } else {
    const cs = visibleChoices(b);
    h += `<div class="choices">${cs.map((c, i) => {
      const cls = ['choice', c.dt ? 'tdelight' : '', c.talk ? 'talk' : '', c.cls || ''].join(' ');
      return `<button class="${cls}" data-c="${i}">${tx(c.t)}${c.tag ? `<span class="tag">${tx(c.tag)}</span>` : ''}${c.dt ? '<span class="tag">the easy way</span>' : ''}</button>`;
    }).join('')}</div>`;
  }
  st.innerHTML = h; wireStage();
}
function wireStage(){
  const st = $('#stage');
  st.querySelectorAll('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c));
  const cont = st.querySelector('[data-cont]'); if (cont) cont.onclick = continuePending;
  const gb = st.querySelector('[data-game]'); if (gb) gb.onclick = () => startGame(tx(BEATS[G.beat].game));
  const sk = st.querySelector('[data-skip]'); if (sk) sk.onclick = () => { const gc = tx(BEATS[G.beat].game); UI.game = gc; finishGame({win: Math.random() < .55, score: .5, msg:'It all happened, somehow, as things do in Narnia.', fx: gc.skipFx}); };
  const art = st.querySelector('.art'); if (art) art.onclick = () => art.dataset.map ? openMap(art.dataset.map) : null;
  st.querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(el.dataset.sing, el.closest('.song')));
  st.querySelectorAll('[data-checkpoint]').forEach(el => el.onclick = restoreCheckpoint);
  st.querySelectorAll('[data-new]').forEach(el => el.onclick = startNew);
  st.querySelectorAll('[data-load]').forEach(el => el.onclick = () => { G = tryLoad(); render(); });
}
function restoreCheckpoint(){
  if (!G.checkpoint) return;
  const cp = G.checkpoint; G = JSON.parse(JSON.stringify(cp)); G.checkpoint = cp; G.pending = null;
  UI.game = null; if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null;
  save(); closeModal(); render(); toast([{t:'Back through the wardrobe, to the start of the chapter.'}]);
}
function startNew(){ SND.stop(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = newGame(); closeModal(); goBeat('start'); }


function renderStats(){
  const el = $('#stats');
  const snow = document.getElementById('snow');
  if (!G){ el.innerHTML = ''; if (snow) snow.style.opacity = .6; return; }
  const s = G.stats;
  if (snow) snow.style.opacity = Math.max(0, .6 * (1 - s.cash / 70));
  const bar = (v, c) => `<span class="bar"><i style="width:${v}%;background:${c}"></i></span>`;
  const glow = 2 + s.sus / 4, gc = s.sus > 70 ? '#9fd0ff' : s.sus > 40 ? '#6a9ad0' : '#3a5a8a';
  el.innerHTML = `
    <span class="stat" title="Faith: trust in Aslan, and in each other. Taking the easy way costs it."><span class="lbl">faith</span>${bar(s.hum, 'linear-gradient(90deg,#9a7414,#ffe2a0)')}</span>
    <span class="stat" title="Warmth: at nothing, the cold has you"><span class="lbl">warmth</span>${bar(s.health, 'linear-gradient(90deg,#8a2a2a,#f0905a)')}</span>
    <span class="stat" title="The Witch's Notice: at 100, she has you turned to stone"><span class="noticeicon" style="box-shadow:0 0 ${glow}px ${gc}"></span><span class="lbl">notice</span> ${s.sus}</span>
    <span class="stat" title="Provisions: food for the journey. Travelling without it costs Warmth.">🍞 <span class="lbl">food</span> ${s.food}</span>
    <span class="stat" title="The Thaw: how far the Witch's winter has broken"><span class="lbl">thaw</span><span class="thaw"><i style="width:${s.cash}%"></i></span></span>
    <span class="date">${esc(G.date || '')}</span>`;
}
const TABS = [['map','Narnia'],['fellow','Friends'],['pack','Pockets'],['songs','Songs'],['maps','Maps'],['log','Journal']];
function renderSide(){
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${UI.tab === k ? 'on' : ''}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; renderSide(); });
  const p = $('#panel');
  if (!G){ p.innerHTML = `<div class="ptitle">Narnia</div>${drawMap('wild', {small:true})}<p class="meta">From the Lamp-post to Cair Paravel, under a hundred years of snow.</p>`; return; }
  let h = '';
  if (UI.tab === 'map'){
    h = `<div class="ptitle">Narnia</div><div class="art" data-map="wild">${drawMap('wild', {small:true, worldRoute:true})}</div>
      <p class="meta">${G.route.length} place${G.route.length === 1 ? '' : 's'} on your road. Click to enlarge.</p>
      <div class="side-here"><div class="ptitle">Here</div><div class="art" data-map="${G.map}">${drawMap(G.map, {here:G.loc, small:true})}</div></div>`;
  } else if (UI.tab === 'fellow'){
    h = `<div class="ptitle">Friends &amp; Foes</div>`;
    const order = Object.keys(CHARS).filter(k => G.met.indexOf(k) >= 0);
    order.sort((a, b) => (inParty(b) ? 1 : 0) - (inParty(a) ? 1 : 0));
    h += order.map(k => {
      const c = CHARS[k], a = G.aff[k], gone = G.gone.indexOf(k) >= 0;
      const ab = a === undefined ? '' : `<div class="abar"><i style="left:${a >= 0 ? 50 : 50 + a / 2}%;width:${Math.abs(a) / 2}%;background:${a >= 0 ? '#c99a2a' : '#5a7aa0'}"></i></div>`;
      return `<div class="char"><div class="av" style="background:${c.c};color:${k === 'witch' ? '#333' : '#fff'}">${c.n.replace(/^(The |Mr |Mrs |Giant )/, '')[0]}</div><div style="flex:1"><span class="nm">${esc(c.n)}</span>${inParty(k) ? '<span class="here">with you</span>' : ''}${gone ? '<span class="here" style="color:#5a7aa0">turned to stone</span>' : ''}<div class="ds">${esc(c.d)}</div>${ab}</div></div>`;
    }).join('');
  } else if (UI.tab === 'pack'){
    h = `<div class="ptitle">In Your Pockets</div>` + (G.items.length ? G.items.map(k => `<div class="item"><div class="ic">${ITEMS[k].ic}</div><div><div class="nm">${esc(ITEMS[k].n)}</div><div class="ds">${esc(ITEMS[k].d)}</div></div></div>`).join('') : '<p class="meta">Mothballs.</p>')
      + `<p class="meta">🍞 ${G.stats.food} provisions. You have taken the easy way ${G.ringUses} time${G.ringUses === 1 ? '' : 's'}.</p>`;
  } else if (UI.tab === 'songs'){
    h = `<div class="ptitle">Songs &amp; Sayings (${G.songs.length}/${Object.keys(SONGS).length})</div>`
      + (G.songs.length ? G.songs.map(k => `<button class="songli" data-song="${k}">${esc(SONGS[k].title)}<small>${esc(SONGS[k].by)}</small></button>`).join('') : '<p class="meta">Nobody sings in the Witch\'s winter.</p>');
  } else if (UI.tab === 'maps'){
    h = `<div class="ptitle">Maps (${G.maps.length}/${Object.keys(MAPS).length})</div><div class="mapgrid">`
      + Object.keys(MAPS).map(k => G.maps.indexOf(k) >= 0
        ? `<button data-map="${k}">${drawMap(k, {thumb:true})}${esc(MAPS[k].title)}</button>`
        : `<button class="lock">${'<svg viewBox="0 0 100 70"><rect width="100" height="70" fill="#dfe6ee"/><text x="50" y="42" text-anchor="middle" font-size="22" fill="#7686a0">?</text></svg>'}Not yet</button>`).join('') + `</div>`;
  } else if (UI.tab === 'log'){
    h = `<div class="ptitle">Lucy's Journal</div>` + (G.log.length ? G.log.map(l => `<div class="log"><b>${esc(l.d)}</b> — ${esc(l.t)}</div>`).join('') : '<p class="meta">Nothing written yet.</p>');
  }
  p.innerHTML = h;
  p.querySelectorAll('[data-map]').forEach(el => el.onclick = () => openMap(el.dataset.map));
  p.querySelectorAll('[data-song]').forEach(el => el.onclick = () => openSong(el.dataset.song));
}

function openModal(html){ $('#mbody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); SND.stop(); }
function openMap(k){
  const m = MAPS[k];
  openModal(`<div class="center" style="font-family:Cinzel,serif;font-size:1.2rem">${esc(m.title)}</div>
    <div class="center meta" style="margin-bottom:8px;font-style:italic">${esc(m.sub || '')}</div>
    ${drawMap(k, {here: G && k === G.map ? G.loc : null, worldRoute: k === 'wild', big:true})}
    ${m.notes ? `<p class="meta" style="margin-top:8px">${esc(m.notes)}</p>` : ''}`);
}
function openSong(k){
  openModal(songCard(k, true));
  $('#mbody').querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(k, el.closest('.song')));
}

// geometry + map drawing (shared with ringbearer.html)
function pointInPoly(x, y, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function smoothPath(pts, closed){
  const L = pts.length, f = n => n.toFixed(1);
  if (L < 3) return 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join('L') + (closed ? 'Z' : '');
  const at = i => closed ? pts[(i + L) % L] : pts[clamp(i, 0, L - 1)];
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  const n = closed ? L : L - 1;
  for (let i = 0; i < n; i++){
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${f(c1x)},${f(c1y)} ${f(c2x)},${f(c2y)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + (closed ? 'Z' : '');
}
function samplePolyline(pts, step){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / step));
    for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}
const INK = '#4a3216', INK2 = '#7a5a30', WATER = '#a8bdb0', WATER_INK = '#5f7f78';
const MAP_CACHE = {};
function mapBase(k, noPlaces){
  const ck = k + (noPlaces ? '|np' : '');
  if (MAP_CACHE[ck]) return MAP_CACHE[ck];
  const m = MAPS[k], r = seeded(hash(k)), W = m.w, H = m.h;
  const dun = !!m.dungeon;
  let s = '';
  // parchment
  s += `<rect width="${W}" height="${H}" fill="${dun ? '#d6dde8' : '#eef3f8'}"/>`;
  for (let i = 0; i < 9; i++){ const x = r() * W, y = r() * H, rr = 80 + r() * 220;
    s += `<circle cx="${x | 0}" cy="${y | 0}" r="${rr | 0}" fill="#5a7298" opacity="${(0.03 + r() * .05).toFixed(3)}"/>`; }
  if (dun){ // dwarf-hall grid
    for (let x = 20; x < W; x += 40) s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${INK2}" stroke-width=".4" opacity=".35"/>`;
    for (let y = 20; y < H; y += 40) s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${INK2}" stroke-width=".4" opacity=".35"/>`;
  }
  (m.zones || []).forEach(z => { s += `<path d="${smoothPath(z.p, true)}" fill="${z.c}" opacity=".55" stroke="${INK}" stroke-width="1.2"/>`; });
  (m.dark || []).forEach(p => { s += `<path d="${smoothPath(p, true)}" fill="#3a2a1a" opacity=".16"/>`; });
  (m.water || []).forEach(p => {
    s += `<path d="${smoothPath(p, true)}" fill="${WATER}" stroke="${WATER_INK}" stroke-width="1.6"/>`;
    s += `<path d="${smoothPath(p, true)}" fill="none" stroke="${WATER_INK}" stroke-width=".6" opacity=".5" transform="translate(4,4)"/>`;
  });
  (m.marsh || []).forEach(p => {
    const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
    for (let y = Math.min.apply(0, ys); y < Math.max.apply(0, ys); y += 12)
      for (let x = Math.min.apply(0, xs); x < Math.max.apply(0, xs); x += 16){
        const jx = x + r() * 8, jy = y + r() * 6; if (!pointInPoly(jx, jy, p)) continue;
        s += `<path d="M${(jx - 4).toFixed(1)},${jy.toFixed(1)}h8M${jx.toFixed(1)},${jy.toFixed(1)}v-5M${(jx - 2.5).toFixed(1)},${jy.toFixed(1)}l-1.5,-3.5M${(jx + 2.5).toFixed(1)},${jy.toFixed(1)}l1.5,-3.5" stroke="${INK2}" stroke-width=".8" fill="none"/>`;
      }
  });
  (m.rivers || []).forEach((p, i) => { s += `<path d="${smoothPath(p)}" fill="none" stroke="${WATER_INK}" stroke-width="${i === 1 && k === 'wild' ? 3.2 : 2.2}" stroke-linecap="round"/>`; });
  (m.roads || []).forEach(p => { s += `<path d="${smoothPath(p)}" fill="none" stroke="${dun ? INK : '#8a5a2a'}" stroke-width="${dun ? 9 : 1.6}" ${dun ? 'opacity=".25"' : 'stroke-dasharray="6 4"'} stroke-linecap="round"/>`;
    if (dun) s += `<path d="${smoothPath(p)}" fill="none" stroke="${INK}" stroke-width="1" opacity=".7" stroke-dasharray="2 3"/>`; });
  (m.forest || []).forEach(p => {
    const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
    s += `<path d="${smoothPath(p, true)}" fill="#6b7a3a" opacity=".12"/>`;
    for (let y = Math.min.apply(0, ys) + 6; y < Math.max.apply(0, ys); y += 13)
      for (let x = Math.min.apply(0, xs) + 4; x < Math.max.apply(0, xs); x += 13){
        const jx = x + (r() - .5) * 7, jy = y + (r() - .5) * 6; if (!pointInPoly(jx, jy, p)) continue;
        const rr = 3.6 + r() * 2;
        s += `<line x1="${jx.toFixed(1)}" y1="${jy.toFixed(1)}" x2="${jx.toFixed(1)}" y2="${(jy + rr + 3).toFixed(1)}" stroke="${INK}" stroke-width=".8"/>`
          + `<circle cx="${jx.toFixed(1)}" cy="${jy.toFixed(1)}" r="${rr.toFixed(1)}" fill="#8d9a55" stroke="${INK}" stroke-width=".8"/>`;
      }
  });
  (m.hills || []).forEach(h => { s += `<path d="M${h[0] - 11},${h[1]} Q${h[0] - 2},${h[1] - 13} ${h[0] + 11},${h[1]} Z" fill="#e0cb94" stroke="${INK}" stroke-width="1"/><path d="M${h[0] + 1},${h[1] - 6} l3,5 M${h[0] + 4},${h[1] - 4} l2.5,4" stroke="${INK}" stroke-width=".6"/>`; });
  (m.mts || []).forEach(line => {
    samplePolyline(line, 17).forEach(([x, y]) => {
      const w = 9 + r() * 6, h = 13 + r() * 12; x += (r() - .5) * 6; y += (r() - .5) * 6;
      s += `<path d="M${(x - w).toFixed(1)},${y.toFixed(1)} L${x.toFixed(1)},${(y - h).toFixed(1)} L${(x + w).toFixed(1)},${y.toFixed(1)}" fill="#e6d3a2" stroke="${INK}" stroke-width="1.1" stroke-linejoin="round"/>`
        + `<path d="M${x.toFixed(1)},${(y - h).toFixed(1)} L${(x + w * .35).toFixed(1)},${y.toFixed(1)} M${(x + 2).toFixed(1)},${(y - h * .6).toFixed(1)} l3,4 M${(x + 3).toFixed(1)},${(y - h * .3).toFixed(1)} l3,3" stroke="${INK}" stroke-width=".6" fill="none"/>`;
    });
  });
  (m.labels || []).forEach(([t, x, y, sz, rot]) => {
    const caps = t === t.toUpperCase();
    s += `<text x="${x}" y="${y}" font-family="'IM Fell English',Georgia,serif" font-style="${caps ? 'normal' : 'italic'}" font-size="${sz}" fill="${INK2}" text-anchor="middle" letter-spacing="${caps ? sz * .35 : 0}" opacity=".85" transform="rotate(${rot || 0} ${x} ${y})">${esc(t)}</text>`;
  });
  // places
  (noPlaces ? [] : m.places).forEach(p => {
    const x = p.x, y = p.y;
    switch (p.t){
      case 'city': s += `<circle cx="${x}" cy="${y}" r="6" fill="#f6f8fb" stroke="${INK}" stroke-width="1.4"/><circle cx="${x}" cy="${y}" r="2.5" fill="${INK}"/>`; break;
      case 'tower': s += `<path d="M${x - 4},${y + 5} v-9 h-1.5 v-3 h3 v1.5 h1.5 v-1.5 h2 v1.5 h1.5 v-1.5 h3 v3 h-1.5 v9 z" fill="${INK}"/>`; break;
      case 'peak': s += `<path d="M${x - 11},${y + 4} L${x},${y - 14} L${x + 11},${y + 4}z" fill="#d9c08a" stroke="${INK}" stroke-width="1.5"/><path d="M${x - 4},${y - 7} L${x},${y - 14} L${x + 4},${y - 7} l-2,2 -2,-2 -2,2z" fill="#fff"/>`; break;
      case 'hill': s += `<path d="M${x - 8},${y + 3} Q${x},${y - 10} ${x + 8},${y + 3}" fill="#e2cf9a" stroke="${INK}" stroke-width="1.3"/><circle cx="${x}" cy="${y - 1}" r="1.8" fill="${INK}"/>`; break;
      case 'inn': s += `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" fill="#f6f8fb" stroke="${INK}" stroke-width="1.3"/><path d="M${x - 5},${y - 4} L${x},${y - 9} L${x + 5},${y - 4}" fill="${INK}"/>`; break;
      case 'tree': s += `<circle cx="${x}" cy="${y - 5}" r="8" fill="#5c6b2e" stroke="${INK}" stroke-width="1.2"/><path d="M${x},${y + 4} v-6 M${x},${y} l-5,4 M${x},${y} l5,4" stroke="${INK}" stroke-width="1.6"/>`; break;
      case 'ruin': s += `<path d="M${x - 4},${y - 4} l8,8 M${x + 4},${y - 4} l-8,8" stroke="${INK}" stroke-width="1.6"/>`; break;
      default: s += `<circle cx="${x}" cy="${y}" r="3.5" fill="${INK}"/>`;
    }
    const a = p.a || 'r';
    const tx = a === 'r' ? x + 9 : a === 'l' ? x - 9 : x, ty = a === 'b' ? y + 18 : a === 't' ? y - 14 : y + 4;
    s += `<text x="${tx}" y="${ty}" font-family="'IM Fell English',Georgia,serif" font-size="13" fill="${INK}" text-anchor="${a === 'r' ? 'start' : a === 'l' ? 'end' : 'middle'}" paint-order="stroke" stroke="#eef3f8" stroke-width="3" stroke-opacity=".7">${esc(p.n)}</text>`;
  });
  // compass rose
  const cx = W - 60, cy = H - 64;
  s += `<g transform="translate(${cx},${cy})" opacity=".85"><circle r="26" fill="none" stroke="${INK}" stroke-width=".8"/><circle r="20" fill="none" stroke="${INK}" stroke-width=".5"/>
    <path d="M0,-34 L5,0 L0,34 L-5,0z" fill="${INK}"/><path d="M-34,0 L0,5 L34,0 L0,-5z" fill="${INK2}"/>
    <path d="M0,-34 L5,0 L0,0z" fill="#eef3f8"/><text y="-38" text-anchor="middle" font-family="Cinzel,serif" font-size="11" fill="${INK}">N</text></g>`;
  // cartouche
  const tw = Math.max(180, m.title.length * 13 + 30);
  s += `<g transform="translate(24,22)"><rect width="${tw}" height="38" fill="#f6f8fb" stroke="${INK}" stroke-width="1.2"/><rect x="3" y="3" width="${tw - 6}" height="32" fill="none" stroke="${INK}" stroke-width=".6"/>
    <text x="${tw / 2}" y="25" text-anchor="middle" font-family="Cinzel,serif" font-size="17" fill="${INK}">${esc(m.title)}</text></g>`;
  // frame
  s += `<rect x="4" y="4" width="${W - 8}" height="${H - 8}" fill="none" stroke="${INK}" stroke-width="2.4"/><rect x="10" y="10" width="${W - 20}" height="${H - 20}" fill="none" stroke="${INK}" stroke-width=".8"/>`;
  return (MAP_CACHE[ck] = s);
}
function drawMap(k, o){
  o = o || {};
  const m = MAPS[k]; if (!m) return '';
  let s = mapBase(k, o.noPlaces);
  if (!o.thumb && G){
    const P = key => m.places.find(p => p.k === key);
    if (k === 'wild' && o.worldRoute !== false){
      const pts = G.route.map(P).filter(Boolean).map(p => [p.x, p.y]);
      if (pts.length > 1) s += `<path d="${smoothPath(pts)}" fill="none" stroke="#a31f1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
      pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#a31f1f"/>`; });
      const last = pts[pts.length - 1];
      if (last) s += hereMarker(last[0], last[1]);
    } else if (m.route){
      const seen = G.seen[k] || [];
      let far = -1; m.route.forEach((key, i) => { if (seen.indexOf(key) >= 0) far = i; });
      const pts = m.route.slice(0, far + 1).map(P).filter(Boolean).map(p => [p.x, p.y]);
      if (pts.length > 1) s += `<path d="${smoothPath(pts)}" fill="none" stroke="#a31f1f" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round" opacity=".85"/>`;
      if (o.here){ const h = P(o.here); if (h) s += hereMarker(h.x, h.y); }
    }
  }
  return `<svg viewBox="0 0 ${m.w} ${m.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(m.title)}">${s}</svg>`;
}
function hereMarker(x, y){
  return `<g><circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#a31f1f" stroke-width="2.5"><animate attributeName="r" values="8;18;8" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="${x}" cy="${y}" r="4.5" fill="#a31f1f" stroke="#fff3d0" stroke-width="1.5"/></g>`;
}

function songMelody(k){
  const s = SONGS[k];
  if (s._mel) return s._mel;
  const SC = {major:[0,2,4,5,7,9,11], mixo:[0,2,4,5,7,9,10], dorian:[0,2,3,5,7,9,10], aeolian:[0,2,3,5,7,8,10]}[s.mode];
  const r = seeded(hash(k)), root = s.mode === 'major' || s.mode === 'mixo' ? 62 : 60;
  const deg2m = d => root + 12 * Math.floor(d / 7) + SC[((d % 7) + 7) % 7];
  const lines = [];
  // one musical phrase per text line; phrases A/B repeat across stanzas
  const phrase = (len, end, seedR) => {
    const out = []; let d = Math.floor(seedR() * 5);
    for (let i = 0; i < len; i++){
      const last = i === len - 1;
      if (last) d = end;
      else { const st = seedR(); d += st < .35 ? 1 : st < .7 ? -1 : st < .85 ? 2 : -2; d = clamp(d, -2, 9); }
      const dur = last ? 2 : (seedR() < .25 && i < len - 2 ? .5 : 1);
      out.push([deg2m(d), dur]);
      if (dur === .5) out.push([deg2m(d + (seedR() < .5 ? 1 : -1)), .5]);
    }
    return out;
  };
  const phrases = [0, 1, 2, 3].map(i => phrase(7 + (i % 2), i === 3 ? 0 : i === 1 ? 4 : 2, seeded(hash(k + i))));
  s.v.forEach(st => st.forEach((ln, i) => lines.push(phrases[(i + (st.length === 2 ? i : 0)) % 4])));
  return (s._mel = {lines, tempo:s.tempo, voice: s.drum ? 'square' : 'triangle', root, drone:!!s.drone, drum:!!s.drum});
}
function songCard(k, full){
  const s = SONGS[k];
  let li = 0;
  const st = s.v.map(stz => `<div class="st">${stz.map(l => `<span class="ln" data-l="${li++}">${esc(l)}</span>`).join('')}</div>`).join('');
  return `<div class="song"><h3>${esc(s.title)}</h3><div class="by">${esc(s.by)}</div>${st}${s.read ? '' : `<button class="btn gold sing" data-sing="${k}">♪ Sing it</button>`}</div>`;
}
function singSong(k, card){
  const mel = songMelody(k), lines = card ? card.querySelectorAll('.ln') : [];
  const btn = card && card.querySelector('.sing');
  if (btn){ if (btn.dataset.on){ SND.stop(); lines.forEach(l => l.classList.remove('lit')); btn.textContent = '♪ Sing it'; delete btn.dataset.on; return; }
    btn.dataset.on = 1; btn.textContent = '■ Stop'; }
  SND.sing(mel, i => { lines.forEach(l => l.classList.remove('lit')); if (lines[i]) lines[i].classList.add('lit'); },
    () => { lines.forEach(l => l.classList.remove('lit')); if (btn){ btn.textContent = '♪ Sing it'; delete btn.dataset.on; } });
}

// ── The Witch: Turkish Delight ──────────────────────────────────────────────

  });
  return {stop, key(e){ const d = KEYMAP[e.key]; if (d === 'up'){ e.preventDefault(); move(-1); } else if (d === 'down'){ e.preventDefault(); move(1); } }};
};

// ── Breathe: find the statues for Aslan ─────────────────────────────────────
GAMES.breathe = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'The Statues', '', 'The castle is dark. Move your light (mouse or finger) through the halls and click or tap each statue you find, and Aslan will breathe on it. Find as many as you can before the battle.');
  const {c, x} = mkCanvas(ui.body, 760, 420);
  const KINDS = ['faun','dwarf','centaur','giant','dryad','squirrel','bear','horse'];
  const st = Array.from({length:16}, () => ({x:rnd(40, 720), y:rnd(60, 390), k:pick(KINDS), freed:0}));
  let mx = 380, my = 210, t = 0, found = 0, over = false; const DUR = 30;
  c.addEventListener('pointermove', e => { const [a, b] = canvasPos(c, e); mx = a; my = b; });
  c.addEventListener('pointerdown', e => { const [a, b] = canvasPos(c, e); mx = a; my = b;
    let best = null, bd = 40; st.forEach(s => { if (s.freed) return; const d = Math.hypot(s.x - a, s.y - b); if (d < bd && Math.hypot(s.x - mx, s.y - my) < 110){ bd = d; best = s; } });
    if (best){ best.freed = .01; found++; SND.fx('good'); ui.msg.textContent = pick(['A streak of gold runs over the stone…','The statue shivers, and stretches, and laughs.','"Aslan! Aslan!" it shouts, coming alive.','Stone-dust falls like snow, and something warm stands up.']); } });
  const stop = ticker(dt => {
    if (over) return;
    t += dt; st.forEach(s => { if (s.freed && s.freed < 1) s.freed = Math.min(1, s.freed + dt * 1.5); });
    x.fillStyle = '#2a3040'; x.fillRect(0, 0, 760, 420); x.strokeStyle = '#3a4258'; x.lineWidth = 2;
    for (let i = 0; i < 8; i++){ x.strokeRect(i * 100 - 20, 30, 80, 380); }
    st.forEach(s => { const col = s.freed ? `rgb(${Math.round(150 + 80 * s.freed)},${Math.round(150 + 40 * s.freed)},${Math.round(160 - 80 * s.freed)})` : '#9aa0a8';
      x.fillStyle = col; const h = s.k === 'giant' ? 46 : s.k === 'squirrel' ? 14 : 30;
      x.beginPath(); x.arc(s.x, s.y - h, h * .3, 0, 7); x.fill(); x.fillRect(s.x - h * .25, s.y - h * .75, h * .5, h * .75);
      if (s.freed >= 1){ x.fillStyle = '#ffe2a0'; x.font = '12px serif'; x.textAlign = 'center'; x.fillText('✶', s.x, s.y - h - 10); } });
    const g = x.createRadialGradient(mx, my, 20, mx, my, 120); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.92)');
    x.fillStyle = g; x.fillRect(0, 0, 760, 420);
    st.forEach(s => { if (s.freed >= 1){ x.fillStyle = 'rgba(255,226,160,.25)'; x.beginPath(); x.arc(s.x, s.y - 20, 30, 0, 7); x.fill(); } });
    x.fillStyle = 'rgba(255,226,160,.1)'; x.beginPath(); x.arc(mx, my, 110, 0, 7); x.fill();
    ui.hud.innerHTML = `<span>Freed <b>${found}/16</b></span><span>Time <b>${Math.max(0, Math.ceil(DUR - t))}</b></span>`;
    if (found >= 16 || t >= DUR){ over = true; done({win:found >= 11, score:found / 16, msg:`${found} statues found and breathed upon.`}); }
  });
  return {stop};
};

// ── The Cordial ─────────────────────────────────────────────────────────────
GAMES.cordial = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Lucy\'s Cordial', '', 'Each wounded creature\'s strength is ebbing. Click or tap a name to give one drop; some need two. You have only so many drops — but Aslan says the cordial will last, if you are quick and do not waste it. Edmund first.');
  const W = [{n:'Edmund', need:2, life:9},{n:'A Dwarf', need:1, life:12},{n:'A Centaur', need:2, life:15},{n:'A Leopard', need:1, life:11},{n:'A Faun', need:1, life:17},{n:'A Dryad', need:1, life:14},{n:'A Bear', need:2, life:19},{n:'A Badger', need:1, life:16},{n:'A Satyr', need:1, life:20}].map(w => Object.assign({given:0, saved:false, lost:false, max:w.life}, w));
  let drops = 13, over = false, t = 0;
  function render(){
    ui.body.innerHTML = `<div class="art" style="cursor:default">${VIGNETTES.battle()}</div><div class="center meta" style="margin:6px 0">🧪 Drops left: <b>${drops}</b></div>
      <div class="opts">${W.map((w, i) => `<button data-w="${i}" ${w.saved || w.lost ? 'disabled' : ''} style="${w.saved ? 'background:#e8f4d8' : w.lost ? 'opacity:.4' : ''}"><b>${esc(w.n)}</b>${w.saved ? ' — healed' : w.lost ? ' — too late' : ` · needs ${w.need - w.given} · <span style="color:${w.life / w.max < .35 ? '#b0302a' : '#3a5a2a'}">${'❤'.repeat(Math.max(1, Math.ceil(w.life / w.max * 5)))}</span>`}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-w]').forEach(b => b.onclick = () => give(+b.dataset.w));
  }
  function give(i){
    const w = W[i]; if (over || drops <= 0 || w.saved || w.lost) return;
    drops--; w.given++; SND.fx('click');
    if (w.given >= w.need){ w.saved = true; SND.fx('good'); ui.msg.textContent = w.n === 'Edmund' ? 'Edmund\'s face is not grey any more. He opens his eyes.' : `${w.n} sits up, and stretches, and stands.`; }
    render(); check();
  }
  function check(){
    const left = W.filter(w => !w.saved && !w.lost);
    if (!left.length || drops <= 0){ over = true; const saved = W.filter(w => w.saved).length, ed = W[0].saved;
      done({win: ed && saved >= 7, score:saved / W.length, msg:`${saved} of ${W.length} healed${ed ? ', Edmund first among them' : ''}.`}); }
  }
  render();
  let last = 0;
  const stop = ticker(dt => {
    if (over) return; t += dt; last += dt;
    W.forEach(w => { if (w.saved || w.lost) return; w.life -= dt; if (w.life <= 0){ w.lost = true; ui.msg.textContent = `${w.n} — too late. Aslan bows his great head.`; } });
    if (last > .5){ last = 0; render(); check(); }
    ui.hud.innerHTML = `<span>Healed <b>${W.filter(w => w.saved).length}</b></span>`;
  });
  return {stop};
};

// ═══ TITLE, MENU, BOOT ══════════════════════════════════════════════════════
function renderTitle(){
  const sv = tryLoad();
  $('#stage').innerHTML = `<div class="titlescr">${VIGNETTES.lamppost()}
    <h1>Beyond the Wardrobe</h1><div class="sub">being the adventures of Lucy and her brothers and sister in the land of Narnia, where it is always winter</div>
    <div class="verse">A lamp-post in a snowy wood,<br>A Faun with parcels, as he should;<br>A Witch, a Lion, and a door<br>That opens once, and then no more.</div>
    <div class="btns">${sv ? `<button class="btn gold" data-load>Continue — Chapter ${romanize(sv.chapter)}: ${esc(sv.chTitle || '')}</button>` : ''}<button class="btn" data-new>Step into the wardrobe</button></div>
    <p class="meta" style="margin-top:18px;max-width:580px;margin-left:auto;margin-right:auto">Seventeen chapters, ${Object.keys(SONGS).length} songs and sayings, ${Object.keys(MAPS).length} maps and nine trials. Keep your <b>Faith</b> and your <b>Warmth</b>, keep out of <b>the Witch's Notice</b>, mind your <b>Provisions</b>, and watch <b>the Thaw</b> spread. An unofficial game after C. S. Lewis's novel; only short phrases are quoted, and the prose and verses are new.</p></div>`;
  wireStage();
  const nb = $('#stage').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Begin again? Your saved game will be lost.')) startNew(); };
}
function openMenu(){
  openModal(`<div class="ptitle" style="font-size:1.2rem;text-align:center">Menu</div>
    <div class="choices" style="max-width:420px">
      ${G && G.checkpoint ? `<button class="choice" id="mcp">↺ Back to the start of this chapter (${esc(G.chTitle)})</button>` : ''}
      <button class="choice" id="mhelp">How to play</button>
      <button class="choice" id="msnd">${SND.on ? '♪ Sound: on' : '♪ Sound: off'}</button>
      <button class="choice" id="mnew">Begin again</button>
      ${G ? '<button class="choice" id="mtitle">Back to the title page</button>' : ''}
    </div><p class="meta center">Your progress is saved after every step.</p>`);
  const q = id => document.getElementById(id);
  if (q('mcp')) q('mcp').onclick = () => { if (confirm('Go back to the start of this chapter?')) restoreCheckpoint(); };
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.2rem">How to play</div><div class="text">${paras(`You are Lucy, the youngest of four children sent to stay in the country — and sometimes, for a chapter, you see through Edmund's eyes, or Peter's. Read, choose, and play your way through Narnia.

<b>Faith</b> is your trust in Aslan, and in each other. Choices marked ◆ are <b>the easy way</b> — sweet, like the Witch's Turkish Delight — and every one costs some Faith. When it matters most, you may need enough of it to follow where Aslan goes. <b>Warmth</b> is your body against the Witch's winter. <b>The Witch's Notice</b> rises when she learns about you: at 100, you are stone. <b>Provisions</b> are eaten on long journeys; without them, you freeze. <b>The Thaw</b> shows how far her winter has broken — watch the snow on the page as it rises.

Trials: the Faun's flute, the Witch's questions (as Edmund), following the robin and crossing the courtyard of statues (stealth maps: arrow keys or click; R to stand stock still like a statue), fleeing along the frozen river, Peter's fight with the wolf, finding the statues for Aslan, the cordial on the battlefield, and the White Stag. Every one can be skipped.`)}</div>`);
  q('msnd').onclick = () => { SND.on = !SND.on; openMenu(); updateSoundBtn(); };
  q('mnew').onclick = () => { if (!G || confirm('Begin again? Your current progress will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; render(); };
}
function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound on' : 'Sound off'; }

$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    return;
  }
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#stage').querySelectorAll('.choices button'); const b = btns[+e.key - 1]; if (b) b.click();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; if (UI.game && UI.inst && UI.inst.keyup) UI.inst.keyup(e); });
window.addEventListener('blur', () => { UI.keys = {}; });

updateSoundBtn();
G = null;
render();
</script>
</body>
