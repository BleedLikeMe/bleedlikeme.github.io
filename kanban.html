<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowboard — Kanban</title>
<style>
:root{
  --purple:#6c5ce7; --purple-dark:#5a4bd4;
  --red:#e74c3c; --orange:#e67e22; --yellow:#f1c40f; --green:#2ecc71; --blue:#3498db; --teal:#1abc9c; --gray:#95a5a6;
}
:root[data-theme="dark"]{
  --bg:#14151a; --bg-elev1:#1b1d24; --bg-elev2:#22242e; --bg-elev3:#2b2e3a;
  --border:#33353f; --border-soft:#2a2c36;
  --text:#e8e9ee; --text-dim:#9a9db0; --text-faint:#6b6e80;
  --accent:#7c6df0; --accent-soft:rgba(124,109,240,.16);
  --shadow: 0 8px 24px rgba(0,0,0,.45);
  --scrollbar:#3a3d4a;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f4f5f8; --bg-elev1:#ffffff; --bg-elev2:#ffffff; --bg-elev3:#eceef3;
  --border:#dcdee6; --border-soft:#e8e9ee;
  --text:#1c1e26; --text-dim:#5c5f6e; --text-faint:#9295a3;
  --accent:#6c5ce7; --accent-soft:rgba(108,92,231,.12);
  --shadow: 0 8px 24px rgba(30,32,50,.12);
  --scrollbar:#d3d5dd;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;}
a{color:var(--accent);}
#app{display:flex;height:100vh;width:100vw;}

/* ---------- Sidebar ---------- */
#sidebar{width:236px;min-width:236px;background:var(--bg-elev1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:4px;transition:margin-left .18s ease;}
#sidebar.collapsed{margin-left:-236px;}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;font-weight:700;font-size:16px;letter-spacing:.2px;}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--purple),#a29bfe);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;}
.side-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center;}
.side-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--text-dim);font-size:13.5px;user-select:none;}
.side-btn:hover{background:var(--bg-elev3);color:var(--text);}
.side-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.side-btn .ic{width:16px;text-align:center;flex-shrink:0;}
.board-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--text-dim);position:relative;}
.board-row:hover{background:var(--bg-elev3);}
.board-row.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.board-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.board-row .bname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;}
.board-row .star{opacity:0;font-size:12px;color:var(--yellow);}
.board-row:hover .star, .board-row .star.on{opacity:1;}
.iconbtn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:3px 5px;border-radius:5px;font-size:13px;}
.iconbtn:hover{background:var(--bg-elev3);color:var(--text);}
#sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--border-soft);}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;}
.user-chip select{background:none;border:none;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;max-width:130px;}

/* ---------- Topbar ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border);background:var(--bg-elev1);flex-wrap:wrap;}
#board-title{font-size:19px;font-weight:700;background:none;border:none;color:var(--text);outline:none;border-radius:6px;padding:3px 6px;min-width:60px;}
#board-title:hover,#board-title:focus{background:var(--bg-elev3);}
.topbar-spacer{flex:1;}
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:190px;}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;flex:1;}
.search-box .ic{color:var(--text-faint);font-size:13px;}
.btn{display:flex;align-items:center;gap:6px;background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;}
.btn:hover{background:var(--bg-elev3);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--purple-dark);}
.btn.small{padding:4px 9px;font-size:12px;}
.btn.icon-only{padding:7px 9px;}
.btn.danger{color:var(--red);}
.seg{display:flex;background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg button{background:none;border:none;color:var(--text-dim);padding:7px 12px;font-size:13px;cursor:pointer;}
.seg button.on{background:var(--accent);color:#fff;}
.badge-count{background:var(--bg-elev3);color:var(--text-dim);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:600;}
.filter-active-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:2px;}

/* ---------- Popover / dropdown ---------- */
.popover{position:absolute;background:var(--bg-elev2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:80;padding:12px;min-width:220px;}
.popover h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);}
.popover .row{display:flex;align-items:center;gap:7px;padding:5px 2px;font-size:13px;cursor:pointer;border-radius:6px;}
.popover .row:hover{background:var(--bg-elev3);}
.popover .divider{height:1px;background:var(--border-soft);margin:8px 0;}
.chipsel{padding:3px 9px;border-radius:20px;font-size:12px;border:1px solid var(--border);cursor:pointer;color:var(--text-dim);}
.chipsel.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ---------- Board ---------- */
#board-scroll{flex:1;overflow:auto;padding:16px;display:flex;align-items:flex-start;gap:14px;}
.column{background:var(--bg-elev1);border:1px solid var(--border);border-radius:12px;width:288px;min-width:288px;max-height:100%;display:flex;flex-direction:column;flex-shrink:0;}
.column.over-wip{border-color:var(--red);}
.column.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;}
.column-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;cursor:grab;}
.column-head .cname{font-weight:700;font-size:13.5px;flex:1;background:none;border:none;color:var(--text);outline:none;min-width:0;}
.column-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.column-count{font-size:11.5px;color:var(--text-faint);background:var(--bg-elev3);border-radius:20px;padding:1px 8px;font-weight:600;}
.column-count.over{background:var(--red);color:#fff;}
.column-wip-label{font-size:10.5px;color:var(--text-faint);padding:0 12px 6px;}
.column-body{flex:1;overflow-y:auto;padding:2px 10px 6px;display:flex;flex-direction:column;gap:8px;min-height:40px;}
.column-add{padding:8px 10px 10px;}
.column-add input{width:100%;background:var(--bg-elev2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);font-size:13px;outline:none;}
.column-add input:focus{border-color:var(--accent);}
.add-column-btn{width:288px;min-width:288px;flex-shrink:0;height:44px;border:1.5px dashed var(--border);border-radius:12px;background:none;color:var(--text-faint);cursor:pointer;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-column-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

/* ---------- Card ---------- */
.card{background:var(--bg-elev2);border:1px solid var(--border-soft);border-radius:10px;padding:10px 11px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;}
.card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.15);}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.card.dragging{opacity:.35;}
.card.completed .card-title{text-decoration:line-through;color:var(--text-faint);}
.card-cover{height:6px;border-radius:5px;margin:-10px -11px 2px;}
.card-top{display:flex;align-items:flex-start;gap:8px;}
.check-circle{width:17px;height:17px;border-radius:50%;border:2px solid var(--text-faint);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;}
.check-circle:hover{border-color:var(--accent);}
.check-circle.done{background:var(--green);border-color:var(--green);color:#fff;}
.card-title{font-size:13.5px;font-weight:600;flex:1;line-height:1.35;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag-pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff;}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-faint);}
.meta-pill{display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;background:var(--bg-elev3);}
.meta-pill.due-overdue{color:var(--red);background:rgba(231,76,60,.14);}
.meta-pill.due-today{color:var(--orange);background:rgba(230,126,34,.15);}
.meta-pill.due-soon{color:var(--yellow);}
.prio-flag{width:6px;height:6px;border-radius:50%;display:inline-block;}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;}
.avatar.sm{width:18px;height:18px;font-size:8.5px;}
.avatar.lg{width:34px;height:34px;font-size:13px;}
.subtask-progress{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-faint);}
.mini-bar{width:34px;height:4px;background:var(--bg-elev3);border-radius:3px;overflow:hidden;}
.mini-bar > div{height:100%;background:var(--green);}

/* ---------- List view ---------- */
#list-scroll{flex:1;overflow:auto;padding:16px 20px;}
table.task-table{width:100%;border-collapse:collapse;font-size:13px;}
table.task-table th{text-align:left;padding:8px 10px;color:var(--text-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);}
table.task-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}
table.task-table tr.task-row:hover{background:var(--bg-elev2);cursor:pointer;}
table.task-table tr.completed td .lt{text-decoration:line-through;color:var(--text-faint);}
.group-row td{padding:14px 10px 6px;font-weight:700;font-size:12.5px;color:var(--text-dim);border-bottom:none;text-transform:uppercase;letter-spacing:.4px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadein .12s ease;}
@keyframes fadein{from{opacity:0} to{opacity:1}}
.modal{background:var(--bg-elev1);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:640px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px 26px;}
.modal.narrow{width:420px;}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.modal-title-input{flex:1;font-size:20px;font-weight:700;background:none;border:none;color:var(--text);outline:none;border-radius:6px;padding:4px 6px;}
.modal-title-input:hover,.modal-title-input:focus{background:var(--bg-elev3);}
.field-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1;}
.field label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
.field select, .field input[type=date], .field input[type=text], textarea{background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;font-family:inherit;}
.field select:focus, .field input:focus, textarea:focus{border-color:var(--accent);}
textarea{width:100%;resize:vertical;min-height:64px;}
.section-label{font-size:12px;font-weight:700;color:var(--text-dim);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;}
.subtask-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.subtask-row input[type=text]{flex:1;border:none;background:none;padding:3px 4px;}
.subtask-row.done span{text-decoration:line-through;color:var(--text-faint);}
.comment{display:flex;gap:9px;margin-bottom:12px;}
.comment .body{flex:1;background:var(--bg-elev2);border-radius:10px;padding:8px 10px;}
.comment .who{font-size:12px;font-weight:700;margin-bottom:2px;}
.comment .when{color:var(--text-faint);font-weight:400;font-size:10.5px;margin-left:6px;}
.comment .txt{font-size:13px;}
.close-x{margin-left:auto;background:none;border:none;color:var(--text-faint);font-size:19px;cursor:pointer;line-height:1;}
.close-x:hover{color:var(--text);}
.color-swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.color-swatch.on{border-color:var(--text);}
.tag-manage-row{display:flex;align-items:center;gap:8px;padding:5px 0;}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:400;}
.toast{background:var(--bg-elev3);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:slidein .18s ease;}
@keyframes slidein{from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1}}
.toast button{background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;font-size:12.5px;}

/* ---------- Activity / Trash panel ---------- */
.side-panel{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--bg-elev1);border-left:1px solid var(--border);box-shadow:var(--shadow);z-index:150;display:flex;flex-direction:column;animation:slidepanel .16s ease;}
@keyframes slidepanel{from{transform:translateX(20px);opacity:.4} to{transform:translateX(0);opacity:1}}
.side-panel-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;gap:8px;}
.side-panel-body{flex:1;overflow-y:auto;padding:10px 16px;}
.activity-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.activity-item .t{color:var(--text-faint);font-size:11px;}
.trash-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.trash-item .ti{flex:1;font-size:13px;}
.empty-hint{color:var(--text-faint);font-size:12.5px;text-align:center;padding:30px 10px;}

/* ---------- Misc ---------- */
.hidden{display:none !important;}
.kbd{background:var(--bg-elev3);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:11px;font-family:monospace;}
#dragplaceholder{border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);}

/* ---------- Board progress ---------- */
.board-progress{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-faint);}
.board-progress .bar{width:70px;height:5px;background:var(--bg-elev3);border-radius:4px;overflow:hidden;}
.board-progress .bar>div{height:100%;background:var(--green);}
.board-icon-btn{font-size:19px;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:6px;line-height:1;}
.board-icon-btn:hover{background:var(--bg-elev3);}
.emoji-grid{display:flex;flex-wrap:wrap;gap:4px;max-width:220px;}
.emoji-grid span{font-size:18px;cursor:pointer;padding:4px;border-radius:6px;}
.emoji-grid span:hover{background:var(--bg-elev3);}

/* ---------- Column collapse / color ---------- */
.column.collapsed{width:44px;min-width:44px;}
.column.collapsed .column-body,.column.collapsed .column-add,.column.collapsed .column-wip-label{display:none;}
.column.collapsed .column-head{flex-direction:column;padding:10px 6px;gap:10px;cursor:default;}
.column.collapsed .cname{writing-mode:vertical-rl;text-orientation:mixed;background:none;height:120px;text-align:left;cursor:pointer;}
.column-collapse-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px;}
.column-collapse-btn:hover{color:var(--text);}
.swatch-row{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- Today digest ---------- */
.digest-count{margin-left:auto;background:var(--orange);color:#fff;border-radius:20px;padding:0 7px;font-size:11px;font-weight:700;}

/* ---------- Bulk select ---------- */
.card.selectable{padding-left:30px;}
.select-box{position:absolute;left:9px;top:11px;width:16px;height:16px;border-radius:4px;border:2px solid var(--text-faint);background:var(--bg-elev2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;}
.select-box.on{background:var(--accent);border-color:var(--accent);color:#fff;}
#bulk-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-elev3);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:120;}
#bulk-bar select{background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 8px;font-size:12.5px;}

/* ---------- Command palette ---------- */
.cmdk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.cmdk{background:var(--bg-elev1);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:520px;max-width:90vw;max-height:60vh;overflow:hidden;display:flex;flex-direction:column;}
.cmdk input{border:none;background:none;outline:none;color:var(--text);font-size:16px;padding:16px 18px;border-bottom:1px solid var(--border);}
.cmdk-results{overflow-y:auto;padding:6px;}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;}
.cmdk-item.active,.cmdk-item:hover{background:var(--accent-soft);}
.cmdk-item .tag{margin-left:auto;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}

/* ---------- Shortcuts modal ---------- */
.shortcut-row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--border-soft);font-size:13px;}

/* ---------- Confetti ---------- */
.confetti-piece{position:fixed;top:-10px;width:8px;height:14px;z-index:500;pointer-events:none;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{to{transform:translateY(105vh) rotate(540deg);opacity:.85;}}

/* ---------- Swimlanes ---------- */
#swimlane-select{background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;}
#board-scroll.swimlane-mode{flex-direction:column;align-items:stretch;}
.swimlane{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:10px;}
.swimlane:last-of-type{border-bottom:none;}
.swimlane-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:4px 2px 10px;color:var(--text-dim);}
.swimlane-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.columns-row{display:flex;gap:14px;align-items:flex-start;}

/* ---------- Calendar view ---------- */
#calendar-scroll{flex:1;overflow:auto;padding:16px 20px;}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cal-head h3{margin:0;font-size:17px;font-weight:700;flex:1;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;padding-bottom:4px;}
.cal-cell{background:var(--bg-elev1);border:1px solid var(--border);border-radius:9px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;}
.cal-cell.other-month{opacity:.4;}
.cal-cell.is-today{border-color:var(--accent);}
.cal-daynum{font-size:11.5px;color:var(--text-faint);font-weight:600;}

<script>
/* ===================== Utilities ===================== */
const uid = () => 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderCommentText(text){
  let out = esc(text);
  state.members.slice().sort((a,b)=>b.name.length-a.name.length).forEach(m=>{
    const escName = esc(m.name);
    const re = new RegExp('@'+escName.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    out = out.replace(re, `<span class="mention">@${escName}</span>`);
  });
  return out;
}
const PALETTE = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#6c5ce7','#e84393','#00b894','#0984e3','#d35400','#8e44ad'];
function colorFor(str){ let h=0; for(let i=0;i<str.length;i++){h=str.charCodeAt(i)+((h<<5)-h);} return PALETTE[Math.abs(h)%PALETTE.length]; }
function initials(name){ return name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addDaysISO(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function dueStatus(iso){
  if(!iso) return null;
  const today = todayISO();
  const diffDays = Math.round((new Date(iso+'T00:00:00') - new Date(today+'T00:00:00'))/86400000);
  if(diffDays < 0) return 'overdue';
  if(diffDays === 0) return 'today';
  if(diffDays <= 2) return 'soon';
  return null;
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<86400*30) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
const PRIORITIES = [
  {id:'low', label:'Low', color:'#3498db'},
  {id:'medium', label:'Medium', color:'#f1c40f'},
  {id:'high', label:'High', color:'#e67e22'},
  {id:'urgent', label:'Urgent', color:'#e74c3c'},
];
function prio(id){ return PRIORITIES.find(p=>p.id===id) || null; }
function newTask(title){
  return { id:uid(), title, desc:'', assigneeId:null, dueDate:null, priority:null, tagIds:[], subtasks:[], comments:[], attachments:[], cover:null, completed:false, recurrence:null, blockedBy:[], customValues:{}, createdAt:Date.now() };
}
function addDaysFrom(iso, days){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
let selectMode = false;
let selectedTaskIds = new Set();
function toggleSelection(id){ if(selectedTaskIds.has(id)) selectedTaskIds.delete(id); else selectedTaskIds.add(id); render(); }
function toggleTaskComplete(board, t){
  t.completed = !t.completed;
  if(t.completed){
    spawnConfetti();
    logActivity(`Completed "${t.title}"`);
    if(t.recurrence){
      const col = board.columns.find(c=>c.taskIds.includes(t.id));
      const next = JSON.parse(JSON.stringify(t));
      next.id = uid(); next.completed = false; next.comments = [];
      next.subtasks = next.subtasks.map(s=>({...s, done:false}));
      const days = t.recurrence==='daily'?1:(t.recurrence==='weekly'?7:30);
      next.dueDate = t.dueDate ? addDaysFrom(t.dueDate, days) : addDaysISO(days);
      board.tasks[next.id] = next;
      if(col) col.taskIds.push(next.id);
      logActivity(`Recurring task "${t.title}" scheduled for ${fmtDate(next.dueDate)}`);
    }
  } else {
    logActivity(`Reopened "${t.title}"`);
  }
}
function spawnConfetti(){
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = PALETTE[i % PALETTE.length];
    el.style.animationDuration = (0.9 + Math.random()*0.7)+'s';
    el.style.transform = `rotate(${Math.floor(Math.random()*360)}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2200);
  }
}

      {id:'tpl1', name:'Bug triage', subtasks:['Reproduce issue','Identify root cause','Write fix','Add regression test']},
      {id:'tpl2', name:'Blog post', subtasks:['Outline','Draft','Edit','Add images','Publish']},

/* ===================== State load/save ===================== */
const STORE_KEY = 'flowboard_v1';
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return seedState();
}
function migrate(s){
  if(s.calendarCursor===undefined) s.calendarCursor = null;
  if(s.templates===undefined) s.templates = [];
  if(s.showArchived===undefined) s.showArchived = false;
  if(s.swimlaneBy===undefined) s.swimlaneBy = null;
  (s.boards||[]).forEach(b=>{
    if(!b.icon) b.icon = '📋';
    if(b.archived===undefined) b.archived = false;
    if(b.customFields===undefined) b.customFields = [];
    b.columns.forEach(c=>{
      if(c.color===undefined) c.color = null;
      if(c.collapsed===undefined) c.collapsed = false;
    });
    Object.values(b.tasks).forEach(t=>{
      if(!t.attachments) t.attachments = [];
      if(t.recurrence===undefined) t.recurrence = null;
      if(t.blockedBy===undefined) t.blockedBy = [];
      if(t.customValues===undefined) t.customValues = {};
    });
  });
  return s;
}
let undoStack = [];
function save(){
  const prev = localStorage.getItem(STORE_KEY);
  if(prev){ undoStack.push(prev); if(undoStack.length>25) undoStack.shift(); }
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function undo(){
  if(!undoStack.length){ toast('Nothing to undo'); return; }
  const prev = undoStack.pop();
  state = migrate(JSON.parse(prev));
  localStorage.setItem(STORE_KEY, prev);
  render();
  toast('Undid last action');
}
function curBoard(){ return state.boards.find(b=>b.id===state.currentBoardId) || state.boards[0]; }
function memberById(id){ return state.members.find(m=>m.id===id); }
function tagById(id){ return state.tags.find(t=>t.id===id); }
function logActivity(text){
  state.activity.unshift({id:uid(), text, time:Date.now()});
  if(state.activity.length>200) state.activity.length=200;
}

/* ===================== Toasts ===================== */
function toast(msg, actionLabel, actionFn){
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel? `<button>${esc(actionLabel)}</button>`:'');
  if(actionLabel) el.querySelector('button').onclick = ()=>{ actionFn(); el.remove(); };
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 5000);
}
function clearAllFilters(){
  const f = state.filters;
  f.assignees=[]; f.priorities=[]; f.tagIds=[]; f.due=null; f.search=''; f._myTasks=false; f._todayDigest=false;
  const searchInput = document.getElementById('search-input');
  if(searchInput) searchInput.value='';
  persistAndRender();
}
function warnIfHiddenByFilters(t){
  if(!taskMatchesFilters(t)){
    toast('Task added, but your current filters/search are hiding it', 'Clear filters', clearAllFilters);
  }
}

/* ===================== Rendering ===================== */
function persistAndRender(){ save(); render(); }
const prefersDarkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function effectiveTheme(){
  if(state.theme==='auto') return (prefersDarkMQ && prefersDarkMQ.matches) ? 'dark' : 'light';
  return state.theme;
}
function cycleTheme(){
  state.theme = state.theme==='dark' ? 'light' : (state.theme==='light' ? 'auto' : 'dark');
  persistAndRender();
}
if(prefersDarkMQ && prefersDarkMQ.addEventListener){
  prefersDarkMQ.addEventListener('change', ()=>{ if(state.theme==='auto') render(); });
}

function render(){
  document.documentElement.setAttribute('data-theme', effectiveTheme());
  const themeIcons = {dark:'☀', light:'🌙', auto:'🖥'};
  const themeLabels = {dark:'Switch to light mode', light:'Switch to auto (system)', auto:'Switch to dark mode'};
  document.getElementById('theme-ic').textContent = themeIcons[state.theme] || '☀';
  document.getElementById('theme-label').textContent = themeLabels[state.theme] || 'Light mode';
  renderSidebar();
  renderTopbar();
  document.getElementById('board-scroll').classList.toggle('hidden', state.view!=='board');
  document.getElementById('list-scroll').classList.toggle('hidden', state.view!=='list');
  document.getElementById('calendar-scroll').classList.toggle('hidden', state.view!=='calendar');
  if(state.view==='board') renderBoard();
  else if(state.view==='list') renderList();
  else renderCalendar();
  renderBulkBar();
}

function renderBulkBar(){
  const root = document.getElementById('bulk-bar-root');
  if(!selectMode || selectedTaskIds.size===0){ root.innerHTML=''; return; }
  const b = curBoard();
  root.innerHTML = `
    <div id="bulk-bar">
      <strong>${selectedTaskIds.size} selected</strong>
      <select id="bulk-move"><option value="">Move to...</option>${b.columns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <select id="bulk-assign"><option value="">Assign to...</option><option value="__none__">Unassigned</option>${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
      <select id="bulk-tag"><option value="">Add tag...</option>${state.tags.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
      <button class="btn small" id="bulk-complete">✓ Complete</button>
      <button class="btn small danger" id="bulk-delete">🗑 Delete</button>
      <button class="btn small" id="bulk-clear">Clear</button>
    </div>`;
  document.getElementById('bulk-move').onchange = (e)=>{
    const destId = e.target.value; if(!destId) return;
    selectedTaskIds.forEach(id=>{
      b.columns.forEach(c=>{ c.taskIds = c.taskIds.filter(x=>x!==id); });
      b.columns.find(c=>c.id===destId).taskIds.push(id);
    });
    logActivity(`Moved ${selectedTaskIds.size} task(s)`);
    selectedTaskIds.clear(); persistAndRender();
  };
  document.getElementById('bulk-assign').onchange = (e)=>{
    const val = e.target.value; if(!val) return;
    selectedTaskIds.forEach(id=>{ b.tasks[id].assigneeId = val==='__none__'?null:val; });
    selectedTaskIds.clear(); persistAndRender();
  };
  document.getElementById('bulk-tag').onchange = (e)=>{
    const val = e.target.value; if(!val) return;
    selectedTaskIds.forEach(id=>{ const tk=b.tasks[id]; if(!tk.tagIds.includes(val)) tk.tagIds.push(val); });
    selectedTaskIds.clear(); persistAndRender();
  };
  document.getElementById('bulk-complete').onclick = ()=>{
    selectedTaskIds.forEach(id=>{ const tk=b.tasks[id]; if(!tk.completed) toggleTaskComplete(b, tk); });
    selectedTaskIds.clear(); persistAndRender();
  };
  document.getElementById('bulk-delete').onclick = ()=>{
    if(!confirm(`Delete ${selectedTaskIds.size} task(s)? They will be moved to Trash.`)) return;
    selectedTaskIds.forEach(id=>{
      const col = b.columns.find(c=>c.taskIds.includes(id));
      if(col) col.taskIds = col.taskIds.filter(x=>x!==id);
      state.trash.push({...b.tasks[id], _boardId:b.id, _colId:col?col.id:null, _deletedAt:Date.now()});
      delete b.tasks[id];
    });
    logActivity(`Deleted ${selectedTaskIds.size} task(s)`);
    selectedTaskIds.clear(); persistAndRender();
  };
  document.getElementById('bulk-clear').onclick = ()=>{ selectedTaskIds.clear(); persistAndRender(); };
}

function renderSidebar(){
  const list = document.getElementById('board-list');
  list.innerHTML = '';
  const visibleBoards = state.boards.filter(b => state.showArchived || !b.archived);
  visibleBoards.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'board-row' + (b.id===state.currentBoardId?' active':'') + (b.archived?' archived':'');
    if(b.archived) row.style.opacity = '.55';
    row.draggable = true;
    row.dataset.boardId = b.id;
    row.innerHTML = `<span style="font-size:13px;flex-shrink:0;">${b.icon||'📋'}</span><span class="bname">${esc(b.name)}${b.archived?' (archived)':''}</span><span class="star ${b.starred?'on':''}">★</span><button class="iconbtn" data-board-menu="${b.id}">⋯</button>`;
    row.onclick = (e)=>{
      if(e.target.closest('[data-board-menu]')) return;
      if(e.target.classList.contains('star')){ b.starred=!b.starred; persistAndRender(); return; }
      state.currentBoardId = b.id; persistAndRender();
    };
    row.querySelector('[data-board-menu]').onclick = (e)=>{ e.stopPropagation(); openBoardMenu(e.currentTarget, b.id); };
    row.addEventListener('dragstart', (e)=>{ e.dataTransfer.setData('text/board-id', b.id); });
    row.addEventListener('dragover', (e)=>{ if(e.dataTransfer.types.includes('text/board-id')) e.preventDefault(); });
    row.addEventListener('drop', (e)=>{
      const dragId = e.dataTransfer.getData('text/board-id');
      if(!dragId || dragId===b.id) return;
      e.preventDefault();
      const from = state.boards.findIndex(x=>x.id===dragId);
      const to = state.boards.findIndex(x=>x.id===b.id);
      const [moved] = state.boards.splice(from,1);
      state.boards.splice(to,0,moved);
      persistAndRender();
    });
    list.appendChild(row);
  });
  const archivedCount = state.boards.filter(b=>b.archived).length;
  if(archivedCount){
    const toggleRow = document.createElement('div');
    toggleRow.className = 'side-btn';
    toggleRow.style.fontSize = '12px';
    toggleRow.style.color = 'var(--text-faint)';
    toggleRow.textContent = state.showArchived ? 'Hide archived boards' : `Show archived boards (${archivedCount})`;
    toggleRow.onclick = ()=>{ state.showArchived = !state.showArchived; persistAndRender(); };
    list.appendChild(toggleRow);
  }
  document.getElementById('btn-my-tasks').classList.toggle('active', state.filters._myTasks===true);
  document.getElementById('btn-today').classList.toggle('active', state.filters._todayDigest===true);
  const todayCount = Object.values(curBoard().tasks).filter(t=>!t.completed && (dueStatus(t.dueDate)==='today'||dueStatus(t.dueDate)==='overdue')).length;
  const todayCountEl = document.getElementById('today-count');
  if(todayCount){ todayCountEl.textContent = todayCount; todayCountEl.classList.remove('hidden'); }
  else todayCountEl.classList.add('hidden');
  const trashCountEl = document.getElementById('trash-count');
  if(state.trash.length){ trashCountEl.textContent = state.trash.length; trashCountEl.classList.remove('hidden'); }
  else trashCountEl.classList.add('hidden');

  const sel = document.getElementById('cur-user-select');
  sel.innerHTML = state.members.map(m=>`<option value="${m.id}" ${m.id===state.currentUserId?'selected':''}>${esc(m.name)}</option>`).join('');
  document.getElementById('cur-user-avatar').style.background = colorFor(state.currentUserId);
  document.getElementById('cur-user-avatar').textContent = initials(memberById(state.currentUserId)?.name || '?');
}

function renderTopbar(){
  const b = curBoard();
  const titleEl = document.getElementById('board-title');
  if(document.activeElement !== titleEl) titleEl.value = b.name;
  document.getElementById('board-icon-btn').textContent = b.icon || '📋';
  document.querySelectorAll('#view-seg button').forEach(btn=>btn.classList.toggle('on', btn.dataset.view===state.view));
  const swimSel = document.getElementById('swimlane-select');
  swimSel.classList.toggle('hidden', state.view!=='board');
  swimSel.value = state.swimlaneBy || '';
  const f = state.filters;
  const active = f.assignees.length || f.priorities.length || f.tagIds.length || f.due;
  document.getElementById('filter-dot').innerHTML = active ? '<span class="filter-active-dot"></span>' : '';
  const allTasks = Object.values(b.tasks);
  const total = allTasks.length;
  const done = allTasks.filter(t=>t.completed).length;
  const pct = total ? Math.round(100*done/total) : 0;
  const prog = document.getElementById('board-progress');
  prog.querySelector('.bar>div').style.width = pct+'%';
  prog.querySelector('span').textContent = total ? `${pct}% (${done}/${total})` : 'No tasks yet';
  document.getElementById('btn-select-mode').classList.toggle('primary', selectMode);
}

function taskMatchesFilters(t){
  const f = state.filters;
  if(f.search){
    const s = f.search.toLowerCase();
    const inTitle = t.title.toLowerCase().includes(s);
    const inDesc = (t.desc||'').toLowerCase().includes(s);
    const inTags = t.tagIds.some(id=> (tagById(id)?.name||'').toLowerCase().includes(s));
    if(!inTitle && !inDesc && !inTags) return false;
  }
  if(f.assignees.length && !f.assignees.includes(t.assigneeId)) return false;
  if(f.priorities.length && !f.priorities.includes(t.priority)) return false;
  if(f.tagIds.length && !t.tagIds.some(id=>f.tagIds.includes(id))) return false;
  if(f.due){
    const ds = dueStatus(t.dueDate);
    if(f.due==='overdue' && ds!=='overdue') return false;
    if(f.due==='today' && ds!=='today') return false;
    if(f.due==='week' && !(ds==='today'||ds==='soon'||ds==='overdue')) return false;
    if(f.due==='none' && t.dueDate) return false;
  }
  if(f._myTasks && t.assigneeId !== state.currentUserId) return false;
  if(f._todayDigest){ const ds = dueStatus(t.dueDate); if(!(ds==='today'||ds==='overdue') || t.completed) return false; }
  return true;
}

function isBlocked(board, t){ return (t.blockedBy||[]).some(id=> board.tasks[id] && !board.tasks[id].completed); }
function cardHTML(t){
  const board = curBoard();
  const a = t.assigneeId ? memberById(t.assigneeId) : null;
  const p = prio(t.priority);
  const ds = dueStatus(t.dueDate);
  const doneSub = t.subtasks.filter(s=>s.done).length;
  const numericFields = (board.customFields||[]).filter(f=>f.type==='number' && t.customValues[f.id]);
  return `
  <div class="card ${t.completed?'completed':''} ${selectMode?'selectable':''}" draggable="true" tabindex="0" data-task-id="${t.id}">
    ${selectMode? `<div class="select-box ${selectedTaskIds.has(t.id)?'on':''}" data-id="${t.id}">✓</div>`:''}
    ${t.cover ? `<div class="card-cover" style="background:${t.cover}"></div>` : ''}
    <div class="card-top">
      <div class="check-circle ${t.completed?'done':''}" data-action="toggle-complete" data-id="${t.id}">✓</div>
      <div class="card-title">${esc(t.title)}</div>
    </div>
    ${t.tagIds.length? `<div class="card-tags">${t.tagIds.map(id=>{const tg=tagById(id); return tg?`<span class="tag-pill" style="background:${tg.color}">${esc(tg.name)}</span>`:'';}).join('')}</div>`:''}
    <div class="card-meta">
      ${p?`<span class="meta-pill"><span class="prio-flag" style="background:${p.color}"></span>${p.label}</span>`:''}
      ${t.dueDate?`<span class="meta-pill ${ds==='overdue'?'due-overdue':ds==='today'?'due-today':ds==='soon'?'due-soon':''}">📅 ${fmtDate(t.dueDate)}</span>`:''}
      ${t.comments.length?`<span class="meta-pill">💬 ${t.comments.length}</span>`:''}
      ${isBlocked(board,t)?`<span class="meta-pill due-overdue">⛔ Blocked</span>`:''}
      ${numericFields.map(f=>`<span class="meta-pill">${esc(f.name)}: ${esc(String(t.customValues[f.id]))}</span>`).join('')}
    </div>
    <div class="card-bottom">
      ${t.subtasks.length? `<div class="subtask-progress"><div class="mini-bar"><div style="width:${Math.round(100*doneSub/t.subtasks.length)}%"></div></div>${doneSub}/${t.subtasks.length}</div>` : '<span></span>'}
      ${a?`<div class="avatar" title="${esc(a.name)}" style="background:${colorFor(a.id)}">${initials(a.name)}</div>`:''}
    </div>
  </div>`;
}

function getLanes(){
  if(state.swimlaneBy==='assignee') return [...state.members.map(m=>({key:m.id, label:m.name, color:colorFor(m.id)})), {key:'__unassigned__', label:'Unassigned', color:'#888'}];
  if(state.swimlaneBy==='priority') return [...PRIORITIES.map(p=>({key:p.id, label:p.label, color:p.color})), {key:'__none__', label:'No priority', color:'#888'}];
  return null;
}
function matchesLaneKey(t, laneKey){
  if(state.swimlaneBy==='assignee') return (t.assigneeId||'__unassigned__')===laneKey;
  if(state.swimlaneBy==='priority') return (t.priority||'__none__')===laneKey;
  return true;
}
function laneKeyToFieldValue(laneKey){ return (laneKey==='__unassigned__'||laneKey==='__none__') ? null : laneKey; }
function buildColumnEl(b, col, laneKey){
  const visibleTasks = col.taskIds.map(id=>b.tasks[id]).filter(Boolean).filter(taskMatchesFilters).filter(t=> laneKey==null || matchesLaneKey(t, laneKey));
  const total = col.taskIds.length;
  const overWip = col.wipLimit && total > col.wipLimit;
  const dotColor = col.color || colorFor(col.id);
  const colEl = document.createElement('div');
  colEl.className = 'column' + (overWip? ' over-wip':'') + (col.collapsed? ' collapsed':'');
  colEl.dataset.colId = col.id;
  const laneAttr = laneKey!=null ? `data-lane="${esc(laneKey)}"` : '';
  colEl.innerHTML = `
    <div class="column-head" draggable="true" data-col-drag="${col.id}">
      <span class="column-dot" style="background:${dotColor}"></span>
      <input class="cname" value="${esc(col.name)}" data-col-id="${col.id}" spellcheck="false" ${col.collapsed?'readonly':''}>
      <span class="column-count ${overWip?'over':''}">${total}${col.wipLimit?'/'+col.wipLimit:''}</span>
      <button class="column-collapse-btn" data-action="col-collapse" data-col-id="${col.id}" title="${col.collapsed?'Expand':'Collapse'}">${col.collapsed?'»':'«'}</button>
      ${col.collapsed?'':`<button class="iconbtn" data-action="col-menu" data-col-id="${col.id}">⋯</button>`}
    </div>
    <div class="column-body" data-col-id="${col.id}" ${laneAttr}>
      ${visibleTasks.map(t=>cardHTML(t)).join('')}
    </div>
    <div class="column-add">
      <input placeholder="＋ Add task..." data-add-col="${col.id}" ${laneAttr}>
    </div>`;
  return colEl;
}
function buildColumnsRow(b, laneKey){
  const row = document.createElement('div');
  row.className = 'columns-row';
  b.columns.forEach(col=> row.appendChild(buildColumnEl(b, col, laneKey)));
  return row;
}
function renderBoard(){
  const b = curBoard();
  const wrap = document.getElementById('board-scroll');
  wrap.innerHTML = '';
  const lanes = getLanes();
  wrap.classList.toggle('swimlane-mode', !!lanes);
  if(!lanes){
    wrap.appendChild(buildColumnsRow(b, null));
  } else {
    lanes.forEach(lane=>{
      const laneWrap = document.createElement('div');
      laneWrap.className = 'swimlane';
      laneWrap.innerHTML = `<div class="swimlane-head"><span class="swimlane-dot" style="background:${lane.color}"></span>${esc(lane.label)}</div>`;
      laneWrap.appendChild(buildColumnsRow(b, lane.key));
      wrap.appendChild(laneWrap);
    });
  }
  const addColBtn = document.createElement('button');
  addColBtn.className = 'add-column-btn';
  addColBtn.textContent = '＋ Add column';
  addColBtn.onclick = ()=>{
    const name = prompt('Column name:', 'New column');
    if(!name) return;
    b.columns.push({id:uid(), name, wipLimit:null, color:null, collapsed:false, taskIds:[]});
    logActivity(`Added column "${esc(name)}"`);
    persistAndRender();
  };
  wrap.appendChild(addColBtn);
  attachBoardHandlers();
}

function attachBoardHandlers(){
  const b = curBoard();
  document.querySelectorAll('.check-circle').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); const id = el.dataset.id; const t = b.tasks[id]; toggleTaskComplete(b, t); persistAndRender(); };
  });
  document.querySelectorAll('.card').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('.check-circle')) return;
      if(selectMode){ e.stopPropagation(); toggleSelection(el.dataset.taskId); return; }
      openTaskModal(el.dataset.taskId);
    };
    el.addEventListener('dragstart', (e)=>{ el.classList.add('dragging'); e.dataTransfer.setData('text/task-id', el.dataset.taskId); });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
  });
  document.querySelectorAll('.select-box').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggleSelection(el.dataset.id); };
  });
  document.querySelectorAll('.column-body').forEach(body=>{
    body.addEventListener('dragover', (e)=>{
      e.preventDefault();
      const dragging = document.querySelector('.card.dragging');
      if(!dragging) return;
      const after = [...body.querySelectorAll('.card:not(.dragging)')].find(c=>{
        const r = c.getBoundingClientRect();
        return e.clientY < r.top + r.height/2;
      });
      if(after) body.insertBefore(dragging, after); else body.appendChild(dragging);
    });
    body.addEventListener('drop', (e)=>{
      e.preventDefault();
      const taskId = e.dataTransfer.getData('text/task-id');
      const destColId = body.dataset.colId;
      moveTaskToColumn(taskId, destColId, [...body.querySelectorAll('.card')].map(c=>c.dataset.taskId), body.dataset.lane ?? null);
    });
  });
  document.querySelectorAll('input.cname').forEach(inp=>{
    inp.onchange = ()=>{ const col = b.columns.find(c=>c.id===inp.dataset.colId); col.name = inp.value.trim()||col.name; persistAndRender(); };
    inp.onclick = ()=>{ if(inp.readOnly){ const col = b.columns.find(c=>c.id===inp.dataset.colId); col.collapsed=false; persistAndRender(); } };
  });
  document.querySelectorAll('[data-action=col-menu]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openColumnMenu(btn, btn.dataset.colId); };
  });
  document.querySelectorAll('[data-action=col-collapse]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const col = b.columns.find(c=>c.id===btn.dataset.colId); col.collapsed = !col.collapsed; persistAndRender(); };
  });
  document.querySelectorAll('[data-add-col]').forEach(inp=>{
    inp.onkeydown = (e)=>{
      if(e.key==='Enter' && inp.value.trim()){
        const col = b.columns.find(c=>c.id===inp.dataset.addCol);
        const t = newTask(inp.value.trim());
        if(inp.dataset.lane){
          const field = state.swimlaneBy==='assignee' ? 'assigneeId' : 'priority';
          t[field] = laneKeyToFieldValue(inp.dataset.lane);
        }
        b.tasks[t.id]=t; col.taskIds.push(t.id);
        logActivity(`Added task "${esc(t.title)}"`);
        inp.value='';
        persistAndRender();
        warnIfHiddenByFilters(t);
      }
    };
  });
  // column drag reorder
  let draggedCol = null;
  document.querySelectorAll('[data-col-drag]').forEach(head=>{
    head.addEventListener('dragstart', (e)=>{ draggedCol = head.dataset.colDrag; e.dataTransfer.setData('text/col-id', draggedCol); });
    head.closest('.column').addEventListener('dragover', (e)=>{
      if(!e.dataTransfer.types.includes('text/col-id')) return;
      e.preventDefault();
    });
    head.closest('.column').addEventListener('drop', (e)=>{
      const colId = e.dataTransfer.getData('text/col-id');
      if(!colId) return;
      e.preventDefault();
      const targetId = head.closest('.column').dataset.colId;
      if(colId===targetId) return;
      const from = b.columns.findIndex(c=>c.id===colId);
      const to = b.columns.findIndex(c=>c.id===targetId);
      const [moved] = b.columns.splice(from,1);
      b.columns.splice(to,0,moved);
      persistAndRender();
    });
  });
}

function moveTaskToColumn(taskId, destColId, orderedIdsInDom, laneKey){
  const b = curBoard();
  const destCol = b.columns.find(c=>c.id===destColId);
  const hiddenInDest = destCol.taskIds.filter(id=>id!==taskId && !orderedIdsInDom.includes(id));
  b.columns.forEach(c=>{ c.taskIds = c.taskIds.filter(id=>id!==taskId); });
  destCol.taskIds = [...orderedIdsInDom, ...hiddenInDest];
  if(laneKey && b.tasks[taskId]){
    const field = state.swimlaneBy==='assignee' ? 'assigneeId' : 'priority';
    b.tasks[taskId][field] = laneKeyToFieldValue(laneKey);
  }
  persistAndRender();
}

/* ===================== List view ===================== */
function renderList(){
  const b = curBoard();
  const wrap = document.getElementById('list-scroll');
  const allTasks = [];
  b.columns.forEach(col=>{
    col.taskIds.forEach(id=>{ const t=b.tasks[id]; if(t) allTasks.push({t, colName:col.name}); });
  });
  const filtered = allTasks.filter(x=>taskMatchesFilters(x.t));
  const groups = {};
  filtered.forEach(x=>{ (groups[x.colName]=groups[x.colName]||[]).push(x.t); });
  let html = `<table class="task-table"><thead><tr><th></th><th>Task</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Tags</th></tr></thead><tbody>`;
  Object.keys(groups).forEach(g=>{
    html += `<tr class="group-row"><td colspan="6">${esc(g)} · ${groups[g].length}</td></tr>`;
    groups[g].forEach(t=>{
      const a = t.assigneeId ? memberById(t.assigneeId) : null;
      const p = prio(t.priority);
      const ds = dueStatus(t.dueDate);
      html += `<tr class="task-row ${t.completed?'completed':''}" data-task-id="${t.id}">
        <td><div class="check-circle ${t.completed?'done':''}" data-action="toggle-complete" data-id="${t.id}">✓</div></td>
        <td class="lt">${esc(t.title)}</td>
        <td>${a?`<div class="avatar sm" style="background:${colorFor(a.id)}">${initials(a.name)}</div>`:'—'}</td>
        <td>${p?`<span class="meta-pill"><span class="prio-flag" style="background:${p.color}"></span>${p.label}</span>`:'—'}</td>
        <td>${t.dueDate?`<span class="meta-pill ${ds==='overdue'?'due-overdue':ds==='today'?'due-today':''}">${fmtDate(t.dueDate)}</span>`:'—'}</td>
        <td>${t.tagIds.map(id=>{const tg=tagById(id);return tg?`<span class="tag-pill" style="background:${tg.color}">${esc(tg.name)}</span>`:'';}).join(' ')}</td>
      </tr>`;
    });
  });
  html += '</tbody></table>';
  if(!filtered.length) html = '<div class="empty-hint">No tasks match your filters.</div>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('.check-circle').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); const id=el.dataset.id; const t=b.tasks[id]; toggleTaskComplete(b, t); persistAndRender(); };
  });
  wrap.querySelectorAll('.task-row').forEach(row=>{
    row.onclick = (e)=>{ if(e.target.closest('.check-circle')) return; openTaskModal(row.dataset.taskId); };
  });
}

/* ===================== Calendar view ===================== */
function renderCalendar(){
  const b = curBoard();
  const wrap = document.getElementById('calendar-scroll');
  const cursor = state.calendarCursor || todayISO().slice(0,7);
  const [year, month] = cursor.split('-').map(Number);
  const first = new Date(year, month-1, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const daysInPrevMonth = new Date(year, month-1, 0).getDate();
  const todayStr = todayISO();
  const tasksByDate = {};
  Object.values(b.tasks).filter(taskMatchesFilters).forEach(t=>{
    if(!t.dueDate) return;
    (tasksByDate[t.dueDate] = tasksByDate[t.dueDate] || []).push(t);
  });
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({day:daysInPrevMonth-startOffset+i+1, other:true, dateStr:null});
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({day:d, other:false, dateStr});
  }
  while(cells.length % 7 !== 0) cells.push({day:cells.length, other:true, dateStr:null});
  const monthName = first.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  wrap.innerHTML = `
    <div class="cal-head">
      <button class="btn small" id="cal-prev">‹</button>
      <h3>${monthName}</h3>
      <button class="btn small" id="cal-today">Today</button>
      <button class="btn small" id="cal-next">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        if(c.other) return `<div class="cal-cell other-month"><div class="cal-daynum">${c.day}</div></div>`;
        const items = (tasksByDate[c.dateStr]||[]);
        const isToday = c.dateStr===todayStr;
        return `<div class="cal-cell ${isToday?'is-today':''}" data-cal-date="${c.dateStr}">
          <div class="cal-daynum">${c.day}</div>
          ${items.slice(0,4).map(t=>`<div class="cal-pill ${dueStatus(t.dueDate)==='overdue'&&!t.completed?'p-overdue':''}" draggable="true" data-task-id="${t.id}" style="${t.cover?`background:${t.cover};color:#fff;`:''}">${esc(t.title)}</div>`).join('')}
          ${items.length>4?`<div class="cal-pill">+${items.length-4} more</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  wrap.querySelector('#cal-prev').onclick = ()=>{ shiftCalendar(year, month, -1); };
  wrap.querySelector('#cal-next').onclick = ()=>{ shiftCalendar(year, month, 1); };
  wrap.querySelector('#cal-today').onclick = ()=>{ state.calendarCursor = todayISO().slice(0,7); persistAndRender(); };
  wrap.querySelectorAll('[data-task-id]').forEach(el=>{
    el.onclick = ()=>openTaskModal(el.dataset.taskId);
    el.addEventListener('dragstart', (e)=>{ e.dataTransfer.setData('text/task-id', el.dataset.taskId); e.stopPropagation(); });
  });
  wrap.querySelectorAll('[data-cal-date]').forEach(cell=>{
    cell.addEventListener('dragover', (e)=>{ if(e.dataTransfer.types.includes('text/task-id')){ e.preventDefault(); cell.style.borderColor='var(--accent)'; } });
    cell.addEventListener('dragleave', ()=>{ cell.style.borderColor=''; });
    cell.addEventListener('drop', (e)=>{
      const taskId = e.dataTransfer.getData('text/task-id');
      if(!taskId) return;
      e.preventDefault();
      const tk = b.tasks[taskId];
      if(tk){ tk.dueDate = cell.dataset.calDate; logActivity(`Rescheduled "${tk.title}" to ${fmtDate(tk.dueDate)}`); }
      persistAndRender();
    });
  });
}
function shiftCalendar(year, month, delta){
  const d = new Date(year, month-1+delta, 1);
  state.calendarCursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  persistAndRender();
}

/* ===================== Column menu ===================== */
function closePopovers(){ document.querySelectorAll('.popover').forEach(p=>p.remove()); }
function openColumnMenu(anchor, colId){
  closePopovers();
  const b = curBoard();
  const col = b.columns.find(c=>c.id===colId);
  const pop = document.createElement('div');
  pop.className = 'popover';
  const r = anchor.getBoundingClientRect();
  pop.style.top = (r.bottom+6)+'px'; pop.style.left = Math.min(r.left, window.innerWidth-260)+'px';
  pop.innerHTML = `
    <h4>Column color</h4>
    <div class="swatch-row">
      <span class="color-swatch ${!col.color?'on':''}" data-colcolor="" style="background:var(--bg-elev3);border:1px solid var(--border);">✕</span>
      ${PALETTE.map(c=>`<span class="color-swatch ${col.color===c?'on':''}" data-colcolor="${c}" style="background:${c}"></span>`).join('')}
    </div>
    <div class="divider"></div>
    <h4>Sort cards</h4>
    <div class="row" data-sort="due">By due date</div>
    <div class="row" data-sort="priority">By priority</div>
    <div class="row" data-sort="title">By title (A–Z)</div>
    <div class="divider"></div>
    <h4>WIP limit</h4>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="number" min="0" id="wip-input" placeholder="None" value="${col.wipLimit||''}" style="width:70px;background:var(--bg-elev3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;">
      <button class="btn small" id="wip-set">Set</button>
      <button class="btn small" id="wip-clear">Clear</button>
    </div>
    <div class="divider"></div>
    <div class="row" data-action="clear-completed">Clear completed cards</div>
    <div class="row" data-action="delete-col" style="color:var(--red)">Delete column</div>
  `;
  document.body.appendChild(pop);
  pop.querySelectorAll('[data-colcolor]').forEach(sw=>{
    sw.onclick = ()=>{ col.color = sw.dataset.colcolor || null; closePopovers(); persistAndRender(); };
  });
  pop.querySelectorAll('[data-sort]').forEach(row=>{
    row.onclick = ()=>{
      const key = row.dataset.sort;
      col.taskIds.sort((a,c)=>{
        const ta=b.tasks[a], tc=b.tasks[c];
        if(key==='due') return (ta.dueDate||'9999').localeCompare(tc.dueDate||'9999');
        if(key==='priority'){ const order={urgent:0,high:1,medium:2,low:3,null:4}; return (order[ta.priority]??4)-(order[tc.priority]??4); }
        if(key==='title') return ta.title.localeCompare(tc.title);
        return 0;
      });
      closePopovers(); persistAndRender();
    };
  });
  pop.querySelector('#wip-set').onclick = ()=>{ const v=parseInt(pop.querySelector('#wip-input').value); col.wipLimit = isNaN(v)?null:v; closePopovers(); persistAndRender(); };
  pop.querySelector('#wip-clear').onclick = ()=>{ col.wipLimit=null; closePopovers(); persistAndRender(); };
  pop.querySelector('[data-action=clear-completed]').onclick = ()=>{
    const removed = col.taskIds.filter(id=>b.tasks[id]?.completed);
    removed.forEach(id=>{ state.trash.push({...b.tasks[id], _boardId:b.id, _colId:col.id, _deletedAt:Date.now()}); delete b.tasks[id]; });
    col.taskIds = col.taskIds.filter(id=>!removed.includes(id));
    logActivity(`Cleared ${removed.length} completed card(s) from "${col.name}"`);
    closePopovers(); persistAndRender();
  };
  pop.querySelector('[data-action=delete-col]').onclick = ()=>{
    if(confirm(`Delete column "${col.name}" and all its cards?`)){
      col.taskIds.forEach(id=>delete b.tasks[id]);
      b.columns = b.columns.filter(c=>c.id!==colId);
      logActivity(`Deleted column "${col.name}"`);
      closePopovers(); persistAndRender();
    }
  };
  setTimeout(()=>document.addEventListener('click', outsideClose), 0);
  function outsideClose(e){ if(!pop.contains(e.target)){ closePopovers(); document.removeEventListener('click', outsideClose); } }
}

  const commentInput = overlay.querySelector('#m-new-comment');

  function hideMentionBox(){ if(mentionBox){ mentionBox.remove(); mentionBox = null; } }
  commentInput.oninput = ()=>{
    const m = commentInput.value.match(/@([A-Za-z]*)$/);
    hideMentionBox();
    if(!m) return;
    const frag = m[1].toLowerCase();
    const matches = state.members.filter(mem=>mem.name.toLowerCase().includes(frag));

    mentionBox = document.createElement('div');
    mentionBox.className = 'mention-suggest';
    const r = commentInput.getBoundingClientRect();
    mentionBox.style.left = r.left+'px'; mentionBox.style.top = (r.top-Math.min(matches.length,5)*34-6)+'px';
    mentionBox.innerHTML = matches.slice(0,5).map((mem,i)=>`<div class="row ${i===0?'active':''}" data-mention="${mem.id}"><span class="avatar sm" style="background:${colorFor(mem.id)}">${initials(mem.name)}</span>${esc(mem.name)}</div>`).join('');
    document.body.appendChild(mentionBox);
    mentionBox.querySelectorAll('[data-mention]').forEach(row=>{
      row.onclick = ()=>{
        const mem = memberById(row.dataset.mention);
        commentInput.value = commentInput.value.replace(/@([A-Za-z]*)$/, `@${mem.name} `);
        hideMentionBox(); commentInput.focus();
      };
    });
  };
  overlay.querySelector('#m-new-comment').onkeydown = (e)=>{
    if(e.key==='Escape' && mentionBox){ e.stopPropagation(); hideMentionBox(); return; }
    if(e.key==='Enter' && mentionBox){ e.preventDefault(); mentionBox.querySelector('.row')?.click(); return; }
    if(e.key==='Enter' && e.target.value.trim()){
      t.comments.push({id:uid(), authorId:state.currentUserId, text:e.target.value.trim(), time:Date.now()});
      e.target.value=''; hideMentionBox(); renderComments();
      logActivity(`Commented on "${t.title}"`);
    }
  };
  overlay.querySelector('#m-delete').onclick = ()=>{
    if(confirm('Delete this task? You can restore it from Trash.')){
      const col = b.columns.find(c=>c.taskIds.includes(t.id));
      if(col) col.taskIds = col.taskIds.filter(id=>id!==t.id);
      state.trash.push({...t, _boardId:b.id, _colId:col?col.id:null, _deletedAt:Date.now()});
      delete b.tasks[t.id];
      logActivity(`Deleted task "${t.title}"`);
      overlay.remove();
      persistAndRender();
      toast('Task moved to trash', 'Undo', ()=>restoreFromTrashById(t.id));
    }
  };
  overlay.querySelector('#m-duplicate').onclick = ()=>{
    const copy = JSON.parse(JSON.stringify(t));
    copy.id = uid(); copy.title = t.title + ' (copy)'; copy.comments=[];
    b.tasks[copy.id]=copy;
    const col = b.columns.find(c=>c.taskIds.includes(t.id));
    col.taskIds.splice(col.taskIds.indexOf(t.id)+1, 0, copy.id);
    logActivity(`Duplicated task "${t.title}"`);
    overlay.remove();
    persistAndRender();
  };
}

/* ===================== Trash ===================== */
function restoreFromTrashById(id){
  const idx = state.trash.findIndex(x=>x.id===id);
  if(idx<0) return;
  restoreTrashItem(idx);
}
function restoreTrashItem(idx){
  const item = state.trash[idx];
  const board = state.boards.find(bd=>bd.id===item._boardId);
  if(!board){ toast('Original board no longer exists'); return; }
  const col = board.columns.find(c=>c.id===item._colId) || board.columns[0];
  if(!col){ toast('No column to restore into'); return; }
  const clean = {...item}; delete clean._boardId; delete clean._colId; delete clean._deletedAt;
  board.tasks[clean.id] = clean;
  col.taskIds.push(clean.id);
  state.trash.splice(idx,1);
  logActivity(`Restored task "${clean.title}"`);
  persistAndRender();
  renderTrashPanelIfOpen();
}
function renderTrashPanelIfOpen(){
  const existing = document.getElementById('trash-panel');
  if(existing) openTrashPanel();
}
function openTrashPanel(){
  closeSidePanels();
  const panel = document.createElement('div');
  panel.className = 'side-panel'; panel.id='trash-panel';
  panel.innerHTML = `<div class="side-panel-head">🗑 Trash <button class="close-x" id="trash-close" style="margin-left:auto">×</button></div>
    <div class="side-panel-body" id="trash-body"></div>`;
  document.body.appendChild(panel);
  panel.querySelector('#trash-close').onclick = ()=>panel.remove();
  const body = panel.querySelector('#trash-body');
  if(!state.trash.length){ body.innerHTML = '<div class="empty-hint">Trash is empty.</div>'; return; }
  body.innerHTML = state.trash.slice().reverse().map((item)=>{
    const realIdx = state.trash.findIndex(x=>x.id===item.id);
    return `<div class="trash-item"><div class="ti">${esc(item.title)}<div style="color:var(--text-faint);font-size:11px;">${timeAgo(item._deletedAt)}</div></div>
      <button class="btn small" data-restore="${realIdx}">Restore</button>
      <button class="iconbtn" data-purge="${realIdx}">✕</button></div>`;
  }).join('');
  body.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{ restoreTrashItem(parseInt(b.dataset.restore)); });
  body.querySelectorAll('[data-purge]').forEach(b=>b.onclick=()=>{ state.trash.splice(parseInt(b.dataset.purge),1); save(); openTrashPanel(); renderSidebar(); });
}
function closeSidePanels(){ document.querySelectorAll('.side-panel').forEach(p=>p.remove()); }

  pop.querySelectorAll('[data-fp]').forEach(c=>c.onclick=()=>{ toggleIn(f.priorities, c.dataset.fp); refresh(); });
  pop.querySelectorAll('[data-ft]').forEach(c=>c.onclick=()=>{ toggleIn(f.tagIds, c.dataset.ft); refresh(); });
  pop.querySelectorAll('[data-fd]').forEach(c=>c.onclick=()=>{ f.due = f.due===c.dataset.fd ? null : c.dataset.fd; refresh(); });

  setTimeout(()=>document.addEventListener('click', outsideClose), 0);
  function outsideClose(e){ if(!pop.contains(e.target) && e.target.id!=='btn-filter'){ closePopovers(); document.removeEventListener('click', outsideClose); } }

function buildCommandItems(){
  const items = [];
  items.push({icon:'＋', label:'New task', tag:'action', run:()=>document.getElementById('btn-new-task').click()});
  items.push({icon:'＋', label:'New board', tag:'action', run:()=>document.getElementById('btn-add-board').click()});
  items.push({icon:'🌓', label:'Cycle theme (dark / light / auto)', tag:'action', run:cycleTheme});
  items.push({icon:'↺', label:'Undo last action', tag:'action', run:undo});
  items.push({icon:'☑', label:'Toggle My Tasks filter', tag:'action', run:()=>document.getElementById('btn-my-tasks').click()});
  items.push({icon:'🗑', label:'Open Trash', tag:'action', run:openTrashPanel});
  items.push({icon:'⏱', label:'Open Activity log', tag:'action', run:openActivityPanel});
  items.push({icon:'📑', label:'Manage templates', tag:'action', run:openTemplatesModal});
  items.push({icon:'🧩', label:'Manage custom fields', tag:'action', run:()=>openCustomFieldsModal(curBoard().id)});
  items.push({icon:'⭳', label:'Export data (JSON)', tag:'action', run:exportData});
  items.push({icon:'📋', label:'Board view', tag:'view', run:()=>{ state.view='board'; persistAndRender(); }});
  items.push({icon:'📋', label:'List view', tag:'view', run:()=>{ state.view='list'; persistAndRender(); }});
  items.push({icon:'📋', label:'Calendar view', tag:'view', run:()=>{ state.view='calendar'; persistAndRender(); }});
  items.push({icon:'🧵', label:'Group by assignee (swimlanes)', tag:'view', run:()=>{ state.swimlaneBy='assignee'; state.view='board'; persistAndRender(); }});
  items.push({icon:'🧵', label:'Group by priority (swimlanes)', tag:'view', run:()=>{ state.swimlaneBy='priority'; state.view='board'; persistAndRender(); }});
  items.push({icon:'🧵', label:'Remove grouping', tag:'view', run:()=>{ state.swimlaneBy=null; persistAndRender(); }});
  state.boards.forEach(b=>{
    items.push({icon:b.icon||'📋', label:`Go to board: ${b.name}`, tag:'board', run:()=>{ state.currentBoardId=b.id; persistAndRender(); }});
  });
  state.boards.forEach(bd=>{
    Object.values(bd.tasks).forEach(t=>{
      const sameBoard = bd.id===state.currentBoardId;
      items.push({
        icon: t.completed?'✅':'▢',
        label: sameBoard ? t.title : `${t.title}  —  ${bd.name}`,
        tag:'task',
        run: ()=>{ state.currentBoardId = bd.id; persistAndRender(); openTaskModal(t.id); },
      });
    });
  });
  return items;
}
function openCommandPalette(){
  document.querySelectorAll('.cmdk-overlay').forEach(o=>o.remove());
  const allItems = buildCommandItems();
  let active = 0;
  const overlay = document.createElement('div');
  overlay.className = 'cmdk-overlay';
  overlay.innerHTML = `<div class="cmdk">
    <input type="text" id="cmdk-input" placeholder="Search tasks, boards, actions...">
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const input = overlay.querySelector('#cmdk-input');
  const resultsEl = overlay.querySelector('#cmdk-results');
  let shown = allItems.slice(0, 40);
  function draw(){
    resultsEl.innerHTML = shown.map((it,i)=>`<div class="cmdk-item ${i===active?'active':''}" data-i="${i}"><span>${it.icon}</span><span>${esc(it.label)}</span><span class="tag">${it.tag}</span></div>`).join('') || '<div class="empty-hint">No matches.</div>';
    resultsEl.querySelectorAll('.cmdk-item').forEach(el=>{
      el.onclick = ()=>{ shown[parseInt(el.dataset.i)].run(); overlay.remove(); };
    });
  }
  input.oninput = ()=>{
    const q = input.value.toLowerCase();
    shown = (q? allItems.filter(it=>it.label.toLowerCase().includes(q)) : allItems).slice(0,40);
    active = 0; draw();
  };
  input.onkeydown = (e)=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); active = Math.min(active+1, shown.length-1); draw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); active = Math.max(active-1, 0); draw(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(shown[active]){ shown[active].run(); overlay.remove(); } }
  };
  draw();
  setTimeout(()=>input.focus(), 0);
}

function deleteBoard(id){
  if(state.boards.length<=1){ toast("Can't delete the only board"); return; }
  state.boards = state.boards.filter(b=>b.id!==id);
  if(state.currentBoardId===id) state.currentBoardId = state.boards[0].id;
  logActivity('Deleted a board');
  persistAndRender();
}

const BOARD_EMOJIS = ['📋','🚀','📱','🎯','🛠','💡','📊','🎨','🐛','📦','🧪','🏗','📣','🗂','⚙️','🌱'];
function openBoardMenu(anchor, boardId){
  closePopovers();
  const b = state.boards.find(x=>x.id===boardId);
  const pop = document.createElement('div');
  pop.className = 'popover';
  const r = anchor.getBoundingClientRect();
  pop.style.top = (r.bottom+6)+'px'; pop.style.left = Math.min(r.left, window.innerWidth-260)+'px';
  pop.innerHTML = `
    <h4>Icon</h4>
    <div class="emoji-grid">${BOARD_EMOJIS.map(em=>`<span data-icon="${em}">${em}</span>`).join('')}</div>
    <div class="divider"></div>
    <div class="row" data-action="rename">Rename board</div>
    <div class="row" data-action="duplicate">Duplicate board</div>
    <div class="row" data-action="archive">${b.archived?'Unarchive board':'Archive board'}</div>
    <div class="row" data-action="fields">Custom fields...</div>
    <div class="divider"></div>
    <div class="row" data-action="delete" style="color:var(--red)">Delete board</div>
  `;
  document.body.appendChild(pop);
  pop.querySelectorAll('[data-icon]').forEach(sp=>sp.onclick=()=>{ b.icon = sp.dataset.icon; closePopovers(); persistAndRender(); });
  pop.querySelector('[data-action=rename]').onclick = ()=>{
    const name = prompt('Board name:', b.name);
    if(name && name.trim()){ b.name = name.trim(); }
    closePopovers(); persistAndRender();
  };
  pop.querySelector('[data-action=duplicate]').onclick = ()=>{
    const copy = JSON.parse(JSON.stringify(b));
    copy.id = uid(); copy.name = b.name + ' (copy)'; copy.starred = false;
    const idMap = {};
    copy.columns.forEach(col=>{
      const oldTaskIds = col.taskIds;
      col.id = uid();
      col.taskIds = oldTaskIds.map(oldId=>{
        const newId = uid(); idMap[oldId] = newId; return newId;
      });
    });
    const newTasks = {};
    Object.keys(b.tasks).forEach(oldId=>{
      if(idMap[oldId]) newTasks[idMap[oldId]] = {...b.tasks[oldId], id:idMap[oldId]};
    });
    copy.tasks = newTasks;
    state.boards.push(copy);
    state.currentBoardId = copy.id;
    logActivity(`Duplicated board "${b.name}"`);
    closePopovers(); persistAndRender();
  };
  pop.querySelector('[data-action=archive]').onclick = ()=>{
    b.archived = !b.archived;
    if(b.archived && state.currentBoardId===b.id){
      const fallback = state.boards.find(x=>!x.archived);
      if(fallback) state.currentBoardId = fallback.id;
    }
    logActivity(`${b.archived?'Archived':'Unarchived'} board "${b.name}"`);
    closePopovers(); persistAndRender();
  };
  pop.querySelector('[data-action=fields]').onclick = ()=>{ closePopovers(); openCustomFieldsModal(b.id); };
  pop.querySelector('[data-action=delete]').onclick = ()=>{
    if(confirm(`Delete board "${b.name}"? This cannot be undone.`)) deleteBoard(boardId);
    closePopovers();
  };
  setTimeout(()=>document.addEventListener('click', outsideClose), 0);
  function outsideClose(e){ if(!pop.contains(e.target)){ closePopovers(); document.removeEventListener('click', outsideClose); } }
}

/* ===================== Export / Import ===================== */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'flowboard-export.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.boards) throw new Error('bad file');
      if(confirm('This will replace all current data. Continue?')){
        state = parsed;
        save(); render();
        toast('Data imported');
      }
    }catch(e){ toast('Invalid file'); }
  };
  reader.readAsText(file);
}

document.getElementById('board-scroll').addEventListener('keydown', (e)=>{
  const card = e.target.closest ? e.target.closest('.card') : null;
  if(!card) return;
  const currentBody = card.closest('.column-body');
  const cardsInBody = [...currentBody.querySelectorAll('.card')];
  const idx = cardsInBody.indexOf(card);
  if(e.key==='ArrowDown'){ e.preventDefault(); cardsInBody[idx+1]?.focus(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cardsInBody[idx-1]?.focus(); }
  else if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
    e.preventDefault();
    const allBodies = [...document.querySelectorAll('#board-scroll .column-body')];
    const bodyIdx = allBodies.indexOf(currentBody);
    const targetBody = allBodies[bodyIdx + (e.key==='ArrowRight'?1:-1)];
    if(targetBody){
      const targetCards = [...targetBody.querySelectorAll('.card')];
      if(targetCards.length) targetCards[Math.min(idx, targetCards.length-1)].focus();
    }
  }
  else if(e.key==='Enter'){ e.preventDefault(); openTaskModal(card.dataset.taskId); }
  else if(e.key===' '){
    e.preventDefault();
    const b = curBoard(); const t = b.tasks[card.dataset.taskId];
    if(t){ toggleTaskComplete(b, t); const taskId = t.id; persistAndRender(); document.querySelector(`.card[data-task-id="${taskId}"]`)?.focus(); }
  }
});

document.addEventListener('keydown', (e)=>{
  const tag = (document.activeElement.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || document.activeElement.isContentEditable;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCommandPalette(); return; }
  if(e.key==='Escape'){
    closePopovers(); closeSidePanels();
    document.querySelectorAll('.overlay,.cmdk-overlay').forEach(o=>o.remove());
    persistAndRender(); return;
  }
  if(typing) return;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(e.key==='/'){ e.preventDefault(); document.getElementById('search-input').focus(); }
  if(e.key.toLowerCase()==='n'){ e.preventDefault(); document.getElementById('btn-new-task').click(); }
  if(e.key.toLowerCase()==='t'){ e.preventDefault(); cycleTheme(); }
  if(e.key==='?'){ e.preventDefault(); openShortcutsModal(); }
});

/* ===================== Init ===================== */
render();
</script>
</body>
</html>
