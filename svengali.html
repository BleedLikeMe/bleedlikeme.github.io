<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svengali — Artist Management</title>
<style>
:root{
  --bg:#0b0d12; --panel:#151923; --panel2:#1b202c; --border:#2a3142;
  --gold:#d4af37; --gold-dim:#9c8329; --text:#e8e9ee; --dim:#98a0b3;
  --good:#4caf7d; --bad:#d1595a; --warn:#e0a63a; --pink:#c069c7; --blue:#5b8dd6;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
h1,h2,h3,h4{margin:0 0 8px;font-weight:700;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

/* ---------- Setup screen ---------- */
#setupScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 0%, #1c2233 0%, #0b0d12 60%);}
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:36px 40px;max-width:460px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);}
.setup-card h1{font-size:2.4em;letter-spacing:2px;color:var(--gold);text-align:center;}
.tagline{text-align:center;color:var(--dim);margin-bottom:24px;font-style:italic;}
.setup-card label{display:block;margin-bottom:16px;font-size:.85em;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.setup-card input{width:100%;margin-top:6px;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:1em;}
.tier-options{display:flex;gap:8px;margin-top:8px;}
.tier-options button, .lean-options button{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:10px 6px;font-size:.85em;text-align:center;}
.tier-options button small{display:block;color:var(--dim);font-weight:normal;margin-top:4px;}
.tier-options button.selected{border-color:var(--gold);background:#2a2412;color:var(--gold);}
#btnStart{width:100%;margin-top:10px;padding:14px;background:var(--gold);border:none;border-radius:8px;color:#1a1305;
  font-weight:700;font-size:1.05em;letter-spacing:1px;}
#btnStart:hover{background:#e5c04f;}
#btnContinue{width:100%;margin-top:10px;padding:10px;background:transparent;border:1px solid var(--border);border-radius:8px;
  color:var(--dim);}

/* ---------- Main shell ---------- */
#gameScreen{min-height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);
  flex-wrap:wrap;}
#topbar .brand{font-weight:700;color:var(--gold);letter-spacing:1px;margin-right:auto;}
#topbar .brand small{display:block;color:var(--dim);font-weight:normal;font-size:.7em;letter-spacing:0;}
.stat-chip{font-size:.85em;color:var(--dim);}
.stat-chip b{color:var(--text);}
.ap-pips{display:flex;gap:4px;}
.ap-pip{width:12px;height:12px;border-radius:50%;background:var(--border);}
.ap-pip.filled{background:var(--gold);}
#btnEndWeek{background:var(--good);border:none;color:#04150a;font-weight:700;padding:9px 16px;border-radius:8px;}
#btnEndWeek:hover{background:#5ec98e;}
#btnNewGame{background:transparent;border:1px solid var(--border);color:var(--dim);padding:9px 12px;border-radius:8px;font-size:.85em;}

#shell{display:flex;flex:1;min-height:0;}
#nav{width:180px;flex:0 0 180px;background:var(--panel);border-right:1px solid var(--border);padding:14px 0;}
#nav button{display:block;width:100%;text-align:left;padding:11px 20px;background:none;border:none;color:var(--dim);font-size:.95em;
  border-left:3px solid transparent;}
#nav button:hover{color:var(--text);}
#nav button.active{color:var(--gold);border-left-color:var(--gold);background:var(--panel2);}
#content{flex:1;padding:22px;overflow-y:auto;}

/* ---------- Cards / grids ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.statcard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.statcard .val{font-size:1.6em;font-weight:700;color:var(--gold);}
.statcard .lbl{color:var(--dim);font-size:.78em;text-transform:uppercase;letter-spacing:1px;margin-top:4px;}

/* ---------- Tables ---------- */
.card{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;min-width:640px;}
table.data th{text-align:left;color:var(--dim);font-size:.75em;text-transform:uppercase;letter-spacing:.5px;
  padding:6px 10px;border-bottom:1px solid var(--border);}
table.data td{padding:8px 10px;border-bottom:1px solid #1e2432;font-size:.92em;vertical-align:middle;}
table.data tr:hover td{background:#1a1f2b;}
table.data tr.clickable{cursor:pointer;}
table.log-data{min-width:0;}
table.log-data td{white-space:normal !important;}

/* ---------- Badges & bars ---------- */
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.72em;font-weight:600;letter-spacing:.3px;}
.badge-genre{background:#22283a;color:var(--blue);border:1px solid #33405c;}
.badge-prospect{background:#2a2718;color:var(--warn);border:1px solid #4a3f1e;}
.badge-roster{background:#1c2a24;color:var(--good);border:1px solid #2a4436;}
.badge-contracted{background:#241c2e;color:var(--pink);border:1px solid #3d2a4a;}
.badge-tour{background:#1c2536;color:var(--blue);border:1px solid #2a3c58;}
.badge-brokenup{background:#2a1c1c;color:var(--bad);border:1px solid #4a2a2a;}
.bar{height:7px;background:#20263344;border:1px solid var(--border);border-radius:4px;overflow:hidden;width:100%;min-width:60px;}
.bar-fill{height:100%;}
.bar-fill.morale,.bar-fill.chem{background:var(--good);}
.bar-fill.heat{background:var(--bad);}
.bar-fill.buzz{background:var(--pink);}
.bar-fill.fame{background:var(--gold);}
.bar-row{display:flex;align-items:center;gap:6px;}
.bar-row span{font-size:.72em;color:var(--dim);width:34px;flex:0 0 34px;}
.trend-up{color:var(--good);} .trend-down{color:var(--bad);} .trend-flat{color:var(--dim);}

/* ---------- Buttons ---------- */
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:7px;font-size:.88em;margin:2px 4px 2px 0;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1305;font-weight:700;}
.btn.primary:hover{background:#e5c04f;}
.btn.danger{border-color:#5a2a2a;color:var(--bad);}
.btn.danger:hover{background:#2a1414;}
.btn.small{padding:5px 10px;font-size:.78em;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border);color:var(--text);}
.actiongrid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}

/* ---------- Modal ---------- */
#modalRoot{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;
  background:rgba(4,5,8,.72);overflow-y:auto;z-index:50;}
#modalRoot.hidden{display:none;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:640px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);margin-bottom:4vh;}
.modal-box h2{color:var(--gold);}
.modal-box .close-row{text-align:right;margin-top:16px;}
.choice-card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px;}
.choice-card .meta{color:var(--dim);font-size:.8em;margin:4px 0 8px;}
.member-check{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;
  background:var(--panel2);cursor:pointer;}
.member-check.selected{border-color:var(--gold);}
.member-check input{pointer-events:none;}
.song-check{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border:1px solid var(--border);
  border-radius:7px;margin-bottom:5px;background:var(--panel2);cursor:pointer;}
.song-check.selected{border-color:var(--gold);}

/* ---------- Log / achievements ---------- */
.log-entry{padding:6px 0;border-bottom:1px solid #1e2432;font-size:.87em;}
.log-entry .wk{color:var(--dim);margin-right:8px;font-size:.85em;}
.log-entry.tag-money,.log-entry.tag-deal{color:var(--gold);}
.log-entry.tag-chart{color:var(--pink);}
.log-entry.tag-event,.log-entry.tag-warn{color:var(--warn);}
.log-entry.tag-achieve{color:var(--good);}
.log-entry.tag-promo{color:var(--blue);}
.ach-list{display:flex;flex-wrap:wrap;gap:8px;}
.ach-chip{background:#1c2a24;border:1px solid #2a4436;color:var(--good);padding:5px 11px;border-radius:14px;font-size:.78em;}

/* ---------- Game over ---------- */
#gameOverScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;padding:20px;}
.go-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:40px;max-width:520px;text-align:center;}
.go-card h1{color:var(--bad);font-size:2em;}

/* ---------- Person / band detail ---------- */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.detail-header h2{margin:0;}
.stat-mini{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;}
.stat-mini div{font-size:.8em;color:var(--dim);}
.stat-mini b{display:block;color:var(--text);font-size:1.1em;}
.section-title{color:var(--gold);text-transform:uppercase;font-size:.78em;letter-spacing:1px;margin:18px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.table-wrap{overflow-x:auto;}
.deal-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.88em;}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  #shell{flex-direction:column;}
  #nav{width:100%;flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;padding:6px;border-right:none;border-bottom:1px solid var(--border);}
  #nav button{display:inline-block;width:auto;flex:0 0 auto;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:9px 12px;text-align:center;}
  #nav button.active{border-left-color:transparent;border-bottom-color:var(--gold);}
  .grid2,.grid3,.grid4{grid-template-columns:1fr;}
  table.data{min-width:560px;}
  table.log-data{min-width:0;}
  #topbar{gap:10px;}
}
</style>
</head>

<div id="setupScreen">

    </label>

    </label>

        <button data-action="pickDifficulty" data-diff="normal" class="selected">Normal<small>£6,000</small></button>
        <button data-action="pickDifficulty" data-diff="hard">Hard<small>£2,500</small></button>
      </div>
    </label>
    <button id="btnStart" data-action="startGame">Open For Business</button>
    <button id="btnContinue" class="hidden" data-action="continueGame">Continue Previous Agency</button>
  </div>
</div>

<div id="gameScreen" class="hidden">
  <div id="topbar"></div>
  <div id="shell">
    <nav id="nav"></nav>
    <main id="content"></main>

</div>

<div id="gameOverScreen" class="hidden"></div>

let _uid=1;
function uid(){ return 'id'+(_uid++); }
function rrange(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function rrangeF(min,max){ return Math.random()*(max-min)+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(n,lo,hi){ return Math.max(lo,Math.min(hi,n)); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function avg(arr,key){ if(!arr.length) return 0; return arr.reduce((s,x)=>s+(key?x[key]:x),0)/arr.length; }
function fmtMoney(n){ const neg=n<0; n=Math.round(Math.abs(n)); return (neg?'-':'')+'£'+n.toLocaleString(); }
function fmtSigned(n){ n=Math.round(n); return (n>=0?'+':'')+n.toLocaleString(); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function genPersonName(){ return pick(FIRST_NAMES)+' '+pick(SURNAMES); }
function genBandName(){
  if(Math.random()<0.4) return pick(BAND_SINGLE);
  const prefix = Math.random()<0.5 ? 'The ' : '';
  return prefix+pick(BAND_ADJ)+' '+pick(BAND_NOUN);
}
function pickTwo(arr){
  const a = pick(arr);
  let b = pick(arr), guard = 0;
  while(b===a && guard++<5) b = pick(arr);
  return [a,b];
}

function repTitle(rep){ return rep>=80?'Legend':rep>=60?'Industry Player':rep>=40?'Respected':rep>=20?'Up-and-Comer':'Unknown'; }
function personalityName(id){ const p=PERSONALITIES.find(x=>x.id===id); return p?p.name:id; }
function labelById(id){ return LABELS.find(l=>l.id===id); }
function publisherById(id){ return PUBLISHERS.find(p=>p.id===id); }
function statusLabel(band){
  if(band.tour) return 'On Tour';
  if(band.recordDeal) return 'Signed (Label)';
  return 'Roster';
}
function statusClass(band){
  if(band.tour) return 'badge-tour';
  if(band.recordDeal) return 'badge-contracted';
  return 'badge-roster';
}
function compatOf(a,b){ if(a>b){ const t=a; a=b; b=t; } const key=a+'-'+b; return PERSONALITY_COMPAT[key]!==undefined ? PERSONALITY_COMPAT[key] : 0; }
function bandCompatAvg(band){
  if(band.members.length<2) return 5;
  ensureRelationships(band);
  const vals = Object.values(band.relationships).map(r=>r.bond);
  return vals.length ? avg(vals)/2 : 5;
}
function relKey(id1,id2){ return [id1,id2].sort().join('__'); }
function ensureRelationships(band){
  band.relationships = band.relationships || {};
  const m = band.members;
  for(let i=0;i<m.length;i++) for(let j=i+1;j<m.length;j++){
    const key = relKey(m[i].id,m[j].id);
    if(!band.relationships[key]){
      band.relationships[key] = { a:m[i].id, b:m[j].id, bond: clamp(compatOf(m[i].personality,m[j].personality)*2 + rrange(-15,15), -80, 80), romance:false, partnership:false };
    }
  }
}
function cleanupRelationships(band){
  const ids = new Set(band.members.map(m=>m.id));
  Object.keys(band.relationships||{}).forEach(k=>{
    const r = band.relationships[k];
    if(!ids.has(r.a) || !ids.has(r.b)) delete band.relationships[k];
  });
}
function tickRelationships(band){
  ensureRelationships(band);
  Object.values(band.relationships).forEach(r=>{
    const m1 = band.members.find(m=>m.id===r.a), m2 = band.members.find(m=>m.id===r.b);
    if(!m1||!m2) return;
    const target = compatOf(m1.personality,m2.personality)*2;
    r.bond = clamp(r.bond + (target-r.bond)*0.03 + rrange(-6,6), -100, 100);
  });
}
function relLabel(bond){
  if(bond>=55) return 'Best Mates';
  if(bond>=20) return 'Get On Well';
  if(bond>-20) return 'Cordial';
  if(bond>-55) return 'Tense';
  return 'Rivals';
}
function hasStaff(roleId){ return G.staff.some(s=>s.roleId===roleId); }
function getStaff(roleId){ return G.staff.find(s=>s.roleId===roleId); }
function staffById(roleId){ return STAFF_ROLES.find(s=>s.id===roleId); }
function skillLabel(skill){
  if(skill>=1.2) return 'Exceptional';
  if(skill>=1.05) return 'Skilled';
  if(skill>=0.9) return 'Solid';
  if(skill>=0.8) return 'Green';
  return 'Struggling';
}
function makeStaffCandidate(roleId){
  const role = staffById(roleId);
  const skill = Math.round(rrangeF(CONFIG.STAFF_SKILL_MIN,CONFIG.STAFF_SKILL_MAX)*100)/100;
  return { id:uid(), name:genPersonName(), roleId, skill,
    hireCost: Math.round(role.hireCost*skill), salary: Math.round(role.salary*skill) };
}
function ensureStaffMarket(){
  STAFF_ROLES.forEach(role=>{
    if(hasStaff(role.id)) return;
    if(!G.staffMarket.some(c=>c.roleId===role.id)) G.staffMarket.push(makeStaffCandidate(role.id));
  });
  G.staffMarket = G.staffMarket.filter(c=>!hasStaff(c.roleId));
}
function tickStaffMarket(){
  ensureStaffMarket();
  if(G.week>=G.nextStaffRefreshWeek){
    G.nextStaffRefreshWeek = G.week + rrange(CONFIG.STAFF_REFRESH_MIN, CONFIG.STAFF_REFRESH_MAX);
    if(G.staffMarket.length){
      const idx = rrange(0,G.staffMarket.length-1);
      const roleId = G.staffMarket[idx].roleId, oldName = G.staffMarket[idx].name;
      G.staffMarket[idx] = makeStaffCandidate(roleId);
      addLog(`${oldName} takes a job elsewhere — ${G.staffMarket[idx].name} is now on the market as a ${staffById(roleId).name}.`,'info');
    }
  }
}
function tourSupportCost(scale){ const tm=getStaff('tourmgr'); return tm ? Math.round(scale.supportCost*(1-0.25*tm.skill)) : scale.supportCost; }

let G = null;

function makeMember(role){
  const personality = pick(PERSONALITIES).id;
  const m = {
    id: uid(),
    name: genPersonName(),
    role,
    personality,
    songwriting: rrange(20,70),
    performance: rrange(25,75),
    charisma: rrange(20,75),
    reliability: rrange(40,85),
    morale: rrange(55,80),
    soloFlag: false,
    criticalMoraleWeeks: 0,
    founding: false,
  };
  if(personality==='wild'){ m.charisma+=12; m.reliability-=15; }
  if(personality==='perf'){ m.songwriting+=15; }
  if(personality==='diva'){ m.charisma+=15; m.reliability-=5; }
  if(personality==='pro'){ m.reliability+=10; m.morale+=5; }
  if(personality==='peace'){ m.morale+=5; }
  ['songwriting','performance','charisma','reliability','morale'].forEach(k=>m[k]=clamp(m[k],5,99));
  return m;
}

function makeBand(fameBias){
  fameBias = fameBias||0;
  const roles = shuffle(ROLES.slice());
  const n = rrange(3,5);
  const members = roles.slice(0,n).map(r=>makeMember(r));
  members.forEach(m=>m.founding=true);
  const band = {
    id: uid(),
    name: genBandName(),
    genre: pick(GENRES),
    members,
    chemistry: rrange(35,65),
    fame: clamp(rrange(1,10)+Math.round(fameBias),0,100),
    buzz: 0,
    heat: 0,
    catalog: [],
    singles: [],
    albums: [],
    recordDeal: null,
    publishingDeal: null,
    tour: null,
    tourHistory: [],
    status: 'prospect',
    weeksSinceRelease: 0,
    sponsorship: null,
    signedWeek: null,
    relationships: {},
    leaderId: null,
  };
  ensureRelationships(band);
  band.leaderId = members.reduce((best,m)=>m.charisma>best.charisma?m:best).id;
  return band;
}

function findBand(id){ return G.bands.find(b=>b.id===id) || G.prospects.find(b=>b.id===id); }

function memberDeparts(band, memberId){
  const idx = band.members.findIndex(m=>m.id===memberId);
  if(idx<0) return null;
  const member = band.members.splice(idx,1)[0];
  band.chemistry = clamp(band.chemistry-10,0,100);
  cleanupRelationships(band);
  if(band.leaderId===memberId){
    band.leaderId = band.members.length ? band.members.reduce((best,m)=>m.charisma>best.charisma?m:best).id : null;
  }
  if(band.members.length<2){
    const bidx = G.bands.indexOf(band);
    if(bidx>=0) G.bands.splice(bidx,1);
    addLog(`${band.name} have officially split up — too few members left to carry on.`,'band');
  }
  return member;
}

function fireMember(bandId, memberId){
  const band = findBand(bandId);
  if(!band) return;
  if(band.members.length<=1){ addLog('Use "Drop Act" to let go of a solo act.','warn'); return; }
  if(!spendAP()) return;
  const member = band.members.find(m=>m.id===memberId);
  if(!member) return;
  const wasFounding = member.founding, bandName = band.name, memberName = member.name;
  memberDeparts(band, memberId);
  if(!G.bands.includes(band)) return;
  if(wasFounding){
    const fameLoss = clamp(band.fame*0.15,2,20);
    band.fame = clamp(band.fame-fameLoss,0,100);
    band.heat = clamp(band.heat+20,0,100);
    G.reputation = clamp(G.reputation-2,0,100);
    addLog(`Sacking founding member ${memberName} from ${bandName} doesn't sit well with longtime fans — a real backlash.`,'band');
  } else {
    band.chemistry = clamp(band.chemistry+3,0,100);
    addLog(`${memberName} is let go from ${bandName}. Barely a ripple.`,'band');
  }
}

function setLeader(bandId, memberId){
  const band = findBand(bandId);
  const m = band && band.members.find(x=>x.id===memberId);
  if(!band||!m) return;
  band.leaderId = memberId;
  addLog(`${m.name} becomes the face of ${band.name}.`,'band');
}

function makeSoloAct(member, genre, fame){
  const clone = Object.assign({}, member, { id:uid(), soloFlag:false, criticalMoraleWeeks:0, morale:clamp(member.morale+10,0,100), founding:true });
  return {
    id:uid(), name:member.name, genre, members:[clone], chemistry:75, fame:clamp(Math.round(fame),1,100),
    buzz:0, heat:0, catalog:[], singles:[], albums:[], recordDeal:null, publishingDeal:null,
    tour:null, tourHistory:[], status:'prospect', weeksSinceRelease:0, sponsorship:null, signedWeek:null,

}

/* =========================================================================
   CORE ACTIONS

function spendAP(){
  if(G.ap<=0){ addLog('No time left this week — end the week to continue.','warn'); return false; }
  G.ap--; return true;
}

function doScout(){
  if(G.prospects.length>=CONFIG.MAX_PROSPECTS){ addLog('Your scouting list is full — sign or pass on someone first.','warn'); return; }
  if(!spendAP()) return;
  let n = rrange(1,2);
  const ar = getStaff('ar');
  if(ar) n += 1;
  const fameBonus = G.reputation*0.15 + (ar?8*ar.skill:0);
  for(let i=0;i<n;i++){
    if(G.prospects.length>=CONFIG.MAX_PROSPECTS) break;
    G.prospects.push(makeBand(fameBonus));
  }
  addLog(`Your scouts turn up ${n} new act(s) worth a look.`,'scout');
}

function doSignBand(prospectId){
  if(G.cash<CONFIG.SIGN_COST){ addLog('Not enough cash to cover the signing meeting.','warn'); return; }
  if(!spendAP()) return;
  const idx = G.prospects.findIndex(b=>b.id===prospectId);

}

function passProspect(prospectId){
  const idx = G.prospects.findIndex(b=>b.id===prospectId);
  if(idx<0) return;
  const band = G.prospects.splice(idx,1)[0];
  addLog(`You pass on ${band.name}.`,'scout');
}

function dropBand(bandId){

}

function commitSongwriting(bandId){
  const band = findBand(bandId);
  const memberIds = G.ui.tempSelect;
  if(!memberIds.length){ addLog('Pick at least one member to write with.','warn'); return; }
  if(!spendAP()) return;
  const parts = band.members.filter(m=>memberIds.includes(m.id));
  let q = avg(parts,'songwriting')*0.55 + band.chemistry*0.2 + rrange(-15,15);
  if(parts.some(m=>m.personality==='perf')) q += 12;
  ensureRelationships(band);
  let partnershipHit = false;
  Object.values(band.relationships).forEach(r=>{
    if(r.partnership && memberIds.includes(r.a) && memberIds.includes(r.b)){ q += 14; partnershipHit = true; }
  });
  q = clamp(Math.round(q),5,99);
  const song = { id:uid(), title:genSongTitle(), genre:band.genre, quality:q, writers:parts.map(m=>m.id), recorded:false, writtenWeek:G.week };
  band.catalog.push(song);
  let msg;
  if(partnershipHit) msg = `${band.name}'s songwriting partnership clicks again on "${song.title}" (Quality ${q}).`;
  else if(q>=80) msg = `${band.name} just wrote something special: "${song.title}" (Quality ${q}).`;
  else if(q<=25) msg = `${band.name}'s writing session on "${song.title}" fell flat (Quality ${q}).`;
  else msg = `${band.name} wrote a new song: "${song.title}" (Quality ${q}).`;
  addLog(msg,'song');
  band.chemistry = clamp(band.chemistry+rrange(-1,3),0,100);
  closeModal();
}

function studioCost(mode, trackCount){ return mode==='single' ? 550 : 700*trackCount; }

function commitStudio(bandId){
  const band = findBand(bandId);
  const mode = G.ui.studioMode;
  const songIds = G.ui.tempSelect;
  if(mode==='single' && songIds.length!==1){ addLog('Pick exactly one song to record as a single.','warn'); return; }
  if(mode==='album' && songIds.length<4){ addLog('You need at least 4 unrecorded songs for an album.','warn'); return; }
  if(!spendAP()) return;
  const cost = studioCost(mode, songIds.length);
  let fundedByLabel=false;
  if(band.recordDeal && band.recordDeal.advanceRemaining>=cost){
    band.recordDeal.advanceRemaining -= cost; fundedByLabel=true;
  } else if(G.cash>=cost){
    G.cash -= cost;
  } else {
    addLog(`Not enough cash to book studio time (needs ${fmtMoney(cost)}).`,'warn');
    G.ap++; return;
  }
  const songs = songIds.map(id=>band.catalog.find(s=>s.id===id)).filter(Boolean);
  songs.forEach(s=>s.recorded=true);
  const release = {
    id:uid(), title: mode==='single' ? songs[0].title : genAlbumTitle(),
    type:mode, trackIds:songIds.slice(), releaseWeek:G.week, chartPeak:null, weeksOnChart:0, active:true, fundedByLabel, promo:null,
  };
  (mode==='single' ? band.singles : band.albums).push(release);
  band.weeksSinceRelease = 0;
  if(mode==='album' && band.recordDeal){
    band.recordDeal.albumsDelivered++;
    band.recordDeal.albumsOwed--;
    if(band.recordDeal.albumsOwed<=0){
      addLog(`${band.name} fulfil their record deal — free agents once again.`,'deal');
      band.recordDeal = null;
    }
  }
  addLog(`${band.name} release ${mode==='single'?'the single':'the album'} "${release.title}"! ${fundedByLabel?'(label-funded)':''}`,'release');
  closeModal();
}

function recordPitchChance(band, label){
  let chance = 0.35;
  chance += (G.reputation-40)*0.004;
  chance += (band.fame-label.famReq)*0.01;
  const bestSongQ = band.catalog.length ? Math.max(...band.catalog.map(s=>s.quality)) : 20;
  chance += (bestSongQ-50)*0.006;
  if(label.genres.includes(band.genre)) chance += 0.12;
  chance += band.buzz*0.002;
  return clamp(chance,0.05,0.92);
}
function publishingPitchChance(band, pub){
  let chance = 0.4 + (G.reputation-40)*0.004 + band.fame*0.005;
  const bestSongQ = band.catalog.length ? Math.max(...band.catalog.map(s=>s.quality)) : 20;
  chance += (bestSongQ-50)*0.005;
  return clamp(chance,0.08,0.9);
}

function pitchRecordDeal(bandId, labelId){
  const band = findBand(bandId); const label = labelById(labelId);
  if(!spendAP()) return;
  const chance = recordPitchChance(band, label);
  if(Math.random()<chance){
    const fameF = 0.5 + band.fame/100;
    const advance = Math.round(clamp(rrange(label.advanceMin,label.advanceMax)*fameF, label.advanceMin, label.advanceMax*1.4));
    const royalty = Math.round((rrangeF(label.royaltyMin,label.royaltyMax))*1000)/1000;
    const albumsOwed = label.tier==='Major' ? rrange(2,4) : rrange(1,2);
    G.pendingOffer = { type:'record', bandId, labelId, advance, royalty, albumsOwed };
    addLog(`${label.name} are interested in signing ${band.name}!`,'deal');
  } else {
    addLog(`${label.name} pass on ${band.name} this time.`,'deal');
  }
}
function pitchPublishingDeal(bandId, publisherId){
  const band = findBand(bandId); const pub = publisherById(publisherId);
  if(!spendAP()) return;
  const chance = publishingPitchChance(band, pub);
  if(Math.random()<chance){
    const advance = rrange(pub.advanceMin, pub.advanceMax);
    const split = Math.round(rrangeF(pub.splitMin,pub.splitMax)*100)/100;
    G.pendingOffer = { type:'publishing', bandId, publisherId, advance, split };
    addLog(`${pub.name} want to talk publishing with ${band.name}!`,'deal');
  } else {
    addLog(`${pub.name} pass on a publishing deal with ${band.name}.`,'deal');
  }
}
function acceptOffer(){
  const offer = G.pendingOffer; if(!offer) return;
  const band = findBand(offer.bandId);
  if(offer.type==='record'){
    const label = labelById(offer.labelId);
    band.recordDeal = { labelId:offer.labelId, advance:offer.advance, advanceRemaining:offer.advance, royalty:offer.royalty,
      albumsOwed:offer.albumsOwed, albumsDelivered:0, signWeek:G.week };
    G.cash += Math.round(offer.advance*CONFIG.MANAGER_CUT);
    addLog(`${band.name} sign to ${label.name}! Advance: ${fmtMoney(offer.advance)}, royalty ${(offer.royalty*100).toFixed(1)}%.`,'deal');
    unlock('first_record_deal','Landed Your First Record Deal');
    G.reputation = clamp(G.reputation+3,0,100);
  } else {
    const pub = publisherById(offer.publisherId);
    band.publishingDeal = { publisherId:offer.publisherId, advance:offer.advance, split:offer.split, signWeek:G.week };
    G.cash += Math.round(offer.advance*CONFIG.MANAGER_CUT);
    addLog(`${band.name} sign a publishing deal with ${pub.name}! Advance: ${fmtMoney(offer.advance)}, band keeps ${(offer.split*100).toFixed(0)}%.`,'deal');
    unlock('first_publishing_deal','Signed Your First Publishing Deal');
  }
  G.pendingOffer = null;
  closeModal();
}
function declineOffer(){
  const offer = G.pendingOffer; if(!offer) return;
  const band = findBand(offer.bandId);
  addLog(`You turn down the offer for ${band.name}.`,'deal');
  G.pendingOffer = null;
}
function counterOffer(){
  const o = G.pendingOffer; if(!o || o.negotiated) return;
  o.negotiated = true;
  const band = findBand(o.bandId);
  const roll = Math.random();
  if(roll<0.55){
    if(o.type==='record'){
      o.advance = Math.round(o.advance*rrangeF(1.15,1.3));
      o.royalty = Math.round(clamp(o.royalty+0.01,0,0.3)*1000)/1000;
    } else {
      o.advance = Math.round(o.advance*rrangeF(1.15,1.3));
      o.split = Math.round(clamp(o.split+0.03,0,0.95)*100)/100;
    }
    addLog(`You push back and ${band.name} get a better deal on the table.`,'deal');
  } else if(roll<0.80){
    addLog(`They won't budge, but the offer still stands.`,'deal');
  } else {
    addLog(`They walk away from the table — the offer is withdrawn.`,'deal');
    G.pendingOffer = null;
  }
}

function arrangePress(bandId){
  const publicist = getStaff('publicist');
  const cost = publicist ? Math.round(CONFIG.PRESS_COST*(1-0.35*publicist.skill)) : CONFIG.PRESS_COST;
  if(G.cash<cost){ addLog('Not enough cash for a publicist.','warn'); return; }
  if(!spendAP()) return;
  const band = findBand(bandId);
  G.cash -= cost;
  const leader = band.members.find(m=>m.id===band.leaderId) || band.members[0];
  const rest = band.members.filter(m=>m.id!==leader.id);
  const charisma = rest.length ? leader.charisma*0.7+avg(rest,'charisma')*0.3 : leader.charisma;
  const leaderRisky = leader.personality==='wild'||leader.personality==='diva';
  const gaffeRisk = clamp(0.08 + (leaderRisky?0.09:(rest.some(m=>m.personality==='wild'||m.personality==='diva')?0.04:0)) + band.heat*0.001 - (publicist?0.03*publicist.skill:0), 0.01, 0.6);
  if(Math.random()<gaffeRisk){
    band.heat=clamp(band.heat+28,0,100); band.buzz=clamp(band.buzz+6,0,100); band.chemistry=clamp(band.chemistry-6,0,100);
    G.reputation=clamp(G.reputation-2,0,100);
    addLog(`PR disaster — ${band.name}'s interview spirals into headlines for all the wrong reasons.`,'press');
  } else {
    const scoreVal = charisma + G.reputation*0.2 + (publicist?8*publicist.skill:0) + rrange(-10,20);
    if(scoreVal>85){ band.fame=clamp(band.fame+2.5,0,100); band.buzz=clamp(band.buzz+22,0,100); band.heat=clamp(band.heat+6,0,100);
      addLog(`${band.name} own the room in an electric press conference — buzz is soaring.`,'press'); }
    else if(scoreVal>55){ band.fame=clamp(band.fame+1,0,100); band.buzz=clamp(band.buzz+10,0,100); band.heat=clamp(band.heat+4,0,100);
      addLog(`${band.name} give a solid interview.`,'press'); }
    else { band.buzz=clamp(band.buzz+4,0,100); band.heat=clamp(band.heat+3,0,100);
      addLog(`${band.name}'s interview is fine, but forgettable.`,'press'); }
  }
}

function hireStaff(candidateId){

  G.staff.push({ id:uid(), roleId:candidate.roleId, name:candidate.name, skill:candidate.skill, salary:candidate.salary, hiredWeek:G.week });
  addLog(`You hire ${candidate.name} as your new ${staffById(candidate.roleId).name}.`,'deal');
  ensureStaffMarket();
}
function fireStaff(staffId){
  const idx = G.staff.findIndex(s=>s.id===staffId);
  if(idx<0) return;
  const s = G.staff.splice(idx,1)[0];
  addLog(`You let ${s.name} (your ${staffById(s.roleId).name}) go.`,'warn');

function shootVideo(bandId, relId, tierId){
  const band = findBand(bandId); const rel = band.singles.find(r=>r.id===relId); const tier = VIDEO_TIERS.find(t=>t.id===tierId);
  if(!band||!rel||!tier) return;
  if(band.fame<tier.minFame){ addLog(`${band.name} aren't big enough yet for a ${tier.name.toLowerCase()}.`,'warn'); return; }
  const videoproducer = getStaff('videoproducer');
  const discount = videoproducer ? (1-0.3*videoproducer.skill) : 1;
  const cost = Math.round(tier.cost*discount);
  if(!spendAP()) return;
  let fundedByLabel = false;
  if(band.recordDeal && band.recordDeal.advanceRemaining>=cost){
    band.recordDeal.advanceRemaining -= cost; fundedByLabel = true;
  } else if(G.cash>=cost){
    G.cash -= cost;
  } else {
    addLog(`Not enough cash to shoot a video (needs ${fmtMoney(cost)}).`,'warn');
    G.ap++; return;
  }
  const addedMult = videoproducer ? (1+0.25*videoproducer.skill) : 1;
  const amount = Math.round(rrange(tier.addedMin, tier.addedMax)*addedMult);
  rel.promo = rel.promo || {amount:0, weeksLeft:0};
  rel.promo.amount = clamp(rel.promo.amount+amount,0,80);
  rel.promo.weeksLeft = Math.max(rel.promo.weeksLeft, tier.weeks);
  band.fame = clamp(band.fame+rrangeF(tier.fameMin,tier.fameMax),0,100);
  band.buzz = clamp(band.buzz+15,0,100);
  let msg = `${band.name} shoot a video for "${rel.title}"${fundedByLabel?' (label-funded)':''}.`;
  if(Math.random()<0.12){
    band.fame=clamp(band.fame+3,0,100); band.buzz=clamp(band.buzz+10,0,100);
    msg = `${band.name}'s video for "${rel.title}" becomes an instant classic — iconic.`;
  }
  addLog(msg,'promo');
  unlock('first_video','Shot Your First Music Video');
  closeModal();
}

function pitchSponsorship(bandId, sponsorId){
  const band = findBand(bandId); const sponsor = SPONSORS.find(s=>s.id===sponsorId);
  if(!band||!sponsor) return;
  if(band.sponsorship){ addLog(`${band.name} already have an active sponsorship deal.`,'warn'); return; }
  if(band.fame<sponsor.minFame){ addLog(`${band.name} aren't famous enough for ${sponsor.name} yet.`,'warn'); return; }
  if(!spendAP()) return;
  const chance = clamp(0.4 + (band.fame-sponsor.minFame)*0.006 + G.reputation*0.003, 0.1, 0.9);
  if(Math.random()<chance){
    const lump = rrange(sponsor.lumpMin, sponsor.lumpMax);
    const weekly = rrange(sponsor.weeklyMin, sponsor.weeklyMax);
    band.sponsorship = { sponsorId, weeksLeft:sponsor.weeks, weeklyAmount:weekly };
    G.cash += Math.round(lump*CONFIG.MANAGER_CUT);
    addLog(`${band.name} sign an endorsement deal with ${sponsor.name}! Signing fee: ${fmtMoney(lump)}.`,'money');
    if(Math.random()<0.15){
      band.heat=clamp(band.heat+10,0,100); band.chemistry=clamp(band.chemistry-3,0,100);
      addLog(`Some fans mutter about ${band.name} "selling out" with the ${sponsor.name} deal.`,'event');
    }
    unlock('first_sponsorship','Landed Your First Sponsorship Deal');
  } else {
    addLog(`${sponsor.name} pass on sponsoring ${band.name} this time.`,'money');
  }
  closeModal();
}

function bookFestival(bandId, festId){

  addLog(`${band.name} play ${fest.name}! Fee: ${fmtMoney(fee)}.`,'tour');
  unlock('first_festival','Played Your First Festival');
  if(fest.id==='legends') unlock('headline_festival','Headlined a Major Festival');

function openAudition(bandId){
  const band = findBand(bandId);

  const usedRoles = band.members.map(m=>m.role);

  G.cash -= CONFIG.AUDITION_FEE;

}

function pitchRadio(bandId, relId, tierId){
  const band = findBand(bandId); const rel = band.singles.find(r=>r.id===relId); const tier = RADIO_TIERS.find(t=>t.id===tierId);
  if(!band||!rel||!tier) return;
  if(G.cash<tier.cost){ addLog('Not enough cash to cover radio plugging costs.','warn'); return; }
  if(!spendAP()) return;
  G.cash -= tier.cost;
  const songs = rel.trackIds.map(id=>band.catalog.find(s=>s.id===id)).filter(Boolean);
  const q = songs.length ? avg(songs,'quality') : 40;
  const label = band.recordDeal ? labelById(band.recordDeal.labelId) : null;
  let chance = 0.3 + (q-tier.minQuality)*0.01 + (label?label.marketing*0.003:0) + G.reputation*0.003 + band.buzz*0.002;
  chance = clamp(chance,0.05,0.9);
  if(Math.random()<chance){
    const amount = rrange(tier.addedMin, tier.addedMax);
    rel.promo = rel.promo || {amount:0, weeksLeft:0};
    rel.promo.amount = clamp(rel.promo.amount+amount,0,60);
    rel.promo.weeksLeft = Math.max(rel.promo.weeksLeft, tier.weeks);
    band.buzz = clamp(band.buzz+Math.round(amount*0.4),0,100);
    addLog(`"${rel.title}" lands on ${tier.name} for ${band.name}!`,'promo');
    if(tier.id==='national') unlock('first_national_playlist','Landed a National Playlist Add');
  } else {
    addLog(`${tier.name} passes on "${rel.title}" this time.`,'promo');
  }
  closeModal();
}

function bookTV(bandId, showId){
  const band = findBand(bandId); const show = TV_SHOWS.find(s=>s.id===showId);
  if(!band||!show) return;
  if(band.fame<show.minFame){ addLog(`${band.name} aren't famous enough yet for ${show.name}.`,'warn'); return; }
  if(G.cash<show.cost){ addLog('Not enough cash to cover promo costs for this booking.','warn'); return; }
  if(!spendAP()) return;
  G.cash -= show.cost;
  const leader = band.members.find(m=>m.id===band.leaderId) || band.members[0];
  const leaderRisky = leader.personality==='wild'||leader.personality==='diva';
  const risk = show.gaffeRisk + (leaderRisky?0.08:(band.members.some(m=>m.id!==leader.id&&(m.personality==='wild'||m.personality==='diva'))?0.03:0)) + band.heat*0.001;
  if(Math.random()<risk){
    band.heat=clamp(band.heat+30,0,100); G.reputation=clamp(G.reputation-2,0,100); band.chemistry=clamp(band.chemistry-4,0,100);
    addLog(`${band.name}'s appearance on ${show.name} turns into a car-crash moment.`,'promo');
  } else {
    const fameGain = rrangeF(show.fameMin, show.fameMax); const buzzGain = rrange(show.buzzMin, show.buzzMax);
    band.fame = clamp(band.fame+fameGain,0,100); band.buzz = clamp(band.buzz+buzzGain,0,100); band.heat = clamp(band.heat+5,0,100);
    const activeSingle = band.singles.find(r=>r.active);
    if(activeSingle){ activeSingle.promo = activeSingle.promo || {amount:0,weeksLeft:0};
      activeSingle.promo.amount = clamp(activeSingle.promo.amount+12,0,60);
      activeSingle.promo.weeksLeft = Math.max(activeSingle.promo.weeksLeft,3); }
    addLog(`${band.name} smash their slot on ${show.name} — huge exposure.`,'promo');
    unlock('first_tv','First TV Appearance');
  }
  closeModal();
}

function pepTalk(bandId, memberId){
  const band = findBand(bandId);
  if(!spendAP()) return;
  const m = band.members.find(x=>x.id===memberId);
  m.morale = clamp(m.morale+rrange(8,16),0,100);
  addLog(`You have a heart-to-heart with ${m.name} — morale improves.`,'band');
}

function bookTour(bandId, scaleId){
  const band = findBand(bandId); const scale = TOUR_SCALES.find(s=>s.id===scaleId);
  const supportCost = tourSupportCost(scale);
  if(band.tour){ addLog(`${band.name} are already on tour.`,'warn'); return; }
  if(band.fame<scale.minFame){ addLog(`${band.name} aren't famous enough yet for a ${scale.name}.`,'warn'); return; }
  if(G.cash<supportCost){ addLog('Not enough cash to front tour support costs.','warn'); return; }
  if(!spendAP()) return;
  G.cash -= supportCost;
  const legsCount = rrange(scale.legsMin, scale.legsMax);
  const pool = shuffle(CITIES.slice());
  const legs = []; for(let i=0;i<legsCount;i++) legs.push(pool[i%pool.length]);
  band.tour = { scaleId, legs, legIndex:0, grossRevenue:0, ticketsSold:0, active:true };
  addLog(`${band.name} announce a ${scale.name}! ${legsCount} dates booked.`,'tour');
  closeModal();
}

function tickTourLeg(band){
  const tour = band.tour; const scale = TOUR_SCALES.find(s=>s.id===tour.scaleId);
  const city = tour.legs[tour.legIndex];
  const demand = clamp(0.12 + (band.fame*0.8+band.buzz*0.5)/100,0,1.1);
  const relAvg = avg(band.members,'reliability')/100;
  let soldPct = clamp(demand*rrangeF(0.7,1.2)*relAvg,0,1);
  const tourmgr = getStaff('tourmgr');
  if(tourmgr) soldPct = clamp(soldPct*(1+0.15*tourmgr.skill),0,1);
  const ticketsSold = Math.round(scale.capacity*soldPct);
  const revenue = ticketsSold*scale.price;
  const managerIncome = Math.round(revenue*CONFIG.MANAGER_CUT);
  G.cash += managerIncome;
  tour.grossRevenue += revenue; tour.ticketsSold += ticketsSold;
  let outcome;
  if(soldPct>=0.95){ outcome='sellout'; band.fame=clamp(band.fame+2.5,0,100); band.buzz=clamp(band.buzz+14,0,100);
    if(scale.id==='stadium') unlock('sold_out_stadium','Sold Out a Stadium Tour'); }
  else if(soldPct>=0.65){ outcome='strong'; band.fame=clamp(band.fame+1,0,100); band.buzz=clamp(band.buzz+6,0,100); }
  else if(soldPct<0.3){ outcome='poor'; band.heat=clamp(band.heat+4,0,100); band.members.forEach(m=>m.morale=clamp(m.morale-2,0,100)); }
  else outcome='steady';
  addLog(`${band.name} play ${city} on the ${scale.name} — ${ticketsSold.toLocaleString()}/${scale.capacity.toLocaleString()} tickets (${outcome}).`,'tour');
  band.chemistry = clamp(band.chemistry+rrange(-1,3),0,100);
  band.members.forEach(m=>m.morale=clamp(m.morale-1,0,100));
  tour.legIndex++;
  if(tour.legIndex>=tour.legs.length){
    tour.active=false;
    const avgSold = tour.ticketsSold/(scale.capacity*tour.legs.length);
    band.fame = clamp(band.fame+avgSold*6,0,100);
    band.tourHistory.unshift({scale:scale.name, legs:tour.legs.length, gross:tour.grossRevenue, ticketsSold:tour.ticketsSold, finishedWeek:G.week});
    addLog(`${band.name}'s ${scale.name} has wrapped up! Total gross: ${fmtMoney(tour.grossRevenue)}.`,'tour');
    band.tour = null;
  }
}

function tickCharts(){
  ['singles','albums'].forEach(kind=>{
    const chartKey = kind==='singles' ? 'chartsSingles' : 'chartsAlbums';
    const prevChart = G[chartKey] || [];
    const entries = [];
    G.bands.forEach(band=>{
      const list = kind==='singles' ? band.singles : band.albums;
      list.forEach(rel=>{
        if(!rel.active) return;
        rel.weeksOnChart++;
        const label = band.recordDeal ? labelById(band.recordDeal.labelId) : null;
        const songs = rel.trackIds.map(id=>band.catalog.find(s=>s.id===id)).filter(Boolean);
        const q = songs.length ? avg(songs,'quality') : 40;
        const promoAmt = rel.promo ? rel.promo.amount : 0;
        let strength = q*0.5 + band.fame*0.3 + (label?label.marketing*0.15:0) + band.buzz*0.15 + promoAmt - rel.weeksOnChart*2.5 + rrange(-8,8);
        strength *= (G.genreTrends[band.genre]||1);
        strength = clamp(strength,0,160);
        if(rel.promo){ rel.promo.weeksLeft--; if(rel.promo.weeksLeft<=0) rel.promo=null; }
        if(strength<=8 && rel.weeksOnChart>2){
          rel.active = false;
          addLog(`"${rel.title}" by ${band.name} has fallen off the ${kind==='singles'?'singles':'albums'} chart.`,'chart');
          return;
        }
        entries.push({ title:rel.title, artist:band.name, isPlayer:true, bandId:band.id, relId:rel.id, strength, weeksOnChart:rel.weeksOnChart });
      });
    });
    G.rivalActs.forEach(r=>{
      r.strength = clamp(r.strength + rrange(-6,7)*(G.genreTrends[r.genre]||1), 8, 98);
      entries.push({ title:genSongTitle(), artist:r.name, isPlayer:false, strength:clamp(r.strength+rrange(-5,5),0,120), weeksOnChart:rrange(1,15) });
    });
    entries.sort((a,b)=>b.strength-a.strength);
    const top = entries.slice(0,CONFIG.CHART_SIZE);
    top.forEach((e,i)=>{
      e.position = i+1;
      const prevEntry = prevChart.find(p => e.isPlayer ? (p.isPlayer && p.relId===e.relId) : (!p.isPlayer && p.title===e.title && p.artist===e.artist));
      e.prevPosition = prevEntry ? prevEntry.position : null;
      if(e.isPlayer){
        const band = G.bands.find(b=>b.id===e.bandId);
        const rel = (kind==='singles'?band.singles:band.albums).find(r=>r.id===e.relId);
        rel.chartPeak = rel.chartPeak ? Math.min(rel.chartPeak, e.position) : e.position;
        const baseVal = kind==='singles' ? 220 : 550;
        const royaltyMult = band.recordDeal ? clamp(band.recordDeal.royalty*8,0.6,1.6) : 0.7;
        const royalty = Math.round((21-e.position)*baseVal*CONFIG.MANAGER_CUT*royaltyMult);
        G.cash += royalty;
        if(e.position===1 && !rel._hitNo1){
          rel._hitNo1 = true;
          addLog(`🥇 "${rel.title}" by ${band.name} hits #1 on the ${kind} chart!`,'chart');
          unlock(kind==='singles'?'first_number_one_single':'first_number_one_album', 'First #1 '+(kind==='singles'?'Single':'Album'));
          band.fame = clamp(band.fame+8,0,100);
        } else if(e.position<=10 && !rel._hitTop10){
          rel._hitTop10 = true;
          addLog(`"${rel.title}" by ${band.name} breaks into the Top 10!`,'chart');
          unlock(kind==='singles'?'first_top10_single':'first_top10_album', 'First Top 10 '+(kind==='singles'?'Single':'Album'));
          band.fame = clamp(band.fame+3,0,100);
        }
      }
    });
    G[chartKey] = top;
  });
}

function triggerAwardsNight(){
  const results = AWARD_CATEGORIES.map(cat=>{
    const pool = [];
    G.bands.forEach(band=>{
      let eligible = false;
      if(cat==='Best New Act') eligible = band.signedWeek!=null && (G.week-band.signedWeek)<=52;
      else if(cat==='Best Single') eligible = band.singles.some(r=>r.chartPeak && r.chartPeak<=10);
      else if(cat==='Best Album') eligible = band.albums.some(r=>r.chartPeak && r.chartPeak<=10);
      else if(cat==='Best Live Act') eligible = band.tourHistory.length>0;
      else if(cat==='Act of the Year') eligible = band.fame>=50;
      if(eligible) pool.push({ name:band.name, isPlayer:true, bandId:band.id, score:band.fame*0.6+G.reputation*0.2+rrange(0,20) });
    });
    shuffle(G.rivalActs).slice(0,3).forEach(r=>{
      pool.push({ name:r.name, isPlayer:false, score:r.strength*0.8+rrange(0,20) });
    });
    if(!pool.length) return { category:cat, nominees:[], winner:null, winnerIsPlayer:false };
    pool.sort((a,b)=>b.score-a.score);
    const winner = pool[0];
    if(winner.isPlayer){
      const band = G.bands.find(b=>b.id===winner.bandId);
      band.fame = clamp(band.fame+5,0,100);
      G.reputation = clamp(G.reputation+4,0,100);
      G.awardsWon = (G.awardsWon||0)+1;
      unlock('first_award_win','Won Your First Industry Award');
      if(G.awardsWon>=3) unlock('awards_hall_of_fame','Hall of Fame: 3 Award Wins');
    }
    return { category:cat, nominees:pool.slice(0,4).map(p=>p.name), winner:winner.name, winnerIsPlayer:winner.isPlayer };
  });
  G.pendingAwards = { results };
  addLog(`🎉 Awards Night! Check the results.`,'chart');
}

function maybeTriggerEvent(){
  if(G.pendingEvent || G.pendingOffer || G.pendingAwards) return;
  if(Math.random()>0.35) return;
  const eligible = [];
  G.bands.forEach(band=>{
    EVENT_DEFS.forEach(ev=>{ if(ev.condition(band)) eligible.push({kind:'band',ev,band}); });
    REL_EVENT_DEFS.forEach(ev=>{ const pair=ev.pickPair(band); if(pair) eligible.push({kind:'rel',ev,band,pair}); });
  });
  if(!eligible.length) return;
  const chosen = eligible[rrange(0,eligible.length-1)];
  if(chosen.kind==='rel'){
    G.pendingEvent = { kind:'rel', eventId: chosen.ev.id, bandId: chosen.band.id, pairA: chosen.pair.a, pairB: chosen.pair.b };
  } else {
    G.pendingEvent = { kind:'band', eventId: chosen.ev.id, bandId: chosen.band.id };
  }
}

function resolveEvent(choiceIndex){
  const pending = G.pendingEvent; if(!pending) return;
  const band = findBand(pending.bandId);
  if(pending.kind==='rel'){
    const ev = REL_EVENT_DEFS.find(e=>e.id===pending.eventId);
    const rel = band.relationships[relKey(pending.pairA,pending.pairB)];
    const m1 = band.members.find(m=>m.id===pending.pairA), m2 = band.members.find(m=>m.id===pending.pairB);
    if(!ev || !rel || !m1 || !m2){ G.pendingEvent = null; return; }
    const choice = ev.choices[choiceIndex];
    if(!choice) return;
    addLog(choice.apply(band,m1,m2,rel),'event');
  } else {
    const ev = EVENT_DEFS.find(e=>e.id===pending.eventId);
    const choice = ev.choices[choiceIndex];
    if(!choice) return;
    addLog(choice.apply(band),'event');
  }
  G.pendingEvent = null;
}

function checkGameOver(){
  if(G.cash < CONFIG.BANKRUPTCY_CASH) G.negativeCashStreak++;
  else G.negativeCashStreak = 0;
  if(G.negativeCashStreak >= CONFIG.BANKRUPTCY_WEEKS){
    G.gameOver = 'bankrupt';
  }
}

function tickGenreTrends(){
  GENRES.forEach(g=>{
    let t = G.genreTrends[g]===undefined ? 1 : G.genreTrends[g];
    t += rrangeF(-0.04,0.04) + (1-t)*0.05;
    t = clamp(t,0.7,1.4);
    G.genreTrends[g] = Math.round(t*100)/100;
    if(t>=1.25 && !G.genreBreakoutLogged.includes(g)){
      G.genreBreakoutLogged.push(g);
      addLog(`${g} is having a real moment right now.`,'info');
    } else if(t<=1.05){
      const idx = G.genreBreakoutLogged.indexOf(g);
      if(idx>=0) G.genreBreakoutLogged.splice(idx,1);
    }
  });
}

function advanceWeek(){
  if(G.pendingEvent || G.pendingOffer || G.pendingAwards){ addLog('Resolve the pending situation before ending the week.','warn'); return; }
  const staffCost = G.staff.reduce((s,x)=>s+x.salary,0);
  const overhead = CONFIG.WEEKLY_BASE_OVERHEAD + G.bands.length*CONFIG.OVERHEAD_PER_BAND + staffCost;
  G.cash -= overhead;

  tickGenreTrends();
  tickStaffMarket();

  let totalMerch = 0;
  G.bands.slice().forEach(band=>{
    tickRelationships(band);
    band.buzz = Math.round(band.buzz*0.82);
    band.heat = Math.round(band.heat*0.9);
    const compat = bandCompatAvg(band);
    const target = avg(band.members,'morale')*0.55 + clamp(compat,-20,15);
    band.chemistry = clamp(band.chemistry + (target-band.chemistry)*0.15 + rrange(-3,3), 0, 100);

    band.members.slice().forEach(m=>{
      const baseline = clamp(60 + (m.personality==='pro'?5:0) - clamp((band.heat-30)*0.3,0,25) - clamp((50-band.chemistry)*0.3,0,20), 5, 90);
      m.morale = clamp(m.morale + (baseline-m.morale)*0.1 + rrange(-2,2), 0, 100);
      if(m.morale<=CONFIG.MEMBER_CRITICAL_MORALE) m.criticalMoraleWeeks = (m.criticalMoraleWeeks||0)+1;
      else m.criticalMoraleWeeks = 0;

      if(m.criticalMoraleWeeks>=CONFIG.MEMBER_CRITICAL_WEEKS && band.members.includes(m)){
        addLog(`${m.name} has quit ${band.name}, burnt out and unhappy.`,'band');
        memberDeparts(band, m.id);
        return;
      }
      if(m.soloFlag && band.members.includes(m) && Math.random()<CONFIG.SOLO_DEPART_CHANCE){
        const soloFame = band.fame*0.3, departedName = m.name, departedGenre = band.genre;
        memberDeparts(band, m.id);
        addLog(`${departedName} leaves ${band.name} to go solo!`,'band');
        if(G.prospects.length<CONFIG.MAX_PROSPECTS) G.prospects.push(makeSoloAct(m, departedGenre, soloFame));
      }
    });
    if(!G.bands.includes(band)) return;

    if(band.weeksSinceRelease>8 && !band.tour) band.fame = clamp(band.fame-0.3,0,100);
    band.weeksSinceRelease++;
    if(band.tour && band.tour.active) tickTourLeg(band);

    if(band.sponsorship){
      G.cash += Math.round(band.sponsorship.weeklyAmount*CONFIG.MANAGER_CUT);
      band.sponsorship.weeksLeft--;
      if(band.sponsorship.weeksLeft<=0){
        addLog(`${band.name}'s sponsorship deal comes to an end.`,'money');
        band.sponsorship = null;
      }
    }
    if(band.fame>=CONFIG.MERCH_FAME_THRESHOLD){
      const merch = Math.round(band.fame*1.3*CONFIG.MANAGER_CUT*rrangeF(0.8,1.2));
      G.cash += merch; totalMerch += merch;
    }
  });
  if(totalMerch>0) addLog(`Merchandise sales bring in ${fmtMoney(totalMerch)} across the roster this week.`,'money');

  tickCharts();

  if(G.week>=G.nextAwardsWeek){
    triggerAwardsNight();
    G.nextAwardsWeek = G.week + rrange(CONFIG.AWARDS_INTERVAL_MIN, CONFIG.AWARDS_INTERVAL_MAX);
  }

  maybeTriggerEvent();
  if(Math.random()<0.2 && G.prospects.length<CONFIG.MAX_PROSPECTS) G.prospects.push(makeBand(G.reputation*0.1));

  snapshotHistory();
  if(G.reputation>=50) unlock('rep50','Reached Respected Status');
  if(G.reputation>=80) unlock('rep80','Industry Legend Status');
  checkGameOver();

  G.week++;
  G.ap = CONFIG.AP_PER_WEEK;
  addLog(`— Week ${G.week} begins —`,'info');
}

function historySvg(){
  const h = G.history;
  if(h.length<2) return `<p style="color:var(--dim);font-size:.85em;">Not enough history yet.</p>`;
  const w=460, ht=120, pad=10;
  const cashVals = h.map(x=>x.cash);
  const repVals = h.map(x=>x.reputation);
  const cMin=Math.min(...cashVals,0), cMax=Math.max(...cashVals,100);
  const rMin=0, rMax=100;
  function pts(vals,min,max){
    return vals.map((v,i)=>{
      const x = pad + i*(w-2*pad)/(vals.length-1||1);
      const y = ht-pad - (v-min)/(max-min||1)*(ht-2*pad);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
  }
  return `<svg width="100%" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" style="background:var(--panel2);border-radius:8px;">
    <polyline points="${pts(cashVals,cMin,cMax)}" fill="none" stroke="var(--gold)" stroke-width="2"/>
    <polyline points="${pts(repVals,rMin,rMax)}" fill="none" stroke="var(--blue)" stroke-width="2"/>
  </svg>
  <div style="display:flex;gap:16px;margin-top:6px;font-size:.75em;color:var(--dim)">
    <span><span style="color:var(--gold)">■</span> Cash</span>
    <span><span style="color:var(--blue)">■</span> Reputation</span>
  </div>`;
}

/* ---------- Charts ---------- */
function chartTable(list, kind){
  if(!list.length) return `<p style="color:var(--dim)">No chart data yet — release some music!</p>`;
  const rows = list.map(e=>{
    let trend = '<span class="trend-flat">–</span>';
    if(e.prevPosition!=null){
      if(e.position<e.prevPosition) trend = '<span class="trend-up">▲</span>';
      else if(e.position>e.prevPosition) trend = '<span class="trend-down">▼</span>';
      else trend = '<span class="trend-flat">–</span>';
    } else trend = '<span class="trend-up">NEW</span>';
    return `<tr style="${e.isPlayer?'background:#1c1710':''}">
      <td>${e.position}</td><td>${trend}</td>
      <td>${e.isPlayer?'<b style="color:var(--gold)">':''}"${esc(e.title)}"${e.isPlayer?'</b>':''}</td>
      <td>${esc(e.artist)}</td><td>${e.weeksOnChart}</td>
    </tr>`;
  }).join('');
  return `<table class="data"><thead><tr><th>#</th><th></th><th>Title</th><th>Artist</th><th>Weeks</th></tr></thead><tbody>${rows}</tbody></table>`;
}

      <button class="btn" ${band.sponsorship?'disabled':''} data-action="openModal" data-modal="sponsorship" data-band-id="${band.id}">Pitch Sponsorship</button>
      <button class="btn" ${band.members.length>=5?'disabled':''} data-action="openAudition" data-band-id="${band.id}">Audition New Member</button>
      <button class="btn danger" data-action="dropBand" data-band-id="${band.id}">Drop Act</button>
    </div>

    <div class="section-title">Relationships</div>
    ${renderRelationships(band)}

    <div class="section-title">Catalog</div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Title</th><th>Genre</th><th>Quality</th><th>Status</th></tr></thead><tbody>${catalogRows}</tbody></table></div>

    <div class="section-title">Releases</div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Title</th><th>Type</th><th>Chart Peak</th><th>Status</th></tr></thead><tbody>${releaseRows}</tbody></table></div>

    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div>
  </div>`;
}

function renderSongwritingModal(band){
  ensureRelationships(band);
  const partnerIds = new Set();
  Object.values(band.relationships).forEach(r=>{ if(r.partnership){ partnerIds.add(r.a); partnerIds.add(r.b); } });
  const rows = band.members.map(m=>{
    const sel = G.ui.tempSelect.includes(m.id);
    return `<div class="member-check ${sel?'selected':''}" data-action="toggleMember" data-member-id="${m.id}">
      <input type="checkbox" ${sel?'checked':''}><div><b>${esc(m.name)}</b> — ${m.role} <span style="color:var(--dim);font-size:.8em">(Writing ${m.songwriting})</span>${partnerIds.has(m.id)?' ✍️':''}</div>
    </div>`;
  }).join('');
  return `<div class="modal-box">
    <h2>Songwriting Session — ${esc(band.name)}</h2>
    <p style="color:var(--dim);font-size:.85em">Pick which members are writing together. More skilled writers (and better chemistry) mean better songs — a ✍️ partnership pair writes best together.</p>
    ${rows}
    <div class="close-row">
      <button class="btn" data-action="closeModal">Cancel</button>
      <button class="btn primary" data-action="commitSongwriting" data-band-id="${band.id}">Write Song (1 AP)</button>
    </div>
  </div>`;
}

function renderStudioModal(band){
  const unrecorded = band.catalog.filter(s=>!s.recorded);
  const mode = G.ui.studioMode;
  const rows = unrecorded.map(s=>{
    const sel = G.ui.tempSelect.includes(s.id);
    return `<div class="song-check ${sel?'selected':''}" data-action="toggleSong" data-song-id="${s.id}">
      <span>"${esc(s.title)}" <span style="color:var(--dim);font-size:.8em">(Quality ${s.quality})</span></span>
      <input type="checkbox" ${sel?'checked':''}>
    </div>`;
  }).join('') || `<p style="color:var(--dim)">No unrecorded songs available.</p>`;
  const cost = studioCost(mode, G.ui.tempSelect.length||1);
  const funded = band.recordDeal && band.recordDeal.advanceRemaining>=cost;
  return `<div class="modal-box">
    <h2>Studio Session — ${esc(band.name)}</h2>
    <div class="tier-options">
      <button class="${mode==='single'?'selected':''}" data-action="setStudioMode" data-mode="single">Single<small>1 track</small></button>
      <button class="${mode==='album'?'selected':''}" data-action="setStudioMode" data-mode="album">Album<small>4+ tracks</small></button>
    </div>
    <p style="color:var(--dim);font-size:.85em;margin-top:10px;">${mode==='single'?'Select exactly one song.':'Select at least four songs.'}
      Cost: ${fmtMoney(cost)} ${band.recordDeal?(funded?'(label will fund this)':'(exceeds remaining advance — self-funded)'):'(self-funded)'}</p>
    ${rows}
    <div class="close-row">
      <button class="btn" data-action="closeModal">Cancel</button>
      <button class="btn primary" data-action="commitStudio" data-band-id="${band.id}">Record &amp; Release (1 AP)</button>
    </div>
  </div>`;
}

function renderRecordDealModal(band){
  const rows = LABELS.map(l=>{
    const chance = Math.round(recordPitchChance(band,l)*100);
    const locked = band.fame < l.famReq-15;
    return `<div class="choice-card">
      <b>${l.name}</b> <span class="badge badge-genre">${l.tier}</span>
      <div class="meta">Advance ${fmtMoney(l.advanceMin)}–${fmtMoney(l.advanceMax)} · Royalty ${(l.royaltyMin*100).toFixed(0)}–${(l.royaltyMax*100).toFixed(0)}%
        · Min Fame ${l.famReq} · Est. chance ${chance}%</div>
      <button class="btn small primary" ${locked?'disabled':''} data-action="pitchRecordDeal" data-band-id="${band.id}" data-label-id="${l.id}">Pitch (1 AP)</button>
    </div>`;
  }).join('');
  return `<div class="modal-box"><h2>Pitch a Record Deal — ${esc(band.name)}</h2>${rows}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderPubDealModal(band){
  const rows = PUBLISHERS.map(p=>{
    const chance = Math.round(publishingPitchChance(band,p)*100);
    return `<div class="choice-card">
      <b>${p.name}</b>
      <div class="meta">Advance ${fmtMoney(p.advanceMin)}–${fmtMoney(p.advanceMax)} · Band split ${(p.splitMin*100).toFixed(0)}–${(p.splitMax*100).toFixed(0)}% · Est. chance ${chance}%</div>
      <button class="btn small primary" data-action="pitchPublishingDeal" data-band-id="${band.id}" data-publisher-id="${p.id}">Pitch (1 AP)</button>
    </div>`;
  }).join('');
  return `<div class="modal-box"><h2>Pitch a Publishing Deal — ${esc(band.name)}</h2>${rows}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderTourModal(band){
  const rows = TOUR_SCALES.map(s=>{
    const locked = band.fame < s.minFame;
    return `<div class="choice-card">
      <b>${s.name}</b>
      <div class="meta">Min Fame ${s.minFame} · Capacity ${s.capacity.toLocaleString()} · Ticket £${s.price} · ${s.legsMin}-${s.legsMax} dates
        · Support cost ${fmtMoney(tourSupportCost(s))}${hasStaff('tourmgr')?' (Tour Manager discount applied)':''}</div>
      <button class="btn small primary" ${locked?'disabled':''} data-action="bookTour" data-band-id="${band.id}" data-scale-id="${s.id}">Book (1 AP)</button>
    </div>`;
  }).join('');
  return `<div class="modal-box"><h2>Book a Tour — ${esc(band.name)}</h2>${rows}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderVideoModal(band){
  const actives = band.singles.filter(r=>r.active);
  if(!actives.length) return `<div class="modal-box"><h2>Shoot a Music Video — ${esc(band.name)}</h2><p style="color:var(--dim)">No active singles to promote.</p>
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
  const vpStaff = getStaff('videoproducer');
  const discount = vpStaff ? (1-0.3*vpStaff.skill) : 1;
  const relOptions = actives.map(rel=>{
    const tierBtns = VIDEO_TIERS.map(t=>{
      const locked = band.fame < t.minFame;
      const cost = Math.round(t.cost*discount);
      return `<button class="btn small primary" ${locked?'disabled':''} data-action="shootVideo" data-band-id="${band.id}" data-rel-id="${rel.id}" data-tier-id="${t.id}">${t.name} (${fmtMoney(cost)})</button>`;
    }).join(' ');
    return `<div class="choice-card"><b>"${esc(rel.title)}"</b><div class="meta">${tierBtns}</div></div>`;
  }).join('');
  return `<div class="modal-box"><h2>Shoot a Music Video — ${esc(band.name)}</h2>${relOptions}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderSponsorshipModal(band){
  if(band.sponsorship){
    const sponsor = SPONSORS.find(s=>s.id===band.sponsorship.sponsorId);
    return `<div class="modal-box"><h2>Sponsorship — ${esc(band.name)}</h2>
      <p>Already sponsored by <b>${sponsor.name}</b> — ${band.sponsorship.weeksLeft} weeks remaining.</p>
      <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
  }
  const rows = SPONSORS.map(s=>{
    const locked = band.fame < s.minFame;
    return `<div class="choice-card"><b>${s.name}</b>
      <div class="meta">Min Fame ${s.minFame} · Signing fee ${fmtMoney(s.lumpMin)}-${fmtMoney(s.lumpMax)} · Weekly ${fmtMoney(s.weeklyMin)}-${fmtMoney(s.weeklyMax)} for ${s.weeks} weeks</div>
      <button class="btn small primary" ${locked?'disabled':''} data-action="pitchSponsorship" data-band-id="${band.id}" data-sponsor-id="${s.id}">Pitch (1 AP)</button>
    </div>`;
  }).join('');
  return `<div class="modal-box"><h2>Pitch a Sponsorship — ${esc(band.name)}</h2>${rows}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderFestivalModal(band){
  const rows = FESTIVALS.map(f=>{
    const locked = band.fame < f.minFame;
    return `<div class="choice-card"><b>${f.name}</b>
      <div class="meta">Min Fame ${f.minFame} · Fee ${fmtMoney(f.feeMin)}-${fmtMoney(f.feeMax)} · Fame +${f.fameMin}-${f.fameMax}, Buzz +${f.buzzMin}-${f.buzzMax}</div>
      <button class="btn small primary" ${locked?'disabled':''} data-action="bookFestival" data-band-id="${band.id}" data-fest-id="${f.id}">Book (1 AP)</button>
    </div>`;
  }).join('');
  return `<div class="modal-box"><h2>Play a Festival — ${esc(band.name)}</h2>${rows}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderAuditionModal(band){
  const candidates = G.ui.auditionCandidates || [];
  const rows = candidates.map((c,i)=>`
    <div class="choice-card">
      <b>${esc(c.name)}</b> — ${c.role} <span class="badge badge-genre">${personalityName(c.personality)}</span>
      <div class="meta">Writing ${c.songwriting} · Performance ${c.performance} · Charisma ${c.charisma} · Reliability ${c.reliability}</div>
      <button class="btn small primary" data-action="commitAudition" data-band-id="${band.id}" data-idx="${i}">Sign Them (${fmtMoney(CONFIG.AUDITION_FEE)}, 1 AP)</button>
    </div>`).join('');
  return `<div class="modal-box"><h2>Audition New Members — ${esc(band.name)}</h2>${rows || '<p style="color:var(--dim)">No candidates available.</p>'}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderRadioModal(band){
  const single = band.singles.filter(r=>r.active);
  if(!single.length) return `<div class="modal-box"><h2>Radio Pluggers — ${esc(band.name)}</h2><p style="color:var(--dim)">No active singles to plug.</p>
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
  const relOptions = single.map(rel=>{
    const tierRows = RADIO_TIERS.map(t=>`<button class="btn small primary" data-action="pitchRadio" data-band-id="${band.id}" data-rel-id="${rel.id}" data-tier-id="${t.id}">${t.name} (${fmtMoney(t.cost)})</button>`).join(' ');
    return `<div class="choice-card"><b>"${esc(rel.title)}"</b><div class="meta">${tierRows}</div></div>`;
  }).join('');
  return `<div class="modal-box"><h2>Pitch for Radio Play — ${esc(band.name)}</h2>${relOptions}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}
function renderTVModal(band){
  const rows = TV_SHOWS.map(s=>{
    const locked = band.fame < s.minFame;
    return `<div class="choice-card">
      <b>${s.name}</b>
      <div class="meta">Min Fame ${s.minFame} · Cost ${fmtMoney(s.cost)} · Fame +${s.fameMin}-${s.fameMax}, Buzz +${s.buzzMin}-${s.buzzMax}</div>
      <button class="btn small primary" ${locked?'disabled':''} data-action="bookTV" data-band-id="${band.id}" data-show-id="${s.id}">Book (1 AP)</button>
    </div>`;
  }).join('');
  return `<div class="modal-box"><h2>Book a TV Appearance — ${esc(band.name)}</h2>${rows}
    <div class="close-row"><button class="btn" data-action="closeModal">Close</button></div></div>`;
}

/* ---------- Game over ---------- */
function renderGameOver(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('modalRoot').classList.add('hidden');
  const go = document.getElementById('gameOverScreen');
  go.classList.remove('hidden');
  go.innerHTML = `<div class="go-card">
    <h1>Agency Shut Down</h1>
    <p>${esc(G.agencyName)} ran out of money after ${G.week} weeks in business.</p>
    <p style="color:var(--dim)">Acts signed: ${G.bands.length} · Reputation reached: ${Math.round(G.reputation)} · Achievements: ${G.achievements.length}</p>
    <button class="btn primary" data-action="requestNewGame">Start a New Agency</button>
  </div>`;
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==='pickDifficulty'){
    document.querySelectorAll('#difficultyOptions button').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    window._chosenDifficulty = btn.dataset.diff;
    return;
  }
  if(action==='startGame'){
    const name = document.getElementById('inpManager').value.trim() || 'Manager';
    const agency = document.getElementById('inpAgency').value.trim() || (name+"'s Management");
    const diff = window._chosenDifficulty || 'normal';
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    newGame(name, agency, diff);
    return;
  }
  if(action==='continueGame'){
    const loaded = tryLoad();
    if(loaded){ G = loaded; document.getElementById('setupScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden'); render(); }
    return;
  }
  if(action==='requestNewGame'){
    if(confirm('Start a brand new agency? Your current progress will be lost.')){
      localStorage.removeItem('svengaliSave');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('setupScreen').classList.remove('hidden');
      document.getElementById('btnContinue').classList.add('hidden');
      G = null;
    }
    return;
  }

  if(!G) return;

  switch(action){
    case 'setView': G.view = btn.dataset.view; closeModal(); break;
    case 'endWeek': advanceWeek(); break;
    case 'scoutTalent': doScout(); break;
    case 'signBand': doSignBand(btn.dataset.bandId); break;
    case 'passProspect': passProspect(btn.dataset.bandId); break;
    case 'dropBand': if(confirm('Drop this act from the agency?')) dropBand(btn.dataset.bandId); break;
    case 'openBand': openModal('bandDetail', btn.dataset.bandId); break;
    case 'openModal': openModal(btn.dataset.modal, btn.dataset.bandId); break;
    case 'closeModal': closeModal(); break;
    case 'toggleMember': toggleTemp(btn.dataset.memberId); break;
    case 'toggleSong': toggleTemp(btn.dataset.songId); break;
    case 'setStudioMode': G.ui.studioMode = btn.dataset.mode; G.ui.tempSelect=[]; break;
    case 'commitSongwriting': commitSongwriting(btn.dataset.bandId); break;
    case 'commitStudio': commitStudio(btn.dataset.bandId); break;
    case 'pitchRecordDeal': pitchRecordDeal(btn.dataset.bandId, btn.dataset.labelId); break;
    case 'pitchPublishingDeal': pitchPublishingDeal(btn.dataset.bandId, btn.dataset.publisherId); break;
    case 'acceptOffer': acceptOffer(); break;
    case 'declineOffer': declineOffer(); break;
    case 'arrangePress': arrangePress(btn.dataset.bandId); break;
    case 'pitchRadio': pitchRadio(btn.dataset.bandId, btn.dataset.relId, btn.dataset.tierId); break;
    case 'bookTV': bookTV(btn.dataset.bandId, btn.dataset.showId); break;
    case 'bookTour': bookTour(btn.dataset.bandId, btn.dataset.scaleId); break;
    case 'pepTalk': pepTalk(btn.dataset.bandId, btn.dataset.memberId); break;
    case 'resolveEvent': resolveEvent(parseInt(btn.dataset.choice,10)); break;
    case 'counterOffer': counterOffer(); break;
    case 'hireStaff': hireStaff(btn.dataset.candidateId); break;
    case 'fireStaff': fireStaff(btn.dataset.staffId); break;
    case 'shootVideo': shootVideo(btn.dataset.bandId, btn.dataset.relId, btn.dataset.tierId); break;
    case 'pitchSponsorship': pitchSponsorship(btn.dataset.bandId, btn.dataset.sponsorId); break;
    case 'bookFestival': bookFestival(btn.dataset.bandId, btn.dataset.festId); break;
    case 'openAudition': openAudition(btn.dataset.bandId); break;
    case 'commitAudition': commitAudition(btn.dataset.bandId, parseInt(btn.dataset.idx,10)); break;
    case 'ackAwards': G.pendingAwards = null; break;
    case 'fireMember': if(confirm('Fire this member? Founding members leaving can hurt fan goodwill.')) fireMember(btn.dataset.bandId, btn.dataset.memberId); break;
    case 'setLeader': setLeader(btn.dataset.bandId, btn.dataset.memberId); break;
    default: return;
  }
  render();
});

/* =========================================================================
   BOOT
   ========================================================================= */
(function boot(){
  const existing = tryLoad();
  if(existing){
    document.getElementById('btnContinue').classList.remove('hidden');
  }
})();
</script>
