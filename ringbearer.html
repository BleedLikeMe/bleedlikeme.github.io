<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ring-bearer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d0e;--ink2:#5c4327;--ink3:#8a6c45;--parch:#f2e4c0;--parch2:#e6d09c;--edge:#a8834a;
  --gold:#c9a227;--gold2:#ffd76a;--red:#8b1e1e;--elf:#2f5f4f;--sea:#9fb4a8;--bg:#1a120b;--bg2:#2b1d12;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#140d07 radial-gradient(ellipse at 50% 0%,#3a2716 0%,#140d07 70%);color:var(--ink);
  font-family:'EB Garamond',Georgia,'Times New Roman',serif;font-size:17px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.sview{position:relative}
.sdpad{display:none}
.hidden{display:none!important}

/* header */
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(#2e1f12,#1b120a);
  border-bottom:2px solid #6b4c22;color:#e9d6a6;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:'Cinzel',serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em;color:var(--gold2);
  text-shadow:0 0 8px rgba(255,190,60,.35);white-space:nowrap}
.brand span{display:block;font-size:.62rem;letter-spacing:.3em;color:#b99a62;font-weight:500}
#stats{display:flex;gap:12px;flex:1;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font-size:.9rem;min-width:110px}
.stat .lbl{color:#c8ad78;font-variant:small-caps;letter-spacing:.05em}
.bar{width:70px;height:8px;background:#0e0905;border:1px solid #6b4c22;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.ringicon{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 6px var(--gold);transition:all .5s}
.date{font-style:italic;color:#cdb47f;font-size:.88rem;margin-left:auto;white-space:nowrap}
.hbtns button{background:#3b2815;border:1px solid #7a5a2c;color:#f0dca8;border-radius:6px;padding:4px 10px;font-size:1rem;margin-left:4px}
.hbtns button:hover{background:#4d351c}

/* layout */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;max-width:1440px;margin:0 auto;padding:14px}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(140,100,40,.18),transparent 55%);
  border:1px solid var(--edge);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,30,.25)}
#stage{padding:18px 26px 26px;min-height:70vh}
#side{display:flex;flex-direction:column;min-height:70vh;max-height:calc(100vh - 90px);position:sticky;top:76px}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
#tabs button{flex:1;background:transparent;border:0;border-right:1px solid rgba(168,131,74,.4);padding:8px 4px;
  font-family:'Cinzel',serif;font-size:.72rem;color:var(--ink2);letter-spacing:.04em}
#tabs button.on{background:rgba(201,162,39,.22);color:var(--ink);font-weight:700}
#panel{padding:12px 14px;overflow-y:auto;flex:1}

/* stage */
.chaphead{text-align:center;margin-bottom:6px}
.chaphead .cn{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.35em;color:var(--ink3)}
.chaphead h2{font-family:'Cinzel',serif;margin:2px 0 0;font-size:1.55rem;color:var(--ink);letter-spacing:.03em}
.chaphead .where{font-style:italic;color:var(--ink2);font-size:.95rem}
.rule{height:10px;margin:8px auto 12px;width:60%;background:radial-gradient(circle,var(--edge) 2px,transparent 3px) center/14px 10px repeat-x;opacity:.7}
.art{margin:0 auto 12px;max-width:760px;cursor:zoom-in;position:relative}
.art svg{width:100%;height:auto;display:block;border-radius:3px}
.art .hint{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--ink2);background:rgba(242,228,192,.85);padding:1px 6px;border-radius:3px}
.text{max-width:760px;margin:0 auto}
.text p{font-size:1.12rem;line-height:1.62;margin:0 0 .85em}
.text p.first::first-letter{font-family:'IM Fell English',serif;float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--red)}
.text .speech{color:#3b2a14}
.text em{color:#4a3518}
.choices{max-width:760px;margin:16px auto 0;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:rgba(255,250,235,.55);border:1px solid var(--edge);border-radius:4px;padding:10px 14px;
  font-size:1.05rem;color:var(--ink);transition:all .15s;position:relative}
.choice:hover{background:#fff8e2;transform:translateX(3px);box-shadow:0 2px 8px rgba(90,60,20,.25)}
.choice .tag{font-size:.75rem;color:var(--ink3);font-variant:small-caps;margin-left:6px}
.choice.ring{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,215,106,.35),rgba(255,250,235,.5));}
.choice.ring::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-radius:50%;margin-right:8px;vertical-align:-1px;box-shadow:0 0 5px var(--gold)}
.choice.talk::before{content:'❝ ';color:var(--elf)}
.choice.go{font-weight:600}
.choice.game{border-style:double;border-width:3px}
.choice[disabled]{opacity:.45;pointer-events:none}
.choice.disabled-choice{opacity:.55;font-style:italic}
.result{max-width:760px;margin:10px auto;border-left:3px solid var(--edge);padding:6px 14px;background:rgba(255,250,235,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:2px 8px;border-radius:10px;border:1px solid var(--edge);background:#fff5d8}
.chip.good{border-color:#4f7d3a;color:#2f5a1c;background:#eef6dc}
.chip.bad{border-color:#9c3b2b;color:#7a2416;background:#f8e2d8}
.chip.ring{border-color:var(--gold);background:#fff1b8;color:#6b4c00}
.btn{background:linear-gradient(#5b3f1f,#3c2912);color:#f6e4b4;border:1px solid #2a1a0a;border-radius:4px;padding:9px 18px;
  font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.btn:hover{background:linear-gradient(#6d4c26,#4a3317)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--edge);box-shadow:none}
.btn.gold{background:linear-gradient(#e9c45a,#b88d1c);color:#2b1d0e;border-color:#7a5a10}
.center{text-align:center}

/* song card */
.song{max-width:560px;margin:14px auto;padding:14px 22px;background:rgba(255,252,240,.6);border:1px solid var(--edge);
  border-radius:4px;font-family:'IM Fell English',serif;position:relative}
.song h3{font-family:'Cinzel',serif;font-size:1rem;margin:0 0 2px;text-align:center}
.song .by{text-align:center;font-style:italic;font-size:.85rem;color:var(--ink3);margin-bottom:8px}
.song .st{margin:0 0 10px}
.song .ln{display:block;font-size:1.05rem;line-height:1.45;transition:color .2s,background .2s;padding:0 4px;border-radius:3px}
.song .ln.lit{background:rgba(201,162,39,.3);color:#000}
.song .sing{display:block;margin:6px auto 0}

/* side panels */
.ptitle{font-family:'Cinzel',serif;font-size:.95rem;margin:4px 0 8px;color:var(--ink);letter-spacing:.04em}
.char{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--edge)}
.char .av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;color:#fff;font-size:1rem;border:2px solid rgba(0,0,0,.25)}
.char .nm{font-weight:600}
.char .ds{font-size:.85rem;color:var(--ink2);line-height:1.3}
.char .here{font-size:.7rem;color:var(--elf);font-variant:small-caps;margin-left:4px}
.abar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.abar i{position:absolute;top:0;bottom:0;border-radius:3px}
.item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--edge)}
.item .ic{font-size:1.5rem;width:34px;text-align:center}
.item .nm{font-weight:600}.item .ds{font-size:.85rem;color:var(--ink2)}
.songli,.mapli{display:block;width:100%;text-align:left;background:rgba(255,250,235,.5);border:1px solid var(--edge);
  margin-bottom:6px;padding:7px 10px;border-radius:3px;font-size:.95rem;color:var(--ink)}
.songli small{display:block;color:var(--ink3);font-style:italic}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid button{padding:4px;background:rgba(255,250,235,.5);border:1px solid var(--edge);border-radius:3px;font-size:.75rem;color:var(--ink)}
.mapgrid svg{width:100%;height:auto;display:block}
.mapgrid .lock{opacity:.35;pointer-events:none}
.log{font-size:.88rem;line-height:1.35;padding:5px 0;border-bottom:1px dotted rgba(168,131,74,.5)}
.log b{color:var(--ink3);font-weight:400;font-style:italic}
.meta{font-size:.82rem;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .mbox{max-width:1100px;width:100%;max-height:94vh;overflow:auto;position:relative;padding:18px}
#modal .mclose{position:absolute;right:8px;top:6px;background:none;border:0;font-size:1.8rem;color:var(--ink2);z-index:2}

/* toasts */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;align-items:center}
.toast{background:#2b1d0e;color:#f3e2b2;border:1px solid var(--gold);padding:6px 14px;border-radius:16px;font-size:.92rem;
  animation:tin .3s ease-out,tout .5s 2.6s forwards;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.bad{border-color:#c2543f}.toast.good{border-color:#7fae58}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* wraith world flash */
body.wraith #wrap{filter:grayscale(1) blur(1.5px) contrast(1.3) brightness(.7);transition:filter .3s}
#eye{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 9% 18% at 50% 45%,#000 30%,transparent 32%),radial-gradient(ellipse 22% 26% at 50% 45%,#ff7a12 0%,#c22a00 45%,rgba(120,10,0,.6) 60%,transparent 75%)}
body.wraith #eye{opacity:.55}

/* games */
.gwrap{max-width:820px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.ghead .gt{font-family:'Cinzel',serif;font-size:1.1rem}
.ghud{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.ghud b{font-family:'Cinzel',serif}
canvas.gc{width:100%;height:auto;display:block;background:#000;border:2px solid #4a3317;border-radius:4px;touch-action:none}
.gmsg{min-height:1.6em;font-style:italic;text-align:center;margin:8px 0;color:var(--ink2)}
.gbar{height:16px;background:rgba(0,0,0,.15);border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin:4px 0}
.gbar i{display:block;height:100%;transition:width .08s}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin:10px auto}
.dpad button{font-size:1.3rem;border-radius:6px;border:1px solid var(--edge);background:#fff5d8}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:12px;justify-content:center;margin:14px auto}
.pad{height:110px;border-radius:12px;border:3px solid rgba(0,0,0,.3);font-size:2.4rem;color:rgba(255,255,255,.9);transition:filter .1s,transform .1s}
.pad.lit{filter:brightness(1.8) drop-shadow(0 0 14px #fff);transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{padding:10px;border:1px solid var(--edge);background:rgba(255,250,235,.6);border-radius:4px;font-size:1rem}
.opts button:hover{background:#fff8e2}
.riddle{font-family:'IM Fell English',serif;font-size:1.2rem;line-height:1.5;text-align:center;padding:14px;background:rgba(255,252,240,.5);border:1px solid var(--edge);border-radius:4px;white-space:pre-line}
.inline-input{font-family:'IM Fell English',serif;font-size:1.3rem;padding:6px 12px;border:1px solid var(--edge);border-radius:4px;background:#fffaf0;width:220px;text-align:center}
.qkeys{display:flex;gap:10px;justify-content:center;margin:12px 0}
.qkeys button{width:64px;height:64px;font-size:1.8rem;border-radius:8px;border:2px solid var(--edge);background:#fff5d8}
.qkeys button.want{background:#ffe08a;border-color:#a57b00;box-shadow:0 0 12px #ffcc33}
.qprompt{font-size:3.2rem;text-align:center;font-family:'Cinzel',serif;margin:4px 0}
.tcell{cursor:pointer}

/* title */
.titlescr{text-align:center;padding:30px 10px}
.titlescr h1{font-family:'Cinzel',serif;font-size:2.8rem;margin:10px 0 0;letter-spacing:.06em;color:#3b2408}
.titlescr .sub{font-family:'IM Fell English',serif;font-style:italic;font-size:1.25rem;color:var(--ink2)}
.titlescr .verse{font-family:'IM Fell English',serif;font-size:1.1rem;line-height:1.6;margin:18px auto;max-width:480px;color:var(--ink2)}
.titlescr .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ending h2{font-family:'Cinzel',serif;text-align:center;font-size:1.8rem;margin:6px 0}
.etable{margin:10px auto;border-collapse:collapse;font-size:.95rem}
.etable td{padding:3px 10px;border-bottom:1px dotted var(--edge)}

@media (max-width:900px){
  #top{position:static;padding:8px 12px;gap:8px}
  .brand{flex:1}
  .hbtns{order:2}
  #stats{order:3;flex:0 0 100%;gap:8px 14px}
  .side-here{display:none}
  .sview{overflow:hidden;max-height:62vh;border-radius:4px}
  .sview canvas.gc{width:860px;max-width:none}
  .sdpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin:10px auto 0;user-select:none;-webkit-user-select:none}
  .sdpad button{font-size:1.4rem;border-radius:8px;border:1px solid var(--edge);background:#fff5d8;touch-action:none}
  .sdpad button.on{background:#ffe08a}
  #wrap{grid-template-columns:minmax(0,1fr);padding:8px}
  #stage,#side{min-width:0}
  #side{position:static;max-height:none;min-height:0}
  #stage{padding:14px 14px 20px;min-height:0}
  .date{margin-left:0}
  .stat{min-width:0}.bar{width:48px}
  .text p{font-size:1.05rem}
  .opts{grid-template-columns:1fr}
  .brand{font-size:1.05rem}
}
</style>
</head>
<body>
<header id="top">
  <div class="brand">The Ring-bearer<span>A JOURNEY IN MIDDLE-EARTH</span></div>
  <div id="stats"></div>
  <div class="hbtns"><button id="btnSound" title="Sound effects">♪</button><button id="btnMenu" title="Menu">☰</button></div>
</header>
<main id="wrap">
  <section id="stage" class="parch"></section>
  <aside id="side" class="parch"><nav id="tabs"></nav><div id="panel"></div></aside>
</main>
<div id="modal" class="hidden"><div class="mbox parch"><button class="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="toasts"></div>
<div id="eye"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   THE RING-BEARER — an unofficial fan game. You are Frodo Baggins.
   All prose, songs, poems and riddles here are original; no book text is
   reproduced. Structure:
     utilities · ITEMS/CHARS · SND (WebAudio) · state & save · engine (beats,
     effects, render, side panels) · MAPS + drawMap() · VIGNETTES · SONGS ·
     BEATS (by chapter) · GAMES (minigames) · boot
   ═══════════════════════════════════════════════════════════════════════════ */

// ── UTILITIES ───────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffle(a, r){ r = r || Math.random; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const tx = t => typeof t === 'function' ? t(G) : (t || '');

// ── ITEMS ───────────────────────────────────────────────────────────────────
const ITEMS = {
  ring:     {n:'The One Ring', ic:'💍', d:'A plain gold band, heavier than it should be. It is always warm, and it wants to be worn.'},
  letter:   {n:"Gandalf's Letter", ic:'✉️', d:'Left with Butterbur at Bree, and nearly forgotten. It vouches for a Ranger called Strider.'},
  mushrooms:{n:"Maggot's Mushrooms", ic:'🍄', d:'A covered basket from Farmer Maggot. A peace offering decades overdue.'},
  blade:    {n:'Barrow-blade', ic:'🗡️', d:'A leaf-shaped dagger of Westernesse, wrought long ago against the Witch-king of Angmar.'},
  brooch:   {n:'Blue Brooch', ic:'🔷', d:'Found in the barrow. Tom took a fancy to it for Goldberry.'},
  pony:     {n:'Bill the Pony', ic:'🐴', d:'Bought for an outrageous price from Bill Ferny. Thin, sad, and devoted to Sam.'},
  athelas:  {n:'Athelas', ic:'🌿', d:'Kingsfoil. A weed to most; in a Ranger\'s hands it eases the cold of the Morgul-wound.'},
  sting:    {n:'Sting', ic:'⚔️', d:'Bilbo\'s elven short-sword. Its blade glows blue when orcs are near.'},
  mithril:  {n:'Mithril Coat', ic:'🛡️', d:'A shirt of silver rings, light as linen and harder than dragon-scale. Worth more than the Shire.'},
  phial:    {n:'Phial of Galadriel', ic:'✨', d:'The light of Eärendil\'s star, caught in the water of her fountain. A light in dark places.'},
  cloak:    {n:'Elven Cloak', ic:'🧥', d:'Grey-green, clasped with a silver leaf. It takes the colour of whatever lies near.'},
  rope:     {n:'Elven Rope', ic:'🪢', d:'Light, silver-grey and strong. Sam was particularly pleased with it.'},
  box:      {n:"Sam's Box", ic:'📦', d:'Galadriel\'s gift to Sam: earth from her orchard, and a single silver nut.'},
  staff:    {n:"Faramir's Staffs", ic:'🦯', d:'Two staves of polished wood, shod with silver, made for the Rangers of Ithilien.'},
  orcmail:  {n:'Orc Gear', ic:'⛓️', d:'Stinking mail and a black cloak taken in the Tower. A disguise, of sorts.'},
  pans:     {n:"Sam's Pans", ic:'🍳', d:'Carried all the way from the Shire. Sam would sooner leave his own feet.'}
};

// ── CHARACTERS ──────────────────────────────────────────────────────────────
const CHARS = {
  sam:     {n:'Samwise Gamgee', c:'#6b8e23', d:'Your gardener, and the stoutest heart in the Shire. Loves elves, potatoes and you, in no particular order.'},
  merry:   {n:'Meriadoc Brandybuck', c:'#a0522d', d:'Merry. Clever, practical, a born organiser of conspiracies.'},
  pippin:  {n:'Peregrin Took', c:'#cd853f', d:'Pippin. The youngest. Brave, curious, and frequently a fool of a Took.'},
  gandalf: {n:'Gandalf', c:'#7a7a8c', d:'A wizard, grey of cloak and short of temper, who has been a friend of the Bagginses for longer than anyone knows.'},
  bilbo:   {n:'Bilbo Baggins', c:'#b8860b', d:'Your cousin and guardian. Burglar, poet, eleventy-one years old and not a day over fifty to look at.'},
  maggot:  {n:'Farmer Maggot', c:'#8b6f47', d:'A farmer of the Marish with large dogs and a long memory for mushroom thieves.'},
  gildor:  {n:'Gildor Inglorion', c:'#4a7a8c', d:'An elf of the House of Finrod, journeying to the Havens.'},
  tom:     {n:'Tom Bombadil', c:'#1e6fb8', d:'Eldest. Master of wood, water and hill, with yellow boots and a blue jacket. The Ring has no power over him.'},
  goldberry:{n:'Goldberry', c:'#c8a83a', d:'The River-daughter. Her hair is like a willow in the wind, and her laughter like water.'},
  butterbur:{n:'Barliman Butterbur', c:'#8b4513', d:'Landlord of the Prancing Pony in Bree. One thing drives out another in his head.'},
  aragorn: {n:'Aragorn (Strider)', c:'#3c5a3c', d:'A Ranger of the North, weather-worn and grim. Heir of Isildur, though he does not say so at first.'},

// ── SOUND ───────────────────────────────────────────────────────────────────
// All synthesised. Effects only play if the header toggle is on; singing a
// song is an explicit request and always plays.
const SND = (() => {
  let ctx = null, on = false, master = null, playing = [], lineTimers = [];
  try { on = localStorage.getItem('ringbearerSound') === '1'; } catch (e) {}
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = mf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .25, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05); playing.push(o);
  }
  function noise(t, dur, vol, freq){
    const c = ac(); if (!c) return;
    const b = c.createBuffer(1, Math.max(1, c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 3000;
    const g = c.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); playing.push(s);
  }
  function fx(kind){
    if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    switch (kind){
      case 'click': note(84, t, .06, 'square', .05); break;
      case 'good': note(72, t, .15, 'triangle', .2); note(76, t + .08, .15, 'triangle', .2); note(79, t + .16, .3, 'triangle', .2); break;
      case 'bad': note(52, t, .3, 'sawtooth', .12); note(47, t + .12, .4, 'sawtooth', .12); break;
      case 'ring': note(40, t, 1.4, 'sine', .3); note(47, t, 1.4, 'sine', .15); noise(t, 1.2, .08, 400); break;
      case 'hit': noise(t, .15, .3, 900); break;
      case 'boom': note(30, t, .6, 'sine', .5); noise(t, .4, .25, 200); break;
      case 'firework': noise(t, .5, .25, 1800); note(ri(80, 95), t, .2, 'sine', .08); break;
      case 'splash': noise(t, .35, .2, 1200); break;
      case 'shriek': { const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(500, t + .9);
        g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.05); break; }
      case 'step': noise(t, .05, .12, 500); break;
    }
  }
  function tone(m, dur, type, vol){ if (!on) return; const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  function toneAlways(m, dur, type, vol){ const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  // play a generated melody; onLine(i) fires as each line starts
  function sing(mel, onLine, onEnd){
    stop(); const c = ac(); if (!c) { if (onEnd) onEnd(); return; }
    const beat = 60 / mel.tempo; let t = c.currentTime + .15; const t0 = t;
    mel.lines.forEach((line, li) => {
      lineTimers.push(setTimeout(() => onLine && onLine(li), (t - t0) * 1000 + 150));
      line.forEach(([m, d]) => {
        note(m, t, d * beat * 1.6, mel.voice, .22); note(m + 12, t, d * beat * .8, 'sine', .05);
        if (mel.drum && d >= 1) noise(t, .05, .06, 4000);
        t += d * beat;
      });
      note(mel.root - 12, t - line.reduce((a, n) => a + n[1], 0) * beat, line.reduce((a, n) => a + n[1], 0) * beat, 'sine', mel.drone ? .08 : .03);
      t += beat * .5;
    });
    lineTimers.push(setTimeout(() => { if (onEnd) onEnd(); }, (t - t0) * 1000 + 300));
  }
  function stop(){ lineTimers.forEach(clearTimeout); lineTimers = []; playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = []; }
  return { fx, tone, toneAlways, sing, stop, ac,
    get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('ringbearerSound', v ? '1' : '0'); } catch (e) {} } };
})();

// ── STATE ───────────────────────────────────────────────────────────────────
const SAVE_KEY = 'ringbearerSave';
let G = null;
const UI = { tab:'map', game:null, inst:null, mapZoom:null };

function newGame(){
  return {
    version:1, beat:null, chapter:1, chTitle:'', date:'', map:'shire', loc:'bagend',
    stats:{hope:60, health:100, burden:4, food:6},
    aff:{sam:60, merry:50, pippin:50, gandalf:55, bilbo:70, aragorn:0, legolas:0, gimli:0, boromir:0, smeagol:0, faramir:0},
    met:['sam','merry','pippin','gandalf','bilbo','rosie'],
    party:['sam'],
    items:['ring'], flags:{}, songs:[], maps:['middle','shire'], seen:{}, route:['hobbiton'],
    log:[], ringUses:0, games:{}, pending:null, checkpoint:null, ending:null, started:Date.now()
  };
}
function save(){ if (!G) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function tryLoad(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.version === 1 && BEATS[s.beat]) return s; } catch (e) {}
  return null;
}
function snapshot(){ const c = Object.assign({}, G); delete c.checkpoint; return JSON.parse(JSON.stringify(c)); }

const has = k => G.items.indexOf(k) >= 0;
const flag = k => !!G.flags[k];
const aff = k => G.aff[k] || 0;
const inParty = k => G.party.indexOf(k) >= 0;

// ── EFFECTS ─────────────────────────────────────────────────────────────────
const STAT_NAME = {hope:'Hope', health:'Health', burden:'Burden', food:'Provisions'};
function applyFx(fx){
  const out = [];
  if (!fx) return out;
  ['hope','health','burden','food'].forEach(k => {
    if (fx[k]){
      const max = k === 'food' ? 20 : 100, before = G.stats[k];
      G.stats[k] = clamp(before + fx[k], 0, max);
      const d = G.stats[k] - before; if (!d) return;
      const good = k === 'burden' ? d < 0 : d > 0;
      out.push({t:`${STAT_NAME[k]} ${d > 0 ? '+' : ''}${d}`, c: k === 'burden' && d > 0 ? 'ring' : good ? 'good' : 'bad'});
    }
  });
  if (fx.aff) for (const k in fx.aff){
    const v = fx.aff[k]; G.aff[k] = clamp((G.aff[k] || 0) + v, -100, 100);
    const nm = (CHARS[k] ? CHARS[k].n : k).split(/[ (/]/)[0];
    out.push({t:`${nm} ${v > 0 ? '♥+' + v : '♥' + v}`, c: v > 0 ? 'good' : 'bad'});
  }
  [].concat(fx.item || []).forEach(k => { if (!has(k)){ G.items.push(k); out.push({t:'Gained: ' + ITEMS[k].n, c:'good'}); } });
  [].concat(fx.lose || []).forEach(k => { const i = G.items.indexOf(k); if (i >= 0){ G.items.splice(i, 1); out.push({t:'Lost: ' + ITEMS[k].n, c:'bad'}); } });
  [].concat(fx.flag || []).forEach(k => { G.flags[k] = true; });
  if (fx.flags) Object.assign(G.flags, fx.flags);
  [].concat(fx.song || []).forEach(k => { if (learnSong(k)) out.push({t:'Song learned: ' + SONGS[k].title, c:'good'}); });
  [].concat(fx.map || []).forEach(k => { if (unlockMap(k)) out.push({t:'New map: ' + MAPS[k].title, c:'good'}); });
  [].concat(fx.meet || []).forEach(k => { if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.join || []).forEach(k => { if (G.party.indexOf(k) < 0) G.party.push(k); if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.leave || []).forEach(k => { const i = G.party.indexOf(k); if (i >= 0) G.party.splice(i, 1); });
  return out;
}
// Using the Ring: burden rises faster when hope is low.
function ringUse(base){
  G.ringUses++;
  const mult = 1 + Math.max(0, 50 - G.stats.hope) / 100;
  const out = applyFx({burden: Math.round((base || 8) * mult)});
  wraithFlash();
  return out;
}
function wraithFlash(){
  SND.fx('ring');
  document.body.classList.add('wraith');
  setTimeout(() => { if (!UI.ringHeld) document.body.classList.remove('wraith'); }, 1700);
}
function learnSong(k){ if (!SONGS[k] || G.songs.indexOf(k) >= 0) return false; G.songs.push(k); return true; }
function unlockMap(k){ if (!MAPS[k] || G.maps.indexOf(k) >= 0) return false; G.maps.push(k); return true; }
function addLog(t){ G.log.unshift({d:G.date, t}); if (G.log.length > 150) G.log.length = 150; }
function markSeen(map, loc){ if (!G.seen[map]) G.seen[map] = []; if (G.seen[map].indexOf(loc) < 0) G.seen[map].push(loc); }

function toast(chips){
  const box = $('#toasts');
  chips.forEach((c, i) => setTimeout(() => {
    const d = document.createElement('div'); d.className = 'toast ' + (c.c || ''); d.textContent = c.t;
    box.appendChild(d); setTimeout(() => d.remove(), 3300);
  }, i * 220));
}

// ── BEAT ENGINE ─────────────────────────────────────────────────────────────
function goBeat(id){
  const b = BEATS[id];
  if (!b){ console.error('Missing beat', id); return; }
  const re = G.beat === id;   // returning to the same beat after a talk choice: no entry effects
  G.beat = id; G.pending = null;
  if (re){ save(); render(); return; }
  if (b.chapter){ G.chapter = b.chapter; G.chTitle = b.chTitle; G.checkpoint = null; G.checkpoint = snapshot(); }
  let chips = [];
  // the nearer Mordor, the heavier the Ring
  if (b.chapter >= 11 && b.chapter <= 18){ chips = chips.concat(applyFx({burden:2})); chips.push({t:'The Ring grows heavier', c:'ring'}); }
  if (b.date) G.date = b.date;
  if (b.map){ G.map = b.map; unlockMap(b.map); }
  if (b.loc){ G.loc = b.loc; markSeen(G.map, b.loc); }
  if (b.w && G.route[G.route.length - 1] !== b.w) G.route.push(b.w);
  if (b.fx) chips = chips.concat(applyFx(b.fx));
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) learnSong(sg);
  if (b.travel){
    const need = b.travel;
    if (G.stats.food >= need) chips = chips.concat(applyFx({food:-need}));
    else { const short = need - G.stats.food; chips = chips.concat(applyFx({food:-G.stats.food, health:-6 * short, hope:-3 * short}));
      chips.push({t:'Hungry on the road', c:'bad'}); }
  }
  if (b.enter) b.enter(G);
  if (b.log) addLog(tx(b.log));
  if (G.stats.health <= 0 && !b.ending && id !== 'fallen'){ save(); return goBeat('fallen'); }
  if (G.stats.burden >= 100 && !b.ending && id !== 'claimed'){ save(); return goBeat('claimed'); }
  if (chips.length) toast(chips);
  save();
  render();
  window.scrollTo(0, 0);
}
function visibleChoices(b){ return (b.choices ? tx(b.choices) : []).filter(c => !c.if || c.if(G)); }
function choose(i){
  const b = BEATS[G.beat], c = visibleChoices(b)[i]; if (!c) return;
  SND.fx('click');
  let chips = applyFx(typeof c.fx === 'function' ? c.fx(G) : c.fx);
  if (c.ring) chips = chips.concat(ringUse(c.ring === true ? 8 : c.ring));
  if (c.act) c.act(G);
  let next = typeof c.go === 'function' ? c.go(G) : (c.go || G.beat);
  if (G.stats.health <= 0) next = 'fallen';
  if (G.stats.burden >= 100) next = 'claimed';
  const res = tx(c.res);
  if (res){ G.pending = {text:res, chips, next}; save(); render(); window.scrollTo(0, 0); }
  else { if (chips.length) toast(chips); goBeat(next); }
}
function continuePending(){ const n = G.pending.next; G.pending = null; goBeat(n); }

// ── RENDER ──────────────────────────────────────────────────────────────────
function paras(t, first){
  return String(t).split(/\n\s*\n/).map((p, i) => `<p class="${first && i === 0 ? 'first' : ''}">${p.trim()}</p>`).join('');
}
function chipHTML(chips){ return chips && chips.length ? `<div class="chips">${chips.map(c => `<span class="chip ${c.c || ''}">${esc(c.t)}</span>`).join('')}</div>` : ''; }
function locName(map, loc){
  const m = MAPS[map]; if (!m) return ''; const p = m.places.find(p => p.k === loc); return p ? p.n : '';
}
function headerHTML(b){
  return `<div class="chaphead"><div class="cn">CHAPTER ${romanize(G.chapter)}</div><h2>${esc(G.chTitle || '')}</h2>
    <div class="where">${esc(b.title || locName(G.map, G.loc))}</div></div><div class="rule"></div>`;
}
function romanize(n){ const r = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]]; let s = ''; r.forEach(([k, v]) => { while (n >= v){ s += k; n -= v; } }); return s; }
function artHTML(b){
  if (b.art === 'none') return '';
  if (b.art && VIGNETTES[b.art]) return `<div class="art" data-vig="${b.art}">${VIGNETTES[b.art]()}</div>`;
  const map = b.map || G.map;
  return `<div class="art" data-map="${map}">${drawMap(map, {here:G.loc, small:true})}<span class="hint">click to enlarge</span></div>`;
}
function render(){
  renderStats(); renderSide();
  if (!G){ renderTitle(); return; }
  if (UI.game) return;
  const st = $('#stage'), b = BEATS[G.beat];
  if (b.ending){ st.innerHTML = renderEnding(b); wireStage(); return; }
  let h = headerHTML(b);
  if (G.pending){
    h += `<div class="text">${paras(G.pending.text, true)}</div>${G.pending.chips.length ? `<div class="result">${chipHTML(G.pending.chips)}</div>` : ''}
      <div class="choices"><button class="choice go" data-cont>Continue…</button></div>`;
    st.innerHTML = h; wireStage(); return;
  }
  h += artHTML(b);
  h += `<div class="text">${paras(tx(b.text), true)}</div>`;
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) h += songCard(sg);
  if (b.game){
    const gc = tx(b.game);
    h += `<div class="choices"><button class="choice game go" data-game>${esc(gc.label || 'Begin')}</button>
      <button class="choice" data-skip>Let fate decide <span class="tag">skip the game · an average outcome</span></button></div>`;
  } else {
    const cs = visibleChoices(b);
    h += `<div class="choices">${cs.map((c, i) => {
      const cls = ['choice', c.ring ? 'ring' : '', c.talk ? 'talk' : '', c.cls || ''].join(' ');
      return `<button class="${cls}" data-c="${i}">${tx(c.t)}${c.tag ? `<span class="tag">${tx(c.tag)}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }
  st.innerHTML = h; wireStage();
}
function wireStage(){
  const st = $('#stage');
  st.querySelectorAll('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c));
  const cont = st.querySelector('[data-cont]'); if (cont) cont.onclick = continuePending;
  const gb = st.querySelector('[data-game]'); if (gb) gb.onclick = () => startGame(tx(BEATS[G.beat].game));
  const sk = st.querySelector('[data-skip]'); if (sk) sk.onclick = () => { const gc = tx(BEATS[G.beat].game); UI.game = gc; finishGame({win: Math.random() < .55, score: .5, msg:'You let fate take its course.', fx: gc.skipFx}); };
  const art = st.querySelector('.art'); if (art) art.onclick = () => art.dataset.map ? openMap(art.dataset.map) : null;
  st.querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(el.dataset.sing, el.closest('.song')));
  st.querySelectorAll('[data-restart]').forEach(el => el.onclick = () => { if (confirm('Begin a new journey? Your current progress will be lost.')) startNew(); });
  st.querySelectorAll('[data-checkpoint]').forEach(el => el.onclick = restoreCheckpoint);
  st.querySelectorAll('[data-new]').forEach(el => el.onclick = startNew);
  st.querySelectorAll('[data-load]').forEach(el => el.onclick = () => { G = tryLoad(); render(); });
}
function restoreCheckpoint(){
  if (!G.checkpoint) return;
  const cp = G.checkpoint; G = JSON.parse(JSON.stringify(cp)); G.checkpoint = cp; G.pending = null;
  UI.game = null; if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null;
  save(); closeModal(); render(); toast([{t:'Returned to the start of the chapter'}]);
}
function startNew(){ SND.stop(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = newGame(); closeModal(); goBeat('start'); }

function renderStats(){
  const el = $('#stats');
  if (!G){ el.innerHTML = ''; return; }
  const s = G.stats;
  const bar = (v, c) => `<span class="bar"><i style="width:${v}%;background:${c}"></i></span>`;
  const glow = 4 + s.burden / 6, rc = s.burden > 70 ? '#ff5a1a' : s.burden > 40 ? '#ffb02e' : '#ffd76a';
  el.innerHTML = `
    <span class="stat" title="Hope: low hope makes the Ring's pull stronger"><span class="lbl">hope</span>${bar(s.hope, 'linear-gradient(90deg,#c9a227,#fff1a8)')}</span>
    <span class="stat" title="Health: at nothing, the journey ends"><span class="lbl">health</span>${bar(s.health, 'linear-gradient(90deg,#8b1e1e,#d65a3a)')}</span>
    <span class="stat" title="Burden: the Ring's hold on you. At 100 it claims you."><span class="ringicon" style="box-shadow:0 0 ${glow}px ${rc};border-color:${rc}"></span><span class="lbl">burden</span> ${s.burden}</span>
    <span class="stat" title="Provisions: meals and lembas for the road">🍞 <span class="lbl">food</span> ${s.food}</span>
    <span class="date">${esc(G.date || '')}</span>`;
}
const TABS = [['map','Journey'],['fellow','Fellowship'],['pack','Pack'],['songs','Songs'],['maps','Maps'],['log','Journal']];
function renderSide(){
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${UI.tab === k ? 'on' : ''}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; renderSide(); });
  const p = $('#panel');
  if (!G){ p.innerHTML = `<div class="ptitle">Middle-earth</div>${drawMap('middle', {small:true})}<p class="meta">Begin a journey to fill these pages.</p>`; return; }
  let h = '';
  if (UI.tab === 'map'){
    h = `<div class="ptitle">The Journey So Far</div><div class="art" data-map="middle">${drawMap('middle', {small:true, worldRoute:true})}</div>
      <p class="meta">${G.route.length} place${G.route.length === 1 ? '' : 's'} on the road behind you. Click to enlarge.</p>
      <div class="side-here"><div class="ptitle">Here</div><div class="art" data-map="${G.map}">${drawMap(G.map, {here:G.loc, small:true})}</div></div>`;
  } else if (UI.tab === 'fellow'){

    h += order.map(k => {
      const c = CHARS[k], a = G.aff[k];
      const ab = a === undefined ? '' : `<div class="abar"><i style="left:${a >= 0 ? 50 : 50 + a / 2}%;width:${Math.abs(a) / 2}%;background:${a >= 0 ? '#5a8a3a' : '#a33'}"></i></div>`;
      return `<div class="char"><div class="av" style="background:${c.c}">${c.n[0]}</div><div style="flex:1"><span class="nm">${esc(c.n)}</span>${inParty(k) ? '<span class="here">with you</span>' : ''}<div class="ds">${esc(c.d)}</div>${ab}</div></div>`;
    }).join('');
  } else if (UI.tab === 'pack'){
    h = `<div class="ptitle">What You Carry</div>` + G.items.map(k => `<div class="item"><div class="ic">${ITEMS[k].ic}</div><div><div class="nm">${esc(ITEMS[k].n)}</div><div class="ds">${esc(ITEMS[k].d)}</div></div></div>`).join('')
      + `<p class="meta">The Ring has been worn ${G.ringUses} time${G.ringUses === 1 ? '' : 's'}.</p>`;
  } else if (UI.tab === 'songs'){
    h = `<div class="ptitle">Songs &amp; Verses (${G.songs.length}/${Object.keys(SONGS).length})</div>`
      + (G.songs.length ? G.songs.map(k => `<button class="songli" data-song="${k}">${esc(SONGS[k].title)}<small>${esc(SONGS[k].by)}</small></button>`).join('') : '<p class="meta">You have heard no songs yet. There will be many.</p>');
  } else if (UI.tab === 'maps'){
    h = `<div class="ptitle">Maps (${G.maps.length}/${Object.keys(MAPS).length})</div><div class="mapgrid">`
      + Object.keys(MAPS).map(k => G.maps.indexOf(k) >= 0
        ? `<button data-map="${k}">${drawMap(k, {thumb:true})}${esc(MAPS[k].title)}</button>`
        : `<button class="lock">${'<svg viewBox="0 0 100 70"><rect width="100" height="70" fill="#d9c493"/><text x="50" y="42" text-anchor="middle" font-size="22" fill="#8a6c45">?</text></svg>'}Unexplored</button>`).join('') + `</div>`;
  } else if (UI.tab === 'log'){
    h = `<div class="ptitle">Red Book Notes</div>` + (G.log.length ? G.log.map(l => `<div class="log"><b>${esc(l.d)}</b> — ${esc(l.t)}</div>`).join('') : '<p class="meta">Nothing written yet.</p>');
  }
  p.innerHTML = h;
  p.querySelectorAll('[data-map]').forEach(el => el.onclick = () => openMap(el.dataset.map));
  p.querySelectorAll('[data-song]').forEach(el => el.onclick = () => openSong(el.dataset.song));
}

function openModal(html){ $('#mbody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); SND.stop(); }
function openMap(k){
  const m = MAPS[k];
  openModal(`<div class="center" style="font-family:Cinzel,serif;font-size:1.2rem">${esc(m.title)}</div>
    <div class="center meta" style="margin-bottom:8px;font-style:italic">${esc(m.sub || '')}</div>
    ${drawMap(k, {here: k === G.map ? G.loc : null, worldRoute: k === 'middle', big:true})}
    ${m.notes ? `<p class="meta" style="margin-top:8px">${esc(m.notes)}</p>` : ''}`);
}
function openSong(k){
  openModal(songCard(k, true));
  $('#mbody').querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(k, el.closest('.song')));
}

// geometry helpers
function pointInPoly(x, y, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;

}
function smoothPath(pts, closed){

  const at = i => closed ? pts[(i + L) % L] : pts[clamp(i, 0, L - 1)];
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  const n = closed ? L : L - 1;
  for (let i = 0; i < n; i++){
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${f(c1x)},${f(c1y)} ${f(c2x)},${f(c2y)} ${f(p2[0])},${f(p2[1])}`;

}

    for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }

}

function songMelody(k){
  const s = SONGS[k];
  if (s._mel) return s._mel;
  const SC = {major:[0,2,4,5,7,9,11], mixo:[0,2,4,5,7,9,10], dorian:[0,2,3,5,7,9,10], aeolian:[0,2,3,5,7,8,10]}[s.mode];
  const r = seeded(hash(k)), root = s.mode === 'major' || s.mode === 'mixo' ? 62 : 60;
  const deg2m = d => root + 12 * Math.floor(d / 7) + SC[((d % 7) + 7) % 7];
  const lines = [];
  // one musical phrase per text line; phrases A/B repeat across stanzas
  const phrase = (len, end, seedR) => {
    const out = []; let d = Math.floor(seedR() * 5);
    for (let i = 0; i < len; i++){
      const last = i === len - 1;
      if (last) d = end;
      else { const st = seedR(); d += st < .35 ? 1 : st < .7 ? -1 : st < .85 ? 2 : -2; d = clamp(d, -2, 9); }
      const dur = last ? 2 : (seedR() < .25 && i < len - 2 ? .5 : 1);
      out.push([deg2m(d), dur]);
      if (dur === .5) out.push([deg2m(d + (seedR() < .5 ? 1 : -1)), .5]);
    }
    return out;
  };
  const phrases = [0, 1, 2, 3].map(i => phrase(7 + (i % 2), i === 3 ? 0 : i === 1 ? 4 : 2, seeded(hash(k + i))));
  s.v.forEach(st => st.forEach((ln, i) => lines.push(phrases[(i + (st.length === 2 ? i : 0)) % 4])));
  return (s._mel = {lines, tempo:s.tempo, voice: s.drum ? 'square' : 'triangle', root, drone:!!s.drone, drum:!!s.drum});
}
function songCard(k, full){
  const s = SONGS[k];
  let li = 0;
  const st = s.v.map(stz => `<div class="st">${stz.map(l => `<span class="ln" data-l="${li++}">${esc(l)}</span>`).join('')}</div>`).join('');
  return `<div class="song"><h3>${esc(s.title)}</h3><div class="by">${esc(s.by)}</div>${st}<button class="btn gold sing" data-sing="${k}">♪ Sing it</button></div>`;
}
function singSong(k, card){
  const mel = songMelody(k), lines = card ? card.querySelectorAll('.ln') : [];
  const btn = card && card.querySelector('.sing');
  if (btn){ if (btn.dataset.on){ SND.stop(); lines.forEach(l => l.classList.remove('lit')); btn.textContent = '♪ Sing it'; delete btn.dataset.on; return; }
    btn.dataset.on = 1; btn.textContent = '■ Stop'; }
  SND.sing(mel, i => { lines.forEach(l => l.classList.remove('lit')); if (lines[i]) lines[i].classList.add('lit'); },
    () => { lines.forEach(l => l.classList.remove('lit')); if (btn){ btn.textContent = '♪ Sing it'; delete btn.dataset.on; } });
}

start:{chapter:1, chTitle:'A Long-expected Party', date:'22 September, T.A. 3001', map:'shire', loc:'bagend', w:'hobbiton', art:'bagend',
  text:`The morning of your thirty-third birthday comes up gold over the Hill, and Bag End is in uproar. Today you come of age. Today, more importantly, your cousin Bilbo turns one hundred and eleven, and he has invited half the Shire to say so.

The Party Field below the Hill is a forest of tents and trestles. Carts have been rumbling up the lane since dawn, and the biggest of them is driven by an old man in a tall pointed hat, grey cloak and silver scarf, whose beard reaches below his belt. The hobbit-children of Hobbiton run behind it shrieking <em>"G! G! G!"</em> because the crates are stamped with a red G-rune, and everyone knows what that means.

    {t:'Run down and help Gandalf unload the crates.', go:'fireworks', fx:{aff:{gandalf:5}}, res:`Gandalf looks down at you from the cart, and for a moment his face is stern and searching, and then it splits into a grin. "Frodo Baggins! Of age at last, and still running about like a tweenager. Take that end — <em>gently</em> — and if anything begins to fizz, drop it and run."\n\nBy evening you have carried a hundred crates and know which ones hum.`},

bilbo1:{title:'Bag End', text:`Bilbo is in his study with the curtains drawn, sitting among stacks of parcels, each one labelled in his spidery hand. He jumps when you come in, and something small and bright goes quickly into his waistcoat pocket.

  choices:[
    talk('b1', '"Where would you go?"', `"Oh, to see mountains again. Real mountains, Frodo. And to finish my book." He waves a hand at a heap of paper on the desk, the top page reading <em>There and Back Again</em>. "I've a feeling I know how it ends, but I want to be somewhere quiet when I write it down."`, {aff:{bilbo:3}}),

sam1:{title:'The gate of Bag End', text:`"There's dwarves come," Sam says in a low, thrilled voice, as a party of hooded travellers in green and blue trudge past toward the Field. "Real dwarves, Mr. Frodo. And Gaffer says there'll be <em>dragons</em> tonight, out of the old wizard's cart. Fireworks dragons, I mean. Not real." He looks as if he would not mind if they were.

    talk('s2', '"Is Rosie Cotton coming tonight?"', `Sam goes redder than you thought a hobbit could go. "I'm sure I couldn't say, Mr. Frodo," he mumbles to the rake. You know perfectly well that he could.`, {aff:{sam:2}}),

fireworks:{title:'The Party Field', text:`Dusk. The lanterns are lit in the trees, the feast is eaten (mostly), and every eye on the Field is on the old wizard standing alone by his crates with a long taper in his hand.

speech:{title:'The Party Pavilion', text:`After supper, Bilbo climbs onto his chair under the great tree. He makes a speech that begins with a great deal of flattery and ends in a great deal of confusion: he says he does not know half of them half as well as he should like, and that he likes less than half of them half as well as they deserve. The guests are still working out whether this is a compliment when he says:

bilbo_leaves:{title:'Bag End, that night', text:`You find Gandalf in the hall, and Bilbo in the study with his old travelling cloak on and a pack on his back, chuckling like a boy who has thrown a frog into a christening.

But the laughter stops when Gandalf speaks of the ring. They do not see you in the dark of the passage. You hear Bilbo's voice rise, high and querulous — <em>"It's mine! I found it! It came to me!"</em> — and Gandalf's answer, which seems to make the whole smial grow dim and cold: <em>"Bilbo. Look at me. I have been your friend for sixty years. I want nothing from you but your own good. Let it go."</em>

A long silence. Then Bilbo, quite quietly: "Yes. You're right, of course. I'll leave it to Frodo, with everything else." An envelope is laid on the mantelpiece. Bilbo walks past you in the passage, stops, and puts a hand on your shoulder.`,

  ]},
bilbo_road:{title:'The lane below Bag End', song:'road', text:`Three dwarves are waiting at the bottom of the lane. Bilbo shoulders his pack and strides off down the road toward the East, and as he goes he begins to sing, softly at first and then louder, in a voice that sounds forty years younger than it did this morning. You stand at the gate and listen until the song is lost in the night.`,
  choices:[{t:'Go back up to Bag End, where Gandalf is waiting.', go:'envelope'}]},
envelope:{title:'The study at Bag End', text:`Gandalf is sitting by the dying fire. The envelope lies on the mantel, fat and sealed. Inside, when you open it, is a plain gold ring. It is warmer than the room, and heavier than gold ought to be, and it sits in your palm like something that has been waiting.

"Bilbo's ring," Gandalf says, without looking at it. "He has gone, and it is yours now, with everything else. Hide it away, Frodo. Tell no one you have it — and do not use it. Not at all, if you can help it." He stands, and suddenly he looks tired and very old. "I must go away for a while. Do not be alarmed if I am gone some time."

And then he is gone too, and you are master of Bag End, alone with a ring.`,
  choices:[
    {t:'Put it on, just once, to see.', ring:6, go:'years', res:`The world goes grey. The fire is a dull smear of ash-coloured light; the walls are thin as smoke. And somewhere far away in the east something turns, like a head turning towards a sound in the night.\n\nYou tear the ring off. Your heart is hammering. Everything is warm and brown and normal again. You put it in its envelope and do not do that again for a very long time.`},
    {t:'Seal it back in the envelope and lock it in your desk.', go:'years', fx:{hope:4}, res:'You lock the drawer, and put the key on your watch-chain. Later — much later — you will find it on a fine chain round your neck, and you will not remember putting it there.'},
    {t:'Hang it on a chain round your neck, where you can be sure of it.', go:'years', fx:{burden:2, flag:'chain'}}
  ]},
years:{title:'Seventeen years', date:'Spring, T.A. 3018', art:'shire', text:`The Shire forgets the Party in a year and gossips about it for seventeen. "Mad Baggins," they say of Bilbo, and "young Mad Baggins" of you, because you never seem to grow older. At fifty you look thirty-three. Gandalf comes, now and then, at long intervals, always asking odd questions about your health. Then for nine years he does not come at all.

There is strange news on the borders. Dwarves passing through in a hurry. Elves walking west through the woods at evening who do not return. Talk in the inns of trouble down south, in a land called Mordor.`,
  choices:[{t:'Spend an evening at the Green Dragon in Bywater.', go:'dragon'},{t:'Stay home and read Bilbo\'s maps by the fire.', go:'gandalf_returns', fx:{map:'middle', hope:2}}]},
dragon:{title:'The Green Dragon, Bywater', loc:'greendragon', text:`The Green Dragon is warm and loud and smells of beer and pipe-weed. Sam is holding forth at the end of the bench to Ted Sandyman, the miller's son, about a giant as big as a tree that his cousin Hal saw walking up beyond the North Moors.

"Your cousin Hal," says Ted, "sees whatever his ale tells him to." Everyone laughs. Sam's ears go pink. "And there's elves," Sam presses on, stubbornly. "Going west. Sailing. Leaving Middle-earth for good, they say. That's sad, that is."`,
  choices:[
    {t:'Back Sam up. "I have seen the elves pass myself, Ted."', go:'gandalf_returns', fx:{aff:{sam:8}, hope:3}, res:'The bench goes quiet. Nobody contradicts a Baggins of Bag End in public, even a mad one. Sam walks home beside you glowing like a lantern, and talks about elves all the way up the Hill.'},
    {t:'Laugh with the others, but buy Sam an ale afterwards.', go:'gandalf_returns', fx:{aff:{sam:2}}},
    {t:'Ask Rosie Cotton, who is serving, if Sam can have the next dance.', go:'gandalf_returns', fx:{aff:{sam:5, rosie:6}}, res:'Rosie laughs and says Sam would have to ask her himself. Sam spills his ale. Later you see them dancing very stiffly by the fire, both scarlet, and you count it a good evening\'s work.'}
  ]},
gandalf_returns:{title:'Bag End, April', loc:'bagend', art:'ring', text:`He comes back one spring morning without warning, looking older and more careworn than you have ever seen him. That evening he asks for the ring. You hand it over — and find, to your surprise, that it is hard to do.

Gandalf throws it into the fire.

You cry out and reach for the tongs, but he stops you. After a while he fishes it out and drops it, cool as stone, into your hand. "Hold it up," he says. And there, on the band, inside and out, are lines of fire: fine flowing letters in a tongue you do not know, writing that seems to come from deep within the gold.

"The language of Mordor," Gandalf says quietly. "I will not speak it here. It says, more or less, that this ring was made to rule all the others — the Elven-rings, the Dwarf-rings, the rings of Men — and to find them, and to bind them in the dark. Frodo, this is the Ruling Ring. The One. Made by Sauron the Great in the fires of Mount Doom, lost for three thousand years, and he is looking for it now, with all his will."`,
  choices:[
    {t:'"How did Bilbo come to have it?"', go:'gollum_tale'},
    {t:'"Take it, Gandalf! You are wise and powerful. You take it!"', go:'offer_gandalf'}
  ]},
gollum_tale:{title:'Bag End', text:`Gandalf tells you of a creature named Gollum, who was once a hobbit-like river-dweller called Sméagol. He murdered his friend for the ring on the day it was found, and it gave him a long, thin, wretched life under the Misty Mountains, where he hid in the dark and talked to himself and called it his <em>precious</em>. Then Bilbo found it, by what looked like chance, and kept it, and escaped. "And Gollum came out of his mountains to look for it," Gandalf says, "and was caught, at last, in Mordor. They will have got from him two words: <em>Shire</em> and <em>Baggins</em>."

You feel cold all over.`,
  choices:[
    {t:'"What a pity Bilbo did not kill the vile thing when he had the chance!"', go:'pity', res:`Gandalf looks at you for a long while. "A pity? It was pity that held his hand, Frodo, and I am glad of it. You speak very easily of death. Could you give life back, as easily as you would take it away? Then do not be so quick to hand out judgement. Not even the wisest of us can see where every road ends."\n\nHe pauses. "I have a feeling about Gollum. He is not finished with this tale, for good or for ill. And Bilbo's mercy may yet matter to more people than Bilbo."\n\nYou say nothing. But you remember.`, fx:{flag:'pityLesson'}},
    {t:'"Poor wretched creature. What it must have been, to be eaten up like that."', go:'pity', fx:{aff:{gandalf:6, smeagol:10}, flags:{pityLesson:true, pitied:true}}, res:'Gandalf\'s face softens. "Yes. That is the right word — pity. It was pity that stayed Bilbo\'s hand, and I think it was well that it did. Hold on to that, Frodo. It may matter more than you know."'}
  ]},
offer_gandalf:{title:'Bag End', text:`"No!" Gandalf springs to his feet, and for a moment he seems to grow tall and terrible, and the room is full of shadow. "Do not tempt me, Frodo! I dare not take it, not even to keep it safe. Understand: I would use this ring from a desire to do good. But through me it would wield a power too great and terrible to imagine."

He sits down again, and he is just an old man, breathing hard. "No. It must be destroyed. And there is only one place where it can be."`,
  choices:[{t:'"Where?"', go:'pity', fx:{aff:{gandalf:3}}, res:'"In the fire where it was made. In the Cracks of Doom, in the heart of Mordor." You laugh, a high nervous laugh, and then you see that he is not joking. "But not yet, and not by you, perhaps. For now: you cannot stay in the Shire. It is no longer safe while the Ring is here."'}]},
pity:{title:'Bag End', text:`"I wish the ring had never come to me," you say. "I wish none of this had happened."

"Everyone who lives in a dark hour wishes that," says Gandalf. "We do not choose the hour. We only choose what we do with it."

You turn the ring over in your fingers. You try, just to see, to throw it into the fire. Your hand will not open.

"I suppose I will have to go away," you say at last. "Somewhere far from the Shire. I feel very small, Gandalf. And very uprooted."

A sound comes from outside the open window: a <em>click</em> of garden shears that has stopped clicking a good while ago.`,
  choices:[{t:'"Who\'s there?"', go:'sam_window'}]},
sam_window:{title:'Under the window', text:`Gandalf's long arm shoots out through the window and hauls in, by one ear, a very frightened Samwise Gamgee.

"Bless me, Mr. Frodo, sir!" Sam cries. "I wasn't dropping no eaves, honest! I was just cutting the grass under the window, and — well, I heard a deal, I won't say I didn't. Something about a ring, and a Dark Lord, and dragons, and — and <em>elves</em>, sir! I'd dearly love to see elves." He looks up at the wizard, who is glowering terribly.

"What shall we do with him, Frodo?" Gandalf says. "Turn him into something unnatural?"`,
  choices:[
    {t:'"Let him come with me. I would be glad of the company."', go:'plan', fx:{aff:{sam:10, gandalf:3}, res:''}, res:'Sam stares at you, and then at Gandalf, and then bursts into tears. "Me go and see elves and all! Hooray!"\n\n"That," says Gandalf drily, "is your punishment, Samwise. You will go with your master, and you will tell no one. And you will keep him safe."\n\n"I will, sir," Sam says, quite seriously. "I won\'t lose him."'},
    {t:'"Turn him into a toad, Gandalf. A garden toad."', go:'plan', fx:{aff:{sam:6}}, res:'Sam goes white as milk. Gandalf throws back his head and laughs. "No, I have a better idea. You will go with your master, Samwise, and keep him safe, and tell no one — that is your punishment." Sam looks at you as if you had given him the moon.'}
  ]},
plan:{title:'Bag End, summer', text:`It is decided. You will sell Bag End — to Lobelia Sackville-Baggins, who has wanted it for sixty years — and give out that you are retiring to a little house at Crickhollow in Buckland, on the far eastern edge of the Shire. From there you will slip away quietly towards Rivendell, where Elrond the Half-elven will give counsel.

Gandalf goes south in midsummer on urgent business. "I'll be back before your birthday," he promises. "Leave by then at the latest. And Frodo — don't use the Ring."

Summer passes. Your birthday comes. Gandalf does not.`,
  choices:[
    {t:'Hand Lobelia the keys with a gracious bow.', go:'ch2', fx:{hope:3}, res:'"Well! At last," says Lobelia, snatching the keys, and inspects the spoons. You find, at the last, that you do not much mind. Bag End was Bilbo\'s more than yours. You walk out of the round green door without looking back.'},
    {t:'Wait one more night for Gandalf. He promised.', go:'ch2', fx:{hope:-4, burden:2}, res:'He does not come. You lie awake listening to the wind in the chimney, and the Ring lies on its chain against your heart, and in the dark you could swear it was listening too.'}
  ]}
});

// ── II. THREE IS COMPANY ────────────────────────────────────────────────────
Object.assign(BEATS, {
ch2:{chapter:2, chTitle:'Three is Company', date:'23 September, T.A. 3018', map:'shire', loc:'hobbiton', art:'shire', fx:{join:'pippin'}, song:'evening',
  log:'Left Bag End by night with Sam and Pippin, walking east.',
  text:`You leave by night, three hobbits with heavy packs: you, Sam, and young Pippin Took, who is coming as far as Crickhollow and thinks it all a tremendous lark. Merry has gone ahead with the carts to make the house ready.

The Hill drops behind you, and the lights of Hobbiton, and then the last farm. The stars are very bright. Pippin starts a walking song and you all join in, quietly, because it is late and the Shire is asleep.`,
  choices:[{t:'Walk on into the Green Hill Country.', go:'rider_road'}]},
rider_road:{title:'A lane in the Green Hill Country', loc:'woodyend', date:'24 September, T.A. 3018', travel:1, text:`Late next afternoon, on a lonely lane among the trees, Sam stops dead. "Hoofs," he says. "Coming up behind."

You don't know why, but a terrible fear takes you. "Off the road! Quick!" You throw yourselves into a hollow beneath a great tree root as a horse comes round the bend.

It is black, and so is its rider: a tall shape wrapped in black from hood to boot, with only darkness where its face ought to be. It stops right by your tree. It leans down from the saddle, and you hear it <em>sniffing</em> — slow, deep breaths, like a hound at a rabbit-hole. The hood turns this way and that.

And the Ring on its chain begins to pull at you, like a hand. <em>Put me on. Put me on and you will be safe. It will not see you.</em>`,
  game:{type:'resist', label:'Lie still and resist the Ring', duration:20, pull:9, foe:'The Black Rider', win:'rider_gone', lose:'rider_slip',
    fxWin:{hope:5}, winText:'The sniffing stops. The rider straightens, turns the horse, and rides slowly away into the gathering dusk. Your hand is clenched so tight round the chain that the links have left a mark in your palm.',
    loseText:'Your fingers find the Ring and slide it on before you know what you are doing.'}},
rider_slip:{title:'Under the tree root', fx:{flag:'riderSaw'}, text:`The world goes grey and thin. The rider is no longer a black shape but a pale, ghastly figure, with a crown of steel on its white hair and two keen, merciless eyes that are looking straight at you.

Then — far off, clear and sweet — voices. Singing. The rider hisses, and wheels, and is gone.

You tear the Ring off. Sam is staring at the place where you lay. "You vanished, Mr. Frodo," he whispers. "Clean vanished."`,
  choices:[{t:'Follow the singing.', go:'gildor', ring:6}]},
rider_gone:{title:'The lane', text:`For a long while none of you speak. Then, from somewhere ahead in the wood, comes a sound like silver bells: voices, many voices, singing in a tongue you half remember from Bilbo's stories.

"Elves!" breathes Sam, and every bit of fear goes out of his face.`,
  choices:[{t:'Go to meet them.', go:'gildor'}]},
gildor:{title:'Woody End, by starlight', song:'elbereth', fx:{meet:'gildor'}, text:`They come down the lane under the stars, tall and fair, with a light in their faces like moonlight on water: High Elves, journeying west to the Havens. Their leader, Gildor Inglorion, greets you in their own language, which you have learned a little of from Bilbo, and he laughs with delight when you answer.

"Here is a scholar!" he says. "Hail, Elf-friend!" And they take you with them, and you eat bread and drink something clear and golden in a green hall of trees, and the elves sing of the Star-kindler beyond the Sea.

Sam sits with his mouth open the whole night through.`,
  choices:[
    talk('gil1', 'Ask Gildor about the Black Riders.', `Gildor's face grows grave. "I will not speak of them here, under the stars, for they are servants of the Enemy. But I will say this: they are hunting you, and you must not let them find you. Do not stay in the Shire. Go to Rivendell. And trust no one you do not have to."`, {flag:'riderWarned', hope:3}),
    talk('gil2', 'Ask him about Gandalf.', `"Gandalf has not come?" Gildor is silent for a while. "Then I fear for him. That is not like him. But the wise do not explain everything. Go on, Frodo. Do not wait."`),
    talk('gil3', 'Let Sam speak with the elves himself.', `Sam stammers at first, then talks for an hour. Afterwards he tells you: "I don't feel like I want to go back, sir. I know we've got to go a long way, into the dark. But I've got something to do before the end, and it lies ahead, not in the Shire."`, {aff:{sam:8}, hope:4}),
    {t:'Sleep under the trees, among the elves.', go:'shortcut', fx:{health:10, hope:6, flag:'elffriend'}}
  ]},
shortcut:{title:'Morning in Woody End', date:'25 September, T.A. 3018', text:`When you wake, the elves are gone, leaving baskets of bread and fruit. You are a long way from Bucklebury Ferry. The road loops round to the north; a straight line across country would take you through the fields of the Marish — and past the farm of Farmer Maggot, whose mushrooms you stole as a lad, and whose dogs you have feared ever since.`,
  choices:[
    {t:'Cut straight across country. Riders keep to roads.', go:'maggot_lanes', fx:{food:2}},
    {t:'Keep to the road. Safer than bogs and dogs.', go:'road_rider', fx:{food:2}}
  ]},
road_rider:{title:'The Stock road', loc:'stock', text:`The road is open and empty. Too empty. Within the hour you hear it again: hoofbeats, from two directions now. There is nowhere to hide but the ditch, and you lie in it with your faces in the mud while two black shapes meet on the road above and speak together in hissing voices.

When they have gone you take to the fields after all, soaked and filthy and shaking.`,
  choices:[{t:'Through the fields to the Marish.', go:'maggot_lanes', fx:{hope:-5, health:-5}}]},
maggot_lanes:{title:'The fields of the Marish', loc:'maggot', text:`The fields of the Marish are a maze of hedges, ditches and sunken lanes, and night is falling. Somewhere to the east is the river and the ferry. Somewhere among these hedges a Black Rider is quartering the lanes, sniffing, and another is crossing the open pasture.

Sam pulls you into a gap in the hedgerow and points at the sky over the trees. "That way's the river, Mr. Frodo. If we keep to the hedges, they'll have a job seeing us."`,
  game:{type:'sneak', map:'shirelanes', label:'Slip through the lanes to the ferry', win:'maggot', lose:'maggot_caught',
    fxWin:{hope:5}, winText:'You come out at the end of a long lane, muddy to the knees, and nearly walk straight into a farmhouse gate.',
    fxLose:{hope:-6, health:-8}, loseText:'The rider wheels towards you, and you run blindly, through hedges and ditches, until you fall over a gate.'}},
maggot_caught:{title:'A gate in the Marish', text:`The shriek rings out over the fields behind you — a long, thin, terrible cry — and is answered from far away. Then a great dog is barking, and a lantern swings towards you, and a deep voice shouts, "Who's there? Grip! Fang! Wolf! Come on, lads!"`,
  choices:[{t:'Stand still and face the farmer.', go:'maggot'}]},
maggot:{title:"Farmer Maggot's farm", loc:'maggot', fx:{meet:'maggot'}, text:`Three enormous dogs surround you, and behind them comes a stout red-faced hobbit with a lantern. He peers at you.

"Well, if it isn't young Mr. Frodo Baggins!" Farmer Maggot says. "Thirty years older and a deal muddier than last time I caught you on my land. Come in, come in. There's been a black fellow asking after you this very afternoon — rode right up to my door on a great horse and asked was there a Baggins about. Didn't like the look of him, nor did my dogs. I sent him off. Now come in by the fire and have a bite."`,
  choices:[
    {t:'"I am truly sorry about those mushrooms, Mr. Maggot."', go:'maggot2', fx:{aff:{maggot:10}, item:'mushrooms', hope:5}, res:'Maggot roars with laughter until he has to wipe his eyes. "Thirty years I\'ve waited to hear that! Well, well. Mrs. Maggot! Fetch the basket for Mr. Baggins." And when you leave there is a covered basket of mushrooms for the road, and Sam\'s face is a picture.'},
    {t:'Thank him and ask about the Rider.', go:'maggot2', fx:{flag:'maggotWarned'}, res:'"Black, all black, and sniffing. Sounded half-strangled when it spoke, like. Asked for Baggins, and when I said Baggins had gone off to Hobbiton it hissed at me." The farmer spits into the fire. "Not natural, sir. Not natural at all."'}
  ]},
maggot2:{title:"Maggot's wagon", fx:{food:2}, text:`After supper the farmer insists on driving you to the ferry himself in his wagon, with a lantern on a pole. The fog is rising from the river, white and thick. Halfway there, you hear hoofs coming towards you on the lane. Maggot's hand tightens on the reins.

It is not a Rider. It is Merry Brandybuck on his pony, come looking for you. "There you are! I'd begun to think you'd fallen in the river."`,
  choices:[{t:'On to the ferry.', go:'ferry', fx:{join:'merry'}}]},
ferry:{title:'Bucklebury Ferry', loc:'ferry', text:`The ferry is a flat wide raft that you pull across the Brandywine along a rope. You are all aboard and Merry is unhitching when Sam grabs your arm.

On the landing-stage you have just left, a dark shape has appeared out of the fog — black, stooping, sniffing — like a darker shadow among shadows. It glides down to the edge of the water.

"Pole! Pole, quick!" Merry hisses.`,
  game:{type:'qte', label:'Pole the ferry across!', n:6, time:1.6, win:'crickhollow', lose:'crickhollow',
    lines:['Push off from the landing!','The rope snags — haul it clear!','The current swings you downstream!','The Rider is at the water\'s edge!','Pole! Pole!','Nearly across!'],
    fxWin:{hope:6}, fxLose:{hope:-3, health:-6},
    winText:'The ferry grinds onto the far bank. Behind you, the black shape stands at the very edge of the water on the far side, and does not cross. "They don\'t like water," Merry says shakily. "Or — something."',
    loseText:'You make the far bank at last, half-soaked and with Pippin dangling from the rope. Behind you the black shape stands on the far landing, and does not cross.'}},
crickhollow:{title:'Crickhollow', loc:'crickhollow', date:'25 September, T.A. 3018', song:'bath', fx:{health:15, hope:4}, text:`The little house at Crickhollow is warm and lamplit, and Merry has filled three hot baths. Pippin sings very loudly in the bathroom, and the water ends up mostly on the floor.

Then, over a supper of mushrooms, Merry clears his throat. "Frodo. We know." He holds up a hand. "About the Ring. About the danger. We've known for months — Sam has been reporting to us. We are a conspiracy." Sam looks at his feet. "And we're coming with you."`,
  choices:[
    {t:'"Then come, and thank you. I couldn\'t ask for better friends."', go:'crick_camp', fx:{aff:{merry:10, pippin:10, sam:5}, hope:8}, res:'"You don\'t have to ask," says Pippin. "That\'s the whole point of a conspiracy." Merry grins. "We\'re horribly afraid, of course. But we\'re coming with you, or following you like hounds."'},
    {t:'"No. It\'s too dangerous. You must stay."', go:'crick_camp', fx:{aff:{merry:-4, pippin:-4}, hope:3}, res:'"You can\'t stop us," says Merry simply. "You\'d have to tie us up. And Sam would untie us." Sam nods, unrepentant. In the end you give in, as they always knew you would.'}
  ]},
crick_camp:{title:'Crickhollow, by the fire', fx:{join:['merry','pippin']}, text:`The road to Bree goes over the Brandywine Bridge, and the Riders will be watching it. Merry has another idea. "The Old Forest," he says. "Through the gate in the High Hay. Nobody goes in there. Nobody sensible, anyway. The trees are... strange. They move. But the Riders won't follow us in, I'd bet my pony on it."

The fire crackles. Tomorrow you go into the trees.`,
  choices:[
    talk('ck1', 'Ask Merry about the Old Forest.', `"There are stories," Merry says. "The trees don't like strangers. Once they came right up to the Hedge and leaned over it. The Bucklanders burned a great swathe of them, and the forest has never forgotten. Paths move about. They lead you where the forest wants, not where you want."`, {aff:{merry:3}}),
    talk('ck2', 'Ask Pippin why he came.', `Pippin shrugs, then grins. "Somebody's got to keep you lot cheerful. And I'd rather be in trouble with you than safe at home without you. Anyway, I've never seen a mountain."`, {aff:{pippin:4}, hope:2}),
    talk('ck3', 'Thank Sam quietly for the conspiracy.', `Sam goes pink. "I couldn't let you go alone, sir. Gandalf said keep you safe. And I would anyway."`, {aff:{sam:4}}),
    {t:'Sleep. Tomorrow, the Forest.', go:'ch3'}
  ]}
});

// ── III. THE OLD FOREST ─────────────────────────────────────────────────────
Object.assign(BEATS, {
ch3:{chapter:3, chTitle:'The Old Forest', date:'26 September, T.A. 3018', map:'oldforest', loc:'gate', w:'bucklebury',
  log:'Entered the Old Forest through the gate in the High Hay.',
  text:`Merry unlocks the gate in the High Hay, a tunnel through the great hedge that guards Buckland, and you lead your ponies down into a grey, dripping, silent world of trees.

The forest is old — older than anything you have known. The trunks are huge and twisted, hung with grey moss. There is no wind, yet the leaves rustle. Paths open in front of you and close behind. Every way you choose seems to bend, slowly and gently, to the south and east, towards the valley of the Withywindle, which Merry says is the queerest part of the whole wood.`,
  game:{type:'maze', map:'forest', label:'Find a way through the Old Forest', win:'willow', lose:'willow',
    fxWin:{hope:3}, fxLose:{health:-10, hope:-5},
    winText:'You stumble out of the close trees into a long valley full of sleepy warmth, where a slow brown river winds between enormous willows.',
    loseText:'Hours later, exhausted and scratched and utterly lost, you find that every path has delivered you to the same place: a long valley, a slow brown river, and enormous willows.'}},
willow:{title:'The Withywindle', loc:'willow', text:`The air is heavy and drowsy. The ponies stop. Merry and Pippin sit down with their backs against an ancient grey willow, and fall asleep at once. You feel your eyes closing too, and you lean back against a root…

…and wake with a splash, half in the river, pinned under a root that seems to have moved. Sam is hauling you out by the collar. "Mr. Frodo! The tree — it's got Merry and Pippin!"

The willow has closed. Pippin has vanished inside a crack in the trunk. Only Merry's legs stick out of another, kicking, and the crack is slowly narrowing.`,
  choices:[
    {t:'"Fire, Sam! Light a fire and frighten it!"', go:'willow_fire', fx:{aff:{sam:3}}},
    {t:'Run down the path shouting for help, any help at all.', go:'tom_comes'},
    {t:'Hack at the root with your knife.', go:'willow_fire', fx:{health:-5}, res:'The knife skitters off the grey bark. The whole tree shudders, and from deep inside comes Merry\'s muffled voice: "It says it\'ll squeeze us if you do that again!"'}
  ]},
willow_fire:{title:'The Withywindle', text:`Sam makes a pile of dry grass and leaves and strikes a flame. Smoke curls up the trunk. The willow shudders from root to crown — and from within comes a terrible, muffled scream.

"Put it out! Put it out!" Merry yells. "It says it'll squeeze me in two!"

You stamp out the fire in a panic, and you run, blindly, down the path along the river, shouting: "Help! Help! Help!"`,
  choices:[{t:'Keep running and shouting.', go:'tom_comes'}]},
tom_comes:{title:'The path by the river', song:'tom', fx:{meet:['tom']}, text:`And somebody answers.

Not a shout, but a song: a loud, merry, nonsense song, coming nearer, and over the reeds bobs an old battered hat with a long blue feather in its band. Below it comes a man — or something like a man — too large and heavy for a hobbit, not quite tall enough for one of the Big People, with a long brown beard, a bright blue jacket and huge yellow boots, which stamp along the bank as if he were dancing. He carries a bunch of water-lilies in his hands.

"Hey there, hold there! Hop, little fellow!" he cries. "What's all the shouting and the puffing for? Tom Bombadil's my name. Out with your trouble — quick now, quick, these lilies are for my lady and they mustn't wilt!"

When you tell him, he laughs, strides to the willow, and sings into the crack, and strikes the trunk with a branch. And the willow opens, slowly, sulkily, and lets Merry and Pippin out.`,
  choices:[{t:'Follow Tom to his house.', go:'tomhouse'}]},
tomhouse:{title:"The house of Tom Bombadil", loc:'tomhouse', song:'goldberry', fx:{meet:'goldberry', health:30, hope:12}, text:`Tom's house sits beneath a green hill at the edge of the forest. Lamps glow in the windows. Inside, seated in a chair among bowls of water-lilies, is a lady with long yellow hair and a gown green as young reeds, belted with gold. "Welcome, welcome, little travellers," she says, and her laugh is like water over stones. "Come in out of the dark. I am Goldberry, and the River is my mother."

That night you eat as you have never eaten, and sleep without fear, and dream of a white shore far over the sea, and green hills beyond it, lit by a dawn that never quite arrives.

For two days it rains, and you stay, listening to Tom tell tales of the forest and the hills, of a time before the elves came and before the first trees were seeds.`,
  choices:[
    talk('tom1', '"Who are you, Master Tom?"', `"Who? Who?" Tom hoots like an owl and laughs. "Tom's Tom, and that's all the answer there is! Who are <em>you</em>, little hobbit, with your name taken off? Tom was here before the river had a bed and the hills had a shape. Tom remembers the first rain and the first acorn falling. Tom walked under the stars when the night had nothing in it to fear."`, {hope:4}),
    talk('tom2', 'Show Tom the Ring.', `Tom holds out his hand, and somehow you give it to him without fear. He puts it to his eye and laughs. He slips it on his little finger — and he does not vanish. He spins it in the air, makes it disappear, and hands it back to you with a wink. "A pretty trinket," he says. "But Tom is master here." For the first time in months the chain round your neck does not feel heavy.`, {burden:-6, flag:'tomRing'}),
    {t:'Put on the Ring in Tom\'s house, as a test.', ring:4, if:G => G.flags.t_tom2 && !G.flags.tomTest, fx:{flag:'tomTest'}, res:'You slip it on and creep towards the door. "Ho there! Off a-wandering, little Frodo?" Tom calls, looking straight at you. "Tom has eyes, you know! Take off that gold thing, there\'s a good lad — it does your hand no kindness." Everyone laughs, and you, red-faced, laugh too.'},
    talk('tom3', 'Ask Goldberry about the forest.', `"The trees are old and they remember," she says. "Old Man Willow is the oldest and the worst. His heart is rotten, but his strength is green, and he is cunning, and a master of winds. Do not go near the Withywindle again without Tom."`),
    {t:'The rain has stopped. Set out for the Barrow-downs.', go:'tom_rhyme'}
  ]},
tom_rhyme:{title:"Tom's doorstep", song:'tomcall', text:`On the morning you leave, Tom takes you aside. "The Barrow-downs lie between you and the Road," he says. "Keep to the green grass. Don't go meddling with old stone or cold wights, nor prying in their houses, unless you be strong folk with hearts that never falter!" Then he teaches you a rhyme. "If you be in danger, sing that, and Tom will come, if he can."`,
  choices:[{t:'Ride east across the downs.', go:'downs', travel:1}]},
downs:{title:'The Barrow-downs', loc:'stone', date:'28 September, T.A. 3018', text:`The downs are green and empty, and the barrows rise along their ridges like sleeping backs. At noon you lie down to rest in the shadow of a standing stone. You wake to fog: cold, white fog that has crept up from every side while you slept.

You call to the others. Their voices answer, faint and from the wrong directions. You stumble forward, and the ground rises, and there are two great stones like the pillars of a door, and then a cold voice speaks, out of the earth itself, and a hand like ice closes on your arm.

You wake in darkness, on cold stone. A green light glows. Your three friends lie beside you dressed in white, hung with gold, and across their necks lies a long naked sword. A pale arm, walking on its fingers, is groping towards Sam.`,
  choices:[
