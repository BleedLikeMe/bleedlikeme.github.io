    {t:'Seize a sword and hack at the creeping hand.', go:'barrow_song', fx:{health:-6, hope:5, flag:'brave_barrow'}, res:'You strike with all your strength. The hand jerks, and the green light goes out, and there is a howl in the dark like a wolf in a pit. Shaking, you remember Tom\'s rhyme.'},
    {t:'Put on the Ring. Slip away. Save yourself.', ring:12, go:'barrow_shame', fx:{hope:-15}},
    {t:'Remember Tom\'s rhyme and sing it into the dark.', go:'barrow_song'}
  ]},
barrow_shame:{title:'The barrow', text:`The Ring slides on. The grey world opens around you, and you see the wight bending over your friends, and the way out behind you, and you take one step towards it.

Then you think of Merry, and Pippin, and Sam lying cold on the stone because they came with you, and you cannot take another. You tear the Ring off. The shame of it burns in you, and it will not quite go away.`,
  choices:[{t:'Sing Tom\'s rhyme.', go:'barrow_song'}]},
barrow_song:{title:'The barrow', text:`Your voice is very small in the dark. But you remember the tune, and you sing.`,
  game:{type:'simon', label:'Sing Tom\'s rhyme', len:6, pads:['🌼','🍃','🪨','💧'], names:['By the reed','By the willow','By the stone','By the water'], win:'barrow_out', lose:'barrow_out',
    fxWin:{hope:8}, fxLose:{health:-12},
    winText:'Far away, as if out of the ground or through thick walls, an answering song: Tom! Then a rumble, and the end of the barrow is torn open, and Tom is there in a blaze of daylight.',
    loseText:'Your voice cracks and the tune goes wrong, and the cold hand finds your ankle — but you keep singing, over and over, and at last, far away, an answering song: Tom! The barrow is torn open and the light comes in.'}},
barrow_out:{title:'The Great Barrow', loc:'barrow', text:`Tom drags your friends out into the sunlight, and they wake, and stare at their grave-clothes in horror, and Merry says, "I remember! The men of Carn Dûm came on us at night — a spear in my heart—" and stops, and shakes his head. "What am I saying? I've been dreaming."

From the treasure of the barrow Tom takes a blue brooch for Goldberry, and four long daggers, leaf-shaped, damasked with red and gold. "A dagger for a Man is a sword for a hobbit," he says. "They were made by the Men of Westernesse long ago, against the Dark Lord's servants in Angmar. Few now remember them." He finds your ponies, too, which had run away, and his own fat pony Fatty Lumpkin.`,
  choices:[{t:'Take the blades and ride on to the Road.', go:'ch4', fx:{item:'blade', aff:{merry:3, pippin:3, sam:3}}}]}
});

// ── IV. AT THE SIGN OF THE PRANCING PONY ────────────────────────────────────
Object.assign(BEATS, {
ch4:{chapter:4, chTitle:'At the Sign of the Prancing Pony', date:'29 September, T.A. 3018', map:'eriador', loc:'bree', w:'bree', fx:{map:'eriador'},
  log:'Reached Bree. Gandalf told me to go by the name of Underhill.',
  text:`Tom leaves you at the edge of his country with a wave of his hat, and you ride north to the Road and east to Bree, the village where Men and hobbits live side by side. The gate is shut. A gatekeeper peers out with a lantern.

"Where are you from, and what's your business? And what are your names?"`,
  choices:[
    {t:'"My name is Underhill. We are travelling east on business of our own."', go:'pony_inn', fx:{flag:'underhill'}, res:'The gatekeeper grunts, unsatisfied, and lets you in. Behind you, as the gate swings shut, a dark figure climbs quickly over it and vanishes into the shadows of the street.'},
    {t:'"Frodo Baggins, of Bag End in Hobbiton."', go:'pony_inn', fx:{flag:'gaveName', hope:-3}, res:'The gatekeeper writes it down with a slow, careful hand. A dark figure behind him in the shadows listens closely, then slips away into the village. Merry kicks your ankle. Too late.'}
  ]},
pony_inn:{title:'The Prancing Pony', fx:{meet:'butterbur'}, text:`The Prancing Pony is a big inn, three storeys tall, with a sign of a fat white pony rearing on its hind legs. Its landlord, Barliman Butterbur, is fat and bald and red-faced, and he is in such a hurry that he forgets your names twice before you have finished saying them. "A hobbit called Underhill? Now that reminds me of something. I'll think of it, if I have time."

In the common room there is a great crowd of Men, hobbits, a few dwarves, and a fire. Alone in the darkest corner sits a tall Man in a muddy green cloak with the hood up, boots cracked from long walking, a long pipe glowing in the shadow where his face should be. Every so often the pipe-glow lights a pair of grey eyes. They are watching you.

"Who is that?" you ask Butterbur. "Ranger," he says, lowering his voice. "Wanderers. Come and go as they please and never say where. Strider, folk call that one — on account of the legs on him, I suppose."`,
  choices:[
    talk('br1', 'Chat with the Bree-hobbits by the fire.', `They want to know all about the Shire and you oblige, cautiously. A squint-eyed southerner with a sallow face listens to every word without seeming to. Bill Ferny, the hobbits whisper. A bad lot.`, {flag:'ferny'}),
    {t:'Look over at Pippin — he is telling the whole room about Bilbo\'s party!', go:'pony_song', cls:'go'}
  ]},
pony_song:{title:'The common room', text:`Pippin, flushed with ale, is in full flow. "—and then old Bilbo says, <em>I regret to announce that this is the END</em>, and — bang! — he simply vanished!"

Strider's head turns sharply. He catches your eye and gives a tiny jerk of his chin, and his meaning is plain: <em>stop him</em>.

If Pippin goes on, he will mention the name Baggins. And then the Ring. You do the first thing you can think of. You jump on the table and start to sing.`,
  game:{type:'rhythm', song:'pony', label:'Sing the Innkeeper\'s Pig!', win:'pony_slip', lose:'pony_slip',
    fxWin:{hope:5, aff:{pippin:4}}, fxLose:{hope:-2},
    winText:'The room roars along with the chorus; they want it again, and again, and you dance and caper on the table, carried away—',
    loseText:'You forget half the words, and the room laughs at you rather than with you, and you dance about to cover it up, flustered—'}},
pony_slip:{title:'The common room', fx:{flag:'ponyVanish'}, text:`—and you slip, and the table tips, and you go down in a crash of tankards — and your hand, which has somehow found its way into your pocket, closes on the Ring, and as you fall, the Ring slides onto your finger.

You vanish.

The room is in uproar. The hobbits shout, Butterbur flaps, the southerner and Bill Ferny exchange a long look and slip out of the door. You crawl under a table into the corner, tug the Ring off, and stand up — right beside Strider.

"Well, Mr. Underhill," he says quietly. "That was a great deal worse than anything your young friend might have said. I think we should talk. Privately. Mr. <em>Baggins</em>."`,
  choices:[{t:'Go with him to your private parlour.', go:'strider', ring:5}]},
strider:{title:'A private parlour', fx:{meet:'aragorn'}, text:`In the parlour, Strider throws back his hood. His face is lean and dark and grave, with grey eyes, and his hair is flecked with grey. "I am hunted too," he says. "The Black Riders are nine. They came to Bree last night. They will come again. I can lead you by paths that are seldom trodden to Rivendell — if you will have me."

Sam bristles. "And how do we know you're not one of them? Begging your pardon."

Then Butterbur bustles in, red with embarrassment. "Mr. Underhill! I remembered! A letter, from Gandalf, left here in the summer — I clean forgot to send it on!"`,
  choices:[
    {t:'Read Gandalf\'s letter.', go:'strider2', fx:{item:'letter', aff:{aragorn:5}}, res:`The letter is in Gandalf's hand, dated midsummer. <em>Leave the Shire at once,</em> it says. <em>Make for Rivendell. You may meet a friend of mine, a Man, lean, dark, tall, called Strider. He knows our business and will help you. His true name is Aragorn.</em> Below it, a little riddling rhyme about gold that does not always glitter, and a blade that was broken being forged again, and a crownless king.\n\n"My name is Aragorn, Arathorn's son," Strider says. "I will see you safe to Rivendell, or die trying." He draws his sword. The blade is broken a foot below the hilt.`},
    {t:'"Why should I trust you?" — test him first.', go:'strider2', fx:{aff:{aragorn:2}, item:'letter', hope:2}, res:'"If I were after the Ring, I could have it now," he says simply. He stands, and for a moment he looks very tall and kingly in the firelight. "I am Aragorn son of Arathorn." You read Gandalf\'s letter, which names him, and you believe him. Sam does not, quite. Not yet.'}
  ]},
strider2:{title:'The Prancing Pony, at night', text:`Merry comes in out of breath. He has seen a Black Rider in the street, a shadow that whispered to Bill Ferny. Strider insists you all sleep in the parlour, not in the hobbit-rooms you were given.

In the dead of night, the windows of those rooms are forced and the beds are slashed to ribbons. In the morning, every pony and horse in the stable has been let loose and driven off.`,
  choices:[
    {t:'Buy Bill Ferny\'s poor half-starved pony, for an outrageous price.', go:'bree_exit', fx:{item:'pony', aff:{sam:6}, food:3}, res:'Bill Ferny wants twelve silver pennies for a pony worth four at most. You pay. Sam names it Bill, out of spite, and the pony, who has never been treated kindly in his life, falls in love with Sam at once.'},
    {t:'Carry everything yourselves.', go:'bree_exit', fx:{hope:-3, health:-5}}
  ]},
bree_exit:{title:'The streets of Bree', text:`Bill Ferny's spies are everywhere this morning: the squint-eyed southerner loafing by the West-gate, Ferny himself leaning on his garden wall, and — worse — Strider has seen a Rider waiting in the hedge-shadows of the East-gate road, watching the travellers.

"We won't leave by the gate," Strider says. "We'll go out through the back gardens, and over the dike to the east. Keep low. Keep moving. If anyone sees us leaving, the Nine will know which road to watch."`,
  game:{type:'sneak', map:'bree', label:'Slip out of Bree unseen', win:'ch5', lose:'bree_seen',
    fxWin:{hope:6, aff:{aragorn:4}}, winText:'You squeeze through a gap in the hedge behind the last cottage and drop into the dike beyond. Strider counts you all, nods once, and leads you off into the trees.',
    fxLose:{hope:-6, flag:'breeSeen'}, loseText:'Ferny whistles — two long notes — and somewhere a horse whinnies in answer.'}},
bree_seen:{title:'The edge of Bree', text:`"Run!" Strider says, and you run, across the dike and into the trees of the Chetwood, with Bill Ferny's jeers following you. Sam turns round, takes an apple from his pack, and hurls it. It catches Ferny square on the nose.

"Waste of a good apple," Sam says, panting. "But worth it."`,
  choices:[{t:'Into the Chetwood.', go:'ch5', fx:{aff:{sam:2}}}]}
});

// ── V. A KNIFE IN THE DARK ──────────────────────────────────────────────────
Object.assign(BEATS, {
ch5:{chapter:5, chTitle:'A Knife in the Dark', date:'30 September, T.A. 3018', map:'eriador', loc:'chetwood', travel:1,
  log:'Left Bree with Strider. Bound for Weathertop.',
  text:`Strider leads you north and east by hidden paths, through the Chetwood and into the Midgewater Marshes, where the ground squelches and the midges rise in clouds and Sam swears at them in language his Gaffer would not approve of. For days you see no one. At night there are strange flashes of light in the east, far off, on the hills.

"Weathertop," Strider says. "Something is happening there. That was where Gandalf would have gone if he were looking for us."`,
  choices:[
    talk('ws1', 'Ask Strider about himself as you walk.', `"There is not much to tell," he says. "We watch the edges of places like the Shire. Things come out of the wild and we turn them back, and the people inside sleep sound and call us tramps. That is as it should be. If they knew what we kept from their doors, they would not sleep at all."`, {aff:{aragorn:5}}),
    talk('ws2', 'Help Sam with Bill the pony through the bog.', `Bill nuzzles Sam all the way, and by the end of the marshes even Strider is smiling. "That pony will be worth more than his price," he says.`, {aff:{sam:3}}, G => has('pony')),
    talk('ws3', 'Ask Strider to tell a tale to keep up your spirits.', `By the fire that night, Strider sings part of an old lay in a quiet voice — a tale of a mortal man and an elf-maiden, long ago, and of a love that cost her everything and was worth it.`, {song:'luthien', hope:6, aff:{aragorn:3}}),
    {t:'Climb Weathertop.', go:'weathertop', travel:2, date:'6 October, T.A. 3018'}
  ]},
weathertop:{title:'Weathertop', loc:'weathertop', w:'weathertop', art:'weathertop', text:`The hill is bare, with the broken ring of an ancient watchtower on its crown. On a stone, Strider finds scratched marks: a G-rune, and three strokes. "Gandalf was here," he says. "On the third of October. Three days ago. And there was fighting." The stones are scorched.

From the summit you see, far below on the Road, five black specks. They have stopped. They are looking up.

You camp in a dell on the western side of the hill. Strider goes to scout. Night falls. The fire is small. And then, out of the dark, five tall black shapes climb slowly over the lip of the dell, and you feel a cold like the cold of the barrow, and the Ring burns against your chest.`,
  game:{type:'weathertop', label:'Hold them off with fire', win:'weather_wound', lose:'weather_wound', skipFx:{health:-28}}},
weather_wound:{title:'The dell on Weathertop', text: G => `${G.games.weathertop && G.games.weathertop.ringOn ? 'The Ring was on your finger. You do not remember putting it there. In the grey wraith-world the five were no longer shadows but white-faced kings, and the tallest of them, crowned, struck at you with a pale blade—' : 'You held them at the fire\'s edge longer than you would have believed possible. But at the last the tallest of them came through the flames, crowned and terrible, and struck at you with a pale blade—'}

—and you cried out, in a language you did not know you knew, <em>O Elbereth! Gilthoniel!</em>, and slashed at its feet with your barrow-blade, and a pain like a dart of poisoned ice pierced your left shoulder.

Then Strider leaped out of the darkness with a flaming brand in each hand, and the Riders fled.

You lie on the ground. The cold is spreading down your arm towards your heart.`,
  choices:[{t:'…', go:'athelas'}]},
athelas:{title:'Weathertop', text:`Strider kneels beside you. He has found the Rider's knife; as he holds it up, the blade melts away like smoke, leaving only the hilt. "A Morgul-knife," he says grimly. "A splinter of it is still in the wound, working inward. If it reaches your heart, you will become a wraith, like them, under the Dark Lord's will."

He goes out into the dark and comes back with a long-leafed plant. He crushes it into boiling water, and a sweet, refreshing fragrance fills the dell. "Athelas," he says. "Kingsfoil, the common folk call it. The men of the West brought it to Middle-earth." The cold eases. A little.

"Elrond can heal this," he says. "No one else can. We must reach Rivendell. We have perhaps two weeks."`,
  choices:[
    {t:'"Then we go. Now."', go:'ch6', fx:{item:'athelas', aff:{aragorn:6}}},
    {t:'"Sam… if I don\'t make it…"', go:'ch6', fx:{item:'athelas', aff:{sam:6}, hope:-2}, res:'"Don\'t talk like that, sir," Sam says fiercely, but his voice wobbles. "You\'ll make it. Strider says so. And I say so. And if you can\'t walk, I\'ll carry you."'}
  ]}
});

// ── VI. FLIGHT TO THE FORD ──────────────────────────────────────────────────
Object.assign(BEATS, {
ch6:{chapter:6, chTitle:'Flight to the Ford', date:'13 October, T.A. 3018', map:'eriador', loc:'lastbridge', travel:3, fx:{hope:-5},
  enter: G => { G.stats.health = Math.min(G.stats.health, 70); },
  log:'Wounded on Weathertop. Strider leads us east, off the Road.',
  text:`The days blur. Your arm is cold and useless. The world grows strange: in sunlight the colours are faded, and things far off seem nearer and more vivid than things close by. Sometimes, out of the corner of your eye, the shadows have shapes.

You cross the Last Bridge, where Strider finds on the stone a pale green beryl, an elf-stone. "Left for us," he says. "The way across is clear." You leave the Road and push north into the wild, wooded hills of the Trollshaws, wet and cold and lost.`,
  choices:[{t:'Struggle on through the Trollshaws.', go:'trolls', travel:1}]},
trolls:{title:'The Trollshaws', loc:'trolls', text:`On a stony hillside in a clearing among the trees, you come upon three huge figures. Pippin grabs your good arm. But they do not move. They are made of stone: three enormous trolls caught by the dawn ninety years ago, the very trolls Bilbo told of. A bird's nest sits behind one of their ears.

Sam stares at them, and then — to everyone's astonishment — he puts his hands on his hips, plants his feet, and begins to sing.`,
  song:'troll',
  choices:[
    {t:'Laugh until your wound aches.', go:'glorfindel', fx:{hope:12, aff:{sam:6}}},
    {t:'Applaud, and ask Sam where he learned it.', go:'glorfindel', fx:{hope:10, aff:{sam:8}}, res:'"Made it up, sir," Sam says, blushing. "Just now." Strider looks at him with new respect. "You are full of surprises, Samwise Gamgee."'}
  ]},
glorfindel:{title:'The Road near the Ford', date:'18 October, T.A. 3018', fx:{meet:'glorfindel'}, text:`You come down at last to the Road again, and there, on a white horse whose bridle twinkles with gems, sits an elf-lord with golden hair, and to your fading eyes he seems lit from within, like a lantern made of a man.

"Ai na vedui Dúnadan!" he cries to Strider. "Mae govannen!" It is Glorfindel of Rivendell, sent by Elrond to look for you. "The Nine are abroad," he says. "Five behind you. The others are making for the Ford. We must ride hard."

He sets you on his horse, Asfaloth. "Ride," he says. "If danger comes, he will carry you. He will not let you fall."`,
  choices:[{t:'Ride on with Glorfindel.', go:'ford_chase', travel:1}]},
ford_chase:{title:'The last miles', date:'20 October, T.A. 3018', text:`A mile from the Ford, a wind blows from behind, and with it the cry you dread. Out of the trees burst the Black Riders, five of them, and from the hills on the left come four more. They are between you and your friends.

"Ride on!" Glorfindel shouts. "Noro lim, Asfaloth!" And the white horse springs away like the wind.`,
  game:{type:'dodger', mode:'ford', label:'Race for the Ford!', win:'ford_stand', lose:'ford_stand',
    fxWin:{hope:5}, fxLose:{health:-10, hope:-5},
    winText:'Asfaloth flies down the last slope and splashes through the Ford, and turns on the far bank. The Riders pull up at the water\'s edge.',
    loseText:'A black hand nearly closes on your cloak, but Asfaloth leaps down the last slope and through the Ford, and turns on the far bank. The Riders are at the water\'s edge.'}},
ford_stand:{title:'The Ford of Bruinen', loc:'ford', w:'ford', text:`Nine black shapes sit their horses on the far bank. Their leader, crowned, rises in his stirrups. You hear a cold voice in your mind: <em>Come back! Come back! To Mordor we will take you!</em>

The Ring is pulling at your finger like a dog on a leash. Your sword-arm is numb and frozen.`,
  choices:[
    {t:'Raise your sword in your left hand. "Go back to the Land of Shadow! You shall have neither the Ring nor me!"', go:'ford_flood', fx:{hope:6, flag:'fordDefiance'}},
    {t:'Put on the Ring and hide.', ring:12, go:'ford_flood', res:'The Ring slides on, and in the grey world the Nine are white and terrible — and they can see you, far better than before. The leader laughs, a sound like ice breaking. They ride into the water.'},
    {t:'Say nothing. Hold on to the horse.', go:'ford_flood'}
  ]},
ford_flood:{title:'The Ford of Bruinen', text:`The Riders spur into the water. And then there is a roar, and the river rises. Down the valley comes a wall of water, and in the foam you could swear you see white horses with white riders and plumes of tossing spray. The Nine are swept away, screaming.

You see a white figure on the far bank, shining, and smaller grey shapes waving flames, and then you fall, and the roar and the white horses rise up over you, and you hear and see nothing more.`,
  choices:[{t:'…', go:'ch7'}]}
});

// ── VII. MANY MEETINGS ──────────────────────────────────────────────────────
Object.assign(BEATS, {
ch7:{chapter:7, chTitle:'Many Meetings', date:'24 October, T.A. 3018', map:'eriador', loc:'rivendell', w:'rivendell', art:'rivendell', fx:{meet:['elrond','arwen'], hope:15},
  enter: G => { G.stats.health = Math.max(G.stats.health, 90); },
  log:'Woke in Rivendell. Elrond drew out the splinter of the Morgul-knife.',
  text:`You wake in a bed, in a room full of light, with the sound of falling water outside the window. Gandalf is sitting beside you, smoking.

"Where—?" "Rivendell," he says. "Elrond's house. Mid-morning, by the light, and you have slept four days through." He smiles. "You have been very near the edge, Frodo. Elrond took a splinter of the Morgul-knife from your shoulder last night. It had worked very deep."

"Where were you, Gandalf? You promised."

His face darkens. "I was held. By Saruman the White, the head of my order, who has fallen. He wants the Ring for himself. I escaped from the top of his tower, Orthanc, on the back of an eagle. But it was a near thing. And it made me late. Forgive me."`,
  choices:[
    {t:'"Of course I forgive you."', go:'riv_feast', fx:{aff:{gandalf:6}}},
    {t:'"Where is Sam?"', go:'riv_feast', fx:{aff:{sam:4}}, res:'"Asleep in the chair outside your door," Gandalf says, "where he has been for three days and nights, refusing to leave it. Elrond had to pick him up and put him to bed in the end."'}
  ]},
riv_feast:{title:'The Hall of Elrond', text:`That evening there is a feast. Elrond sits at the high table. You cannot guess his age: his face is unlined, but his eyes have watched three ages of the world go by, and kept most of what they saw. Beside him sits a lady so fair that you cannot stop looking: Arwen, his daughter, whom they call the Evenstar. You notice, without quite understanding why, that Strider — washed and in elven clothes, and looking more like a lord than a ranger — keeps glancing at her, and she at him.

Next to you is a dwarf of great importance: Glóin, who travelled with Bilbo long ago, and beside him, his son Gimli, who glowers suspiciously at the elves across the table.`,
  choices:[
    talk('rf1', 'Talk with Glóin and Gimli about the Lonely Mountain.', `Glóin talks happily of the Mountain, of the toys and the bells and the armour of Dale. But when you ask about Moria, his face clouds. "Balin went there, thirty years ago, to reclaim it. For a while we had word, and then — nothing. And a messenger from Mordor has been at our gates, asking about hobbits." Gimli watches you very closely as you listen.`, {meet:'gimli', aff:{gimli:6}}),
    talk('rf2', 'Ask the elf from Mirkwood about Gollum.', `The elf, Legolas, son of Thranduil, looks troubled. "Gollum was given into my people's keeping. We were — too gentle. We let him climb trees in the sunlight. He escaped. I came here to bring that ill news to Elrond."`, {meet:'legolas', aff:{legolas:6}}),
    talk('rf3', 'Watch the tall Man of Gondor who sits apart.', `He is proud and stern, with a great horn at his belt, bound in silver. He has come from the far south, Strider tells you, on a hundred-and-ten-day journey, alone. His name is Boromir. He looks at you once, very briefly, as if he were trying to see through your coat.`, {meet:'boromir'}),
    {t:'Follow the others to the Hall of Fire.', go:'riv_hall'}
  ]},
riv_hall:{title:'The Hall of Fire', text:`The Hall of Fire is a room of pillars with a great hearth that always burns. There is music, and singing, and many elves. And on a stool by the fire, alone, with his eyes closed and his head nodding, sits a small, old hobbit.

"Bilbo!" He opens his eyes. "Hullo, Frodo, my lad! So you've got here at last."

You talk for hours. Then, quite suddenly, his voice changes. "You haven't got it here, have you? I should like to see it again. Just once."`,
  choices:[
    {t:'Take out the Ring and show him.', go:'riv_bilbo', fx:{burden:4}, res:'You draw it out slowly. As you do, a shadow seems to fall between you, and through it you see a little wrinkled creature with a hungry face and bony groping hands. You want to strike him.\n\nBilbo sees your face. He covers his own with his hands. "Now I understand," he says. "Put it away! I am sorry. Sorry you have come in for this burden; sorry about everything." The shadow lifts. You hug him, hard.'},
    {t:'"I\'d rather not, Bilbo. I don\'t think it\'s good for either of us."', go:'riv_bilbo', fx:{aff:{bilbo:6}, hope:3}, res:'For a moment a hungry, wizened look crosses his face. Then he sighs, and it is gone, and he is Bilbo again. "Quite right, my boy. Quite right. Don\'t let me see it. Don\'t let anyone see it."'}
  ]},
riv_bilbo:{title:'The Hall of Fire', song:'earendil', text:`Strider comes and sits with you, and Bilbo, to cheer you both up, sings a long song he has made about Eärendil the Mariner, who sailed into the sky with a jewel on his brow and became a star. The elves listen courteously and then ask for it again, and debate which verses were Bilbo's and which Strider helped with. Bilbo is enormously pleased with himself.

Late at night you sleep, and dream of no dark things at all.`,
  choices:[{t:'In the morning, go to the Council of Elrond.', go:'council'}]},
council:{title:'The Council of Elrond', date:'25 October, T.A. 3018', fx:{meet:['boromir','legolas','gimli']}, text:`In a porch above the river, Elrond has gathered elves, dwarves, Men, a wizard and two hobbits. One by one, they tell their tales.

Glóin tells of the messenger from Mordor. Boromir tells of a war on Gondor's eastern border, and of a dream that came to him and his brother: a voice crying of a broken sword, and of Isildur's Bane, and of a halfling. Strider lays his broken sword on the table: <em>Narsil</em>, that cut the Ring from Sauron's hand, and he is Isildur's heir. Gandalf tells of Saruman's betrayal.

Then Elrond asks you to bring out the Ring. You set it on the stone table, and everyone stares, and Boromir's eyes glitter.

The debate goes round and round. Give it to Tom Bombadil? He would forget it, or lose it. Send it over the Sea? The elves cannot. Use it against Sauron, as Boromir urges? "It belongs to Sauron," says Elrond, "and would turn any user to evil." It must go into the fire of Mount Doom, in the black heart of Mordor.

A long silence falls. No one speaks. The river roars far below. You realise you have been waiting for this silence since the night of the fire at Bag End.`,
  choices:[
    {t:'"I will take the Ring," you say, "though I do not know the way."', go:'council2', fx:{hope:8, aff:{gandalf:6, aragorn:6, boromir:3}}},
    {t:'Wait, in silence, hoping someone else will speak.', go:'council_wait'}
  ]},
council_wait:{title:'The Council of Elrond', text:`No one does. The silence stretches until it is unbearable. Elrond is looking at you. Gandalf is looking at you. The Ring on the table seems to be looking at you.

You knew. You knew from the moment Gandalf threw it in the fire.`,
  choices:[{t:'"I will take it. Though I do not know the way."', go:'council2', fx:{hope:4, aff:{gandalf:4}}}]},
council2:{title:'The Council of Elrond', text:`Elrond's grey eyes rest on you. "I think this was always your road, Frodo," he says. "Of all of us here, the great and the wise, the task has fallen to the smallest. Perhaps that is how it must be. The Enemy watches the mighty. He does not look for hobbits."

"And he's not going alone!" Sam bursts out from behind a pillar, where he has been hiding all morning. "Begging your pardon, sir!"

Elrond laughs. "No, Samwise. Plainly not. Since nothing short of iron chains could keep you from his side — and I doubt those would hold you long — you shall go with him."

And so the Company is chosen: Nine Walkers to set against the Nine Riders. Gandalf. Aragorn. Legolas for the elves, Gimli for the dwarves, Boromir for Men. Sam. And — after much protest that they would have to be tied up in sacks to be kept behind — Merry and Pippin.`,
  choices:[{t:'Spend the last weeks in Rivendell.', go:'riv_gifts', fx:{join:['gandalf','aragorn','legolas','gimli','boromir']}}]},
riv_gifts:{title:'Bilbo\'s room', date:'December, T.A. 3018', text:`On a cold day in December, Bilbo calls you to his room and opens a small chest. He brings out a small sword in an old shabby leather scabbard. "Sting," he says. "Take it." And then, from the bottom, something that pours over his hands like water: a small shirt of tiny silver rings, so light you could fold it into a pocket, cold to the touch and bright as frost on a window. "Mithril," he says. "Thorin gave it to me. It's worth more than the whole Shire, I should think. Put it on under your clothes, and don't tell anyone."`,
  choices:[
    {t:'Put on the mithril coat at once.', go:'riv_depart', fx:{item:['sting','mithril'], flag:'wearMithril', aff:{bilbo:5}}},
    {t:'Take the sword, and pack the mail away for later.', go:'riv_depart', fx:{item:['sting','mithril']}}
  ]},
riv_depart:{title:'The gates of Rivendell', date:'25 December, T.A. 3018', song:'fireside', text:`On a grey evening at the end of December, the Fellowship sets out. Elrond blesses you at the door. Bill the pony carries the packs, and Sam carries a great deal more than his share, including his pans.

Bilbo does not come to the gate. He says he does not like goodbyes. But as you pass beneath his window you hear him singing, quietly, to himself.`,
  choices:[{t:'Go south, towards the mountains.', go:'ch8', fx:{item:'pans'}}]}
});

// ── VIII. THE RING GOES SOUTH ───────────────────────────────────────────────
Object.assign(BEATS, {
ch8:{chapter:8, chTitle:'The Ring Goes South', date:'8 January, T.A. 3019', map:'hollin', loc:'hollin', travel:3, fx:{map:'hollin'},
  log:'The Fellowship set out from Rivendell. Nine walkers.',
  text:`Two weeks of cold night-marching bring you to Hollin, the ancient land of the elven-smiths, empty now. The air is clear, and holly grows everywhere, and the peaks of the Misty Mountains stand ahead: the three great mountains, and the tallest, red-flanked Caradhras, the Redhorn.

At midday Sam points to the south. A dark cloud is coming up the valley, very fast, against the wind. "Crebain!" Aragorn hisses. "Crows from Dunland. Spies. Hide!"`,
  choices:[
    {t:'Dive under the holly bushes and lie still.', go:'hollin_camp', fx:{hope:2}, res:'The flock wheels overhead, croaking, for a long time. Then it is gone, back to the south. "Spies of Saruman," Gandalf says, grimly. "The pass south is being watched."'},
    {t:'Throw your cloak over Bill the pony to hide him.', go:'hollin_camp', fx:{aff:{sam:5}}, if: G => has('pony'), res:'You and Sam drag your cloaks over Bill, who stands stock still as if he understood. The crows pass. Sam pats his nose for ten minutes afterwards.'}
  ]},
hollin_camp:{title:'Camp in Hollin', text:`That night, by a small fire in a hollow among the holly, the Company talks quietly.`,
  choices:[
    talk('hc1', 'Ask Boromir about Gondor.', `Boromir's face lights up. "Minas Tirith is the Tower of Guard, white and tall, built against the very shadow. My father is its Steward. We hold the fords of the river against the East — and we are bleeding, Frodo. Every year fewer of us, every year more of them. And here we carry the one weapon that might save us, to throw it away." He stares at your chest, then looks away, ashamed. "Forgive me."`, {aff:{boromir:8}, flag:'boromirTalk'}),
    talk('hc2', 'Ask Legolas what the elves see in the stones of Hollin.', `Legolas lays his hand on a fallen stone, and listens. "They remember hands," he says. "Clever, careful hands that cut and smoothed them, and sang while they worked. They miss the singing. The elves who lived here went over the Sea long ago, and the stones are still waiting for them to come back."`, {aff:{legolas:6}, hope:2}),
    talk('hc3', 'Sit with Gimli and listen to him talk of Moria.', `"Khazad-dûm!" Gimli says, and his eyes shine. "The greatest of all the dwarf-cities. Halls carved out of the living rock, with pillars like the trunks of trees, and lamps of crystal. If my kin Balin has retaken it — oh, what a welcome we would have!" Gandalf, nearby, says nothing at all.`, {aff:{gimli:6}}),
    talk('hc4', 'Practise sword-work with Aragorn and Boromir.', `They teach you how to hold Sting, how to stand, how to make a short sword count. "Strike low and quick," says Boromir, grinning, "and they won't know what bit them." By the end you are bruised but grinning too.`, {aff:{boromir:4, aragorn:4}, flag:'swordwork'}, G => has('sting')),
    {t:'Move on. Gandalf wants to try the pass.', go:'caradhras_choice'}
  ]},
caradhras_choice:{title:'The road to the pass', loc:'redhorn', text:`There are two ways over or under the mountains. The Redhorn Gate, a high pass beneath Caradhras, in the depths of winter. Or the Mines of Moria, under the mountains — a road Aragorn will not speak of, and Gandalf does not wish to take.

"I have been in Moria," Aragorn says quietly. "The memory is very evil. I do not wish to enter it a second time."

"And I do not wish to enter it even once," says Boromir.

Gandalf turns to you. "The Ring-bearer should choose."`,
  choices:[
    {t:'"The pass. Let us try Caradhras."', go:'caradhras'},
    {t:'"Moria. I would not freeze on a mountain for nothing."', go:'wargs', fx:{aff:{gimli:6, boromir:-3}}}
  ]},
caradhras:{title:'Caradhras', loc:'caradhras', date:'12 January, T.A. 3019', text:`Snow begins as you climb, and gets worse with every hour. The wind howls. Stones fall from the cliffs above, and there are fell voices in the air — wild cries and howls of laughter. "Caradhras is called the Cruel," Gimli shouts above the gale, "and it does not love elves and dwarves." The snow comes up to your waist, then to your chest.

You hear Legolas laugh, because he walks on top of the snow like a deer. Nobody else is laughing.`,
  choices:[
    {t:'Huddle together and push on.', go:'caradhras2', fx:{health:-15, hope:-6}},
    {t:'Drink the cordial Elrond gave Gandalf, and keep going.', go:'caradhras2', fx:{health:-8, hope:-2}, res:'A sip of miruvor, the cordial of Imladris, warms you right down to your toes. You can feel your fingers again. Not for long, but long enough.'}
  ]},
caradhras2:{title:'Caradhras', text:`At last even Gandalf admits defeat. Boromir and Aragorn force a way back down through the drifts, and carry the four hobbits one by one on their shoulders, like children.

Boromir sets you down last. "There," he says, gruff, brushing the snow off your hood. "Light as a sparrow. You need feeding up, Ring-bearer." And he grins, and you grin back.

There is nothing for it now but Moria. Gandalf leads you south along the mountains, and that night, the wolves come.`,
  choices:[{t:'…', go:'wargs', fx:{aff:{boromir:8}}}]},
wargs:{title:'A hill-top in Hollin', loc:'eregion', text:`Wargs: huge grey wolves, sent by Saruman or by something worse. They surround the hill you camp on, their eyes gleaming in the dark. Then they come.

Gandalf stands up, tall and menacing. He seizes a burning branch and holds it high. He cries in a great voice words of command in a strange tongue, and the tree above him bursts into fire.`,
  choices:[
    {t:'Fight beside the others with your blade.', go:'moria_gate', fx:{health:-6, hope:5, flag:'wargfight', aff:{boromir:3}}, res:'You stab at a grey shape that leaps over the ring of fire, and it yelps and falls back. Legolas\'s arrows fly burning into the dark. By dawn, the wolves are gone — and so are their bodies. "They were not ordinary wolves," Gandalf says.'},
    {t:'Stand with Sam and protect Bill the pony.', go:'moria_gate', fx:{aff:{sam:6}}, if: G => has('pony'), res:'Bill rears and screams, but you and Sam hold his halter, and he does not run. In the morning there is no sign of the wolves at all, except the arrows lying in the grass.'}
  ]},
moria_gate:{title:'The West-door of Moria', loc:'gate', date:'13 January, T.A. 3019', art:'doors', text:`At dusk you come to the Walls of Moria: sheer black cliffs above a dark still lake, where the old river has been dammed up. The water is evil-smelling and silent.

Gandalf passes his hands over the cliff, and murmurs, and slowly, faintly, lines of silver appear in the rock, glowing in the moonlight: an arch, a crown, an anvil and hammer, seven stars, a tree, and a great star in the middle. There are words above, in elvish letters.

"<em>The Doors of Durin, Lord of Moria. Speak, friend, and enter</em>," Gandalf reads. "Plain enough. If you are a friend, say the password, and the doors will open." He sets his staff to the star and cries out a word of command. Nothing happens.

He tries another, and another. Still nothing. "I once knew every spell in all the tongues of elves and men and orcs," he grumbles. "Now — what was it?"`,
  game:{type:'password', label:'Help Gandalf open the Doors', win:'watcher', lose:'watcher', fxWin:{aff:{gandalf:8}, hope:6}, fxLose:{hope:-2},
    winText:'The star blazes, and the doors swing slowly outward without a sound. Gandalf laughs. "Of course! Absurdly simple, like most riddles when you see the answer. It was a friendlier time, when the elves and dwarves wrote such things on their doors."',
    loseText:'At last Gandalf leaps to his feet. "I have it! Of course, of course! Absurdly simple!" He speaks one word, and the doors swing open.'}},
watcher:{title:'The West-door', text:`As the doors open, Bill the pony bolts in terror, and the lake behind you boils. A long sinuous arm, pale green and wet, crawls out of the water and seizes your foot, and drags you down towards the lake.

"Frodo!" Sam slashes at it with his knife. Twenty more arms come writhing out of the water.`,
  game:{type:'qte', label:'Escape the Watcher in the Water', n:7, time:1.4, win:'moria_in', lose:'moria_in',
    lines:['A tentacle has your ankle — kick!','Grab Sam\'s hand!','Another arm, round your waist — slash with your blade!','You\'re in the air — twist free!','Boromir hacks at the arm — drop!','Run for the doors!','Inside! Inside!'],
    fxWin:{hope:3, lose:'pony'}, fxLose:{health:-14, lose:'pony'},
    winText:'You tumble through the doors as the arms seize them and slam them shut behind you with a terrible crash. Rocks fall. The way back is closed. In the black dark, Sam is crying quietly for Bill, who fled into the wild. "I hope the wolves don\'t get him," he says.',
    loseText:'Boromir and Aragorn drag you free, bruised and choking, and you all tumble through the doors as the arms slam them shut behind you. The way back is closed. Sam is crying quietly for Bill, who fled into the wild.'}}
});

// ── IX. A JOURNEY IN THE DARK ───────────────────────────────────────────────
Object.assign(BEATS, {
ch9:{chapter:9, chTitle:'A Journey in the Dark', date:'14 January, T.A. 3019', map:'moria', loc:'stair', w:'moria', fx:{map:'moria'}, song:'durin', art:'none',
  log:'Entered Moria. The doors are shut behind us.',
  text:`Moria is darker than any dark you have known. Gandalf's staff glows faintly, a small island of light in an ocean of black. You walk for hours up long stairs and down endless passages. Your footsteps echo. Somewhere far away, water drips.

To keep up your spirits, Gimli sings, in a deep voice that rolls away down the halls: a song of Durin and the young world.`,
  choices:[{t:'Go on into the deeps.', go:'moria_well'}]},
moria_in:{title:'Inside the West-door', map:'moria', loc:'westgate', text:`Darkness, and dust, and the smell of stone that has not breathed for an age.

Gandalf raises his staff. A cold pale light spreads out a little way, showing a great stair going up into the dark. "We have a long way to go," he says, "forty miles under the mountains to the Dimrill Gate. Stay close to me."`,
  choices:[{t:'Climb the stair.', go:'ch9'}]},
moria_well:{title:'The Guard-room', loc:'guard', text:`In a guardroom with a deep well in the floor, Pippin, curious as ever, drops a stone into the black hole. A very long time later — plunk. And then, far below, tom-tap, tap-tom, as of a hammer signalling.

"Peregrin Took!" Gandalf hisses, rounding on him. "Next time, climb in after it, and save us all the trouble!"

Pippin goes white. That night, his watch, he lies awake listening, and the tapping does not stop.`,
  choices:[
    {t:'Sit with Pippin and keep the watch together.', go:'moria_hall', fx:{aff:{pippin:8}, hope:2}, res:'"I didn\'t mean it," Pippin whispers. "I know," you whisper back. "None of us did. We\'re all fools of Tooks, here." He laughs, shakily, and the tapping goes on, far below.'},
    {t:'Talk with Gandalf, who sits smoking in the dark.', go:'moria_hall', fx:{aff:{gandalf:6}}, res:'"I wish the Ring had never come to me," you whisper. Gandalf\'s pipe glows. "Do you know, I do not think it came to Bilbo by accident," he says. "Its maker wanted it found by Gollum\'s kind, or by worse. Instead, a hobbit picked it up. Something else had a hand in that, Frodo — something that is not the Enemy. I take comfort from it. You might too."'},
    {t:'Look over the edge. A faint shape moves on the stair below — two pale lights, like eyes.', go:'moria_hall', fx:{flag:'gollumMoria'}, res:'"Gollum," Gandalf murmurs, when you tell him. "He has been following us for three days. He hates the Ring and loves it, as he loves and hates himself. He will not trouble us yet."'}
  ]},
moria_hall:{title:'The Twenty-first Hall', loc:'hall21', text:`At last Gandalf risks a brighter light, and you see where you are: in a vast hall, its roof lost in shadow, held up by a forest of mighty pillars carved like trees of stone. It is magnificent and dead and silent.

But not entirely silent. Far off, from the deeps, comes a sound like drums. And from the archways on every side, the flicker of torches. Orcs. Patrols of them, moving through the halls.

"There is a chamber to the north," Gandalf whispers. "We must get there unseen, and then find the way east to the bridge. Keep to the pillars. Keep in the dark."`,
  game:{type:'sneak', map:'moria', label:'Creep through the halls of Moria', win:'mazarbul', lose:'mazarbul_hurt',
    fxWin:{hope:5}, winText:'You slip unseen through a doorway into a small chamber, lit by a single shaft of daylight from a high window.',
    fxLose:{health:-10, hope:-5}, loseText:'An orc cries out, a horn blares, and you run for the nearest doorway with arrows clattering on the stones behind you.'}},
mazarbul_hurt:{title:'A side-passage', text:`You lose them in a maze of side-passages, bruised and breathless, and blunder through a doorway into a small chamber lit by a single shaft of daylight from a high window.`,
  choices:[{t:'Look around.', go:'mazarbul'}]},
mazarbul:{title:'The Chamber of Mazarbul', loc:'mazarbul', text:`In the middle of the room is a single block of stone, and on it, cut deep in runes: <em>Here lies Balin, son of Fundin, Lord of Moria.</em>

Gimli throws his hood over his face and weeps.

Gandalf picks up a great book from the floor, half burned and slashed, and reads in the pale light. It is a record of Balin's colony. The first years were good. Then, the orcs came. The last page is written in a shaking hand: <em>We cannot get out. They have taken the bridge and second hall. The end comes. Drums, drums in the deep. They are coming.</em>

And then you hear it. <em>Doom, boom, doom.</em> Drums, in the deep. Coming nearer.`,
  choices:[{t:'"Bar the door!"', go:'cavetroll'}]},
cavetroll:{title:'The Chamber of Mazarbul', text:`They come: orcs, many of them, and among them a great cave-troll, its huge flat-toed foot forced through the half-barred door. Boromir hacks at it. Aragorn and Legolas and Gimli fight like a wall. A great orc-chieftain, black-mailed, leaps into the chamber and drives at you with a spear.`,
  game:{type:'qte', label:'Fight in the Chamber of Mazarbul', n:8, time:1.3, win:'speared', lose:'speared',
    lines:['An orc lunges — dodge!','Stab with Sting!','The troll\'s foot crashes down — leap aside!','Sting is glowing blue — strike!','Duck behind the tomb!','An arrow hisses past — down!','The orc-chief comes at you with a spear—','—the spear!'],
    fxWin:{hope:3}, fxLose:{health:-6}}},
speared:{title:'The Chamber of Mazarbul', text: G => `The orc-chieftain's spear catches you full in the side and pins you against the wall. ${flag('wearMithril') ? 'There is a horrible crunch — and you are alive. The mithril coat, under your shirt, has turned the blow.' : 'You hear a sickening crunch — but the mithril coat, crammed in your pack against your side, has turned most of the blow.'}

Aragorn hews the orc-chieftain down. Sam is standing over you with his knife, white-faced. "He's dead!" he cries. "No," you say faintly, sitting up. "I'm alive. Bruised, I think."

Aragorn stares at you, then laughs. "You are a tougher hide than I thought, Master Baggins."`,
  enter: G => { applyFx({health: flag('wearMithril') ? -8 : -25}); if (!flag('wearMithril')) G.flags.wearMithril = true; },
  choices:[{t:'Run! Run for the bridge!', go:'bridge'}]},
bridge:{title:'The Bridge of Khazad-dûm', loc:'bridge', text:`You flee down a stair and out into a hall so huge and deep that it seems the very roots of the mountain. Ahead, a narrow bridge of stone, without kerb or rail, spans a black chasm. Behind you, the orcs have stopped. And something comes up out of the deep behind them.

It is taller than the tallest troll, and made of shadow and smoke, and inside the smoke something burns like a forge with the door open. Heat rolls off it in waves. In one hand it holds a blade of fire; in the other, a many-tailed whip that cracks and spits sparks. When it spreads its shadow, the whole hall goes dark.

"A Balrog," Gandalf groans. "A demon of the ancient world. This foe is beyond any of you. Over the bridge! Run!"

He stands alone at the middle of the bridge, leaning on his staff.`,
  choices:[
    {t:'Run, as he told you.', go:'gandalf_falls'},
    {t:'Turn back for him!', go:'gandalf_falls', fx:{aff:{gandalf:4, aragorn:2}, health:-4}, res:'You get three steps before Aragorn catches you round the waist and lifts you off your feet. "No, Frodo! He told us to go!" You struggle, but he is far too strong.'}
  ]},
gandalf_falls:{title:'The Bridge of Khazad-dûm', text:`The Balrog steps onto the bridge, and the fire about it dies, but the darkness grows. It raises its sword. Gandalf lifts his staff, and his voice rings out like a trumpet: he serves a fire older and brighter than the thing before him, he cries, and it will go back down into the dark where it belongs, for it will not cross this bridge while he stands on it. And he strikes his staff on the stone.

The staff breaks. The bridge cracks. The Balrog falls, with a terrible cry, into the abyss.

But as it falls, its whip lashes upward, and curls about the wizard's knees. He totters. He grasps at the stone, and slides. He looks back at you, and his last words come up out of the dark: <em>"Run, you fools!"</em>

And he is gone.`,
  choices:[{t:'…', go:'bridge_flee'}]},
bridge_flee:{title:'The Dimrill Gate', text:`You hardly remember the rest. The orcs' arrows, Aragorn shouting, the long stair, the gate, the light — blinding, cruel sunlight on the slopes of the Dimrill Dale.

And then you are all sitting in the heather, and Sam is weeping, and Gimli is weeping, and Boromir is holding Pippin, who is weeping too. You cannot weep. You feel empty, like a cup that has been poured out.

"Gandalf," you say aloud. Nobody answers.

Aragorn stands, his face like stone. "Farewell, Gandalf," he says. "Come! We must reach the woods of Lórien before nightfall, or the orcs will be upon us."`,
  choices:[{t:'Get up. Walk.', go:'ch10', fx:{hope:-15, leave:'gandalf', aff:{aragorn:5}}}]}
});

// ── X. LOTHLÓRIEN ───────────────────────────────────────────────────────────
Object.assign(BEATS, {
ch10:{chapter:10, chTitle:'The Mirror of Galadriel', date:'15 January, T.A. 3019', map:'lorien', loc:'nimrodel', w:'lorien', art:'lorien', fx:{map:'lorien'}, song:'nimrodel', travel:1,
  log:'Gandalf fell in Moria. We fled to the edge of Lothlórien.',
  text:`By evening you come to the stream of Nimrodel, cold and clear, and Legolas bathes your sore feet in it, and sings of the elf-maiden who once lived beside it. Then he looks up into the boughs of a great tree with silver bark, whose leaves are golden even in winter. "Mallorn," he says, softly. "We are in the Golden Wood."

A voice speaks from the tree above, in elvish. Legolas answers, laughing. "We have been watched for an hour," he says. "They could have shot us in the dark."`,
  choices:[{t:'Meet the elves of Lórien.', go:'haldir'}]},
haldir:{title:'Lothlórien', loc:'cerinamroth', fx:{meet:'haldir'}, text:`Haldir, march-warden of the wood, lets you sleep on a flet, a platform high in the tree. In the morning he leads you inward. But at the river he stops. "The dwarf must go blindfold," he says. "That is our law."

Gimli's beard bristles. "I will not be led like a prisoner! I will go free, or I will go back to my own land."`,
  choices:[
    {t:'"Then we will all be blindfolded — even Legolas."', go:'caras', fx:{aff:{gimli:10, legolas:-2}, hope:3}, res:'Aragorn agrees at once. Legolas protests, then laughs. "Very well! We shall all stumble about like moles together, in the fairest wood in Middle-earth. What a tale this will make." And Gimli, who had been stiff with insult, laughs too, and walks a little closer to Legolas after that.'},
    {t:'"Gimli, please — for my sake."', go:'caras', fx:{aff:{gimli:-4}}, res:'Gimli grumbles, but submits, for you. You walk on in silence. Legolas walks behind him, looking uncomfortable, and for an hour neither will speak to the other.'}
  ]},
caras:{title:'Caras Galadhon', loc:'caras', date:'17 January, T.A. 3019', fx:{meet:'galadriel', health:30, hope:10}, song:'lament', text:`Caras Galadhon is a city in the trees, lit with lamps of silver and green and gold, a hill of mallorns ringed by a deep green wall. At its heart, in a great hall high in the tallest tree, sit the Lord and Lady of the Wood, Celeborn and Galadriel. They are clad wholly in white, and the hair of the Lady is of deep gold.

Galadriel says nothing, at first. She looks at each of you in turn, for a long while, and it seems to you that she is offering you a choice: between a shadow full of fear that lies ahead, and something that you greatly desire — the Shire, a quiet life, safe and green — if only you will turn aside.

You meet her eyes. You do not turn aside. She smiles.

That night you hear the elves singing a lament. You do not understand the words, but you know the name in it, because they say it over and over. <em>Mithrandir.</em> Gandalf. Sam tries, afterwards, to make up a verse of his own about the fireworks, and cannot finish it for crying.`,
  choices:[
    talk('cg1', 'Walk with Aragorn on the hill of Cerin Amroth.', `He stands on the hill in a kind of dream, with a little golden flower in his hand, smiling at something you cannot see. "I was young here, once," he says at last. "I made a promise on this hill. I mean to keep it." You do not ask to whom. You think you know.`, {aff:{aragorn:6}, hope:4}),
    talk('cg2', 'Sit with Boromir, who has gone very quiet.', `"She looked into my heart," Boromir says, low. "She offered me — no. She tested me. That is all." He grips your arm, hard. "We should not have come here. We should go to Minas Tirith. All of us." His eyes are on your coat, where the Ring hangs.`, {aff:{boromir:3}, flag:'boromirWarn'}),
    talk('cg3', 'Rest. Eat. Sleep for a day without dreams.', `You do, and it is like rain after drought. The cold in your shoulder fades almost to nothing.`, {health:15, burden:-4}),
    {t:'At evening, the Lady asks you to follow her.', go:'mirror'}
  ]},
mirror:{title:'The Mirror of Galadriel', text:`She leads you and Sam down into a garden, open to the sky, where a stream falls into a silver basin on a pedestal. She fills it with water from the stream, and breathes on it.

"This is the Mirror of Galadriel," she says. "It shows things that were, and things that are, and things that yet may be. Some never come to be. Do you wish to look?"

Sam looks first, and sees the Shire torn up, the mill pulled down, a great chimney belching smoke, and he is all for running home. But he stays.

You look.`,
  game:{type:'simon', label:'Look into the Mirror', len:7, pads:['☀','☾','✦','◉'], names:['the Sea','the Tower','the Star','the Eye'], mirror:true, win:'mirror2', lose:'mirror2',
    fxWin:{hope:6}, fxLose:{burden:4},
    winText:'The visions come and go, and you hold to each of them: a grey figure walking a long road; a great sea under a stormy sky; a tall ship sailing into the west; a white tower and a winged shadow — and then, the Eye.',
    loseText:'The visions spin and blur and run together: a road, a sea, a tower, a ship — and then, rising out of the water, the Eye.'}},
mirror2:{title:'The Mirror of Galadriel', art:'eye', text:`The Eye fills the Mirror: lidless, ringed with flame, its pupil a black slot like a cat's that seems to go down and down into nothing at all. It is searching. It knows you are there. The Ring on its chain grows heavy as a great stone, and swings towards the water, and steam rises from it.

"Do not touch the water!" says the Lady. The Eye is gone.

"I know what you saw," she says, "for it is also in my mind." On her finger a ring shines, white as starlight. "Nenya, the ring of Adamant. I am its keeper. He gropes ever to see me and my thought. But still the door is closed."`,
  choices:[
    {t:'"You are wise and fearless and fair. I will give you the One Ring, if you ask for it."', go:'galadriel_test'},
    {t:'"I would not burden you with it. It is mine to carry."', go:'gifts', fx:{hope:5, burden:-3}, res:'She looks at you for a long time. "Then you are wiser than you know, Ring-bearer," she says, softly. "Go to bed now. The road is long, and dawn comes early."'}
  ]},
galadriel_test:{title:'The Mirror of Galadriel', text:`Galadriel laughs, but not for long. "Do you know what you offer, little one? For an age I have wondered what I would do if this moment came."

The light of the garden changes. She seems to grow, and the stars behind her dim. "I would not be a Dark Lord," she says, and her voice is everywhere, in the water, in the leaves. "I would be a Queen of light. I would heal every hurt and right every wrong, and no one would ever be cold or hungry or afraid again — unless I wished it. And I would wish it, in the end. Everyone would love me. No one would be able to stop."

Her ring blazes, white as a falling star, and for a moment she is so tall and so bright you cannot look at her.

Then it is over. She is only a slim, tired woman in white, standing by a basin of water.

"No," she says softly. "Not for me. I will go into the West, and fade there, and still be myself." She smiles, and it is the saddest smile you have ever seen. "I have passed a test I have been dreading for longer than your Shire has had a name."`,
  choices:[{t:'…', go:'gifts', fx:{aff:{galadriel:8}, burden:-6}}]},
gifts:{title:'The Parting', date:'16 February, T.A. 3019', text:`Before you leave, the elves give the Company grey boats and gifts. Cloaks of elvish make, grey-green, that seem to take the colour of their surroundings. Lembas, the waybread of the elves, thin cakes wrapped in mallorn-leaves, which Gimli says taste better than honey-cakes from Dale, and which will keep a walker going for a whole day on a single bite or two.

The Lady gives each of you a gift of your own. To Sam, a little box of plain grey wood. "It holds earth from my orchard," she says, "and what blessing Galadriel has still to bestow." Sam goes red. To Gimli, who asks for nothing, three golden hairs from her head, at his own stammering request. And to you, a small crystal phial: it glitters as she moves it, and rays of white light spring from her hand.

"In it is water from my fountain, and in the water is caught the light of Eärendil, the evening star. The darker it is around you, the brighter it will shine. Keep it for the blackest hour, Frodo, when you can see no other light at all."`,
  choices:[{t:'Board the boats.', go:'ch11', fx:{item:['phial','cloak','rope','box'], food:8, aff:{gimli:4}}}]}
});

// ── XI. THE BREAKING OF THE FELLOWSHIP ──────────────────────────────────────
Object.assign(BEATS, {
ch11:{chapter:11, chTitle:'The Great River', date:'17 February, T.A. 3019', map:'lorien', loc:'naith', travel:2,
  log:'Left Lothlórien by boat, down the Anduin.',
  text:`Three grey elven-boats carry you down the Great River: day after day, between shores of dead brown grass and grey stone. Aragorn has the lead boat, with you and Sam. Behind, sometimes, you think you see a log floating that keeps pace with you, against the current. Two pale eyes in the log. Sam sees it too.

"There's something following us, Mr. Frodo," he says one night. "Gollum. I'd swear to it."`,
  choices:[
    {t:'"I know, Sam. Let him be. Gandalf said he has a part to play."', go:'sarn', fx:{aff:{smeagol:5}, flag:'pitied'}},
    {t:'Tell Aragorn, and keep watch.', go:'sarn', fx:{aff:{aragorn:3}}, res:'"He has been with us since Moria," Aragorn says. "I have seen him on the bank. He is cunning. He will not be easily caught, and I would not kill him if he were. Keep your watch, Sam."'}
  ]},
sarn:{title:'Sarn Gebir', loc:'sarngebir', text:`In the night the current quickens. You hear a roar ahead — rapids, Sarn Gebir, where the river breaks over teeth of rock. And then a hail of arrows from the eastern bank. Orcs!

"Paddle! Paddle!" Aragorn shouts. The boats leap forward into the white water.`,
  game:{type:'dodger', mode:'river', label:'Through the rapids under arrow-fire!', win:'nazgul_shot', lose:'nazgul_shot',
    fxWin:{hope:5}, fxLose:{health:-12},
    winText:'You swing the boat clear of the last rocks and into the shelter of the western bank.',
    loseText:'The boat crashes against a rock, half-swamped, and an arrow tears your sleeve — but you make the western bank at last.'}},
nazgul_shot:{title:'Sarn Gebir', text:`And then a great shape, like a cloud but not a cloud, darker than the night, comes from the south: a huge winged creature, and on its back a shape that chills you to the bone. The Ring burns. Legolas stands up in his boat, fits an arrow to his great bow from Lórien, and shoots.

The creature screams and falls away to the east. The orcs on the far bank howl in dismay.

"Elbereth Gilthoniel!" Legolas sighs, sinking down. You press your hand against your shoulder. The old wound is cold as ice.`,
  choices:[{t:'Go on, down the river.', go:'argonath'}]},
argonath:{title:'The Argonath', loc:'argonath', art:'argonath', date:'25 February, T.A. 3019', text:`Two great pillars of stone rise from the river ahead: two kings, carved in the likeness of Isildur and Anárion, their left hands raised palm outward in warning, their right hands holding axes, crowned with crumbling helms. The Gate of Kings.

Aragorn stands up in the boat, and the weariness falls from him like a cloak. "My fathers," he says, quietly, and then, louder, as if they might hear: "Your son is passing. He is not afraid." For a moment you can almost see a crown on his head.

Beyond the pillars the river opens into a long, still lake, and at its end, the roar of the great falls of Rauros. On the western shore rises a green hill: Amon Hen, the Hill of Sight.`,
  choices:[{t:'Land at the foot of Amon Hen.', go:'amonhen'}]},
amonhen:{title:'Amon Hen', loc:'amonhen', w:'amonhen', date:'26 February, T.A. 3019', text:`Here the road divides. East, to Mordor. West, to Minas Tirith with Boromir, to help fight the war. Aragorn turns to you. "It is your choice, Frodo. You are the Ring-bearer."

"Give me an hour," you say. "I will speak when the hour is up. Let me be alone."

You wander up the hill, among the trees. You sit on a stone. And you are not alone. Boromir is standing there.

"I came to look for you," he says, kindly. "I thought you might need a friend's counsel."`,
  choices:[{t:'Hear him out.', go:'boromir1'}]},
boromir1:{title:'Amon Hen', text:`He talks of Minas Tirith, of its walls and its people, of the war, of the hopelessness of the quest. "It is madness to walk into Mordor with the Ring. The Enemy will take it, and then the world falls." He comes closer. "But if it were used, Frodo — by a true man — one who would never use it for evil — "

"No," you say.

"Lend it to me! Only for a while — only to save my people." His face has changed. His eyes glitter. "Why should a halfling have it? Why you? You found it by an accident! It was my dream, my brother\'s dream — it was meant for Gondor! Give it to me!"

He springs at you.`,
  choices:[
    {t:'Put on the Ring and vanish.', ring:8, go:'seat'},
    {t:'"Boromir — remember Caradhras. You carried me. You called me a sparrow."', go:'boromir_calm', if: G => aff('boromir') >= 25},
    {t:'Run, dodging between the trees.', go:'boromir_run'},
    {t:'"Take it, then. Take it and leave me be."', go:'end_boromir', cls:'ring'}
  ]},
boromir_calm:{title:'Amon Hen', text:`He stops. For a moment you see the man who sang with Pippin in Lórien and taught you to hold a sword, the man who carried you down the mountain. His face crumples. "Frodo — I — "

Then the madness takes him again, and he lunges. But you have had a moment, and it is enough: you dodge, and he trips over a root and falls headlong, and lies there weeping. "What have I said? What have I done? Frodo! Frodo, come back!"

You are already running.`,
  choices:[{t:'Climb to the summit.', go:'seat_free', fx:{aff:{boromir:5}, hope:2}}]},
boromir_run:{title:'Amon Hen', text:`You dodge round a tree, and he is after you, a big man in mail, and you are small and nimble but he is fast. He has you by the cloak — the clasp breaks — you roll through a thicket of thorns and fall headlong down a bank and lie there gasping, bleeding, with the Ring in your hand.

He is coming. The Ring is in your hand. <em>So easy.</em>`,
  choices:[
    {t:'Put it on.', ring:8, go:'seat', fx:{health:-6}},
    {t:'Lie still in the bracken, hidden by your elven cloak.', go:'seat_free', if: G => has('cloak'), fx:{health:-6, hope:4}, res:'Your grey cloak blends into the bracken and the shadows. Boromir crashes past, three yards away. Then you hear him stumble, and fall, and weep. "What have I done? Frodo! Come back!" You crawl away uphill.'}
  ]},
seat_free:{title:'Amon Hen', text:`You come out at last upon the summit of Amon Hen, where a high seat stands upon four pillars, with a stair of many steps leading up to it. The Seat of Seeing.

You do not climb it. You do not need to. You know what you must do. You sit beneath it, and the hour is up, and the choice is made.

"I will go alone," you say aloud. "Some of the others I could trust, but Boromir has shown me what the Ring does even to the best. I will go alone. Now."`,
  choices:[{t:'Go down to the boats.', go:'leave'}]},
seat:{title:'The Seat of Seeing', text:`Invisible, you run, up and up, until you come out upon the summit, and stumble up a stair onto the high seat, and look out.

The Ring is on your finger, and from the Seat of Seeing you can see a hundred leagues in every direction, but everything is grey and shadowy. You see war: the land of Rohan full of orcs; the Misty Mountains crawling; fire upon the east bank of the river; the white walls of Minas Tirith; and then, Mordor. Barad-dûr, the fortress of Sauron, black beyond black. And in it — the Eye.

It is searching. It leaps towards you, swift as a finger. You feel it. It is about to fix on you.

<em>Take it off! Take it off!</em> cries a voice that is not quite yours. <em>Take it off, fool!</em>`,
  choices:[
    {t:'Take it off!', go:'seat_off'},
    {t:'Look. Just a moment longer. You can see so far—', ring:15, go:'seat_off', fx:{hope:-6}, res:'The Eye swings towards you. You feel it touch you, a cold like death, and for one moment you are seen — wholly seen — and you scream. Your hand wrenches the Ring from your finger by itself.'}
  ]},
seat_off:{title:'The Seat of Seeing', text:`You are yourself again, sitting on the high seat, in the sun. A black shadow passes over you like an arm. It misses Amon Hen, and gropes out west, and fades.

You understand, now, and you weep. "It has already started," you say aloud. "Boromir was the best of us, and look what it did to him in a single month. It will do it to all of them, one by one. I won\'t let it. I will go alone — the ones I trust are the ones I love most, and I will not watch it eat them."`,
  choices:[{t:'Go down to the boats.', go:'leave'}]},
leave:{title:'The shore below Amon Hen', text:`You push a boat out from the shore, alone. You pick up the paddle.

And Sam comes crashing down the bank, shouting, "Mr. Frodo! Mr. Frodo!" and runs straight into the river after you, and sinks like a stone, because he cannot swim.`,
  choices:[
    {t:'Haul him into the boat.', go:'leave2', fx:{aff:{sam:12}, hope:8}},
    {t:'"Go back, Sam! I am going to Mordor alone!"', go:'leave2', fx:{aff:{sam:4}, hope:3}, res:'"Of course you are," Sam splutters, bobbing up. "And I\'m coming with you!" Then he sinks again. You haul him in by the hair.'}
  ]},
leave2:{title:'The Great River', fx:{leave:['merry','pippin','aragorn','legolas','gimli','boromir']}, text:`Sam lies in the bottom of the boat, dripping. "I told Gandalf I'd keep you safe, Mr. Frodo," he says. "Back under the window at Bag End. A promise is a promise. You're not going anywhere I'm not."

You laugh, and weep, and hug him, wet as he is. "You great stubborn lump of a gardener. I should have known I could never give you the slip. Oh, Sam — I'm so glad."

You paddle across to the eastern shore. Behind you, from the hill, you hear a great horn blowing — Boromir's horn, the horn of Gondor — loud and desperate, and then cut short. You do not know what it means. You will not know for a very long time.

Ahead of you rise the bare grey hills of the Emyn Muil. Beyond them, Mordor.`,
  choices:[{t:'Into the hills.', go:'ch12'}]},
end_boromir:{ending:'bad', title:'The Steward\'s Ring', art:'eye', text:`You hold it out. Boromir snatches it, and laughs, and slides it onto his finger, and vanishes.

He goes south, to Minas Tirith, to save his people. For a little while he does: the armies of the East break before a captain no arrow can find. Then the Nine come for him, and they do not come in battle. They come at night, in his mind, and he gives the Ring up to their master with tears on his invisible face, because by then he cannot do otherwise.

Darkness falls on the West. In the Shire, in the long years after, they say that Frodo Baggins came home alone in the spring, and never spoke of where he had been, and sat at the window of a little house in Crickhollow watching the eastern sky.`}
});

// ── XII. THE TAMING OF SMÉAGOL ──────────────────────────────────────────────
Object.assign(BEATS, {
ch12:{chapter:12, chTitle:'The Taming of Sméagol', date:'28 February, T.A. 3019', map:'emynmuil', loc:'descent', w:'emynmuil', fx:{map:'emynmuil'}, travel:2,
  log:'Left the Fellowship. Sam and I went east into the Emyn Muil.',
  text:`For three days you are lost in the Emyn Muil, a maze of sharp grey ridges and dead-end gullies. Every way down to the plains ends at a cliff. At last you come to the edge of a sheer drop, with the marshes far below and dark clouds rolling in.

"We'll have to climb down," you say. Sam looks at the cliff and then, triumphantly, at his pack. "Rope! I've got a rope! The elves gave it me!"

The storm breaks as you begin the descent. Lightning splits the sky; and from far above, out of the clouds, comes a cry — the cry of the winged Rider, hunting. You cling to the cliff face, and your foot slips.`,
  choices:[
    {t:'Hold on. Climb down with the elven rope.', go:'rope', if: G => has('rope'), fx:{health:-4}},
    {t:'Climb down without a rope.', go:'rope', if: G => !has('rope'), fx:{health:-15}}
  ]},
rope:{title:'The foot of the cliff', text:`You reach the bottom, bruised and soaked. Sam ties the rope to a stump above and climbs after you. Then he gives the rope a disappointed tug, and it slips loose, and falls into his hands, coiled.

"Well!" Sam says. "Who tied that knot? Not me. Must be a bit of elvish magic in this rope." He pats it fondly.

That night, under the cliff, you see two pale lights moving above you on the sheer rock. A shape, black, insect-like, crawling headfirst down the face of the cliff, sniffing, muttering to itself.

<em>"Sneaky hobbitses. Thieves, they are. Close now, close, we smells it, precious, gollum, gollum..."</em>`,
  choices:[{t:'Wait for it to come down.', go:'gollum_caught'}]},
gollum_caught:{title:'Under the cliff', loc:'gollum', fx:{meet:'smeagol'}, text:`Gollum falls the last twelve feet, and Sam is on him in a flash. But Gollum is stronger than he looks, wiry as a snake, and his long fingers are at Sam's throat. You draw Sting. "Let go of him, Gollum," you say coldly, "or I will cut your throat."

Gollum goes limp. He lies there, whimpering. "Don't hurt us! Don't let them hurt us, precious! They won't hurt us, will they, nice little hobbitses? We didn't mean no harm."

Sam has his knife out. "He's a villain, Mr. Frodo. He'd kill us in our sleep. Let's finish him."`,
  choices:[
    {t:'Remember Gandalf\'s words. "No. I will not touch the creature."', go:'riddles', fx:{flags:{pitied:true, spared:true}, aff:{smeagol:15}, hope:5}, res:'You think of Gandalf in the study at Bag End, and what he said about pity. And now that you see the creature — starved, filthy, shaking — you do pity him. "He has done nothing to us yet," you say, sheathing Sting. "And Gandalf said he had a part to play."'},
    {t:'"You\'re right, Sam. End it."', go:'gollum_killed', fx:{hope:-10, burden:6}, if: G => !flag('pityLesson') || true}
  ]},
gollum_killed:{title:'Under the cliff', fx:{flags:{gollumDead:true}}, text:`Sting comes down. Gollum screams and twists — and somehow, wet as a fish, slips out from under Sam and flees, wailing, into the dark rocks. You never see him again. You will never know if the wound was deep.

Sam stares after him, shaken. "Well, that's that," he says uncertainly. "Good riddance."

But now you have no guide. You stare out over the dead marshes in the dawn, and you do not know the way.`,
  choices:[{t:'Find your own way into the marshes.', go:'ch13'}]},
riddles:{title:'Under the cliff', text:`Gollum calms a little when he sees the sword go back in its sheath. He crouches on the rock, rocking, watching you with great pale eyes.

"Nice hobbits," he says. "Clever hobbits. Bilbo Baggins played us a game once, yes, a game of riddles, gollum. Will the master play with us? Just a little game, precious, to pass the night? If we wins — we don't want nothing, no. Only to be friends. And if the master wins, we shows them the way. Yes, the way."`,
  game:{type:'riddle', label:'Play the riddle-game with Gollum', win:'oath', lose:'oath', fxWin:{aff:{smeagol:10}, hope:5}, fxLose:{aff:{smeagol:-5}},
    winText:'Gollum claps his long hands, delighted and sulky all at once. "Clever master! Too clever for poor Sméagol. He shows them the way, he does."',
    loseText:'Gollum cackles, gleeful. "Sméagol wins! But Sméagol is kind. Sméagol is nice. He shows them the way anyway, yes."'}},
oath:{title:'Under the cliff', text:`"Swear," you say. "Swear you will help us, and not harm us."

Gollum crawls about in the dust. "We swears to serve the master of the Precious," he says. "We will swear on — on the Precious."

"The Precious will hold you to your promise," you say, and you feel suddenly tall, and terrible, and sad. "But beware! It will twist it. You are already twisted. Do not tempt me to put it on, Sméagol. I could command you to leap from a cliff or cast yourself into fire. And you would do it."

Gollum cringes. Sam watches, amazed. And in the morning, the elven rope — which Sam wants to tie around Gollum's ankle — burns his skin like fire.`,
  choices:[
    {t:'"Untie him, Sam. He\'ll keep his word."', go:'ch13', fx:{aff:{smeagol:8, sam:-3}, flag:'trusted'}},
    {t:'"Keep the rope on him till we\'re out of the hills."', go:'ch13', fx:{aff:{smeagol:-6, sam:3}}, res:'Gollum wails and weeps the whole day. "It hurts us! Cruel elvish rope! It freezes, it bites!" By evening even Sam looks guilty, and takes it off.'}
  ]}
});

// ── XIII. THE PASSAGE OF THE MARSHES ────────────────────────────────────────
const gollumAlive = G => !G.flags.gollumDead;
// Sam can wrestle the Ring off you only if he loves you dearly and it hasn't yet made you too strong.
const samCan = G => G.aff.sam >= 80 && G.stats.burden < 70;
Object.assign(BEATS, {
ch13:{chapter:13, chTitle:'The Passage of the Marshes', date:'1 March, T.A. 3019', map:'emynmuil', loc:'marshes', travel:1,
  log: G => gollumAlive(G) ? 'Sméagol swore on the Ring to guide us. Into the marshes.' : 'No guide. Into the marshes alone.',
  text: G => gollumAlive(G) ? `Gollum leads you down out of the hills and into the marshes, scuttling ahead on all fours, sniffing, stopping, waiting for you with his head cocked. He will not eat lembas — he spits it out, choking, and says it tastes of leaves and dust and makes his insides burn — but he catches worms and small slimy things in the pools and eats them raw with great satisfaction.

At night, when he thinks you are asleep, you hear him crooning to himself, a little song about cold fish. In the daytime he hides from the sun, which he calls the Yellow Face, and hates.

Sam watches him every minute with deep, unwavering suspicion.` : `Without a guide you stumble down from the hills into a flat land of reeds and black water that stretches to the edge of sight. There are no paths. There is no firm ground that stays firm. Mist hangs over everything, and the only way you can tell east is by the faint dull glow of fire on the clouds ahead, where Mordor lies.

Sam has stopped talking about cooking. That frightens you more than anything.`,
  song: G => gollumAlive(G) ? 'smeagol' : null,
  choices:[
    talk('m1', 'Ask Sméagol about the time before the Ring.', `He goes very still. "Sméagol had a grandmother," he says at last, in a different voice, slow and puzzled. "She told stories. There was a river, and reeds, and — and the grass was soft. Sméagol liked the roots of things." His face twists. "No! No! We doesn't remember, precious. Nothing to remember. It's dark, and cold, and we has the fish." But for a moment you saw something look out of his eyes that was not Gollum.`, {aff:{smeagol:8}, flag:'smeagolMemory'}, gollumAlive),
    talk('m2', 'Share your water with Sméagol.', `He takes the flask in both hands and drinks, never taking his eyes off you, as if waiting for a trick. Then he hands it back. "Nice master," he whispers. "Kind master." Sam snorts.`, {aff:{smeagol:5}, food:-1}, gollumAlive),
    talk('m3', 'Encourage Sam, who is quiet and grim.', `"I don't trust him, Mr. Frodo," Sam says, low, when Gollum is out of earshot. "There's two of him, I reckon. Slinker and Stinker. Slinker's the one who talks sweet, and Stinker's the one who's watching your neck." You laugh, despite everything, and so does Sam.`, {aff:{sam:5}, hope:3}, gollumAlive),
    {t:'Go on, into the deepest part of the marshes.', go:'marsh_cross'}
  ]},
marsh_cross:{title:'The Dead Marshes', loc:'faces', text: G => `The pools here are full of lights. Little pale flames, like candles, that bob and flicker just under the water — and when you lean down to look at one, there is a face beneath it. A grim face, helmed, long dead, staring up at you through the murk. And another. And hundreds more.

${gollumAlive(G) ? '"Don\'t look at the lights," Gollum hisses. "Don\'t follow them! They wants you to go down and join them. Follow Sméagol. Step where Sméagol steps. Only where Sméagol steps!"' : 'You remember Bilbo\'s stories of corpse-candles in marshes, which lure travellers off the safe ground. You look for the firmer tussocks, the paler reeds, anything that might mean solid ground.'}`,
  game: G => ({type:'marsh', label:'Cross the Dead Marshes', guide: gollumAlive(G) ? (aff('smeagol') > 20 ? 2.8 : 2.0) : 1.2, win:'nazgul_over', lose:'marsh_fall',
    fxWin:{hope:4}, fxLose:{health:-10, hope:-8},
    winText:'You reach a long ridge of firmer ground beyond the worst of the pools, and you do not look back.',
    loseText:'Your foot slips off a tussock, and you go down into the cold black water, face to face with the dead.'})},
marsh_fall:{title:'The Dead Marshes', text: G => `For a moment you are under the water, among them: pale faces, rotting banners, the silent host of a battle three thousand years ago, and they are reaching for you, and you want to stay — and then ${gollumAlive(G) ? 'long cold fingers seize your collar and Gollum hauls you out, choking and dripping, onto firm ground. "Told master. Told him not to look." Sam, behind, looks at Gollum with a strange expression, as if he were trying to work something out.' : 'Sam\'s hands seize you and haul you out, gasping, onto the tussock. "Not yet, Mr. Frodo," he says fiercely. "Not yet you don\'t."'}`,
  fx: G => gollumAlive(G) ? {aff:{smeagol:3}} : {aff:{sam:3}},
  choices:[{t:'Go on.', go:'nazgul_over'}]},
nazgul_over:{title:'The edge of the marshes', loc:'dagorlad', date:'3 March, T.A. 3019', text:`Out of the west, very high, a shadow comes racing over the sky: a winged shape, black against the clouds, faster than any bird. The cry it gives turns your blood to water. You throw yourselves flat in the reeds. ${''}

It wheels once overhead, as if it had heard something. The Ring drags at your neck, towards the east, like a stone on a string.`,
  choices:[
    {t:'Lie still under your elven cloak.', go:'blackgate', if: G => has('cloak'), fx:{hope:2}, res:'The grey cloak takes on the colour of the reeds and the mud. The shadow passes. You lie there a long while after, shaking.'},
    {t:'Bury your face in the mud and wait.', go:'blackgate', fx:{burden:3, hope:-3}}
  ]},
blackgate:{title:'The Morannon', loc:'blackgate', w:'blackgate', date:'5 March, T.A. 3019', text: G => `On the third morning you lie on a slag-heap and look down at the Black Gate of Mordor. It is a wall of iron across a pass between two dark mountain ranges, with two great towers on either side, the Teeth of Mordor, and orcs on every battlement. As you watch, a column of men in red and black, with spears and banners, marches up from the south, and the Gate opens with a sound like the grinding of the world's bones. They go in. The Gate closes.

${gollumAlive(G) ? '"There," Gollum whispers. "The master wants to go in there, yes? He will be caught, and the Precious will go back to Him, and He will eat us all. Unless—" He wrings his hands. "There is another way. Sméagol knows. Dark, and hard to find, and very secret. Up the stairs. In the mountains, south. Sméagol went that way once." He shivers all over.' : 'There is no way in. No way at all. You lie there for an hour while Sam chews his lip, and then you remember Bilbo\'s old maps by the fire at Bag End: the mountains of shadow running south, and a little pass marked high up, near a dead city. Cirith Ungol. You have no idea if it is guarded.'}`,
  choices:[
