    {t:'"Lead the way, Sméagol."', go:'ch14', if: gollumAlive, fx:{aff:{smeagol:10}}, res:'Gollum\'s face lights up — a strange, eager, almost hopeful look. "Yes! Yes! Sméagol will help. He will help the master." Then he starts talking about oliphaunts in the south, and Sam, quite unexpectedly, recites a rhyme his Gaffer taught him.'},
    {t:'"We go south along the mountains, Sam. There\'s another pass."', go:'ch14', if: G => !gollumAlive(G), fx:{food:-1, hope:-2}},
    {t:'Try to slip in behind the next column of Men.', go:'gate_try'}
  ]},
gate_try:{title:'The Morannon', text:`You stand up. Sam grabs your arm and pulls you down so hard you bite your tongue. "No, Mr. Frodo! You'd be dead in a minute, or worse. Look at them!" A troop of orcs is marching out of the Gate below, whipped along by a great black uruk. The sentries on the towers search every face.

You sit down, shaking. "You're right, Sam. Of course you're right."`,
  choices:[{t:'Find another way.', go:'blackgate', fx:{hope:-4, aff:{sam:4}}}]}
});

// ── XIV. ITHILIEN ───────────────────────────────────────────────────────────
Object.assign(BEATS, {
ch14:{chapter:14, chTitle:'Of Herbs and Stewed Rabbit', date:'7 March, T.A. 3019', map:'ithilien', loc:'herbs', fx:{map:'ithilien', hope:10}, travel:2, song: G => gollumAlive(G) ? 'mumak' : null,
  log:'South into Ithilien, a fair land under the shadow.',
  text: G => `South along the mountains, and the land changes. Here is Ithilien, once the garden of Gondor: woods of cedar and ilex, groves of olive and bay, thyme and sage and marjoram growing wild on the hillsides. Spring is coming, even here, under the shadow. You hear birds.

${gollumAlive(G) ? 'Gollum brings back two coneys he has caught, and offers them raw. Sam is horrified. "Raw? I\'m going to cook them, I am, and you\'re going to help me find the herbs!"' : 'Sam snares two coneys by a stream with a bit of elven rope and a great deal of patience. "Now," he says, rolling up his sleeves, "a proper stew."'}`,
  game:{type:'cook', label:'Help Sam make a proper stew', win:'oliphaunt', lose:'oliphaunt', fxWin:{health:20, hope:8, aff:{sam:6}}, fxLose:{health:10, hope:2},
    winText:'It is the best meal you have had since Lórien. Sam sits back, blissful. "If only we had some taters," he sighs.',
    loseText:'It is a strange stew, and a smoky one. But it is hot, and it is food, and Sam is proud of it.'}},
oliphaunt:{title:'A glade in Ithilien', loc:'oliphaunt', fx:{meet:'faramir'}, text:`The smoke of the fire has been seen. Men in green and brown, hooded and masked, with long bows, rise out of the bracken all around you. Rangers of Gondor. Their captain is a tall man with grey eyes, who looks a little like someone you know.

Before he can speak, there is a sound of battle further down the road: horns, shouts, the clash of steel. The Rangers are ambushing a troop of Southrons marching to Mordor. And then — crashing through the trees, trumpeting, its great tusks hung with gold and its back carrying a tower — comes something out of Sam's rhyme. An oliphaunt! A mûmak, bigger than a house, stampeding past, and away into the trees.

"An oliphaunt!" Sam breathes, standing up in full view, oblivious to the arrows. "Wait till I tell the Gaffer. Nobody'll believe me."`,
  choices:[{t:'Go with the captain of the Rangers.', go:'henneth'}]},
henneth:{title:'Henneth Annûn', loc:'henneth', w:'henneth', text:`They lead you, blindfold, to a cave behind a waterfall: Henneth Annûn, the Window on the West. The sunset pours through the falling water like a curtain of fire and jewels.

The captain is Faramir, Boromir's brother. He questions you closely, and courteously, and very cleverly. You say little. But he has guessed much: about Isildur's Bane, about the dream that sent Boromir north. And he tells you something you did not know. "My brother is dead," he says quietly. "I saw his body float down the River in a grey boat, three days ago. There was a hole in his breast."

And then Sam, trying to defend you, says much too much. "And he wanted the Ring, he did — oh." He claps his hand over his mouth. Too late. The cave is silent.`,
  choices:[
    {t:'Stand up and draw Sting.', go:'faramir_test', fx:{aff:{faramir:-2}}},
    {t:'Stay seated and meet his eyes.', go:'faramir_test', fx:{aff:{faramir:5}}}
  ]},
faramir_test:{title:'Henneth Annûn', text:`Faramir looks at you for a long time, and something passes over his face: a hunger, quickly mastered.

"So that is the answer to all the riddles," he says softly. "The Ring of the Enemy, here, in a cave in Ithilien, carried by two halflings. What a chance for a captain of Gondor." He laughs, but not unkindly. "I would not take it if it lay by the road. Not if Minas Tirith were falling and I alone could save her. I am not my brother. I do not want that sort of victory. Sit down, Samwise. You have done no harm. Your master is safer for your loyalty, not less."

Sam sits down, scarlet.`,
  choices:[{t:'"Thank you, Captain."', go: G => gollumAlive(G) ? 'forbidden_pool' : 'faramir_farewell', fx:{aff:{faramir:10}, hope:8, burden:-3}}]},
forbidden_pool:{title:'The Forbidden Pool', text:`In the night Faramir wakes you. "Come and see," he says.

Below the falls is a pool, silver in the moonlight. On a rock at its edge crouches a dark shape, catching fish with its bare hands and crooning. Gollum. "That pool is forbidden on pain of death," Faramir says. "My archers have him in their sights. Shall I give the word? Or is he something to you?"`,
  choices:[
    {t:'"Let me go down to him. I will bring him in."', go:'pool_call', fx:{aff:{faramir:3}}},
    {t:'"Give the word. He would betray us in the end."', go:'pool_shot', fx:{flags:{gollumDead:true}, hope:-6, burden:5}},
    {t:'"Leave him. He will find us again on his own."', go:'faramir_farewell', fx:{aff:{smeagol:3}}, res:'Faramir raises an eyebrow, but signals his archers to lower their bows. Gollum finishes his fish and slips away into the dark. In the morning he is waiting at the edge of the woods, as if nothing had happened.'}
  ]},
pool_call:{title:'The Forbidden Pool', text:`You go down alone and call softly. "Sméagol. Come, Sméagol. Master is here." He comes, glad, trusting, dripping — and the Rangers spring out of the dark and seize him and bind him, and he screams and screams. "Tricksy master! False! He betrayed us, precious! He lied!"

You have saved his life. He will never know it. And something in him that had begun to unfold, in the marshes, closes up again tight.`,
  choices:[{t:'Ask Faramir to free him into your keeping.', go:'faramir_farewell', fx:{aff:{smeagol:-15}, flag:'poolBetrayal'}}]},
pool_shot:{title:'The Forbidden Pool', text:`Faramir lifts his hand. A bowstring sings. The dark shape on the rock jerks, and slides into the water without a sound. The ripples spread across the silver pool, and are gone.

Sam lets out his breath. "Well," he says. Then, after a while, "I never liked him. But I don't like that either."

Neither do you. And now there is no one to show you the secret stair.`,
  choices:[{t:'…', go:'faramir_farewell'}]},
faramir_farewell:{title:'The edge of Ithilien', date:'8 March, T.A. 3019', text: G => `Faramir gives you food for the journey and two staffs of polished wood. "I would send men with you," he says, "but they would only bring the Enemy's eye on you sooner." He looks east, troubled. ${gollumAlive(G) ? '"Cirith Ungol, the creature said? That is a name of dread. There is something in that pass, something old and terrible. Do not trust him, Frodo. Not at the end."' : '"You seek Cirith Ungol? That is a name of dread. There is something in that pass, something old and terrible. Go carefully."'}

"Farewell, Frodo, son of Drogo. If ever you come back to the lands of the living, I hope we meet again under a kinder sun."`,
  choices:[{t:'Go on, east.', go:'ch15', fx:{item:'staff', food:6, aff:{faramir:4}}}]}
});

// ── XV. THE STAIRS OF CIRITH UNGOL ──────────────────────────────────────────
Object.assign(BEATS, {
ch15:{chapter:15, chTitle:'The Stairs of Cirith Ungol', date:'10 March, T.A. 3019', map:'ithilien', loc:'crossroads', travel:1, fx:{hope:5},
  log:'At the Cross-roads, a fallen king crowned with flowers.',
  text:`At the Cross-roads, where the great road from Osgiliath meets the road south, sits the statue of an old king of Gondor. Orcs have knocked his head off and set a crude stone in its place, daubed with a red Eye. But the old head lies by the road, and a trailing flower — small and white and starry — has grown round its brow like a crown.

The sun breaks through the clouds for a moment, and lights it.

"They cannot conquer for ever," you say. Sam nods, swallowing hard.`,
  choices:[{t:'Turn east, into the Morgul Vale.', go:'morgul'}]},
morgul:{title:'Minas Morgul', loc:'morgul', date:'11 March, T.A. 3019', text:`Minas Morgul, the Tower of Sorcery, glows with a pale, corpse-like light in the dark valley. White flowers grow in the fields beside the road, luminous and sickly and smelling of the grave. The bridge leads straight to the city's gate, and you find your feet turning towards it, as if pulled.

Then the ground shakes, and a great bolt of red lightning stabs up from the tower, and the gates open. Out of them rides an army — and at its head, on a black horse, the Lord of the Nazgûl himself, crowned, terrible.

He stops on the bridge. He turns his head. The Ring is burning on its chain. It wants to go to him.`,
  game:{type:'resist', label:'Resist the Witch-king\'s call', duration:24, pull:13, foe:'The Witch-king', win:'stairs', lose:'morgul_slip',
    fxWin:{hope:6}, winText:'Your hand, which had been moving towards the chain, closes instead on the Phial in your breast. The Lord of the Nazgûl turns away, and rides out of the valley, and his army follows him west to war.',
    loseText:'Your hand moves by itself towards the chain at your neck—'}},
morgul_slip:{title:'Minas Morgul', text:`—and stops, and grips the Phial of Galadriel instead, just in time. You have not put it on. But it was very close; closer than ever before. The Witch-king paused a long moment on the bridge, his crowned head turning, before he rode away to war.

You feel stretched thin, as Bilbo once said. Worn through.`,
  choices:[{t:'Climb.', go:'stairs', fx:{burden:8, hope:-4}}]},
stairs:{title:'The Stairs', loc:'stairs', date:'12 March, T.A. 3019', text: G => `The Straight Stair, and then the Winding Stair, cut into the cliff face, a thousand steps and more, each one taller than a hobbit's knee. You climb all day.

At a resting place near the top, you and Sam sit with your backs to the rock and share the last of Faramir's bread.

"Do you think we're in a story, Mr. Frodo?" Sam says, out of nowhere. "Like the ones Mr. Bilbo used to tell? I've been thinking. The folk in those never knew they were in one. They were just cold and hungry and fed up, same as us, and wishing they were home. It's only afterwards it turns into a tale."

"And how does ours end, do you think?"

"Don't know. That's the thing — you never do, from inside." He chews thoughtfully. "But I'd like it to be told one day, by the fire. With the bits about the cooking left in."

You laugh — properly, for the first time in weeks — and the stones ring with it. "I can hear it now. Some small hobbit at bedtime, saying, <em>No, not the Ring part again. Tell the part about Sam!</em>"

Sam goes red. "Now you're making fun."

"I'm not," you say. "I'm really not. It wouldn't be much of a story without you, Sam. There wouldn't <em>be</em> a story without you." ${gollumAlive(G) ? '\n\nThen you sleep, your head in Sam\'s lap. And Gollum, coming back from somewhere, finds you like that.' : ''}`,
  choices: G => gollumAlive(G) ? [{t:'…', go:'gollum_almost'}] : [{t:'Go on, to the tunnel at the top.', go:'lair'}]},
gollum_almost:{title:'The Stairs', text:`(You do not see this. You will only hear of it, much later, from Sam.)

Gollum looks at the two of you sleeping, and stops. Something happens in his face. The greedy light goes out of his eyes, and what is left behind is grey and tired and very, very old. He creeps closer. He puts out one thin, shaking hand and touches your knee — lightly, almost tenderly, the way you might touch something you had lost a long time ago and only half remembered.

If you had been awake, you might have seen, for a moment, a small brown river-hobbit, sitting in the reeds in the sun, five hundred years ago, before any of this.

Then Sam wakes, and sees the creature's hand on his master. "Oi! Get off him! What are you creeping about at, you slinking old villain?"

The hand snatches back. The light comes back into the eyes, green and sly. "Creeping, he says. Slinking, he says," Gollum hisses. "Sméagol only looks. Hobbits are so <em>kind</em> to poor Sméagol."`,
  choices:[
    {t:'(Waking) "Sam! Let him be."', go:'lair', if: G => aff('smeagol') >= 20, fx:{aff:{smeagol:6}}, res:'Gollum looks at you, and for a heartbeat something is still there. Then he turns away. "This way," he says. "Through the tunnel. Master will see. Yes. Master will see."'},
    {t:'(Waking) Say nothing.', go:'lair'}
  ]},
lair:{title:"Torech Ungol", text: G => `At the top of the stair is a tunnel, and the tunnel stinks. Not of orcs. Of something worse — a foul, choking reek like rotten meat in a cellar. The darkness inside is so thick it is like a substance, like breathing in black wool.

${gollumAlive(G) ? 'Gollum goes in first. "This way. Follow Sméagol." And then — you are not sure when — he is not there any more. His footsteps have gone. You call. No answer. Only, from somewhere deep in the dark, a bubbling hiss, and the soft clicking of many legs on stone.' : 'You go in. Sam holds your sleeve. Far ahead, from somewhere deep in the dark, comes a bubbling hiss, and the soft clicking of many legs on stone.'}

"The light, Mr. Frodo!" Sam whispers. "The Lady's light!"`,
  game:{type:'maze', map:'shelob', label:'Escape Shelob\'s Lair', win:'web', lose:'web', fxWin:{hope:4}, fxLose:{health:-15},
    winText:'You see grey light ahead — the end of the tunnel — and run for it.',
    loseText:'Something huge brushes past you in the dark; a leg like a barbed pole lashes your arm. But you see grey light ahead, and run for it.'}},
web:{title:'The end of the tunnel', text:`The tunnel mouth is blocked by a web: a vast grey web, strand on strand, thick as rope. Sting cuts it — the blade shears through like a scythe through grass, glowing blue — and you are out, and running, into the pass beyond, and the tower of Cirith Ungol stands above you, and you are laughing with relief.

You do not see what comes out of a hole in the rock behind you. Sam does. He shouts. You turn.

She is the last child of an ancient evil: a great spider, bloated, black, with clusters of eyes and a stinger like a spear. She moves with horrible speed. She is upon you before Sam has finished shouting your name.

There is a pain in your neck like fire and ice. Then nothing.`,
  choices:[{t:'…', go:'ch16'}]}
});

// ── XVI. THE CHOICES OF MASTER SAMWISE ──────────────────────────────────────
// A short interlude in which you play as Sam.
Object.assign(BEATS, {
ch16:{chapter:16, chTitle:'The Choices of Master Samwise', date:'13 March, T.A. 3019', map:'ithilien', loc:'cirith', art:'none',
  log:'Stung by Shelob. (Sam\'s account follows.)',
  text:`<em>Here the Red Book is in Sam's handwriting, large and careful.</em>

You are Samwise Gamgee, and your master is dead.

You fought her. You don't know how. You drove Sting into her foot, and when she came down on you to crush you, you held the blade up and she drove herself onto it, and then you held up the Lady's light and cried out words in elvish you didn't know you knew, and she fled, hurt, into the dark.

But Mr. Frodo lies cold and still in her grey cords, and his face is pale, and he does not breathe.

You sit by him for a long time. Then you think of the quest, and the Ring, and what will happen if nobody finishes it.`,
  choices:[
    {t:'Take the Ring from round his neck. Someone must go on.', go:'sam_orcs'},
    {t:'Stay. You will not leave him. Not ever.', go:'sam_stay'}
  ]},
sam_stay:{title:'The pass of Cirith Ungol', text:`You stay. You hold his cold hand and you weep. And then you hear orcs coming, down the pass from the tower, and up from the tunnel behind, and you know they will find him, and find the Ring, and take it to the Dark Lord, and all of it — all of it — will have been for nothing.

You kiss his forehead. You take the chain from his neck. You put Sting in your belt. "Forgive me, master," you say. "I'll come back."`,
  choices:[{t:'Hide.', go:'sam_orcs', fx:{aff:{sam:5}}}]},
sam_orcs:{title:'The pass of Cirith Ungol', text:`Orcs come from both sides, and you slip on the Ring to hide — and everything goes strange and grey, and you can understand their speech. They have found your master. They are carrying him off to the tower.

"Shelob's done her work, then," one says. "He's not dead. She stings 'em still and keeps 'em fresh, see? He'll wake in a few hours, and then he'll wish he hadn't."

<em>Not dead.</em> You nearly shout. You have left your master alive in the hands of the enemy.

The great gate of the tower slams shut in your face.`,
  enter: G => { G.ringUses++; wraithFlash(); },
  choices:[{t:'Find a way into the tower.', go:'sam_tower'}]},
sam_tower:{title:'The Tower of Cirith Ungol', loc:'cirith', text:`The Ring is heavy on your neck, and it shows you things. You see yourself enormous, striding across Mordor with a sword of fire, and the orcs falling on their faces as you pass. You see the ash-plains ploughed and green, rows and rows of beans and cabbages and apple trees as far as the eye can see, all yours, all planted by your order.

And something in you, something plain and stubborn and Gamgee, says: <em>Order? Who plants a cabbage by giving orders?</em> A garden is a thing you dig yourself, with your own two hands, a bit at a time. You never wanted a kingdom. You wanted a nice bit of ground, and a nice hole to come home to, and Mr. Frodo safe.

The pictures fade. You are just Sam, on a stair, in the dark. There is screaming inside the tower. The orcs are fighting over Mr. Frodo's mithril shirt. That will help.`,
  game:{type:'sneak', map:'tower', label:'Creep through the Tower of Cirith Ungol', win:'sam_song', lose:'sam_song',
    fxWin:{hope:6}, fxLose:{health:-8},
    winText:'You reach the topmost stair without a single orc seeing you.',
    loseText:'An orc spots you, and you run, and lash out with Sting, and it flees screaming that a great elf-warrior is loose in the tower. You run up the last stair.'}},
sam_song:{title:'The top of the tower', song:'tower', text:`At the top of the tower there is nothing but a blank wall and a trapdoor in the ceiling, far too high to reach. You have no idea where Mr. Frodo is.

And so, because you don't know what else to do, you sing. Softly, at first, a silly old Shire song, and then other words come, your own words, about the stars over the shadow.

And from above, faint, very faint, a voice answers.`,
  choices:[{t:'…', go:'sam_rescue'}]},
sam_rescue:{title:'The Tower of Cirith Ungol', date:'14 March, T.A. 3019', text:`<em>You are Frodo again.</em>

You wake naked and in agony on the floor of a dark room. An orc is whipping you. Then the orc screams and falls, and Sam is there, Sam, with Sting in his hand and tears on his face.

"Sam! Oh, Sam!" You cling to each other.

Then you remember. "The Ring! They've taken it! It's all over!"

"No, Mr. Frodo," says Sam. "I've got it. I took it, because I thought you was dead. Here it is." He pulls the chain over his head, and holds it out.`,
  choices:[
    {t:'Snatch it from him. "Give it to me! Thief!"', go:'sam_rescue2', fx:{burden:6, aff:{sam:-4}}, res:'You hear your own voice — high, shrill, horrible — and you see Sam\'s face. And through a strange mist you see him for a moment as a small, grasping creature, an orc with hands reaching for your treasure. Then the mist clears, and it is only Sam, with his hand still out. You are holding the Ring, weeping. "Oh, Sam. What have I said? What have I done? Forgive me. It is the Ring. I could not bear it. Forgive me."'},
    {t:'Hold out your hand, and close your fingers around it slowly.', go:'sam_rescue2', fx:{aff:{sam:6}, burden:2}, res:'Something in you wants to scream at him, to snatch it, to call him thief. You press the scream down, very deep. "Thank you, Sam," you say, very quietly. "I don\'t think anyone else in the world could have carried it and then given it back."'}
  ]},
sam_rescue2:{title:'The Tower of Cirith Ungol', text:`"I'll carry some of it for you, Mr. Frodo," Sam says, gently. "Not the Ring. The rest."

There are orc-clothes and mail among the dead in the tower. You dress yourselves in them, filthy and stinking, and Sam gives you back your elven cloak to wear over it, and you slip out of the gate past the Silent Watchers — two great stone statues that cry out when anyone passes, until Sam holds up the Lady's light, and they fall silent.

Mordor lies before you.`,
  choices:[{t:'Out into the Land of Shadow.', go:'ch17', fx:{item:'orcmail'}}]}
});

// ── XVII. THE LAND OF SHADOW ────────────────────────────────────────────────
Object.assign(BEATS, {
ch17:{chapter:17, chTitle:'The Land of Shadow', date:'15 March, T.A. 3019', map:'mordor', loc:'tower', w:'cirithungol', fx:{map:'mordor', hope:3}, art:'eye',
  log:'Escaped the tower in orc-gear. Mordor.',
  text:`Mordor is a land of ash. The ground is cracked and black and covered in dust; the only plants are thorny, twisted bushes; the air stinks of sulphur and burning. The sky is a roof of dark cloud, lit from below by the red fire of Mount Doom, which you can see far away across the plain, rumbling and smoking.

There are orc-camps everywhere. Roads full of marching troops. The great Eye watches from its tower in the north, turned away from you — towards the West, where, though you do not know it, your friends are making war to draw it.

You have a few days' food. Very little water. And fifty miles to go.

One night, Sam looks up, and the clouds part over a crag, and there is a star: one small white star, very far away and very bright. Sam looks at it for a long while. "It's still there," he says at last, in a wondering voice, as if somebody had told him it wouldn't be. "All this muck, and it's still there, Mr. Frodo, just the same as over the Shire. They can't reach it. They can't ever reach it." He goes to sleep smiling, for the first time since Ithilien.`,
  choices:[{t:'Begin the crossing.', go:'trek', fx:{hope:6}}]},
trek:{title:'The plain of Gorgoroth', loc:'morgai',
  text:`Choose your path across Mordor. Every leg of the journey costs a day, food and water, and the Ring grows heavier with every mile. Some places have water. Some have orcs.`,
  game:{type:'trek', label:'Cross Mordor', win:'ch18', lose:'trek_collapse', skipFx:{burden:16, food:-5, health:-12}}},

Object.assign(BEATS, {
ch18:{chapter:18, chTitle:'Mount Doom', date:'25 March, T.A. 3019', map:'mordor', loc:'doom', w:'doom', art:'doom',
  enter: G => { G.stats.health = Math.max(G.stats.health, 15); },
  log:'At the foot of Mount Doom.',
  text:`The mountain rises above you, enormous, its slopes of ash and slag scored with lava. You throw away everything you can spare. Sam throws away his pans, and stands looking at them for a long moment.

You can hardly walk. The Ring is a wheel of fire before your eyes, and its weight drags you down like a millstone. You do not remember the Shire. You cannot remember the taste of food, or the sound of water, or the touch of grass. There is nothing between you and the wheel of fire.

"Come on," says Sam. "Up we go."`,
  fx:{lose:'pans'},
  game:{type:'climb', label:'Climb Mount Doom', win:'doom_top', lose:'doom_top', skipFx:{burden:4}}},
doom_top:{title:'The slopes of Mount Doom', text: G => `${G.games.climb && G.games.climb.carried ? 'At last you cannot go on. You lie face-down in the ash. And Sam says: "I can\'t carry it for you, Mr. Frodo. But I can carry you, and it as well." And he lifts you onto his back, and he carries you, up and up, gasping, until the road is near.' : 'You climb, and climb, and Sam is beside you every step, half-lifting you when you stumble, and at last the road is near.'}

${gollumAlive(G) ? 'And then, as you near the top, something leaps on you from the rocks above: a lean and starved creature, more skeleton than flesh, with mad eyes. Gollum! "Wicked master!" he shrieks. "Cheats us! Mustn\'t go that way! Mustn\'t hurt the Precious! Give it to Sméagol, yes, give it to us!"\n\nYou throw him off with a strength you did not know you had. Sam stands over him with Sting.' : 'Above you, a doorway yawns black in the mountainside, lit within by a fire like the opening of a furnace.'}`,
  choices: G => gollumAlive(G) ? [
    {t:'"Go, Sam. I must go on." (Leave Sam to deal with him.)', go:'sam_spares'},
  ] : [{t:'Go in.', go:'crack'}]},
sam_spares:{title:'The slopes of Mount Doom', text:`You turn and stumble up towards the door.

Sam stands over Gollum, Sting in hand. Gollum grovels in the ash, whining. "No, no, not the sharp sting, not the elf-blade! Poor Sméagol's so thin, so hungry. Precious is going away, going into the fire, and then there's nothing, nothing left for Sméagol at all."

Sam's hand wavers. He has wanted this for weeks. But he has carried the Ring himself, for a while, a few hours, and now he knows — he knows — what it is to have it taken. He cannot do it.

"Go on," he says roughly. "Clear off. Go and find a pool somewhere and catch a fish. I won't stick you. Not today. Go on, before I change my mind."

Gollum slinks away down the mountain. Sam turns and follows you. Behind him, unseen, Gollum turns back.`,
  choices:[{t:'Into the mountain.', go:'crack'}]},
crack:{title:'Sammath Naur — the Cracks of Doom', loc:'sammath', text:`Inside, the mountain is a vast cave, split by a great fissure. Out of it rises a red glare, and the heat is terrible. The path runs out to the very edge of the chasm.

This is where it was made. This is where it can be unmade.

You stand at the edge, and take the Ring from its chain, and hold it out over the fire. Sam is behind you, crying out, "Now, master! Throw it in!"

The Ring is in your hand. It is the most precious thing in the world. It is <em>you</em>. You came all this way. You carried it all this way. You suffered for it. It is yours.`,
  choices: G => [
    {t:'Open your hand. Let it fall.', go:'cast_it', if: G => G.stats.burden < 30, cls:'go'},
    {t:'Open your hand. Let it fall.', if: G => G.stats.burden >= 30, tag:'your hand will not open', cls:'disabled-choice', go:'claim', res:'You tell your hand to open. It does not. It is not your hand any more.'},
    {t:'"No. I came all this way for it. It is mine. <em>Mine.</em>"', go:'claim', cls:'ring'}
  ]},
cast_it:{title:'Sammath Naur', text: G => `Your fingers open, one by one. It is the hardest thing you have ever done, harder than the barrow or the Ford or the long stair; it is like tearing off your own skin. The Ring falls, turning over and over, glinting, down into the red light.

${gollumAlive(G) ? 'And Gollum, who has followed you in, screams and hurls himself past you after it, over the edge, his long arms outstretched — and catches it, in the air, in mid-fall, and for a moment you see his face, rapt, joyful, utterly at peace, as he falls with his Precious into the fire.' : 'And it is gone.'}

The mountain shakes. Far away in the north, a tower begins to fall.`,
  enter: G => { G.flags.endType = 'hero'; },
  choices:[{t:'…', go:'eagles'}]},
claim:{title:'Sammath Naur', text: G => {
  const sp = gollumAlive(G);
  return `You put the Ring on your finger, and vanish from Sam's sight. And in the black tower in the north, something that has been looking west for days snaps round, all at once, like a dog hearing its name. The Eye finds the mountain. It finds the door. It understands, in one instant of terrible clarity, how close it has come to losing everything, and every thought it has comes tearing towards you across the plain, and the Nine, wheeling over the far battle, scream and turn.

${sp ? 'Something strikes Sam from behind and he falls. A dark shape leaps past him to the edge of the chasm. Gollum. He wrestles with an invisible foe — you — and then his long arms find your hand, and he draws it to his mouth, and his teeth close.' : samCan(G) ? 'And Sam, who has carried you up a mountain, does not wait. He throws himself at the place where you stand, by the sound of your breathing, and catches your wrist, and wrenches at the Ring with all his gardener\'s strength.' : 'And there is no one to stop you. Sam pleads, and weeps, and reaches for you, but he cannot see you, and you step away from him. You are the Lord of the Ring now. And the Nine are coming to bow before you — or so the Ring tells you.'}`;
},
  choices: G => gollumAlive(G) ? [{t:'…', go:'gollum_falls'}] : samCan(G) ? [{t:'…', go:'sam_hand'}] : [{t:'…', go:'end_shadow'}]},
gollum_falls:{title:'Sammath Naur', text:`There is a flash of pain, and you are visible again, kneeling at the chasm's edge, and your finger is gone.

Gollum is capering on the brink with the Ring held high above his head, your finger still caught inside it, and in the red light it burns like a little sun. He is not looking at you. He is not looking at anything but the Ring. He laughs, and sobs, and sings to it, and dances, one step, two steps, three — and the third step is out over nothing.

For one moment he hangs there, still gazing upward at his treasure, utterly happy. Then he falls, and the fire takes him, and the Ring with him, and his voice goes down and down into the deep, calling its name, until it stops.

The mountain roars.

You look at your maimed hand, and then at Sam, and you are crying, and you do not know for whom. "Gandalf said he had a part to play," you whisper. "He was right. I couldn't do it, Sam. In the end I couldn't. He did it for me. Poor Sméagol. Poor, poor Sméagol. It's done, Sam. It's done."`,
  enter: G => { G.flags.endType = 'gollum'; },
  choices:[{t:'…', go:'eagles'}]},
sam_hand:{title:'Sammath Naur', text:`You fight him. You would kill him, if you could, your own Sam. Your free hand claws at his face. But he will not let go, and somewhere in the struggle the Ring comes off — and your finger with it, torn on the chain-links or the rock, you will never be sure — and it skitters across the stone to the edge, and wobbles, and falls.

You scream. Then you are lying on the floor, and Sam is holding your bleeding hand, sobbing, and you are free. Utterly, unbelievably free.

"I'm sorry, Mr. Frodo," Sam is saying, over and over. "I'm so sorry. I had to."

"I know, Sam," you say. "I know. Thank you."`,
  enter: G => { G.flags.endType = 'sam'; },
  choices:[{t:'…', go:'eagles'}]},
eagles:{title:'The end of all things', art:'doom', date:'25 March, T.A. 3019', text:`The mountain erupts. Barad-dûr falls, its towers crumbling, its foundations cracking; a great shadow rises into the sky over Mordor, stretching out a vast threatening hand — and a wind takes it, and it is blown away, and passes.

You and Sam stagger out onto the mountainside, onto a little hill of ash in a sea of fire, and sit down together.

"I'm glad it's you, Sam," you say. "If it had to end somewhere, I'm glad it's here, with you."

Sam holds your hand, the maimed one, gently. "Do you remember the Shire, Mr. Frodo? It'll be spring soon. And the orchards will be in blossom."

The lava rises around you. You close your eyes.

And out of the north, flying on the wind, come eagles.`,
  choices:[{t:'…', go:'ch19'}]}
});

Object.assign(BEATS, {
ch19:{chapter:19, chTitle:'The Field of Cormallen', date:'8 April, T.A. 3019', map:'middle', loc:'henneth', w:'minastirith', song:'cormallen', art:'none', fx:{hope:40, health:60, join:['gandalf','aragorn','legolas','gimli','merry','pippin']},
  enter: G => { G.stats.burden = 0; G.stats.health = 100; const i = G.items.indexOf('ring'); if (i >= 0) G.items.splice(i, 1); },
  log:'The Ring is destroyed. The Quest is achieved.',
  text:`You wake in a bed, in a room full of light. Gandalf is sitting beside you. He is dressed all in white, and his beard is white as snow.

"Gandalf? But you fell. I saw you fall."

"I did," says Gandalf. "And I came back, which is a long story, and I am a little different for it. So are you." His eyes twinkle, and then he begins to laugh — a great, warm, rolling laugh, like the summer thunder over the Shire that means rain for the gardens — and you laugh too, you and Sam, without knowing why, until the tears come.

On the Field of Cormallen, in Ithilien, the whole host of the West kneels as you and Sam pass, and lifts its swords, and cries your names. A minstrel of Gondor sings of the Nine-fingered and of Samwise, and Sam weeps for joy. On a high seat sits a king, and he rises as you approach, and you see that it is Strider — Aragorn, Elessar, King of Gondor — and he bows his knee to you.

Merry and Pippin are there, taller than they were (it is the Ent-draughts, they say, whatever those are). Legolas and Gimli are there. Boromir is not.`,
  choices:[
    talk('cm1', 'Embrace Merry and Pippin.', `They nearly knock you over. Pippin is wearing the black-and-silver livery of the Tower Guard of Gondor; Merry is a knight of Rohan. They talk at once, interrupting each other, about Ents and orcs and a battle before the walls of Minas Tirith, and a fell rider on a winged beast, and Merry's sword. You listen and laugh and do not understand half of it.`, {aff:{merry:6, pippin:6}}),
    talk('cm2', 'Ask Aragorn how Boromir died.', `"Defending Merry and Pippin from a hundred orcs," Aragorn says quietly. "He blew his horn for help, and I came too late. Before he died he confessed what he had tried to do on Amon Hen. He was sorry. He died as a man of Gondor should, and I sent him over Rauros in a boat." You are silent for a long time. "I am glad he was sorry," you say at last.`, {aff:{aragorn:4}}),
    talk('cm3', 'Find Gimli and Legolas.', `They are arguing about how many orcs each of them killed at a place called Helm's Deep. Gimli claims forty-three. Legolas says forty-two, but his was an oliphaunt, which surely counts for more. They are, you realise, the closest of friends.`, {hope:5}),
    {t:'Go home. It is time to go home.', go:'scouring'}
  ]},
scouring:{title:'The Shire', map:'havens', loc:'bywater', date:'November, T.A. 3019', fx:{map:'havens'}, text:`You come home in the autumn, four hobbits on ponies, in armour and fine clothes. And the Shire is not as you left it.

The trees along the road are cut down. The Old Mill has been pulled down and a great ugly brick mill built, belching smoke into the Water. There are gates on the Bridge, and Men — rough, squint-eyed Men — giving orders, and a long list of Rules, and a chief called Sharkey who lives at Bag End.

Sharkey, it turns out, is Saruman: fallen, stripped of his staff, and come to take a petty revenge on the little people who beat him.

Merry blows a horn — a gift from Rohan — and the hobbits of the Shire come out of their holes, and rise.`,
  choices:[

    {t:'Let Merry and Pippin lead. You have done your fighting.', go:'saruman'}
  ]},
saruman:{title:'Bag End', loc:'bagend', text:`At the Battle of Bywater the ruffians are routed. And at the door of Bag End you find Saruman himself, ragged and bitter, with a wretched creature at his heels: Wormtongue, his servant.

Saruman draws a knife and stabs at you. It breaks on the mithril under your coat. The hobbits around you roar and draw their swords.

"No!" you say. "Put up your swords. I will not have him killed, not here, not by hobbits. He was one of the great ones once, before he went wrong. Killing him would not mend anything he has broken. Let him go, and let him find his own way back, if there is one."`,
  choices:[
    {t:'Let him go.', go:'havens_road', fx:{hope:6}, res:'Saruman stares at you, and his face works. "Mercy," he says, as if the word tasted foul. "From a hobbit. That is the cruellest thing anyone has done to me yet." He goes, and Wormtongue with him. At the end of the lane, Wormtongue turns on his master in a long-pent fury, and it ends badly for them both. You did not want that. But it was not your doing.'}
  ]},
havens_road:{title:'Bag End, two years later', date:'September, T.A. 3021', art:'shire', text:`The Shire heals. Sam plants trees everywhere, and sprinkles a pinch of the Lady's earth at the root of each, and plants the silver nut in the Party Field, where a mallorn springs up and grows into the wonder of the Shire. That spring the children are fair and the harvest is golden, and the beer is so good that people remember it for a lifetime.

Sam marries Rosie Cotton, and they come to live with you at Bag End, and in time there is a baby, Elanor.

But you do not quite heal. On the anniversary of Weathertop your shoulder aches with cold. On the anniversary of Shelob, you lie ill and moaning, clutching at a white gem on a chain round your neck that Arwen gave you. You wrote it all down in the Red Book, every word; you have left the last pages for Sam.

One autumn day, you ask Sam to come with you on a little journey, to the west.`,
  choices:[{t:'Ride west.', go:'havens'}]},
havens:{title:'The Grey Havens', loc:'havens', w:'havens', art:'havens', song:'havens', text:`At the Grey Havens, at the edge of the Sea, a white ship is waiting. And they are there: Elrond and Galadriel, their great rings shining openly on their hands; Bilbo, very old and sleepy and pleased; and Gandalf, in white, with a third ring, red as fire, on his finger.

"I'm going with them, Sam," you say.

Sam stares at you. "But — you were going to be happy, Mr. Frodo. In the Shire. For years and years. After everything."

"I thought so too. But some hurts don't mend, Sam, not here. I went out to save the Shire, and it's saved, and I'm glad. But it's yours now, not mine. That's how it goes, sometimes: one person carries a thing so far that they can't put it down again, and someone else gets to keep the garden." You take his hands. "You've so much to do, Sam. Rosie, and Elanor, and all the ones to come. Mayor, I shouldn't wonder. And the Red Book — I've left the last pages for you. Fill them up."

Merry and Pippin come galloping up the road, too late to stop you, in time to say goodbye.`,
  choices:[

  ]}
});

// ── ENDINGS ─────────────────────────────────────────────────────────────────
Object.assign(BEATS, {
end_havens:{ending:'good', title:'The Grey Havens', art:'havens', text: G => `The ship slides out of the Gulf of Lune on the evening tide, and the land sinks behind you, and the gulls turn back one by one. For many days there is only the sea, and the stars, and the elves singing softly at the rail.

Then, one morning, the mist ahead grows bright, and parts like a curtain, and there is a shore of white sand, and green hills rising behind it, and a light on them that you have never seen on any hill in Middle-earth. The ache in your shoulder is gone. You realise, with a kind of wonder, that you are not tired.

<em>And far away on the grey quay at Mithlond, Sam stands and watches until the white sail is gone and the stars come out. Then he rides home through the dark with Merry and Pippin, none of them saying much, and comes at last up the lane to Bag End, where the lamp is lit and the door is open. Rosie is waiting. There is supper on the table, and Elanor asleep in her cradle by the fire.</em>

<em>Sam sits down in his chair, and takes a long breath, and lets it out. "Home," he says.</em>

${G.flags.endType === 'gollum' ? 'The Quest was achieved by pity: Bilbo\'s, Gandalf\'s, yours, and Sam\'s. Without Gollum, it could not have been done.' : G.flags.endType === 'hero' ? 'You did what no one in all the ages of Middle-earth was thought able to do: you let it go. The songs will call it impossible. It very nearly was.' : 'It was Sam who ended it, in the end — your Sam, who loved you enough to fight you. The songs of Gondor, which have very little idea what a gardener is, call him Samwise the Brave.'}`},
end_stay:{ending:'good', title:'The Hobbit Who Stayed', art:'shire', text:`The white ship sails without you. Gandalf looks at you for a long moment as it goes, and nods, as if to say: <em>your choice, and not a wrong one.</em>

You live on at Bag End with Sam and Rosie and their ever-growing family, and you are the best uncle a parcel of small Gamgees could ask for. You write poems, and walk in the woods, and grow very old. Your shoulder aches every October, and every March you are ill for a while, and some nights you wake and reach for a chain that is not there.

But every spring, under the mallorn in the Party Field, the children of Hobbiton beg old Mr. Frodo for the story, and you tell it to them, every time, and every time you put Sam in the middle of it.`},
end_shadow:{ending:'bad', title:'The Lord of the Ring', art:'eye', text:`For one moment you are the greatest power in Middle-earth. You see the Nine coming, and you laugh, and command them, and they slow, uncertain.

Then the Eye arrives, and you understand what you have done. You are not the Lord of the Ring. No one ever was, except the one who made it, and he is here now, inside your mind, and he is very, very much stronger than a hobbit from the Shire.

The Nine take you from the mountain as gently as a mother lifts a child. Sam's cries follow you all the way to Barad-dûr.

The West falls. The Shire, being small and far away and of no account, falls last of all.`},
fallen:{ending:'fail', title:'The Road Ends', text:`Your strength is spent. The road that went ever on has come to an end, here, far from the Shire, and you lie down beside it and close your eyes.

<em>But this is not how the tale was told. Turn back the pages of the Red Book, and try that chapter again.</em>`},
claimed:{ending:'fail', title:'Claimed', art:'eye', text:`You put the Ring on, one last time, and you do not take it off. You cannot remember why you ever would.

The grey world closes around you, and in it, very close, there are seven tall white shapes, and a crowned eighth, and a ninth, all bowing. Not to you. To the Ring. And through it, to Him.

<em>The Ring's hold on you grew too strong. Turn back the pages of the Red Book, and try that chapter again — and put it on less often.</em>`}
});

function renderEnding(b){
  const g = b.ending, art = b.art && VIGNETTES[b.art] ? `<div class="art">${VIGNETTES[b.art]()}</div>` : '';
  const top = Object.keys(G.aff).filter(k => G.met.indexOf(k) >= 0).sort((a, c) => G.aff[c] - G.aff[a]).slice(0, 3).map(k => CHARS[k].n.split(' ')[0]).join(', ');
  const titleEarned = g === 'fail' ? '' : g === 'bad' ? 'The Lost' :
    (G.flags.endType === 'hero' ? 'Frodo Unburdened, who let it go' : G.ringUses <= 3 ? 'Frodo of the Nine Fingers, Ring-bearer, Elf-friend' : G.ringUses <= 7 ? 'Frodo Nine-fingers, the Ring-bearer' : 'Frodo the Shadow-touched');
  return `<div class="ending">${art}<div class="chaphead"><div class="cn">${g === 'fail' ? 'THE JOURNEY FALTERS' : 'THE END'}</div></div><h2>${esc(b.title)}</h2><div class="rule"></div>
    <div class="text">${paras(tx(b.text), true)}</div>
    ${g === 'fail' ? '' : `<table class="etable">
      <tr><td>Title</td><td><b>${esc(titleEarned)}</b></td></tr>
      <tr><td>Songs and verses gathered</td><td>${G.songs.length} of ${Object.keys(SONGS).length}</td></tr>
      <tr><td>Maps drawn</td><td>${G.maps.length} of ${Object.keys(MAPS).length}</td></tr>
      <tr><td>Times the Ring was worn</td><td>${G.ringUses}</td></tr>
      <tr><td>Places on the road</td><td>${G.route.length}</td></tr>
      <tr><td>Dearest companions</td><td>${esc(top)}</td></tr>
      <tr><td>Sméagol</td><td>${G.flags.gollumDead ? 'Did not live to see the end' : aff('smeagol') > 20 ? 'Pitied, and trusted, a little' : 'Pitied'}</td></tr>
    </table>`}
    <div class="choices" style="align-items:center">
      ${g === 'fail' && G.checkpoint ? '<button class="btn gold" data-checkpoint>Return to the start of the chapter</button>' : ''}
      <button class="btn" data-new>Begin a new journey</button></div></div>`;
}

// ── Maze: the Old Forest, Shelob's Lair (turn-based, fogged) ────────────────
function carveMaze(cw, ch, r, loops){
  const W = cw * 2 + 1, H = ch * 2 + 1, g = [];

    const nb = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < cw && ny < ch && !seen[nx + ',' + ny]);
    if (!nb.length){ st.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
    seen[nx + ',' + ny] = 1; g[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; g[ny * 2 + 1][nx * 2 + 1] = 0; st.push([nx, ny]);
  }
  for (let i = 0; i < loops; i++){ const x = 1 + Math.floor(r() * (W - 2)), y = 1 + Math.floor(r() * (H - 2)); if ((x + y) % 2 === 1) g[y][x] = 0; }
  return g;
}

  for (let h = 0; h < q.length; h++){ const cur = q[h]; if (cur === t) break; const cx = cur % W, cy = (cur / W) | 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H || g[ny][nx] === 1) continue; const n = ny * W + nx; if (prev[n] !== -1) continue; prev[n] = cur; q.push(n); } }

}

      x.fillStyle = '#9f6'; for (let i = 0; i < 6; i++){ x.beginPath(); x.arc(X - 6 + (i % 3) * 6, Y - 4 + Math.floor(i / 3) * 5, 1.6, 0, 7); x.fill(); }

    x.fillStyle = '#2a1a0a'; x.font = 'bold 12px serif'; x.textAlign = 'center'; x.fillText('F', P.x * ts + ts / 2, P.y * ts + ts / 2 + 4);

  }
  draw();
  return {stop(){}, key(e){ const d = KEYMAP[e.key]; if (d){ e.preventDefault(); step(d); } else if ((e.key === 'p' || e.key === 'P') && shelob) usePhial(); }};
};

// ── Simon: sing Tom's rhyme / look into the Mirror ──────────────────────────
GAMES.simon = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.mirror ? 'The Mirror of Galadriel' : 'Tom\'s Rhyme', '', cfg.mirror ? 'Watch the visions rise in the water, then touch them in the same order. Two mistakes are forgiven.' : 'Listen to the tune, then sing it back by pressing the pads in the same order. Two slips are forgiven.');
  const cols = cfg.mirror ? ['#4a6a9a','#6a5a8a','#c8c8e8','#b84a1a'] : ['#c9a227','#5a8a3a','#7a6a5a','#3a6a9a'];
  const notes = [64, 67, 71, 74];
  ui.body.innerHTML = `<div class="pads" style="${cfg.mirror ? 'background:radial-gradient(#3a4a6a,#0a1020);padding:16px;border-radius:50%' : ''}">${cfg.pads.map((p, i) => `<button class="pad" data-p="${i}" style="background:${cols[i]}">${p}<div style="font-size:.8rem">${esc(cfg.names[i])}</div></button>`).join('')}</div>`;
  const pads = ui.body.querySelectorAll('.pad');
  const seq = []; let pos = 0, lives = 2, busy = true, over = false, timers = [];
  function flash(i, ms){ pads[i].classList.add('lit'); SND.toneAlways(notes[i], .35, cfg.mirror ? 'sine' : 'triangle', .25); timers.push(setTimeout(() => pads[i].classList.remove('lit'), ms || 380)); }
  function play(){
    busy = true; pos = 0; ui.msg.textContent = cfg.mirror ? 'The water stirs…' : 'Listen…';
    seq.forEach((p, k) => timers.push(setTimeout(() => flash(p), 700 + k * 560)));
    timers.push(setTimeout(() => { busy = false; ui.msg.textContent = 'Your turn.'; }, 700 + seq.length * 560));
    ui.hud.innerHTML = `<span>Length <b>${seq.length}/${cfg.len}</b></span><span>Slips left <b>${lives}</b></span>`;
  }
  function grow(){ seq.push(Math.floor(Math.random() * 4)); play(); }
  pads.forEach(b => b.onclick = () => {
    if (busy || over) return; const i = +b.dataset.p; flash(i, 220);
    if (i !== seq[pos]){ lives--; SND.fx('bad');
      if (lives < 0){ over = true; return done({win:false, score:seq.length / cfg.len}); }
      ui.msg.textContent = 'Wrong! Again…'; return timers.push(setTimeout(play, 700)); }
    pos++;
    if (pos === seq.length){
      if (seq.length >= cfg.len){ over = true; return timers.push(setTimeout(() => done({win:true, score:1}), 500)); }
      busy = true; timers.push(setTimeout(grow, 600));
    }
  });
  for (let i = 0; i < 2; i++) seq.push(Math.floor(Math.random() * 4));
  grow();
  return {stop(){ timers.forEach(clearTimeout); }};
};

// ── Rhythm: sing on the table at the Prancing Pony ──────────────────────────
GAMES.rhythm = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'The Innkeeper\'s Pig', '', 'Hit the notes as they reach the line: keys <b>A S D</b> (or <b>←↓→</b>), or tap the lanes.');
  const {c, x} = mkCanvas(ui.body, 600, 440);
  const mel = songMelody(cfg.song), beat = 60 / mel.tempo, lines = SONGS[cfg.song].v[0].concat(SONGS[cfg.song].v[1] || []);
  const notes = []; let tt = 2;
  mel.lines.forEach((ln, li) => { ln.forEach(([m, d]) => { notes.push({t:tt, lane:m % 3, m, li, hit:null}); tt += d * beat; }); tt += beat * .5; });
  const end = tt + 1.2, HIT = 380, SPEED = 260, keys = {a:0, s:1, d:2, ArrowLeft:0, ArrowDown:1, ArrowRight:2, j:0, k:1, l:2};
  let t = 0, good = 0, ok = 0, miss = 0, combo = 0, over = false, flashL = [0, 0, 0];
  function press(lane){
    if (over) return; flashL[lane] = .15;
    let best = null, bd = .26;
    notes.forEach(n => { if (n.hit === null && n.lane === lane){ const d = Math.abs(n.t - t); if (d < bd){ bd = d; best = n; } } });
    if (!best){ combo = 0; return; }
    best.hit = bd < .11 ? 'good' : 'ok'; if (best.hit === 'good') good++; else ok++; combo++;
    SND.toneAlways(best.m, .25, 'square', .12);
  }
  c.addEventListener('pointerdown', e => { const [px] = canvasPos(c, e); press(Math.min(2, Math.floor(px / 200))); });
  const stop = ticker(dt => {
    if (over) return;
    t += dt;
    notes.forEach(n => { if (n.hit === null && t - n.t > .26){ n.hit = 'miss'; miss++; combo = 0; } });
    x.fillStyle = '#2a1a0e'; x.fillRect(0, 0, 600, 440);
    for (let l = 0; l < 3; l++){ x.fillStyle = flashL[l] > 0 ? 'rgba(255,215,106,.25)' : (l % 2 ? '#33200f' : '#2e1c0d'); x.fillRect(l * 200, 0, 200, 440); flashL[l] = Math.max(0, flashL[l] - dt); }
    x.fillStyle = '#c9a227'; x.fillRect(0, HIT - 2, 600, 4);
    ['A','S','D'].forEach((k, l) => { x.fillStyle = '#8a6c45'; x.font = '16px Cinzel,serif'; x.textAlign = 'center'; x.fillText(k, l * 200 + 100, HIT + 34); });
    let cur = 0;
    notes.forEach(n => {
      if (n.t - t < 2.2 && n.t - t > -1) cur = Math.max(cur, n.li);
      if (n.hit && n.hit !== 'miss') return;
      const y = HIT - (n.t - t) * SPEED; if (y < -20 || y > 460) return;
      x.fillStyle = n.hit === 'miss' ? '#553' : ['#ffd76a','#ff9a5a','#9ad7ff'][n.lane];
      x.beginPath(); x.ellipse(n.lane * 200 + 100, y, 34, 12, 0, 0, 7); x.fill();
    });
    const curLine = notes.filter(n => n.t <= t + .3).reduce((a, n) => n.li, 0);
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, 600, 56);
    x.fillStyle = '#ffe9b0'; x.font = 'italic 15px "IM Fell English",serif'; x.textAlign = 'center';
    const L = lines[curLine] || ''; x.fillText(L.length > 70 ? L.slice(0, 68) + '…' : L, 300, 24);
    x.fillStyle = '#b99a62'; x.font = 'italic 12px "IM Fell English",serif'; const L2 = lines[curLine + 1] || ''; x.fillText(L2.length > 80 ? L2.slice(0, 78) + '…' : L2, 300, 44);
    ui.hud.innerHTML = `<span>Combo <b>${combo}</b></span><span>Hits <b>${good + ok}/${notes.length}</b></span>`;
    if (t > end){ over = true; const acc = (good + ok * .6) / notes.length; done({win: acc >= .55, score:acc, msg:`You hit ${good + ok} of ${notes.length} notes.`}); }
  });
  return {stop, key(e){ if (keys[e.key] !== undefined){ e.preventDefault(); press(keys[e.key]); } }};
};

// ── Weathertop: drive back the five with fire ───────────────────────────────

    gr.addColorStop(0, 'rgba(255,170,60,.55)'); gr.addColorStop(1, 'rgba(255,120,30,0)'); x.fillStyle = gr; x.fillRect(0, 0, 700, 440);

    obs.forEach(o => {

      else if (o.k === 'log'){ x.fillStyle = '#4a3018'; x.fillRect(o.x - 26, y - 8, 52, 16); }

      x.strokeStyle = '#f4f4f0'; x.lineWidth = 4; const k = Math.sin(t * 25) * 8; [[-18, k], [-8, -k], [12, k], [22, -k]].forEach(([dx, kk]) => { x.beginPath(); x.moveTo(PX + dx, py + 8); x.lineTo(PX + dx + kk, py + 24); x.stroke(); });

// ── QTE: quick reactions ────────────────────────────────────────────────────
GAMES.qte = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.label, '', 'Press the arrow shown, quickly — on the keyboard or the buttons.');
  const AR = {up:'▲', down:'▼', left:'◀', right:'▶'};
  ui.body.innerHTML = `<div class="riddle" id="qline" style="min-height:3em"></div><div class="qprompt" id="qp"></div><div class="gbar" style="max-width:420px;margin:0 auto"><i id="qt" style="background:linear-gradient(90deg,#c22,#ffb030)"></i></div>
    <div class="qkeys">${['left','up','down','right'].map(d => `<button data-d="${d}">${AR[d]}</button>`).join('')}</div>`;
  let i = -1, want = null, left = 0, okc = 0, over = false, gap = 0;
  const n = cfg.n || 6, T = cfg.time || 1.5;
  function nextP(){ i++; if (i >= n){ over = true; return done({win: okc / n >= .6, score:okc / n, msg:`You got ${okc} of ${n} right.`}); }
    want = pick(['up','down','left','right']); left = T * (1 - i * .03); $('#qline').textContent = (cfg.lines && cfg.lines[i]) || '…'; $('#qp').textContent = AR[want];
    ui.body.querySelectorAll('[data-d]').forEach(b => b.classList.toggle('want', b.dataset.d === want)); }
  function press(d){ if (over || !want) return; if (d === want){ okc++; SND.fx('hit'); ui.msg.textContent = 'Yes!'; } else { SND.fx('bad'); ui.msg.textContent = 'Wrong!'; } want = null; gap = .35; }
  ui.body.querySelectorAll('[data-d]').forEach(b => b.onclick = () => press(b.dataset.d));
  const stop = ticker(dt => {
    if (over) return;
    if (gap > 0){ gap -= dt; if (gap <= 0) nextP(); return; }
    if (want){ left -= dt; $('#qt').style.width = Math.max(0, left / T * 100) + '%'; if (left <= 0){ want = null; gap = .35; ui.msg.textContent = 'Too slow!'; SND.fx('bad'); } }
    ui.hud.innerHTML = `<span><b>${Math.max(0, i + 1)}/${n}</b></span>`;
  });
  gap = .6;
  return {stop, key(e){ const d = KEYMAP[e.key]; if (d && e.key.indexOf('Arrow') === 0){ e.preventDefault(); press(d); } }};
};

// ── Riddles with Gollum (all original riddles) ──────────────────────────────

  const lights = []; for (let i = 0; i < 14; i++){ const cc = ri(0, C - 1), rr = ri(0, R - 1); if (!safe[cc + ',' + rr]) lights.push([cc, rr, Math.random() * 6]); }
  let P = [path[0][0], R], showT = cfg.guide || 2, falls = 0, t = 0, over = false, hintT = 0, onPath = -1, fallFlash = 0;

    if (over || showT > 0) return;
    if (Math.abs(cc - P[0]) + Math.abs(rr - P[1]) !== 1 && !(Math.abs(cc - P[0]) === 1 && rr === P[1] - 1)) return;
    if (rr > R - 1 || cc < 0 || cc >= C) return;
    if (rr < 0){ return; }

      if (rr === 0){ over = true; setTimeout(() => done({win:true, score:1 - falls / 4}), 400); } }
    else { falls++; SND.fx('splash'); fallFlash = 1; ui.msg.textContent = falls >= 3 ? 'You go under, and the dead faces crowd close…' : pick(['The tussock gives way! Cold black water — and a pale face beneath it.','You slip into the mire, and pull yourself out, gasping.','Not there! The bog sucks at your leg.']);
      hintT = 1.2; if (falls >= 3){ over = true; setTimeout(() => done({win:false, score:.3}), 900); } }
  }

  const stop = ticker(dt => {
    t += dt; if (showT > 0){ showT -= dt; ui.msg.textContent = showT > 0 ? (cfg.guide > 1.5 ? '"There, there — that way," Gollum hisses, pointing. "Remember!"' : 'You study the reeds, looking for firmer ground…') : 'Go.'; }
    hintT = Math.max(0, hintT - dt); fallFlash = Math.max(0, fallFlash - dt * 1.5);

      const X = cc * ts, Y = rr * ts; x.fillStyle = (cc + rr) % 2 ? '#2a3020' : '#262c1c'; x.fillRect(X + 1, Y + 1, ts - 2, ts - 2);
      x.strokeStyle = '#4a5a32'; x.lineWidth = 1; for (let k = 0; k < 3; k++){ x.beginPath(); x.moveTo(X + 10 + k * 14, Y + ts - 8); x.lineTo(X + 12 + k * 14, Y + ts - 22); x.stroke(); }
      const k = cc + ',' + rr;
      const nextIdx = onPath + 1, isNext = path[nextIdx] && path[nextIdx][0] === cc && path[nextIdx][1] === rr;
      if (safe[k] && (showT > 0 || (hintT > 0 && isNext))){ x.fillStyle = `rgba(200,220,140,${showT > 0 ? .55 : .4})`; x.fillRect(X + 4, Y + 4, ts - 8, ts - 8); }
    }
    lights.forEach(l => { const a = .4 + .4 * Math.sin(t * 2 + l[2]); const gx = l[0] * ts + ts / 2, gy = l[1] * ts + ts / 2; const gr = x.createRadialGradient(gx, gy, 0, gx, gy, 20); gr.addColorStop(0, `rgba(200,255,220,${a})`); gr.addColorStop(1, 'rgba(200,255,220,0)'); x.fillStyle = gr; x.fillRect(gx - 20, gy - 20, 40, 40); });
    x.fillStyle = '#3a3a28'; x.fillRect(0, R * ts, c.width, ts); x.fillStyle = '#c8b888'; x.font = 'italic 13px serif'; x.textAlign = 'center'; x.fillText('the edge of the marshes', c.width / 2, R * ts + ts / 2 + 4);
    x.fillStyle = '#e8c070'; x.beginPath(); x.arc(P[0] * ts + ts / 2, P[1] * ts + ts / 2, 14, 0, 7); x.fill(); x.fillStyle = '#2a1a0a'; x.font = 'bold 12px serif'; x.fillText('F', P[0] * ts + ts / 2, P[1] * ts + ts / 2 + 4);
    if (fallFlash > 0){ x.fillStyle = `rgba(160,200,180,${fallFlash * .4})`; x.fillRect(0, 0, c.width, c.height); }
    ui.hud.innerHTML = `<span>Falls <b>${falls}/3</b></span>`;
  });
  return {stop, key(e){ const d = KEYMAP[e.key]; if (!d) return; e.preventDefault(); const [dx, dy] = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}[d]; tryStep(P[0] + dx, P[1] + dy); }};

    $('#sobj').innerHTML = `Reach <b>${esc(S.goal)}</b>${M.ringT > 0 ? ' · <b style="color:#a57b00">wearing the Ring</b>' : ''}`;
    const left = Math.max(0, S.limit - M.t); $('#stime').textContent = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
    const b = $('#ssus'); b.style.width = Math.min(100, M.sus * 100) + '%'; b.style.background = M.sus > .6 ? '#c8553d' : '#c9a24a';
    if (rb) rb.textContent = M.ringT > 0 ? `💍 Take it off (${Math.ceil(M.ringT)})` : M.ringCD > 0 ? `💍 (${Math.ceil(M.ringCD)})` : '💍 Wear the Ring (R)';
  });
  return {stop(){ stop(); UI.ringHeld = false; document.body.classList.remove('wraith'); }, key(e){ if (e.key === 'r' || e.key === 'R') ringToggle(); }, held:true};
};

// ═══ TITLE, MENU, BOOT ══════════════════════════════════════════════════════
function renderTitle(){
  const sv = tryLoad();
  $('#stage').innerHTML = `<div class="titlescr">${VIGNETTES.ring()}
    <h1>The Ring-bearer</h1><div class="sub">being the journey of Frodo Baggins, from Bag End to the Fire</div>
    <div class="verse">A ring of gold, a road of grey,<br>A door that opens east;<br>The smallest folk go furthest, they say,<br>Who are reckoned of the least.</div>
    <div class="btns">${sv ? `<button class="btn gold" data-load>Continue — Chapter ${romanize(sv.chapter)}: ${esc(sv.chTitle || '')}</button>` : ''}<button class="btn" data-new>Begin a new journey</button></div>
    <p class="meta" style="margin-top:18px;max-width:560px;margin-left:auto;margin-right:auto">Nineteen chapters, ${Object.keys(SONGS).length} songs and verses, ${Object.keys(MAPS).length} maps, four stealth maps and a dozen trials. Watch your <b>Hope</b>, <b>Health</b> and <b>Burden</b> — every time you wear the Ring, it takes a little more of you. An unofficial fan work; all prose, songs and riddles are original.</p></div>`;
  wireStage();
  const nb = $('#stage').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Begin a new journey? Your saved game will be lost.')) startNew(); };
}
function openMenu(){
  openModal(`<div class="ptitle" style="font-size:1.2rem;text-align:center">Menu</div>
    <div class="choices" style="max-width:420px">
      ${G && G.checkpoint ? `<button class="choice" id="mcp">↺ Return to the start of this chapter (${esc(G.chTitle)})</button>` : ''}
      <button class="choice" id="mhelp">How to play</button>
      <button class="choice" id="msnd">${SND.on ? '♪ Sound effects: on' : '♪ Sound effects: off'}</button>
      <button class="choice" id="mnew">Begin a new journey</button>
      ${G ? '<button class="choice" id="mtitle">Back to the title page</button>' : ''}
    </div><p class="meta center">Your progress is saved automatically after every step.</p>`);
  const q = id => document.getElementById(id);
  if (q('mcp')) q('mcp').onclick = () => { if (confirm('Go back to the start of this chapter?')) restoreCheckpoint(); };
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.2rem">How to play</div><div class="text">${paras(`You are Frodo Baggins, and the Ring has come to you. Read, choose, and play your way from Bag End to Mount Doom.

<b>Hope</b> keeps you going. When it is low, the Ring's pull is stronger and every use costs more. <b>Health</b> is your body; at nothing, the journey ends and you can try the chapter again. <b>Burden</b> is the Ring's hold on you. Choices marked with a gold ring mean putting it on. It is often the easy way out. Too many of them and it will claim you — and at the very end, how heavy it has grown decides what you are able to do. <b>Provisions</b> are eaten as you travel; run out and you go hungry.

Friendships matter: the people you have been kind to will remember. So does the way you treat Sméagol.

Along the way are trials: stealth maps where you dodge Black Riders and orcs (use the arrow keys or click to walk, hide in haystacks, bushes and alcoves), riddles, songs, races and more. Every one can be skipped with <em>Let fate decide</em>.

The side panel holds your journey map, your companions, your pack, the songs you have learned (press <em>Sing it</em> to hear each one), every regional map you have reached, and a journal.`)}</div>`);
  q('msnd').onclick = () => { SND.on = !SND.on; openMenu(); updateSoundBtn(); };
  q('mnew').onclick = () => { if (!G || confirm('Begin a new journey? Your current progress will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; render(); };
}
function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound effects on' : 'Sound effects off'; }

$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    return;
  }
  // number keys pick choices
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#stage').querySelectorAll('.choices button'); const b = btns[+e.key - 1]; if (b) b.click();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; });
window.addEventListener('blur', () => { UI.keys = {}; });

updateSoundBtn();
G = null;
render();
</script>
</body>
</html>
