// ── Maze: crawling in the dark under the mountains ──────────────────────────
function carveMaze(cw, ch, r, loops){
  const W = cw * 2 + 1, H = ch * 2 + 1, g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill(1));
  const st = [[0, 0]], seen = {}; seen['0,0'] = 1; g[1][1] = 0;
  while (st.length){
    const [cx, cy] = st[st.length - 1];
    const nb = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < cw && ny < ch && !seen[nx + ',' + ny]);
    if (!nb.length){ st.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
    seen[nx + ',' + ny] = 1; g[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; g[ny * 2 + 1][nx * 2 + 1] = 0; st.push([nx, ny]);
  }
  for (let i = 0; i < loops; i++){ const x = 1 + Math.floor(r() * (W - 2)), y = 1 + Math.floor(r() * (H - 2)); if ((x + y) % 2 === 1) g[y][x] = 0; }
  return g;
}
function gridPath(g, sx, sy, tx, ty){
  const H = g.length, W = g[0].length, prev = new Int32Array(W * H).fill(-1), s = sy * W + sx, t = ty * W + tx, q = [s]; prev[s] = s;
  for (let h = 0; h < q.length; h++){ const cur = q[h]; if (cur === t) break; const cx = cur % W, cy = (cur / W) | 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H || g[ny][nx] === 1) continue; const n = ny * W + nx; if (prev[n] !== -1) continue; prev[n] = cur; q.push(n); } }
  if (tx < 0 || ty < 0 || tx >= W || ty >= H || prev[t] === -1) return null; const path = []; let cur = t; while (cur !== s){ path.push([cur % W, (cur / W) | 0]); cur = prev[cur]; } return path.reverse();
}
GAMES.maze = (cfg, wrap, done) => {
  const r = seeded(Date.now() & 0xffffff), cw = 13, ch = 8;
  const g = carveMaze(cw, ch, r, 14), H = g.length, W = g[0].length;
  const P = {x:1, y:1 + 2 * Math.floor(ch / 2)}, exit = [W - 2, H - 2], seen = {};
  const path = gridPath(g, P.x, P.y, exit[0], exit[1]) || []; const ring = path[Math.floor(path.length * .55)] || [exit[0] - 2, exit[1]];
  let moves = 0, over = false, gotRing = false; const limit = 210;
  const drips = {}; for (let i = 0; i < 12; i++){ drips[(1 + 2 * Math.floor(r() * cw)) + ',' + (1 + 2 * Math.floor(r() * ch))] = 1; }
  const ui = gameShell(wrap, 'Under the Mountains', '', 'Arrow keys / WASD, the pad, or tap a direction. You can see almost nothing. The tunnels slope down towards cold water. Puddles (≈) cost extra moves.');
  const ts = 30, {c, x} = mkCanvas(ui.body, W * ts, H * ts);
  ui.body.insertAdjacentHTML('beforeend', `<div class="dpad"><span></span><button data-d="up">▲</button><span></span><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>`);
  ui.body.querySelectorAll('[data-d]').forEach(b => b.onclick = () => step(b.dataset.d));
  c.addEventListener('pointerdown', e => { const [px, py] = canvasPos(c, e); const dx = px / ts - (P.x + .5), dy = py / ts - (P.y + .5);
    step(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); });
  const MSG = ['Far off, a goblin drum. Then nothing.','Water drips somewhere ahead.','The air is colder this way.','Your stomach rumbles, loudly.','You think of your kitchen, and of eggs and bacon.'];
  function step(d){
    if (over) return;
    const [dx, dy] = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}[d];
    const nx = P.x + dx, ny = P.y + dy;
    if (!g[ny] || g[ny][nx] !== 0) return;
    P.x = nx; P.y = ny; moves++; SND.fx('step');
    const k = nx + ',' + ny;
    if (drips[k]){ delete drips[k]; moves += 2; ui.msg.textContent = 'You put your hand in an icy puddle and sit down hard.'; }
    else if (!gotRing && nx === ring[0] && ny === ring[1]){ gotRing = true; ui.msg.textContent = 'Your hand closes on something small and cold on the floor. A ring. You put it in your pocket without thinking.'; }
    else if (moves % 10 === 0) ui.msg.textContent = pick(MSG);
    if (nx === exit[0] && ny === exit[1]){ over = true; draw(); return setTimeout(() => done({win:true, score:1 - moves / 300}), 400); }
    if (moves >= limit){ over = true; draw(); return setTimeout(() => done({win:false, score:.3}), 400); }
    draw();
  }
  function draw(){
    const rad = 1.8;
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++){ if (Math.hypot(xx - P.x, y - P.y) <= rad) seen[xx + ',' + y] = 1; }
    x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++){
      if (!seen[xx + ',' + y]) continue;
      const vis = Math.hypot(xx - P.x, y - P.y) <= rad, X = xx * ts, Y = y * ts; x.globalAlpha = vis ? 1 : .3;
      if (g[y][xx] === 1){ x.fillStyle = '#2a2420'; x.fillRect(X, Y, ts, ts); x.strokeStyle = '#4a3e36'; x.strokeRect(X + .5, Y + .5, ts - 1, ts - 1); }
      else { x.fillStyle = '#16120e'; x.fillRect(X, Y, ts, ts); if (drips[xx + ',' + y]){ x.strokeStyle = '#4a6a7a'; x.beginPath(); x.moveTo(X + 5, Y + 14); x.quadraticCurveTo(X + 15, Y + 8, X + 25, Y + 14); x.moveTo(X + 5, Y + 20); x.quadraticCurveTo(X + 15, Y + 14, X + 25, Y + 20); x.stroke(); } }
    }
    x.globalAlpha = 1;
    if (!gotRing && Math.hypot(ring[0] - P.x, ring[1] - P.y) <= 3.2){ x.strokeStyle = '#e8b830'; x.lineWidth = 2; x.beginPath(); x.ellipse(ring[0] * ts + ts / 2, ring[1] * ts + ts / 2, 5, 3, 0, 0, 7); x.stroke(); }
    if (seen[exit[0] + ',' + exit[1]]){ x.fillStyle = 'rgba(80,120,160,.6)'; x.fillRect(exit[0] * ts, exit[1] * ts, ts, ts); }
    x.fillStyle = '#e8c070'; x.beginPath(); x.arc(P.x * ts + ts / 2, P.y * ts + ts / 2, ts * .3, 0, 7); x.fill();
    x.fillStyle = '#2a1a0a'; x.font = 'bold 12px serif'; x.textAlign = 'center'; x.fillText('B', P.x * ts + ts / 2, P.y * ts + ts / 2 + 4);
    ui.hud.innerHTML = `<span>Moves <b>${moves}/${limit}</b></span>`;
  }
  draw();
  return {stop(){}, key(e){ const d = KEYMAP[e.key]; if (d){ e.preventDefault(); step(d); } }};
};

// ── Simple reused games: rhythm, qte, riddles ───────────────────────────────

  mel.lines.forEach((ln, li) => { ln.forEach(([m, d]) => { notes.push({t:tt, lane:m % 3, m, li, hit:null}); tt += d * beat; }); tt += beat * .5; });
  const end = tt + 1.2, HIT = 380, SPEED = 260, keys = {a:0, s:1, d:2, ArrowLeft:0, ArrowDown:1, ArrowRight:2, j:0, k:1, l:2};

    x.fillStyle = '#c9a227'; x.fillRect(0, HIT - 2, 600, 4);

    let cur = 0;
    notes.forEach(n => {
      if (n.t - t < 2.2 && n.t - t > -1) cur = Math.max(cur, n.li);

// ── QTE: quick reactions ────────────────────────────────────────────────────

  {q:'The more you take, the more you leave behind.', a:'Footsteps', o:['Breaths','Footsteps','Years','Bites of bread']},
  {q:'Feed me and I grow;\nGive me a drink and I die.', a:'Fire', o:['A baby','A tree','Fire','A fish']},
  {q:'I have cities with no houses,\nForests with no trees,\nRivers with no water,\nAnd mountains with no stone.', a:'A map', o:['A dream','A map','A song','A cloud']},

GAMES.riddle = (cfg, wrap, done) => {

  const qs = shuffle(RIDDLES.slice()).slice(0, 5); let i = 0, right = 0, left = 25, over = false, lock = false;
  const SAY_OK = ['Gollum! Clever hobbit, too clever!','Hiss! It guessed it, precious.','Yes, yes… lucky guess.','It knows, it knows! Nassty clever hobbit.'];
  const SAY_NO = ['No! No! Sméagol wins that one!','Wrong, wrong! Hee hee!','Not that, precious, not that at all!'];

    if (i >= qs.length){ over = true; return done({win:right >= 3, score:right / 5, msg:`You answered ${right} of 5.`}); }

GAMES.pinecones = (cfg, wrap, done) => {

    foes.forEach(f => { f.hit = Math.max(0, f.hit - dt);
      if (battle){ f.y -= f.sp * dt; if (f.y < 110){ f.dead = true; harm += 14; SND.fx('bad'); ui.msg.textContent = 'A goblin is over the top! The elves drive it back, but someone is hurt.'; } }
      else { const a = Math.atan2(cy - f.y, cx - f.x), d = Math.hypot(cx - f.x, cy - f.y); f.x += Math.cos(a) * f.sp * dt; f.y += Math.sin(a) * f.sp * dt * .7; if (d < 70){ f.dead = true; harm += 13; SND.fx('bad'); ui.msg.textContent = 'A warg leaps at the trunk — the tree shakes!'; } } });
    foes = foes.filter(f => !f.dead);

      x.fillStyle = '#6a6050'; x.beginPath(); x.moveTo(0, 440); x.lineTo(0, 200); x.lineTo(260, 100); x.lineTo(500, 100); x.lineTo(760, 200); x.lineTo(760, 440); x.fill();
      x.fillStyle = '#3a3a30'; for (let i = 0; i < 6; i++) x.fillRect(250 + i * 44, 80, 30, 26);
      if (t > DUR - 6) for (let i = 0; i < 6; i++){ const ex = ((t * 120 + i * 140) % 900) - 70, ey = 30 + (i % 3) * 14; x.strokeStyle = '#2a1a0a'; x.lineWidth = 4; x.beginPath(); x.moveTo(ex - 24, ey); x.quadraticCurveTo(ex - 12, ey - 12, ex, ey); x.quadraticCurveTo(ex + 12, ey - 12, ex + 24, ey); x.stroke(); }
    } else {

      const gr = x.createRadialGradient(cx, cy, 0, cx, cy, 300); gr.addColorStop(0, `rgba(255,140,40,${.15 + Math.min(.35, t / 80)})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, 760, 440);

      else if (S.hide === 'bush'){ s.fillStyle = '#6a8a3a'; s.beginPath(); s.arc(X + 8, Y + 14, 7, 0, 7); s.arc(X + 16, Y + 12, 8, 0, 7); s.fill(); }

      else { s.fillStyle = 'rgba(40,30,20,.55)'; for (let k = 0; k < 3; k++) s.fillRect(X + ts * (.2 + k * .25), Y + ts * .15, ts * .12, ts * .7); }
    }
  }
  // ink outlines between walkable and solid cells
  s.strokeStyle = T.ink; s.lineWidth = 2.2; s.lineCap = 'round'; s.beginPath();
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++){
    if (g[y][xx] !== 0) continue; const X = xx * ts, Y = y * ts;
    if (!g[y - 1] || g[y - 1][xx] !== 0){ s.moveTo(X, Y); s.lineTo(X + ts, Y); }
    if (!g[y + 1] || g[y + 1][xx] !== 0){ s.moveTo(X, Y + ts); s.lineTo(X + ts, Y + ts); }
    if (g[y][xx - 1] !== 0 && xx > 0){ s.moveTo(X, Y); s.lineTo(X, Y + ts); }
    if (g[y][xx + 1] !== 0 && xx < W - 1){ s.moveTo(X + ts, Y); s.lineTo(X + ts, Y + ts); }
  }
  s.stroke();
  s.fillStyle = T.ink; s.textAlign = 'center'; s.textBaseline = 'middle';
  S.labels.forEach(([t, lx, ly, a]) => { s.font = `italic ${ts * .78}px 'IM Fell English', Georgia, serif`; s.textAlign = a === 'r' ? 'right' : a === 'l' ? 'left' : 'center';
    s.fillStyle = 'rgba(255,248,225,.75)'; const w = s.measureText(t).width; s.fillRect((a === 'r' ? lx * ts - w : a === 'l' ? lx * ts : lx * ts - w / 2) - 3, ly * ts - ts * .45, w + 6, ts * .9);
    s.fillStyle = T.ink; s.fillText(t, lx * ts, ly * ts); });
  s.textAlign = 'right'; s.font = `italic ${ts * .7}px 'IM Fell English', Georgia, serif`;
  { const w = s.measureText(S.sig).width; s.fillStyle = 'rgba(245,235,205,.85)'; s.fillRect(st.width - ts * .6 - w - 6, st.height - ts * 1.25, w + 12, ts * .95); }
  s.fillStyle = 'rgba(74,44,18,.85)'; s.fillText(S.sig, st.width - ts * .6, st.height - ts * .75);
  s.textBaseline = 'alphabetic';
  const walkable = (xx, yy) => { const r = g[Math.floor(yy)]; return !!r && r[Math.floor(xx)] === 0; };
  const isHide = (xx, yy) => !!hides[Math.floor(xx) + ',' + Math.floor(yy)];
  function ringToggle(){
    if (!canRing || M.over) return;
    if (M.ringT > 0){ M.ringT = 0; UI.ringHeld = false; document.body.classList.remove('wraith'); return; }
    if (M.ringCD > 0){ ui.msg.textContent = 'Not yet — your hand is still shaking from the last time.'; return; }
    M.ringT = 6; M.ringCD = 10; UI.ringHeld = true;
    toast(ringUse(2));
    document.body.classList.add('wraith'); renderStats();
    ui.msg.textContent = foes.some(f => f.k === 'rider') ? 'The world goes grey and thin. The Riders\' heads turn as one, like hounds catching a scent.' : 'The world goes grey and thin. Nobody can see you now.';
  }
  const rb = $('#sring'); if (rb) rb.onclick = ringToggle;
  // hold-to-walk pad for touch screens
  ui.body.querySelectorAll('[data-h]').forEach(b => {
    const on = e => { e.preventDefault(); UI.keys[b.dataset.h] = true; b.classList.add('on'); M.path = []; };
    const off = () => { UI.keys[b.dataset.h] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  // on a phone the canvas is wider than its window; keep the walker in view
  const view = $('#scv');
  function follow(){
    if (view.scrollWidth <= view.clientWidth + 2 && view.scrollHeight <= view.clientHeight + 2) return;
    const sc = c.getBoundingClientRect().width / c.width;
    view.scrollLeft = clamp(M.px * ts * sc - view.clientWidth / 2, 0, view.scrollWidth - view.clientWidth);
    view.scrollTop = clamp(M.py * ts * sc - view.clientHeight / 2, 0, view.scrollHeight - view.clientHeight);
  }
  c.addEventListener('pointerdown', e => { if (M.over) return; const [px, py] = canvasPos(c, e); const p = gridPath(g, Math.floor(M.px), Math.floor(M.py), Math.floor(px / ts), Math.floor(py / ts)); if (p) M.path = p; });
  function end(win, by){
    M.over = true; UI.ringHeld = false; document.body.classList.remove('wraith');
    setTimeout(() => done({win, score: win ? 1 - M.sus : .3, msg: win ? '' : by === 'dawn' ? 'You took too long, and were seen in the growing light.' : `${by} has seen you!`}), 700);
  }
  const stop = ticker(dt => {
    if (M.over) return;
    M.t += dt; M.ringCD = Math.max(0, M.ringCD - dt);
    if (M.ringT > 0){ M.ringT -= dt; if (M.ringT <= 0){ UI.ringHeld = false; document.body.classList.remove('wraith'); ui.msg.textContent = 'You slip the Ring off, gasping.'; } }
    let vx = 0, vy = 0; const k = UI.keys;
    if (k.left) vx -= 1; if (k.right) vx += 1; if (k.up) vy -= 1; if (k.down) vy += 1;
    const sp = 4.0 * dt; let viaPath = false;
    if (vx || vy){ M.path = []; const l = Math.hypot(vx, vy); vx /= l; vy /= l; }
    else if (M.path.length){ const n = M.path[0], dx = n[0] + .5 - M.px, dy = n[1] + .5 - M.py, d = Math.hypot(dx, dy);
      if (d <= sp){ M.px = n[0] + .5; M.py = n[1] + .5; M.path.shift(); } else { vx = dx / d; vy = dy / d; viaPath = true; } }
    if (viaPath){ M.px += vx * sp; M.py += vy * sp; }
    else if (vx || vy){ const r = .28;
      if (vx){ const nx = M.px + vx * sp; if (walkable(nx + Math.sign(vx) * r, M.py - r + .02) && walkable(nx + Math.sign(vx) * r, M.py + r - .02)) M.px = nx; }
      if (vy){ const ny = M.py + vy * sp; if (walkable(M.px - r + .02, ny + Math.sign(vy) * r) && walkable(M.px + r - .02, ny + Math.sign(vy) * r)) M.py = ny; } }
    M.moving = !!(vx || vy);
    if (M.moving){ M.hd = Math.atan2(vy, vx); M.step += sp;
      const last = M.trail[M.trail.length - 1]; if (!last || Math.hypot(last.x - M.px, last.y - M.py) > .12) M.trail.push({x:M.px, y:M.py, hd:M.hd}); if (M.trail.length > 200) M.trail.shift(); }
    foes.forEach(e => {
      if (!e.path.length){ let tg; if (e.route){ e.wi = (e.wi + 1) % e.route.length; tg = e.route[e.wi]; } else tg = pick(open); e.path = gridPath(g, Math.floor(e.x), Math.floor(e.y), tg[0], tg[1]) || []; }
      if (e.path.length){ const n = e.path[0], cx = n[0] + .5, cy = n[1] + .5, dx = cx - e.x, dy = cy - e.y, d = Math.hypot(dx, dy), s2 = e.sp * dt;
        if (d <= s2){ e.x = cx; e.y = cy; e.path.shift(); } else { e.x += dx / d * s2; e.y += dy / d * s2; } if (d > .001) e.hd = Math.atan2(dy, dx); e.step += s2; }
    });
    const ringOn = M.ringT > 0, hidden = !M.moving && isHide(M.px, M.py);
    let best = 0, seen = null;
    foes.forEach(e => {
      const rider = e.k === 'rider', r = e.r * (ringOn ? (rider ? 1.8 : .28) : 1), d = Math.hypot(e.x - M.px, e.y - M.py);
      e.sees = false;
      if (r <= 0) return;
      const seeThroughHide = rider && d < 1.6;
      if ((!hidden || seeThroughHide) && d < r && losGrid(g, e.x, e.y, M.px, M.py)){ e.sees = true; const v = (.7 + 1.6 * (1 - d / r)) * (ringOn && rider ? 1.5 : 1); if (v > best){ best = v; seen = e; } }
    });
    if (seen){ M.sus += best * dt; M.seenBy = seen.n; if (seen.k === 'rider' && Math.random() < dt * .8) SND.fx('shriek'); }
    else M.sus = Math.max(0, M.sus - .3 * dt);
    if (M.sus >= 1) return end(false, M.seenBy);
    if (goal[Math.floor(M.px) + ',' + Math.floor(M.py)]) return end(true);
    if (M.t >= S.limit) return end(false, 'dawn');
    // draw
    x.drawImage(st, 0, 0);
    x.fillStyle = `rgba(60,140,60,${.18 + .12 * Math.sin(M.t * 4)})`; Object.keys(goal).forEach(kk => { const [gx, gy] = kk.split(',').map(Number); x.fillRect(gx * ts, gy * ts, ts, ts); });
    foes.forEach(e => {
      const rider = e.k === 'rider', r = e.r * (ringOn ? (rider ? 1.8 : .28) : 1);
      if (r > 0){ x.strokeStyle = e.sees ? 'rgba(200,40,20,.65)' : 'rgba(74,44,18,.25)'; x.setLineDash([3, 3]); x.beginPath(); x.arc(e.x * ts, e.y * ts, r * ts, 0, 7); x.stroke(); x.setLineDash([]); }
      drawFeet(x, e, ts, e.sees ? '#b0200f' : rider ? '#111' : '#5a2e14', e.n);
    });
    const party = (S.party || []);
    party.forEach((p, i) => { const tr = M.trail[M.trail.length - 1 - (i + 1) * 9]; if (tr) drawFeet(x, {x:tr.x, y:tr.y, hd:tr.hd, step:M.step + i}, ts * .8, '#3a5a2a', SHORT[p] || p, .7); });
    drawFeet(x, {x:M.px, y:M.py, hd:M.hd, step:M.step}, ts, ringOn ? 'rgba(14,58,122,.35)' : '#0e3a7a', who);
    if (hidden){ x.fillStyle = 'rgba(14,58,122,.8)'; x.font = `italic ${ts * .65}px serif`; x.fillText('(hidden)', M.px * ts, M.py * ts + ts * .95); }
    if (S.dark){
      const ov = document.createElement('canvas'); ov.width = c.width; ov.height = c.height; const o = ov.getContext('2d');
      o.fillStyle = 'rgba(8,6,4,.88)'; o.fillRect(0, 0, ov.width, ov.height); o.globalCompositeOperation = 'destination-out';
      const hole = (hx, hy, rr) => { const gr = o.createRadialGradient(hx, hy, 0, hx, hy, rr); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.6, 'rgba(0,0,0,.8)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); o.fillStyle = gr; o.beginPath(); o.arc(hx, hy, rr, 0, 7); o.fill(); };
      hole(M.px * ts, M.py * ts, S.dark * ts);
      foes.forEach(e => hole(e.x * ts, e.y * ts, 2.6 * ts));
      Object.keys(goal).forEach(kk => { const [gx, gy] = kk.split(',').map(Number); hole(gx * ts + ts / 2, gy * ts + ts / 2, ts * 1.4); });
      x.drawImage(ov, 0, 0);
      foes.forEach(e => { x.fillStyle = 'rgba(255,150,40,.85)'; x.beginPath(); x.arc(e.x * ts + 6, e.y * ts - 6, 3, 0, 7); x.fill(); });
    }
    follow();
    $('#sobj').innerHTML = `Reach <b>${esc(S.goal)}</b>${M.ringT > 0 ? ' · <b style="color:#a57b00">wearing the Ring</b>' : ''}`;
    const left = Math.max(0, S.limit - M.t); $('#stime').textContent = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
    const b = $('#ssus'); b.style.width = Math.min(100, M.sus * 100) + '%'; b.style.background = M.sus > .6 ? '#c8553d' : '#c9a24a';
    if (rb) rb.textContent = M.ringT > 0 ? `💍 Take it off (${Math.ceil(M.ringT)})` : M.ringCD > 0 ? `💍 (${Math.ceil(M.ringCD)})` : '💍 Slip on the ring (R)';
  });
  return {stop(){ stop(); UI.ringHeld = false; document.body.classList.remove('wraith'); }, key(e){ if (e.key === 'r' || e.key === 'R') ringToggle(); }, held:true};
};

// ═══ TITLE, MENU, BOOT ══════════════════════════════════════════════════════
function renderTitle(){
  const sv = tryLoad();
  $('#stage').innerHTML = `<div class="titlescr">${VIGNETTES.mountain()}
    <h1>The Burglar</h1><div class="sub">being the adventure of Bilbo Baggins, from Bag End to the Lonely Mountain, and home</div>
    <div class="verse">A door that's green, a road that's long,<br>A mountain with a dragon's song;<br>The smallest one, with nothing much,<br>Went furthest, and came back as such.</div>
    <div class="btns">${sv ? `<button class="btn gold" data-load>Continue — Chapter ${romanize(sv.chapter)}: ${esc(sv.chTitle || '')}</button>` : ''}<button class="btn" data-new>Begin a new adventure</button></div>
    <p class="meta" style="margin-top:18px;max-width:560px;margin-left:auto;margin-right:auto">Nineteen chapters, ${Object.keys(SONGS).length} songs and verses, ${Object.keys(MAPS).length} maps, three stealth maps and a dozen trials. Keep up your <b>Courage</b> and <b>Health</b>, mind your <b>Provisions</b> — and watch your <b>Greed</b>: the dragon-sickness is catching. An unofficial fan work.</p></div>`;
  wireStage();
  const nb = $('#stage').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Begin a new adventure? Your saved game will be lost.')) startNew(); };
}
function openMenu(){
  openModal(`<div class="ptitle" style="font-size:1.2rem;text-align:center">Menu</div>
    <div class="choices" style="max-width:420px">
      ${G && G.checkpoint ? `<button class="choice" id="mcp">↺ Return to the start of this chapter (${esc(G.chTitle)})</button>` : ''}
      <button class="choice" id="mhelp">How to play</button>
      <button class="choice" id="msnd">${SND.on ? '♪ Sound effects: on' : '♪ Sound effects: off'}</button>
      <button class="choice" id="mnew">Begin a new adventure</button>
      ${G ? '<button class="choice" id="mtitle">Back to the title page</button>' : ''}
    </div><p class="meta center">Your progress is saved automatically after every step.</p>`);
  const q = id => document.getElementById(id);
  if (q('mcp')) q('mcp').onclick = () => { if (confirm('Go back to the start of this chapter?')) restoreCheckpoint(); };
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.2rem">How to play</div><div class="text">${paras(`You are Bilbo Baggins, a respectable hobbit, and a wizard has just put a mark on your door. Read, choose, and play your way to the Lonely Mountain and back.

<b>Courage</b> is the Took in you; it grows every time you do something brave, and when it is low, hiding is tempting. <b>Health</b> is your body; at nothing, the tale ends and you can try the chapter again. <b>Provisions</b> are eaten on the road; run out and you go hungry. <b>Gold</b> is what is in your pocket.

<b>Greed</b> is the dragon-sickness. Treasure in your pocket feeds it, and so does the ring you will find under the mountains: choices marked with a gold ring mean slipping it on and vanishing, which is often the easy way out. At 100, the gold has you. And at the end, what you do with the Arkenstone — and how much you want it — decides how your story ends.

The dwarves remember how you treat them, Thorin most of all.

Along the way are trials: catching plates, picking a troll's pocket, reading moon-letters, riddles in the dark, stealth maps (arrow keys, or click to walk; hide in alcoves, barrels and bushes; R for the ring), barrels down the river, a dragon to talk to, and more. Every one can be skipped with <em>Let luck decide</em>.

The side panel holds your journey map, the Company, your pockets, the songs you have heard (press <em>Sing it</em> to hear each one), every map you have reached, and your diary.`)}</div>`);
  q('msnd').onclick = () => { SND.on = !SND.on; openMenu(); updateSoundBtn(); };
  q('mnew').onclick = () => { if (!G || confirm('Begin a new adventure? Your current progress will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; render(); };
}
function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound effects on' : 'Sound effects off'; }

$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    return;
  }
  // number keys pick choices
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#stage').querySelectorAll('.choices button'); const b = btns[+e.key - 1]; if (b) b.click();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; if (UI.game && UI.inst && UI.inst.keyup) UI.inst.keyup(e); });
window.addEventListener('blur', () => { UI.keys = {}; });

updateSoundBtn();
G = null;
render();
</script>
