// ── V. RIDDLES IN THE DARK ──────────────────────────────────────────────────
Object.assign(BEATS, {
dark:{chapter:5, chTitle:'Riddles in the Dark', loc:'tunnels', text:`When you open your eyes, you are not sure whether you have opened them, it is so dark. There is no one near you. No goblins, no dwarves, no wizard. Only the rock under your hands, and the cold, and the dripping of water somewhere far away.

You have no idea how long you lay there, nor which way the others went. You have your little sword, a pipe with no tobacco, and nothing at all to eat.

You begin to crawl.`,
  game:{type:'maze', map:'tunnels', label:'Crawl through the tunnels', win:'ringfound', lose:'ringfound',
    fxWin:{courage:4}, fxLose:{health:-10, courage:-4},
    winText:'You find, as you go, that the tunnel slopes always downwards. And somewhere along the way, without thinking about it at all, your hand closes on something small and cold on the floor — a ring of metal — and you put it in your pocket. It seems the natural thing to do.',
    loseText:'You crawl for hours, and go round in circles, and bump your head, and nearly weep. And somewhere along the way, without thinking about it at all, your hand closes on something small and cold on the floor — a ring of metal — and you put it in your pocket. It seems the natural thing to do.'}},
ringfound:{title:'The roots of the mountains', loc:'lake', art:'cave', text:`The tunnel ends at cold water. A lake, black and still, far under the mountain. You draw your little sword and it gives off a faint pale gleam, enough to see the edge of the water and no further.

Out on the lake, on a slimy island of rock, there lives a creature called Gollum. You do not know this yet. He is small and slimy and dark as the dark, with two big round pale eyes, and he has a little boat, and he paddles it with his large flat feet without a ripple. He has seen you. He has been watching you since you came down the passage, and wondering, in a whisper to himself, whether you would be tasty.

"Bless us and splash us, my precious!" says a voice out of the dark, quite close. "What is it?"`,
  fx:{item:'ring', meet:'gollum'},
  log:'Found a ring in the dark under the Misty Mountains.',
  choices:[
    {t:'Point your sword at the voice. "I am Mr. Bilbo Baggins. I have lost the dwarves and the wizard and I don\'t know where I am."', go:'gollum1', fx:{courage:5}},
    {t:'Back away from the water, sword out, saying nothing at all.', go:'gollum1', fx:{courage:-2}}
  ]},
gollum1:{title:'The underground lake', text:`"What's it got in its handses?" says Gollum, eyeing the sword. He does not like the look of it. He does not much want to fight, not with that. But he is very hungry.

"Praps ye sits here and chats with it a bitsy, my preciousss," he hisses to himself. "It likes riddles, praps it does, does it?"

He proposes a game. If he asks a riddle and you cannot answer, he eats you. If you ask one and he cannot answer, he shows you the way out.

You are in no position to argue.`,
  game:{type:'riddle', label:'Play the riddle-game', win:'pocket', lose:'pocket',
    fxWin:{courage:8}, fxLose:{courage:-4, health:-5},
    winText:'He is angry now, and hungry, and getting closer. It is your turn to ask, and your mind is perfectly empty of riddles.',
    loseText:'You have scraped through, barely — he gave you time on the last, out of greed for the game — and now it is your turn to ask, and your mind is perfectly empty of riddles.'}},
pocket:{title:'The last question', text:`Your hand goes into your pocket, the way a hand does when its owner is thinking, and there it meets the ring you picked up in the tunnel. You had forgotten it.

"What have I got in my pocket?" you say aloud, to yourself really.

"Not fair! Not fair!" hisses Gollum. "It isn't fair, my precious, to ask us what it's got in its nassty little pocketses!" But you insist, and he gives in, and guesses: "Handses!" — and you take your hand out just in time. "Knife!" — no. "String, or nothing!" — no, and no.

Gollum makes a sound like a kettle boiling over. Then he says he must go to his island to fetch something — a present — and paddles off in a hurry. And from the island comes a shriek that sets your hair on end: he has lost it. He has lost his precious, his birthday present. He has lost it, and you can guess, now, who has found it.`,
  choices:[{t:'Run.', go:'chase'}]},
chase:{title:'The passage', text:`Gollum comes back across the water like a nightmare, eyes blazing. "What has it got in its pocketses?" he shrieks. "It's got it! It's got it!"

You run. You trip, and as you fall, your hand closes on the ring in your pocket, and it slips onto your finger.

Gollum goes past you. Right past you, close enough that you smell him. He cannot see you. You are invisible.

He is going, you realise, to the back door — the way out — to wait there for the thief. If you follow him, quietly, he will lead you out.`,
  enter: G => { G.ringUses++; },
  choices:[{t:'Follow him, very quietly.', go:'pity', res:'You follow the slap of his feet and the hiss of his muttering up long passages that climb and climb, until there is a draught on your face, and a grey glimmer far ahead, and voices. Goblins. And between you and them, crouched in the narrow neck of the passage, is Gollum.'}]},
pity:{title:'The narrow passage', text:`The passage here is low and narrow, and Gollum fills it, sniffing and whispering. You could kill him. He is wretched and evil and he meant to eat you. You have your sword. He cannot see you. It would be easy.

But he is miserable, alone, in the dark, without hope of anything better, and something — a sudden understanding, a pity mixed with horror — wells up in your heart.`,
  choices:[
    {t:'Pity him. Gather yourself, and leap over his head.', go:'backgate', fx:{courage:10, aff:{gollum:10}, flag:'pity'}, res:`You leap — a great leap, for a hobbit, in the dark — clean over his head, and land running, and behind you Gollum shrieks: "Thief! Thief! Baggins! We hates it for ever!"`},
    {t:'Strike, and have done with it.', go:'backgate', fx:{courage:-6, greed:8, aff:{gollum:-20}, flag:'struckGollum'}, res:`You strike, clumsily, in the dark. Sting bites; Gollum screeches and flops away down a side-passage, bleeding and cursing. You feel no better for it at all. As you hurry on you can still hear him, far behind you: "Baggins! We hates it! We hates it for ever!"`}
  ]},
backgate:{title:'The back door', loc:'backdoor', text:`The back gate of Goblin-town is a narrow door in the mountainside, half open. Daylight — real daylight, the first you have seen in what feels like years — is coming through it. And the passage leading to it is full of goblins. They have heard that a thief is loose, and they are on guard.

You still have the ring on. The goblins cannot see you. But they can feel you, if you bump into them, and smell you, if you stand too long, and the door is very narrow.`,
  game:{type:'sneak', map:'backdoor', label:'Get past the goblins to the door', win:'outside', lose:'outside',
    fxWin:{courage:8}, fxLose:{health:-10, gold:-5},
    winText:'You squeeze through the gap in the door with a goblin\'s elbow brushing your ear, and run down the mountainside into the sun.',
    loseText:'A goblin feels something brush past and grabs; you wrench free and dive for the gap, and stick in it, and squeeze, and your brass buttons burst off in a shower and go tinkling down the steps. Then you are out, and running, and the goblins are shrieking behind you at nothing at all.'}},
outside:{title:'The eastern slopes', text:`You run down the mountainside until you can run no more, and you sit down on a stone and shake. You are out. You are on the far side of the Misty Mountains, alone, without a pony or a pack, and the sun is going down.

Then you hear voices in a dell below: dwarves' voices. They are arguing. Some of them, it seems, think they ought to go back into the mountain to look for their burglar. Others think he has been nothing but trouble from the start.

"If we have to go back into those tunnels to find him," says Dori, "then confound him, I say."

You still have the ring on.`,
  choices:[
    {t:'Walk into the middle of them, and take the ring off.', go:'slopes', ring:2, fx:{courage:8, aff:DWARVES(8), flag:'reappeared'}, res:`"Here I am," you say, stepping out of nowhere into the middle of the circle, and they jump as if a goblin had bitten them. Balin is so astonished that he forgets to be cross.\n\nAfter that, they look at you differently. You tell them about the goblins at the back door, and about leaping over a horrible creature in the dark, but you do not tell them about the ring. Gandalf, puffing his pipe, looks at you with an odd, sharp look.`},
    {t:'Take the ring off first, behind a tree, and call out.', go:'slopes', fx:{aff:DWARVES(4), courage:3}, res:`They are delighted to see you — even Dori — and want to know how you got past the guards. You say you crept, very carefully. Gandalf looks at you as though he knows that is not quite the whole story, but he says nothing.`}
  ]}
});

// ── VI. OUT OF THE FRYING-PAN INTO THE FIRE ─────────────────────────────────
Object.assign(BEATS, {
slopes:{chapter:6, chTitle:'Out of the Frying-Pan into the Fire', date:'Late June', map:'anduin', loc:'eyrie', w:'eyrie', travel:2, text:`You hurry down through the pine-woods as the light fails, with the goblins certain to come after you when night falls. Then you hear the howl. Then another. Wolves — no, wargs, the great evil wolves that live east of the mountains and are friends with goblins.

"Up the trees!" cries Gandalf. "Quick!"

You cannot get up a tree. You have never had to. Dori, at the last moment, hauls you up by the hands, and the wargs come pouring into the clearing below, snapping, a whole pack of them, and sit down in a ring to wait. Then the goblins come, and see where you are, and begin piling dry wood round the trunks.`,
  song:'firtrees',
  game:{type:'pinecones', mode:'wargs', label:'Throw burning pine-cones at the wargs', win:'eagles', lose:'eagles',
    fxWin:{courage:8, aff:{gandalf:5}}, fxLose:{health:-12},
    winText:'You throw until your arms ache, and the wargs yelp and scatter with their fur smoking, and a ring of fire stands round the trees — and then, out of the sky, comes a rush of wind and a cry, and great dark shapes are falling on the goblins.',
    loseText:'The fire catches your tree; your hands are burned and your eyes are full of smoke, and you can hear Gandalf, above you, preparing to do something desperate — and then, out of the sky, comes a rush of wind and a cry, and great dark shapes are falling on the goblins.'}},
eagles:{title:'The eyrie', loc:'eyrie', art:'eagles', text:`The eagles — the great eagles of the Misty Mountains, who are proud and strong and do not love goblins — have come to see what the noise is. They pluck the dwarves out of the burning trees one by one, and Gandalf too. You are the last, and you are nearly left behind, but at the last moment you grab Dori's legs as an eagle lifts him, and you are carried off into the night, swinging, with your arms almost pulled out of their sockets.

You land on a high rocky shelf, with the dawn coming. The Lord of the Eagles is an old friend of Gandalf's. His people bring you rabbits and hares and a sheep, and the dwarves cook them, and you eat and eat.

In the morning the eagles carry you east, far east, down into the valley of the Great River, and set you on a great rock standing in the water — the Carrock.`,

  log:'Carried off by eagles, after the wargs nearly had us.',
  choices:[
    talk('e1', 'Thank the eagle who carried you.', `It looks at you with one fierce golden eye, a long way down. "You held on well, little one," it says, "for a creature with no talons." From an eagle, you gather, this is high praise.`, {courage:4}),
    {t:'Climb down off the Carrock and follow Gandalf.', go:'carrock'}
  ]}

// ── VII. QUEER LODGINGS ─────────────────────────────────────────────────────
Object.assign(BEATS, {
carrock:{chapter:7, chTitle:'Queer Lodgings', date:'Early July', loc:'carrock', w:'carrock', text:`On the far side of the Carrock there are flowery meadows and oak-woods, and somewhere among them, Gandalf says, lives a person called Beorn.

"He is a skin-changer," says Gandalf, as you walk. "Sometimes a huge black bear, sometimes a great strong black-haired man with huge arms and a great beard. He is not fond of dwarves. He is not fond of anybody, much. He keeps cattle and horses and bees, and he does not eat them, and he does not hunt anything that he does not have to. If he is in a bad mood when we arrive, there is no knowing what he will do."

The plan, it appears, is that you and Gandalf will go in first, and the dwarves will follow two by two, at intervals, so that Beorn is never faced with a crowd all at once.

"He hates crowds," says Gandalf. "Fourteen of us at once would be a crowd. Two at a time is a story."`,
  choices:[{t:'Walk up to Beorn\'s gate with Gandalf.', go:'beorn'}]},
beorn:{title:'Beorn\'s yard', loc:'beorn', art:'beorn', text:`Beorn is enormous. He is sitting on a log in his yard, with an axe beside him, and horses standing about him like courtiers, and he looks at the two of you as if you were something the dog brought in.

Gandalf begins to tell the story of your journey — the trolls, the goblins, the wargs — and Beorn listens with his eyes narrowed. And every so often, at the exciting parts, Gandalf gives a little whistle, and two more dwarves come round the corner and bow.

It is up to you to time it. Too soon, and Beorn will lose his temper. Too late, and the story will bore him and he will throw you all out.`,
  game:{type:'beorn', label:'Bring the dwarves in, two by two', win:'beornhall', lose:'beornhall',
    fxWin:{aff:{beorn:15, gandalf:4}, food:10, item:'honey', courage:4}, fxLose:{aff:{beorn:4}, food:6},
    winText:'By the time Bombur waddles round the corner, last of all, Beorn is roaring with laughter. "A fine tale!" he says. "And a fine trick, too, old wizard, with your two-and-two. Come in, all of you. You shall have supper, and we will see if the tale is true."',
    loseText:'"Fourteen!" says Beorn, scowling, as Bombur waddles round the corner last of all. "I suppose you were going to tell me the rest of them got lost on the way? Well — come in. It is a good story, and I will hear the end of it. But I shall find out whether it is true."'}},
beornhall:{title:'Beorn\'s hall', text:`Supper is served by animals — white ponies and great long-bodied grey dogs and a ram and a white sheep — who bring the dishes on their backs. There is honey and cream and bread and mead, and nothing at all that has ever been alive. Then Beorn goes out into the night, and you hear, far off, the growling of bears.

In the morning, Beorn has been to see whether your tale is true. He found a dead warg and a goblin who confirmed it — not, you gather, entirely willingly. After that, he is your friend. He lends you ponies as far as the forest, and food enough for weeks, and advice.

"Stay on the path," he says. "Whatever you see, whatever you hear, don't leave the path. And don't drink the water in the forest, or bathe in it. There is a black stream that crosses the path, and it carries sleep and forgetfulness. Do not touch it."`,
  song:'beorn',
  fx:{food:4, health:20, meet:'beorn'},
  choices:[
    talk('bh1', 'Ask Beorn about the forest.', `"Mirkwood," says Beorn, "is dark and dangerous and full of things that are worse. There is a path through it, made long ago by the elves. Keep to it. Beyond the river the elves of the woods live, and they are not wicked, but they are not kind to strangers." He looks at the dwarves. "Especially not to those."`, {aff:{beorn:4}}),
    talk('bh2', 'Ask if you may borrow a bow.', `Beorn grunts, and fetches one: short, black, with a leather case of arrows. "Shoot nothing you mean to eat in that forest," he says. "Nothing in it is good to eat."`, {item:'bow'}),
    {t:'Ride on to the forest gate.', go:'gate', travel:1}
  ]},
gate:{title:'The forest gate', loc:'forestgate', w:'forestgate', text:`The forest gate is a sort of arch, made by two great trees that lean together, so old and strangled with ivy that they have hardly any leaves. The path runs in under them into darkness.

Here, Gandalf tells you, he must leave you. He has business of his own, away south. "Pressing business," he says. "I have already come further out of my way than I meant to." The dwarves groan. You feel cold all over.

"Don't leave the path," says Gandalf. "If you do, it is a thousand to one you will never find it again. Good-bye! Be good, take care of yourselves — and DON'T LEAVE THE PATH!"

And he gallops away west.`,
  choices:[
    {t:'Call after him: "We\'ll be all right. I\'ll see to it."', go:'mirkwood', fx:{courage:8, aff:{gandalf:6, thorin:3}}},
    {t:'Watch him go, feeling very small.', go:'mirkwood', fx:{courage:-3}}
  ]}
});

// ── VIII. FLIES AND SPIDERS ─────────────────────────────────────────────────
Object.assign(BEATS, {
mirkwood:{chapter:8, chTitle:'Flies and Spiders', date:'August', map:'mirkwood', loc:'forestgate', art:'mirkwood', travel:3, text:`You walk in single file down a path that is never wide, and never straight, and never anything but dim. The trees lean over it. Their trunks are grey and thick with ivy; their tops shut out the sky. Black squirrels scurry along the branches. At night, when you light a fire, thousands of eyes gather just beyond the circle of the light — and moths as big as your hand, and huge black bats.

Days go by. You lose count of them. You stop lighting fires, because of the eyes.

Then the path comes to a dark, swift stream — black, and not very wide, with an old boat moored on the far side. Everyone remembers Beorn's warning.`,
  choices:[
    {t:'Let Thorin and the others pull the boat across with a rope; be very careful.', go:'stream', fx:{aff:{thorin:2}}},
    {t:'Offer to throw the rope yourself — you have good aim.', go:'stream', fx:{courage:4, aff:{kili:4}}, res:`Your first throw falls short; your second catches the boat's prow with a satisfying clunk. Kíli thumps your back. "Our burglar can throw!"`}
  ]},
stream:{title:'The enchanted river', loc:'river', text:`Everyone gets across safely — except Bombur, who is last. Just as he steps off the boat, a great white hart leaps out of the trees on the far bank, scattering the dwarves; Thorin shoots at it; and Bombur, startled, slips, and falls into the black water.

You drag him out by his hood. He is fast asleep, with a smile on his face, and he will not wake. Now you have to carry him.

And then the deer come back — a doe and fawns, snowy white, bounding across the path in the gloom. The dwarves fire every arrow they have left.`,
  fx:{aff:{bombur:5}},
  choices:[
    {t:'Shout to them to save their arrows.', go:'climb', fx:{aff:{balin:3}, flag:'savedArrows', food:2}, res:`Balin hears you, and lowers his bow, and so does Dwalin. The rest shoot, and miss. Later, a little further on, Balin and Dwalin shoot a black squirrel apiece. They are almost uneatable. But not quite.`},
    {t:'Watch the deer go, white as ghosts. You wish you had not seen them.', go:'climb', fx:{courage:-2}}
  ]},
climb:{title:'The top of an oak', text:`Days later, starving, with Bombur still asleep, Thorin decides that someone must climb a tree and see how far the forest goes. The someone must be light. You are the someone.

You climb and climb, up through the dark into a sudden blaze of sunlight. The tree-tops are a sea, all around, rippling in a breeze you have not felt in weeks. Black butterflies — hundreds of them, deep purple and velvet — are dancing over the leaves. It is so beautiful you nearly forget why you came.

There is no edge to the forest that you can see. Leaves, in every direction, for ever.`,
  choices:[
    {t:'Climb down and tell them the truth.', go:'lights', fx:{courage:-4, aff:{thorin:2}}, res:'"Leaves, leaves, leaves," you tell them, "in every direction." Nobody says much. In fact, as you learn later, you were in a dip in the forest, and the edge was not far off at all. But you were not to know.'},
    {t:'Stay up a little longer, just to watch the butterflies.', go:'lights', fx:{courage:6, health:5}, res:'Ten minutes in the sun, with the wind in your hair and the butterflies all around you. When you climb down into the dark again, the dwarves are cross about the delay. You find that you do not much mind.'}
  ]},
lights:{title:'The feasting glades', loc:'glades', text:`That night Bombur wakes, and remembers nothing since the spring, and complains that he has been dreaming of feasts. Then the dwarves see lights through the trees — torches, and fires, and people sitting round them, eating and drinking and laughing. Elves, feasting in a glade.

Before anybody can stop them, the hungry dwarves leave the path and rush towards the light.

The moment they step into the circle, every light goes out. It is pitch black. And the path is lost.`,
  choices:[
    {t:'Rush in with them. You are just as hungry.', go:'lost', fx:{health:-5}},
    {t:'Hang back, and try to keep hold of the path.', go:'lost', fx:{courage:3, aff:DWARVES(-2)}, res:'You try. You keep one foot on the path, and call to them — but they are blundering about in the dark, calling to each other, and someone grabs you and pulls you along, and when the shouting stops, the path is nowhere.'}
  ]},
lost:{title:'Alone in the dark', loc:'spiders', text:`The dwarves try three times to reach the feasting elves, and three times the lights go out, and the third time you are separated. You sit against a tree in total darkness, calling their names, and nobody answers.

Then you fall asleep. And when you wake, something is winding a sticky, cold thread round your legs. A spider — a great spider, nearly as big as you are — with its many eyes gleaming in the dark.

You have your little sword.`,
  choices:[
    {t:'Fight.', go:'sting', fx:{courage:12, health:-6, flag:'namedSting'}, res:`You do not remember drawing it. You hack the threads from your legs, and stab, and stab again, and the spider shrieks and flails and lies still.\n\nAfterwards you sit in the dark and shake. You have killed the giant spider, all alone, without the help of the wizard or the dwarves or anyone else. You feel a different person: much fiercer and bolder, in spite of an empty stomach.\n\n"I shall call you Sting," you say to the sword, and wipe it on the grass.`},
    {t:'Slip on the ring.', ring:4, go:'sting', fx:{courage:4, health:-3, flag:'namedSting'}, res:`You vanish. The spider, very puzzled, pokes about where you were. You hack yourself free with the sword and creep away; it never finds you. But by the time it has given up and gone, you are shaking, and the sword in your hand feels like the only friend you have. "Sting," you whisper. "That's your name. Sting."`}
  ]},
sting:{title:'The spider-glade', text:`You go looking for the dwarves, very quietly, with the ring on. And you find them: hanging from the branches of the trees in a clearing, wrapped up in spider-silk like flies, twelve bundles in a row. The spiders are poking them, and arguing about whether they are dead yet, and whether they will be juicy, and when they ought to eat them.

There are dozens of spiders. There is one of you.`,
  game:{type:'spiders', label:'Draw off the spiders and cut the dwarves free', win:'freed', lose:'freed',
    fxWin:{courage:10, aff:DWARVES(8), health:-5}, fxLose:{courage:4, aff:DWARVES(4), health:-18},
    winText:'The last spider scuttles off into the dark, stung and furious. You cut the last bundle, and out falls Bombur, very cross. Every dwarf is free — and every one of them is looking at you as if you had grown a foot taller.',
    loseText:'You have stones, and a song, and a sword, and they are not quite enough; you are bitten twice, and once you are nearly wrapped up yourself. But in the end the spiders are driven off and every dwarf is cut free, and every one of them is looking at you as if you had grown a foot taller.'}},
freed:{title:'Out of the webs', text:`You sit in a ring in the dark, all of you, panting, and the dwarves want to know how you did it — how you vanished, and threw stones from nowhere, and sang from the treetops.

It is time, perhaps, to tell them about the ring.`,
  song:'taunt',
  choices:[
    {t:'Tell them the whole story — the riddles, the ring, the creature in the dark.', go:'captured', fx:{aff:DWARVES(8), flag:'toldRing'}, res:`They listen with their mouths open. Even Thorin. When you finish, Balin says, quietly, "Well, there's more about you than we guessed," and the others nod. You are no longer, you realise, the Company's luggage. You are the Company's burglar.`},
    {t:'Tell them you have a ring that makes you vanish — and nothing about where it came from.', go:'captured', fx:{aff:DWARVES(4), greed:4, flag:'toldRing'}},
    {t:'Say only that you crept up very carefully.', go:'captured', fx:{greed:6, aff:{thorin:-3}}, res:'They do not believe you. They are too tired to argue. But you see Thorin watching your hand in your pocket, and you take it out quickly.'}
  ]},
captured:{title:'The wood-elves', text:`And that is when the Wood-elves come. They have been hunting the spiders, and they find the dwarves instead, and take them — tired, starving, unarmed — and bind them, and lead them away through the forest to their king.

They do not take you. You have your ring on, out of habit, and they never know you are there.

Thorin, you notice, is not with them. He was taken separately, earlier, at the feasting glade.`,
  choices:[{t:'Follow, invisible, at the end of the line.', go:'halls', ring:2}]}
});

// ── IX. BARRELS OUT OF BOND ─────────────────────────────────────────────────
Object.assign(BEATS, {
halls:{chapter:9, chTitle:'Barrels out of Bond', date:'September', loc:'halls', w:'elvenking', text:`The Elvenking's halls are a great cave in a hill by the Forest River, with many smaller caves opening off it, and the gates close behind the prisoners with a boom. The King sits on a carved wooden chair, with a crown of berries and red leaves, for it is autumn.

He asks the dwarves why they were in his forest, and they will not tell him. So he has them shut in separate cells, each with food and drink, until they learn some manners. Thorin, it turns out, has been in a deeper cell for days.

And you are left wandering the halls, invisible, without food or bed, for days on end. You are a burglar who cannot burgle his way out. It is, you think, the most miserable and dangerous time of the whole journey.`,
  fx:{meet:'thranduil'},
  choices:[
    talk('h1', 'Steal food from the elves\' kitchens.', `It is not difficult, invisible; it is just exhausting, and you always feel like a thief, which of course you are.`, {food:6}),
    talk('h2', 'Find each of the dwarves in turn, and whisper through the keyholes.', `They are amazed and comforted to hear your voice — even Glóin. "We knew you'd come," says Kíli, which is not true, but it is kind.`, {aff:DWARVES(4), courage:3}),
    talk('h3', 'Find Thorin\'s cell, deep in the hill.', `It takes you days. When at last you whisper his name through the door, there is a long silence, and then Thorin's voice, rough: "Burglar? Is it you?" You tell him the others are safe. He tells you to tell them to say nothing to the King. And then he says, "Thank you," which you have never heard him say to anyone.`, {aff:{thorin:10}}),
    {t:'Keep your eyes open for a way out.', go:'barrelplan'}
  ]},
barrelplan:{title:'The cellars', text:`There is no way out except the great gates, which are shut — and the river. Under the halls the Forest River runs through a tunnel, and there is a water-gate, and the elves use it to send empty wine-barrels floating down to Lake-town, where they are filled again and sent back.

Empty barrels. Floating. Out of the gate.

That night there is a great feast in the halls, and the chief of the guards and the King's butler sit down together in the cellar to try the new wine. It is very strong wine. Soon they are both asleep, with their heads on the table — and the butler's keys are on his belt.`,
  song:'feast',
  game:{type:'sneak', map:'halls', label:'Steal the keys and reach the cells', win:'barrelpack', lose:'barrelpack',
    fxWin:{courage:8, item:'keys'}, fxLose:{item:'keys', health:-6, courage:-2},
    winText:'You have the keys, and you have visited every cell, and every dwarf is creeping down the cellar stairs behind you, in stockinged feet.',
    loseText:'An elf feels a draught where there should be none and draws his knife, and you have to flatten yourself against the wall while he sniffs around. But you get the keys, and every cell, and the dwarves come creeping down the cellar stairs in their stockinged feet.'}},
barrelpack:{title:'The water-gate', text:`The dwarves do not like your plan. They like it even less when they see the barrels. But there is no time to argue, and one by one they climb in, grumbling, with straw stuffed round them, and you fit the lids on. Bombur is the worst; it takes all your strength.

Then the elves come down to roll the barrels out — and you realise, too late, that there is no one to fit a lid on you.

The trapdoor opens. The barrels go thundering down into the dark water. You grab the last one.`,
  game:{type:'dodger', mode:'barrels', label:'Ride the barrels down the Forest River', win:'raftelves', lose:'raftelves',
    fxWin:{courage:8}, fxLose:{health:-14},
    winText:'You ride the river for hours, clinging to the last barrel, and fend the others off the rocks, and when the barrels drift together in a bay at the forest\'s edge, they are all still there.',
    loseText:'You are dunked, and knocked about, and once you lose your barrel and have to swim for the next one. You are wet to the bone and colder than you have ever been. But when the barrels drift together in a bay at the forest\'s edge, they are all still there.'}},
raftelves:{title:'The elves\' landing', loc:'watergate', art:'barrels', text:`The raft-elves rope the barrels together and pole them down the river, and you ride on top in the dark, sneezing. At the landing-stage they leave them to float while they go up to their hut for supper.

You steal some of their supper. You steal a dry cloak. You do not feel at all guilty.

The next day the barrel-raft goes down the river to the Long Lake. The trees thin. The sky opens. And ahead, far off, rising out of the plain all by itself, you see a single mountain, with a cloud on its head.`,
  song:'barrels',
  fx:{food:4},
  log:'Escaped the Elvenking\'s halls in empty barrels.',
  choices:[{t:'On to Lake-town.', go:'landing'}]}
});

// ── X. A WARM WELCOME ───────────────────────────────────────────────────────
Object.assign(BEATS, {
landing:{chapter:10, chTitle:'A Warm Welcome', date:'Late September', map:'lake', loc:'raftelf', w:'laketown', text:`At the raft-elves' landing, at night, you knock off the barrel-lids and pull out the dwarves. They are bruised and battered and soaked and furious — except Bombur, who is asleep. Thorin comes out last, with straw in his beard, looking like an angry bundle of rags.

Then he draws himself up, and marches up the long bridge into Lake-town — a whole town built on stilts out on the water — and into the hall where the Master is feasting, and announces himself: Thorin, son of Thráin, son of Thrór, King under the Mountain, returned.

The hall goes silent. Then somebody laughs. Then somebody else begins to sing an old song, about the King coming back to the Mountain, and the gold flowing down the river — and the whole town takes it up.`,
  fx:{meet:['master','bard']},
  song:'return',
  choices:[{t:'Go with them into the hall.', go:'feast10'}]},
feast10:{title:'The Master\'s hall', loc:'laketown', art:'laketown', text:`The Master is not at all sure that a King under the Mountain is a good thing to have about, but he is very sure that his people want one, so he gives a feast.

There is music and dancing, and fish, and more fish. And the townsfolk want a song from the King's companion — from the burglar, they've heard; the little one who got them all out of the Elvenking's cellars.`,
  game:{type:'rhythm', song:'return', label:'Lead the song at the feast', win:'bard10', lose:'bard10',
    fxWin:{courage:6, aff:{master:6, thorin:4}}, fxLose:{courage:2},
    winText:'They carry you round the hall on their shoulders. The Master, smiling very hard, calls you "our honoured guest", and keeps glancing at Thorin.',
    loseText:'You forget the second verse and sing the first one twice. Nobody minds. They are all too happy, and much of the hall has never heard the second verse either.'}},
bard10:{title:'The bridge', text:`Two weeks go by in feasts and speeches. You catch a terrible cold, and spend three days sneezing in bed. Thorin grows prouder by the hour. He makes plans; the Master gives him boats and supplies, very happy to see him go.

On the last night, you go out on the long bridge to breathe, and find a grim man there, leaning on the rail and looking north at the Mountain. He is tall, with black hair, and a great black bow on his back.

"So that's the burglar," he says. "Bard, they call me. You'll wake the dragon, you know. And when he wakes, it won't be the Mountain he burns."`,
  choices:[
    talk('b10a', '"What would you have us do?"', `Bard is silent a long time. "Nothing that would help," he says at last. "You'll go; you were always going to go. But if the dragon comes this way, I'll be on this bridge. Remember that, burglar." It sounds like a threat. It is, you realise much later, a promise.`, {aff:{bard:8}}),
    talk('b10b', 'Promise him that the town will have its fair share, if any gold comes out of the Mountain.', `Bard looks at you hard. "Your king didn't say that." "No," you say. "I did." He nods slowly. "Then I'll hold you to it, little burglar."`, {aff:{bard:10}, courage:4, flag:'promisedBard'}),
    {t:'Go back in, and to the boats in the morning.', go:'doorstep', fx:{food:12, health:20}}
  ]}
});

// ── XI. ON THE DOORSTEP ─────────────────────────────────────────────────────
Object.assign(BEATS, {
doorstep:{chapter:11, chTitle:'On the Doorstep', date:'October', loc:'sidedoor', w:'mountain', art:'mountain', travel:2, text:`Two days' rowing up the Long Lake, then ponies, then the desolation: a country burned and bare, with no grass and no trees, only the stumps of trees, and the ruins of Dale lying grey in the valley. Smoke comes out of the Front Gate of the Mountain. The great river runs out of it, steaming.

Following the map, you find a high, hidden bay on the western side of the Mountain, with a flat floor and a sheer wall at the back. There is a grey stone in the middle of the floor. The wall is completely smooth. There is no door.

Days pass. The dwarves try picks and mattocks; the rock rings like glass. They get gloomy, and then quarrelsome, and then they start to look at you, the way people look at a burglar who has not burgled anything lately.`,
  choices:[
    {t:'Sit by the grey stone, every evening, and watch the west.', go:'durinsday', fx:{courage:4, flag:'watched'}},
    {t:'Go with Balin to look at the Front Gate from the ridge.', go:'durinsday', fx:{aff:{balin:5}, health:-4}, res:'You creep to the edge of the ridge and look down on the Front Gate: a great black arch, with steam coming out of it, and the river, and the ruins of the old guard-post on the hill called Ravenhill. It is very quiet. Too quiet. You hurry back.'}
  ]},
durinsday:{title:'The grey stone', text:`One evening, sitting by the grey stone with the sun going down huge and red over the forest far away, you hear a sharp crack behind you. On the stone, a thrush — a large, coal-black thrush with a pale yellow breast — has caught a snail and is knocking it on the stone. Crack. Crack.

The thrush. The grey stone. The setting sun. And the moon is in the sky together with it: a thin new moon, low in the west. It is the last new moon of autumn. It is Durin's Day.

You shout for the dwarves.`,
  game:{type:'keyhole', label:'Watch for the keyhole in the last light', win:'opened', lose:'opened',
    fxWin:{courage:10, aff:{thorin:8, balin:4}}, fxLose:{aff:{thorin:3}},
    winText:'"There!" you cry, and point, and Thorin is there with the key before the light has gone. It turns. There is a click. And a door five feet high, where no door was, swings slowly outward into the dark.',
    loseText:'It is Thorin who sees it, at the very last moment, with the light already going off the rock: a small hole, high up. The key turns. There is a click. And a door five feet high, where no door was, swings slowly outward into the dark.'}},
opened:{title:'The hidden door', text:`A smell comes out of the opening: old, dry, hot. A smell of dragon.

The dwarves look at the door. Then they look at you. Thorin makes a speech — a long one, a royal one — about how the time has come for the burglar to earn his reward, and how they have been very patient, and how it is in the contract.

It is, as a matter of fact, in the contract.`,
  log:'Found the hidden door on Durin\'s Day.',
  choices:[
    {t:'"All right. I\'ll go. But somebody had better come with me as far as they dare."', go:'tunnel', fx:{courage:8, aff:{balin:6}}, res:'Nobody quite volunteers. Then Balin says gruffly that he will go a little way, and he does — three steps inside the door, which is three more than the others. "Good luck," he says. "I mean it."'},
    {t:'Go alone, without a word.', go:'tunnel', fx:{courage:12, aff:{thorin:4}}}
  ]}
});

// ── XII. INSIDE INFORMATION ─────────────────────────────────────────────────
Object.assign(BEATS, {
tunnel:{chapter:12, chTitle:'Inside Information', map:'erebor', loc:'tunnel', w:'mountain', text:`The tunnel goes down, straight and smooth, for a long way. It is warm, and gets warmer. There is a faint red glow at the end of it. And there is a noise: a deep, rumbling, bubbling noise, like a pot boiling on a fire, only the pot is the size of a hill.

It is the snoring of a dragon.

You stop. Your knees will not go on. Your heart will not go on. Everything sensible in you is saying, quite reasonably, that this is enough; that you have come further than any Baggins has ever come; that you could go back now, and tell them the tunnel was blocked, and nobody would ever know.`,
  choices:[
    {t:'Go on. You will know.', go:'hoardsee', fx:{courage:15, flag:'wentOn'}, res:'You go on. It is, you think for the rest of your life, the hardest thing you ever made yourself do: not the dragon itself, which was terrible, but those twenty steps down an empty tunnel towards it, with nothing to make you take them except yourself.'},
    {t:'Slip the ring on first. Then go on.', go:'hoardsee', ring:3, fx:{courage:8}}
  ]},
hoardsee:{title:'Smaug\'s lair', loc:'hoard', art:'smaug', text:`And there he lies. Smaug: a vast red-golden dragon, fast asleep on a hill of treasure. His wings are folded like an immense bat's; his tail is coiled round him. Under him, and all around him, out of sight into the dark, lies gold — gold worked and unworked, gems and jewels, and silver red-stained in the light of the dragon's breathing. Smoke curls from his nostrils. One great eye is not quite shut.

You have heard tales of dragon-hoards. The tales were wrong. Nothing could have made you ready for this.

The dragon-sickness, that wants gold for the sake of gold, takes hold of you for a moment like a hand.`,
  choices:[
    {t:'Take a cup — one great two-handled cup — and creep away. Proof that you were here.', go:'smaugwakes', fx:{item:'cup', greed:5, aff:DWARVES(5)}},
    {t:'Take the cup, and fill your pockets with gems while you\'re at it.', go:'smaugwakes', fx:{item:'cup', greed:14, gold:60, aff:DWARVES(5)}, cls:'gold'},
    {t:'Take nothing. Just look, and go back and tell them.', go:'smaugwakes', fx:{courage:5, aff:{thorin:-5}}, res:'You creep back up the tunnel with empty hands. The dwarves are disappointed; Thorin more than disappointed. "Our burglar went into the dragon\'s lair and came back with — a description?"'}
  ]},
smaugwakes:{title:'The hidden door', text:`It is the cup that does it. A dragon knows his hoard to the last ring, and when Smaug wakes, he knows at once that a cup is missing.

The Mountain shakes. He comes out of the Front Gate like a fire coming out of a furnace, and flies round and round the Mountain, roaring, and burning the slopes; and he finds the ponies the dwarves left below, and eats them, and nearly finds the hidden bay. You all cram into the tunnel and shut the door — nearly — and listen to him blasting the rock outside.

When he goes back in at last, someone must find out more. How to kill him. Where he is weak. Whether he can be killed at all.

Nobody looks at anybody but you.`,
  choices:[{t:'Put the ring on, and go down again.', go:'talk12', ring:3}]},
talk12:{title:'The dragon\'s hall', text:`This time he is pretending to sleep. You know it the moment you come to the end of the tunnel: a thin red ray of light is coming out from under one eyelid.

"Well, thief!" says the dragon. "I smell you, and I feel your air. I hear your breath. Come along! Help yourself again, there is plenty and to spare!"

You do not come along. You stay where you are, invisible, and you decide that this dragon would like, above all things, to be talked to. Dragons are vain. And clever people who are talking are not eating.`,
  game:{type:'smaug', label:'Talk to the dragon', win:'thrush12', lose:'thrush12',
    fxWin:{courage:12, flag:'patch'}, fxLose:{health:-22, courage:-4, flag:'patch'},
    winText:'He turns over at last, to show off his famous waistcoat of jewels, and in the gleam of it you see, on the left breast, a bare patch, as clean as a snail out of its shell. You make your escape with a final compliment, and his laughter follows you up the tunnel like the roar of a furnace.',
    loseText:'At the end he lets fly. Your heels are scorched and your cloak is singed and you come out of the tunnel at a run, smoking — but not before he rolled over to show off his famous waistcoat, and you saw, on the left breast, a bare patch, as clean as a snail out of its shell.'}},
thrush12:{title:'On the doorstep', text:`You tell the dwarves everything: the talk, the riddling, the bare patch. You are rather proud of it. Dwarves enjoy hearing about dragons the way some people enjoy hearing about ghosts, and they listen with their mouths open.

And on the stone, as you talk, the old thrush sits with his head cocked on one side, listening too.

"I don't like that bird," you say. "It's listening."`,
  choices:[
    {t:'Let it listen. Who cares about a thrush?', go:'shut12', fx:{flag:'thrushHeard'}},
    {t:'Shoo it away.', go:'shut12', res:'You flap your hands at it; it flies a little way off, and settles on a rock, and goes on watching.', fx:{flag:'thrushHeard'}},
  ]},
shut12:{title:'The tunnel', text:`"The dragon will be out tonight," you say suddenly. "He knows where we are. He will come here."

You all rush into the tunnel, and shut the door — fully, this time — just as Smaug comes down on the hidden bay with fire and fury, and smashes the cliff, and the door and the hidden bay and the path below are all buried in rock.

You are inside the Mountain with no way out but through the dragon.

Then everything goes quiet. Smaug has gone, roaring, away south. And everyone knows where.`,
  log:'Spoke with Smaug, and saw the bare patch on his breast.',
  choices:[{t:'Wait in the dark.', go:'empty13'}]}
});

// ── XIII. NOT AT HOME ───────────────────────────────────────────────────────
Object.assign(BEATS, {
empty13:{chapter:13, chTitle:'Not at Home', date:'Late October', map:'erebor', loc:'hoard', text:`Days pass in the dark, in silence. No dragon. No roar. Nothing.

At last you say what everyone is thinking: someone must go and look. And since you have the ring, it had better be you. But this time, to your surprise, the dwarves come too — a little behind, but they come.

The hall is empty. The dragon is not at home. In the light of a torch, the treasure lies glittering all around, and the dwarves stand at the edge of it, and something comes into their faces that you have not seen there before: a hunger, an old, deep, dwarvish hunger. One by one they wade in. They pick up cups and swords and helms. They put on mail. They begin, very softly, to sing.`,
  choices:[
    {t:'Stay close to Thorin as he searches.', go:'mithril13'},
    {t:'Wander off by yourself into the hoard.', go:'arken13', fx:{greed:4}}
  ]},
mithril13:{title:'The hoard', text:`Thorin is searching for something. He does not say what. But he stops long enough to lift, out of a heap of gold, a small shirt of rings — silver-white, light as linen, with a belt of pearls and crystals — and hold it up to you.

"For our burglar," he says, "who went first into the dark. Put it on, Master Baggins. It is mithril, and it was made for an elf-prince's son, long ago. It will turn the edge of any blade I know."

You put it on. You feel rather magnificent, and also rather foolish, as though you were dressing up as a soldier.`,
  fx:{item:'mithril', aff:{thorin:10}},
  choices:[{t:'Thank him, and go on searching.', go:'arken13'}]},
arken13:{title:'The hoard', art:'arkenstone', text:`You are climbing a great heap of treasure, and the torch is flickering, when you see a white gleam ahead. It grows as you get nearer, as if the light were in it, not on it. It is a great white jewel, as big as your fist, shining with a light of its own and catching your torch-flame and throwing it back a hundred times over.

It is the Arkenstone. The Heart of the Mountain. You know it from Thorin's descriptions, told over a hundred camp-fires. It is the one thing in all this treasure he wants most.

You pick it up. It is heavy, and cool, and very beautiful. Your hand goes to your pocket.`,
  choices:[
    {t:'Slip it into your pocket. You will decide later what to do with it.', go:'gate13', fx:{item:'arkenstone', greed:8, flag:'hidStone'}, cls:'gold', res:'It goes in, and makes your pocket bulge. "I chose a fourteenth share," you tell yourself. "Well, I choose this." You do not quite believe it, even as you say it. But you do not take it out again.'},
    {t:'Call Thorin. "I\'ve found it! Thorin! Over here!"', go:'gate13', fx:{aff:{thorin:15}, courage:4, flag:'gaveThorin'}, res:`Thorin is beside you in a moment, and he takes the Arkenstone from your hands as gently as if it were a bird. For a long time he does not speak. Then he looks at you, and his eyes are wet. "You could have kept it," he says hoarsely. "No one would have known." "I'd have known," you say.\n\nHe hangs it round his neck on a chain of gold, and after that, you notice, he does not take it off. And something comes into his face, slowly, over the following days, that frightens you a little.`}
  ]},
gate13:{title:'The Front Gate', loc:'frontgate', text:`After that, the dwarves go up through the halls of their fathers, through ruin and silence, to the Front Gate, and out into the light; and then up to the old guard-post on Ravenhill, where you can watch both the Gate and the long valley south.

It is cold and bright up there. The smoke over the Mountain is gone. And in the far south, over the Long Lake, there is a glow in the night sky, red and wavering, like a fire.`,
  log:'The dragon was gone from the Mountain. The Company took back the halls of Thrór.',
  choices:[{t:'Watch the fire in the south.', go:'fire14'}]}
});

// ── XIV. FIRE AND WATER ─────────────────────────────────────────────────────
Object.assign(BEATS, {
fire14:{chapter:14, chTitle:'Fire and Water', map:'lake', loc:'laketown', art:'laketown', text: G => `<em>You were not there. This is what you heard afterwards, by many fires, from many people.</em>

The people of Lake-town saw the light in the north and thought, for a moment, that the King under the Mountain was making gold in his forges, as the songs said. Then the light came closer, and they knew it for what it was.

They cut the bridge, and filled every pot and bucket in the town with water, and the archers took their places. Smaug came down out of the night like a falling star, and the arrows broke on him like twigs, and the town began to burn.

On the end of the last jetty stood Bard, with one arrow left: a black arrow that had come down to him from his fathers. And on his shoulder, so the story goes, landed an old thrush, who spoke in his ear — ${G.flags.thrushHeard ? 'and told him of a bare patch on the dragon\'s left breast, which a hobbit had seen and spoken of on a doorstep far away' : 'and told him where to aim'}.

Bard drew the bow. The arrow flew. Smaug gave a scream that deafened men and split stones and toppled trees, and came crashing down on the town, and the lake rose up over him in a cloud of steam, and the fire went out.`,
  choices:[{t:'And then?', go:'after14'}]},
after14:{title:'The ruins of Lake-town', text:`Lake-town was gone, and the Master had run away with the town's gold in a boat. Bard took command. The people wanted him for king.

They camped on the shore, cold and homeless. And the Elvenking, hearing that the dragon was dead, came down out of the forest with an army — and turned aside, being in truth not unkind, to help the people of the lake with food and shelter.

Then they began to think about the dragon's hoard, which had no guardian now but thirteen dwarves and a hobbit — and about how much of it, by rights, was owed to the town that the dragon had burned. And the two armies, elves and men, turned north towards the Mountain.`,
  choices:[{t:'Back to the Mountain.', go:'roac15'}]}
});

// ── XV. THE GATHERING OF THE CLOUDS ─────────────────────────────────────────
Object.assign(BEATS, {
roac15:{chapter:15, chTitle:'The Gathering of the Clouds', date:'November', map:'erebor', loc:'frontgate', text:`An old raven comes to Ravenhill, so old his feathers are grey and he can hardly fly. He is Roäc, son of Carc, and he speaks the common tongue, and he brings news. Smaug is dead. Lake-town is burned. And an army of men and an army of elves are marching on the Mountain.

"The treasure is yours," says Roäc to Thorin, "but you will not keep it long, unless you buy friends with some of it. Bard the bowman slew the worm. Make peace with him."

Thorin is not in a mood for peace. He sends Roäc to summon his cousin Dáin from the Iron Hills, with five hundred dwarves. Then he sets the Company to walling up the Front Gate.`,
  fx:{meet:'roac'},
  song:'stand',
  choices:[
    {t:'Speak up: "Roäc is right. They have a claim. Give them something."', go:'parley15', fx:{aff:{thorin:-8}, courage:6, flag:'counsel'}, res:`Thorin turns on you, and for a moment his face is a stranger's. "You are a hireling, Master Baggins," he says, "and your hire is a fourteenth part. Do not presume to share out the rest."\n\nBalin, later, finds you sitting alone, and puts a hand on your shoulder, and says nothing at all. That says a good deal.`},
    {t:'Say nothing. It\'s their gold. It\'s their quarrel.', go:'parley15', fx:{greed:3}},
    {t:'Side with Thorin. The dragon\'s hoard was never the lake-men\'s.', go:'parley15', fx:{greed:6, aff:{thorin:5}}}
  ]},
parley15:{title:'The wall', text:`The armies come. Bard comes to the wall and asks, courteously, for a twelfth part of the treasure: for the town that was burned, for the slayer of the dragon, and in memory of the friendship there once was between Dale and the Mountain.

Thorin answers from the wall with an arrow, which sticks quivering in Bard's shield.

So the Mountain is besieged. You are inside it, with thirteen dwarves who have gone a little strange, a hoard that whispers, and food enough for a long time but not for ever. Beyond the wall the campfires of the besiegers twinkle in the valley, and you can hear, at night, the elves singing.`,
  choices:[{t:'Take your turn on watch.', go:'night16'}]}
});

// ── XVI. A THIEF IN THE NIGHT ───────────────────────────────────────────────
Object.assign(BEATS, {
night16:{chapter:16, chTitle:'A Thief in the Night', text: G => `It is cold on the wall. Bombur is supposed to be on watch with you, and Bombur is asleep.

${has('arkenstone') ? 'The Arkenstone sits in your pocket like a coal. It has sat there for days. Thorin asks every day whether anyone has seen it, and every day you say nothing, and every day his face grows harder. You realise you have been thinking about it every minute since you picked it up.' : 'Thorin wears the Arkenstone round his neck now, and stares into it for hours. He has stopped laughing. He has stopped singing. He has started counting.'}

Below, in the valley, the fires of Bard's camp burn steadily. Dáin, the raven says, is only two days away. When he comes, there will be a battle — dwarves against men and elves — over gold. And you cannot see how it will end except badly for everyone.`,
  enter: G => { if (G.aff.thorin >= 45) G.flags.thorinFriend = true; },
  choices:[
    {t:'Climb down the wall with the Arkenstone, and take it to Bard.', go:'camp16', if: G => has('arkenstone'), cls:'gold'},
    {t:'Keep the Arkenstone. It\'s yours. You found it.', go:'keep16', if: G => has('arkenstone'), cls:'gold'},
    {t:'Climb down the wall and go to Bard anyway, to plead for peace.', go:'camp16', if: G => !has('arkenstone')},
    {t:'Stay at your post. It isn\'t your quarrel.', go:'morning17', if: G => !has('arkenstone'), fx:{courage:-4}}
  ]},
camp16:{title:'Down the wall', text:`You tie a rope to a stone and let yourself down, with the ring on, and go stumbling across the stony valley to the camp. The river is cold to wade. There are sentries everywhere, elves and men, and elves have sharp ears.

You will need to get through the lines to the tent where Bard sits with the Elvenking.`,
  game:{type:'sneak', map:'camp', label:'Steal through the besiegers\' camp', win: G => has('arkenstone') ? 'bardtent' : 'bardtent_ns', lose: G => has('arkenstone') ? 'bardtent' : 'bardtent_ns',
    fxWin:{courage:6}, fxLose:{health:-6},
    winText:'You walk straight past the last sentry, and lift the tent-flap, and take off the ring.',
    loseText:'An elf grabs you by the collar and hauls you, kicking, into the firelight. "I want to see Bard," you say, with as much dignity as you can, and to your surprise they take you to him.'}},
bardtent:{title:'Bard\'s tent', text:`Bard and the Elvenking stare at you: a small hobbit, wet to the knees, appearing out of the night. You tell them who you are, and why you have come, and then you take out the Arkenstone and set it on the table.

The tent fills with white light. Even the Elvenking, who has seen the jewels of a thousand years, stands up from his seat.

"It is the Heart of the Mountain," says Bard softly, "and the heart of Thorin also. He values it above a river of gold. You give us this?"

"It isn't exactly mine to give," you say. "But I'm willing to let it count against my share. Use it to bargain with. I don't want there to be a battle."`,
  fx:{lose:'arkenstone', greed:-25, courage:10, flag:'gaveBard', aff:{bard:15, thranduil:12}},
  choices:[
    talk('bt1', 'Ask Bard to promise not to hurt the dwarves.', `"I want only what is just," says Bard. "I will not shed dwarf-blood for gold, if I can help it." He looks at you a long time. "You are a stranger guest than I ever expected, Master Baggins."`, {aff:{bard:5}}),
    {t:'Go back to the Mountain before you are missed.', go:'gandalf16', fx:{courage:5, flag:'wentBack'}},
    {t:'Stay here, where it\'s safe.', go:'gandalf16', fx:{aff:DWARVES(-6), flag:'stayedElves'}}
  ]},
bardtent_ns:{title:'Bard\'s tent', text:`Bard and the Elvenking hear you out. You tell them that Dáin is coming, and that Thorin will not bend, and that you are afraid.

"You are brave to come," says Bard, "and honest. But you have brought me nothing to bargain with, Master Baggins. Thorin will not give a coin for words."

The Elvenking says nothing at all, but he gives you a cup of wine, and a cloak, and an escort back to the foot of the wall.`,
  fx:{aff:{bard:8, thranduil:4}, courage:4},
  choices:[{t:'Climb back up.', go:'morning17'}]},
gandalf16:{title:'Outside the tent', text:`As you come out of the tent, an old man wrapped in a dark cloak rises from where he has been sitting by the door. He takes off his hood.

It is Gandalf.

"Well done, Bilbo," he says, and claps you on the back, and his eyes are twinkling under his eyebrows exactly as they twinkled on your doorstep, a year and a lifetime ago. "There is always more about you than anyone expects. Go back, if you mean to. Things may go hard tomorrow. But I think you have done the best thing anyone could have done, and I shall be close by."`,
  fx:{aff:{gandalf:10}},
  choices:[{t:'Morning.', go:'morning17'}]},
keep16:{title:'The wall', text:`You put your hand in your pocket and close it round the stone. It is warm now. It is yours. You found it, you carried it, you went into the dark for it — for all of it.

You stay on the wall all night, watching the fires below, and you think about nothing but the stone, and about what Thorin would say if he knew, and about how he will never know.

When Bombur wakes and takes over the watch, he says you look feverish.`,
  fx:{greed:15, flag:'keptStone'},
  choices:[{t:'Morning.', go:'morning17'}]}
});

// ── XVII. THE CLOUDS BURST ──────────────────────────────────────────────────
Object.assign(BEATS, {
morning17:{chapter:17, chTitle:'The Clouds Burst', loc:'frontgate', text: G => G.flags.gaveBard ? `At noon Bard comes to the wall with the Elvenking, and holds up the Arkenstone, and offers to give it back for one fourteenth part of the hoard.

Thorin goes white, and then red. "How came you by it?" he cries. And you — ${G.flags.stayedElves ? 'standing below the wall, beside Bard' : 'standing beside him on the wall'} — say, "I gave it to them."

For a moment you think he will throw you off the wall. He reaches for you. "You miserable hobbit! You undersized — burglar!" Then Gandalf steps out of the crowd below and throws back his cloak. "Put him down," he says, "or you'll not have your stone, and you'll not deserve it."

Thorin lets you go, and agrees to the bargain with his teeth clenched, and swears he will never forgive you, and you are let down the wall on a rope with nothing at all.` :
  `In the morning Bard comes to the wall again, and Thorin sends him away again. ${G.flags.keptStone ? 'Thorin is wilder than ever; he has had the whole hoard searched twice for the Arkenstone, and every time he passes you, you feel it heavy in your pocket.' : 'There is nothing to bargain with, and nothing more to say.'}

Two days later Dáin comes over the eastern hills with five hundred dwarves in steel, and the dwarves and the elves and the men draw up their lines in the valley before the Gate, and look at one another over their spears.`,
  enter: G => { if (G.flags.gaveBard) applyFx({aff:{thorin:-35}}); },
  choices:[{t:'Then the sky goes dark.', go:'battle17'}]},
battle17:{title:'The Battle of Five Armies', loc:'ravenhill', map:'lake', art:'battle', text:`Then the sky goes dark, all at once, as if a storm had come out of nowhere — and it is not a storm. It is bats, millions of them. And under them, pouring over the northern ridges, come the goblins of the Misty Mountains, every goblin there is, with the wargs running beside them. They have heard that the dragon is dead, and they have come to take the treasure for themselves.

Gandalf stands up between the armies and raises his staff. "Halt!" he cries in a voice like thunder. "Dread has come upon you all! Alas! It has come more swiftly than I guessed. The goblins are upon you!"

So elves and men and dwarves, who were about to kill one another, turn together on the goblins. That is the Battle of Five Armies.

You are on Ravenhill, with the elves, and the goblins are coming up the slope.`,
  game:{type:'pinecones', mode:'battle', label:'Hold Ravenhill', win:'battle17b', lose:'battle17b',
    fxWin:{courage:10}, fxLose:{health:-20},
    winText:'You throw and throw, and the goblins fall back down the slope, and fall back again, and the elves around you are singing. But there are always more of them, and the day is going.',
    loseText:'They come over the top of the hill. You fight with Sting, and are knocked down, and get up, and are knocked down again. The elves around you are falling back, and the day is going.'}},
battle17b:{title:'Ravenhill', text:`From the hill you see Thorin come out of the Front Gate, in gold armour, with the Company behind him, and charge into the goblins like a thunderbolt. He cuts his way deep into their lines, almost to the bodyguard of their chief. But they close round him, and he is surrounded.

The day is lost. The goblins are everywhere. And far off in the west, against the setting sun, you see dark specks in the sky — growing larger.`,
  choices:[
    {t:'Put on the ring and hide among the stones.', go:'struck17', ring:3, fx:{health:-4}},
    {t:'Run down the hill shouting to Thorin about the bodyguard at his back.', go:'struck17', if: G => G.stats.courage >= 50, fx:{courage:8, health:-14, flag:'warnedThorin'}, res:`You never remember the run. You remember Thorin's head turning — and his eyes finding you, a small hobbit in a mithril shirt, in the middle of a battle — and his sword sweeping round just in time to meet the goblin behind him.`},
    {t:'Stay where you are, and watch.', go:'struck17', if: G => G.stats.courage < 50}
  ]},
struck17:{title:'Ravenhill', text:`The specks become eagles: the Eagles of the Misty Mountains, coming down the wind in a long line, more than you can count.

"The eagles!" you cry, jumping up and waving your arms. "Eagles in the west! The eagles are here!"

At that moment a stone, falling from the sky, hits you on the helmet with a great crack, and you fall down, and know nothing more.`,
  choices:[{t:'…', go:'wake18'}]}
});

// ── XVIII. THE RETURN JOURNEY ───────────────────────────────────────────────
Object.assign(BEATS, {
wake18:{chapter:18, chTitle:'The Return Journey', date:'November', map:'erebor', loc:'guard', text:`When you come to, you are lying on the flat stones of Ravenhill, and there is nobody near. The day is cloudless but cold. You are shaking like a leaf, and your head hurts terribly.

The battle is over. The goblins are destroyed. Beorn came at the end of it, they tell you later, in bear's shape, and nothing could stand against him.

A man finds you, with your ring off, and carries you down to a tent before the Gate. "Thorin is asking for you," he says.`,
  choices:[{t:'Go to him.', go: G => G.flags.keptStone ? (G.stats.greed >= 60 ? 'hoard18' : 'found18') : (G.flags.gaveBard && G.flags.thorinFriend && G.flags.warnedThorin ? 'lives18' : 'deathbed18')}]},
deathbed18:{title:'Thorin\'s tent', text: G => `Thorin lies wounded with many wounds, and his armour is rent, and his notched axe is on the floor. He looks up as you come in.

"Farewell, good thief," he says. "I go now to the halls of waiting, to sit beside my fathers until the world is renewed. ${G.flags.gaveThorin ? 'You gave me the Heart of the Mountain, with your own hands, and I let it eat mine. Forgive me.' : 'You did right, at the wall, and I did wrong. I take back my words. Forgive me.'}"

You kneel. You cannot speak.

"There is more in you of good than you know, child of the kindly West," he says. "Some courage and some wisdom, blended in measure. If more of my people had a measure of your sense — of liking a good dinner and a warm fire better than a cold heap of gold — the world would be a gladder place to live in. But sad or glad, I must leave it now. Farewell!"

And he dies.`,
  fx:{aff:{thorin:40}},
  log:'Thorin Oakenshield died after the battle, and forgave me.',
  choices:[{t:'Go out into the cold.', go:'funeral18'}]},
lives18:{title:'Thorin\'s tent', text:`Thorin lies wounded with many wounds, and his armour is rent, but his eyes are clear, and the healers of the elves are with him. He looks up as you come in.

"Burglar," he says. "The goblin at my back — that was your voice."

You nod. You cannot speak.

"I said I would never forgive you," he says. "I was a fool. I have been a fool since the day we walked into that hall. I wanted the stone more than my friends, and the gold more than my honour, and I would have killed the only one of us with the sense to see it." He holds out his hand. "I take back every word I spoke at the wall. Will you take my hand, Bilbo?"

You take it. Fíli and Kíli, bandaged and grinning, are standing at the foot of his bed.`,
  fx:{aff:{thorin:60}, flag:'thorinLives'},
  log:'Thorin was wounded in the battle, but lived, and we were friends again.',
  choices:[{t:'Stay with him until he sleeps.', go:'share18'}]},
funeral18:{title:'Before the Gate', text:`They bury Thorin deep under the Mountain, and Bard lays the Arkenstone on his breast. "There let it lie till the Mountain falls," he says. The Elvenking lays Orcrist on his tomb, and it is said that it glows in the dark if ever foes come near.

Fíli and Kíli fell defending him, for he was their mother's elder brother.

Dáin becomes King under the Mountain. And you weep until your eyes are red and your voice is hoarse.`,
  song:'lament',
  choices:[{t:'Afterwards.', go:'share18'}]},
share18:{title:'The Front Gate', text: G => `${G.flags.thorinLives ? 'Thorin, from his bed, keeps the bargain Bard made for the stone, and more than keeps it: a fourteenth to Lake-town, and gifts to the elves, and friendship with Dale renewed.' : 'Dáin keeps the bargain made for the Arkenstone, and gives Bard the fourteenth share in gold and silver, and gifts to the elves besides.'} ${G.flags.promisedBard ? 'Bard reminds them, with a glance at you, that a certain hobbit promised Lake-town its share on a bridge one night, long ago, and Lake-town gets a little more.' : ''}

And then they come to your share.

They offer you a fourteenth part of the whole hoard. It would need a whole army to carry it home.`,
  choices:[
    {t:'"Two small chests — one of silver and one of gold — as much as one pony can carry. That will be more than enough."', go:'west19', fx:{item:'chests', gold:150, greed:-15, aff:{bard:6, gandalf:6}, flag:'modest'}, res:'Everyone thinks you are mad. Gandalf thinks you are wise. You give the Elvenking a necklace of silver and pearls from your share, "in return for his hospitality, which I enjoyed without being asked," and he laughs, and names you elf-friend.'},
    {t:'Take a cart-load. You earned it.', go:'west19', fx:{item:'chests', gold:400, greed:20}, cls:'gold', res:'They load you a cart, and a team of ponies, and a guard to get it as far as the Misty Mountains. The cart is very heavy. You find you keep looking back at it, all the way west.'}
  ]},
found18:{title:'Thorin\'s tent', text:`Thorin lies dying when they bring you in. His dwarves have been searching the wounded, and the dead, for the Arkenstone, as he ordered — and they found it in your coat, while you lay senseless on Ravenhill.

They have put it in his hands. He looks at it, and then at you, for a long time.

"I trusted you," he says. "Of all of them. I gave you mithril from my grandfather's hoard, and you sat on my wall, and watched me tear the Mountain apart looking for this, and said nothing." He turns his face away. "Go. Take your fourteenth share, if you can carry it. I want none of you near my grave."

He dies before morning. Nobody will tell you where they bury him.`,
  fx:{lose:'arkenstone', aff:{thorin:-60}},
  choices:[{t:'Go.', go:'end_exile'}]},
hoard18:{title:'The Front Gate', text:`You never go to the tent. You slip on the ring instead, and walk past the man who came to fetch you, and in through the shattered Front Gate, and down into the dark of the halls, where nobody is.

You find a small room off the treasury, high up, with a door you can bar. You sit down in it, with the Arkenstone in your lap, and look at it.

You are still looking at it when they stop searching for you, days later.`,
  choices:[{t:'…', go:'end_hoard'}]}
});

// ── XIX. THE LAST STAGE ─────────────────────────────────────────────────────
Object.assign(BEATS, {
west19:{chapter:19, chTitle:'The Last Stage', date:'Spring, T.A. 2942', map:'home', loc:'beorn', w:'beorn', text:`You go west with Gandalf, and spend Yule at Beorn's house, warm and loud and merry; and in spring you cross the mountains by a better road than the last time, and come down at last to Rivendell, where the elves are singing the same silly songs about beards as before, only now they sing them about you.

You sit in Elrond's house and tell the whole story, and Elrond listens to every word.

And then the road goes west again, through the Lone-lands, past three stone trolls standing in a clearing with moss on their noses.`,
  song:'homeward',
  fx:{food:10, health:30},

end_home:{ending:'good', title:'There and Back Again', art:'home', text: G => `One autumn evening, some years afterwards, you are sitting in your study writing your memoirs when there is a ring at the door. It is Gandalf, and with him a dwarf: Balin, with a longer white beard and a jewelled belt of great magnificence.

They come in, and sit, and tell you the news. Dale is rebuilt, and Bard is its king. The river runs with gold, as the songs said, and the valley is full of orchards and birds. Lake-town is a new town, richer than the old, and the new Master is a better one.

"Then the old songs came true, after a fashion," you say.

"Of course," says Gandalf. "Did you think all those adventures and escapes happened by plain luck, just for your sake? You are a fine fellow, Mr. Baggins, and I am very fond of you. But you are only quite a little fellow in a wide world, after all."

end_king:{ending:'good', title:'The King\'s Burglar', art:'mountain', text:`Every spring, after that, a dwarf comes riding west along the East Road with a pony loaded with presents, and a letter sealed with the mark of the King under the Mountain.

And at last, one year, you go. You go back over the mountains and through the forest and up the Long Lake to the Mountain, and the King under the Mountain comes out of his Gate to meet you, grey-bearded and stooping a little, with a white jewel on his breast, and takes your hand in both of his.

end_exile:{ending:'bad', title:'A Thief, After All', art:'none', text:`You go west alone. You take nothing from the hoard; you could not bear to. Gandalf rides with you as far as Rivendell, and says very little, and that kindly.

At home, you find your belongings sold and your name mud, and you buy back what you can with the little money you have. You never write your memoirs. Whenever anyone asks about the year you went away, you say it was a holiday, and it rained.

But on some nights, you take a gold ring out of the drawer, and turn it over in your fingers, and think of a dying dwarf turning his face to the wall. And you wonder what would have happened if you had just called out: <em>Thorin! I've found it! Over here!</em>`},

Only sometimes, on summer evenings, when the dwarves go by on the East Road with their packs and their hoods, you stand at your green door and watch them out of sight. And you remember a harp-song by your fire, one night, long ago, and a mountain far away, and a door you never opened.`},
fallen:{ending:'fail', title:'The Road Ends', text:`Your strength is spent. You lie down beside the path, far from home, and close your eyes.

const GAMES = {};
function startGame(cfg){
  SND.ac();

function finishGame(res){
  if (UI.inst && UI.inst.stop) UI.inst.stop();
  UI.inst = null; UI.keys = {};
  const cfg = UI.game; UI.game = null;
  if (!cfg) return;
  G.games[cfg.type] = res;
  let chips = applyFx(res.win ? cfg.fxWin : cfg.fxLose);
  if (res.fx) chips = chips.concat(applyFx(res.fx));
  if (res.ringOn) chips = chips.concat(ringUse(res.ringCost || 10));
  SND.fx(res.win ? 'good' : 'bad');
  let next = res.win ? cfg.win : (cfg.lose || cfg.win); if (typeof next === 'function') next = next(G);
  if (G.stats.health <= 0) next = 'fallen';
  if (G.stats.burden >= 100) next = 'claimed';
  const text = [res.msg, res.win ? cfg.winText : cfg.loseText].filter(Boolean).join('\n\n');
  G.pending = {text: text || (res.win ? 'Well done.' : 'It could have gone better.'), chips, next};
  save(); render(); window.scrollTo(0, 0);
}
function gameShell(wrap, title, hud, help){

function mkCanvas(parent, w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.className = 'gc'; parent.appendChild(c);
  return {c, x:c.getContext('2d')};
}
function canvasPos(c, e){
  const r = c.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  return [(t.clientX - r.left) / r.width * c.width, (t.clientY - r.top) / r.height * c.height];
}
function ticker(fn){
  let last = performance.now(), dead = false;
  const id = setInterval(() => { if (dead) return; const now = performance.now(); const dt = Math.min(.1, (now - last) / 1000); last = now; fn(dt); }, 16);
  return () => { dead = true; clearInterval(id); };
}

GAMES.dishes = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'The Washing-up', '', 'Click or tap each plate, cup and jug before it hits the floor. The dwarves are throwing them faster and faster.');
  const {c, x} = mkCanvas(ui.body, 760, 420);
  const DUR = 28, KINDS = ['plate','plate','plate','cup','jug','bowl'];
  let t = 0, next = .4, items = [], caught = 0, broke = 0, over = false, shards = [], flashes = [];
  c.addEventListener('pointerdown', e => {
    if (over) return; const [px, py] = canvasPos(c, e), R = e.pointerType === 'touch' ? 50 : 34;
    let best = null, bd = R; items.forEach(it => { const d = Math.hypot(it.x - px, it.y - py); if (d < bd){ bd = d; best = it; } });
    if (!best) return; best.dead = true; caught++; SND.fx('click'); flashes.push({x:best.x, y:best.y, t:.4});
  });
  const stop = ticker(dt => {
    if (over) return;
    t += dt; next -= dt;
    if (next <= 0 && t < DUR - 1.5){
      next = Math.max(.32, 1.1 - t * .028) * rnd(.7, 1.2);
      const fromLeft = Math.random() < .5;
      items.push({k:pick(KINDS), x: fromLeft ? -20 : 780, y:rnd(180, 300), vx:(fromLeft ? 1 : -1) * rnd(170, 260), vy:-rnd(260, 360), rot:0, vr:rnd(-6, 6)});
    }
    items.forEach(it => { it.x += it.vx * dt; it.y += it.vy * dt; it.vy += 420 * dt; it.rot += it.vr * dt;
      if (it.y > 400 && !it.dead){ it.dead = true; broke++; SND.fx('hit'); for (let i = 0; i < 8; i++) shards.push({x:it.x, y:398, vx:rnd(-90, 90), vy:-rnd(60, 160), l:.8}); ui.msg.textContent = pick(['Crash!','Oh, your mother\'s best!','Smash!','Not the gravy-boat!']); } });
    items = items.filter(it => !it.dead && it.x > -60 && it.x < 820);
    shards.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 400 * dt; s.l -= dt; }); shards = shards.filter(s => s.l > 0);
    flashes.forEach(f => f.t -= dt); flashes = flashes.filter(f => f.t > 0);
    // draw: the kitchen at Bag End
    x.fillStyle = '#5a3e22'; x.fillRect(0, 0, 760, 420); x.fillStyle = '#7a5630'; x.fillRect(0, 0, 760, 300);
    x.fillStyle = '#e8d4a0'; x.beginPath(); x.arc(380, 120, 60, Math.PI, 0); x.fill(); x.fillStyle = '#3a2410'; x.fillRect(320, 120, 120, 6);
    for (let i = 0; i < 6; i++){ x.fillStyle = '#4a2e14'; x.fillRect(560 + i * 30, 60, 4, 160); } x.fillRect(550, 90, 190, 6); x.fillRect(550, 150, 190, 6); x.fillRect(550, 210, 190, 6);
    x.fillStyle = '#c8a878'; x.fillRect(0, 400, 760, 20);
    [[40, 330], [720, 330]].forEach(([dx, dy]) => { x.fillStyle = '#8a5a2a'; x.beginPath(); x.arc(dx, dy - 40, 18, 0, 7); x.fill(); x.fillStyle = '#c8a050'; x.fillRect(dx - 20, dy - 22, 40, 60); });
    items.forEach(it => { x.save(); x.translate(it.x, it.y); x.rotate(it.rot); x.strokeStyle = '#2a2a3a'; x.lineWidth = 2;
      if (it.k === 'plate'){ x.fillStyle = '#f4f0e6'; x.beginPath(); x.ellipse(0, 0, 18, 18, 0, 0, 7); x.fill(); x.stroke(); x.strokeStyle = '#3a6ab8'; x.beginPath(); x.arc(0, 0, 12, 0, 7); x.stroke(); }
      else if (it.k === 'cup'){ x.fillStyle = '#f4f0e6'; x.fillRect(-10, -10, 20, 20); x.strokeRect(-10, -10, 20, 20); x.beginPath(); x.arc(13, 0, 6, -1.5, 1.5); x.stroke(); }
      else if (it.k === 'jug'){ x.fillStyle = '#c86a3a'; x.beginPath(); x.moveTo(-10, 14); x.lineTo(-13, -8); x.lineTo(-6, -16); x.lineTo(8, -16); x.lineTo(13, -8); x.lineTo(10, 14); x.closePath(); x.fill(); x.stroke(); }
      else { x.fillStyle = '#e8e0c8'; x.beginPath(); x.arc(0, -4, 16, 0, Math.PI); x.fill(); x.stroke(); }
      x.restore(); });
    shards.forEach(s => { x.fillStyle = '#f4f0e6'; x.fillRect(s.x, s.y, 4, 3); });
    flashes.forEach(f => { x.strokeStyle = `rgba(255,215,106,${f.t * 2})`; x.lineWidth = 3; x.beginPath(); x.arc(f.x, f.y, 30 - f.t * 30, 0, 7); x.stroke(); });
    ui.hud.innerHTML = `<span>Caught <b>${caught}</b></span><span>Broken <b>${broke}</b></span><span>Time <b>${Math.max(0, Math.ceil(DUR - t))}</b></span>`;
    if (t >= DUR && !items.length){ over = true; done({win: broke <= 3, score: caught / Math.max(1, caught + broke), msg:`You caught ${caught}, and ${broke} went on the floor.`}); }
  });
  return {stop};
};
