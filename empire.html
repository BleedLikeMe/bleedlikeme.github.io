      <div style="color:var(--dim);font-size:12px;">Needs ${t.crew}+ crew · ${t.planDays} day(s) to plan · ${fmt(t.planCost)} upfront</div>
      <div style="color:var(--dim);font-size:12px;">Payout ${fmt(t.payoutMin)}–${fmt(t.payoutMax)} · Heat +${t.heat}</div>
    </div>`).join('');
  const heistCards = G.heists.map(h=>{
    const t = HEIST_TARGETS[h.targetKey];
    return `<div class="kcard" onclick="openHeistModal('${h.id}')">
      <div class="t">${t.label}</div>
      <div class="m">${h.stage==='planning'?(Math.max(h.timer,0)+' day(s) to go'):(h.result||'')}</div>
    </div>`;
  }).join('');

  const gangLaunderTiles = Object.values(G.gangs).map(g=>`
    <div class="tile clickable" onclick="openLaunderRivalModal('${g.id}')">
      <div style="font-weight:bold;color:${g.color};">${g.name}</div>
      <div style="color:var(--dim);font-size:12px;">Relation: <span class="pill ${g.relation>20?'good':g.relation<-20?'bad':'mid'}">${g.relation}</span></div>
      <div style="color:var(--dim);font-size:12px;">Gamble dirty cash through their tables</div>
    </div>`).join('');

  return `
  <div class="card">
    <h3>The Product Pipeline</h3>
    <p style="color:var(--dim);">${runner?`${runner.name} runs this side of things (skill ${runner.skill}).`:'No Runner Boss — bigger risk of a bust, smaller batches processed at once.'}</p>
    <button class="btn primary" onclick="buySupply()">Buy Supply — £1,800 (40 units)</button>
  </div>
  <div id="kanban">${kanban}</div>
  <div class="card">
    <h3>Big Scores</h3>
    <p style="color:var(--dim);">One-off jobs — bank branches, security vans, jewellers. Commit some of the crew for a few days and they're off the books for anything else meantime.</p>
    <div class="grid3">${heistTiles}</div>
  </div>
  ${G.heists.length ? `<div class="card"><h3>Jobs in Motion</h3><div id="kanban"><div class="kcol" style="flex:1 0 220px;"><h4>Status</h4>${heistCards}</div></div></div>` : ''}
  <div class="card">
    <h3>Launder Through the Opposition</h3>
    <p style="color:var(--dim);">Gamble large sums of dirty cash through a rival's casino or bookies — much faster than waiting on your own businesses' laundering capacity, but they take a cut, and it can go bad if they don't like you.</p>
    <div class="grid3">${gangLaunderTiles}</div>
  </div>
  `;
}

function renderPersonal(){
  const venues = G.businesses.filter(b=>BUSINESS_TYPES[b.typeKey].hasGirls);
  const rows = G.girls.map(g=>{
    const venue = venues.find(v=>v.id===g.location);
    const training = g.trainingUntil && g.trainingUntil>G.day;
    const options = ['street',...venues.map(v=>v.id)].map(loc=>{
      const label = loc==='street'?'Street':venues.find(v=>v.id===loc).name;
      const full = loc!=='street' && G.girls.filter(x=>x.location===loc).length >= venueCapacity(venues.find(v=>v.id===loc)) && g.location!==loc;
      return `<option value="${loc}" ${g.location===loc?'selected':''} ${full?'disabled':''}>${label}${full?' (full)':''}</option>`;
    }).join('');
    return `<tr class="clickable" onclick="openGirlModal('${g.id}')">
      <td>${g.name}${training?' <span class="pill mid">training</span>':''}</td>
      <td><select onclick="event.stopPropagation()" onchange="assignGirlLocation('${g.id}', this.value)">${options}</select></td>
      <td>${g.skill}</td>
      <td><div class="barwrap"><div style="width:${g.safety}%;background:${g.safety>60?'var(--green)':g.safety>30?'var(--gold)':'var(--red)'};"></div></div></td>
      <td><button class="btn small" onclick="event.stopPropagation(); releaseGirl('${g.id}')">Let Go</button></td>
    </tr>`;
  }).join('');
  const madam = activeDeputy('madam');
  const candidates = G.girlCandidates.map(c=>`
    <div class="tile clickable" onclick="openGirlCandidateModal('${c.id}')"><div style="font-weight:bold;">${c.name}</div><div style="color:var(--dim);font-size:12px;">Skill ${c.skill} · Safety instinct ${c.safety}</div>
    <button class="btn small gold" style="margin-top:6px;" onclick="event.stopPropagation(); hireGirl('${c.id}')">Take Her On</button></div>`).join('');
  return `
  <div class="card">
    <h3>Personal Services</h3>
    <p style="color:var(--dim);">${madam?`${madam.name} looks after this side of the business (skill ${madam.skill}).`:'No Manager assigned — safety and earnings suffer without one.'} Venue work (parlour/club) pays better and is safer than the street, but capacity is limited.</p>
    <table><tr><th>Name</th><th>Assigned To</th><th>Skill</th><th>Safety</th><th></th></tr>${rows || '<tr><td colspan="5" style="color:var(--dim)">Nobody on the books.</td></tr>'}</table>
  </div>
  <div class="card">
    <h3>Available</h3>
    <div class="grid3">${candidates || '<p style="color:var(--dim)">Nobody looking for work right now.</p>'}</div>
  </div>`;
}

function renderDeputies(){
  const rows = G.deputies.map(d=>{
    const training = d.trainingUntil && d.trainingUntil>G.day;
    return `<tr class="clickable" onclick="openDeputyModal('${d.id}')">
    <td>${d.name}${training?' <span class="pill mid">training</span>':''}</td><td>${DEPUTY_ROLES[d.role].label}</td><td>${d.skill}</td>
    <td><div class="barwrap"><div style="width:${d.loyalty}%;background:${d.loyalty>60?'var(--green)':d.loyalty>30?'var(--gold)':'var(--red)'};"></div></div></td>
    <td>${fmt(d.salary)}/wk</td>
    <td><button class="btn small" onclick="event.stopPropagation(); fireDeputy('${d.id}')">Cut Loose</button></td>
  </tr>`;
  }).join('');
  const candidates = G.deputyCandidates.map(c=>`
    <div class="tile clickable" onclick="openDeputyCandidateModal('${c.id}')"><div style="font-weight:bold;">${c.name}</div>
    <div style="color:var(--gold);font-size:12px;">${DEPUTY_ROLES[c.role].label}</div>
    <div style="color:var(--dim);font-size:11px;">${DEPUTY_ROLES[c.role].desc}</div>
    <div style="color:var(--dim);font-size:12px;margin-top:4px;">Skill ${c.skill} · ${fmt(c.salary)}/wk</div>
    <button class="btn small gold" style="margin-top:6px;" onclick="event.stopPropagation(); hireDeputy('${c.id}')">Hire — signing fee ${fmt(c.salary*2)}</button></div>`).join('');
  const taskCols = ['available','assigned','done'];
  const availableTasks = Object.entries(TASK_TYPES).map(([key,def])=>`
    <div class="kcard" onclick="openTaskAssignModal('${key}')">
      <div class="t">${def.label}</div><div class="m">Needs: ${DEPUTY_ROLES[def.role].label} · ~${def.hours}h</div>
    </div>`).join('');
  const assignedTasks = G.tasks.filter(t=>t.status==='assigned').map(t=>{
    const dep = G.deputies.find(d=>d.id===t.deputyId);
    return `<div class="kcard" onclick="openTaskDetailModal('${t.id}')"><div class="t">${TASK_TYPES[t.key].label}</div><div class="m">${dep?dep.name:'?'} · ${Math.max(t.timer,0)} tick(s) left</div></div>`;
  }).join('');
  const doneTasks = G.tasks.filter(t=>t.status==='done').map(t=>{
    const dep = G.deputies.find(d=>d.id===t.deputyId);
    return `<div class="kcard" onclick="openTaskDetailModal('${t.id}')"><div class="t">${TASK_TYPES[t.key].label}</div><div class="m">${dep?dep.name:'?'} · ${t.result||''}</div></div>`;
  }).join('');
  return `
  <div class="card">
    <h3>The Crew</h3>
    <table><tr><th>Name</th><th>Role</th><th>Skill</th><th>Loyalty</th><th>Salary</th><th></th></tr>${rows || '<tr><td colspan="6" style="color:var(--dim)">No deputies yet.</td></tr>'}</table>
  </div>
  <div class="card">
    <h3>Available for Hire</h3>
    <div class="grid3">${candidates || '<p style="color:var(--dim)">Nobody available right now.</p>'}</div>
  </div>
  <div class="card">
    <h3>Street Jobs</h3>
    <div id="kanban">
      <div class="kcol"><h4>Available</h4>${availableTasks}</div>
      <div class="kcol"><h4>In Progress <span>${assignedTasks?G.tasks.filter(t=>t.status==='assigned').length:0}</span></h4>${assignedTasks || '<div style="color:var(--dimmer);font-size:12px;">Nothing running</div>'}</div>
      <div class="kcol"><h4>Done</h4>${doneTasks || '<div style="color:var(--dimmer);font-size:12px;">Nothing yet</div>'}</div>
    </div>
  </div>`;
}

function renderTerritory(){
  const rows = LOCATIONS.map(l=>{
    const ctrl = G.areas[l.id].controller;
    const gangEntry = Object.entries(G.gangs).find(([gid])=>GANG_DEFS.find(gd=>gd.id===gid).areas.includes(l.id));
    let pillClass = ctrl==='player'?'player':(ctrl==='neutral'?'neutral':'rival');
    let ctrlLabel = ctrl==='player'?'You':(ctrl==='neutral'?'Neutral':G.gangs[ctrl].name);
    const stronghold = gangEntry && isGangStronghold(gangEntry[0], l.id);
    let actions = '';
    if(ctrl==='player'){
      actions = `<button class="btn small" onclick="event.stopPropagation(); extortArea('${l.id}')">Squeeze It</button>`;
    } else if(ctrl==='neutral'){
      actions = `<button class="btn small gold" onclick="event.stopPropagation(); moveInArea('${l.id}')">Move In — £5,000</button>`;
    } else if(gangEntry){
      actions = `<button class="btn small primary" onclick="event.stopPropagation(); attackTerritory('${l.id}')">Attack — ${fmt(attackCost(gangEntry[0], l.id))}</button>`;
    }
    return `<tr class="clickable" onclick="openAreaModal('${l.id}')"><td>${l.name}${stronghold?' <span class="pill bad">🏰 stronghold</span>':''}</td><td><span class="pill ${pillClass}">${ctrlLabel}</span></td><td>${'★'.repeat(l.wealth)}</td><td>${actions}</td></tr>`;
  }).join('');
  const gangCards = Object.values(G.gangs).map(g=>`
    <div class="tile clickable" onclick="openGangModal('${g.id}')">
      <div style="font-weight:bold;color:${g.color};">${g.name}${g.war?' <span class="pill bad">WAR</span>':''}</div>
      <div style="font-size:12px;color:var(--dim);">Strength ${Math.round(g.strength)} · Aggression ${g.aggression} · Holds ${gangAreasHeld(g.id)}/${gangHomeAreas(g.id).length} areas</div>
      <div style="margin-top:4px;">Relation: <span class="pill ${g.relation>20?'good':g.relation<-20?'bad':'mid'}">${g.relation}</span></div>
      <button class="btn small gold" style="margin-top:6px;" onclick="event.stopPropagation(); negotiateTruce('${g.id}')">Offer Truce — £6,000</button>
    </div>`).join('');
  return `
  <div class="card"><h3>The City</h3>${renderMap()}</div>
  <div class="card">
    <h3>Areas</h3>
    <table><tr><th>Area</th><th>Controlled By</th><th>Wealth</th><th></th></tr>${rows}</table>
  </div>
  <div class="card">
    <h3>Rival Gangs</h3>
    <div class="grid3">${gangCards}</div>
  </div>`;
}

function renderPolice(){
  const fixer = activeDeputy('fixer');
  const lawyer = activeDeputy('lawyer');
  const contactRows = G.policeContacts.map(c=>{
    const rank = CONTACT_RANKS[c.rankKey];
    return `<tr class="clickable" onclick="openContactModal('${c.id}')">
      <td>${c.name}</td><td>${rank.label}</td>
      <td><div class="barwrap"><div style="width:${c.loyalty}%;background:${c.loyalty>60?'var(--green)':c.loyalty>30?'var(--gold)':'var(--red)'};"></div></div></td>
      <td>${fmt(rank.retainer)}/wk</td>
      <td><button class="btn small" onclick="event.stopPropagation(); dropContact('${c.id}')">Cut Loose</button></td>
    </tr>`;
  }).join('');
  const contactCandidates = G.contactCandidates.map(c=>{
    const rank = CONTACT_RANKS[c.rankKey];
    return `<div class="tile clickable" onclick="openContactCandidateModal('${c.id}')">
      <div style="font-weight:bold;">${c.name}</div>
      <div style="color:var(--gold);font-size:12px;">${rank.label}</div>
      <div style="color:var(--dim);font-size:12px;margin-top:4px;">${fmt(rank.retainer)}/wk retainer</div>
      <button class="btn small gold" style="margin-top:6px;" onclick="event.stopPropagation(); hireContact('${c.id}')">Bring Onside — ${fmt(rank.cost)}</button>
    </div>`;
  }).join('');
  const jailedCards = G.jailed.map(j=>`
    <div class="tile clickable" onclick="openJailModal('${j.id}')">
      <div style="font-weight:bold;">${j.name}</div>
      <div style="color:var(--dim);font-size:12px;">${DEPUTY_ROLES[j.role].label} · out day ${j.sentenceDay} (day ${G.day} now)</div>
      <div style="color:var(--dim);font-size:12px;">Bail: ${fmt(j.bail)}</div>
      <button class="btn small gold" style="margin-top:6px;" onclick="event.stopPropagation(); bailOutDeputy('${j.id}')">Post Bail</button>
    </div>`).join('');
  return `
  <div class="card">
    <h3>Heat: ${Math.round(G.heat)}/100</h3>
    <div class="barwrap" style="height:16px;"><div style="width:${G.heat}%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));"></div></div>
    <p style="color:var(--dim);margin-top:10px;">${G.heat>=90?'Red alert — a raid on you personally could happen any day.':G.heat>=60?'Heavy attention. Raids are a real risk.':G.heat>=30?'Manageable, but climbing.':'Quiet.'}</p>
    <div class="choices">
      <button onclick="payBribe()">Pay Off a Contact — ~£${Math.round(3500*(1-totalContactBribeDiscount()*0.6)).toLocaleString()} (heat -20 to -45+)</button>
      <button onclick="layLow()">Lay Low for the Night (lose ~half a night's takings, heat -16)</button>
    </div>
  </div>
  <div class="card">
    <h3>Fixer</h3>
    ${fixer ? `<p>${fixer.name} keeps a lid on things — reduces daily heat build-up, improves bribe results, and gets more out of every Police Contact below.</p>` : `<p style="color:var(--dim)">No Fixer on the books. Hire one from the Deputies tab to slow heat build-up and get more out of Police Contacts.</p>`}
    ${lawyer ? `<p>${lawyer.name} works the courts — cuts bail and sentences for anyone lifted, and can try to get a case thrown out entirely (see The Cells, below).</p>` : `<p style="color:var(--dim)">No Lawyer on the books. Hire one from the Deputies tab to cut bail/sentences and unlock fighting a case in court.</p>`}
  </div>
  <div class="card">
    <h3>Police Contacts</h3>
    <p style="color:var(--dim);">A standing roster of bent coppers, paid a weekly retainer. Between them they slow heat build-up, cheapen bribes, and cut bail costs if anyone gets lifted.</p>
    <table><tr><th>Name</th><th>Rank</th><th>Loyalty</th><th>Retainer</th><th></th></tr>${contactRows || '<tr><td colspan="5" style="color:var(--dim)">Nobody on the inside yet.</td></tr>'}</table>
    <h4 style="margin-top:14px;color:var(--dim);text-transform:uppercase;font-size:11px;">Available</h4>
    <div class="grid3">${contactCandidates || '<p style="color:var(--dim)">Nobody available right now.</p>'}</div>
  </div>
  ${G.jailed.length ? `<div class="card">
    <h3>The Cells — Barlinnie</h3>
    <p style="color:var(--dim);">Anyone lifted on a job does their time here unless you bail them out, fight the case, or break them out — they'll be released on their own eventually, but it costs loyalty.</p>
    ${G.prisonBreak ? `<p><span class="pill mid">Something's already in motion — ${Math.max(G.prisonBreak.timer,0)} day(s) out.</span></p>` : `<button class="btn primary" onclick="openPrisonBreakModal()">Break Them All Out — £25,000</button>`}
    <div class="grid3" style="margin-top:10px;">${jailedCards}</div>
  </div>` : ''}
  <div class="card">
    <h3>What's Driving Heat</h3>
    <ul style="color:var(--dim);line-height:1.8;">
      <li>Every business generates a little heat per day — casinos and clubs more than sunbed shops (security upgrades cut this down).</li>
      <li>Drug batches out with dealers can get seized — the risk rises with your heat level.</li>
      <li>Street-based personal services generate more heat than venue-based work.</li>
      <li>Sitting on a lot of unlaundered dirty cash draws attention.</li>
      <li>Territory attacks, shakedowns and sabotage jobs spike heat immediately.</li>
      <li>Big scores (Rackets tab) and ordering a hit (Deputies tab) are the worst offenders — huge heat if they go wrong, and can get someone lifted.</li>
      <li>Gambling large sums through a rival's casino or bookies (Rackets tab) launders fast, but adds heat every time — more if they turn on you.</li>
      <li>Bribing or threatening a jury, and breaking into Barlinnie (The Cells, below), are the biggest single heat spikes in the game — but they're the only way out for someone who won't survive their sentence.</li>
    </ul>
  </div>`;
}

function renderLog(){
  return `<div class="card"><h3>Full Log</h3>${G.log.map(l=>`<div class="logline"><span class="d">Day ${l.day}</span>${l.msg}</div>`).join('') || '<p style="color:var(--dim)">Nothing logged yet.</p>'}</div>`;
}

// ============================= MODAL =============================
function openModal(html){
  document.getElementById('modalBox').innerHTML = html + '<div style="margin-top:14px;"></div>';
  document.getElementById('modalWrap').classList.add('show');
}
function closeModal(){
  document.getElementById('modalWrap').classList.remove('show');
  const goShown = document.getElementById('gameOverShown');
  if(goShown) return; // don't allow closing game over
}
document.getElementById('modalWrap').addEventListener('click', e=>{
  if(e.target.id==='modalWrap' && !document.getElementById('gameOverShown')) closeModal();
});
function openEventModal(){
  const ev = G.pendingEvent;
  const def = EVENT_DEFS[ev.key];
  const html = `<h3>${def.title}</h3><p>${def.text(ev.data)}</p>
    <div class="choices">${def.choices.map((c,i)=>`<button onclick="resolveEventChoice(${i})">${typeof c.label==='function'?c.label(ev.data):c.label}</button>`).join('')}</div>`;
  openModal(html);
}

// ============================= BOOT =============================
(function boot(){
  if(tryLoad()){
    document.getElementById('setupScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    buildNav();
    render();
  }
})();
</script>
</body>
</html>
