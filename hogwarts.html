<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hogwarts — First Year</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#110f0c;--panel:#1c1813;--panel2:#26201a;--line:#3a3127;--ink:#e9dfc8;--dim:#a39679;--accent:#c9a24a;--accent2:#7a5c22;--parch:#f1e4c3;--parchInk:#2b2116;--good:#8fbf6f;--bad:#d0654d;}
body[data-house=gryffindor]{--accent:#e0654f;--accent2:#d3a625;}
body[data-house=slytherin]{--accent:#62b27a;--accent2:#aab3b5;}
body[data-house=ravenclaw]{--accent:#7d9be0;--accent2:#b08a4a;}
body[data-house=hufflepuff]{--accent:#ecb939;--accent2:#6b5a4c;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(ellipse at top,#241d15 0%,var(--bg) 65%) fixed;color:var(--ink);font-family:'IM Fell English',Georgia,serif;font-size:17px;line-height:1.5}
h1,h2,h3,h4{font-family:'Cinzel',serif;letter-spacing:.04em;font-weight:700}
button{font:inherit}
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.35);flex-wrap:wrap}
#top .brand{font-family:Cinzel;color:var(--accent);font-weight:700;letter-spacing:.08em}
#chaps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font-size:12px;font-family:Cinzel;padding:3px 9px;border:1px solid var(--line);border-radius:12px;color:var(--dim)}
.chip.done{color:var(--ink);border-color:var(--accent2)}
.chip.done::before{content:'✓ ';color:var(--accent)}
.chip.cur{background:var(--accent);color:#1a1208;border-color:var(--accent)}
#purse{font-family:Cinzel;color:var(--accent);font-size:14px}
#shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 46px)}
#side{border-right:1px solid var(--line);padding:14px;background:rgba(0,0,0,.25)}
#side h4{margin:16px 0 6px;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.15em;border-bottom:1px solid var(--line);padding-bottom:3px}
.who{font-family:Cinzel;font-size:18px;text-align:center;margin-top:6px}
.sub{color:var(--dim);font-size:14px;text-align:center}
.crest{display:flex;justify-content:center}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:3px 0}
.kv span{color:var(--dim)}
.kv b{font-weight:normal;text-align:right}
.bar{height:7px;background:#000;border-radius:4px;overflow:hidden;margin:2px 0 7px}
.bar i{display:block;height:100%;background:var(--accent)}
.friend{font-size:14px;display:flex;justify-content:space-between;margin:3px 0}
.friend .rel{font-size:12px}
.rel.pos{color:var(--good)}.rel.neg{color:var(--bad)}.rel.neu{color:var(--dim)}
.journal{font-size:13px;color:var(--dim);max-height:260px;overflow-y:auto}
.journal div{padding:3px 0;border-bottom:1px dotted var(--line)}
.hint{font-size:13px;color:var(--dim);font-style:italic}
#main{padding:22px 28px}
.story{max-width:780px;margin:0 auto}
.story.wide{max-width:1240px}
.chTag{font-family:Cinzel;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.2em}
.story h1{margin:.15em 0 .5em;font-size:30px}
.prose p{margin:0 0 .9em}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:6px;cursor:pointer;transition:.15s}
.choice:hover{border-color:var(--accent);background:#2f271e;transform:translateX(3px)}
.choice:disabled{opacity:.4;cursor:default;transform:none}
.btn{background:var(--accent);color:#1a1208;border:none;padding:9px 18px;border-radius:5px;font-family:Cinzel;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:4px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aftermath{border-left:3px solid var(--accent);padding:10px 14px;background:rgba(201,162,74,.08);margin:14px 0;font-style:italic}
.art{margin:6px 0 16px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.art svg{display:block;width:100%;height:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{margin:0 0 10px;font-size:16px}
/* form */
.form label{display:block;font-family:Cinzel;font-size:13px;color:var(--accent);margin:12px 0 4px}
.form input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:5px;font:inherit}
.bloods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.blood{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;text-align:left;color:var(--ink)}
.blood.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.blood b{font-family:Cinzel;display:block;margin-bottom:4px}
.blood small{color:var(--dim);font-size:13px;line-height:1.35;display:block}
/* letter */
.envelope{position:relative;max-width:520px;margin:20px auto;aspect-ratio:1.6;background:linear-gradient(160deg,#e9d7ad,#d7c08c);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.6);color:#1f5a2a;padding:28px 34px;font-style:italic;font-size:19px}
.envelope .addr{position:absolute;left:34px;top:40px;line-height:1.6}
.seal{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c2362d,#6d100c);border:none;cursor:pointer;color:#f3c9a0;font-family:Cinzel;font-size:30px;box-shadow:0 3px 8px rgba(0,0,0,.5);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(255,120,80,.7)}}
.parch{background:var(--parch);color:var(--parchInk);border-radius:4px;padding:28px 34px;box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:640px;margin:10px auto 20px;background-image:radial-gradient(ellipse at 20% 10%,rgba(160,120,60,.18),transparent 60%),radial-gradient(ellipse at 90% 90%,rgba(140,100,40,.22),transparent 55%)}
.parch h2{text-align:center;margin:0;font-size:20px}
.parch .hm{text-align:center;font-size:13px;font-style:italic;margin-bottom:16px}
.parch ul{columns:2;font-size:15px}
.parch .sig{text-align:right;font-style:italic}
/* diagon */
.dgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.mapsvg{width:100%;height:auto;display:block}
.shop{cursor:pointer}
.shop rect{transition:.15s}
.shop:hover rect{stroke:#fff;stroke-width:2}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kcol{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:6px;padding:6px;min-height:200px}
.kcol h5{margin:0 0 6px;font-family:Cinzel;font-size:11px;letter-spacing:.12em;color:var(--dim);display:flex;justify-content:space-between}
.kcard{background:var(--parch);color:var(--parchInk);border-radius:4px;padding:5px 7px;margin-bottom:5px;font-size:13px;line-height:1.25;border-left:4px solid #8a6a2c}
.kcard small{display:block;color:#6d5a3d;font-size:11px}
.kcard.opt{border-left-color:#4f7a8f}
.kcol.trunk .kcard{border-left-color:#4e7d3a}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--accent2);border-radius:10px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#modal h2{margin:0 0 4px;font-size:20px;color:var(--accent)}
.stockrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:15px}
.stockrow .price{font-family:Cinzel;color:var(--accent);font-size:13px;white-space:nowrap}
.note{background:rgba(201,162,74,.1);border-left:3px solid var(--accent);padding:8px 12px;margin:10px 0;font-style:italic;font-size:15px}
.wand{font-family:Cinzel;font-size:15px;color:var(--accent);margin:8px 0}
/* barrier */
.track{position:relative;height:46px;background:linear-gradient(90deg,#2b241c,#3a2f22);border:1px solid var(--line);border-radius:6px;margin:18px 0;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:rgba(143,191,111,.35);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.track .marker{position:absolute;top:4px;bottom:4px;width:10px;margin-left:-5px;background:var(--accent);border-radius:3px;box-shadow:0 0 10px var(--accent)}
.track .wall{position:absolute;right:0;top:0;bottom:0;width:26px;background:repeating-linear-gradient(0deg,#7a3b2a 0 10px,#5a2a1e 10px 12px)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
/* express */
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.xmap{background:#0d1a26;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.clock{font-family:Cinzel;font-size:40px;color:var(--accent);text-align:center;line-height:1}
.progress{height:8px;background:#000;border-radius:4px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#8a1d14,var(--accent))}
.window{font-style:italic;background:linear-gradient(180deg,#1b2733,#141c24);border:6px solid #3a2a1c;border-radius:10px;padding:14px;min-height:78px;margin:10px 0}
.spd button{flex:1}
.spd .on{background:var(--accent);color:#1a1208}
/* sorting */
.hall{position:relative;height:210px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hall canvas{position:absolute;inset:0;width:100%;height:100%}
.caller{position:absolute;left:0;right:0;bottom:16px;text-align:center}
#callName{font-family:Cinzel;font-size:24px;text-shadow:0 2px 8px #000}
#callHouse{font-family:Cinzel;font-size:30px;font-weight:700;height:40px;text-shadow:0 2px 10px #000}
.hboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.hcol{border-radius:6px;padding:6px;min-height:160px;background:rgba(0,0,0,.25);border-top:5px solid}
.hcol h5{font-family:Cinzel;margin:2px 0 6px;font-size:13px;display:flex;justify-content:space-between}
.hcard{font-size:13px;padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.06);margin-bottom:3px;animation:pop .35s}
.hcard.me{background:var(--accent);color:#1a1208;font-weight:bold}
.hcard.fr::after{content:' ★';color:var(--good)}
.hcard.foe::after{content:' ✦';color:var(--bad)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.hatq{font-style:italic;font-size:18px}
/* title */
#title{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#title h1{font-size:44px;margin:0;color:var(--accent)}
#title .tag{color:var(--dim);font-style:italic;margin:6px 0 26px}
body.titleMode #top,body.titleMode #shell{display:none}
body:not(.titleMode) #title{display:none}
.xmap svg{max-height:82vh;margin:0 auto}
.radar text{font-family:Cinzel;font-size:12px;fill:var(--ink)}
/* ── school year ── */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:1px solid transparent;border-bottom:none;color:var(--dim);padding:7px 14px;font-family:Cinzel;font-size:13px;cursor:pointer;border-radius:6px 6px 0 0}
.tab.on{color:var(--accent);border-color:var(--line);background:var(--panel);margin-bottom:-1px}
.yhead{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:18px;align-items:center}
.hp{display:flex;align-items:center;gap:8px;font-size:13px}.hp span{width:86px}.hp .bar{margin:3px 0}.hp b{width:34px;text-align:right;font-weight:normal}
.notice{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;margin-bottom:6px;font-size:15px}
.planner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.pday{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:6px;padding:6px}
.pday h5{margin:0 0 6px;font-family:Cinzel;font-size:12px;color:var(--accent);display:flex;flex-direction:column}
.pday h5 small{color:var(--dim);font-family:'IM Fell English';font-size:12px}
.lesson{font-size:12px;background:rgba(255,255,255,.05);border-radius:3px;padding:2px 6px;margin-bottom:3px;color:var(--dim)}
.slot{display:block;width:100%;text-align:left;border-radius:4px;padding:5px 6px;margin-top:5px;font-size:13px;line-height:1.2;border:1px dashed var(--line);background:none;color:var(--dim);cursor:pointer;min-height:44px}
.slot small{display:block;font-size:10px;font-family:Cinzel;letter-spacing:.08em;color:var(--dim);opacity:.8}
.slot.empty:hover,.slot.sel{border-color:var(--accent);color:var(--ink)}
.slot.sel{background:rgba(201,162,74,.12)}
.slot.filled{border:1px solid var(--accent2);background:var(--parch);color:var(--parchInk)}
.slot.filled small{color:#6d5a3d}
.slot.filled:hover{text-decoration:line-through}
.slot.locked{cursor:default;border-style:solid;color:var(--ink)}
.slot.detention{border-color:var(--bad);background:rgba(208,101,77,.15)}
.slot.match,.slot.trial,.slot.hogsmeade{border-color:var(--good);background:rgba(143,191,111,.15)}
.mems{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.mem{background:var(--parch);color:var(--parchInk);border-radius:5px;padding:8px 10px;font-size:14px;border-left:4px solid var(--accent2)}
.mem small{display:block;color:#6d5a3d;font-size:11px;font-family:Cinzel}
.recipe{padding-left:22px;margin:0 0 10px}.recipe li{margin:3px 0;color:var(--dim)}.recipe li.cur{color:var(--ink);font-weight:bold}.recipe li.done{text-decoration:line-through;opacity:.6}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.pgroup{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.pgroup h5{margin:0 0 6px;font-family:Cinzel;font-size:12px;color:var(--accent);display:flex;justify-content:space-between}
.pgroup h5 small,.pbtn small{color:var(--dim);font-family:'IM Fell English'}
.pbtn{display:inline-block;margin:2px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;cursor:pointer}
.pbtn:hover{border-color:var(--accent)}.pbtn:disabled{opacity:.35;cursor:default}
.report .rday h5{font-family:Cinzel;color:var(--accent);margin:10px 0 4px;font-size:13px}
.report .rday p{margin:0 0 5px;font-size:15px}
.pp{color:var(--good);font-family:Cinzel;font-size:12px}.pn{color:var(--bad);font-family:Cinzel;font-size:12px}
.kan4{grid-template-columns:repeat(4,1fr)}
.kcard.miss{border-left-color:var(--bad);opacity:.8}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.sub4{font-size:12px;color:var(--accent);margin:14px 0 6px;letter-spacing:.12em;text-transform:uppercase}
.clue{background:var(--parch);color:var(--parchInk);border-radius:4px;padding:6px 9px;margin-bottom:6px;font-size:14px}
.clue span{font-style:italic}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.suspect{border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13px;background:var(--panel2)}
.suspect.cleared{opacity:.5}
.leads{padding-left:18px;font-size:15px;margin:0}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.qtab{width:100%;border-collapse:collapse;font-size:14px}.qtab td,.qtab th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center}.qtab td:first-child{text-align:left}
.susbar{height:6px;background:#000;border-radius:3px;overflow:hidden;margin-bottom:8px}.susbar i{display:block;height:100%;width:0}
.mapwrap{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#e6d3a3}
.mapwrap canvas{display:block;width:100%}
.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92%);background:var(--panel);border:1px solid var(--accent2);border-radius:10px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
@media (max-width:760px){
  #shell{grid-template-columns:1fr}
  #top{gap:6px 12px}
  #chaps{order:3;flex-basis:100%}
  .chip:not(.cur){display:none}
  #side{border-right:none;border-bottom:1px solid var(--line);order:2}
  #main{padding:16px}
  .dgrid,.xgrid{grid-template-columns:1fr}
  .bloods{grid-template-columns:1fr}
  .kan{grid-template-columns:1fr}
  .kcol{min-height:0}
  .hboard{grid-template-columns:repeat(2,1fr)}
  .story h1{font-size:24px}
  .parch ul{columns:1}
  .envelope{font-size:15px;padding:18px}
  .envelope .addr{left:18px;top:22px}
  #title h1{font-size:32px}
  .yhead,.qgrid,.kan4{grid-template-columns:1fr}
  .planner{grid-template-columns:1fr 1fr}
  .palette{grid-template-columns:1fr}
  .suspects{grid-template-columns:1fr}
}
</style>
</head>
<body class="titleMode">
<div id="title"></div>
<header id="top"><span class="brand">HOGWARTS · FIRST YEAR</span><div id="chaps"></div><button id="sndBtn" class="btn ghost small" data-act="sound" title="Music and sound effects">♪ Sound: off</button><span id="purse"></span></header>
<div id="shell"><aside id="side"></aside><main id="main"></main></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
'use strict';
// ───────────────────────── helpers ─────────────────────────
const $=s=>document.querySelector(s);
const rnd=Math.random;
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SICKLE=29, GALLEON=493;
const gs=(g,s,k)=>g*GALLEON+(s||0)*SICKLE+(k||0);
function money(k){k=Math.max(0,Math.round(k));const g=Math.floor(k/GALLEON);k-=g*GALLEON;const s=Math.floor(k/SICKLE);k-=s*SICKLE;const p=[];if(g)p.push(g+'G');if(s)p.push(s+'S');if(k||!p.length)p.push(k+'K');return p.join(' ');}
const P=paras=>paras.map(x=>`<p>${x}</p>`).join('');
const SAVE_KEY='hogwartsSave';

// ───────────────────────── data ─────────────────────────
const TRAITS=['brave','wise','ambit','loyal'];
const TRAIT_NAME={brave:'Courage',wise:'Wit',ambit:'Ambition',loyal:'Loyalty'};
const HOUSES={
  gryffindor:{name:'Gryffindor',trait:'brave',c1:'#8e1b16',c2:'#d3a625',lab:'#e8b83a',beast:'Lion'},
  hufflepuff:{name:'Hufflepuff',trait:'loyal',c1:'#e0ae2c',c2:'#2d2621',lab:'#f0c24a',beast:'Badger'},
  ravenclaw:{name:'Ravenclaw',trait:'wise',c1:'#1c2f66',c2:'#b08a4a',lab:'#8fa9ec',beast:'Eagle'},
  slytherin:{name:'Slytherin',trait:'ambit',c1:'#1f5a33',c2:'#b9c0c2',lab:'#7cc98f',beast:'Serpent'},
};
const H=h=>HOUSES[h].name;
const CHAPTERS=[
  {id:'letter',name:'The Letter'},{id:'diagon',name:'Diagon Alley'},{id:'platform',name:"King's Cross"},
  {id:'express',name:'The Express'},{id:'lake',name:'The Lake'},{id:'sorting',name:'The Sorting'},{id:'feast',name:'The Feast'},{id:'year',name:'First Year'},{id:'year2',name:'Second Year'},{id:'year3',name:'Third Year'},{id:'year4',name:'Fourth Year'},{id:'year5',name:'Fifth Year'},{id:'year6',name:'Sixth Year'},{id:'year7',name:'Seventh Year'},
];
const BLOODS={
  muggle:{name:'Muggle-born',desc:'Nobody in your family has ever done magic. The owls are going to be a shock.',gold:36},
  half:{name:'Half-blood',desc:'One parent is a witch or wizard, the other still jumps when the kettle boils itself.',gold:44},
  pure:{name:'Pure-blood',desc:'An old wizarding family. Expectations are high and the vault is deep.',gold:68},

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}}
function tryLoad(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.version===1)return s;}catch(e){}return null;}
function chapterOf(beat){const b=BEATS[beat];if(!b)return 'letter';return typeof b.ch==='function'?b.ch():b.ch;}
function log(msg){G.log.unshift(msg);if(G.log.length>80)G.log.pop();}
function applyEffects(c){
  if(c.t)for(const k in c.t)G.traits[k]+=c.t[k];
  const f=typeof c.f==='function'?c.f():c.f;
  if(f)for(const k in f){G.friends[k]=(G.friends[k]||0)+f[k];}
  if(c.meet)c.meet.forEach(k=>{if(G.friends[k]==null)G.friends[k]=0;});
  if(c.gold)G.gold=Math.max(0,G.gold+c.gold);
  if(G.year){const Yr=G.year;
    if(c.pts)addPts(c.pts);
    if(c.reg)for(const k in c.reg)bumpReg(k,c.reg[k]);
    if(c.sk)for(const k in c.sk)bumpSkill(k,c.sk[k]);
    if(c.en)bumpEnergy(c.en);
    if(c.clue)addClue(c.clue);
    if(c.det)Yr.detentions+=c.det;
  }
  if(c.fx)c.fx();
  if(c.log)log(typeof c.log==='function'?c.log():c.log);
}
function topFriend(excl){let best=null,bv=0;for(const k in G.friends){if(k===excl||!PEOPLE[k])continue;if(G.friends[k]>bv){bv=G.friends[k];best=k;}}return best;}
function relLabel(v){if(v>=6)return['Best friend','pos'];if(v>=3)return['Friend','pos'];if(v>=1)return['Friendly','pos'];if(v<=-4)return['Enemy','neg'];if(v<=-1)return['Rival','neg'];return['Acquaintance','neu'];}
function compName(){return G.comp?FN(G.comp):null;}
function remainingReqCost(){let c=0;for(const id of REQUIRED){if(G.items[id])continue;if(id==='wand'){c+=WAND_PRICE;continue;}const s=STOCK[ITEM_SHOP[id]].filter(x=>x.id===id);c+=Math.min.apply(null,s.map(x=>x.p));}return c;}
function allPacked(){return REQUIRED.every(id=>G.items[id]==='trunk');}

  hall:{ch:'sorting',title:'The Doors of the Great Hall',
    text:()=>P([`You climb stone steps to a pair of vast oak doors. Inside, the entrance hall is big enough to fit your whole house in, lit by flaming torches. From behind a second set of doors comes the roar of hundreds of voices.`,
      `Professor Penhallow is waiting. "Welcome to Hogwarts. In a few moments you will be Sorted into your houses. <b>Gryffindor</b>, which prizes courage. <b>Hufflepuff</b>, which prizes loyalty and hard work. <b>Ravenclaw</b>, for wit and learning. <b>Slytherin</b>, for ambition and resourcefulness. Your house will be something like your family here. Wait quietly."`,
      G.friends.lucan!=null&&G.friends.lucan<0?`Lucan Ashby-Vane leans towards you. "Hope you've packed for Hufflepuff," he murmurs. "It's where they put the leftovers."`:`Someone behind you whispers that the Sorting involves wrestling a troll. Someone else starts to cry.`,
      'Waiting there, in the torchlight, which house do you find yourself hoping for?']),
    choices:()=>[
      choose('Gryffindor — you want to be the one who steps forward.',{t:{brave:1},fx:()=>{G.hope='gryffindor';}}),
      choose('Hufflepuff — you want people you can count on, and who can count on you.',{t:{loyal:1},fx:()=>{G.hope='hufflepuff';}}),
      choose('Ravenclaw — you want to know everything there is to know.',{t:{wise:1},fx:()=>{G.hope='ravenclaw';}}),
      choose('Slytherin — you want to go far, and you don\'t mind the climb.',{t:{ambit:1},fx:()=>{G.hope='slytherin';}}),
      choose('Honestly? Any of them. You just want to be let in.',{fx:()=>{G.hope=null;}}),
    ],next:'sorting'},
  sorting:{ch:'sorting',type:'sorting'},
  feast:{ch:'feast',title:'The Welcoming Feast',
    text:()=>{
      const mates=Object.keys(PEOPLE).filter(id=>PEOPLE[id].house===G.house&&G.friends[id]!=null);
      const fr=mates.filter(id=>G.friends[id]>=1).map(FN), foes=mates.filter(id=>G.friends[id]<0).map(FN);
      const cheer={gryffindor:'The Gryffindor table erupts — whistles, stamping, somebody bangs a goblet like a drum.',
        hufflepuff:'The Hufflepuff table cheers as if you personally have saved them from something, and a dozen hands reach out to shake yours.',
        ravenclaw:'The Ravenclaw table applauds warmly, and a sixth-year shuffles up to make room with the air of someone making an intelligent decision.',
        slytherin:'The Slytherin table claps, measured and approving, and a prefect gives you a long assessing look before nodding once.'}[G.house];
      return P([cheer,
        fr.length?`${fr.join(' and ')} ${fr.length>1?'are':'is'} already there, waving you into a seat.`:'You slide onto the bench among strangers who, you suspect, won\'t be strangers for long.',
        foes.length?`Unfortunately, so is ${foes.join(' and ')}. Seven years of this, then.`:'',
        `Headmistress Imelda Rookwood rises: a tiny, silver-haired witch with a voice that fills the hall without trying. "Welcome. The forest is forbidden. The third-floor east corridor is out of bounds this year for reasons I shall not explain. The caretaker asks me to remind you that the suits of armour are <i>not</i> for sword-fighting. Tuck in."`,
        `The golden plates fill all at once: roast beef, roast chicken, sausages, Yorkshire puddings, mountains of potatoes, gravy boats the size of real boats, and a plate of something that might be haggis and is definitely still warm. Above you, the ceiling is a copy of the night sky, and the candles float.`]);
    },
    choices:()=>[
      choose('Try a bit of everything, including the dish that moves.',{t:{brave:1},res:'It was a trifle. It was a trifle that wobbled with intent. It was delicious.'}),
      choose('Quiz the nearest prefect about lessons, exams and the library\'s opening hours.',{t:{wise:1},res:'The prefect answers, then gives you a book-list for "if you\'re keen". You are keen.'}),
      choose('Work out which older students really matter, and introduce yourself.',{t:{ambit:1},res:'You learn the name of the Quidditch captain, the Head Girl, and the boy who apparently runs a sweet-smuggling ring out of the owlery.'}),
      choose('Notice the shy first-year at the end of the bench and pull them into the chat.',{t:{loyal:1},res:'By pudding, they\'re laughing louder than anyone.'}),
    ],next:'common'},
  common:{ch:'feast',title:'The Common Room',
    text:()=>P([{gryffindor:`Up seven staircases (two of which swing sideways while you're on them), along a corridor of tapestries, to the portrait of a knight in badly dented armour asleep on his horse. "Password?" he mumbles. "Ember thistle," says the prefect, and the portrait swings open on a round room of scarlet and gold, squashy armchairs, and a fire roaring as if it has something to prove.`,
      ravenclaw:`Up a tall winding stair in the west tower to a door with no handle — only a bronze eagle knocker, which speaks. "What grows larger the more you take away from it?" The prefect waits, eyebrows raised. "A hole," someone says at last. The door opens onto a wide circular room of blue and bronze silk, arched windows over the mountains, and more bookshelves than wall.`,
      slytherin:`Down, and down again, into the dungeons, to a stretch of bare damp stone. "Silver tide," says the prefect, and a door slides open in the rock. The common room lies beneath the lake: long and low, lit with green lamps, carved dark chairs, and tall windows onto black water where something large and patient drifts past the glass.`,
      hufflepuff:`Down a short flight of steps near the kitchens — you can smell tomorrow's bread already — to a stack of huge round barrels in a nook. The prefect taps one in a rhythm you try to memorise, and a lid swings open onto a tunnel. Beyond it lies a low round room like a burrow: honey-coloured wood, yellow and black hangings, copper pots of trailing plants, and a fire that makes everyone look like they've just heard good news.`}[G.house],

function wandDesc(w){w=w||G.wand;if(!w)return 'no wand yet';return `${fmtLen(w.len)} inches, ${w.wood.toLowerCase()} and ${w.core}, ${w.flex}`;}
function fmtLen(l){const f=l%1;return Math.floor(l)+(f===.25?'¼':f===.5?'½':f===.75?'¾':'');}
function makeWand(){return {wood:pick(WOODS).n,core:pick(CORES).n,len:9+Math.floor(rnd()*19)*0.25,flex:pick(FLEX)};}
function startWandTry(){
  const T=G.traits;let best=null,bs=-1e9;
  for(let i=0;i<14;i++){const w=pick(WOODS),c=pick(CORES);const s=T[w.t]+T[c.t]+rnd()*1.5;if(s>bs){bs=s;best={wood:w.n,core:c.n,len:9+Math.floor(rnd()*19)*0.25,flex:pick(FLEX),aff:0.78+rnd()*0.2};}}
  const q=[];const n=1+Math.floor(rnd()*3);for(let i=0;i<n;i++)q.push(makeWand());q.push(best);
  G.wandTry={queue:q,idx:0,msg:null,matched:false};
}
function trySpell(kind,mod){

  const ok=rnd()<chance;

function posAt(t){
  for(let i=0;i<ROUTE.length-1;i++){const a=ROUTE[i],b=ROUTE[i+1];if(t<=b.t){const f=clamp((t-a.t)/(b.t-a.t),0,1);const A=proj(a.lon,a.lat),B=proj(b.lon,b.lat);return {x:A[0]+(B[0]-A[0])*f,y:A[1]+(B[1]-A[1])*f,i};}}
  const L=ROUTE[ROUTE.length-1];const p=proj(L.lon,L.lat);return {x:p[0],y:p[1],i:ROUTE.length-2};
}

  const pts=ROUTE.slice(0,p.i+1).map(r=>proj(r.lon,r.lat).join(','));pts.push(p.x+','+p.y);

  document.getElementById('xclock').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;

  const w=document.getElementById('xwin');const txt=WINDOW[Math.min(p.i,WINDOW.length-1)];if(w.innerHTML!==txt)w.innerHTML=txt;
}
function tickExpress(dt){

const HAT_HIGH={brave:'Plenty of nerve here. You walk towards trouble, not away from it.',wise:'A quick mind, oh yes. Questions stacked on top of questions.',ambit:'And hunger. You want to be somebody, and you\'d work for it.',loyal:'A good, steady heart. You stand by people. That\'s rarer than folk think.'};
const HAT_LOW={brave:'Not reckless, though. You look before you leap — sometimes for rather a long time.',wise:'Not one for the books, I think. You learn by doing.',ambit:'Little interest in climbing over others. Hm.',loyal:'You go your own way. Not a joiner, are you?'};
function openHat(){
  const s=hatScores();const order=Object.keys(s).sort((a,b)=>s[b]-s[a]||(rnd()-.5));
  UI.modal={kind:'hat',stage:'think',order};renderModal();
}
function hatSpeech(order){
  const T=G.traits;const tr=TRAITS.slice().sort((a,b)=>T[b]-T[a]);const s=hatScores();
  const lines=[`The brim drops over your eyes and the hall vanishes. A small voice speaks right inside your ear.`,
    `"Hmm. Hmmmm. Let's see. ${HAT_HIGH[tr[0]]} ${T[tr[1]]>0?HAT_HIGH[tr[1]]:''} ${HAT_LOW[tr[3]]}"`];
  if(s[order[0]]-s[order[1]]<=2)lines.push(`"Difficult. Very difficult. ${H(order[0])} would suit you… but ${H(order[1])}, too. Where to put you?"`);
  else lines.push(`"Oh, I don't think there's much doubt. But I always listen, if you've something to say."`);
  return lines;
}
function hatOptions(order){
  const o=[{mode:'decide',label:'"You decide. You\'re the Hat."'},{mode:'ask',arg:order[0],label:`"${H(order[0])}, please."`},{mode:'ask',arg:order[1],label:`"${H(order[1])}, please."`},{mode:'not',label:`"Not ${H(order[0])}. Anything but that."`}];
  if(G.hope&&G.hope!==order[0]&&G.hope!==order[1])o.push({mode:'ask',arg:G.hope,label:`"I was hoping for ${H(G.hope)}…"`});
  const tf=topFriend();if(tf&&PEOPLE[tf]&&G.friends[tf]>=2)o.push({mode:'friend',arg:tf,label:`"Put me wherever ${FN(tf)} ${G.sort.results.some(r=>r.id===tf)?'went':'goes'}."`});
  return o;
}
function hatDecide(opt,order){
  const s=hatScores(),top=order[0];let house=top,note;
  if(opt.mode==='decide')note='"Very well. Then I know exactly where you belong. Better be…"';
  else if(opt.mode==='ask'){if(s[opt.arg]>=s[top]-4){house=opt.arg;note=opt.arg===top?'"Asking for what I was going to give you anyway! Well, no argument here. Better be…"':'"Is that so? You\'re sure? …Yes, you are sure. That counts for a great deal. Then it had better be…"';}else note=`"${H(opt.arg)}? Ask all you like, but I know what I see, and I don't see much of it. No — better be…"`;}
  else if(opt.mode==='not'){const sec=order[1];if(s[sec]>=s[top]-5){house=sec;note=`"Not ${H(top)}, eh? You'd have done well there… but you've made up your mind, and a made-up mind is half the battle. Better be…"`;}else note='"Oh, you can argue, but you can\'t hide from yourself under a hat. Better be…"';}

  return {house,note};
}
function hatDone(house){

function drawHall(time){
  const cv=document.getElementById('hallCv');if(!cv)return;
  const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;UI.stars=null;}
  const c=cv.getContext('2d');
  if(!UI.stars){UI.stars=[...Array(120)].map(()=>({x:rnd()*w,y:rnd()*h*0.8,r:rnd()*1.2+0.2,p:rnd()*6}));UI.candles=[...Array(34)].map(()=>({x:rnd()*w,y:20+rnd()*(h-90),p:rnd()*6,s:0.6+rnd()*0.6}));}
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#070b1f');g.addColorStop(1,'#1d1838');c.fillStyle=g;c.fillRect(0,0,w,h);
  UI.stars.forEach(s=>{c.globalAlpha=0.4+0.6*Math.abs(Math.sin(time*0.8+s.p));c.fillStyle='#fff';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill();});
  c.globalAlpha=1;
  UI.candles.forEach(k=>{const y=k.y+Math.sin(time*0.9+k.p)*5;const s=k.s;
    const rg=c.createRadialGradient(k.x,y-9*s,0,k.x,y-9*s,16*s);rg.addColorStop(0,'rgba(255,200,100,.55)');rg.addColorStop(1,'rgba(255,200,100,0)');c.fillStyle=rg;c.fillRect(k.x-16*s,y-25*s,32*s,32*s);
    c.fillStyle='#efe6d0';c.fillRect(k.x-2.5*s,y-4*s,5*s,16*s);
    c.fillStyle='#ffd27a';c.beginPath();c.ellipse(k.x,y-8*s+Math.sin(time*9+k.p)*0.6,2.2*s,4.5*s,0,0,7);c.fill();});
  // the stool and hat
  const hx=w/2,hy=h-70;c.fillStyle='#3a2616';c.fillRect(hx-22,hy+22,44,8);c.fillRect(hx-18,hy+30,6,30);c.fillRect(hx+12,hy+30,6,30);
  c.fillStyle='#4a3a28';c.beginPath();c.moveTo(hx-30,hy+22);c.quadraticCurveTo(hx-5,hy-10+Math.sin(time*1.3)*3,hx+8+Math.sin(time)*4,hy-38);c.quadraticCurveTo(hx+6,hy,hx+30,hy+22);c.closePath();c.fill();
  c.fillStyle='#1d140c';c.beginPath();c.ellipse(hx,hy+6,8,2+Math.abs(Math.sin(time*2))*2,0,0,7);c.fill();
}

// ───────────────────────── barrier loop ─────────────────────────
function tickBarrier(dt){
  const B=UI.bar;const mk=document.getElementById('marker');if(!B||!mk||B.locked)return;
  B.pos+=B.dir*B.speed*dt;if(B.pos>1){B.pos=1;B.dir=-1;}if(B.pos<0){B.pos=0;B.dir=1;}
  mk.style.left=(B.pos*100)+'%';
}
function barrierRun(){
  const B=UI.bar;if(!B||B.locked||G.aftermath)return;
  const inZone=Math.abs(B.pos-B.zc)<=G.barrierZone/2;
  if(inZone||G.barrierFails>=2){
    B.locked=true;
    const helped=!inZone;
    if(helped){G.friends.orla=(G.friends.orla||0)+2;log('Mrs Fennimore helped you through the barrier.');}
    else log(G.barrierFails?`Got through the barrier after ${G.barrierFails+1} goes.`:'Went through the barrier first time.');
    G.aftermath=helped?'A plump, kindly witch with a girl your age in tow — radish earrings, dreamy expression — takes pity on you. "First time? Don\'t stop and don\'t be scared, dear. Walk at it with us." You shut your eyes, walk at the brick… and there is no bump. Just a rush of noise and steam. "I\'m Orla," says the girl. "You nearly broke the wall."':
      G.barrierFails?'Third time lucky. Or second. You break into a run, the brick rushes at you — and then it doesn\'t. You\'re through, with a smear of soot on your nose.':'You break into a run, the pillar rushes up at you, you brace for the crunch — and it never comes. Noise and steam burst around you. You did it first time.';
    if(inZone&&!G.barrierFails)G.traits.brave+=1;
    G.pendingNext='platform';save();render();return;
  }
  G.barrierFails++;
  UI.msg=pick(['CLANG. You bounce off solid brick. A Muggle guard looks at you strangely.','Your trolley hits the pillar and everything on it falls off. Deep breaths.','You flinch at the last second and swerve into a bin.'])+` (Attempt ${G.barrierFails})`;
  const t=document.getElementById('track');if(t){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');}
  const m=document.getElementById('barMsg');if(m)m.textContent=UI.msg;
  B.zc=0.45+rnd()*0.35;B.speed*=0.85;
  const z=document.querySelector('.track .zone');if(z)z.style.left=((B.zc-G.barrierZone/2)*100)+'%';
  save();
}

// ───────────── the week ─────────────
function beginWeek(){
  const byDay=[[],[],[],[],[],[],[]];
  STY().forEach(s=>{if(s.wk===Y.week&&(!s.cond||s.cond()))byDay[s.d].push({k:'event',id:s.id,d:s.d});});
  if(Y.week%4===2&&Y.week<31)byDay[1].push({k:'potion',d:1});
  if(Y.week>1&&Y.week<YEAR_END){
    const pool=RAND_EVENTS.filter(e=>(!e.cond||e.cond())&&!(Y.lastEvent[e.id]&&Y.week-Y.lastEvent[e.id]<7));
    const n=rnd()<0.4?2:1;
    for(let i=0;i<n&&pool.length;i++){let tot=pool.reduce((a,e)=>a+(e.w||2),0),r=rnd()*tot,k=0;while(k<pool.length-1&&(r-=(pool[k].w||2))>0)k++;const e=pool.splice(k,1)[0];const d=Math.floor(rnd()*7);byDay[d].push({k:'event',id:e.id,d});}
    enemies().forEach(id=>{if(rnd()<Math.min(0.65,0.2-G.friends[id]*0.08)){const d=Math.floor(rnd()*7);byDay[d].push({k:'enemy',who:id,d});}});
  }
  const fx=fixtureThisWeek();if(fx&&!(Y.locks[5]&&Y.locks[5].kind==='match'))byDay[5].unshift({k:'qsim',fx,d:5});
  const q=[];
  for(let d=0;d<7;d++){
    if(d<5)q.push({k:'lessons',d});
    byDay[d].forEach(x=>q.push(x));
    SLOTS.forEach((s,i)=>{if(s.d!==d)return;const L=Y.locks[i];if(L)q.push({k:L.kind,d,i,arg:L.arg});else if(Y.plan[i])q.push({k:'act',d,i,a:Y.plan[i].a,g:Y.plan[i].g});else q.push({k:'free',d});});
  }
  Y.queue=q;Y.report=[];Y.weekPts=0;Y.phase='running';Y.lastPlan=Y.plan.slice();UI.slotSel=null;
  runQueue();
}
function runQueue(){
  while(Y.queue.length){const it=Y.queue.shift();if(processItem(it)){save();render();return;}}
  Y.active=null;finishWeek();save();render();
}
function completeActive(){Y.active=null;UI.mini=null;runQueue();}
function processItem(it){
  switch(it.k){
    case 'lessons':doLessons(it.d);return false;
    case 'free':bumpEnergy(6);return false;
    case 'act':return doAct(it);
    case 'detention':doDetention(it);return false;
    case 'qsim':simMatch(it.fx);return false;
    case 'enemy':return doEnemy(it);
    case 'event':return startEvent(it);
    case 'duel':Y.active=Object.assign({},it,duelSetup(it));return true;
    case 'match':case 'trial':Y.active=it;return true;
    case 'potion':return startPotion(it);
    case 'hogsmeade':Y.active={k:'hogsmeade',d:it.d,left:2,done:[],sel:null,msg:null};return true;
  }
  return false;
}
function doLessons(d){
  const subs=lessonsOn(d);
  if(Y.energy<8){rep(d,'You wake up feeling dreadful and spend the day in the Hospital Wing drinking something purple. You miss all your lessons.');bumpEnergy(35);subs.forEach(s=>bumpReg(SUBJECTS[s].tch,-0.3));return;}
  const notes=[];let pts=0;
  subs.forEach(s=>{
    const S=SUBJECTS[s],t=S.tch,sk=Y.skill[s];
    let sc=(sk-DIFF())*0.7+TR(S.t)*1.2+Y.regard[t]*1.5+(Y.energy-50)*0.15+rnd()*35;
    if(t==='crane'&&G.house!=='slytherin')sc-=6;
    bumpEnergy(-3);bumpSkill(s,0.4+rnd()*0.6);
    if(sc>=62){pts+=2;addPts(2);bumpReg(t,0.2);if(notes.length<2)notes.push(pick(LESSON_GOOD[s])+ptsTag(2));}
    else if(sc<28){pts-=3;addPts(-3);bumpReg(t,-0.3);if(notes.length<2)notes.push(pick(LESSON_BAD[s])+ptsTag(-3));}
  });
  rep(d,`<b>Lessons:</b> ${subs.map(s=>SUBJECTS[s].s).join(', ')}. ${notes.length?notes.join(' '):'Nothing remarkable happened.'}`);
  checkFavours(d);
}

function doTully(d){

function simMatch(fx){
  const sa=qStrength(fx.a),sb=qStrength(fx.b);let A=0,B=0;
  for(let i=0;i<14;i++){if(rnd()<0.55){if(rnd()<sa/(sa+sb))A+=10;else B+=10;}}
  if(rnd()<sa/(sa+sb))A+=150;else B+=150;
  Y.qresults.push({wk:Y.week,a:fx.a,b:fx.b,sa:A,sb:B});
  const mine=fx.a===G.house||fx.b===G.house;
  rep(5,`<b>Quidditch:</b> ${H(fx.a)} ${A} – ${B} ${H(fx.b)}.${mine?(((fx.a===G.house)===(A>B))?' The common room parties till midnight.':' A long, quiet evening in the common room.'):''}`);
}

function finishWeek(){
  Y.hw.forEach(h=>{if(h.due!==Y.week||h.state==='graded'||h.state==='missed')return;
    const t=SUBJECTS[h.subj].tch;
    if(h.state==='ready'){h.grade=gradeOf(h.q+Y.regard[t]);h.state='graded';const p=GRADE_PTS[h.grade];addPts(p);bumpReg(t,h.grade==='O'||h.grade==='E'?0.3:h.grade==='T'||h.grade==='D'?-0.3:0);rep(4,`Handed in <i>${h.title}</i>: <b>${GRADE_NAME[h.grade]}</b>.${ptsTag(p)}`);}
    else{h.state='missed';addPts(-8);bumpReg(t,-1);rep(4,`<b>Missed homework:</b> you never finished <i>${h.title}</i>. ${TSHORT(t)} is displeased.${ptsTag(-8)}`);}
  });
  Y.mates=0;
  for(const h in HOUSES){const yb=(yn()-1)*3;let g=20+yb+Math.floor(rnd()*26);if(h===G.house)g=16+Math.floor(yb/2)+Math.floor(rnd()*23)+(Y.flags.prefect?3:0)+(Y.flags.headpupil?5:0);if(h==='slytherin')g+=4;Y.points[h]+=g;if(h===G.house)Y.mates=g;}
  if(G.pet&&G.pet.type==='owl')bumpEnergy(2);
  Y.hist.push(Object.assign({wk:Y.week},Y.points));
  Y.phase='report';
}
function nextWeek(){
  Y.week++;Y.report=[];Y.weekPts=0;UI.ytab='week';
  if(Y.week>YEAR_END){G.beat='yearend';finishYear();save();render();window.scrollTo(0,0);return;}
  bumpEnergy(35+(Y.flags.kitchens?5:0));
  Y.plan=Array(9).fill(null);setHomework();prepWeek();Y.phase='plan';save();render();window.scrollTo(0,0);
}
function finishYear(){
  const bonus={hero:100,saved:60,escaped:30}[Y.questResult]||0;
  Y.finalBonus=bonus+(Y.accused===YD().culprit&&bonus?20:0);
  {const P2=Y.points,w2=Object.keys(HOUSES).sort((a,b)=>P2[b]-P2[a])[0];if(w2===G.house)addMemory(`${yearName()}: the House Cup!`,`${H(G.house)} win.`);}

  if(Y.flags.hurt){const f=Y.flags.hurt;G.friends[f]=(G.friends[f]||0)+1;Y.flags.hurtWas=f;Y.flags.hurt=null;}
  Y.points[G.house]+=Y.finalBonus;
  log('The year is over.');
}

function computeExams(){
  Y.exams={};let tot=0;
  ['charms','transfig','potions','herbology','astronomy','defence','history'].forEach(s=>{
    const S=SUBJECTS[s];const sc=(Y.skill[s]-DIFF())*0.85+TR(S.t)*1.2+Y.regard[S.tch]+rnd()*20-10;
    const g=gradeOf(sc);Y.exams[s]=g;const p=Math.round({O:10,E:6,A:3,P:0,D:-3,T:-6}[g]*(yn()===5?1.5:yn()===7?2:1));tot+=p;});
  addPts(tot);log('Sat your first-year exams.');
}

// ───────────── duel ─────────────
function duelSetup(it){
  const o=it.opp==='club'?{n:pick(FILLERS),sk:28+Y.week*0.6+(yn()-1)*6,fav:null}:DUELISTS[it.opp];
  let bonus=0,sk=o.sk;
  if(it.reason==='climax'){sk=YD().bossSk||sk;bonus+=Y.climax*5+(Y.accused===YD().culprit?10:(yn()>=3?-10:0))+Y.party.filter(p=>p!==YD().helper).length*3+(Y.party.indexOf(YD().helper)>=0?15:0)+(YD().bossBonus?YD().bossBonus():0);}
  else if(it.opp==='lucan'||it.opp==='cassius')sk+=(yn()-1)*4;
  const D={stage:'fight',oppName:o.n,sk,fav:o.fav,me:0,them:0,bonus,log:[]};
  D.next=duelPick(D);D.tell=duelTell(D);return D;
}
function duelPick(D){const ks=Object.keys(MOVES);return D.fav&&rnd()<0.45?D.fav:pick(ks);}
function duelTell(D){const truth=rnd()<Math.min(0.9,0.45+G.traits.wise*0.035);return truth?D.next:pick(Object.keys(MOVES));}
function duelSkill(D){return Y.skill.defence*0.6+Y.skill.charms*0.2+TR('brave')+(Y.flags.shield?8:0)+(D.bonus||0);}
function duelMove(m){
  const D=Y.active;if(!D||D.stage!=='fight')return;const o=D.next;let win,txt;
  if(m===o){const a=duelSkill(D)+rnd()*40,b=D.sk+rnd()*40;win=a>=b;txt=`You both go for ${MOVES[m].n.toLowerCase()}. ${win?'Yours is stronger.':'Theirs is stronger.'}`;}
  else{win=MOVES[m].beats===o;txt=`You cast ${MOVES[m].inc}; they cast ${MOVES[o].inc}. ${win?'You win the exchange!':'They win the exchange.'}`;}
  if(win)D.me++;else D.them++;D.log.push((win?'✓ ':'✗ ')+txt);
  if(D.me>=2||D.them>=2){D.stage='done';D.won=D.me>=2;SND.sfx(D.won?'good':'bad');}else{D.next=duelPick(D);D.tell=D.legi?D.next:duelTell(D);D.sure=!!D.legi;}
  save();renderModal();
}
function finishDuel(){
  const D=Y.active,won=D.won;let t;
  if(D.reason==='climax'){
    const saved=Y.party.indexOf(YD().helper)>=0||Y.party.length>=2;
    Y.questResult=won?'hero':saved?'saved':'escaped';
    Y.party.forEach(p=>{if(PEOPLE[p])G.friends[p]=(G.friends[p]||0)+3;});
    t=YD().climax(won,saved);
    if(yn()===2&&Y.flags.hurt){t+=` Far below, in the Hospital Wing, ${hurtName()} sits bolt upright and asks what they've missed.`;G.friends[Y.flags.hurt]+=3;Y.flags.hurtWas=Y.flags.hurt;Y.flags.hurt=null;}
    log(YD().logs[Y.questResult]);addMemory(YD().qtitle,YD().logs[Y.questResult]);
    if(YD().onClimax)YD().onClimax(Y.questResult);
    G.traits.brave+=2;
  }else if(D.reason==='enemy'){
    const caught=rnd()<0.2;
    if(won){G.traits.brave+=1;G.friends[D.opp]-=1;const f=randomFriend();if(f)G.friends[f]+=1;sqCount('duelwin');}else bumpEnergy(-15);
    if(caught){Y.detentions++;addPts(-10);}
    t=(won?`${D.oppName} ends up flat on the Trophy Room floor, wandless. Word gets around by breakfast.`:`You end up upside down with jelly legs while ${D.oppName} laughs. Word gets around by breakfast.`)+(caught?' And then Mr Grimble arrives. Detention, and −10 points.':'');
  }else{
    if(won){bumpSkill('defence',2);addPts(5);if(Y.sq.duelchamp==='active'){Y.flags.duelW=(Y.flags.duelW||0)+1;if(Y.flags.duelW>=2)completeSQ('duelchamp');}sqCount('duelwin');}
    t=won?`You beat ${D.oppName}. The Duelling Club applauds. +5 points.`:`${D.oppName} beats you, fair and square. You learn a lot.`;
  }
  rep(D.d,`<b>Duel with ${D.oppName}:</b> ${t}`);
  D.stage='after';D.res=t;save();renderModal();
}
function modalDuel(){
  const D=Y.active;
  if(D.stage==='after')return `<h2>Duel: ${esc(D.oppName)}</h2><div class="aftermath">${D.res}</div><button class="btn" data-act="yEndActive">Continue</button>`;
  const pips=(n)=>'●'.repeat(n)+'○'.repeat(2-n);
  let h=`<h2>Duel: ${esc(D.oppName)}</h2><div class="row" style="justify-content:space-between;font-family:Cinzel"><span>You ${pips(D.me)}</span><span>${pips(D.them)} ${esc(D.oppName.split(' ')[0])}</span></div>`;
  h+=`<p class="hint">Shield stops a Jinx · a Jinx beats Disarm · Disarm breaks a Shield. The same move twice: the stronger duellist wins. First to two.</p>`;
  if(D.log.length)h+=`<div class="note">${D.log.join('<br>')}</div>`;
  if(D.stage==='done')return h+`<div class="aftermath">${D.won?'You win the duel!':'You lose the duel.'}</div><button class="btn" data-act="yDuelFinish">Continue</button>`;
  h+=`<p>${D.sure?'You <b>know</b> it':'You read them'}: <i>${MOVES[D.tell].tell}</i>…</p><div class="choices">`+Object.keys(MOVES).map(k=>`<button class="choice" data-act="yDuel" data-m="${k}"><b>${MOVES[k].n}</b> — ${MOVES[k].inc}</button>`).join('')+'</div>'+duelSpecialsHtml(D);
  return h;
}

// ───────────── night wander (castle map) ─────────────
function buildGrid(){
  const g=[];for(let y=0;y<MAP_H;y++)g.push(new Array(MAP_W).fill(1));
  const carve=(x1,y1,x2,y2)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)g[y][x]=0;};
  MCORR.forEach(c=>carve(c[0],c[1],c[2],c[3]));
  for(const id in MROOMS){const R=MROOMS[id];carve(R.r[0],R.r[1],R.r[2],R.r[3]);[R.door,R.door2].forEach(dr=>{if(dr&&(!R.locked||Y.flags.unlock3))g[dr[1]][dr[0]]=0;});}

function nightReward2(A,M,quiet){
  let t='';const room=M.room;
  if(room==='gallery'&&Y.week>=5&&addClue('varnish'))t+='Every emptied frame has fresh varnish on it, still faintly tacky, and a tiny restorer\'s mark in the corner: <i>S.F.</i> <b>New clue.</b> ';
  if(room==='restricted'&&Y.week>=12&&addClue('hollowbook'))t+='Chained to a shelf, a book on cursed artefacts: <i>the Hollow Frame</i>, which draws painted people out of their pictures. Only a trained portrait-enchanter can work it. <b>New clue.</b> ';
  if(room==='staff'&&Y.week>=20&&addClue('workshop'))t+='Behind the Staff Room, the restorer\'s workshop: sketches of every emptied portrait, a map of the castle\'s paintings, and a letter signed "O.L." <b>New clue.</b> ';
  if(room==='owlery'&&completeSQ('pipowl'))t+='Wedged in a nest full of stolen socks: Pip\'s letter. <b>Quest complete.</b> ';
  if(room==='potions'&&completeSQ('tobiasbroom'))t+='Tobias\'s broom, stuffed behind a cabinet of pickled things. <b>Quest complete.</b> ';
  if(room==='forest'&&completeSQ('wilfgreen'))t+='The nibbler turns out to be a snuffling, moss-coloured Gorse-hog, very round and very guilty. You shoo it back into the trees. <b>Quest complete.</b> ';
  if(quiet)return t;
  if(A.g==='explore'&&!t){if(!Y.flags.secret0){Y.flags.secret0=true;t='Exploring, you find a passage behind a tapestry that nobody else seems to know about. ';}
    else if(!Y.flags.secret1){Y.flags.secret1=true;t='Exploring, you find a tunnel running under the castle from the dungeons to the kitchens. ';}
    else t=`You explore the ${MROOMS[room].n} by moonlight. The empty frames watch you go. `;}
  if(!t)t=`You make it to the ${MROOMS[room].n} and back without a soul seeing you. `;
  G.traits.brave+=1;return t+'Back in bed before anyone noticed.';
}

Object.assign(EVENTS,{
  hattie:{title:'The Attack',text:()=>{let f=topFriend('lucan');if(!f){f='tobias';if(G.friends.tobias==null)G.friends.tobias=0;}Y.flags.framed=f;
      return `Hattie Emberley, a fourth-year, has been found hexed unconscious on the Trophy Room floor. Three students swear they saw who ran from the room: ${FN(f)}. By lunchtime ${FN(f)} has been suspended from lessons pending a hearing before the Board of Governors at the end of the year. The penalty, if found guilty: expulsion. "I didn't do it," ${FN(f)} tells you, white as paper. "I swear I didn't."`;},
    choices:()=>{const f=FRAMED();return [choose(`"I believe you."`,{t:{loyal:2},f:{[f]:3},clue:'hattie',res:`${FN(f)} breaks down in tears of relief. You're going to prove it. <b>New clue.</b>`}),
      choose('"Then we\'ll find out who did."',{t:{brave:1},f:{[f]:2},clue:'hattie',res:'You start a list that night. <b>New clue.</b>'}),
      choose('"Did you, though?"',{t:{wise:1},f:{[f]:-2},clue:'hattie',res:`${FN(f)} looks at you as if you've slapped them. <b>New clue.</b>`})];}},
  twoplaces:{title:'Where Were You?',text:()=>`Working out the timings with ${FN(FRAMED())}, you realise something: at the exact moment Hattie was attacked, you and ${FN(FRAMED())} were playing Exploding Snap in the common room. Half the house saw you.`,
    choices:()=>[choose('Take it to Professor Hale.',{reg:{hale:1},clue:'twoplaces',res:'Hale listens. "Then somebody was wearing their face," he says quietly. "That\'s not a thing children do." <b>New clue.</b>'}),
      choose('Keep it to yourself for now.',{t:{wise:1},clue:'twoplaces',res:'If someone can wear a face, you don\'t know whose face to trust. <b>New clue.</b>'})]},
  halescar:{title:'Hale',text:()=>'Crossing the Defence corridor at midnight, you hear spells. Through the keyhole: Professor Hale, alone, duelling his own reflection in a tall mirror, white-faced and shaking.',
    choices:()=>[choose('Watch.',{t:{wise:1},clue:'halescar',res:'He fights until he collapses to his knees. Then he covers the mirror with a sheet. <b>New clue.</b>'}),choose('Knock.',{t:{brave:1},reg:{hale:-1},clue:'halescar',res:'Silence. Then: "Go to bed." <b>New clue.</b>'})]},
  halloween4:{title:'Halloween',text:()=>`The Halloween feast is subdued. People stare at the empty seat where ${FN(FRAMED())} should be; ${FN(FRAMED())} eats alone in the dormitory now. Halfway through, a fourth-year yells: someone has just seen ${FN(FRAMED())} in the Entrance Hall. But ${FN(FRAMED())} is upstairs.`,
    choices:()=>[choose('Run to the Entrance Hall.',{t:{brave:1},res:`Nobody's there. But on the flagstones is a single empty phial that smells of pondweed.`}),
      choose('Run upstairs to check on your friend.',{t:{loyal:2},f:()=>({[FRAMED()]:2}),res:`${FN(FRAMED())} is in the dormitory, reading, and bursts into tears when you explain. Someone is doing this on purpose.`}),
      choose('Watch the staff table.',{t:{wise:1},res:'Professor Quennell leans over to murmur something to the Headmistress, smiling. Professor Hale grips the table so hard his knuckles go white.'})]},
  hair:{title:'The Hairbrush',text:()=>`${FN(FRAMED())}'s hairbrush has been stripped clean. Not a single hair left on it. Caught on the dormitory door frame is a long, pale-blond hair.`,
    choices:()=>[choose('Keep the hair as evidence.',{t:{wise:1},clue:'hair',res:'Pale blond. Lucan Ashby-Vane\'s colour. <b>New clue.</b>'}),choose(G.friends.lucan>=1?'Go and ask Lucan about it.':'Go and confront Lucan.',{t:{brave:1},clue:'hair',f:{lucan:G.friends.lucan>=1?0:-1},res:'He stares at the hair. "That\'s not mine. Someone\'s setting me up. Again." <b>New clue.</b>'})]},
  quillbooks:{title:'The Librarian',text:()=>'Sneaking in to return an overdue book, you find Madam Quill the librarian reading at midnight by a single candle, surrounded by forbidden books on transformation draughts.',
    choices:()=>[choose('Slip away unseen.',{t:{wise:1},clue:'quillbooks',res:'You glimpse one of the titles as you go: <i>Draughts of Likeness</i>. <b>New clue.</b>'}),choose('Say good evening.',{t:{brave:1},clue:'quillbooks',res:'She jumps, then smiles thinly. "Couldn\'t sleep, dear? Neither could I." <b>New clue.</b>'})]},
  lucanalibi4:{title:'The Hospital Wing',text:()=>'Checking the Hospital Wing records (it\'s amazing what you can read upside down), you find an entry for the night of the attack: <i>L. Ashby-Vane — broken arm, Quidditch. Kept overnight.</i>',
    choices:()=>[choose('That clears Lucan.',{t:{wise:1},clue:'lucanalibi4',f:{lucan:1},res:'Someone planted that hair. <b>New clue.</b>'})]},
  christmas4:{title:'Christmas',text:()=>`${FN(FRAMED())} has been sent home for Christmas "for their own safety". The castle feels wrong without them.`,
    choices:()=>[choose('Stay and keep investigating.',{t:{brave:1},fx:()=>{if(Y.clues.indexOf('stores')<0&&rnd()<0.5)addClue('stores');},res:()=>'The castle is empty and you can go almost anywhere.'+(Y.clues.indexOf('stores')>=0?' In the Potions stores, which someone left unlocked, two jars are empty: Mirror-moss and lacewing extract.':'')}),
      choose(`Go and visit ${FN(FRAMED())}'s family.`,{t:{loyal:2},f:()=>({[FRAMED()]:3}),en:30,res:`${FN(FRAMED())}'s family is frightened and angry, and very glad to see you.`})]},
  halealibi:{title:'Tea',text:()=>'Professor Mudge mentions over Herbology that she and Professor Hale "sit up together most nights, poor man. The war, you know." You ask about a particular night, and she thinks.',
    choices:()=>[choose('Ask gently.',{t:{loyal:1},clue:'halealibi',res:'"Oh, that night? We were up till two with the camomile. He never left." <b>New clue.</b>'})]},
  quillalibi:{title:'The Catalogue',text:()=>'Madam Quill catches you watching her again and, to your surprise, laughs. She shows you a signed order from the Headmistress: catalogue every confiscated book in the castle, "however unpleasant".',
    choices:()=>[choose('Apologise.',{t:{loyal:1},clue:'quillalibi',res:'"Quite all right, dear. Suspicious minds are useful." She\'s just doing her job. <b>New clue.</b>'})]},
  quennelltea:{title:'Professor Quennell',text:()=>'Professor Quennell asks you to stay after Potions. He is kind, and funny, and he\'s heard about your friend. "Terrible business. If there\'s anything you\'ve found, anything at all, you can tell me. I\'d so like to help."',
    choices:()=>[choose('Tell him what you know.',{reg:{quennell:1},res:'He listens with great interest, asks several very precise questions, and thanks you warmly.'}),
      choose('Say you haven\'t found anything.',{t:{wise:1},res:'"No? Pity." For a moment, his smile doesn\'t reach his eyes.'})]},
  hearing:{title:'The Night Before the Hearing',text:()=>`Tomorrow the Board of Governors decides whether ${FN(FRAMED())} is expelled. Tonight, just after midnight, a scream echoes from the Headmistress's tower, and then silence.`,
    choices:()=>gather('gargoyle',()=>Y.clues.indexOf('halealibi')>=0||Y.regard.hale>=2,'Hale is already running. "Stay close."','Hale tells you to go to your dormitory, then vanishes up the stairs without you.','In the morning you hear the Headmistress was found stunned, and Professor Quennell has disappeared. The hearing is postponed. It is weeks before anyone clears your friend\'s name.')},
  gargoyle:{title:'The Gargoyle',text:()=>'The stone gargoyle guarding the Headmistress\'s stair won\'t move without the password.',
    choices:()=>[trial('Work it out: the Headmistress loves old poetry.',{wise:1},()=>0.35+TR('wise')*0.03+(Y.clues.indexOf('office')>=0?0.3:0),'"Ten Winds," you say. The gargoyle leaps aside.','You try twenty passwords before it grudgingly moves.','twins'),
      trial('Blast it.',{brave:1},()=>0.25+Y.skill.defence/120,'It cracks and slides aside.','It takes three tries and a lot of noise.','twins'),
      helpOpt('priya','Priya already knows it.','"She changes it every Monday, and I bribed a portrait," Priya says. The gargoyle springs aside.','twins')].filter(Boolean)},
  twins:{title:'Two Faces',text:()=>`At the top of the stair, two of ${FN(FRAMED())} are standing in front of you, identical down to the ink-stain on their thumbs. "It's me!" they both cry. "That one's the fake!" One of them is lying.`,
    choices:()=>{const f=FRAMED(),a=G.friends[f]||0;return [
      choose('Ask something only the real one could know.',{fx:()=>{const ok=a>=8||hard(0.4+a*0.05);Y.flags._t=ok;if(ok)Y.climax++;else bumpEnergy(-20);},res:()=>Y.flags._t?`You ask about the night you both got locked in the Owlery. The real ${FN(f)} laughs. The other one hesitates, and bolts.`:'Both of them know the answer. The fake one hexes you before bolting.',then:{k:'event',id:'headmistress'}}),
      trial('Watch their eyes.',{wise:1},()=>0.35+TR('wise')*0.03,'One of them has the wrong-coloured eyes. The draught is wearing off. It bolts.','You can\'t tell. The fake one hexes you and runs.','headmistress')];}},
  headmistress:{title:'The Headmistress\'s Office',text:()=>'Headmistress Rookwood lies stunned on the floor of her office. The Founder\'s Key that always hangs round her neck is gone, and through the far door you hear footsteps running up the tower.',
    choices:()=>[trial('Stay and help her.',{loyal:2},()=>0.4+TR('loyal')*0.03,'Her eyes flutter open. "Top of the tower. Go."','She doesn\'t wake. You leave her as comfortable as you can and run.','accuse4'),
      trial('Run after the footsteps.',{brave:1},()=>0.4+TR('brave')*0.03,'You take the stairs three at a time.','You fall on the spiral stair. Everything hurts.','accuse4')]},
  accuse4:{title:'The Top of the Tower',text:()=>'At the top of the tower, a figure stands with the Founder\'s Key in its hand. Its face ripples as you watch, shifting between a dozen faces, as the draught wears off. Who is it?',
    choices:()=>accuse((ok,s)=>(ok?'"Professor Quennell." ':`"${SUS()[s].split(',')[0]}?" `)+'The faces settle. Professor Quennell, smiling his warm smile. "'+(ok?'Very good.':'Wrong, I\'m afraid.')+' The Key is for my master, C.M. He\'s been waiting a very long time."')},
});
function questLeads4(){const L=[],has=id=>Y.clues.indexOf(id)>=0;
  if(Y.week>=6&&!has('stores'))L.push('Faking someone\'s face takes a potion. What\'s missing from the <b>Potions stores</b>?');
  if(Y.week>=12&&!has('mirrorbook'))L.push('Which potion? Try the <b>Restricted Section</b> or <b>library research</b>.');
  if(Y.week>=15&&!has('tully4'))L.push('Potion ingredients grow in the greenhouses, and <b>Tully</b> sees everything that happens outdoors at night.');
  if(Y.week>=20&&!has('office'))L.push('Someone with a key to the stores. What\'s in the <b>Potions master\'s office</b>, down in the dungeon?');
  if(!L.length)L.push('Keep your eyes open.');return L;}

Object.assign(EVENTS,{
  silent1:{title:'Silence',text:()=>{const f=topFriend('lucan');return `In Charms, ${FN(f)} raises their wand for the simplest spell in the book, and nothing happens. Not a spark. They try again, and again, going white. By the end of the week, four more students' wands have gone silent. All of them the best in their year.`;},
    choices:()=>[choose('Examine the wand.',{t:{wise:1},clue:'silent1',res:'It isn\'t broken. It\'s <i>empty</i>, and it smells faintly of old paper and dust, like a library. <b>New clue.</b>'}),choose('Take them straight to the Hospital Wing.',{t:{loyal:1},clue:'silent1',res:'Matron can find nothing wrong. Their robes smell of dust and old paper. <b>New clue.</b>'})]},
  confiscate:{title:'Inspector Duval',text:()=>'Inspector Duval marches into the Great Hall with two Ministry wizards and a steel case. "Every affected wand will be surrendered for testing. Immediately."',
    choices:()=>[choose('Watch where the case goes.',{t:{wise:1},clue:'confiscate',res:'Up to her office, and then, as far as anyone can tell, nowhere. <b>New clue.</b>'}),choose('Protest.',{t:{brave:1},reg:{duval:-2},clue:'confiscate',res:'"Noted," says Duval, writing your name down. <b>New clue.</b>'})]},
  gethinpast:{title:'Professor Gethin',text:()=>'Priya, who reads the Ministry gazette for fun, slides an old cutting across the table: Rhys Gethin, dismissed from the Department of Mysteries for "unauthorised research into magical exhaustion".',
    choices:()=>[choose('Keep it.',{t:{wise:1},clue:'gethinpast',res:'Magical exhaustion. Silenced wands. <b>New clue.</b>'})]},
  halloween5:{title:'Halloween',text:()=>'During the Halloween feast every candle in the Great Hall dims at once, and a dozen wands along the tables give a sad little fizz. After the feast, crossing the hall, you see a prefect crouched under the Hufflepuff bench. Lucan Ashby-Vane.',
    choices:()=>[choose('Watch what he\'s doing.',{t:{wise:1},clue:'lucanbench',res:'He pockets something small and grey and hurries away. <b>New clue.</b>'}),choose('Challenge him.',{t:{brave:1},clue:'lucanbench',f:{lucan:-1},res:'"Prefect business," he snaps. <b>New clue.</b>'})]},
  lucanalibi5:{title:'Lucan\'s Pockets',text:()=>'Lucan corners you in an empty classroom and turns out his pockets: seven smooth grey pebbles. "Silence Stones. I\'ve been pulling them out of the Great Hall for weeks. Nobody else noticed. I can\'t stop whoever\'s putting them in."',
    choices:()=>[choose('"Let\'s stop them together."',{t:{loyal:1},f:{lucan:3},clue:'lucanalibi5',res:'He actually shakes your hand. <b>New clue.</b>'}),choose('"Why should I trust you?"',{t:{wise:1},clue:'lucanalibi5',res:'"Because I\'m the one holding the stones." Fair point. <b>New clue.</b>'})]},
  christmas5:{title:'Christmas',text:()=>'O.W.L.s in six months, a school full of silent wands, and snow. Stay, or go home?',
    choices:()=>[choose('Stay, and revise.',{t:{wise:1},fx:()=>{for(const s in Y.skill)bumpSkill(s,1.5);},res:'You revise until your eyes cross.'}),choose('Go home.',{t:{loyal:2},en:40,res:'Home. Nobody asks about O.W.L.s. It\'s wonderful.'})]},
  duvalalibi:{title:'The Inspector\'s Office',text:()=>'Inspector Duval summons you to her office. On her desk, the steel case, open: every silenced wand, labelled and tested. "You have been poking about. So have I. My results all point one way: to the library. The Ministry won\'t listen to me."',
    choices:()=>[choose('Tell her what you know.',{t:{loyal:1},reg:{duval:3},clue:'duvalalibi',res:'She listens, and for the first time all year she almost smiles. <b>New clue.</b>'}),choose('Listen, and give nothing away.',{t:{wise:1},clue:'duvalalibi',res:'"Suit yourself." But she lets you see her notes. <b>New clue.</b>'})]},
  silentfriend:{title:'Silenced',text:()=>{const f=topFriend('lucan');Y.active.f=f;return `It gets worse. ${FN(f)} collapses in the library, completely drained of magic, and is taken to the Hospital Wing unable to lift a quill. Matron says it might be permanent.`;},
    choices:()=>{const f=Y.active.f;return [choose('Sit with them.',{t:{loyal:2},fx:()=>{Y.flags.hurt=f;},res:'They squeeze your hand. It\'s all the magic either of you needs.'}),choose('Swear to fix this.',{t:{brave:2},fx:()=>{Y.flags.hurt=f;},res:'You mean it.'})];}},
  gethinalibi:{title:'Gethin\'s Research',text:()=>'Professor Gethin catches you reading about his dismissal. He sighs. "Yes. Magical exhaustion. I was trying to <i>cure</i> it. The Ministry didn\'t like the funding." He presses a small vial into your hand. "If you\'re going to do something stupid, drink this first."',
    choices:()=>[choose('Take it.',{reg:{gethin:2},clue:'gethinalibi',fx:()=>{Y.flags.vial=true;},res:'A restorative. You put it somewhere safe. <b>New clue.</b>'})]},
  careers:{title:'Careers Advice',text:()=>'Fifth-years get careers advice from their Head of House. There\'s a stack of leaflets on the desk. What do you want to do with your life?',
    choices:()=>[['Auror','brave'],['Curse-breaker','brave'],['Healer','loyal'],['Unspeakable, Department of Mysteries','wise'],['Magical creatures (like Tully)','loyal'],['Minister for Magic','ambit'],['Professional Quidditch','brave']].map(c=>choose(c[0]+'.',{t:{[c[1]]:1},fx:()=>{G.career=c[0];},res:`"${c[0]}," your Head of House writes down. "Then work hard at your O.W.L.s."`}))},
  quieting:{title:'The Quieting',text:()=>'O.W.L.s are over. That night, at the stroke of midnight, every wand in the castle goes silent at once. Yours too. Somewhere deep under the library, something enormous has just finished drinking.',
    choices:()=>gather('stacks',()=>Y.clues.indexOf('duvalalibi')>=0||Y.regard.duval>=2,'Duval is already there, wandless and furious. "Then we do it the old way."','Duval orders everyone back to bed. You go the other way.','By morning, the wands come back, weakly. The librarian is gone, and so is a large grey book. Nobody ever explains.',2)},
  stacks:{title:'The Stacks',text:()=>'The library at night, with no light but a candle. The shelves have rearranged themselves into a maze, and the books are flying like frightened birds. Somewhere in here is a book with a grey spine.',
    choices:()=>[trial('Think like a librarian. Follow the catalogue numbers.',{wise:1},()=>0.35+TR('wise')*0.03+(Y.clues.indexOf('catalogue')>=0?0.25:0),'Row G, shelf 9: a door disguised as a bookcase.','You wander for an hour before you find the door.','undercroft'),
      trial('Push straight through.',{brave:1},()=>0.3+TR('brave')*0.03,'You shoulder through the shelves until you find a hidden door.','The books attack you. You make it, bleeding from a dozen paper cuts.','undercroft'),
      helpOpt('orla','Orla has read every book in here.','"Grey spines are Row G," says Orla, pulling you along. "Everyone knows that."','undercroft')].filter(Boolean)},
  undercroft:{title:'Beneath the Library',text:()=>'Behind the door, steps go down and down into the dark, to a channel of black water running under the castle towards the lake. There\'s no bridge.',
    choices:()=>[trial('Swim.',{brave:1},()=>0.3+TR('brave')*0.03+(Y.flags.scale?0.4:0),'The water is freezing. You make it.','The cold nearly finishes you.','giving'),
      trial('Edge along the crumbling wall.',{wise:1},()=>0.35+TR('wise')*0.03,'Handhold by handhold, you make it across.','You fall in halfway.','giving'),
      helpOpt('tobias','Tobias throws you across.','"Trust me," says Tobias, and flings you bodily over the water. Then he jumps.','giving'),
      helpOpt('lucan','Lucan knows the way.','"I followed her here once," Lucan says. "There\'s a ledge." There is.','giving')].filter(Boolean)},
  giving:{title:'The Grey Book',text:()=>'In a vaulted chamber, a huge grey book lies open on a stone lectern, its pages glowing with stolen magic, all of it flowing down through the floor, towards something far below. Your wand is dead in your hand. You need a spark of magic from somewhere.',
    choices:()=>{const pal=Y.party.filter(p=>PEOPLE[p]).length;return [
      Y.flags.vial?choose('Drink Gethin\'s vial.',{fx:()=>{Y.climax++;},res:'Warmth floods through you. Your wand flickers back to life.',then:{k:'event',id:'accuse5'}}):null,
      pal?choose('Your friends put their hands on your wand.',{t:{loyal:2},fx:()=>{Y.climax+=pal>=2?2:1;},res:'One by one, they give you what little magic they have left. Your wand blazes.',then:{k:'event',id:'accuse5'}}):null,
      trial('Dig deep. Find it yourself.',{brave:1},()=>0.3+TR('brave')*0.02+TR('loyal')*0.02,'Somewhere under the silence there\'s still something that\'s yours. Your wand sparks.','You find a spark, barely.','accuse5',-25)].filter(Boolean);}},
  accuse5:{title:'The Keeper of the Book',text:()=>'A figure steps out from behind the lectern, grey robes, grey hair pinned up with a pencil, holding a wand that blazes with a hundred students\' stolen magic. Who is it?',
    choices:()=>accuse((ok,s)=>(ok?'"Madam Quill." ':`"${SUS()[s].split(',')[0]}?" `)+'The librarian smiles. "'+(ok?'Clever child.':'No, dear.')+' Marguerite Quill Morrow. My father, Corvin Morrow, was a student here once. They expelled him for trying to reach the Heart of Hogwarts. Next year, he takes it."')},
});
function questLeads5(){const L=[],has=id=>Y.clues.indexOf(id)>=0;
  if(Y.week>=5&&!has('stone'))L.push('The silences started in the <b>Great Hall</b>. Look under the benches, at night.');
  if(Y.week>=12&&!has('stonebook'))L.push('What drinks magic? The <b>Restricted Section</b>, or <b>library research</b>.');
  if(Y.week>=15&&!has('tully5'))L.push('Ask <b>Tully</b> who has been down by the lake at night.');
  if(Y.week>=20&&!has('catalogue'))L.push('Every silenced student used the <b>library</b>. What does its catalogue say?');
  if(!L.length)L.push('Keep your eyes open.');return L;}
