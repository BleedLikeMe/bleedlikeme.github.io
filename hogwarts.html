Object.assign(EVENTS,{
  dimming:{title:'The Grey Ceiling',text:()=>'At the start-of-term breakfast, the enchanted ceiling of the Great Hall is grey. Not cloudy; <i>grey</i>, like ash. The torches gutter in the corridors. The staircases move slowly, grinding, as if they\'re tired.',
    choices:()=>[choose('Put your hand on the castle wall.',{t:{loyal:1},clue:'dimming',res:'Deep inside the stone, faint and slow, something beats like a failing heart. <b>New clue.</b>'}),choose('Ask a teacher what\'s wrong.',{t:{wise:1},clue:'dimming',res:'Nobody will give you a straight answer. That tells you plenty. <b>New clue.</b>'})]},
  stroudcorridor:{title:'Old Habits',text:()=>'Professor Stroud is back: greyer, limping worse, and teaching Defence "because somebody has to". At midnight, you see him slip into the old third-floor corridor, exactly as you did in your first year.',
    choices:()=>[choose('Watch.',{t:{wise:1},clue:'stroudcorridor',res:'He doesn\'t come out till dawn. <b>New clue.</b>'}),choose('Follow him in.',{t:{brave:1},clue:'stroudcorridor',reg:{stroud:-1},res:'"Still nosy," he growls, without turning round. "Good. Go to bed." <b>New clue.</b>'})]},
  governor:{title:'The Governor',text:()=>`Octavian Ashby-Vane, Lucan's father and a school governor, storms out of the Headmaster's office. "Hand this castle to the Ministry, Penhallow, before it falls down around these children!" ${G.friends.lucan>=3?'Lucan, beside you, looks sick.':'Lucan watches from the stairs, expressionless.'}`,
    choices:()=>[choose('Note it down.',{t:{wise:1},clue:'governor',res:'Why does he want control of the castle so badly? <b>New clue.</b>'}),choose(G.friends.lucan>=1?'Ask Lucan what\'s going on.':'Watch Lucan.',{t:{loyal:1},clue:'governor',res:G.friends.lucan>=1?'"I don\'t know," Lucan says. "He won\'t tell me anything." <b>New clue.</b>':'He turns and walks away. <b>New clue.</b>'})]},
  penhallowill:{title:'The Headmaster',text:()=>'Headmaster Penhallow has aged ten years since the summer. At the High Table his hands shake. At night, from the Astronomy Tower, you see a faint light moving alone in the Great Hall.',
    choices:()=>[choose('Watch the light.',{t:{wise:1},clue:'penhallowill',res:'It\'s Penhallow, alone, wand raised to the ceiling, casting something for hours. <b>New clue.</b>'}),choose('Ask him if he\'s well.',{t:{loyal:1},clue:'penhallowill',res:'"Perfectly," he says, and has to hold the back of a chair. <b>New clue.</b>'})]},
  halloween6:{title:'Halloween',text:()=>'At the Halloween feast the candles go out one by one, all the way down the hall, until only the Headmaster\'s is left burning. Something howls out in the Forest.',
    choices:()=>[choose('Watch the staff table in the dark.',{t:{wise:1},res:'Stroud is on his feet. Penhallow is gripping the table. And Professor Achterberg, gentle old Achterberg, is smiling.'}),choose('Keep the younger students calm.',{t:{loyal:1},pts:10,res:'You get a whole table of first-years singing. It helps.'}),choose('Go to the window.',{t:{brave:1},res:'At the edge of the Forest, shapes with no faces stand in a line, watching the castle.'})]},
  oldstars:{title:'Astronomy',text:()=>'Orla, frowning at Professor Achterberg\'s star chart, taps it. "This is wrong. The stars have moved since this was drawn. This is the sky from fifty years ago."',
    choices:()=>[choose('Ask Achterberg about it.',{t:{brave:1},clue:'oldstars',res:'"Old habits," he says, gently, and takes the chart back. His hand is very cold. <b>New clue.</b>'}),choose('Say nothing, and remember it.',{t:{wise:1},clue:'oldstars',res:'Fifty years ago. <b>New clue.</b>'})]},
  grimblekeys:{title:'Grimble\'s Keys',text:()=>'Mr Grimble is sleeping on a camp bed in the corridor outside his own office. "Keys were nicked in September," he snarls. "Every key to every door. I\'m not movin\' till they\'re back."',
    choices:()=>[choose('Sympathise.',{t:{loyal:1},clue:'grimblekeys',res:'He grunts. It\'s almost friendly. Whoever stole those keys, it wasn\'t him. <b>New clue.</b>'})]},
  christmas6:{title:'Christmas',text:()=>'The castle is so cold now that there\'s frost on the inside of the windows. Stay, or go home?',
    choices:()=>[choose('Stay and help Stroud keep watch.',{t:{brave:1},reg:{stroud:2},res:'Long cold nights on the battlements. Stroud tells you war stories. Most of them are true.'}),choose('Go home.',{t:{loyal:2},en:40,res:'Home, warm and light. You don\'t want to go back. You go back.'})]},
  ring:{title:'The Ring',text:()=>`Professor Achterberg reaches across the desk to correct your star chart, and his sleeve rides up. On his finger: a silver ring shaped like a coiled serpent.${Y.clues.indexOf('morrowrecord')>=0?' The same ring as in the photograph of Corvin Morrow.':''}`,
    choices:()=>[choose('Don\'t react.',{t:{wise:1},clue:'ring',res:'You keep your face perfectly still. Your heart is pounding. <b>New clue.</b>'}),choose('Stare at it.',{t:{brave:1},clue:'ring',res:'He sees you staring. He smiles, and pulls his sleeve down. <b>New clue.</b>'})]},
  stroudalibi:{title:'Stroud',text:()=>'Stroud catches you on the stairs. "You\'ve been watching me. Good instincts, wrong target. I came back for one reason: Corvin Morrow. Everything that\'s happened here since your first year has been him. I\'ve guarded that Lantern chamber every night since September."',
    choices:()=>[choose('"Then let me help."',{t:{loyal:1},reg:{stroud:2},clue:'stroudalibi',res:'"Thought you\'d say that," he says. <b>New clue.</b>'})]},
  penhallowalibi:{title:'The Headmaster\'s Secret',text:()=>'You find Penhallow collapsed in the Great Hall at dawn, wand still raised. When he wakes, he tells you the truth: the castle\'s Heart is failing, and he\'s been pouring his own magic into it every night to keep it beating.',
    choices:()=>[choose('Help him up.',{t:{loyal:2},clue:'penhallowalibi',res:'"Don\'t tell anyone," he says. "They\'d panic." It\'s killing him. <b>New clue.</b>'})]},
  governoralibi6:{title:'Octavian Ashby-Vane',text:()=>'Lucan\'s father stops you in the Entrance Hall. "You\'re my son\'s… acquaintance." He looks exhausted. "I want this castle handed to the Ministry because I want him <i>safe</i>. Whatever is coming for Hogwarts, I don\'t want him in it."',
    choices:()=>[choose('Believe him.',{t:{loyal:1},clue:'governoralibi',f:{lucan:1},res:'He\'s just a frightened father. <b>New clue.</b>'})]},
  siege:{title:'The Last Night',text:()=>'Thursday, the last week of term. At midnight the Heart of Hogwarts gives its last, faint beat, and the castle goes dark. The wards fall. At the gates, a hundred faceless shapes come out of the Forest. Somewhere below, someone is going for the Heart.',
    choices:()=>gather('gates',()=>Y.clues.indexOf('stroudalibi')>=0||Y.regard.stroud>=2,'Stroud is already running for the Entrance Hall, wand in hand. "Everyone who can fight, with me!"','Stroud is too busy at the gates to listen. You go without him.','You hide in the dormitory with the younger students while the battle rages. At dawn, Stroud and Penhallow find Morrow at the Heart and drive him off, and the castle stirs back to life. But it is never quite the same.',2)},
  gates:{title:'The Entrance Hall',text:()=>`The great doors are buckling. Faceless things claw at the gaps. ${Y.party.length?'Your friends take their places beside you.':'You stand alone.'}${G.friends.cassius>=1?' And then, from the dark outside, a curse-breaker in travelling clothes cuts his way through to your side: Cassius Marlowe.':''}`,
    choices:()=>[trial('Hold the doors.',{brave:2},()=>0.3+Y.skill.defence/110+(G.friends.cassius>=1?0.15:0),'The doors hold. The faceless things fall back.','The doors burst. You fight them back room by room.','lantern'),
      trial('Lead the younger students to safety first.',{loyal:2},()=>0.35+TR('loyal')*0.03,'Every one of them gets out safe.','You get them out, just.','lantern'),
      helpOpt('tobias','Tobias charges.','Tobias charges the doors roaring. He\'s been waiting six years to do something this stupid, and it works.','lantern')].filter(Boolean)},
  lantern:{title:'The Lantern of the Four',text:()=>`The wards are down. On the third floor, the Lantern of the Four, the one you ${pastQuest(1)==='hero'||pastQuest(1)==='saved'?'saved':'saw'} in your first year, has gone dark. Relight it, and the wards come back.`,
    choices:()=>[pastQuest(1)==='hero'?choose('You know this Lantern. You saved it once.',{fx:()=>{Y.climax++;},res:'You remember exactly how the four panes turned. It blazes back to life.',then:{k:'event',id:'founders'}}):null,
      trial('Work out how to relight it.',{wise:1},()=>0.3+TR('wise')*0.03,'Red, yellow, blue, green, in the order of the founding. It blazes.','You burn your hands before you get it right.','founders'),
      helpOpt('orla','Orla reads the runes.','"It\'s a riddle," says Orla. "They\'re always riddles." She solves it.','founders')].filter(Boolean)},
  founders:{title:'The Founders',text:()=>`In the Great Hall, the Founders' painting is lit. ${pastQuest(2)==='hero'||pastQuest(2)==='saved'?'The four Founders you saved from the Hollow Frame look down at you, and one of them speaks: "We remember you."':'The four painted Founders watch you in silence.'} Beneath them, a stair opens in the floor, down towards the Heart.`,
    choices:()=>[pastQuest(2)==='hero'||pastQuest(2)==='saved'?choose('Ask the Founders for help.',{fx:()=>{Y.climax++;},res:'"Go down," they say together. "We will light your way." A glow goes with you.',then:{k:'event',id:'heart'}}):null,
      trial('Go down into the dark.',{brave:1},()=>0.35+TR('brave')*0.03,'You go down the stair, one step at a time, into the dark.','Something in the dark tears at you on the way down.','heart'),
      (()=>{const pal=Y.party.filter(p=>PEOPLE[p]);return pal.length>=2?choose('Go down together.',{t:{loyal:2},fx:()=>{Y.climax+=2;},res:`${pal.map(FN).join(', ')}: all of you, together, the way it has been since the Hogwarts Express.`,then:{k:'event',id:'heart'}}):null;})()].filter(Boolean)},
  heart:{title:'The Heart of Hogwarts',text:()=>'At the bottom of the stair, in a cavern under the Great Hall, the Heart of Hogwarts hangs in the air: a slow-beating light, very faint. A figure stands before it with a silver ring on its hand, drinking the light in. It turns. Who is it?',
    choices:()=>accuse((ok,s)=>(ok?'"Professor Achterberg. Or should I say, Corvin Morrow." ':`"${SUS()[s].split(',')[0]}?" `)+'The gentle old face melts away into something much older and much colder. "'+(ok?'Well done. Lisle, Sabine, Quennell, my daughter, you beat every one of them. Now you can lose to me.':'Wrong. I\'m Corvin Morrow. And you, child, are too late.')+'"')},
});
function questLeads6(){const L=[],has=id=>Y.clues.indexOf(id)>=0;
  if(Y.week>=5&&!has('heartmap'))L.push('Everything started in the <b>third-floor corridor</b>, six years ago. Go back.');
  if(Y.week>=12&&!has('morrowrecord'))L.push('Who is behind all of it? The school\'s oldest records are in the <b>Restricted Section</b>, or try <b>library research</b>.');
  if(Y.week>=15&&!has('forestmeet'))L.push('Something is out in the Forest. <b>Tully</b> would know.');
  if(Y.week>=16&&!has('observatory'))L.push('What does the new Astronomy teacher keep up his <b>tower</b>?');
  if(!L.length)L.push('Keep your eyes open.');return L;}

// ── per-year night, library, Tully and patrol hooks ──
function yearTully(n,wk,id,txt){return d=>{if(Y.week>=wk&&addClue(id)){rep(d,`<b>Tea at Tully's hut.</b> ${txt} <b>New clue.</b>`);return;}
  rep(d,pick(['Tea with Tully. Kipper the dog is enormous now, and still thinks he\'s a lapdog.','Tea with Tully, who wants to hear everything.','Helped Tully with the pumpkins. Rock cakes as payment.']));};}
function yearResearch(wk,id,txt){return d=>{const w=TR('wise')*0.04+(Y.flags.libpass?0.15:0)+(Y.flags.glass?0.1:0);
  if(Y.week>=wk&&Y.clues.indexOf(id)<0&&rnd()<0.34+w-0.03*(yn()-1)){addClue(id);rep(d,`<b>Library research.</b> ${txt} <b>New clue.</b>`);return;}
  const s=pick(['charms','transfig','potions','history','astronomy']);bumpSkill(s,2);rep(d,`Library research: nothing useful, but plenty of ${SUBJECTS[s].n}. ${SUBJECTS[s].s} +2.`);};}
function nightFor(map){return (A,M,quiet)=>{let t='';const f=map[M.room];if(f)t+=f()||'';if(quiet)return t;return nightGeneric(A,M,t);};}
const cl=(wk,id,txt)=>()=>Y.week>=wk&&addClue(id)?txt+' <b>New clue.</b> ':'';
const sqd=(id,txt)=>()=>completeSQ(id)?txt+' <b>Quest complete.</b> ':'';

function addMemory(title,txt){G.memories=G.memories||[];G.memories.push({yr:G.year?G.year.num:0,wk:G.year?G.year.week:0,title,txt:txt||''});if(typeof SND!=='undefined')SND.sfx('good');}
function viewMemories(){
  const M=G.memories||[];if(!M.length)return '<div class="card"><p class="hint">Your scrapbook is empty, for now.</p></div>';
  const by={};M.forEach(m=>{(by[m.yr]=by[m.yr]||[]).push(m);});
  return Object.keys(by).sort((a,b)=>a-b).map(y=>`<div class="card" style="margin-bottom:12px"><h3>${+y?YEARS[y].name:'Before Hogwarts'}</h3><div class="mems">${by[y].map(m=>`<div class="mem"><b>${esc(m.title)}</b>${m.wk?`<small>Week ${m.wk}</small>`:''}${m.txt?`<div>${m.txt}</div>`:''}</div>`).join('')}</div></div>`).join('');
}

function startPotion(it){
  const pool=RECIPES.filter(r=>r.yr<=Y.num&&r.yr>=Y.num-1);const ri=RECIPES.indexOf(pick(pool.length?pool:RECIPES.slice(0,1)));
  const R=RECIPES[ri];const hidden=Math.max(0,Math.min(R.steps.length-2,(Y.num-1)-Math.floor(Y.skill.potions/35)));
  const hid={};let k=0;const cand=R.steps.map((s,i)=>i).slice(1);while(k<hidden&&cand.length){const i=cand.splice(Math.floor(rnd()*cand.length),1)[0];hid[i]=1;k++;}
  const A=Object.assign({},it,{k:'potion',r:ri,step:0,cnt:0,mis:0,stepMis:0,hid,log:[],done:false,heat:'off'});

function stepText(s){return s[0]==='add'?`Add ${s[2]} × ${INGR[s[1]]}`:s[0]==='stir'?`Stir ${s[1]==='cw'?'clockwise':'anticlockwise'} ${s[2]} time${s[2]>1?'s':''}`:`Set the heat to ${s[1]}`;}

  const p={O:10,E:6,A:3,P:0,D:-5,T:-8}[g];addPts(p);bumpSkill('potions',g==='O'?4:g==='E'?3:1);const t=SUBJECTS.potions.tch;bumpReg(t,g==='O'?1:g==='E'?0.5:ruined?-0.8:0);

const SND=(()=>{let ctx=null,master=null,on=false,mode='none',timer=null,nextT=0,step=0;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);}return true;}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);}
  function noise(t,d,v,freq){const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*d),ctx.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||800;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);}
  const CH=[[57,64,69,72],[53,60,65,69],[55,62,67,71],[52,59,64,67]];
  function sched(){if(!on||!ctx)return;const now=ctx.currentTime;if(nextT<now)nextT=now+0.05;
    while(nextT<now+0.3){
      if(mode==='castle'){const c=CH[Math.floor(step/8)%4],pat=[0,1,2,3,2,1,2,3];tone(mtof(c[pat[step%8]]),nextT,1.4,'triangle',0.035);if(step%8===0)tone(mtof(c[0]-12),nextT,3.4,'sine',0.05);if(step%16===4&&rnd()<0.6)tone(mtof(c[2]+12),nextT,2,'sine',0.02);nextT+=0.4;}
      else if(mode==='night'){const sus=(UI.mini&&UI.mini.sus)||0,bpm=58+sus*100;tone(52,nextT,0.16,'sine',0.25);tone(48,nextT+0.13,0.18,'sine',0.18);if(step%4===0)tone(mtof(45+[0,3,7,10][Math.floor(step/4)%4]),nextT,2.2,'sine',0.025);nextT+=60/bpm;}
      else if(mode==='match'){noise(nextT,0.9,0.03,500+rnd()*300);if(step%6===0)tone(mtof(60+[0,4,7][step%3]),nextT,0.3,'square',0.015);nextT+=0.45;}
      else nextT+=0.5;step++;}}
  return {
    toggle(){if(!ensure())return false;on=!on;if(on){ctx.resume();nextT=ctx.currentTime+0.05;if(!timer)timer=setInterval(sched,80);}try{localStorage.setItem('hogwartsSound',on?'1':'0');}catch(e){}return on;},
    isOn:()=>on,wanted:()=>{try{return localStorage.getItem('hogwartsSound')==='1';}catch(e){return false;}},
    setMode(m){if(m!==mode){mode=m;step=0;}},
    sfx(n){if(!on||!ctx)return;const t=ctx.currentTime;
      if(n==='click')tone(880,t,0.06,'sine',0.03);
      else if(n==='good')[0,4,7,12].forEach((k,i)=>tone(mtof(72+k),t+i*0.07,0.45,'triangle',0.06));
      else if(n==='bad'){tone(220,t,0.3,'sawtooth',0.04);tone(196,t+0.15,0.45,'sawtooth',0.04);}
      else if(n==='goal')noise(t,1.4,0.22,900);
      else if(n==='spell')for(let i=0;i<7;i++)tone(1100+i*170,t+i*0.03,0.25,'sine',0.035);
      else if(n==='bubble')tone(260+rnd()*260,t,0.12,'sine',0.07);}
  };})();
function soundMode(){if(!G)return 'castle';const A=G.beat==='year'&&Y&&Y.active;if(A&&A.k==='night')return 'night';if(A&&(A.k==='match'||A.k==='trial'))return 'match';return 'castle';}

    choices:()=>[choose('Together, then.',{t:{loyal:2},fx:()=>{Y.climax+=Math.min(3,Math.floor((Y.flags._al||0)/2));},res:'You walk up the beach together.',then:{k:'event',id:'accuse7'}}),

  accuse7:{title:'The Broken Pearl',text:()=>'In the ruins of the old boathouse, the Pearl hangs in the air, whole again, blazing with black light. A figure stands beneath it, arms raised, feeding it every shadow in Hogwarts. Morrow\'s face flickers inside the Pearl like a candle. The figure turns. Who is it?',
    choices:()=>accuse((ok,s)=>(ok?'"Professor Whitlow." ':`"${SUS()[s].split(',')[0]}?" `)+'It\'s Agnes Whitlow, her face young and fierce in the black light. "'+(ok?'Of course it\'s me. I found the Pearl, fifty years ago. I gave it to him.':'No. It was always me.')+' Corvin was the only one who ever understood me. Tonight, I bring him home."')},
});
function questLeads7(){const L=[],has=id=>Y.clues.indexOf(id)>=0;
  if(Y.week>=10&&!has('yearbook'))L.push('Stroud said Morrow had a sweetheart, fifty years ago. Old school photos hang in the <b>Trophy Room</b>.');
  if(Y.week>=12&&!has('pearlbook7'))L.push('How does a broken Pearl mend? The <b>Restricted Section</b>, or <b>library research</b>.');
  if(Y.week>=15&&!has('tully7'))L.push('Who\'s been out on the lake at night? Ask <b>Tully</b>.');
  if(!L.length)L.push('Keep your eyes open.');return L;}
function fates(){
  const F=[],a=k=>G.friends[k];
  if(a('orla')!=null)F.push(`<b>Orla Fennimore</b> ${a('orla')>=5?'becomes a famous explorer, and publishes a very long paper proving the Hogwarts lake has a bottom. She dedicates it to you.':'becomes a magizoologist and sends you postcards from places nobody has heard of.'}`);
  if(a('tobias')!=null)F.push(`<b>Tobias Grange</b> ${a('tobias')>=5?'becomes an Auror, the loudest one in the history of the Ministry.':'plays professional Quidditch as a Beater, and breaks a record for fouls.'}`);
  if(a('priya')!=null)F.push(`<b>Priya Castellane</b> ${G.flags&&G.flags.priyaDeputy?'becomes the youngest Minister for Magic in a century, with you as her first appointment.':a('priya')>=5?'becomes Head of Magical Law Enforcement by thirty, and is plainly just getting started.':'runs a department at the Ministry with terrifying efficiency.'}`);
  if(a('wilf')!=null)F.push(`<b>Wilf Hebden</b> ${a('wilf')>=5?'comes back to Hogwarts as Professor of Herbology, and keeps a toad on his desk.':'runs a nursery of magical plants in the Borders.'}`);
  if(a('lucan')!=null)F.push(`<b>Lucan Ashby-Vane</b> ${a('lucan')>=3?'rebuilds the Ashby-Vane name, and founds a scholarship for Muggle-born students.':a('lucan')<0?'takes his father\'s seat on the Board of Governors, and still won\'t say your name.':'goes into politics, and is annoyingly good at it.'}`);
  if(a('cassius')!=null)F.push(`<b>Cassius Marlowe</b> ${a('cassius')>=1?'becomes the finest curse-breaker in Europe, and sends you a Christmas card every year.':'leaves the country, and nobody hears from him again.'}`);
  if(a('pip')!=null)F.push(`<b>Pip Ashworth</b> ${a('pip')>=5?'becomes Head Girl two years after you left, and still does their hair like yours.':'finishes Hogwarts and, to everyone\'s surprise, becomes a Hit Wizard.'}`);
  const R=rom();if(R.who&&R.status==='together')F.unshift(`<b>You and ${FN(R.who)}</b> ${R.lvl>=8?'are married three years later, in the Hogwarts grounds, with Tully in tears in the front row.':'stay together long after Hogwarts.'}`);
  return F;
}
function careerOutcome(){const ex=Y.exams||{};const vals=Object.values(ex).map(g=>({O:5,E:4,A:3,P:2,D:1,T:0})[g]);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:3;
  const c=G.career||'something wonderful';return avg>=4?`With your N.E.W.T.s you walk straight into your chosen career: <b>${esc(c)}</b>. Within ten years, you're one of the best there is.`:avg>=3?`Your N.E.W.T.s are good enough, and you become <b>${esc(c)}</b> after a few hard years.`:`Your N.E.W.T.s aren't what you hoped, but you find your own way, and a very good one, even if it isn't quite <b>${esc(c)}</b>.`;}
Object.assign(YEARS,{7:{name:'Seventh Year',story:STORY7,clues:CLUES7,suspects:SUSPECTS7,sideq:SIDEQ7,targets:NIGHT_TARGETS7,fixtures:FIXTURES1,culprit:'whitlow',bossSk:98,leads:questLeads7,helper:'vasko',staff:{defence:'vasko',astronomy:'fennimore'},
  qtitle:'The Broken Pearl',qintro:'The halves of the Drowned Pearl have been stolen, shadows are tearing loose at dusk, and something is calling Corvin Morrow home.',
  results:{hero:'Solved. You shattered the Pearl for good and beat Agnes Whitlow.',saved:'Solved. The Pearl was destroyed, with help.',escaped:'The Pearl was destroyed, but Whitlow escaped.',ignored:'You stayed out of it.'},
  short:{hero:'Solved: you beat Whitlow, and Morrow is gone forever',saved:'Solved, with help',escaped:'Whitlow escaped',ignored:'You stayed out of it'},
  feast:{hero:'ending, once and for all, the long shadow of Corvin Morrow',saved:'the courage to cross the lake one last time',escaped:'destroying the Drowned Pearl for good'},
  climax:(won,saved)=>won?'Your last spell as a Hogwarts student strikes the Pearl dead centre. It shatters into black dust. Morrow\'s face screams once inside it and is gone, forever. Whitlow falls to her knees, suddenly old again. Every shadow in Hogwarts flies home.':saved?'Whitlow\'s curse knocks you flat, but '+(Y.party.indexOf('vasko')>=0?'Vasko':'your friends')+' hit the Pearl from every side at once. It bursts into black dust, and Morrow\'s voice is gone for good.':'Whitlow throws you aside, but with your last strength you hit the Pearl. It shatters. Whitlow flees across the black water, and is never seen again.',
  logs:{hero:'Destroyed the Pearl forever and defeated Agnes Whitlow.',saved:'Helped destroy the Pearl forever.',escaped:'Destroyed the Pearl forever. Whitlow escaped.'},
  bossBonus:()=>(G.past||[]).filter(p=>p.quest==='hero').length*3+(G.friends.cassius>=1?5:0)+(G.friends.lucan>=3?5:0),
  endNote:()=>{const all=(G.past||[]).concat([{num:7,cup:Object.keys(HOUSES).sort((a,b)=>Y.points[b]-Y.points[a])[0],quest:Y.questResult}]);const cups=all.filter(p=>p.cup===G.house).length;
    return `<div class="card" style="margin-top:14px"><h3>Seven Years at Hogwarts</h3>${all.map(p=>`<div class="kv"><span>${YEARS[p.num].name}: ${YEARS[p.num].qtitle}</span><b>${YEARS[p.num].short[p.quest]||'Unsolved'} · Cup: ${H(p.cup)}</b></div>`).join('')}
      <p style="margin-top:10px">${H(G.house)} won the House Cup <b>${cups}</b> time${cups===1?'':'s'} in your seven years.</p></div>
      <div class="card" style="margin-top:14px"><h3>Ten Years Later</h3><p>${careerOutcome()}</p><ul class="leads">${fates().map(f=>`<li>${f}</li>`).join('')}</ul>
      <p style="margin-top:10px"><i>And every year on the first of September, wherever you are, you look up at eleven o'clock and think of a scarlet train pulling out of King's Cross.</i></p></div>`;},
  tully:yearTully(7,15,'tully7','Tully looks at you for a long moment. "Saw Professor Whitlow rowin\' out to the island at midnight. Alone. Didn\'t think anythin\' of it. Now I do."'),
  research:yearResearch(12,'pearlbook7','In the oldest register of dark artefacts: a split Pearl can be rejoined only by the one who first found it, at the water where it was lost.'),
  night:nightFor({trophy:cl(10,'yearbook','Behind a cabinet of dusty cups: a Quidditch photograph from fifty years ago. A young Corvin Morrow, his arm round a laughing girl. Underneath: <i>C. Morrow and A. Whitlow</i>.'),
    restricted:cl(12,'pearlbook7','A split Pearl can be rejoined only by the one who first found it, at the water where it was lost.'),
    greathall:sqd('lastprank','You and Tobias enchant the ceiling to rain confetti in all four house colours at the leaving feast. It is magnificent.'),
    forest:sqd('orlabottom','You row Orla out with a very long weighted line. It hits bottom at two hundred and twelve feet. She screams with joy, and so does something in the water.')}),
  ents:[(M,A,E)=>{M.ents.push(E('Prof. Vasko',[[12,8],[45,8],[45,22],[12,22]],2.5,5.5,'#4a3a7a'));M.ents.push(E('A loose shadow',null,3.4,4,'#1a1a1a'));}],
  trans:{
    summer:{text:()=>P(['The last summer before your last year. The papers call Corvin Morrow\'s defeat "the end of an era". You don\'t feel like the end of anything.',
      Y.flags.prefect?'Your Hogwarts letter is heavier than usual. Something clinks at the bottom of the envelope.':'Your Hogwarts letter comes, the seventh and last.'])},
    alley:{text:()=>P(['Diagon Alley, one last time as a student. You buy your N.E.W.T. books, and on the way out you pass a nervous eleven-year-old clutching a school list, staring at everything with enormous eyes. You smile at them. They smile back.'])},
    train:{text:()=>P([`The last journey north on the Hogwarts Express. ${metFriends(2).length?metFriends(2).map(FN).join(', ')+'.':''} The same compartment. The same trolley. At Glenfinnan, nobody says anything, and everybody looks.`]),
      choices:()=>[choose('Buy everything on the trolley, for old times\' sake.',{en:15,res:'Your first Chocolate Frog card, seven years ago, was Merlin. Today it\'s Merlin again. You laugh till you cry.'}),choose('Walk the train and say hello to the first-years.',{t:{loyal:1},res:'One of them asks if the Sorting Hat hurts. You tell them the truth: only a little, and only in a good way.'}),choose('Sleep. It\'s been a long seven years.',{en:10,res:'You wake up at Hogsmeade with your face on the window.'})]},
    feast:{text:()=>P([`Headmaster Penhallow rises. "Professor Stroud has retired, properly this time, to his garden. Please welcome back Professor Imre Vasko, who will teach Defence Against the Dark Arts." Vasko inclines his head exactly a quarter of an inch, as he did six years ago. Seven Defence teachers in seven years.`,
      '"Professor Achterberg is, for obvious reasons, no longer with us. Please welcome Professor Isolde Fennimore to Astronomy." A dreamy woman with radish earrings waves at the hall. At your side, Orla makes a noise like a dying kettle. "That\'s my <i>aunt</i>."',
      headEligible()?'After the feast, the Headmaster calls you aside and hands you a gold badge. <b>Head of School.</b>':''])}},
}});

function headEligible(){if(!Y||!Y.flags.prefect)return false;const ts=Object.keys(SUBJECTS).filter(s=>s!=='flying').map(s=>SUBJECTS[s].tch);const avg=ts.reduce((a,t)=>a+(Y.regard[t]||0),0)/ts.length;return avg>=1.5||TR('ambit')+TR('loyal')>=24;}
Object.assign(ACT,{
  sound(){SND.toggle();renderTop();},
  pAct(d){potionAct(d.k,d.v);},
  hgSel(d){const A=Y.active;if(!A||A.k!=='hogsmeade')return;A.sel=d.p;A.msg=null;render();},
  hgDo(d){const A=Y.active;if(!A||A.k!=='hogsmeade'||A.left<=0||!A.sel||A.done.indexOf(A.sel)>=0)return;const o=HOGS[A.sel].opts().filter(x=>!x.cond||x.cond())[+d.i];if(!o||G.gold<o.c)return;
    G.gold-=o.c;o.fx();A.left--;A.done.push(A.sel);A.msg=typeof o.r==='function'?o.r():o.r;rep(A.d,`<b>Hogsmeade, ${HOGS[A.sel].n}:</b> ${A.msg}`);
    if(!G.flags)G.flags={};if(!G.flags.hogs){G.flags.hogs=true;addMemory('First trip to Hogsmeade','Snow on every roof.');}save();render();},
  hgLeave(){const A=Y.active;if(!A||A.k!=='hogsmeade')return;if(!A.done.length)rep(A.d,'<b>Hogsmeade:</b> You wander the snowy high street and buy nothing at all. It\'s lovely anyway.');completeActive();},
  qTac(d){const M=UI.mini;if(!M||M.kind!=='match')return;M.tactic=d.t;const o=document.getElementById('matchOver');if(o){o.style.display='none';o.innerHTML='';}},
  yPos(d){if(!Y.team||!QPOS[d.p])return;Y.qpos=d.p;log(`Now playing ${QPOS[d.p]}.`);save();render();},
  yDuelSp(d){duelSpecial(d.s);},
});

// ───────────────────────── loop ─────────────────────────
let lastTs=0;
function loop(ts){
  const dt=Math.min(0.1,(ts-lastTs)/1000||0);lastTs=ts;
  if(G&&BEATS[G.beat]){const t=BEATS[G.beat].type;
    if(t==='barrier')tickBarrier(dt);else if(t==='express')tickExpress(dt);else if(t==='sorting')drawHall(ts/1000);
    else if(t==='year'&&UI.mini){if(UI.mini.kind==='night')tickNight(dt);else if(UI.mini.kind==='match')tickMatch(dt);}}
  if(typeof SND!=='undefined')SND.setMode(soundMode());
  requestAnimationFrame(loop);
}
render();requestAnimationFrame(loop);
</script>
