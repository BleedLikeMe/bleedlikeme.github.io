<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curiouser and Curiouser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d0e;--ink2:#5c4327;--ink3:#8a6c45;--parch:#f2e4c0;--parch2:#e6d09c;--edge:#a8834a;
  --gold:#c9a227;--gold2:#ffd76a;--red:#8b1e1e;--elf:#2f5f4f;--sea:#9fb4a8;--bg:#1a120b;--bg2:#2b1d12;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#140d07 radial-gradient(ellipse at 50% 0%,#3a2716 0%,#140d07 70%);color:var(--ink);
  font-family:'EB Garamond',Georgia,'Times New Roman',serif;font-size:17px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.sview{position:relative}
.sdpad{display:none}
.hidden{display:none!important}

/* header */
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(#2e1f12,#1b120a);
  border-bottom:2px solid #6b4c22;color:#e9d6a6;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:'Cinzel',serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em;color:var(--gold2);
  text-shadow:0 0 8px rgba(255,190,60,.35);white-space:nowrap}
.brand span{display:block;font-size:.62rem;letter-spacing:.3em;color:#b99a62;font-weight:500}
#stats{display:flex;gap:12px;flex:1;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font-size:.9rem;min-width:110px}
.stat .lbl{color:#c8ad78;font-variant:small-caps;letter-spacing:.05em}
.bar{width:70px;height:8px;background:#0e0905;border:1px solid #6b4c22;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.ringicon{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 6px var(--gold);transition:all .5s}
.date{font-style:italic;color:#cdb47f;font-size:.88rem;margin-left:auto;white-space:nowrap}
.hbtns button{background:#3b2815;border:1px solid #7a5a2c;color:#f0dca8;border-radius:6px;padding:4px 10px;font-size:1rem;margin-left:4px}
.hbtns button:hover{background:#4d351c}

/* layout */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;max-width:1440px;margin:0 auto;padding:14px}
.parch{background:var(--parch);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(140,100,40,.18),transparent 55%);
  border:1px solid var(--edge);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,30,.25)}
#stage{padding:18px 26px 26px;min-height:70vh}
#side{display:flex;flex-direction:column;min-height:70vh;max-height:calc(100vh - 90px);position:sticky;top:76px}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
#tabs button{flex:1;background:transparent;border:0;border-right:1px solid rgba(168,131,74,.4);padding:8px 4px;
  font-family:'Cinzel',serif;font-size:.72rem;color:var(--ink2);letter-spacing:.04em}
#tabs button.on{background:rgba(201,162,39,.22);color:var(--ink);font-weight:700}
#panel{padding:12px 14px;overflow-y:auto;flex:1}

/* stage */
.chaphead{text-align:center;margin-bottom:6px}
.chaphead .cn{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.35em;color:var(--ink3)}
.chaphead h2{font-family:'Cinzel',serif;margin:2px 0 0;font-size:1.55rem;color:var(--ink);letter-spacing:.03em}
.chaphead .where{font-style:italic;color:var(--ink2);font-size:.95rem}
.rule{height:10px;margin:8px auto 12px;width:60%;background:radial-gradient(circle,var(--edge) 2px,transparent 3px) center/14px 10px repeat-x;opacity:.7}
.art{margin:0 auto 12px;max-width:760px;cursor:zoom-in;position:relative}
.art svg{width:100%;height:auto;display:block;border-radius:3px}
.art .hint{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--ink2);background:rgba(242,228,192,.85);padding:1px 6px;border-radius:3px}
.text{max-width:760px;margin:0 auto}
.text p{font-size:1.12rem;line-height:1.62;margin:0 0 .85em}
.text p.first::first-letter{font-family:'IM Fell English',serif;float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--red)}
.text .speech{color:#3b2a14}
.text em{color:#4a3518}
.choices{max-width:760px;margin:16px auto 0;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:rgba(255,250,235,.55);border:1px solid var(--edge);border-radius:4px;padding:10px 14px;
  font-size:1.05rem;color:var(--ink);transition:all .15s;position:relative}
.choice:hover{background:#fff8e2;transform:translateX(3px);box-shadow:0 2px 8px rgba(90,60,20,.25)}
.choice .tag{font-size:.75rem;color:var(--ink3);font-variant:small-caps;margin-left:6px}
.choice.ring{border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,215,106,.35),rgba(255,250,235,.5));}
.choice.ring::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-radius:50%;margin-right:8px;vertical-align:-1px;box-shadow:0 0 5px var(--gold)}
.choice.talk::before{content:'❝ ';color:var(--elf)}
.choice.go{font-weight:600}
.choice.game{border-style:double;border-width:3px}
.choice[disabled]{opacity:.45;pointer-events:none}
.choice.disabled-choice{opacity:.55;font-style:italic}
.result{max-width:760px;margin:10px auto;border-left:3px solid var(--edge);padding:6px 14px;background:rgba(255,250,235,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:2px 8px;border-radius:10px;border:1px solid var(--edge);background:#fff5d8}
.chip.good{border-color:#4f7d3a;color:#2f5a1c;background:#eef6dc}
.chip.bad{border-color:#9c3b2b;color:#7a2416;background:#f8e2d8}
.chip.ring{border-color:var(--gold);background:#fff1b8;color:#6b4c00}
.btn{background:linear-gradient(#5b3f1f,#3c2912);color:#f6e4b4;border:1px solid #2a1a0a;border-radius:4px;padding:9px 18px;
  font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.btn:hover{background:linear-gradient(#6d4c26,#4a3317)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--edge);box-shadow:none}
.btn.gold{background:linear-gradient(#e9c45a,#b88d1c);color:#2b1d0e;border-color:#7a5a10}
.center{text-align:center}

/* song card */
.song{max-width:560px;margin:14px auto;padding:14px 22px;background:rgba(255,252,240,.6);border:1px solid var(--edge);
  border-radius:4px;font-family:'IM Fell English',serif;position:relative}
.song h3{font-family:'Cinzel',serif;font-size:1rem;margin:0 0 2px;text-align:center}
.song .by{text-align:center;font-style:italic;font-size:.85rem;color:var(--ink3);margin-bottom:8px}
.song .st{margin:0 0 10px}
.song .ln{display:block;font-size:1.05rem;line-height:1.45;transition:color .2s,background .2s;padding:0 4px;border-radius:3px}
.song .ln.lit{background:rgba(201,162,39,.3);color:#000}
.song .sing{display:block;margin:6px auto 0}

/* side panels */
.ptitle{font-family:'Cinzel',serif;font-size:.95rem;margin:4px 0 8px;color:var(--ink);letter-spacing:.04em}
.char{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--edge)}
.char .av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;color:#fff;font-size:1rem;border:2px solid rgba(0,0,0,.25)}
.char .nm{font-weight:600}
.char .ds{font-size:.85rem;color:var(--ink2);line-height:1.3}
.char .here{font-size:.7rem;color:var(--elf);font-variant:small-caps;margin-left:4px}
.abar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.abar i{position:absolute;top:0;bottom:0;border-radius:3px}
.item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--edge)}
.item .ic{font-size:1.5rem;width:34px;text-align:center}
.item .nm{font-weight:600}.item .ds{font-size:.85rem;color:var(--ink2)}
.songli,.mapli{display:block;width:100%;text-align:left;background:rgba(255,250,235,.5);border:1px solid var(--edge);
  margin-bottom:6px;padding:7px 10px;border-radius:3px;font-size:.95rem;color:var(--ink)}
.songli small{display:block;color:var(--ink3);font-style:italic}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid button{padding:4px;background:rgba(255,250,235,.5);border:1px solid var(--edge);border-radius:3px;font-size:.75rem;color:var(--ink)}
.mapgrid svg{width:100%;height:auto;display:block}
.mapgrid .lock{opacity:.35;pointer-events:none}
.log{font-size:.88rem;line-height:1.35;padding:5px 0;border-bottom:1px dotted rgba(168,131,74,.5)}
.log b{color:var(--ink3);font-weight:400;font-style:italic}
.meta{font-size:.82rem;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .mbox{max-width:1100px;width:100%;max-height:94vh;overflow:auto;position:relative;padding:18px}
#modal .mclose{position:absolute;right:8px;top:6px;background:none;border:0;font-size:1.8rem;color:var(--ink2);z-index:2}

/* toasts */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;align-items:center}
.toast{background:#2b1d0e;color:#f3e2b2;border:1px solid var(--gold);padding:6px 14px;border-radius:16px;font-size:.92rem;
  animation:tin .3s ease-out,tout .5s 2.6s forwards;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.bad{border-color:#c2543f}.toast.good{border-color:#7fae58}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* wraith world flash */
body.wraith #wrap{filter:grayscale(1) blur(1.5px) contrast(1.3) brightness(.7);transition:filter .3s}
#eye{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 9% 18% at 50% 45%,#000 30%,transparent 32%),radial-gradient(ellipse 22% 26% at 50% 45%,#ff7a12 0%,#c22a00 45%,rgba(120,10,0,.6) 60%,transparent 75%)}
body.wraith #eye{opacity:.55}

/* games */
.gwrap{max-width:820px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.ghead .gt{font-family:'Cinzel',serif;font-size:1.1rem}
.ghud{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.ghud b{font-family:'Cinzel',serif}
canvas.gc{width:100%;height:auto;display:block;background:#000;border:2px solid #4a3317;border-radius:4px;touch-action:none}
.gmsg{min-height:1.6em;font-style:italic;text-align:center;margin:8px 0;color:var(--ink2)}
.gbar{height:16px;background:rgba(0,0,0,.15);border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin:4px 0}
.gbar i{display:block;height:100%;transition:width .08s}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin:10px auto}
.dpad button{font-size:1.3rem;border-radius:6px;border:1px solid var(--edge);background:#fff5d8}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:12px;justify-content:center;margin:14px auto}
.pad{height:110px;border-radius:12px;border:3px solid rgba(0,0,0,.3);font-size:2.4rem;color:rgba(255,255,255,.9);transition:filter .1s,transform .1s}
.pad.lit{filter:brightness(1.8) drop-shadow(0 0 14px #fff);transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{padding:10px;border:1px solid var(--edge);background:rgba(255,250,235,.6);border-radius:4px;font-size:1rem}
.opts button:hover{background:#fff8e2}
.riddle{font-family:'IM Fell English',serif;font-size:1.2rem;line-height:1.5;text-align:center;padding:14px;background:rgba(255,252,240,.5);border:1px solid var(--edge);border-radius:4px;white-space:pre-line}
.inline-input{font-family:'IM Fell English',serif;font-size:1.3rem;padding:6px 12px;border:1px solid var(--edge);border-radius:4px;background:#fffaf0;width:220px;text-align:center}
.qkeys{display:flex;gap:10px;justify-content:center;margin:12px 0}
.qkeys button{width:64px;height:64px;font-size:1.8rem;border-radius:8px;border:2px solid var(--edge);background:#fff5d8}
.qkeys button.want{background:#ffe08a;border-color:#a57b00;box-shadow:0 0 12px #ffcc33}
.qprompt{font-size:3.2rem;text-align:center;font-family:'Cinzel',serif;margin:4px 0}
.tcell{cursor:pointer}

/* title */
.titlescr{text-align:center;padding:30px 10px}
.titlescr h1{font-family:'Cinzel',serif;font-size:2.8rem;margin:10px 0 0;letter-spacing:.06em;color:#3b2408}
.titlescr .sub{font-family:'IM Fell English',serif;font-style:italic;font-size:1.25rem;color:var(--ink2)}
.titlescr .verse{font-family:'IM Fell English',serif;font-size:1.1rem;line-height:1.6;margin:18px auto;max-width:480px;color:var(--ink2)}
.titlescr .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ending h2{font-family:'Cinzel',serif;text-align:center;font-size:1.8rem;margin:6px 0}
.etable{margin:10px auto;border-collapse:collapse;font-size:.95rem}
.etable td{padding:3px 10px;border-bottom:1px dotted var(--edge)}

/* the Ring makes you vanish: the world goes grey-gold and thin */
body.wraith #wrap{filter:grayscale(.8) sepia(.4) blur(1.2px) brightness(.82);transition:filter .3s}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);border:1px solid #6b4c00;vertical-align:-3px}
.greedicon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a520 55%,#8a6410);transition:all .5s}
.choice.gold{border:1px solid #b88d1c;background:linear-gradient(90deg,rgba(233,196,90,.35),rgba(255,250,235,.5))}
.choice.gold::before{content:'◆ ';color:#a57b00}
.bid{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px dotted var(--edge)}
.bid .lot{flex:1}.bid .lot b{display:block}.bid .lot small{color:var(--ink2)}
.smaugline{font-family:'IM Fell English',serif;font-size:1.15rem;line-height:1.5;padding:12px 16px;background:rgba(60,10,0,.08);border-left:4px solid #8b1e1e;margin:8px 0}
@media (max-width:900px){
  #top{position:static;padding:8px 12px;gap:8px}
  .brand{flex:1}
  .hbtns{order:2}
  #stats{order:3;flex:0 0 100%;gap:8px 14px}
  .side-here{display:none}
  .sview{overflow:hidden;max-height:62vh;border-radius:4px}
  .sview canvas.gc{width:860px;max-width:none}
  .sdpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin:10px auto 0;user-select:none;-webkit-user-select:none}
  .sdpad button{font-size:1.4rem;border-radius:8px;border:1px solid var(--edge);background:#fff5d8;touch-action:none}
  .sdpad button.on{background:#ffe08a}
  #wrap{grid-template-columns:minmax(0,1fr);padding:8px}
  #stage,#side{min-width:0}
  #side{position:static;max-height:none;min-height:0}
  #stage{padding:14px 14px 20px;min-height:0}
  .date{margin-left:0}
  .stat{min-width:0}.bar{width:48px}
  .text p{font-size:1.05rem}
  .opts{grid-template-columns:1fr}
  .brand{font-size:1.05rem}
}

/* ═══ WONDERLAND: storybook cream, Tenniel ink, the Queen's red, a pool of tears ═══ */
:root{
  --ink:#231a12;--ink2:#53412e;--ink3:#8a7458;--parch:#f6ecd2;--parch2:#ead9b0;--edge:#a88a5a;
  --gold:#b8202a;--gold2:#ffd6d0;--red:#b8202a;--elf:#2d6b74;--sea:#a9cbd0;--bg:#16211f;--bg2:#203230;
}
body{background:#121c1a radial-gradient(ellipse at 50% 0%,#2e4a44 0%,#121c1a 70%)}
#top{background:linear-gradient(#2a3c38,#16211f);border-bottom:3px double #c9a24a;color:#f6ecd2}
.brand{color:#ffe3a0;font-style:italic;font-family:'IM Fell English',serif;font-size:1.45rem;letter-spacing:.02em;text-shadow:0 0 8px rgba(255,220,140,.3)}
.brand span{color:#f0a0a0;font-style:normal;font-family:'Cinzel',serif}
#tabs button.on{background:rgba(184,32,42,.12);color:#8a141c}
.chaphead .cn{color:var(--red)}
.chaphead h2{font-family:'IM Fell English',serif;font-style:italic;font-size:1.7rem}
.text p.first::first-letter{color:var(--red)}
.text .verse{display:block;font-family:'IM Fell English',serif;font-style:italic;margin:6px 0 6px 24px;line-height:1.45;white-space:pre-line;color:#3b2a14}
.text .label{display:inline-block;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.12em;background:#fffaf0;border:1px solid var(--edge);padding:4px 12px;margin:4px 0;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.text .tail{display:block;font-family:'IM Fell English',serif;font-style:italic;margin:6px 0 6px 20px}
.text .tail span{display:block}
.choice.madc{border:1px solid #8a3a9a;background:linear-gradient(90deg,rgba(138,58,154,.14),rgba(255,250,235,.5))}
.choice.madc::before{content:'☾ ';color:#8a3a9a}
.choice.grow::before{content:'⇡ ';color:var(--elf)}
.choice.shrink::before{content:'⇣ ';color:var(--elf)}
.chip.ring{border-color:#8a3a9a;background:#f0e0f4;color:#5a1a6a}
.toast.ring{border-color:#c06ad0}
.sizebox{display:flex;align-items:flex-end;gap:2px;height:22px}
.sizebox i{display:block;width:5px;background:#5a4a3a;border-radius:1px;opacity:.35}
.sizebox i.on{background:#ffd27a;opacity:1}
.comfit{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f4a0c0 60%,#b0507a);vertical-align:-1px}
.wrathicon{font-size:1rem;filter:drop-shadow(0 0 3px #ff4040)}
.mushbar{position:relative;height:28px;background:rgba(0,0,0,.08);border:1px solid var(--edge);border-radius:14px;margin:8px 0}
.mushbar .zone{position:absolute;top:0;bottom:0;background:rgba(45,107,116,.3);border-left:2px solid var(--elf);border-right:2px solid var(--elf)}
.mushbar .me{position:absolute;top:-4px;width:6px;height:34px;background:var(--red);border-radius:3px;transition:left .5s}
/* mad logic: the page tilts and swims */
body.wraith #wrap{filter:hue-rotate(60deg) saturate(1.4);transform:rotate(-.6deg);transition:filter .3s,transform .3s}
#scan{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(138,58,154,.35))}
body.wraith #scan{opacity:1}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Curiouser &amp; Curiouser<span>ALICE'S ADVENTURES IN WONDERLAND</span></div>
  <div id="stats"></div>
  <div class="hbtns"><button id="btnSound" title="Sound effects">♪</button><button id="btnMenu" title="Menu">☰</button></div>
</header>
<main id="wrap">
  <section id="stage" class="parch"></section>
  <aside id="side" class="parch"><nav id="tabs"></nav><div id="panel"></div></aside>
</main>
<div id="modal" class="hidden"><div class="mbox parch"><button class="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="toasts"></div>
<div id="scan"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   CURIOUSER AND CURIOUSER — a game after Lewis Carroll's Alice's Adventures
   in Wonderland (1865), which is in the public domain: its prose, verses and
   riddles are quoted freely. You are Alice. Built on the burglar.html engine.
   Stats (engine keys): hum = Curiosity · health = Wits · sus = the Queen's
   Wrath · food = Comfits · cash = Size (1–9, 5 is your right size).
   ═══════════════════════════════════════════════════════════════════════════ */

// ── UTILITIES ───────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffle(a, r){ r = r || Math.random; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// ── SOUND ───────────────────────────────────────────────────────────────────
const SND = (() => {
  let ctx = null, on = false, master = null, playing = [], lineTimers = [];
  try { on = localStorage.getItem('wonderlandSound') === '1'; } catch (e) {}
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = mf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .25, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05); playing.push(o);
  }
  function noise(t, dur, vol, freq){
    const c = ac(); if (!c) return;
    const b = c.createBuffer(1, Math.max(1, c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 3000;
    const g = c.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); playing.push(s);
  }
  function fx(kind){
    if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    switch (kind){
      case 'click': note(84, t, .06, 'square', .05); break;
      case 'good': note(72, t, .15, 'triangle', .2); note(76, t + .08, .15, 'triangle', .2); note(79, t + .16, .3, 'triangle', .2); break;
      case 'bad': note(52, t, .3, 'sawtooth', .12); note(47, t + .12, .4, 'sawtooth', .12); break;
      case 'ring': note(40, t, 1.4, 'sine', .3); note(47, t, 1.4, 'sine', .15); noise(t, 1.2, .08, 400); break;
      case 'hit': noise(t, .15, .3, 900); break;
      case 'boom': note(30, t, .6, 'sine', .5); noise(t, .4, .25, 200); break;
      case 'firework': noise(t, .5, .25, 1800); note(ri(80, 95), t, .2, 'sine', .08); break;
      case 'splash': noise(t, .35, .2, 1200); break;
      case 'shriek': { const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(500, t + .9);
        g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.05); break; }
      case 'step': noise(t, .05, .12, 500); break;
    }
  }
  function tone(m, dur, type, vol){ if (!on) return; const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  function toneAlways(m, dur, type, vol){ const c = ac(); if (!c) return; note(m, c.currentTime, dur || .3, type, vol); }
  // play a generated melody; onLine(i) fires as each line starts
  function sing(mel, onLine, onEnd){
    stop(); const c = ac(); if (!c) { if (onEnd) onEnd(); return; }
    const beat = 60 / mel.tempo; let t = c.currentTime + .15; const t0 = t;
    mel.lines.forEach((line, li) => {
      lineTimers.push(setTimeout(() => onLine && onLine(li), (t - t0) * 1000 + 150));
      line.forEach(([m, d]) => {
        note(m, t, d * beat * 1.6, mel.voice, .22); note(m + 12, t, d * beat * .8, 'sine', .05);
        if (mel.drum && d >= 1) noise(t, .05, .06, 4000);
        t += d * beat;
      });
      note(mel.root - 12, t - line.reduce((a, n) => a + n[1], 0) * beat, line.reduce((a, n) => a + n[1], 0) * beat, 'sine', mel.drone ? .08 : .03);
      t += beat * .5;
    });
    lineTimers.push(setTimeout(() => { if (onEnd) onEnd(); }, (t - t0) * 1000 + 300));
  }
  function stop(){ lineTimers.forEach(clearTimeout); lineTimers = []; playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = []; }
  return { fx, tone, toneAlways, sing, stop, ac,
    get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('wonderlandSound', v ? '1' : '0'); } catch (e) {} } };
})();

const has = k => G.items.indexOf(k) >= 0;
const flag = k => !!G.flags[k];
const aff = k => G.aff[k] || 0;
const inParty = k => G.party.indexOf(k) >= 0;

// ── EFFECTS ─────────────────────────────────────────────────────────────────
const STAT_NAME = {hum:'Curiosity', health:'Wits', sus:'The Queen\'s Wrath', food:'Comfits', cash:'Size'};
const STAT_MIN = {hum:0, health:0, sus:0, food:0, cash:1};
const STAT_MAX = {hum:100, health:100, sus:100, food:30, cash:9};
function applyFx(fx){
  const out = [];
  if (!fx) return out;
  if (fx.setSize){ fx = Object.assign({}, fx, {cash: fx.setSize - G.stats.cash}); }
  ['hum','health','sus','food','cash'].forEach(k => {
    if (!fx[k]) return;
    const before = G.stats[k];
    G.stats[k] = clamp(before + fx[k], STAT_MIN[k], STAT_MAX[k]);
    const d = G.stats[k] - before; if (!d) return;
    if (k === 'cash'){ out.push({t: d > 0 ? `You grow! Now ${SIZES[G.stats.cash]}.` : `You shrink! Now ${SIZES[G.stats.cash]}.`, c:''}); return; }
    const good = k === 'sus' ? d < 0 : d > 0;
    out.push({t:`${STAT_NAME[k]} ${d > 0 ? '+' : ''}${d}`, c: k === 'sus' && d > 0 ? 'ring' : good ? 'good' : 'bad'});
  });
  if (fx.aff) Object.keys(fx.aff).forEach(k => {
    const v = fx.aff[k]; G.aff[k] = clamp((G.aff[k] || 0) + v, -100, 100);
    const nm = (CHARS[k] ? CHARS[k].n : k).replace(/^The /, '');
    out.push({t:`${nm} ${v > 0 ? '♥+' + v : '♥' + v}`, c: v > 0 ? 'good' : 'bad'});
  });
  [].concat(fx.item || []).forEach(k => { if (!has(k)){ G.items.push(k); out.push({t:'Gained: ' + ITEMS[k].n, c:'good'}); } });
  [].concat(fx.lose || []).forEach(k => { const i = G.items.indexOf(k); if (i >= 0){ G.items.splice(i, 1); out.push({t:'Gone: ' + ITEMS[k].n, c:'bad'}); } });
  [].concat(fx.flag || []).forEach(k => { G.flags[k] = true; });
  if (fx.flags) Object.assign(G.flags, fx.flags);
  [].concat(fx.song || []).forEach(k => { if (learnSong(k)) out.push({t:'Verse remembered: ' + SONGS[k].title, c:'good'}); });
  [].concat(fx.map || []).forEach(k => { if (unlockMap(k)) out.push({t:'New map: ' + MAPS[k].title, c:'good'}); });
  [].concat(fx.meet || []).forEach(k => { if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.join || []).forEach(k => { if (G.party.indexOf(k) < 0) G.party.push(k); if (G.met.indexOf(k) < 0) G.met.push(k); });
  [].concat(fx.leave || []).forEach(k => { const i = G.party.indexOf(k); if (i >= 0) G.party.splice(i, 1); });
  return out;
}
// Mad logic: answering Wonderland in its own sort of sense. The creatures like
// it better; it costs you a little of your Wits. In the stealth map, fading
// like the Cheshire Cat costs the same.
function ringUse(cost){
  G.ringUses++;
  const out = applyFx({health: -Math.round(1.5 * (cost || 4))});
  wraithFlash();
  return out;
}
function wraithFlash(){
  SND.fx('ring');
  document.body.classList.add('wraith');
  setTimeout(() => { if (!UI.ringHeld) document.body.classList.remove('wraith'); }, 1200);
}
function learnSong(k){ if (!SONGS[k] || G.songs.indexOf(k) >= 0) return false; G.songs.push(k); return true; }
function unlockMap(k){ if (!MAPS[k] || G.maps.indexOf(k) >= 0) return false; G.maps.push(k); return true; }
function addLog(t){ G.log.unshift({d:G.date, t}); if (G.log.length > 150) G.log.length = 150; }
function markSeen(map, loc){ if (!G.seen[map]) G.seen[map] = []; if (G.seen[map].indexOf(loc) < 0) G.seen[map].push(loc); }

function toast(chips){
  const box = $('#toasts');
  chips.forEach((c, i) => setTimeout(() => {
    const d = document.createElement('div'); d.className = 'toast ' + (c.c || ''); d.textContent = c.t;
    box.appendChild(d); setTimeout(() => d.remove(), 3300);
  }, i * 220));
}

// ── BEAT ENGINE ─────────────────────────────────────────────────────────────
function failCheck(b, id){
  if (b.ending) return null;
  if (G.stats.health <= 0 && id !== 'mad') return 'mad';
  if (G.stats.sus >= 100 && id !== 'offhead') return 'offhead';
  return null;
}
function goBeat(id){
  const b = BEATS[id];
  if (!b){ console.error('Missing beat', id); return; }
  const re = G.beat === id;
  G.beat = id; G.pending = null;
  if (re){ save(); render(); return; }
  if (b.chapter){ G.chapter = b.chapter; G.chTitle = b.chTitle; G.checkpoint = null; G.checkpoint = snapshot(); }
  let chips = [];
  if (b.date) G.date = b.date;
  if (b.map){ G.map = b.map; unlockMap(b.map); }
  if (b.loc){ G.loc = b.loc; markSeen(G.map, b.loc); }
  if (b.w && G.route[G.route.length - 1] !== b.w) G.route.push(b.w);
  if (b.fx) chips = chips.concat(applyFx(typeof b.fx === 'function' ? b.fx(G) : b.fx));
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) learnSong(sg);
  if (b.travel){
    const need = b.travel;
    if (G.stats.food >= need) chips = chips.concat(applyFx({food:-need}));
    else { const short = need - G.stats.food; chips = chips.concat(applyFx({food:-G.stats.food, health:-6 * short, hum:-2 * short}));
      }
  }
  if (b.enter) b.enter(G);
  if (b.log) addLog(tx(b.log));
  const f = failCheck(b, id); if (f){ save(); return goBeat(f); }
  if (chips.length) toast(chips);
  save();
  render();
  window.scrollTo(0, 0);
}
function visibleChoices(b){ return (b.choices ? tx(b.choices) : []).filter(c => !c.if || c.if(G)); }
function choose(i){
  const b = BEATS[G.beat], c = visibleChoices(b)[i]; if (!c) return;
  SND.fx('click');
  let chips = applyFx(typeof c.fx === 'function' ? c.fx(G) : c.fx);
  if (c.dt) chips = chips.concat(ringUse(c.dt === true ? 3 : c.dt));
  if (c.act) c.act(G);
  let next = typeof c.go === 'function' ? c.go(G) : (c.go || G.beat);
  const f = failCheck(BEATS[next] || {}, next); if (f) next = f;
  const res = tx(c.res);
  if (res){ G.pending = {text:res, chips, next}; save(); render(); window.scrollTo(0, 0); }
  else { if (chips.length) toast(chips); goBeat(next); }
}
function continuePending(){ const n = G.pending.next; G.pending = null; goBeat(n); }

// ── RENDER ──────────────────────────────────────────────────────────────────
function paras(t, first){
  return String(t).split(/\n\s*\n/).map((p, i) => `<p class="${first && i === 0 ? 'first' : ''}">${p.trim()}</p>`).join('');
}
function chipHTML(chips){ return chips && chips.length ? `<div class="chips">${chips.map(c => `<span class="chip ${c.c || ''}">${esc(c.t)}</span>`).join('')}</div>` : ''; }
function locName(map, loc){
  const m = MAPS[map]; if (!m) return ''; const p = m.places.find(p => p.k === loc); return p ? p.n : '';
}
function headerHTML(b){
  return `<div class="chaphead"><div class="cn">CHAPTER ${romanize(G.chapter)}</div><h2>${esc(G.chTitle || '')}</h2>
    <div class="where">${esc(b.title || locName(G.map, G.loc))}</div></div><div class="rule"></div>`;
}
function romanize(n){ const r = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]]; let s = ''; r.forEach(([k, v]) => { while (n >= v){ s += k; n -= v; } }); return s; }
function artHTML(b){
  if (b.art === 'none') return '';
  if (b.art && VIGNETTES[b.art]) return `<div class="art" data-vig="${b.art}">${VIGNETTES[b.art]()}</div>`;
  const map = b.map || G.map;
  return `<div class="art" data-map="${map}">${drawMap(map, {here:G.loc, small:true})}<span class="hint">click to enlarge</span></div>`;
}
function render(){
  renderStats(); renderSide();
  if (!G){ renderTitle(); return; }
  if (UI.game) return;
  const st = $('#stage'), b = BEATS[G.beat];
  if (b.ending){ st.innerHTML = renderEnding(b); wireStage(); return; }
  let h = headerHTML(b);
  if (G.pending){
    h += `<div class="text">${paras(G.pending.text, true)}</div>${G.pending.chips.length ? `<div class="result">${chipHTML(G.pending.chips)}</div>` : ''}
      <div class="choices"><button class="choice go" data-cont>Continue…</button></div>`;
    st.innerHTML = h; wireStage(); return;
  }
  h += artHTML(b);
  h += `<div class="text">${paras(tx(b.text), true)}</div>`;
  const sg = typeof b.song === 'function' ? b.song(G) : b.song; if (sg) h += songCard(sg);
  if (b.game){
    const gc = tx(b.game);
    h += `<div class="choices"><button class="choice game go" data-game>${esc(gc.label || 'Begin')}</button>
      <button class="choice" data-skip>Let the Dormouse decide <span class="tag">skip the game · an average outcome</span></button></div>`;
  } else {
    const cs = visibleChoices(b);
    h += `<div class="choices">${cs.map((c, i) => {
      const cls = ['choice', c.dt ? 'madc' : '', c.talk ? 'talk' : '', c.cls || ''].join(' ');
      return `<button class="${cls}" data-c="${i}">${tx(c.t)}${c.tag ? `<span class="tag">${tx(c.tag)}</span>` : ''}${c.dt ? '<span class="tag">mad logic</span>' : ''}</button>`;
    }).join('')}</div>`;
  }
  st.innerHTML = h; wireStage();
}
function wireStage(){
  const st = $('#stage');
  st.querySelectorAll('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c));
  const cont = st.querySelector('[data-cont]'); if (cont) cont.onclick = continuePending;
  const gb = st.querySelector('[data-game]'); if (gb) gb.onclick = () => startGame(tx(BEATS[G.beat].game));
  const sk = st.querySelector('[data-skip]'); if (sk) sk.onclick = () => { const gc = tx(BEATS[G.beat].game); UI.game = gc; finishGame({win: Math.random() < .55, score: .5, msg:'It all happened, somehow, as things do in dreams.', fx: gc.skipFx}); };
  const art = st.querySelector('.art'); if (art) art.onclick = () => art.dataset.map ? openMap(art.dataset.map) : null;
  st.querySelectorAll('[data-sing]').forEach(el => el.onclick = () => singSong(el.dataset.sing, el.closest('.song')));
  st.querySelectorAll('[data-checkpoint]').forEach(el => el.onclick = restoreCheckpoint);
  st.querySelectorAll('[data-new]').forEach(el => el.onclick = startNew);
  st.querySelectorAll('[data-load]').forEach(el => el.onclick = () => { G = tryLoad(); render(); });
}
function restoreCheckpoint(){
  if (!G.checkpoint) return;
  const cp = G.checkpoint; G = JSON.parse(JSON.stringify(cp)); G.checkpoint = cp; G.pending = null;
  UI.game = null; if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null;
  save(); closeModal(); render(); toast([{t:'Begin at the beginning, and go on till you come to the end: then stop.'}]);
}
function startNew(){ SND.stop(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = newGame(); closeModal(); goBeat('start'); }

// geometry + map drawing (shared with ringbearer.html)
function pointInPoly(x, y, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function smoothPath(pts, closed){
  const L = pts.length, f = n => n.toFixed(1);
  if (L < 3) return 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join('L') + (closed ? 'Z' : '');
  const at = i => closed ? pts[(i + L) % L] : pts[clamp(i, 0, L - 1)];
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  const n = closed ? L : L - 1;
  for (let i = 0; i < n; i++){
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${f(c1x)},${f(c1y)} ${f(c2x)},${f(c2y)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + (closed ? 'Z' : '');
}
function samplePolyline(pts, step){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / step));
    for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}
const INK = '#4a3216', INK2 = '#7a5a30', WATER = '#a8bdb0', WATER_INK = '#5f7f78';
const MAP_CACHE = {};
function mapBase(k, noPlaces){
  const ck = k + (noPlaces ? '|np' : '');
  if (MAP_CACHE[ck]) return MAP_CACHE[ck];
  const m = MAPS[k], r = seeded(hash(k)), W = m.w, H = m.h;
  const dun = !!m.dungeon;
  let s = '';
  // parchment
  s += `<rect width="${W}" height="${H}" fill="${dun ? '#cdbb8e' : '#ecdcb0'}"/>`;
  for (let i = 0; i < 9; i++){ const x = r() * W, y = r() * H, rr = 80 + r() * 220;
    s += `<circle cx="${x | 0}" cy="${y | 0}" r="${rr | 0}" fill="#9a7638" opacity="${(0.03 + r() * .05).toFixed(3)}"/>`; }
  if (dun){ // dwarf-hall grid
    for (let x = 20; x < W; x += 40) s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${INK2}" stroke-width=".4" opacity=".35"/>`;
    for (let y = 20; y < H; y += 40) s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${INK2}" stroke-width=".4" opacity=".35"/>`;
  }
  (m.zones || []).forEach(z => { s += `<path d="${smoothPath(z.p, true)}" fill="${z.c}" opacity=".55" stroke="${INK}" stroke-width="1.2"/>`; });
  (m.dark || []).forEach(p => { s += `<path d="${smoothPath(p, true)}" fill="#3a2a1a" opacity=".16"/>`; });
  (m.water || []).forEach(p => {
    s += `<path d="${smoothPath(p, true)}" fill="${WATER}" stroke="${WATER_INK}" stroke-width="1.6"/>`;
    s += `<path d="${smoothPath(p, true)}" fill="none" stroke="${WATER_INK}" stroke-width=".6" opacity=".5" transform="translate(4,4)"/>`;
  });
  (m.marsh || []).forEach(p => {
    const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
    for (let y = Math.min.apply(0, ys); y < Math.max.apply(0, ys); y += 12)
      for (let x = Math.min.apply(0, xs); x < Math.max.apply(0, xs); x += 16){
        const jx = x + r() * 8, jy = y + r() * 6; if (!pointInPoly(jx, jy, p)) continue;
        s += `<path d="M${(jx - 4).toFixed(1)},${jy.toFixed(1)}h8M${jx.toFixed(1)},${jy.toFixed(1)}v-5M${(jx - 2.5).toFixed(1)},${jy.toFixed(1)}l-1.5,-3.5M${(jx + 2.5).toFixed(1)},${jy.toFixed(1)}l1.5,-3.5" stroke="${INK2}" stroke-width=".8" fill="none"/>`;
      }
  });
  (m.rivers || []).forEach((p, i) => { s += `<path d="${smoothPath(p)}" fill="none" stroke="${WATER_INK}" stroke-width="${i === 1 && k === 'wild' ? 3.2 : 2.2}" stroke-linecap="round"/>`; });
  (m.roads || []).forEach(p => { s += `<path d="${smoothPath(p)}" fill="none" stroke="${dun ? INK : '#8a5a2a'}" stroke-width="${dun ? 9 : 1.6}" ${dun ? 'opacity=".25"' : 'stroke-dasharray="6 4"'} stroke-linecap="round"/>`;
    if (dun) s += `<path d="${smoothPath(p)}" fill="none" stroke="${INK}" stroke-width="1" opacity=".7" stroke-dasharray="2 3"/>`; });
  (m.forest || []).forEach(p => {
    const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
    s += `<path d="${smoothPath(p, true)}" fill="#6b7a3a" opacity=".12"/>`;
    for (let y = Math.min.apply(0, ys) + 6; y < Math.max.apply(0, ys); y += 13)
      for (let x = Math.min.apply(0, xs) + 4; x < Math.max.apply(0, xs); x += 13){
        const jx = x + (r() - .5) * 7, jy = y + (r() - .5) * 6; if (!pointInPoly(jx, jy, p)) continue;

function songMelody(k){
  const s = SONGS[k];
  if (s._mel) return s._mel;
  const SC = {major:[0,2,4,5,7,9,11], mixo:[0,2,4,5,7,9,10], dorian:[0,2,3,5,7,9,10], aeolian:[0,2,3,5,7,8,10]}[s.mode];
  const r = seeded(hash(k)), root = s.mode === 'major' || s.mode === 'mixo' ? 62 : 60;
  const deg2m = d => root + 12 * Math.floor(d / 7) + SC[((d % 7) + 7) % 7];
  const lines = [];
  // one musical phrase per text line; phrases A/B repeat across stanzas
  const phrase = (len, end, seedR) => {
    const out = []; let d = Math.floor(seedR() * 5);
    for (let i = 0; i < len; i++){
      const last = i === len - 1;
      if (last) d = end;
      else { const st = seedR(); d += st < .35 ? 1 : st < .7 ? -1 : st < .85 ? 2 : -2; d = clamp(d, -2, 9); }
      const dur = last ? 2 : (seedR() < .25 && i < len - 2 ? .5 : 1);
      out.push([deg2m(d), dur]);
      if (dur === .5) out.push([deg2m(d + (seedR() < .5 ? 1 : -1)), .5]);
    }
    return out;
  };
  const phrases = [0, 1, 2, 3].map(i => phrase(7 + (i % 2), i === 3 ? 0 : i === 1 ? 4 : 2, seeded(hash(k + i))));
  s.v.forEach(st => st.forEach((ln, i) => lines.push(phrases[(i + (st.length === 2 ? i : 0)) % 4])));
  return (s._mel = {lines, tempo:s.tempo, voice: s.drum ? 'square' : 'triangle', root, drone:!!s.drone, drum:!!s.drum});
}
function songCard(k, full){
  const s = SONGS[k];
  let li = 0;
  const st = s.v.map(stz => `<div class="st">${stz.map(l => `<span class="ln" data-l="${li++}">${esc(l)}</span>`).join('')}</div>`).join('');
  return `<div class="song"><h3>${esc(s.title)}</h3><div class="by">${esc(s.by)}</div>${st}${s.read ? '' : `<button class="btn gold sing" data-sing="${k}">♪ Sing it</button>`}</div>`;
}
function singSong(k, card){
  const mel = songMelody(k), lines = card ? card.querySelectorAll('.ln') : [];
  const btn = card && card.querySelector('.sing');
  if (btn){ if (btn.dataset.on){ SND.stop(); lines.forEach(l => l.classList.remove('lit')); btn.textContent = '♪ Sing it'; delete btn.dataset.on; return; }
    btn.dataset.on = 1; btn.textContent = '■ Stop'; }
  SND.sing(mel, i => { lines.forEach(l => l.classList.remove('lit')); if (lines[i]) lines[i].classList.add('lit'); },
    () => { lines.forEach(l => l.classList.remove('lit')); if (btn){ btn.textContent = '♪ Sing it'; delete btn.dataset.on; } });
}

As you say these words your foot slips, and in another moment, splash! you are up to your chin in salt water. Your first idea is that you have somehow fallen into the sea; but you soon make out that you are in the pool of tears which you wept when you were nine feet high.

"I wish I hadn't cried so much!"

Something is splashing about in the pool a little way off. At first you think it must be a walrus or hippopotamus, but then you remember how small you are now, and you soon make out that it is only a mouse.`,
  fx:{meet:'mouse', lose:'key'},
  choices:[
    {t:'"O Mouse, do you know the way out of this pool?"', fx:{aff:{mouse:6}, flag:'mouseHail'}, res:`The Mouse looks at you rather inquisitively, and seems to you to wink with one of its little eyes, but it says nothing. "Perhaps it doesn't understand English. I daresay it's a French mouse, come over with William the Conqueror."`, if:G => !G.flags.mouseHail},
    {t:'Try French: "Où est ma chatte?"', if:G => G.flags.mouseHail && !G.flags.chatte, dt:3, fx:{aff:{mouse:-15}, flag:'chatte'}, res:`It is the first sentence in your French lesson-book. The Mouse gives a sudden leap out of the water, and seems to quiver all over with fright. "Oh, I beg your pardon! I quite forgot you didn't like cats."\n\n"Not like cats!" cries the Mouse, in a shrill, passionate voice. "Would YOU like cats if you were me?"`},
    talk('dinah', 'Tell the Mouse all about Dinah. She\'s such a dear quiet thing.', `"She sits purring so nicely by the fire, licking her paws and washing her face — and she is such a capital one for catching mice — oh, I beg your pardon!" The Mouse is bristling all over. "We won't talk about her any more if you'd rather not."\n\n"We indeed!" cries the Mouse, trembling down to the end of his tail.`, {aff:{mouse:-10}}),
    {t:'Swim after the Mouse to the shore, with all the other creatures.', go:'shore', fx:{hum:3}}
  ]}
});

// ── III. A CAUCUS-RACE AND A LONG TALE ──────────────────────────────────────
Object.assign(BEATS, {
shore:{chapter:3, chTitle:'A Caucus-Race and a Long Tale', loc:'shore', w:'shore', art:'pool',
  text:`They are indeed a queer-looking party that assemble on the bank: the birds with draggled feathers, the animals with their fur clinging close to them, and all dripping wet, cross, and uncomfortable. There is a Duck and a Dodo, a Lory and an Eaglet, and several other curious creatures.

The first question of course is, how to get dry again. "Ahem!" says the Mouse with an important air. "Are you all ready? This is the driest thing I know. Silence all round, if you please! William the Conqueror, whose cause was favoured by the pope, was soon submitted to by the English —"

"Ugh!" says the Lory, with a shiver.

"In that case," says the Dodo solemnly, rising to its feet, "I move that the meeting adjourn, for the immediate adoption of more energetic remedies — the best thing to get us dry would be a Caucus-race."`,
  fx:{meet:'dodo'},
  choices:[
    talk('what', '"What is a Caucus-race?"', `"Why," says the Dodo, "the best way to explain it is to do it." First it marks out a race-course, in a sort of circle ("the exact shape doesn't matter"), and then all the party are placed along the course, here and there. There is no "One, two, three, and away," but they begin running when they like, and leave off when they like, so that it is not easy to know when the race is over.`, {hum:4}),
    {t:'Take your place on the course.', go:'caucus'}
  ]},
caucus:{title:'The Caucus-race', loc:'caucus', art:'none',
  text:`Round and round. Nobody knows which way is forward. The Duck says it is going one way and runs the other. The Lory insists it is older than you, and must know better.`,
  game:{type:'qte', label:'Run the Caucus-race', n:7, time:1.6, win:'prizes', lose:'prizes', fxWin:{hum:4, health:4}, fxLose:{health:-2},
    lines:['The Dodo shouts "Away!" (or does it?) — run!','The Duck veers left — dodge it!','The Lory is in your way — sidestep!','A puddle! — jump!','The Eaglet cuts across — duck!','The Mouse stops dead to explain William the Conqueror — swerve!','"The race is over!" — stop!'],
    winText:'After about half an hour you are all quite dry again. "But who has won?" The Dodo considers for a long time with one finger pressed upon its forehead, and at last says: "Everybody has won, and all must have prizes."',
    loseText:'You fall over the Duck twice, and are quite dry by the end, if a little muddy. "But who has won?" "Everybody has won," says the Dodo at last, "and all must have prizes."'}},
prizes:{title:'All Must Have Prizes', art:'none',
  text:`"But who is to give the prizes?" quite a chorus of voices asks.

"Why, she, of course," says the Dodo, pointing to you with one finger; and the whole party at once crowd round you, calling out in a confused way, "Prizes! Prizes!"

You have no idea what to do, and in despair you put your hand in your pocket, and pull out a box of comfits (luckily the salt water has not got into it), and hand them round as prizes. There is exactly one a-piece all round.

"But she must have a prize herself, you know," says the Mouse. "What else have you got in your pocket?" — "Only a thimble." — "Hand it over here," says the Dodo. Then they all crowd round you once more, while the Dodo solemnly presents the thimble, saying "We beg your acceptance of this elegant thimble."`,
  fx:{food:12, item:'thimble'},
  choices:[
    {t:'Bow, and take the thimble, looking as solemn as you can.', fx:{aff:{dodo:10}, flag:'bowed'}, if:G => !G.flags.bowed, res:`The whole thing seems very absurd, but they all look so grave that you do not dare to laugh. Everybody cheers.`},
    {t:'"You promised to tell me your history, you know," you say to the Mouse.', go:'tale', fx:{aff:{mouse:6}}}
  ]},
tale:{title:'A Long Tale', art:'none',
  text:`"Mine is a long and a sad tale!" says the Mouse, turning to you, and sighing.

"It IS a long tail, certainly," you say, looking down with wonder at the Mouse's tail; "but why do you call it sad?" And you keep on puzzling about it while the Mouse is speaking, so that your idea of the tale is something like this:

<span class="tail">${['Fury said to a', 'mouse, That he', 'met in the', 'house, "Let', 'us both go', 'to law: I', 'will prose-', 'cute you. —', 'Come, I\'ll', 'take no de-', 'nial; We', 'must have', 'a trial:', 'For really', 'this morn-', 'ing I\'ve', 'nothing', 'to do."', 'Said the', 'mouse to', 'the cur,', '"Such a', 'trial,', 'dear sir,', 'With', 'no jury', 'or judge,', 'would', 'be', 'wast-', 'ing', 'our', 'breath."', '"I\'ll', 'be', 'judge,', 'I\'ll', 'be jury,"', 'said', 'cunning', 'old Fury:', '"I\'ll try', 'the whole', 'cause,', 'and', 'condemn', 'you', 'to', 'death."'].map((w, i) => `<span style="margin-left:${Math.round(40 + 60 * Math.sin(i / 4))}px;font-size:${Math.max(.62, 1.05 - i * .009)}em">${w}</span>`).join('')}</span>`,
  fx:{song:'tale'},
  choices:[
    {t:'"I beg your pardon — you had got to the fifth bend, I think?"', go:'dinahtalk', fx:{aff:{mouse:-10}, hum:3}, res:`"I had NOT!" cries the Mouse, sharply and very angrily.\n\n"A knot!" you say, always ready to make yourself useful, and looking anxiously about you. "Oh, do let me help to undo it!"\n\n"I shall do nothing of the sort," says the Mouse, getting up and walking away. "You insult me by talking such nonsense!"`},
    {t:'Listen properly, all the way to the end.', go:'dinahtalk', fx:{aff:{mouse:10}, health:-2}}
  ]},
dinahtalk:{title:'The Bank', art:'none',
  text:`"I wish I had our Dinah here, I know I do!" you say, to nobody in particular. "She'd soon fetch it back!"

"And who is Dinah, if I might venture to ask the question?" says the Lory.`,
  choices:[
    {t:'"Dinah\'s our cat. And she\'s such a capital one for catching mice, and birds!"', go:'rabbitcall', fx:{health:-4}, res:`This speech causes a remarkable sensation among the party. Some of the birds hurry off at once: one old Magpie begins wrapping itself up very carefully, remarking "I really must be getting home; the night-air doesn't suit my throat!" and a Canary calls out in a trembling voice to its children, "Come away, my dears! It's high time you were all in bed!" On various pretexts they all move off, and you are soon left alone.\n\n"I wish I hadn't mentioned Dinah!"`},
    {t:'"Nobody. Nobody at all." (Better not.)', go:'rabbitcall', fx:{health:4, hum:-2}, res:`They look at you suspiciously, but nobody leaves in a hurry. Still, one by one, they drift off to get properly dry, and before long you are alone on the bank, rather lonely.`}
  ]}
});

// ── IV. THE RABBIT SENDS IN A LITTLE BILL ───────────────────────────────────
Object.assign(BEATS, {
rabbitcall:{chapter:4, chTitle:'The Rabbit Sends in a Little Bill', map:'rabbithouse', loc:'door', w:'rabbithouse', art:'rabbithouse', fx:{setSize:5},
  text:`It is the White Rabbit, trotting slowly back again, and looking anxiously about as it goes, as if it had lost something; and you hear it muttering to itself "The Duchess! The Duchess! Oh my dear paws! Oh my fur and whiskers! She'll get me executed, as sure as ferrets are ferrets! Where CAN I have dropped them, I wonder?"

(You notice that you are your right size again, somehow; and the hall, and the pool, have quite vanished.)

Very soon the Rabbit notices you, and calls out in an angry tone, "Why, Mary Ann, what ARE you doing out here? Run home this moment, and fetch me a pair of gloves and a fan! Quick, now!"

You are so frightened that you run off at once in the direction it points to, without trying to explain the mistake it has made. A neat little house, on the door a bright brass plate with the name ${LB('W. RABBIT')} engraved upon it.`,
  choices:[
    {t:'Hand him the gloves you already have.', if:G => has('gloves'), go:'gloves', fx:{lose:'gloves', aff:{rabbit:12}, hum:-2}},
    {t:'Go upstairs and look for them.', go:'room'}
  ]},
gloves:{title:'The Rabbit\'s Garden', loc:'frames', art:'none',
  text:`The Rabbit snatches the gloves without a word of thanks, puts them on, looks at his watch, says "Oh my ears and whiskers!", and is off. On the garden wall stands a dish of little cakes. "Every time I eat or drink anything, something interesting happens," you think.`,
  choices:[{t:'Eat one of the little cakes.', go:'puppy', cls:'shrink', fx:{setSize:1, hum:4}}]},
room:{title:'The Tidy Little Room', loc:'room', art:'none',
  text:`You find your way into a tidy little room with a table in the window, and on it a fan and two or three pairs of tiny white kid gloves. You take up the fan and a pair of the gloves, and are just going to leave the room, when your eye falls upon a little bottle that stands near the looking-glass. There is no label this time with the words "DRINK ME," but nevertheless you uncork it.

"I know something interesting is sure to happen," you say, "whenever I eat or drink anything; so I'll just see what this bottle does. I do hope it'll make me grow large again, for really I'm quite tired of being such a tiny little thing!"`,
  fx:{item:['fan', 'gloves']},
  choices:[
    {t:'Drink it.', go:'stuck', cls:'grow', fx:{setSize:8, hum:6}},
    {t:'No. Take the gloves and fan to the Rabbit, like a good Mary Ann.', go:'gloves', fx:{lose:['gloves', 'fan'], aff:{rabbit:15}, hum:-6}}
  ]},
stuck:{title:'Rather Too Large', loc:'window', art:'rabbithouse',
  text:`It does indeed, and much sooner than you expected: before you have drunk half the bottle, your head is pressing against the ceiling. You go on growing, and growing, and very soon have to kneel down on the floor; in another minute there is not even room for this, and you try lying down with one elbow against the door. Still you go on growing, and, as a last resource, you put one arm out of the window, and one foot up the chimney.

"It was much pleasanter at home," thinks poor Alice, "when one wasn't always growing larger and smaller. And yet — it's rather curious, you know, this sort of life! When I used to read fairy-tales, I fancied that kind of thing never happened, and now here I am in the middle of one! There ought to be a book written about me, that there ought!"

Outside, the Rabbit is calling for Pat, and Pat, digging for apples, reports "an arm, yer honour!" And then they send Bill the Lizard down the chimney.`,
  fx:{meet:'bill'},
  choices:[
    {t:'When something scratches about in the chimney, give one sharp kick.', go:'pebbles', fx:{aff:{bill:-6}, hum:3}, res:`You hear a general chorus of "There goes Bill!" then the Rabbit's voice alone — "Catch him, you by the hedge!" then silence, and then another confusion of voices — "Hold up his head — Brandy now — Don't choke him — How was it, old fellow?"\n\nLast comes a little feeble, squeaking voice: "Well, I hardly know — No more, thank ye; I'm better now — all I know is, something comes at me like a Jack-in-the-box, and up I goes like a sky-rocket!"`},
    {t:'Keep very still, and let poor Bill have a look.', go:'pebbles', fx:{aff:{bill:10}, health:-4}, res:`A small green face peers down at you out of the soot, shrieks, and is hauled hastily back up by the tail. "It's a giant! A giant in Mr Rabbit's bedroom!" There is a great deal of argument outside.`}
  ]},
pebbles:{title:'Pebbles', art:'none',
  text:`"A barrowful will do, to begin with," says the Rabbit. And next moment a shower of little pebbles comes rattling in at the window, and some of them hit you in the face.

You notice, with some surprise, that the pebbles are all turning into little cakes as they lie on the floor, and a bright idea comes into your head. "If I eat one of these cakes, it's sure to make SOME change in my size; and as it can't possibly make me larger, it must make me smaller, I suppose."`,
  choices:[{t:'Swallow one of the cakes.', go:'puppy', cls:'shrink', fx:{setSize:1, lose:['gloves', 'fan'], hum:3}}]},
puppy:{title:'The Wood', map:'wood', loc:'puppy', w:'mushroom', art:'none',
  text:`You are delighted to find that you begin shrinking directly. As soon as you are small enough to get through the door, you run out of the house, and find quite a crowd of little animals and birds waiting outside. You run off as hard as you can, and soon find yourself safe in a thick wood.

"The first thing I've got to do," you say to yourself, as you wander about in the wood, "is to grow to my right size again; and the second thing is to find my way into that lovely garden."

An enormous puppy is looking down at you with large round eyes, and feebly stretching out one paw, trying to touch you. "Poor little thing!" you say, in a coaxing tone — but you are terribly frightened all the time at the thought that it might be hungry.`,
  game:{type:'woods', label:'Get away from the puppy, and find something to eat or drink', win:'caterpillar', lose:'caterpillar', fxWin:{hum:4}, fxLose:{health:-10},
    winText:'At last the puppy gives up and sits down a good way off, panting, with its tongue hanging out. And there before you is a large mushroom, about the same height as yourself.',
    loseText:'The puppy bowls you over twice, in a friendly way, which is quite as bad as an unfriendly way when you are three inches high. At last it tires, and you stumble upon a large mushroom.'}}
});

// ── V. ADVICE FROM A CATERPILLAR ────────────────────────────────────────────
Object.assign(BEATS, {
caterpillar:{chapter:5, chTitle:'Advice from a Caterpillar', loc:'mushroom', art:'caterpillar',
  text:`You stretch yourself up on tiptoe, and peep over the edge of the mushroom, and your eyes immediately meet those of a large blue caterpillar, that is sitting on the top with its arms folded, quietly smoking a long hookah, and taking not the smallest notice of you or of anything else.

The Caterpillar and you look at each other for some time in silence: at last the Caterpillar takes the hookah out of its mouth, and addresses you in a languid, sleepy voice.

"Who are YOU?"`,
  fx:{meet:'caterpillar'},
  choices:[
    talk('who', '"I — I hardly know, sir, just at present."', `"At least I know who I WAS when I got up this morning, but I think I must have been changed several times since then."\n\n"What do you mean by that?" says the Caterpillar sternly. "Explain yourself!"\n\n"I can't explain MYSELF, I'm afraid, sir, because I'm not myself, you see."\n\n"I don't see," says the Caterpillar.`, {hum:3}),
    talk('temper', 'Turn away. This is a very unpleasant state of mind.', `"Come back!" the Caterpillar calls after you. "I've something important to say!" This sounds promising, certainly: you turn and come back again.\n\n"Keep your temper," says the Caterpillar.\n\n"Is that all?" you say, swallowing down your anger as well as you can.\n\n"No," says the Caterpillar.`, {aff:{caterpillar:4}}),
    {t:'Repeat "You are old, Father William", as it asks.', go:'mushroom', fx:{song:'william', aff:{caterpillar:6}}, res:`You fold your hands, and begin. At the end the Caterpillar says, "That is not said right."\n\n"Not QUITE right, I'm afraid," you say, timidly; "some of the words have got altered."\n\n"It is wrong from beginning to end," says the Caterpillar decidedly, and there is silence for some minutes. Then: "What size do you want to be?"\n\n"Oh, I'm not particular as to size; only one doesn't like changing so often, you know. Three inches is such a wretched height to be."\n\n"It is a very good height indeed!" says the Caterpillar angrily, rearing itself upright as it speaks (it is exactly three inches high).`}
  ]},
mushroom:{title:'The Mushroom', art:'caterpillar',
  text:`In a minute or two the Caterpillar takes the hookah out of its mouth and yawns once or twice, and shakes itself. Then it gets down off the mushroom, and crawls away into the grass, merely remarking as it goes, "One side will make you grow taller, and the other side will make you grow shorter."

"One side of WHAT? The other side of WHAT?" thinks Alice to herself.

"Of the mushroom," says the Caterpillar, just as if you had asked it aloud; and in another moment it is out of sight.

You stretch your arms round the mushroom as far as they will go, and break off a bit of the edge with each hand. "And now which is which?"`,
  fx:{item:['mushleft', 'mushright']},
  game:{type:'mushroom', label:'Nibble the mushroom', win:'pigeon', lose:'pigeon', fxWin:{hum:6}, fxLose:{health:-8},
    winText:'It is so long since you have been anything near the right size that it feels quite strange at first; but you get used to it in a few minutes. "Come, there\'s half my plan done now!"',
    loseText:'There is a good deal of up-and-down before you get the knack of it, and once your chin strikes violently against your foot. But you manage, more or less.'}},
pigeon:{title:'Above the Trees', loc:'treetops', art:'none',
  text:`At one point in all your nibbling, your neck shot up like a serpent, high above the tree-tops, and a large pigeon flew into your face, and began beating you violently with its wings.

"Serpent!" screamed the Pigeon. "I've tried the roots of trees, and I've tried banks, and I've tried hedges, but those serpents! There's no pleasing them!"

"But I'm NOT a serpent, I tell you! I'm a — I'm a —"

"Well! WHAT are you?" said the Pigeon. "I can see you're trying to invent something!"

"I — I'm a little girl," said Alice, rather doubtfully, as she remembered the number of changes she had gone through that day.`,
  fx:{meet:'pigeon'},
  choices:[
    {t:'"I have tasted eggs, certainly. But little girls eat eggs quite as much as serpents do."', dt:3, go:'footmen', fx:{aff:{pigeon:-8}, hum:4}, res:`"I don't believe it," says the Pigeon; "but if they do, why then they're a kind of serpent, that's all I can say." This is such a new idea to you that you are quite silent for a minute or two.`},
    {t:'Apologise, and tuck your neck back down among the branches.', go:'footmen', fx:{aff:{pigeon:6}}}
  ]}
});

// ── VI. PIG AND PEPPER ──────────────────────────────────────────────────────
Object.assign(BEATS, {
footmen:{chapter:6, chTitle:'Pig and Pepper', loc:'duchesshouse', w:'duchess', art:'none', fx:{setSize:2},
  text:`You come upon an open place, with a little house in it about four feet high. "Whoever lives there," you think, "it'll never do to come upon them THIS size: why, I should frighten them out of their wits!" So you begin nibbling at the right-hand bit again, and do not venture to go near the house till you have brought yourself down to nine inches high.

A footman in livery, with a face like a fish, comes running out of the wood and raps loudly at the door with his knuckles. It is opened by another footman in livery, with a round face and large eyes like a frog. The Fish-Footman produces from under his arm a great letter, nearly as large as himself: "For the Duchess. An invitation from the Queen to play croquet."

Then they both bow low, and their curls get entangled together. You laugh so much at this that you have to run back into the wood for fear of their hearing you.`,
  choices:[
    talk('knock', 'Go up timidly and knock.', `"There's no sort of use in knocking," says the Frog-Footman, "and that for two reasons. First, because I'm on the same side of the door as you are; secondly, because they're making such a noise inside, no one could possibly hear you." And certainly there is a most extraordinary noise going on within — a constant howling and sneezing, and every now and then a great crash.`, {hum:3}),
    Object.assign(talk('sit', '"How am I to get in?"', `"I shall sit here," the Footman remarks, "till to-morrow — or next day, maybe." He is looking up into the sky all the time. "Anything you like," he says, and begins whistling.\n\n"Oh, there's no use in talking to him," you say desperately: "he's perfectly idiotic!"`, {aff:{}}), {dt:3}),
    {t:'Open the door and go in.', go:'kitchen'}
  ]},
kitchen:{title:'The Duchess\'s Kitchen', art:'duchess', song:'roughly',
  text:`The door leads right into a large kitchen, which is full of smoke from one end to the other: the Duchess is sitting on a three-legged stool in the middle, nursing a baby; the cook is leaning over the fire, stirring a large cauldron which seems to be full of soup.

"There's certainly too much pepper in that soup!" you say to yourself, as well as you can for sneezing.

The only things in the kitchen that do not sneeze are the cook, and a large cat which is sitting on the hearth and grinning from ear to ear.`,
  fx:{meet:['duchess', 'cheshire']},
  choices:[
    Object.assign(talk('grin', '"Please would you tell me why your cat grins like that?"', `"It's a Cheshire cat," says the Duchess, "and that's why. Pig!"\n\nShe says the last word with such sudden violence that you quite jump; but you see in another moment that it is addressed to the baby, and not to you.`, {hum:4, aff:{cheshire:6}}), {dt:3}),
    talk('axis', 'Explain how the earth takes twenty-four hours to turn round on its axis.', `"Talking of axes," says the Duchess, "chop off her head!"\n\nYou glance rather anxiously at the cook, to see if she means to take the hint; but the cook is busily stirring the soup, and seems not to be listening.`, {sus:4}),
    {t:'"Oh, PLEASE mind what you\'re doing!" (as the saucepans fly)', go:'baby', fx:{aff:{duchess:-4}}, res:`The cook takes the cauldron of soup off the fire, and at once sets to work throwing everything within her reach at the Duchess and the baby — the fire-irons came first; then followed a shower of saucepans, plates, and dishes.\n\n"If everybody minded their own business," the Duchess says in a hoarse growl, "the world would go round a deal faster than it does."`}
  ]},
baby:{title:'The Duchess\'s Kitchen', art:'none',
  text:`"Here! you may nurse it a bit, if you like!" the Duchess says to you, flinging the baby at you as she speaks. "I must go and get ready to play croquet with the Queen," and she hurries out of the room.

You catch the baby with some difficulty, as it is a queer-shaped little creature, and holds out its arms and legs in all directions, "just like a star-fish."

You carry it out into the open air. "If I don't take this child away with me, they're sure to kill it in a day or two: wouldn't it be murder to leave it behind?" The little thing grunts in reply. "Don't grunt," you say; "that's not at all a proper way of expressing yourself."`,
  fx:{item:'pig'},
  choices:[
    {t:'Look anxiously into its face.', go:'cheshire', fx:{lose:'pig', hum:5}, res:`There can be no doubt that it has a VERY turn-up nose, much more like a snout than a real nose; also its eyes are getting extremely small for a baby. It grunts again, so violently that you look down into its face in some alarm. This time there can be no mistake about it: it is neither more nor less than a pig.\n\nSo you set the little creature down, and feel quite relieved to see it trot away quietly into the wood. "If it had grown up," you say to yourself, "it would have made a dreadfully ugly child: but it makes rather a handsome pig, I think."`}
  ]},
cheshire:{title:'The Cheshire Cat\'s Bough', loc:'cheshiretree', w:'cheshire', art:'cheshire',
  text:`You are a little startled by seeing the Cheshire Cat sitting on a bough of a tree a few yards off. The Cat only grins when it sees you. It looks good-natured, you think: still it has VERY long claws and a great many teeth, so you feel that it ought to be treated with respect.

"Cheshire Puss," you begin, rather timidly. "Would you tell me, please, which way I ought to go from here?"

"That depends a good deal on where you want to get to," said the Cat.

"I don't much care where —" said Alice.

"Then it doesn't matter which way you go," said the Cat.

"— so long as I get SOMEWHERE," Alice added as an explanation.

"Oh, you're sure to do that," said the Cat, "if you only walk long enough."`,
  choices:[
    Object.assign(talk('people', '"What sort of people live about here?"', `"In THAT direction," the Cat says, waving its right paw round, "lives a Hatter: and in THAT direction," waving the other paw, "lives a March Hare. Visit either you like: they're both mad."\n\n"But I don't want to go among mad people," you remark.\n\n"Oh, you can't help that," says the Cat: "we're all mad here. I'm mad. You're mad."\n\n"How do you know I'm mad?"\n\n"You must be," says the Cat, "or you wouldn't have come here."`, {aff:{cheshire:8}, hum:5}), {dt:3}),
    talk('croquet', '"Do you play croquet with the Queen to-day?"', `"I should like it very much," you say, "but I haven't been invited yet."\n\n"You'll see me there," says the Cat, and vanishes. You are not much surprised at this. While you are looking at the place where it had been, it suddenly appears again.\n\n"By-the-bye, what became of the baby?" — "It turned into a pig." — "I thought it would," says the Cat, and vanishes again.`, {aff:{cheshire:4}}),
    talk('vanish', '"I wish you wouldn\'t keep appearing and vanishing so suddenly: you make one quite giddy."', `"All right," says the Cat; and this time it vanishes quite slowly, beginning with the end of the tail, and ending with the grin, which remains some time after the rest of it has gone.\n\n"Well! I've often seen a cat without a grin," thinks Alice; "but a grin without a cat! It's the most curious thing I ever saw in my life!"`, {hum:6, health:-3}),
    {t:'Walk on towards the March Hare\'s house.', go:'tea', fx:{setSize:4}, res:`It is so large a house that you do not like to go nearer till you have nibbled some more of the left-hand bit of mushroom, and raised yourself to about two feet high.`}
  ]}
