// ── VII. A MAD TEA-PARTY ────────────────────────────────────────────────────
Object.assign(BEATS, {
tea:{chapter:7, chTitle:'A Mad Tea-Party', map:'marchhare', loc:'table', w:'marchhare', art:'teaparty', date:'Six o\'clock (always)',
  text:`There is a table set out under a tree in front of the house, and the March Hare and the Hatter are having tea at it: a Dormouse is sitting between them, fast asleep, and the other two are using it as a cushion, resting their elbows on it, and talking over its head.

The table is a large one, but the three are all crowded together at one corner of it. "No room! No room!" they cry out when they see you coming.

"There's PLENTY of room!" you say indignantly, and you sit down in a large arm-chair at one end of the table.

"Have some wine," the March Hare says in an encouraging tone. You look all round the table, but there is nothing on it but tea. "I don't see any wine," you remark. "There isn't any," says the March Hare.`,
  fx:{meet:['hatter', 'marchhare', 'dormouse']},
  choices:[
    talk('civil', '"Then it wasn\'t very civil of you to offer it."', `"It wasn't very civil of you to sit down without being invited," says the March Hare.\n\n"I didn't know it was YOUR table; it's laid for a great many more than three."\n\n"Your hair wants cutting," says the Hatter. He has been looking at you for some time with great curiosity, and this is his first speech.\n\n"You should learn not to make personal remarks," you say with some severity; "it's very rude."`, {aff:{marchhare:-4, hatter:2}}),
    {t:'Wait for the Hatter to say something sensible.', go:'riddles', res:`The Hatter opens his eyes very wide on hearing this; but all he SAYS is, "Why is a raven like a writing-desk?"\n\n"Come, we shall have some fun now!" you think. "I'm glad they've begun asking riddles. — I believe I can guess that."`}
  ]},
riddles:{title:'The Tea-Table', art:'teaparty',
  text:`"Do you mean that you think you can find out the answer to it?" says the March Hare.

"Exactly so."

"Then you should say what you mean," the March Hare goes on.

"I do," you hastily reply; "at least — at least I mean what I say — that's the same thing, you know."

"Not the same thing a bit!" says the Hatter. "You might just as well say that 'I see what I eat' is the same thing as 'I eat what I see'!"`,
  game:{type:'hatter', label:'Answer the Hatter', win:'watch', lose:'watch', fxWin:{aff:{hatter:12, marchhare:8}, hum:6}, fxLose:{health:-8, aff:{hatter:4}},
    winText:'"You\'re getting on," says the Hatter, approvingly, and pours a little hot tea upon the Dormouse\'s nose.',
    loseText:'You feel dreadfully puzzled. The Hatter\'s remarks seem to have no sort of meaning in them, and yet they are certainly English.'}},
watch:{title:'The Tea-Table', art:'none', song:'bat',
  text:`The Hatter takes his watch out of his pocket, and looks at it uneasily, shaking it every now and then, and holding it to his ear. "What day of the month is it?" — "The fourth." — "Two days wrong!" sighs the Hatter. "I told you butter wouldn't suit the works!" he adds, looking angrily at the March Hare. "It was the BEST butter," the March Hare meekly replies.

The Hatter tells you how he sang at the great concert given by the Queen of Hearts — "Twinkle, twinkle, little bat!" — and the Queen bawled out "He's murdering the time! Off with his head!" And ever since that, Time won't do a thing he asks. "It's always six o'clock now."

"Is that the reason so many tea-things are put out here?" you ask.

"Yes, that's it," says the Hatter with a sigh: "it's always tea-time, and we've no time to wash the things between whiles."`,
  choices:[
    talk('treacle', 'Let the Dormouse tell a story.', `"Once upon a time there were three little sisters," the Dormouse begins in a great hurry; "and their names were Elsie, Lacie, and Tillie; and they lived at the bottom of a well —"\n\n"What did they live on?" — "They lived on treacle," says the Dormouse, after thinking a minute or two. They were learning to draw, it says, everything that begins with an M — such as mouse-traps, and the moon, and memory, and muchness. "Did you ever see such a thing as a drawing of a muchness?"`, {hum:6, health:-4, aff:{dormouse:10}}),
    Object.assign(talk('more', '"I\'ve had nothing yet, so I can\'t take more."', `"You mean you can't take LESS," says the Hatter: "it's very easy to take MORE than nothing."\n\n"Nobody asked YOUR opinion," you say.\n\n"Who's making personal remarks now?" the Hatter asks triumphantly.`, {hum:3}), {dt:3}),
    {t:'Stay. Move one place on, and have another cup. It\'s always tea-time, after all.', if:G => G.stats.health < 70, dt:6, go:'end_tea'},
    {t:'"It\'s the stupidest tea-party I ever was at in all my life!" — and walk off.', go:'treedoor', fx:{aff:{hatter:-4, marchhare:-4}}, res:`The last time you see them, they are trying to put the Dormouse into the teapot.`}
  ]},
treedoor:{title:'A Tree with a Door in It', loc:'treedoor', art:'hall',
  text:`Just as you say this, you notice that one of the trees has a door leading right into it. "That's very curious!" you think. "But everything's curious today. I think I may as well go in at once." And in you go.

Once more you find yourself in the long hall, and close to the little glass table. "Now, I'll manage better this time," you say to yourself.`,
  choices:[
    {t:'Take the little golden key, and unlock the door that leads into the garden.', if:G => size() >= 4 && !has('key'), fx:{item:'key', flag:'unlocked', hum:3}, res:`It turns, with a lovely small click. The door swings open on to the passage, and the smell of flowers comes through it.`},
    {t:'Nibble at the mushroom (you kept a piece in your pocket) till you are about a foot high.', if:G => G.flags.unlocked && has('mushright'), cls:'shrink', go:'roses', fx:{setSize:3, hum:4}, res:`Then you walk down the little passage: and THEN — you find yourself at last in the beautiful garden, among the bright flower-beds and the cool fountains.`}
  ]}
});

// ── VIII. THE QUEEN'S CROQUET-GROUND ────────────────────────────────────────
Object.assign(BEATS, {
roses:{chapter:8, chTitle:'The Queen\'s Croquet-Ground', map:'garden', loc:'rosetree', w:'garden', art:'croquet', date:'The same afternoon',
  text:`A large rose-tree stands near the entrance of the garden: the roses growing on it are white, but there are three gardeners at it, busily painting them red.

"Would you tell me," you say, a little timidly, "why you are painting those roses?"

Five and Seven say nothing, but look at Two. Two begins in a low voice, "Why the fact is, you see, Miss, this here ought to have been a RED rose-tree, and we put a white one in by mistake; and if the Queen was to find it out, we should all have our heads cut off, you know."

At this moment Five, who has been anxiously looking across the garden, calls out "The Queen! The Queen!" and the three gardeners instantly throw themselves flat upon their faces.`,
  fx:{meet:['queen', 'king', 'knave']},
  choices:[{t:'Stand where you are, and wait for the procession.', go:'queen'}]},
queen:{title:'The Procession', loc:'ground', art:'croquet',
  text:`First come ten soldiers carrying clubs; next the ten courtiers, ornamented all over with diamonds; then the royal children, ornamented all over with hearts; then the guests, mostly Kings and Queens, and among them the White Rabbit; then the Knave of Hearts, carrying the King's crown on a crimson velvet cushion; and, last of all this grand procession, came THE KING AND QUEEN OF HEARTS.

When the procession comes opposite to you, they all stop and look at you, and the Queen says severely "Who is this?"

"What's your name, child?"

"My name is Alice, so please your Majesty," you say very politely; but you add, to yourself, "Why, they're only a pack of cards, after all. I needn't be afraid of them!"

"And who are THESE?" says the Queen, pointing to the three gardeners who are lying round the rose-tree.`,
  choices:[
    {t:'"How should I know? It\'s no business of MINE."', fx:{sus:20}, go:'hidegardeners', res:`The Queen turns crimson with fury, and, after glaring at you for a moment like a wild beast, screams "Off with her head! Off —"\n\n"Nonsense!" you say, very loudly and decidedly, and the Queen is silent.\n\nThe King lays his hand upon her arm, and timidly says "Consider, my dear: she is only a child!"`},
    {t:'Curtsey very low, and say they are only gardeners.', fx:{sus:4, aff:{queen:6}}, go:'hidegardeners', res:`"Get up!" says the Queen, in a shrill, loud voice, and the three gardeners instantly jump up, and begin bowing to the King, the Queen, the royal children, and everybody else. "Leave off that!" screams the Queen. "You make me giddy." Then, turning to the rose-tree: "What HAVE you been doing here?"`}
  ]},
hidegardeners:{title:'The Rose-Tree', art:'none',
  text:`"May it please your Majesty," says Two, in a very humble tone, going down on one knee as he speaks, "we were trying —"

"I see!" says the Queen, who has meanwhile been examining the roses. "Off with their heads!" and the procession moves on, three of the soldiers remaining behind to execute the unfortunate gardeners, who run to you for protection.

There is a large flower-pot that stands near.`,
  choices:[
    {t:'"You shan\'t be beheaded!" — and put them into the flower-pot.', go:'croquet', fx:{flag:'savedGardeners', sus:5, hum:4}, res:`The three soldiers wander about for a minute or two, looking for them, and then quietly march off after the others.\n\n"Are their heads off?" shouts the Queen. "Their heads are gone, if it please your Majesty!" the soldiers shout in reply. "That's right!" shouts the Queen. "Can you play croquet?"\n\nThe soldiers are silent, and look at you, as the question is evidently meant for you. "Yes!" you shout. "Come on, then!" roars the Queen.`},
    {t:'Look the other way. It\'s none of your business.', go:'croquet', fx:{hum:-6, sus:-4}, res:`The soldiers lead the gardeners away. You hear nothing more, which may or may not be good. "Can you play croquet?" shouts the Queen. "Yes!" you shout. "Come on, then!"`}
  ]},
croquet:{title:'The Croquet-Ground', art:'croquet',
  text:`You think you never saw such a curious croquet-ground in your life; it is all ridges and furrows; the balls are live hedgehogs, the mallets live flamingoes, and the soldiers have to double themselves up and to stand on their hands and feet, to make the arches.

The chief difficulty you find at first is in managing your flamingo: just as you have got its neck nicely straightened out, and are going to give the hedgehog a blow with its head, it WILL twist itself round and look up in your face, with such a puzzled expression that you cannot help bursting out laughing.

The players all play at once without waiting for turns, quarrelling all the while, and fighting for the hedgehogs; and in a very short time the Queen is in a furious passion, and goes stamping about, and shouting "Off with his head!" or "Off with her head!" about once in a minute.`,
  fx:{item:['flamingo', 'hedgehog']},
  game:{type:'croquet', label:'Play croquet with a flamingo', win:'catappears', lose:'catappears', fxWin:{hum:5, sus:4}, fxLose:{sus:8, health:-4},
    winText:'You get through three arches, which is more than anyone else has managed, and the Queen glares at you. Perhaps it is unwise to win at croquet against the Queen.',
    loseText:'Your hedgehog crawls off to fight another hedgehog, and your flamingo flies up into a tree. "They\'re dreadfully fond of beheading people here," you think; "the great wonder is, that there\'s any one left alive!"'}},
catappears:{title:'The Croquet-Ground', loc:'cat', art:'cheshire',
  text:`You are looking about for some way of escape, when you notice a curious appearance in the air: it puzzles you very much at first, but, after watching it a minute or two, you make it out to be a grin, and you say to yourself "It's the Cheshire Cat: now I shall have somebody to talk to."

"How are you getting on?" says the Cat, as soon as there is mouth enough for it to speak with.

"I don't think they play at all fairly," you begin, in rather a complaining tone, "and they all quarrel so dreadfully one can't hear oneself speak — and they don't seem to have any rules in particular."

But the King has seen the Cat's head. "I don't like the look of it at all," says the King: "however, it may kiss my hand if it likes." — "I'd rather not," the Cat remarks. And the King calls to the Queen. "Off with his head!" she says, without even looking round.`,
  choices:[{t:'Slip away across the ground, while they argue.', go:'sneakground'}]},
sneakground:{title:'The Croquet-Ground', art:'none',
  text:`The executioner's argument is that you can't cut off a head unless there is a body to cut it off from. The King's argument is that anything that has a head can be beheaded. The Queen's argument is that if something isn't done about it in less than no time she'll have everybody executed, all round.

Soldiers are running everywhere with orders. You would very much like to get to the far end of the ground, where the Duchess is being fetched out of prison — without catching the Queen's eye on the way.`,
  game:{type:'sneak', map:'croquet', label:'Cross the croquet-ground unnoticed', win:'morals', lose:'morals', fxWin:{hum:4}, fxLose:{sus:18},
    winText:'Nobody notices you at all. By the time you get there, the Cat\'s head has quite faded away, and the King and the executioner are running wildly up and down looking for it.',
    loseText:'A soldier spots you and reports to the Queen. "Off with her head!" she screams — and then forgets all about it in the next minute, being very busy shouting at the executioner. But she will remember, later.'}}
});

// ── IX. THE MOCK TURTLE'S STORY ─────────────────────────────────────────────
Object.assign(BEATS, {
morals:{chapter:9, chTitle:'The Mock Turtle\'s Story', loc:'pavilion', art:'none',
  text:`"You can't think how glad I am to see you again, you dear old thing!" says the Duchess, as she tucks her arm affectionately into yours, and you walk off together.

You are very glad to find her in such a pleasant temper, and think to yourself that perhaps it was only the pepper that had made her so savage. "When I'M a Duchess," you say to yourself, "I won't have any pepper in my kitchen AT ALL."

"You're thinking about something, my dear, and that makes you forget to talk. I can't tell you just now what the moral of that is, but I shall remember it in a bit."

"Perhaps it hasn't one," you venture to remark.

"Tut, tut, child!" says the Duchess. "Everything's got a moral, if only you can find it." And she squeezes herself up closer to your side, resting her sharp little chin uncomfortably upon your shoulder.`,
  fx:{song:'morals'},
  choices:[
    Object.assign(talk('mustard', '"Mustard isn\'t a bird."', `"Right, as usual," says the Duchess: "what a clear way you have of putting things!" — "It's a mineral, I THINK." — "Of course it is," says the Duchess, who seems ready to agree to everything; "there's a large mustard-mine near here. And the moral of that is — 'The more there is of mine, the less there is of yours.'"`, {aff:{duchess:6}, health:-3}), {dt:3}),
    talk('think', '"I\'ve a right to think," you say sharply.', `"Just about as much right," says the Duchess, "as pigs have to fly; and the m —" But here, to your great surprise, the Duchess's voice dies away, even in the middle of her favourite word "moral", and the arm that is linked into yours begins to tremble. You look up, and there stands the Queen in front of you, with her arms folded, frowning like a thunderstorm.`, {sus:4}),
    {t:'Go with the Queen when she asks, "Have you seen the Mock Turtle yet?"', go:'mockturtle', fx:{meet:'gryphon'}, res:`"A fine day, your Majesty!" the Duchess begins in a low, weak voice. "Now, I give you fair warning," shouts the Queen, stamping on the ground as she speaks; "either you or your head must be off, and that in about half no time!" The Duchess takes her choice, and is gone in a moment.\n\n"Have you seen the Mock Turtle yet?" — "No. I don't even know what a Mock Turtle is." — "It's the thing Mock Turtle Soup is made from," says the Queen. "Come on, then, and he shall tell you his history." And she hands you to a Gryphon, lying fast asleep in the sun.`}
  ]},
mockturtle:{title:'The Mock Turtle\'s Rock', map:'sea', loc:'rock', w:'seashore', art:'gryphon',
  text:`"What fun!" says the Gryphon, half to itself, half to you. "It's all her fancy, that: they never executes nobody, you know. Come on!"

They have not gone far before they see the Mock Turtle in the distance, sitting sad and lonely on a little ledge of rock, and, as they come nearer, you can hear him sighing as if his heart would break.

"Once," says the Mock Turtle at last, with a deep sigh, "I was a real Turtle."

These words are followed by a very long silence, broken only by an occasional exclamation of "Hjckrrh!" from the Gryphon, and the constant heavy sobbing of the Mock Turtle.

"When we were little," the Mock Turtle goes on at last, more calmly, "we went to school in the sea. The master was an old Turtle — we used to call him Tortoise —"

"Why did you call him Tortoise, if he wasn't one?"

"We called him Tortoise because he taught us," says the Mock Turtle angrily: "really you are very dull!"`,
  fx:{meet:'mockturtle'},
  choices:[
    talk('lessons', '"And what did you study?"', `"Reeling and Writhing, of course, to begin with," the Mock Turtle replies; "and then the different branches of Arithmetic — Ambition, Distraction, Uglification, and Derision."\n\n"I never heard of 'Uglification,'" you venture to say.`, {song:'lessons', hum:5, aff:{mockturtle:8}}),
    Object.assign(talk('hours', '"And how many hours a day did you do lessons?"', `"Ten hours the first day," says the Mock Turtle: "nine the next, and so on."\n\n"What a curious plan!"\n\n"That's the reason they're called lessons," the Gryphon remarks: "because they lessen from day to day."`, {hum:4, aff:{gryphon:6}}), {dt:3}),
    talk('french', '"Did you learn French and music?"', `"Yes," says the Mock Turtle. "And washing?" "Certainly not!" — "Ah! then yours wasn't a really good school," you say in a tone of great relief. "Now at OURS they had at the end of the bill, 'French, music, AND WASHING — extra.'"`, {aff:{mockturtle:-4}}),
    {t:'"Tell me about the games now," says the Gryphon.', go:'quadrille'}
  ]}
});

// ── X. THE LOBSTER QUADRILLE ────────────────────────────────────────────────
Object.assign(BEATS, {
quadrille:{chapter:10, chTitle:'The Lobster Quadrille', loc:'beach', art:'gryphon',
  text:`"You may not have lived much under the sea —" ("I haven't," says Alice) — "and perhaps you were never even introduced to a lobster —" (Alice begins to say "I once tasted —" but checks herself hastily) — "so you can have no idea what a delightful thing a Lobster Quadrille is!"

"Would you like to see a little of it?" says the Mock Turtle. "We can do without lobsters, you know. Which shall sing?"

"Oh, YOU sing," says the Gryphon. "I've forgotten the words."

So they begin solemnly dancing round and round you, every now and then treading on your toes when they pass too close, and waving their forepaws to mark the time.`,

    winText:'"Thank you, it\'s a very interesting dance to watch," you say, feeling very glad that it is over at last: "and I do so like that curious song about the whiting!"',

Then the Mock Turtle sings "Beautiful Soup", in a voice sometimes choked with sobs, and they are just beginning the chorus again when a cry of "The trial's beginning!" is heard in the distance.`,

// ── XI. WHO STOLE THE TARTS? ────────────────────────────────────────────────
Object.assign(BEATS, {
trial:{chapter:11, chTitle:'Who Stole the Tarts?', map:'court', loc:'tarts', w:'court', art:'court', fx:{setSize:5},
  text:`The King and Queen of Hearts are seated on their throne when they arrive, with a great crowd assembled about them — all sorts of little birds and beasts, as well as the whole pack of cards: the Knave is standing before them, in chains, with a soldier on each side to guard him; and near the King is the White Rabbit, with a trumpet in one hand, and a scroll of parchment in the other.

In the very middle of the court is a table, with a large dish of tarts upon it: they look so good, that it makes you quite hungry to look at them.

The twelve jurors are all writing very busily on slates. "They're putting down their names," the Gryphon whispers in reply, "for fear they should forget them before the end of the trial."

"Herald, read the accusation!" says the King. On this the White Rabbit blows three blasts on the trumpet, and then unrolls the parchment scroll, and reads.`,
  fx:{song:'tarts'},
  choices:[
    talk('pencil', 'Take Bill the Lizard\'s squeaking pencil away from him.', `One of the jurors has a pencil that squeaks. This of course you cannot stand, and you go round the court and get behind him, and very soon find an opportunity of taking it away. You do it so quickly that the poor little juror (it is Bill, the Lizard) cannot make out at all what has become of it; so he is obliged to write with one finger for the rest of the day; and this is of very little use, as it leaves no mark on the slate.`, {aff:{bill:-4}, hum:3}),
    talk('tart', 'Wish they\'d get the trial done, and hand round the refreshments.', `But there seems to be no chance of this, so you begin looking at everything about you, to pass away the time. You have never been in a court of justice before, but you have read about them in books, and you are quite pleased to find that you know the name of nearly everything there. "That's the judge," you say to yourself, "because of his great wig."`, {item:'tart', food:-2}),
    {t:'"First witness!"', go:'hatterwitness'}
  ]},
hatterwitness:{title:'The Witness-box', loc:'witness', art:'court',
  text:`The first witness is the Hatter. He comes in with a teacup in one hand and a piece of bread-and-butter in the other. "I beg pardon, your Majesty," he begins, "for bringing these in: but I hadn't quite finished my tea when I was sent for."

"Give your evidence," says the King; "and don't be nervous, or I'll have you executed on the spot."

This does not seem to encourage the witness at all: he keeps shifting from one foot to the other, looking uneasily at the Queen, and in his confusion he bites a large piece out of his teacup instead of the bread-and-butter.

Just at this moment you feel a very curious sensation: you are beginning to grow larger again.`,
  fx:{cash:2},
  choices:[
    {t:'Stay where you are, as long as there is room for you.', go:'evidence', fx:{hum:4}, res:`"I wish you wouldn't squeeze so," says the Dormouse, who is sitting next to you. "I can hardly breathe." — "I can't help it," you say very meekly: "I'm growing." — "You've no right to grow HERE," says the Dormouse. — "Don't talk nonsense," you say more boldly: "you know you're growing too."`},
    {t:'Nibble the mushroom to keep small.', if:G => has('mushright'), cls:'shrink', go:'evidence', fx:{cash:-2, lose:'mushright'}, res:`You eat the last of the right-hand piece. It holds you down for a while — but you have the oddest feeling that it won't hold for long.`}
  ]},
evidence:{chapter:12, chTitle:'Alice\'s Evidence', loc:'witness', art:'court',
  text:`"Alice!" calls the White Rabbit, at the top of his shrill little voice.

"Here!" cries Alice, quite forgetting in the flurry of the moment how large she had grown in the last few minutes, and she jumps up in such a hurry that she tips over the jury-box with the edge of her skirt, upsetting all the jurymen on to the heads of the crowd below.

"What do you know about this business?" the King says to Alice.

"Nothing," said Alice.

"Nothing WHATEVER?" persisted the King.

"Nothing whatever," said Alice.

"That's very important," the King said, turning to the jury. They were just beginning to write this down on their slates, when the White Rabbit interrupted: "UNimportant, your Majesty means, of course," he said in a very respectful tone, but frowning and making faces at him as he spoke.`,
  fx:{cash:2, song:'evidence'},
  choices:[
    Object.assign(talk('rule', 'Listen to the King read from his note-book.', `"Silence!" — and he reads out from his book, "Rule Forty-two. ALL PERSONS MORE THAN A MILE HIGH TO LEAVE THE COURT." Everybody looks at you.\n\n"I'M not a mile high," you say. "You are," says the King. "Nearly two miles high," adds the Queen. "Well, I shan't go, at any rate," you say; "besides, that's not a regular rule: you invented it just now." — "It's the oldest rule in the book," says the King. — "Then it ought to be Number One," you say.`, {hum:5, sus:5}), {dt:3}),
    {t:'"Let the jury consider their verdict," the King says.', go:'sentence'}
  ]},
sentence:{title:'Sentence First', art:'court',
  text:`"No, no!" says the Queen. "Sentence first — verdict afterwards."

"Stuff and nonsense!" says Alice loudly. "The idea of having the sentence first!"

"Hold your tongue!" says the Queen, turning purple.`,
  game:{type:'trial', label:'Stand up to the Queen', win:'cards', lose:'cards'}},
cards:{title:'A Pack of Cards', art:'cards',
  text:G => `"I won't!" says Alice.

// ── ENDINGS ─────────────────────────────────────────────────────────────────
Object.assign(BEATS, {
end_wake:{ending:'good', title:'What a Curious Dream!', art:'bank', text:`"Wake up, Alice dear!" said her sister; "Why, what a long sleep you've had!"

"Oh, I've had such a curious dream!" said Alice, and she told her sister, as well as she could remember them, all these strange Adventures of hers; and when she had finished, her sister kissed her, and said, "It WAS a curious dream, dear, certainly: but now run in to your tea; it's getting late." So Alice got up and ran off, thinking while she ran, as well she might, what a wonderful dream it had been.

But her sister sat still just as she left her, leaning her head on her hand, watching the setting sun, and thinking of little Alice and all her wonderful Adventures, till she too began dreaming after a fashion — the rattling teacups changing to tinkling sheep-bells, and the Queen's shrill cries to the voice of the shepherd boy.

Lastly, she pictured to herself how this same little sister of hers would, in the after-time, be herself a grown woman; and how she would keep, through all her riper years, the simple and loving heart of her childhood: and how she would gather about her other little children, and make THEIR eyes bright and eager with many a strange tale, perhaps even with the dream of Wonderland of long ago: and how she would feel with all their simple sorrows, and find a pleasure in all their simple joys, remembering her own child-life, and the happy summer days.`},

    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) if (g[y][xx] === 1){ x.fillStyle = '#4a6a2a'; x.beginPath(); x.arc(xx * ts + ts / 2, y * ts + ts / 2, ts * .62, 0, 7); x.fill(); }
    x.fillStyle = '#c8402a'; x.beginPath(); x.arc(goal[0] * ts + ts / 2, goal[1] * ts + ts / 2, ts * .42, Math.PI, 0); x.fill(); x.fillStyle = '#f0e8d8'; x.fillRect(goal[0] * ts + ts * .4, goal[1] * ts + ts / 2, ts * .2, ts * .4);
    x.fillStyle = '#c8a070'; x.beginPath(); x.ellipse(D.x * ts + ts / 2, D.y * ts + ts / 2, ts * .55, ts * .4, 0, 0, 7); x.fill(); x.fillStyle = '#8a6040'; x.beginPath(); x.arc(D.x * ts + ts * .2, D.y * ts + ts * .2, 6, 0, 7); x.fill();
    x.fillStyle = '#5a8ac0'; x.beginPath(); x.arc(P.x * ts + ts / 2, P.y * ts + ts / 2 + 3, ts * .2, 0, 7); x.fill(); x.fillStyle = '#e8c060'; x.beginPath(); x.arc(P.x * ts + ts / 2, P.y * ts + ts / 2 - 6, ts * .14, 0, 7); x.fill();
    ui.hud.innerHTML = `<span>Bowled over <b>${hits}/3</b></span>`;
  }
  draw();
  return {stop(){}, key(e){ const d = KEYMAP[e.key]; if (d){ e.preventDefault(); step(d); } }};
};

// ── The Mushroom: one side taller, the other shorter ────────────────────────
GAMES.mushroom = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'One Side and the Other', '', 'Nibble the left-hand bit to grow, the right-hand bit to shrink. Each nibble is a different size, and you never quite know how much. Land inside the marked size before your nibbles run out.');
  const R = [{t:'Back to your right size', a:4.5, b:5.5, n:5},{t:'Tall enough to see over the trees', a:7.6, b:8.6, n:4},{t:'Down to nine inches, for the Duchess\'s little house', a:1.6, b:2.5, n:5}];
  let i = 0, sz = 1, left = 0, won = 0, over = false, lock = false;
  function show(){
    if (i >= R.length){ over = true; return done({win:won >= 2, score:won / 3, fx:{setSize:2}, msg:`You managed ${won} of 3.`}); }
    const q = R[i]; left = q.n; lock = false; render();
  }
  function render(){
    const q = R[i], pct = v => ((v - 1) / 8 * 100).toFixed(1);
    ui.body.innerHTML = `<div class="art" style="cursor:default">${VIGNETTES.caterpillar()}</div><div class="riddle">${esc(q.t)}</div>
      <div class="mushbar"><div class="zone" style="left:${pct(q.a)}%;width:${(pct(q.b) - pct(q.a))}%"></div><div class="me" style="left:calc(${pct(sz)}% - 3px)"></div></div>
      <div class="meta center">You are ${SIZES[Math.round(clamp(sz, 1, 9))]}. Nibbles left: ${left}.</div>
      <div class="opts"><button data-n="up">⇡ Nibble the left-hand bit</button><button data-n="down">⇣ Nibble the right-hand bit</button></div>`;
    ui.body.querySelectorAll('[data-n]').forEach(b => b.onclick = () => nibble(b.dataset.n));
    ui.hud.innerHTML = `<span>Round <b>${i + 1}/3</b></span><span>Managed <b>${won}</b></span>`;
  }
  function nibble(d){
    if (lock || over) return;
    sz = clamp(sz + (d === 'up' ? 1 : -1) * rnd(.4, 2.6), 1, 9.4); left--; SND.fx('click');
    const q = R[i];
    if (sz > 9){ ui.msg.textContent = 'Your neck shoots up like a serpent among the leaves! A pigeon flies into your face!'; sz = 8.9; }
    else if (sz < 1.1){ ui.msg.textContent = 'Your chin strikes violently against your foot!'; }
    else ui.msg.textContent = d === 'up' ? 'You grow.' : 'You shrink.';
    if (sz >= q.a && sz <= q.b){ won++; lock = true; SND.fx('good'); ui.msg.textContent = 'Just right!'; render(); i++; return setTimeout(show, 1100); }
    if (left <= 0){ lock = true; SND.fx('bad'); ui.msg.textContent = 'Not quite. The Caterpillar would be ashamed of you.'; render(); i++; return setTimeout(show, 1100); }
    render();
  }
  show();
  return {stop(){}};
};

// ── The Hatter's riddles ────────────────────────────────────────────────────
const HATTER = [
  {q:'"Why is a raven like a writing-desk?"', a:'"I give it up. What\'s the answer?"', o:['"Because both have quills."','"I give it up. What\'s the answer?"','"Because Poe wrote on both."','"Because neither is ever put the wrong end in front."'], say:'"I haven\'t the slightest idea," said the Hatter.'},
  {q:'"What day of the month is it?"', a:'"The fourth."', o:['"The fourth."','"Tuesday."','"Six o\'clock."','"Unbirthday."'], say:'"Two days wrong!" sighed the Hatter.'},
  {q:'"Is \'I see what I eat\' the same thing as \'I eat what I see\'?"', a:'"Not the same thing a bit!"', o:['"Not the same thing a bit!"','"Exactly the same."','"Only on Sundays."','"It depends upon the eating."'], say:'"You might just as well say that \'I breathe when I sleep\' is the same thing as \'I sleep when I breathe\'!"'},
  {q:'"What did the three little sisters at the bottom of the well live on?"', a:'"Treacle."', o:['"Treacle."','"Bread-and-butter."','"Tea."','"Water, I suppose."'], say:'"They lived on treacle," said the Dormouse.'},
  {q:'"What did the three little sisters learn to draw?"', a:'"Everything that begins with an M."', o:['"Everything that begins with an M."','"Treacle."','"Water from the well."','"Pictures of cats."'], say:'"Mouse-traps, and the moon, and memory, and muchness."'},
  {q:'"Why is it always six o\'clock here?"', a:'"Because the Hatter quarrelled with Time."', o:['"Because the Hatter quarrelled with Time."','"Because the watch has butter in it."','"Because it is always tea-time."','"Because the March Hare is mad."'], say:'"If you knew Time as well as I do, you wouldn\'t talk about wasting IT. It\'s HIM."'},
  {q:'"You can\'t take more tea when you\'ve had none. Or can you?"', a:'"It\'s very easy to take MORE than nothing."', o:['"It\'s very easy to take MORE than nothing."','"No, you can\'t."','"Only if you take less first."','"Not without a clean cup."'], say:'"You mean you can\'t take LESS," said the Hatter.'},
  {q:'"What\'s the best thing to put in a watch?"', a:'"The BEST butter."', o:['"The BEST butter."','"Breadcrumbs."','"Tea."','"Nothing at all."'], say:'"It was the BEST butter," the March Hare meekly replied.'}
];
GAMES.hatter = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'A Mad Tea-Party', '', 'Answer five of the Hatter\'s questions — the way they do things at this table. Common sense is not much use.');
  const qs = shuffle(HATTER.slice()).slice(0, 5); let i = 0, right = 0, left = 20, over = false, lock = false;
  function show(){
    if (i >= qs.length){ over = true; return done({win:right >= 3, score:right / 5, msg:`The Hatter counts ${right} of 5 on his fingers, and then on the March Hare's.`}); }
    const q = qs[i]; left = 20; lock = false;
    ui.body.innerHTML = `<div class="riddle">${esc(q.q)}</div><div class="opts">${shuffle(q.o.slice()).map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answer(b.dataset.o));
  }
  function answer(o){
    if (lock || over) return; lock = true;
    const q = qs[i], ok = o === q.a; if (ok){ right++; SND.fx('good'); } else SND.fx('bad');
    ui.msg.textContent = (ok ? 'Quite right! ' : 'No, no! ') + q.say;
    i++; setTimeout(show, 1900);
  }
  show();
  const stop = ticker(dt => { if (over || lock) return; left -= dt; ui.hud.innerHTML = `<span>Question <b>${i + 1}/5</b></span><span>Right <b>${right}</b></span><span>Tea <b>${Math.ceil(left)}s</b></span>`;
    if (left <= 0){ lock = true; ui.msg.textContent = '"Move down!" cries the Hatter, and everybody changes places.'; i++; setTimeout(show, 1400); } });
  return {stop};
};

// ── Croquet, with a flamingo ────────────────────────────────────────────────
GAMES.croquet = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Croquet', '', 'The flamingo\'s head swings to and fro — click, tap or press <b>Space</b> to strike when it points at the arch. The hedgehog wanders; the soldier-arch gets up and walks off now and then. Six strokes.');
  const {c, x} = mkCanvas(ui.body, 760, 380);
  let t = 0, strokes = 6, pts = 0, over = false, ball = {x:140, y:260, vx:0, vy:0, moving:false}, arch = {x:560, y:180, walking:0}, msgT = 0;
  function strike(){
    if (over || ball.moving || strokes <= 0) return;
    const ang = Math.sin(t * 2.4) * 1.2 - .3, pw = 340 + Math.random() * 60;
    ball.vx = Math.cos(ang) * pw; ball.vy = Math.sin(ang) * pw; ball.moving = true; strokes--; SND.fx('hit');
    if (Math.random() < .25){ ui.msg.textContent = 'The flamingo twists round and looks up into your face. You miss.'; ball.vx *= .2; ball.vy *= .2; }
  }
  c.addEventListener('pointerdown', strike);
  const stop = ticker(dt => {
    if (over) return;
    t += dt;
    if (!ball.moving){ ball.x += Math.sin(t * .7) * 14 * dt; ball.y += Math.cos(t * .9) * 10 * dt; ball.x = clamp(ball.x, 60, 300); ball.y = clamp(ball.y, 80, 320); }
    else { ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.vx *= Math.pow(.25, dt); ball.vy *= Math.pow(.25, dt);
      if (ball.y < 40 || ball.y > 350) ball.vy *= -1;
      if (Math.abs(ball.x - arch.x) < 14 && Math.abs(ball.y - arch.y) < 26 && !arch.walking){ pts++; SND.fx('good'); ui.msg.textContent = 'Through the arch! The Queen glares.'; ball.vx = ball.vy = 0; }
      if (Math.hypot(ball.vx, ball.vy) < 12 || ball.x > 740){ ball.moving = false; ball.x = clamp(ball.x, 60, 300); }
    }
    if (arch.walking > 0){ arch.walking -= dt; arch.y += 60 * dt * (arch.dir || 1); if (arch.walking <= 0){ arch.y = rnd(80, 300); arch.x = rnd(480, 680); } }
    else if (Math.random() < dt * .18){ arch.walking = 1.2; arch.dir = Math.random() < .5 ? -1 : 1; ui.msg.textContent = 'The soldier forming your arch gets up and walks off to watch an execution.'; }
    msgT += dt; if (msgT > 5){ msgT = 0; if (Math.random() < .5) ui.msg.textContent = '"Off with his head!" shouts the Queen, at somebody.'; }
    x.fillStyle = '#7aab4a'; x.fillRect(0, 0, 760, 380); x.strokeStyle = '#6a9a3a'; x.lineWidth = 3; for (let i = 0; i < 9; i++){ x.beginPath(); x.moveTo(0, 30 + i * 42); x.quadraticCurveTo(380, 10 + i * 42, 760, 30 + i * 42); x.stroke(); }
    x.save(); x.translate(arch.x, arch.y); x.strokeStyle = '#fffaf0'; x.lineWidth = 10; x.beginPath(); x.moveTo(-14, 26); x.quadraticCurveTo(-14, -26, 0, -28); x.quadraticCurveTo(14, -26, 14, 26); x.stroke(); x.fillStyle = '#b8202a'; x.font = '14px serif'; x.textAlign = 'center'; x.fillText('♣', 0, -6); x.restore();
    x.fillStyle = '#7a6a5a'; x.beginPath(); x.ellipse(ball.x, ball.y, 12, 8, 0, 0, 7); x.fill(); x.strokeStyle = '#4a3a2a'; x.lineWidth = 1; for (let i = 0; i < 6; i++){ x.beginPath(); x.moveTo(ball.x - 9 + i * 3, ball.y - 5); x.lineTo(ball.x - 11 + i * 3, ball.y - 11); x.stroke(); }
    if (!ball.moving && strokes > 0){ const ang = Math.sin(t * 2.4) * 1.2 - .3; x.strokeStyle = '#f080a0'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.moveTo(ball.x - Math.cos(ang) * 70, ball.y - Math.sin(ang) * 70); x.lineTo(ball.x - Math.cos(ang) * 16, ball.y - Math.sin(ang) * 16); x.stroke();
      x.fillStyle = '#f080a0'; x.beginPath(); x.arc(ball.x - Math.cos(ang) * 14, ball.y - Math.sin(ang) * 14, 6, 0, 7); x.fill();
      x.setLineDash([4, 6]); x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(ball.x, ball.y); x.lineTo(ball.x + Math.cos(ang) * 200, ball.y + Math.sin(ang) * 200); x.stroke(); x.setLineDash([]); }
    ui.hud.innerHTML = `<span>Strokes <b>${strokes}</b></span><span>Arches <b>${pts}</b></span>`;
    if (strokes <= 0 && !ball.moving){ over = true; done({win:pts >= 2, score:pts / 4, msg:`You got through ${pts} arch${pts === 1 ? '' : 'es'}.`}); }
  });
  return {stop, key(e){ if (e.key === ' ' || e.code === 'Space'){ e.preventDefault(); strike(); } }};
};

// ── The Trial: stuff and nonsense ───────────────────────────────────────────
GAMES.trial = (cfg, wrap, done) => {
  const ui = gameShell(wrap, 'Sentence First', '', 'Speak up plainly and you grow — and the Queen grows angrier. Curtsey and you keep your head, but stay small. Answer in their own mad logic and you puzzle them, at a cost to your wits. Grow to your full size before the Queen loses her temper entirely.');
  const R = [
    {s:'The Queen: "Hold your tongue!"', o:[{t:'"I won\'t!"', k:'sense'},{t:'(Curtsey, and hold it.)', k:'manners'},{t:'"I can\'t hold it — it\'s attached."', k:'mad'}]},
    {s:'The King: "Rule Forty-two. All persons more than a mile high to leave the court."', o:[{t:'"That\'s not a regular rule: you invented it just now."', k:'sense'},{t:'"Then I shall try to be a little less than a mile, your Majesty."', k:'manners'},{t:'"Then it ought to be Number One."', k:'mad'}]},
    {s:'The White Rabbit: "Here\'s a paper, not in the prisoner\'s handwriting, and it isn\'t signed."', o:[{t:'"If he didn\'t sign it, that only makes it worse," says the King. — "It proves nothing of the sort!"', k:'sense'},{t:'"Perhaps he forgot, your Majesty."', k:'manners'},{t:'"Then he must have meant some mischief, or he\'d have signed his name like an honest man."', k:'mad'}]},
    {s:'The King: "\'Said I could not swim\' — you can\'t swim, can you?" (to the Knave)', o:[{t:'"There\'s not a grain of meaning in it!"', k:'sense'},{t:'"Perhaps it is an allegory, your Majesty."', k:'manners'},{t:'"He\'s made of cardboard. Of course he can\'t."', k:'mad'}]},
    {s:'The Queen: "Sentence first — verdict afterwards!"', o:[{t:'"Stuff and nonsense! The idea of having the sentence first!"', k:'sense'},{t:'"As your Majesty pleases."', k:'manners'},{t:'"Then the verdict should come before the trial, and the tarts before the theft."', k:'mad'}]}];
  const W = {sense:[24, 16, 0], manners:[6, -8, 0], mad:[14, 4, 4]};   // [growth, wrath, wits lost]
  let i = 0, grow = 20, wrath = 20, wits = 0, over = false;
  function show(){
    if (i >= R.length){ over = true; return done({win:grow >= 90, score:grow / 100, fx:{health:-wits, sus:Math.round((wrath - 20) / 3)},
      msg: grow >= 90 ? 'You have grown to your full size by this time, and you are not afraid of them at all.' : 'You are still rather small, and the Queen is still shouting. But you are growing, all the same.'}); }
    const r = R[i];
    ui.body.innerHTML = `<div class="art" style="cursor:default">${VIGNETTES.court()}</div><div class="smaugline">${esc(r.s)}</div>
      <div style="max-width:560px;margin:6px auto"><div class="meta">How large you've grown</div><div class="gbar"><i style="width:${grow}%;background:#2d6b74"></i></div>
      <div class="meta">The Queen's temper</div><div class="gbar"><i style="width:${wrath}%;background:#b8202a"></i></div></div>
      <div class="choices">${shuffle(r.o.slice()).map(o => `<button class="choice talk" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answer(b.dataset.k));
    ui.hud.innerHTML = `<span>Exchange <b>${i + 1}/${R.length}</b></span>`;
  }
  function answer(k){
    if (over) return;
    const [g, w, m] = W[k]; grow = clamp(grow + g, 0, 100); wrath = clamp(wrath + w, 0, 100); wits += m;
    ui.msg.textContent = k === 'sense' ? 'You feel yourself growing, quite a lot. The Queen turns purple.' : k === 'manners' ? 'The Queen sniffs. You stay about the same size.' : 'The jury write it all down on their slates, and add it up, and reduce the answer to shillings and pence.';
    SND.fx(k === 'sense' ? 'boom' : 'click');
    if (wrath >= 100){ over = true; return done({win:false, score:grow / 100, fx:{sus:30, health:-wits}, msg:'"OFF WITH HER HEAD!" The Queen is beside herself.'}); }
    i++; setTimeout(show, 900);
  }
  show();
  return {stop(){}};
};

// ═══ TITLE, MENU, BOOT ══════════════════════════════════════════════════════
function renderTitle(){
  const sv = tryLoad();
  $('#stage').innerHTML = `<div class="titlescr">${VIGNETTES.bank()}
    <h1>Curiouser &amp; Curiouser</h1><div class="sub">being Alice's Adventures in Wonderland, by Lewis Carroll, in twelve chapters</div>
    <div class="verse">All in the golden afternoon<br>Full leisurely we glide;<br>For both our oars, with little skill,<br>By little arms are plied…</div>
    <div class="btns">${sv ? `<button class="btn gold" data-load>Continue — Chapter ${romanize(sv.chapter)}: ${esc(sv.chTitle || '')}</button>` : ''}<button class="btn" data-new>Follow the White Rabbit</button></div>
    <p class="meta" style="margin-top:18px;max-width:580px;margin-left:auto;margin-right:auto">Twelve chapters, ${Object.keys(SONGS).length} of Carroll's verses, ${Object.keys(MAPS).length} maps and nine trials. Keep your <b>Curiosity</b> up and your <b>Wits</b> about you, mind the <b>Queen's Wrath</b>, and keep an eye on your <b>Size</b> — some doors want you very small, and some things want you very tall. Carroll's own words are quoted throughout; the book is in the public domain.</p></div>`;
  wireStage();
  const nb = $('#stage').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Begin again? Your saved game will be lost.')) startNew(); };
}
function openMenu(){
  openModal(`<div class="ptitle" style="font-size:1.2rem;text-align:center">Menu</div>
    <div class="choices" style="max-width:420px">
      ${G && G.checkpoint ? `<button class="choice" id="mcp">↺ Begin this chapter again (${esc(G.chTitle)})</button>` : ''}
      <button class="choice" id="mhelp">How to play</button>
      <button class="choice" id="msnd">${SND.on ? '♪ Sound: on' : '♪ Sound: off'}</button>
      <button class="choice" id="mnew">Begin again</button>
      ${G ? '<button class="choice" id="mtitle">Back to the title page</button>' : ''}
    </div><p class="meta center">Your progress is saved after every step.</p>`);
  const q = id => document.getElementById(id);
  if (q('mcp')) q('mcp').onclick = () => { if (confirm('Go back to the start of this chapter?')) restoreCheckpoint(); };
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.2rem">How to play</div><div class="text">${paras(`You are Alice, and a White Rabbit with a pocket-watch has just run past. Read, choose, and play your way through Wonderland.

<b>Size</b> matters most of all. Some choices only appear when you are the right size (the size meter is in the header; choices marked ⇡ make you grow and ⇣ make you shrink). Drink what says DRINK ME, eat what says EAT ME, and keep a bit of the Caterpillar's mushroom about you.

<b>Curiosity</b> rises as you explore and ask questions. <b>Wits</b> are your good sense: choices marked ☾ are <b>mad logic</b> — answering Wonderland in its own sort of sense — which the creatures like, but which costs a little Wits each time. Run out of Wits and you are quite mad; keep very few, and you may never leave the tea-table. <b>The Queen's Wrath</b> rises when you cross her: at 100, it is "Off with her head!" <b>Comfits</b> are your Caucus-race prizes.

Trials: falling down the rabbit-hole, the Caucus-race, escaping the enormous puppy, nibbling the mushroom to the right size, the Hatter's riddles, croquet with a flamingo, a stealth crossing of the croquet-ground (R to fade like the Cheshire Cat), the Lobster Quadrille, and the trial. Every one can be skipped.

The side panel has a map of Wonderland showing your way, the creatures you've met, your pocket, Carroll's verses as you learn them (press Sing it), every map you've reached, and your notes.`)}</div>`);
  q('msnd').onclick = () => { SND.on = !SND.on; openMenu(); updateSoundBtn(); };
  q('mnew').onclick = () => { if (!G || confirm('Begin again? Your current progress will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; render(); };
}
function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound on' : 'Sound off'; }

$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    return;
  }
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#stage').querySelectorAll('.choices button'); const b = btns[+e.key - 1]; if (b) b.click();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; if (UI.game && UI.inst && UI.inst.keyup) UI.inst.keyup(e); });
window.addEventListener('blur', () => { UI.keys = {}; });

updateSoundBtn();
G = null;
render();
</script>
