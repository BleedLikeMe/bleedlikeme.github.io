<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Totopoly</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--baize:#1f4d2e;--baize2:#0f2717;--cream:#f4ecd8;--card:#fbf6ea;--ink:#2a2118;--muted:#7a6a55;--gold:#c9a227;--red:#a8322d;--green:#2f7a3b;--line:#d8c9a3;--wood:#6b4a26;--wood2:#3e2a14}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Lora,Georgia,serif;min-height:100vh;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 25%,#2d6a43,var(--baize2) 78%);background-color:var(--baize2);background-attachment:fixed}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 16px;background:linear-gradient(#10281a,#0a1c11);color:var(--cream);border-bottom:3px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,.5)}
header .crest{width:44px;height:44px;flex:none}
header h1{font-family:'Playfair Display',serif;margin:0;font-size:28px;letter-spacing:1px;font-weight:900}
header h1 span{color:var(--gold);font-style:italic}
header .sub{color:#cdbf98;font-size:13px;font-style:italic}
header .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
button{font-family:inherit;font-size:14px;border:1px solid #6b5636;background:linear-gradient(#fff8e6,#e9dcb8);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer;box-shadow:0 2px 0 #8a7448}
button:hover:not(:disabled){background:linear-gradient(#fffdf4,#f1e5c4)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #8a7448}
button:disabled{opacity:.45;cursor:default}
button.go{background:linear-gradient(#3d8a4c,#2a6436);color:#fff;border-color:#1c4524;box-shadow:0 2px 0 #163a1e}
button.warn{background:linear-gradient(#c24a42,#962f28);color:#fff;border-color:#6d211c;box-shadow:0 2px 0 #5a1b17}
button.small{padding:3px 8px;font-size:12px}
header button{background:transparent;color:var(--cream);border-color:#5d6f55;box-shadow:none}
#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1480px;margin:0 auto}
@media(max-width:980px){#app{grid-template-columns:1fr}}
.panel{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 40%),var(--cream);border-radius:8px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.45);border:1px solid var(--line)}
.panel h2{font-family:'Playfair Display',serif;margin:0 0 8px;font-size:23px}
.panel h3{font-family:'Playfair Display',serif;margin:12px 0 6px;font-size:17px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#side{display:flex;flex-direction:column;gap:14px}
.pl{border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--card)}
.pl.cur{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(201,162,39,.5)}
.plh{display:flex;align-items:center;gap:6px;font-weight:600}
.plh .cash{margin-left:auto;font-variant-numeric:tabular-nums;font-family:'Playfair Display',serif;font-size:17px}
.neg{color:var(--red)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;margin-top:4px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;background:var(--sc);border:2px solid var(--pc,#fff);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.form{font-size:11px;padding:0 4px;border-radius:3px;background:#e5dcc4}
.form.up{background:#cfe8cf;color:#1d5a26}.form.down{background:#f2d0cc;color:#7d201a}
.chip{font-size:10px;padding:1px 5px;border-radius:8px;border:1px solid;cursor:help;white-space:nowrap}
.chip.good{background:#e3f2e1;border-color:#7fb07a;color:#245c22}
.chip.bad{background:#f8e2df;border-color:#d08b84;color:#842a22}
.hname{border-bottom:3px solid var(--sc)}
.silks{vertical-align:middle;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
#log{max-height:340px;overflow:auto;font-size:13px}
#log div{padding:3px 0;border-bottom:1px dotted var(--line)}
/* training board */
.boardwrap{background:linear-gradient(135deg,var(--wood),var(--wood2));padding:10px;border-radius:12px;box-shadow:inset 0 0 0 2px #8d6a3d,0 4px 12px rgba(0,0,0,.4);max-width:820px;margin:0 auto}
.board{display:grid;grid-template-columns:1.35fr repeat(7,1fr) 1.35fr;grid-template-rows:1.35fr repeat(7,1fr) 1.35fr;aspect-ratio:1;width:100%;gap:3px;background:#0b2012;padding:4px;border-radius:6px}
.sq{background:linear-gradient(#fffaf0,#f1e6cc);position:relative;display:flex;flex-direction:column;align-items:center;padding:0 2px 2px;overflow:hidden;text-align:center;line-height:1.05;font-size:clamp(7px,1vw,11px);border-radius:3px}
.sq .band{height:15%;min-height:5px;align-self:stretch;margin:0 -2px 2px;background:var(--bc)}
.sq .ic{width:clamp(16px,2.6vw,30px);height:clamp(16px,2.6vw,30px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.6vw,17px);background:radial-gradient(circle at 35% 30%,#fff,#e8dbbb);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);margin-bottom:1px}
.sq .lbl{font-weight:600}
.sq.corner{background:linear-gradient(160deg,#f6e9c6,#e3cf9c);font-size:clamp(8px,1.1vw,12px)}
.sq.corner .barn{width:58%;margin-top:6%}
.sq.corner .lbl{font-family:'Playfair Display',serif}
.sq.land{box-shadow:inset 0 0 0 3px var(--gold),0 0 10px var(--gold);z-index:1}
.sq .toks{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;margin-top:auto}
.toks.many .tok{width:clamp(9px,1.3vw,14px);height:clamp(9px,1.3vw,14px);font-size:clamp(6px,.7vw,8px);border-width:1px}
.tok{display:inline-flex;align-items:center;justify-content:center;width:clamp(12px,1.9vw,20px);height:clamp(12px,1.9vw,20px);border-radius:50%;color:#fff;font-size:clamp(7px,.9vw,10px);font-weight:700;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 55%),var(--sc);border:2px solid var(--pc);box-shadow:0 2px 3px rgba(0,0,0,.45);position:relative;z-index:3}
.tok.home{opacity:.55;filter:saturate(.6)}
.center{grid-row:2/9;grid-column:2/9;background:radial-gradient(ellipse at 50% 40%,#2c6b40,#173f24);border-radius:6px;color:var(--cream);padding:clamp(8px,2vw,22px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:auto;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.center h2{font-family:'Playfair Display',serif;margin:0;font-size:clamp(16px,2.6vw,30px);letter-spacing:1px}
.center .emblem{width:clamp(60px,12vw,130px)}
.dice{display:flex;gap:12px}
.die{filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.die.roll{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6) translateY(-20px)}70%{transform:rotate(15deg) scale(1.08)}100%{transform:none}}
.center .note{font-size:13px;color:#d9cfae;max-width:460px}
.turnpill{font-weight:600;background:#fffd;padding:3px 14px;border-radius:14px;display:flex;align-items:center;gap:6px}
.lastmove{background:rgba(0,0,0,.28);border-radius:6px;padding:6px 10px;font-size:13px;max-width:500px;text-align:left}
.lastmove div{padding:2px 0}
.formtab{font-size:13px;margin:4px 0 6px}.formtab td:first-child{white-space:nowrap;font-weight:600}
.lastmove .throw{display:inline-block;min-width:20px;text-align:center;background:#f4ecd8;color:#222;border-radius:4px;margin-right:4px}
.trainbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.trainbtns small{opacity:.8}
/* tables */
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list th{font-family:'Playfair Display',serif;font-size:13px;color:var(--muted)}
table.list tr.hi td{background:#fff3c9}
input[type=number],input[type=text],select{font-family:inherit;font-size:14px;padding:5px;border:1px solid #b9a77f;border-radius:5px;background:#fffdf6}
input[type=number]{width:80px}
/* lease cards */
.hand{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.lease{width:170px;background:var(--card);border:1px solid #b9a77f;border-radius:10px;overflow:hidden;box-shadow:0 3px 6px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.lease:hover{transform:translateY(-3px)}
.lease.kept{box-shadow:0 0 0 3px var(--green),0 6px 10px rgba(0,0,0,.3)}
.lease .top{background:var(--sc);color:#fff;padding:5px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between}
.lease .body{padding:8px;text-align:center}
.lease .hn{font-family:'Playfair Display',serif;font-size:18px;margin:4px 0}
.lease .price{font-family:'Playfair Display',serif;font-size:20px}
.lease .stamp{position:absolute;top:34px;right:6px;transform:rotate(12deg);border:2px solid var(--green);color:var(--green);font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px;background:#fffc}
.lot{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch}
.horsecard{background:var(--card);border:2px solid var(--sc);border-radius:10px;padding:14px 18px;min-width:250px;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;gap:14px;align-items:center}
.horsecard .hn{font-family:'Playfair Display',serif;font-size:26px}
.horsecard .st{display:inline-block;background:var(--sc);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.bidbox{flex:1;min-width:240px}
.bigbid{font-family:'Playfair Display',serif;font-size:36px}
.gavel{display:inline-block;animation:gav 1.2s ease-in-out infinite;transform-origin:80% 80%}
@keyframes gav{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg)}}
/* race */
.track{border-radius:10px;border:4px solid var(--wood);background:#1d4a27;overflow:hidden;box-shadow:inset 0 0 0 2px #8d6a3d}
.track svg{display:block;width:100%;height:auto}
.rt{transition:none}
.runners{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:10px}
.runner{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:6px;padding:5px 8px;font-size:12px}
.runner.lastm{box-shadow:0 0 0 2px var(--gold)}
.runner .nm{font-weight:600;font-size:13px}
.runner .pos{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.decide{background:#173f24;color:var(--cream);border-radius:8px;padding:10px 14px;margin:10px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.decide .opts{display:flex;gap:8px;flex-wrap:wrap}
.decide .opts button{min-width:150px;text-align:left;line-height:1.25}
.decide .opts button small{display:block;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:16px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.3)}
.placings{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.place{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:160px;display:flex;gap:8px;align-items:center}
.place .pos{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold)}
details.rules{font-size:14px}
details.rules summary{cursor:pointer;font-weight:600;font-family:'Playfair Display',serif;font-size:17px}
.setup{max-width:660px;margin:20px auto}
.setup .prow{display:grid;grid-template-columns:24px 34px 1fr 140px;gap:8px;align-items:center;margin:6px 0}
.tote td.div{font-family:'Playfair Display',serif}
.bizname{border-bottom:3px solid #5b4630}
.bizchip{font-size:11px;padding:1px 6px;border-radius:8px;background:#efe3c6;border:1px solid #b9a77f;cursor:help;white-space:nowrap}
.lease.biz{background:linear-gradient(#fbf6ea,#f1e6cc)}
.bizicon{font-size:38px;line-height:1.1}
.sqown{position:absolute;top:18%;right:3px;width:clamp(7px,1vw,11px);height:clamp(7px,1vw,11px);border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
button,.lease,.sq{touch-action:manipulation}
.center .rest{display:contents}
.mobrest{display:none;flex-direction:column;align-items:center;gap:8px;margin-top:8px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#2c6b40,#173f24);color:var(--cream);border-radius:8px;padding:10px}
.mobrest .note{font-size:13px;color:#d9cfae}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,420px);background:#0f2717;color:var(--cream);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* phones */
@media(max-width:700px){
  #app{padding:8px;gap:10px}
  header{padding:7px 10px;gap:4px 10px}
  header h1{font-size:21px}
  header .sub{display:none}
  header .crest{width:34px;height:34px}
  header .right{font-size:12px;gap:6px}
  .panel{padding:10px}
  .panel h2{font-size:19px}
  button{min-height:38px}
  button.small{min-height:30px}
  .boardwrap{padding:5px;border-radius:8px}
  .board{gap:2px;padding:2px}
  .sq{padding:0 1px 1px}
  .sq:not(.corner) .lbl{display:none}
  .sq .ic{width:68%;height:auto;aspect-ratio:1;font-size:clamp(9px,3.4vw,16px);margin-top:1px}
  .sq.corner .lbl{font-size:7px;line-height:1;overflow-wrap:anywhere}
  .sqown{top:14%;right:1px;width:7px;height:7px;border-width:1px}
  .sq.corner .barn{width:48%;margin-top:3%}
  .tok,.toks.many .tok{width:13px;height:13px;font-size:7.5px;border-width:1.5px}
  .center{padding:6px;gap:4px}
  .center .emblem{display:none}
  .center h2{font-size:15px}
  .center .rest{display:none}
  .mobrest{display:flex}
  .die{width:40px;height:40px}
  .hand{gap:8px}
  .lease{width:calc(50% - 4px)}
  .lease .hn{font-size:16px}
  .horsecard{min-width:0;width:100%}
  .bidbox{min-width:0}
  .bigbid{font-size:30px}
  .runners{grid-template-columns:1fr}
  .racectl{position:sticky;bottom:0;z-index:5;background:var(--cream);margin:0 -10px;padding:2px 10px 4px;box-shadow:0 -4px 10px rgba(0,0,0,.25)}
  .racectl .decide{margin:6px 0;padding:8px;gap:8px}
  .racectl .decide .die{width:34px;height:34px}
  .decide .opts{width:100%;flex-wrap:nowrap;gap:5px}
  .decide .opts button{min-width:0;flex:1 1 0;padding:5px 6px;font-size:13px}
  .decide .opts button small{font-size:11px}
  .racectl .row{margin:6px 0!important;gap:5px}
  .racectl .row button{padding:6px 9px;font-size:13px}
  .setup .prow{grid-template-columns:22px 30px 1fr 104px;gap:6px}
  table.list{font-size:13px}
  table.list th,table.list td{padding:4px}
}
</style>
</head>
<body>
<header>
  <svg class="crest" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#173f24" stroke="#c9a227" stroke-width="2"/><path d="M13 31 C12 22 16 13 25 11 C28 10 31 12 31 15 L28 16 C30 19 30 23 27 26 L24 25 L22 31 Z" fill="#f4ecd8"/><circle cx="26.5" cy="14.5" r="1" fill="#173f24"/><path d="M12 34 H32" stroke="#c9a227" stroke-width="2"/></svg>
  <h1>TOTOPOLY</h1>
  <div class="sub">A racehorse owners' board game</div>
  <div class="right"><span id="meet"></span><button onclick="confirmNew()">New game</button></div>
</header>
<div id="toast"></div>
<div id="app">
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<script>
'use strict';
// ── DATA ──────────────────────────────────────────────────────────────
const START_CASH=1000, LEN=48, LANES=6, ENTRY_FEE=25, MAX_ENTRIES=3, ADDED_MONEY=300, TOTE_TAKE=0.10, PUBLIC_MONEY=150;
// Race course: every lane has the same squares on the straights, but each bend gains BEND_EXTRA squares
// per lane out from the rail, so the inside is the short way round. LEN is the distance on the rail.
const HALF=7, BEND=12, BEND_EXTRA=1, OFF=2;
const FIN=l=>LEN+2*l*BEND_EXTRA;                       // lengths to the post in lane l
const segLens=l=>[HALF,BEND+l*BEND_EXTRA,2*HALF,BEND+l*BEND_EXTRA,HALF];
function kSeg(l,k){const S=segLens(l);let c=k;for(let i=0;i<5;i++){if(c<S[i]||i===4)return[i,c/S[i]];c-=S[i]}}
function mapPos(l,p,l2){ // the square level with lane l, position p, in lane l2
  if(l===l2)return p;const[i,t]=kSeg(l,p+OFF+.5),S=segLens(l2);let k=-.5;for(let j=0;j<i;j++)k+=S[j];
  return Math.round(k+t*S[i])-OFF}
const toGo=s=>FIN(s.lane)-s.pos;
const onFinalBend=(l,p)=>p>=0&&kSeg(l,p+OFF+.5)[0]===3;   // segment 3 is the second (final) bend: no lane changes there
const STABLES=[
  {name:'Warren Place',col:'#a8322d'},
  {name:'Godolphin Stables',col:'#24508a'},
  {name:'Freemason Lodge',col:'#2f7a3b'},
  {name:'Coolmore',col:'#b07d0b'}];
const CLASS=['C','B','A'];
const HORSES=[ // name, stable, class (0=C 1=B 2=A), list price
  ['Copper Kettle',0,2,200],['Lantern Jaw',0,1,140],['Mistral Hope',0,0,90],
  ['Harbour Light',1,2,210],['Saltmarsh',1,1,130],['Tin Whistle',1,0,80],
  ['Bramble Jig',2,1,150],["Weaver's Lad",2,2,190],['Kelpie Run',2,0,100],
  ['Gilded Sparrow',3,0,90],['Northern Ember',3,2,220],['Peat Smoke',3,1,140]];
const PCOLS=['#e67e22','#8e44ad','#17a589','#34495e'];
const BANKCOL='#9a9a9a';
// Training ring: 32 squares. The four corners are the yards; each horse sets out from its own yard
// and makes LAPS full circuits back to it.
const SQ=[
  {t:'yard',s:0},
  {t:'gallops'},{t:'work'},{t:'paddock',s:1},{t:'feed'},{t:'gallops'},{t:'trial'},{t:'lame'},
  {t:'yard',s:1},
  {t:'gallops'},{t:'farrier'},{t:'paddock',s:2},{t:'vet'},{t:'gallops'},{t:'rest'},{t:'work'},
  {t:'yard',s:2},
  {t:'gallops'},{t:'bar'},{t:'paddock',s:3},{t:'lame'},{t:'gallops'},{t:'trial'},{t:'feed'},
  {t:'yard',s:3},
  {t:'gallops'},{t:'work'},{t:'paddock',s:0},{t:'vet'},{t:'gallops'},{t:'farrier'},{t:'rest'}];
const LAPS=3,LAP_LEN=SQ.length,TRAIN_LEN=LAPS*LAP_LEN;
const lapOf=h=>Math.min(LAPS,Math.floor(h.prog/LAP_LEN)+1);
const SQINFO={ // icon, label, help, band colour
  yard:['','','Its own horses start and finish their laps here (a quiet stop between laps). Other owners\' horses pay stable fees: £15 per horse kept here, £75 if one owner has all three','#000'],
  paddock:['🐎','','Pay the yard\'s owners: £15 per horse they keep there, £75 if one owner has all three. A horse from that yard gets +1 form','#000'],
  gallops:['🂠','Trainer\'s Report','Draw a Trainer\'s Report card','#c9a227'],
  feed:['🌾','Feed Bill £20','Pay £20','#a8322d'],
  work:['💪','Fast Work','+2 form','#24508a'],
  trial:['🏆','Trial Win £40','Collect £40','#2f7a3b'],
  rest:['💧','Water Trough','Eased off: −1 form','#7a6a55'],
  farrier:['🔨','Farrier £15','Pay £15, +1 form','#24508a'],
  vet:['💉','Vet £30','Pay £30','#a8322d'],
  lame:['🤕','Knock','−2 form','#7d201a'],
  bar:['🍺',"Owners' Bar",'Collect £20','#2f7a3b']};
// Business lease cards, dealt and auctioned alongside the horses. Square-owning businesses collect the
// payment when any other owner's horse lands on their squares; the owner's own horses pay nothing.
const BUSINESSES=[
  {key:'auct',  name:'Auctioneer',         icon:'📣',price:70, desc:'Takes 5% commission on every sale in the sales ring'},
  {key:'forage',name:'Forage Merchant',    icon:'🌾',price:190,sq:'feed',   desc:'Owns the two Feed Bill squares: £20 to you'},

// Race course geometry: a stadium-shaped oval, lane 0 on the inside rail.
const TR={cx:500,cy:282,L:232,R0:118,W:22};
function trackPt(f,rad){
  const S=2*TR.L,B=Math.PI*TR.R0,T=2*S+2*B;let d=((f*T+TR.L)%T+T)%T;
  if(d<S)return[TR.cx-TR.L+d,TR.cy+rad];
  if(d<S+B){const a=(d-S)/B*Math.PI;return[TR.cx+TR.L+rad*Math.sin(a),TR.cy+rad*Math.cos(a)]}
  if(d<2*S+B)return[TR.cx+TR.L-(d-S-B),TR.cy-rad];
  const a=(d-2*S-B)/B*Math.PI;return[TR.cx-TR.L-rad*Math.sin(a),TR.cy-rad*Math.cos(a)];
}
function segPt(i,t,rad){const{cx,cy,L}=TR,a=t*Math.PI;
  return i===0?[cx+t*L,cy+rad]:i===1?[cx+L+rad*Math.sin(a),cy+rad*Math.cos(a)]:i===2?[cx+L-t*2*L,cy-rad]
    :i===3?[cx-L-rad*Math.sin(a),cy-rad*Math.cos(a)]:[cx-L+t*L,cy+rad]}
const lanePt=(l,k,rad)=>{const[i,t]=kSeg(l,k);return segPt(i,t,rad)};
const cellXY=(lane,pos)=>lanePt(lane,Math.min(pos,FIN(lane)+1)+OFF+.5,TR.R0+(lane+.5)*TR.W).map(v=>+v.toFixed(1));
function cellPoly(l,c){
  const r1=TR.R0+l*TR.W,r2=r1+TR.W,pts=[],n=kSeg(l,c+.5)[0]%2?4:1;
  for(let k=0;k<=n;k++)pts.push(lanePt(l,c+k/n,r1));
  for(let k=n;k>=0;k--)pts.push(lanePt(l,c+k/n,r2));
  return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
}
function railPath(rad){const pts=[];for(let k=0;k<=240;k++)pts.push(trackPt(k/240,rad).map(v=>v.toFixed(1)).join(','));return 'M'+pts.join(' L')+'Z'}

  [[TR.cx+90,TR.cy-50],[TR.cx+130,TR.cy-30],[TR.cx+105,TR.cy-15],[TR.cx-230,TR.cy+40],[TR.cx-250,TR.cy+20],[TR.cx+200,TR.cy+50]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y+4}" r="17" fill="#163d22" opacity=".5"/><circle cx="${x}" cy="${y}" r="16" fill="#2b6e37"/><circle cx="${x-4}" cy="${y-5}" r="7" fill="#3f8a4a"/>`);

  // final bend: dashed marks where it starts and ends, and a note in the infield

     s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#ffe27a" stroke-width="2" stroke-dasharray="4 3"/>`});
   const x=TR.cx-TR.L-TR.R0+62,y=TR.cy-52;
   s+=`<text x="${x}" y="${y}" font-size="13" text-anchor="middle" fill="#ffe27a" font-style="italic">final bend<tspan x="${x}" dy="14" font-size="10.5" font-style="normal" fill="#fff">hold your lane</tspan></text>`}
  s+=`<text x="${TR.cx+30}" y="${TR.cy+70}" font-family="Playfair Display,serif" font-size="22" text-anchor="middle" fill="#f4ecd8" opacity=".85" font-style="italic">Paddock &amp; Post</text>`;

// ── GAME FLOW ─────────────────────────────────────────────────────────
function newGame(cfg){
  G={players:cfg.players.map((p,i)=>({name:p.name,human:p.human,col:PCOLS[i],cash:START_CASH})),
    horses:HORSES.map((x,i)=>({id:i,name:x[0],stable:x[1],cls:x[2],price:x[3],owner:-1,form:0,cards:[],prog:0,trained:true,wins:0})),
    meeting:1,meetings:cfg.meetings,phase:'lots',cur:0,log:[],deck:[],dice:null,lastMoves:[],anims:[],
    biz:BUSINESSES.map((b,i)=>({...b,id:100+i,owner:-1})),
    auction:null,race:null,bets:[],pool:{},odds:{},results:null};
  // Lease cards are dealt round the table into one hand per owner plus a spare hand for the auctioneer.
  const deck=shuffle([...G.horses.map(h=>h.id),...G.biz.map(b=>b.id)]);G.hands=Array.from({length:NP()+1},()=>[]);
  deck.forEach((id,k)=>G.hands[k%(NP()+1)].push(id));
  log(`<i>The lease cards are dealt: a hand for each owner and one for the auctioneer.</i>`);
  UI.keep={};render();
}
function confirmKeep(ids){
  const p=P(G.cur);let cost=0;
  ids.forEach(id=>{const h=item(id);h.owner=G.cur;cost+=h.price});p.cash-=cost;
  const rej=G.hands[G.cur].filter(id=>!ids.includes(id));
  log(`${pn(G.cur)} keeps ${ids.map(cardName).join(', ')||'nothing'}${cost?` (${fmt(cost)})`:''}${rej.length?` and sends ${rej.length} to auction`:''}.`);
  G.cur++;UI.keep={};
  if(G.cur>=NP())startAuction();
  render();
}
function aiKeep(){
  const worth=c=>isBiz(c)?1.25:(H(c).cls*60+100)/H(c).price;
  const p=P(G.cur),hand=[...G.hands[G.cur]].sort((a,b)=>worth(b)-worth(a)+Math.random()*.1-.05);
  const keep=[];let cash=p.cash,horses=0;
  for(const id of hand){const h=item(id),biz=isBiz(id);
    if((biz||horses<3)&&cash-h.price>=(keep.length?280:150)&&(biz||horses<3)){keep.push(id);cash-=h.price;if(!biz)horses++}}
  confirmKeep(keep);
}

// Auction
function startAuction(){
  const q=shuffle([...G.horses.filter(h=>h.owner<0).map(h=>h.id),...G.biz.filter(b=>b.owner<0).map(b=>b.id)]);
  if(!q.length){startTraining();return}
  const o=bizOf('auct').owner;
  G.phase='auction';G.auction={q,i:-1};log(`<i>The sales ring opens: ${q.length} lots under the hammer${o>=0?`, with ${pn(o)} on the rostrum`:''}.</i>`);nextLot();
}
function aiValue(pi,c){
  const p=P(pi),mine=owned(pi),h=item(c);
  if(isBiz(c))return Math.min(h.price*(0.9+Math.random()*0.5),p.cash-150);
  let v=h.price*(0.8+Math.random()*0.4)+mine.filter(x=>x.stable===h.stable).length*35;
  if(!mine.length)v+=30;
  if(mine.length>=3)v*=0.7;
  return Math.min(v,p.cash-150);
}
function nextLot(){
  const A=G.auction;A.i++;
  if(A.i>=A.q.length){G.auction=null;startTraining();return}
  const c=A.q[A.i],h=item(c);
  Object.assign(A,{hid:c,bid:0,bidder:-1,reserve:r10(h.price*0.5),out:G.players.map(()=>false),turn:(G.meeting+A.i)%NP(),vals:G.players.map((p,pi)=>aiValue(pi,c))});
}
const minNext=()=>G.auction.bidder<0?G.auction.reserve:G.auction.bid+10;
function auctionAct(amount){ // amount=null → pass
  const A=G.auction,pi=A.turn;
  if(amount==null||amount>P(pi).cash){A.out[pi]=true}
  else{A.bid=amount;A.bidder=pi}
  for(let k=1;k<=NP();k++){const j=(pi+k)%NP();if(!A.out[j]&&j!==A.bidder){A.turn=j;render();return}}
  const h=item(A.hid),nm=cardName(A.hid);
  if(A.bidder>=0){h.owner=A.bidder;P(A.bidder).cash-=A.bid;log(`🔨 ${nm} knocked down to ${pn(A.bidder)} for ${fmt(A.bid)}.`);
    const o=bizOf('auct').owner;if(o>=0){const c=Math.max(5,r5(A.bid*COMMISSION));P(o).cash+=c;log(`📣 ${pn(o)} takes ${fmt(c)} commission.`)}}
  else log(`${nm} fails to reach its reserve and stays with the Bank.`);
  nextLot();render();
}
function aiAuction(){
  const A=G.auction,pi=A.turn,m=minNext(),v=A.vals[pi];
  if(m<=v&&m<=P(pi).cash-40){let b=m;if(v-m>70&&Math.random()<.4)b=m+20;auctionAct(b)}else auctionAct(null);
}

// Training: on an owner's turn each of their horses still out has its own throw of two dice.
// The owner chooses the order (G.turnMoved = horses already thrown for this turn).
const trainees=pi=>G.horses.filter(h=>h.owner===pi&&!h.trained);
const waiting=()=>trainees(G.cur).filter(h=>!G.turnMoved.includes(h.id));
function startTraining(){
  G.phase='training';G.dice=null;G.lastMoves=[];G.lastRoller=-1;G.turnMoved=[];
  G.horses.forEach(h=>{h.prog=0;h.trained=h.owner<0});
  G.cur=(G.meeting-1+NP()-1)%NP();
  log(`<i>Meeting ${G.meeting}: the string leaves the yards for the training ring.</i>`);
  nextTrainer();
}
function nextTrainer(){
  G.turnMoved=[];
  for(let k=1;k<=NP();k++){const j=(G.cur+k)%NP();if(trainees(j).length){G.cur=j;return}}
  G.trainingDone=true;
}
function throwFor(hid){
  const h=H(hid);
  if(G.trainingDone||!h||h.owner!==G.cur||h.trained||G.turnMoved.includes(hid))return;
  if(!G.turnMoved.length){G.lastMoves=[];G.anims=[]}
  G.dice=[d6(),d6()];G.lastRoller=G.cur;UI.rolled=true;
  const roll=G.dice[0]+G.dice[1];
  const from=h.prog,path=[];
  for(let k=1;k<=roll&&from+k<=TRAIN_LEN;k++)path.push((8*h.stable+from+k)%SQ.length);
  h.prog=Math.min(TRAIN_LEN,from+roll);let msg;
  if(h.prog>=TRAIN_LEN){h.trained=true;h.prog=TRAIN_LEN;
    if(from+roll===TRAIN_LEN){h.form=clampForm(h.form+1);msg=`${hn(h)} walks straight into its own box: a good feed, +1 form.`}
    else msg=`${hn(h)} completes its ${LAPS} laps and is back in its box.`}
  else if(h.prog%LAP_LEN===0)msg=`${hn(h)} stops in at its own yard and sets off on lap ${lapOf(h)} of ${LAPS}.`;
  else{msg=resolveSquare(h);if(Math.floor(from/LAP_LEN)<Math.floor(h.prog/LAP_LEN))msg+=` <span class="muted">(lap ${lapOf(h)} of ${LAPS})</span>`}
  G.lastMoves.push({hid:h.id,sq:ringPos(h),msg,roll});G.anims.push({hid:h.id,path});
  log(`${pn(h.owner)} (${roll}): ${msg}`);
  G.turnMoved.push(h.id);
  if(!waiting().length)nextTrainer();
}
function rollTraining(hid){if(G.trainingDone)return;throwFor(hid);render()}
// Computer owners send the horse furthest round first (it is nearest home).
const aiPickTrainee=w=>w.reduce((a,b)=>b.prog>a.prog?b:a);
// One horse per call when the table is all computers (so it can be watched), or a whole turn
// at once when a human clicks "Next".
function aiTrain(whole){
  if(G.trainingDone)return;
  const n=whole?waiting().length:1;
  for(let k=0;k<n;k++){const w=waiting();if(!w.length)break;throwFor(aiPickTrainee(w).id)}
  render();
}
function stableFees(h,s){
  const p=P(h.owner),inYard=G.horses.filter(x=>x.stable===s&&x.owner>=0),bits=[];
  const owners=[...new Set(inYard.map(x=>x.owner))];
  if(owners.length===1&&inYard.length===3&&owners[0]!==h.owner){
    const o=owners[0];p.cash-=75;P(o).cash+=75;bits.push(`pays ${pn(o)} £75 (whole yard)`);
  }else owners.forEach(o=>{if(o===h.owner)return;const n=inYard.filter(x=>x.owner===o).length*15;p.cash-=n;P(o).cash+=n;bits.push(`pays ${pn(o)} £${n}`)});
  return bits;
}
function resolveSquare(h){
  const i=ringPos(h),sq=SQ[i],p=P(h.owner),pre=`${hn(h)} → <b>${sqName(i)}</b>: `;
  switch(sq.t){
    case 'yard':case 'paddock':{
      const bits=stableFees(h,sq.s);
      if(sq.t==='paddock'&&h.stable===sq.s){h.form=clampForm(h.form+1);bits.push('home ground, +1 form')}
      return pre+(bits.join('; ')||'no fees to pay')+'.';}
    case 'gallops':{
      const c=CARD[drawGallop()];let t=`report: <b>${c.n}</b> (${c.d})`;
      if(c.form){h.form=clampForm(h.form+c.form)}
      else if(c.cash){p.cash+=c.cash}
      else if(has(h,c.id))t+=', but it already has that';
      else h.cards.push(c.id);
      return pre+t+'.';}
    case 'feed':return pre+payBiz(h.owner,20,'forage')+'.';
    case 'work':h.form=clampForm(h.form+2);return pre+'+2 form.';
    case 'trial':p.cash+=40;return pre+'wins a trial, collects £40.';
    case 'rest':h.form=clampForm(h.form-1);return pre+'eased off for a drink, −1 form.';
    case 'farrier':h.form=clampForm(h.form+1);return pre+payBiz(h.owner,15,'smith')+', +1 form.';
    case 'vet':return pre+payBiz(h.owner,30,'vet')+'.';
    case 'lame':h.form=clampForm(h.form-2);return pre+'takes a knock, −2 form.';
    case 'bar':p.cash+=20;return pre+'collects £20.';
  }
  return pre+'nothing.';
}
function endTraining(){G.trainingDone=false;startEntries();render()}

// Entries
// No borrowing: an owner in debt must sell horses back to the Bank (60% of list), weakest first, then businesses.
function settleDebts(){
  G.players.forEach((p,pi)=>{while(p.cash<0&&(owned(pi).length||ownedBiz(pi).length)){
    const h=owned(pi).sort((a,b)=>strength(a)-strength(b))[0]||ownedBiz(pi).sort((a,b)=>a.price-b.price)[0],amt=r10(h.price*0.6);
    p.cash+=amt;h.owner=-1;log(`⚖️ ${pn(pi)} is in debt and must sell ${cardName(h.id)} to the Bank for ${fmt(amt)}.`)}});
}
function startEntries(){G.phase='entries';G.entries=[];G.cur=-1;settleDebts();log('<i>Training is over. Owners declare their runners.</i>');nextEntrant()}
function nextEntrant(){
  for(let j=G.cur+1;j<NP();j++){if(owned(j).length){G.cur=j;
    UI.sel={};owned(j).sort((a,b)=>strength(b)-strength(a)).slice(0,maxEntries(j)).forEach(h=>UI.sel[h.id]=true);return}}
  buildField();
}
const maxEntries=pi=>Math.max(0,Math.min(MAX_ENTRIES,Math.floor(P(pi).cash/ENTRY_FEE)));
function confirmEntries(ids){
  ids=ids.slice(0,maxEntries(G.cur));
  ids.forEach(id=>{G.entries.push(id);P(G.cur).cash-=ENTRY_FEE});
  log(`${pn(G.cur)} declares ${ids.map(id=>hn(H(id))).join(', ')||'no runners'}${ids.length?` (${fmt(ids.length*ENTRY_FEE)} entrance)`:''}.`);
  nextEntrant();render();
}
function aiEntries(){const n=Math.min(maxEntries(G.cur),Math.max(1,Math.floor((P(G.cur).cash-20)/ENTRY_FEE)));confirmEntries(owned(G.cur).sort((a,b)=>strength(b)-strength(a)).slice(0,n).map(h=>h.id))}
function buildField(){
  const field=[...G.entries],bank=shuffle(G.horses.filter(h=>h.owner<0).map(h=>h.id));
  while(field.length<6&&bank.length){const id=bank.pop();field.push(id);log(`The Bank runs ${hn(H(id))} to make up the field.`)}
  G.field=shuffle(field);G.fees=G.entries.length*ENTRY_FEE;startBetting();
}

// Betting on the Tote: all stakes go in one pool, a tenth is taken, and the rest is shared among those who backed the winner.
function startBetting(){
  G.phase='betting';G.bets=[];G.pool={};
  const w=G.field.map(id=>Math.exp(strength(H(id))*0.55)),S=w.reduce((a,b)=>a+b,0);
  G.odds={};G.field.forEach((id,i)=>{G.odds[id]=Math.max(1,Math.min(33,Math.round(0.82*S/w[i]-1)));G.pool[id]=Math.max(5,r5(PUBLIC_MONEY*w[i]/S))});
  G.cur=-1;nextBettor();
}
const poolTotal=()=>Object.values(G.pool).reduce((a,b)=>a+b,0);
const dividend=id=>poolTotal()*(1-TOTE_TAKE)/G.pool[id];
function nextBettor(){if(++G.cur>=NP()){startRace();return}}
function placeBet(hid,stake){
  const p=P(G.cur);stake=Math.floor(stake);
  if(!(stake>0)||stake>p.cash)return false;
  p.cash-=stake;G.pool[hid]+=stake;G.bets.push({p:G.cur,h:hid,stake});
  log(`${pn(G.cur)} puts ${fmt(stake)} on the Tote for ${hn(H(hid))}.`);return true;
}
function doneBetting(){nextBettor();render()}
function aiBet(){
  const p=P(G.cur);
  if(p.cash>80){
    const mine=G.field.filter(id=>H(id).owner===G.cur).sort((a,b)=>strength(H(b))-strength(H(a)));
    const fav=[...G.field].sort((a,b)=>G.odds[a]-G.odds[b]);
    const pick=(mine.length&&Math.random()<.65)?mine[0]:fav[rnd(Math.min(3,fav.length))];
    placeBet(pick,r10(p.cash*(0.08+Math.random()*0.12)));
  }
  doneBetting();
}

// Race: one die per horse; a horse may move one lane in or out first (only if two clear lengths
// ahead of anything in that lane), is baulked by a horse in its path, and obeys only the square it lands on.
function startRace(){
  G.phase='race';
  const st={};G.field.forEach((id,i)=>st[id]={pos:-Math.floor(i/LANES),lane:i%LANES,moves:0,held:false,lose:false,done:false,wind:false,finRound:0,note:'under orders'});
  G.race={st,idx:0,round:1,placed:[],auto:false,speed:420,over:false,last:-1,pending:null,fast:false,anims:[]};
  log(`<i>They're under starter's orders… and they're off!</i>`);
}
function laneFree(lane,from,to,excl){const R=G.race;return !G.field.some(o=>o!==excl&&!R.st[o].done&&R.st[o].lane===lane&&R.st[o].pos>=from&&R.st[o].pos<=to)}
function runPath(id,lane,pos,m){
  const path=[];let p=pos,b=false;
  for(let k=1;k<=m;k++){if(!laneFree(lane,p+1,p+1,id)){b=true;break}p++;path.push([lane,p])}
  return{pos:p,path,baulked:b};
}
function raceOptions(id,m){
  const s=G.race.st[id];
  return [-1,0,1].map(dl=>{
    const lane=s.lane+dl,o={dl,ok:false};
    if(lane<0){o.why='already on the rail';return o}
    if(lane>=LANES){o.why='widest lane';return o}
    if(dl&&onFinalBend(s.lane,s.pos)){o.why='keeps its lane on the final bend';return o}
    const np=mapPos(s.lane,s.pos,lane);
    if(dl&&!laneFree(lane,np-2,np,id)){o.why='not two lengths clear';return o}
    const r=runPath(id,lane,np,m);
    return {dl,ok:true,lane,pos:r.pos,baulked:r.baulked,path:[[s.lane,s.pos],...(dl?[[lane,np]]:[]),...r.path],sq:(!r.baulked&&r.pos<FIN(lane))?SPEC[lane+','+r.pos]||null:null};
  });
}
function sqEffect(h,sq){
  if(!sq)return 0;
  if(sq[0]==='y')return +sq[1]===h.stable?3:0;
  if(has(h,'sure'))return 0;
  if(sq==='fall'||has(h,'clumsy'))return -6;
  return -3.5;
}
function sqLabel(h,sq){
  if(!sq)return '';
  if(sq[0]==='y')return +sq[1]===h.stable?'own colours, +3!':`${STABLES[+sq[1]].name} colours (no use)`;
  if(has(h,'sure'))return (sq==='fall'?'Stumble':'Heavy Going')+' (sure-footed)';
  return sq==='fall'?'Stumble: held till a six':has(h,'clumsy')?'Heavy Going: falls (clumsy)':'Heavy Going: loses a move';
}
function aiPick(h,opts){
  let best=null,bs=-1e9;
  opts.filter(o=>o.ok).forEach(o=>{const sc=o.pos-FIN(o.lane)+sqEffect(h,o.sq)-(o.baulked?.6:0)+(o.dl?-.1:0)+Math.random()*.3;if(sc>bs){bs=sc;best=o}});
  return best;
}
function moveHorse(id){
  const R=G.race,h=H(id),s=R.st[id],own=h.owner>=0?P(h.owner):null;
  R.last=id;
  if(s.lose){s.lose=false;s.moves++;s.note='blowing after the heavy going, loses the move';return}
  if(s.held){const r=d6();s.moves++;if(r===6){s.held=false;s.note='throws a six and is back on its feet'}else s.note=`down, needs a six (threw ${r})`;return}
  if(s.moves===0&&has(h,'nervy')){s.moves++;s.note='nervy, missed the break';log(`${hn(h)} is nervy and misses the break.`);return}
  const die=d6();let m=die;const bits=[];
  if(s.moves===0&&has(h,'flyer')){m+=2;bits.push('flying start +2')}
  {const b=formBonus(h);if(b){m+=b;bits.push(`form ${b>0?'+':'−'}${Math.abs(b)}`)}}
  if(Math.random()<[0,.25,.5][h.cls]){m++;bits.push('class +1')}
  if(s.pos<12&&has(h,'heavy')){m--;bits.push('heavy going −1')}
  if(toGo(s)<=12&&has(h,'finish')){m++;bits.push('finishing +1')}
  if(toGo(s)<=12&&has(h,'fades')){m--;bits.push('fading −1')}
  if(!s.wind&&s.pos>=FIN(s.lane)/2&&has(h,'wind')){m+=3;s.wind=true;bits.push('second wind +3')}
  m=Math.max(1,m);
  if(own&&own.human&&!R.fast){R.pending={id,die,m,bits};return}
  doMove(id,aiPick(h,raceOptions(id,m)),die,m,bits);
}
function doMove(id,o,die,m,bits){
  const R=G.race,h=H(id),s=R.st[id];
  let note=`threw ${die}${bits.length?' ('+bits.join(', ')+')':''} → ${m}`;
  if(!o){s.moves++;s.note=note+', boxed in';return}
  if(o.dl)note+=o.dl<0?', moves in':', moves out';
  s.lane=o.lane;s.pos=o.pos;const path=o.path.slice();
  if(o.baulked)note+=', baulked';
  else if(s.pos<FIN(s.lane)&&o.sq){
    const sq=o.sq;
    if(sq[0]==='y'){if(+sq[1]===h.stable){const r=runPath(id,s.lane,s.pos,3);s.pos=r.pos;path.push(...r.path);note+=', on its own colours: surges on';log(`${hn(h)} hits its own colours and surges on!`)}}
    else if(has(h,'sure'))note+=', sure-footed through the rough';
    else if(sq==='fall'||has(h,'clumsy')){s.held=true;note+=', STUMBLES and goes down';log(`💥 ${hn(h)} stumbles and goes down! It needs a six to get going again.`)}
    else{s.lose=true;note+=', bogged in heavy going'}
  }
  s.moves++;s.note=note;
  if(s.pos>=FIN(s.lane)){s.done=true;s.finRound=R.round}
  R.anims.push({id,path});
}
function chooseLane(dl){
  const R=G.race,pd=R.pending;if(!pd)return;
  const o=raceOptions(pd.id,pd.m).find(x=>x.dl===dl&&x.ok);if(!o)return;
  R.pending=null;R.anims=[];doMove(pd.id,o,pd.die,pd.m,pd.bits);
  if(R.idx>=G.field.length)endRound();
  render();
}
function endRound(){
  const R=G.race;
  const fin=G.field.filter(id=>R.st[id].done&&R.st[id].finRound===R.round).sort((a,b)=>toGo(R.st[a])-toGo(R.st[b])||Math.random()-.5);
  fin.forEach(id=>{R.placed.push(id);const n=R.placed.length;if(n<=3)log(`${['🥇','🥈','🥉'][n-1]} ${hn(H(id))} passes the post ${['first','second','third'][n-1]}!`)});
  R.round++;R.idx=0;
  if(R.placed.length>=3||!G.field.some(id=>!R.st[id].done))finishRace();
}
function step(){
  const R=G.race;if(R.pending)return;
  for(let g=0;g<200&&!R.over;g++){
    if(R.idx>=G.field.length){endRound();continue}
    const id=G.field[R.idx++],s=R.st[id];
    if(s.done)continue;
    moveHorse(id);
    if(!R.pending&&R.idx>=G.field.length)endRound();
    break;
  }
}
function raceStep(){G.race.anims=[];step();render()}
function raceRound(){const R=G.race,r=R.round;R.anims=[];while(!R.over&&!R.pending&&R.round===r)step();render()}
function raceToEnd(){const R=G.race;R.anims=[];R.fast=true;
  if(R.pending){const pd=R.pending;R.pending=null;doMove(pd.id,aiPick(H(pd.id),raceOptions(pd.id,pd.m)),pd.die,pd.m,pd.bits);if(R.idx>=G.field.length)endRound()}
  while(!R.over)step();R.anims=[];render()}
function toggleAuto(){G.race.auto=!G.race.auto;render()}
function finishRace(){
  const R=G.race;R.over=true;R.auto=false;R.pending=null;
  const purse=ADDED_MONEY+G.fees*0.9,prizes=[r5(purse/2),r5(purse/4),r5(purse/4)];
  const res={placed:R.placed.slice(0,3),prizes:[],bets:[],purse:prizes,div:0};
  res.placed.forEach((id,i)=>{const h=H(id);if(i===0)h.wins++;if(h.owner>=0){P(h.owner).cash+=prizes[i];res.prizes.push({p:h.owner,h:id,amt:prizes[i],pos:i})}});
  const win=res.placed[0],bk=bizOf('book').owner;
  if(bk>=0){res.take=Math.round(poolTotal()*TOTE_TAKE);P(bk).cash+=res.take;log(`🎩 ${pn(bk)}, the bookmaker, takes ${fmt(res.take)} (10% of the stakes).`)}
  if(win!=null){res.div=dividend(win);G.bets.forEach(b=>{const ret=b.h===win?Math.round(b.stake*res.div):0;if(ret)P(b.p).cash+=ret;res.bets.push({...b,ret})})}
  else G.bets.forEach(b=>res.bets.push({...b,ret:0}));
  res.prizes.forEach(x=>log(`${pn(x.p)} collects ${fmt(x.amt)} prize money for ${hn(H(x.h))}.`));
  if(win!=null)log(`The Tote pays ${fmt(res.div*10)} for a £10 stake.`);
  res.bets.filter(b=>b.ret).forEach(b=>log(`💰 ${pn(b.p)} collects ${fmt(b.ret)} from the Tote.`));
  G.results=res;
}
function nextMeeting(){
  if(G.meeting>=G.meetings){G.phase='end';log('<i>The season is over.</i>');render();return}
  G.meeting++;G.race=null;G.results=null;G.bets=[];settleDebts();
  G.horses.forEach(h=>{h.form=Math.trunc(h.form/2);h.cards=[]});
  log(`<i>— Meeting ${G.meeting} of ${G.meetings} —</i>`);
  startAuction();render();
}
function sellHorse(hid){
  const h=item(hid),amt=r10(h.price*0.6);
  if(!confirm(`Sell ${h.name} back to the Bank for £${amt}?`))return;
  P(h.owner).cash+=amt;log(`${pn(h.owner)} sells ${cardName(hid)} to the Bank for ${fmt(amt)}.`);h.owner=-1;delete UI.sel[hid];render();
}

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  UI.rot=portrait();
  if(!G){renderSetup();return}
  document.getElementById('meet').textContent=G.phase==='end'?'Season over':`Meeting ${G.meeting} of ${G.meetings}`;
  const m=document.getElementById('main');
  m.innerHTML=({lots:viewLots,auction:viewAuction,training:viewTraining,entries:viewEntries,betting:viewBetting,race:viewRace,end:viewEnd})[G.phase]();
  renderSide();playAnims();schedule();
}
function playAnims(){
  if(G.phase==='training'&&G.anims.length){
    const ctr=i=>{const e=document.querySelector(`.sq[data-i="${i}"]`);if(!e)return null;const r=e.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
    let delay=0;
    G.anims.forEach(a=>{const el=document.querySelector(`[data-tok="${a.hid}"]`);if(!el||!a.path.length)return;
      const end=ctr(a.path[a.path.length-1]),from=ctr((a.path[0]-1+SQ.length)%SQ.length);if(!end||!from)return;
      const pts=[from,...a.path.map(ctr)].filter(Boolean);
      const kf=pts.map((p,k)=>({transform:`translate(${p[0]-end[0]}px,${p[1]-end[1]}px)${k&&k<pts.length-1?' scale(1.25)':''}`}));
      const dur=pts.length*110;el.animate(kf,{duration:dur,delay,easing:'linear',fill:'backwards'});delay+=dur*.6});
    G.anims=[];
  }
  if(G.phase==='race'&&G.race&&G.race.anims.length){
    G.race.anims.forEach(a=>{const el=document.getElementById('rt'+a.id);if(!el||a.path.length<2)return;
      const kf=a.path.map(([l,p])=>{const [x,y]=cellXY(l,p);return{transform:tokT(x,y)}});
      el.animate(kf,{duration:Math.min(G.race.speed-40,a.path.length*70),easing:'ease-out'})});
    G.race.anims=[];
  }
}
function schedule(){
  clearTimeout(aiTimer);let fn=null,d=550;
  const cpu=i=>i>=0&&i<NP()&&!P(i).human;
  if(G.phase==='lots'&&cpu(G.cur))fn=aiKeep;
  else if(G.phase==='auction'&&G.auction&&cpu(G.auction.turn))fn=aiAuction;
  else if(G.phase==='training'&&!G.trainingDone&&cpu(G.cur)&&G.players.every(p=>!p.human)){fn=()=>aiTrain(false);d=1300}
  else if(G.phase==='training'&&G.trainingDone&&G.players.every(p=>!p.human)){fn=endTraining;d=1300}
  else if(G.phase==='entries'&&cpu(G.cur))fn=aiEntries;
  else if(G.phase==='betting'&&cpu(G.cur))fn=aiBet;
  else if(G.phase==='race'&&G.race.auto&&!G.race.over&&!G.race.pending){fn=raceStep;d=G.race.speed}
  if(fn)aiTimer=setTimeout(fn,d);
}
function renderSide(){
  const cur=G.phase==='auction'&&G.auction?G.auction.turn:G.cur;

// Who holds a yard's three horses, for the yard and paddock tooltips, e.g. "Held by: You ×2, Bravo ×1 (Bank ×0)".
function yardHolders(s){
  const hs=G.horses.filter(h=>h.stable===s),by={};
  hs.forEach(h=>{if(h.owner>=0)by[h.owner]=(by[h.owner]||0)+1});
  const ps=Object.keys(by).map(Number).sort((a,b)=>by[b]-by[a]||a-b);
  const bank=hs.filter(h=>h.owner<0).length;
  if(!ps.length)return `${STABLES[s].name} yard: all three horses unowned, no fees.`;
  const who=ps.map(o=>`${P(o).name} ×${by[o]}`).join(', ');
  return `${STABLES[s].name} yard held by: ${who}${bank?`, unowned ×${bank}`:''}`+(ps.length===1&&by[ps[0]]===3?` (whole yard: others pay £75)`:` (others pay £15 per horse)`);
}
function sqPos(i){if(i<=8)return[9,9-i];if(i<=15)return[9-(i-8),1];if(i<=24)return[1,1+(i-16)];return[1+(i-24),9]}
function viewTraining(){

    const [r,c]=sqPos(i),info=SQINFO[sq.t],st=sq.s!=null?STABLES[sq.s]:null;

    const toks=here.map(h=>`<span class="tok ${h.trained?'home':''}" data-tok="${h.trained&&!G.anims.some(a=>a.hid===h.id)?'':h.id}" title="${esc(h.name)} (${esc(P(h.owner).name)})${h.trained?' – home':` – lap ${lapOf(h)} of ${LAPS}`}" style="--sc:${STABLES[h.stable].col};--pc:${P(h.owner).col}">${h.id+1}</span>`).join('');

}
function viewEnd(){
  const order=G.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.cash-a.p.cash);
  return `<div class="panel"><h2>Season's End</h2><p>The owner with the most cash takes the championship.</p>
   <div class="tscroll"><table class="list"><tr><th></th><th></th><th>Owner</th><th>Cash</th><th>Horses</th></tr>${order.map((o,k)=>`<tr class="${k===0?'hi':''}"><td>${k===0?'🏆':k+1}</td><td>${silks(o.p.col,'#f4ecd8',30)}</td><td>${pn(o.i)}</td><td>${fmt(o.p.cash)}</td><td>${[...owned(o.i).map(h=>esc(h.name)+(h.wins?` (${h.wins} win${h.wins>1?'s':''})`:'')),...ownedBiz(o.i).map(b=>b.icon+' '+esc(b.name))].join(', ')}</td></tr>`).join('')}</table></div>
   <p style="margin-top:12px"><button class="go" onclick="G=null;render()">New season</button></p></div>`;
}
function rulesHTML(){
  return `<details class="rules"><summary>How to play</summary>
  <p><b>1. Lease cards &amp; sales.</b> The horse cards are dealt into a hand for each owner and one for the auctioneer. Keep what you want at face value; everything else is auctioned. Horses live in four yards of three, and owning a whole yard makes other owners pay you more. Five business cards are in the pack too: the Auctioneer (5% commission on every sale), the Forage Merchant, Blacksmith and Veterinary Surgeon (they own the Feed Bill, Farrier and Vet squares, so those payments come to you, and your own horses pay nothing there), and the Bookmaker (10% of all stakes on every race).</p>
  <p><b>2. Training.</b> On your turn each of your horses still out has its own throw of two dice, in the order you choose. Each starts at its own yard and goes three times round the ring. Squares win or cost money, change form (−10 to +10), or give Trainer's Report cards for the race. Landing on another yard or paddock costs stable fees.</p>
  <p><b>Form</b> runs from −10 to +10. In training: Fast Work +2, Farrier +1, own yard's paddock +1, walking straight into its own box at the end +1, Knock −2, Water Trough −1; Trainer's Report cards Sharp Gallop +2, Flew Up the Gallops +3, Off Colour −2, Coughing −3. In the race, every move adds a form bonus averaging form ÷ 8 (negative form takes lengths off; a horse always moves at least 1):</p>
  <div class="tscroll"><table class="list formtab"><tr><th>Form</th><th>Bonus each move</th><th>Over a race</th></tr>
   <tr><td>+1 to +3</td><td>+1 one move in eight per point (⅛ to ⅜)</td><td>about 2–5 lengths</td></tr>
   <tr><td>+4</td><td>+1 half the time</td><td>about 6–7 lengths</td></tr>
   <tr><td>+6</td><td>+1 three times in four</td><td>about 9–10 lengths</td></tr>
   <tr><td>+8</td><td>+1 every move</td><td>about 12–14 lengths</td></tr>
   <tr><td>+10</td><td>+1 every move, +2 a quarter of the time</td><td>about 15–17 lengths</td></tr>
   <tr><td>−4 / −8</td><td>the same, taken off</td><td>about 6 / 13 lengths lost</td></tr></table></div>
  <p class="muted" style="font-size:13px">The course is ${LEN} lengths and a race is about 12–14 moves. Form is halved (towards zero) between meetings, and the Tote's forecast counts it too.</p>
  <p><b>3. Declarations &amp; the Tote.</b> Enter up to three horses (${fmt(ENTRY_FEE)} each). Bets go into the Tote pool; it keeps ${TOTE_TAKE*100}% and the rest goes to those who backed the winner.</p>
  <p><b>4. The race.</b> ${LEN} lengths round the oval on the rail, six lanes; each lane out adds a square on each of the two bends, so the outside lane runs ${FIN(LANES-1)}. Each horse throws a die (plus form, class and card bonuses) and may first move one lane in or out if two lengths clear, except on the final bend, where horses keep their own lane. Blocked horses are baulked. Landing on your own yard's colours sends you on 3 more; Stumble squares put you down until you throw a six; Heavy Going costs a move. Purse ${fmt(ADDED_MONEY)} plus entrance money, split ½, ¼, ¼.</p>
  <p><b>No borrowing.</b> An owner in debt after training or a race must sell horses back to the Bank (60% of list), weakest first.</p>
  <p><b>Winning.</b> After the last meeting, most cash wins. Form halves and cards are lost between meetings.</p></details>`;
}
function renderSetup(){
  document.getElementById('meet').textContent='';
  document.getElementById('side').innerHTML=`<div class="panel">${rulesHTML().replace('<details','<details open')}</div>`;
  const names=['You','Lady Fenwick','The Colonel','Mrs Abernethy'];
  document.getElementById('main').innerHTML=`<div class="panel setup"><div style="text-align:center">${EMBLEM.replace('class="emblem"','class="emblem" style="width:160px"')}</div><h2>A New Season</h2>
   <p>Take up your lease cards, train your horses round the ring, then race them and back them on the Tote. Most money after the last meeting wins.</p>
   <h3>Owners</h3>
   ${[0,1,2,3].map(i=>`<div class="prow"><input type="checkbox" id="on${i}" ${i<3?'checked':''} ${i<2?'disabled':''}>${silks(PCOLS[i],'#f4ecd8',30)}<input type="text" id="nm${i}" value="${names[i]}" maxlength="18"><select id="ty${i}"><option value="h" ${i===0?'selected':''}>Human</option><option value="c" ${i>0?'selected':''}>Computer</option></select></div>`).join('')}
   <h3>Season length</h3><select id="mtg">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${i===2?'selected':''}>${i+1} meeting${i?'s':''}</option>`).join('')}</select>
   <p style="margin-top:16px"><button class="go" onclick="startFromSetup()">Deal the lease cards →</button></p></div>`;
}
function startFromSetup(){
  const players=[];
  for(let i=0;i<4;i++)if(document.getElementById('on'+i).checked)players.push({name:document.getElementById('nm'+i).value.trim()||'Owner '+(i+1),human:document.getElementById('ty'+i).value==='h'});
  newGame({players,meetings:+document.getElementById('mtg').value});
}
function confirmNew(){if(!G||confirm('Abandon this season and start again?')){clearTimeout(aiTimer);G=null;render()}}

// Touch screens have no hover, so tapping anything with a tooltip (squares, cards, tokens) shows it.
let toastT=null;
document.addEventListener('click',e=>{
  if(!matchMedia('(hover:none)').matches)return;
  const t=e.target.closest('[title]');if(!t||t.closest('button,input,select'))return;
  const el=document.getElementById('toast');el.textContent=t.getAttribute('title');el.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600);
});
addEventListener('resize',()=>{if(G&&G.phase==='race'&&portrait()!==UI.rot)render()});

// Demo: #cpu starts an all-computer season (handy for testing)
if(location.hash==='#cpu'){newGame({players:[{name:'Alpha',human:false},{name:'Bravo',human:false},{name:'Charlie',human:false}],meetings:1})}
else render();
</script>
</body>
