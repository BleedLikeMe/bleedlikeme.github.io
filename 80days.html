<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eighty Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a1628;--navy:#10223d;--navy2:#173057;--sea:#1f4f86;--sky:#4a8fd8;--ice:#dbe8f7;--paper:#f3f7fc;--paper2:#e6eef8;
  --ink:#122339;--ink2:#36506f;--ink3:#6b84a3;--line:#b8cbe3;--red:#d0352f;--amber:#ffc94a;--good:#1f8a6e;--bad:#c0392b;--warn:#d98a14;
  --flap:#0b0f16;--flap2:#1a2230;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:'Lora',Georgia,serif;font-size:17px;
  background-image:linear-gradient(rgba(110,160,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(110,160,230,.07) 1px,transparent 1px),
  radial-gradient(ellipse at 50% -10%,#1d3d6b 0%,var(--night) 65%);background-size:64px 64px,64px 64px,100% 100%;background-attachment:fixed}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
a{color:var(--sea)}

/* ── departure board header ───────────────────────────── */
#board{position:sticky;top:0;z-index:30;background:linear-gradient(#070b12,#0d1420);border-bottom:3px solid #23395c;
  box-shadow:0 4px 18px rgba(0,0,0,.5);padding:8px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:'Bebas Neue',sans-serif;color:#fff;font-size:1.65rem;letter-spacing:.06em;line-height:.9;white-space:nowrap}
.brand small{display:block;font-size:.72rem;letter-spacing:.32em;color:var(--sky)}
.brand b{color:var(--amber);font-weight:400}
#flaps{display:flex;gap:10px;flex-wrap:wrap;flex:1;align-items:flex-end}
.fl{display:flex;flex-direction:column;gap:2px}
.fl .k{font:10px 'Special Elite',monospace;color:#7f97b8;letter-spacing:.12em;text-transform:uppercase}
.fl .v{display:flex;gap:2px}
.cell{display:inline-block;min-width:.72em;padding:2px 2px 0;background:linear-gradient(var(--flap2) 50%,var(--flap) 50%);color:var(--amber);
  font-family:'Bebas Neue',sans-serif;font-size:1.25rem;line-height:1.15;text-align:center;border-radius:2px;position:relative;box-shadow:inset 0 -1px 0 #000}
.cell::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.85)}
.cell.flip{animation:flip .35s ease-out}
@keyframes flip{0%{transform:rotateX(90deg);color:#fff}100%{transform:none}}
.cell.sp{background:transparent;box-shadow:none;min-width:.35em}
.fl.left .cell{color:#8fe3b7}.fl.left.tight .cell{color:#ffb14a}.fl.left.crit .cell{color:#ff6b5e}
#meters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.m{display:flex;flex-direction:column;gap:3px;min-width:84px}
.m .k{font:10px 'Special Elite',monospace;color:#7f97b8;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.m .k b{color:#dce8f8;font-weight:400}
.bar{height:7px;background:#05080d;border:1px solid #2b4266;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}
.hbtns{display:flex;gap:6px}
.hbtns button{background:#15233a;border:1px solid #2f4a74;color:#cfe0f6;border-radius:6px;padding:5px 10px;font-size:1rem}
.hbtns button:hover{background:#1e3456}

/* ── route ribbon ─────────────────────────────────────── */
#ribbon{max-width:1440px;margin:12px auto 0;padding:0 14px}
#ribbon .rb{background:#0e2747;border:1px solid #2b4b78;border-radius:8px;overflow:hidden;cursor:zoom-in;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#ribbon svg{display:block;width:100%;height:auto}
#ribbon .lg{position:absolute;left:10px;bottom:6px;font:11px 'Special Elite',monospace;color:#9fb8d8;pointer-events:none}

/* ── layout ───────────────────────────────────────────── */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;max-width:1440px;margin:0 auto;padding:14px}
.airmail{background:var(--paper);border-radius:6px;position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.45);padding:12px}
.airmail::before{content:'';position:absolute;inset:0;border-radius:6px;padding:9px;pointer-events:none;
  background:repeating-linear-gradient(-45deg,var(--red) 0 14px,var(--paper) 14px 22px,#2457a6 22px 36px,var(--paper) 36px 44px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#stage{min-height:70vh}
.inner{background:var(--paper);padding:18px 28px 28px;border-radius:2px;min-height:calc(70vh - 24px);
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(74,143,216,.10) 31px 32px)}

/* passport */
#passport{background:linear-gradient(160deg,#1c3a66,#10274a);border-radius:10px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 2px #2c5288;
  display:flex;flex-direction:column;max-height:calc(100vh - 110px);position:sticky;top:96px;min-height:60vh}
.pphead{text-align:center;color:#e9c46a;font-family:'Bebas Neue',sans-serif;letter-spacing:.25em;font-size:1rem;padding:4px 0 8px}
.pphead small{display:block;font:10px 'Special Elite',monospace;letter-spacing:.2em;color:#9fb8d8}
#tabs{display:flex;flex-wrap:wrap;gap:3px}
#tabs button{flex:1;background:#0d1e38;border:1px solid #2c4f80;color:#a9c2e3;border-radius:6px 6px 0 0;padding:6px 2px;font:12px 'Special Elite',monospace;letter-spacing:.03em}
#tabs button.on{background:var(--paper2);color:var(--ink);border-color:var(--paper2)}
#panel{background:var(--paper2);border-radius:0 0 6px 6px;padding:12px;overflow-y:auto;flex:1;
  background-image:radial-gradient(circle at 20% 30%,rgba(74,143,216,.08),transparent 40%),repeating-radial-gradient(circle at 80% 70%,transparent 0 6px,rgba(31,79,134,.04) 6px 7px)}
.ptitle{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.08em;color:var(--sea);margin:0 0 6px}
.meta{font-size:.85rem;color:var(--ink3);font-style:italic}

/* ── stage elements ───────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:8px;background:#f8e7b5;border:1px solid #c9a75a;border-radius:4px 14px 14px 4px;padding:3px 14px 3px 8px;
  font:12px 'Special Elite',monospace;color:#5a4410;letter-spacing:.08em;position:relative;transform:rotate(-1.2deg)}
.tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--paper);border:1px solid #c9a75a}
.head h2{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;letter-spacing:.03em;margin:8px 0 0;color:var(--navy);line-height:1}
.head .where{font:13px 'Special Elite',monospace;color:var(--ink2);margin-top:2px}
.head{margin-bottom:12px}
.polaroid{float:right;width:min(330px,46%);margin:0 0 14px 20px;background:#fff;padding:10px 10px 6px;box-shadow:0 6px 18px rgba(16,34,61,.28);transform:rotate(1.6deg);position:relative}
.polaroid::before{content:'';position:absolute;top:-10px;left:50%;width:90px;height:22px;margin-left:-45px;background:rgba(255,240,180,.75);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.polaroid .ph{aspect-ratio:4/3;background:#cfdcec center/cover no-repeat;position:relative;overflow:hidden}
.polaroid .ph img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.03)}
.polaroid .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  background:linear-gradient(160deg,#4a8fd8,#173057);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.06em}
.polaroid .cap{font-family:'Caveat',cursive;font-size:1.35rem;color:#23395c;text-align:center;line-height:1.1;margin-top:6px}
.polaroid .cr{font-size:.62rem;color:#8a9bb3;text-align:center;margin-top:2px}
.polaroid .cr a{color:#8a9bb3}
.text p{font-size:1.1rem;line-height:1.65;margin:0 0 .85em}
.text p.first::first-letter{font-family:'Bebas Neue',sans-serif;float:left;font-size:3.6em;line-height:.8;padding:6px 8px 0 0;color:var(--red)}
.text em{color:var(--ink2)}
.say{color:var(--sea)}
.clear{clear:both}

/* mini departure row on stage */
.dboard{clear:both;background:var(--flap);border-radius:6px;padding:10px 12px;margin:14px 0 6px;box-shadow:inset 0 0 0 2px #1d2a3d,0 4px 12px rgba(0,0,0,.25)}
.dboard .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dboard .lbl{font:10px 'Special Elite',monospace;color:#7f97b8;letter-spacing:.14em}
.dboard .big{font-family:'Bebas Neue',sans-serif;color:var(--amber);font-size:1.45rem;letter-spacing:.06em;line-height:1.05}
.dboard .dest{font-family:'Bebas Neue',sans-serif;color:#fff;font-size:1.25rem;letter-spacing:.05em;line-height:1.1}
.dboard .via{font:12px 'Special Elite',monospace;color:#9fb8d8}
.dboard .cd{text-align:right}
.dboard .cd .big{color:#8fe3b7}
.dboard.tight .cd .big{color:#ffb14a}.dboard.crit .cd .big{color:#ff6b5e}
.dboard .blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* tickets = choices */
.choices{display:flex;flex-direction:column;gap:9px;margin-top:14px;clear:both}
.ticket{display:flex;align-items:stretch;text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0;color:var(--ink);
  font-size:1.02rem;box-shadow:0 2px 0 rgba(31,79,134,.12);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.ticket:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(31,79,134,.22)}
.ticket .main{flex:1;padding:10px 14px;line-height:1.4}
.ticket .main small{display:block;font:12px 'Special Elite',monospace;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.ticket .stub{width:92px;flex:none;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--paper2);font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--sea);letter-spacing:.04em;position:relative;padding:4px}
.ticket .stub small{font:10px 'Special Elite',monospace;color:var(--ink3);letter-spacing:.06em;text-align:center}
.ticket .stub::before,.ticket .stub::after{content:'';position:absolute;left:-8px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket .stub::before{top:-8px}.ticket .stub::after{bottom:-8px}
.ticket.go{background:linear-gradient(90deg,#fff,#eaf3ff);border-color:var(--sky)}
.ticket.go .stub{background:var(--sea);color:#fff}.ticket.go .stub small{color:#cfe0f6}
.ticket.game .main::before{content:'▶ ';color:var(--red)}
.ticket.warn{border-color:#e6a23c}.ticket.warn .stub{background:#fff1d6;color:var(--warn)}
.ticket.miss{border-color:var(--bad)}.ticket.miss .stub{background:#fde3df;color:var(--bad)}
.ticket.talk .main::before{content:'❝ ';color:var(--sky)}
.ticket[disabled]{opacity:.5;pointer-events:none}
.ticket.done{opacity:.45}
.ticket .key{position:absolute;left:4px;top:3px;font:10px 'Special Elite',monospace;color:#b7c6da}
.result{border-left:4px solid var(--sky);background:#eaf2fc;padding:8px 14px;margin:10px 0;border-radius:0 6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font:12px 'Special Elite',monospace;padding:2px 9px;border-radius:12px;border:1px solid var(--line);background:#fff}
.chip.good{border-color:#5fb59a;color:#126b52;background:#e3f5ee}
.chip.bad{border-color:#e08a7e;color:#9b261a;background:#fdeae6}
.chip.time{border-color:#8fb3e0;color:#1f4f86;background:#e7f0fb}
.btn{background:var(--sea);color:#fff;border:0;border-radius:6px;padding:10px 20px;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.08em;box-shadow:0 3px 0 #0f2d52}
.btn:hover{background:#2660a0}
.btn.ghost{background:transparent;color:var(--sea);border:2px solid var(--sea);box-shadow:none}
.center{text-align:center}

/* packing */
.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
.packi{background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px;text-align:left;font-size:.95rem;line-height:1.35;color:var(--ink)}
.packi .ic{font-size:1.8rem}
.packi b{display:block;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.04em;color:var(--navy);font-weight:400}
.packi.on{border-color:var(--red);background:#fff4f2;box-shadow:0 0 0 3px rgba(208,53,47,.15)}

/* passport panel bits */
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stamp{aspect-ratio:1;border:3px double currentColor;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-family:'Bebas Neue',sans-serif;line-height:1;opacity:.85;padding:4px;mix-blend-mode:multiply}
.stamp small{font:8px 'Special Elite',monospace;letter-spacing:.06em}
.stamp.sq{border-radius:6px}
.stamp.empty{color:#b8c7da!important;border-style:dashed;opacity:.6}
.itin{width:100%;border-collapse:collapse;font-size:.82rem}
.itin td,.itin th{padding:4px 3px;border-bottom:1px dotted var(--line);text-align:left}
.itin th{font:10px 'Special Elite',monospace;color:var(--ink3);font-weight:400;letter-spacing:.08em}
.itin .now td{background:#fff5d6}
.ahead{color:var(--good)}.behind{color:var(--bad)}
.person{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.person .av{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff}
.person .nm{font-weight:600}.person .rl{font:11px 'Special Elite',monospace;color:var(--sea);margin-left:4px}
.person .ds{font-size:.85rem;color:var(--ink2);line-height:1.35}
.item{display:flex;gap:10px;margin-bottom:9px}
.item .ic{font-size:1.5rem;width:30px;text-align:center}
.item .nm{font-weight:600;font-size:.95rem}.item .ds{font-size:.82rem;color:var(--ink2);line-height:1.35}
.diary{font-family:'Special Elite',monospace;font-size:.82rem;line-height:1.45;border-bottom:1px dashed var(--line);padding:6px 0;color:#283c58}
.diary b{color:var(--red);font-weight:400}

/* games */
.gwrap{max-width:780px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ghead .gt{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.05em;color:var(--navy)}
.ghead .ghud{font:13px 'Special Elite',monospace;color:var(--ink2)}
canvas.gc{width:100%;height:auto;display:block;border-radius:8px;background:#0e2747;touch-action:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gmsg{min-height:1.6em;text-align:center;font:14px 'Special Elite',monospace;color:var(--sea);margin:8px 0}
.gbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.gbtn{background:#fff;border:2px solid var(--sea);color:var(--sea);border-radius:8px;padding:8px 14px;font-size:1rem}
.gbtn:hover{background:#eaf3ff}
.gbtn.on{background:var(--sea);color:#fff}
.gbtn[disabled]{opacity:.4;pointer-events:none}
.ptcbox{background:#0b0f16;border-radius:10px;padding:14px;color:#fff;position:relative;min-height:240px;overflow:hidden}
.ptcbox .rec{font:12px 'Special Elite',monospace;color:#ff6b5e;letter-spacing:.1em}
.ptcbox .said{font-family:'Lora',serif;font-size:1.2rem;min-height:3.2em;margin:10px 0;color:#fff;line-height:1.4}
.ptcbox .chunks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ptcbox .chunk{background:#1d3d6b;border:1px solid #4a8fd8;color:#fff;border-radius:6px;padding:8px 12px;font-size:1rem}
.ptcbox .chunk:hover{background:#2a5592}
.ptcbox .chunk.used{visibility:hidden}
.ptcbox .interrupt{position:absolute;inset:0;background:rgba(10,22,40,.88);display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:.05em;color:var(--amber);padding:20px}
.tbar{height:8px;background:#22334d;border-radius:4px;overflow:hidden;margin-top:10px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b5e,#ffc94a,#8fe3b7)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.card{aspect-ratio:3/2;border-radius:8px;border:2px solid var(--sea);background:repeating-linear-gradient(45deg,#1f4f86 0 8px,#173057 8px 16px);color:transparent;font-size:.95rem;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center}
.card.up{background:#fff;color:var(--ink)}.card.gu{font-weight:600;color:var(--red)}
.card.done{background:#e3f5ee;border-color:var(--good);color:var(--good)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.qopts button{background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px;font-size:1rem;text-align:left}
.qopts button.right{border-color:var(--good);background:#e3f5ee}.qopts button.wrong{border-color:var(--bad);background:#fdeae6}

/* modal & toasts */
#modal{position:fixed;inset:0;background:rgba(5,10,20,.75);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{background:var(--paper);border-radius:10px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
#modal .mclose{position:absolute;right:10px;top:8px;background:none;border:0;font-size:1.8rem;color:var(--ink2)}
#toasts{position:fixed;right:14px;bottom:14px;z-index:70;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:#0b0f16;color:#dce8f8;border-left:4px solid var(--sky);padding:7px 12px;border-radius:4px;font:13px 'Special Elite',monospace;animation:tin .3s;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.toast.good{border-color:#8fe3b7}.toast.bad{border-color:#ff6b5e}.toast.time{border-color:var(--amber)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}

/* title */
.titlescr{text-align:center;padding:10px 0}
.titlescr h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem,8vw,5.6rem);line-height:.9;margin:10px 0 0;color:var(--navy);letter-spacing:.02em}
.titlescr h1 span{color:var(--red)}
.titlescr .sub{font:14px 'Special Elite',monospace;color:var(--ink2);letter-spacing:.12em;margin:6px 0 14px}
.titlescr .rules{max-width:640px;margin:16px auto;text-align:left;font-size:1rem;line-height:1.55}
.titlescr .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.ticketbig{display:inline-block;background:#fff;border:2px solid var(--sea);border-radius:8px;padding:10px 26px;margin:6px auto;font:14px 'Special Elite',monospace;color:var(--sea);transform:rotate(-1deg)}
.endcard{max-width:680px;margin:0 auto;text-align:center}
.endcard .bigt{font-family:'Bebas Neue',sans-serif;font-size:3.4rem;color:var(--navy);line-height:1}
.endcard .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.endcard .stats div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.endcard .stats b{display:block;font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--sea);font-weight:400}
.credits{font-size:.75rem;color:var(--ink3);columns:2;column-gap:20px}
.credits div{break-inside:avoid;margin-bottom:3px}

@media (max-width:980px){
  #wrap{grid-template-columns:1fr}
  #passport{position:static;max-height:none;min-height:0}
  #panel{max-height:60vh}
}
@media (max-width:640px){
  #board{padding:6px 10px;gap:6px 8px;position:static}
  #board .fl.fogg{display:none}
  #ribbon .lg{display:none}
  #toasts{left:10px;right:10px;align-items:stretch}
  .brand{font-size:1.3rem}
  .cell{font-size:1rem}
  .inner{padding:14px 14px 22px}
  .polaroid{float:none;width:auto;margin:6px 4px 14px}
  .head h2{font-size:2rem}
  .ticket .stub{width:72px;font-size:1.05rem}
  #wrap{padding:10px}
  #ribbon{padding:0 10px}
  .credits{columns:1}
}
@media (prefers-reduced-motion:reduce){.cell.flip,.toast{animation:none}}
</style>
</head>
<body>
<header id="board">

// ── SOUND ───────────────────────────────────────────────────────────────────
const SND = (() => {
  let ctx = null, on = false, master = null, playing = [];
  try { on = localStorage.getItem('palin80Sound') === '1'; } catch (e) {}
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .45; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, d, type, vol){
    const c = ac(); if (!c) return; const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = mf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .2, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05); playing.push(o);
  }
  function noise(t, d, vol, freq, type){
    const c = ac(); if (!c) return; const b = c.createBuffer(1, Math.max(1, c.sampleRate * d), c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq || 2000;
    const g = c.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); playing.push(s);
  }
  function fx(k){
    if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    switch (k){
      case 'click': note(88, t, .04, 'square', .04); break;
      case 'flap': for (let i = 0; i < 5; i++) noise(t + i * .03, .025, .08, 3500); break;
      case 'good': [72, 76, 79, 84].forEach((m, i) => note(m, t + i * .07, .25, 'triangle', .16)); break;
      case 'bad': note(55, t, .3, 'sawtooth', .1); note(50, t + .15, .45, 'sawtooth', .1); break;
      case 'horn': note(43, t, 1.2, 'sawtooth', .14); note(50, t, 1.2, 'sawtooth', .08); break;
      case 'whistle': note(86, t, .5, 'sine', .12); note(89, t + .02, .5, 'sine', .08); break;
      case 'hit': noise(t, .2, .3, 600); break;
      case 'splash': noise(t, .4, .2, 900); break;
      case 'stamp': noise(t, .08, .35, 300, 'lowpass'); note(40, t, .12, 'sine', .3); break;
      case 'coin': note(88, t, .08, 'square', .06); note(95, t + .07, .2, 'square', .06); break;
    }
  }
  function tone(m, d, type, vol){ const c = ac(); if (!c) return; note(m, c.currentTime, d || .3, type, vol); }
  function jingle(){ if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
    [[67,0,.2],[72,.2,.2],[76,.4,.2],[79,.6,.4],[76,1,.2],[79,1.2,.6]].forEach(([m, s, d]) => note(m, t + s, d * 1.6, 'triangle', .14)); }
  function stop(){ playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = []; }
  return { fx, tone, jingle, stop, ac, get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('palin80Sound', v ? '1' : '0'); } catch (e) {} } };
})();

// ── STATE ───────────────────────────────────────────────────────────────────
const SAVE_KEY = 'palin80Save';
let G = null;
const UI = { tab:'itin', game:null, inst:null, prevFlap:{}, keys:{} };
function newGame(){
  return { version:1, t:0, beat:'start', stop:'london', depT:null, awake:0,
    stats:{spirits:80, telly:5, cash:800}, items:[], souv:[], stamps:[], met:['clem','roger','nigel','crew','hewison','jones','gilliam'],
    flags:{}, done:{}, arr:{}, route:['london'], log:[], games:{}, missed:0, pending:null, checkpoints:{}, ending:null, tzOverride:null };
}
function save(){ if (!G) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function tryLoad(){ try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.version === 1 && BEATS[s.beat]) return s; } catch (e) {} return null; }
function snapshot(){ const c = Object.assign({}, G); delete c.checkpoints; return JSON.parse(JSON.stringify(c)); }
const has = k => G.items.indexOf(k) >= 0;
const flag = k => !!G.flags[k];
const hOf = c => typeof c.h === 'function' ? c.h(G) : (c.h || 0);
const curTz = () => { const b = BEATS[G.beat]; return b && b.tz !== undefined ? b.tz : (G.tzOverride !== null && G.tzOverride !== undefined ? G.tzOverride : STOPS[G.stop].tz); };

// ── EFFECTS ─────────────────────────────────────────────────────────────────
function addTime(h, sleep){
  if (!h) return;
  G.t += h;
  if (sleep){ G.awake = 0; return; }
  const before = G.awake; G.awake += h;
  if (G.awake > 18){ const over = G.awake - Math.max(18, before); G.stats.spirits = clamp(G.stats.spirits - Math.round(over * 1.5), 0, 100); }
}
function applyFx(fx){
  const out = []; if (!fx) return out;
  if (fx.h){ addTime(fx.h, fx.sleep); out.push({t:(fx.h > 0 ? '+' : '') + dur(fx.h).replace(/^0d /, ''), c:'time'}); }
  if (fx.sleep && !fx.h) G.awake = 0;
  [['spirits','Spirits'],['telly','Telly'],['cash','£']].forEach(([k, nm]) => {
    if (!fx[k]) return; const before = G.stats[k];
    const amt = k === 'telly' && fx[k] > 0 ? Math.max(1, Math.round(fx[k] * .6)) : fx[k];
    G.stats[k] = k === 'cash' ? Math.max(0, before + amt) : clamp(before + amt, 0, 100);
    const d = G.stats[k] - before; if (!d) return;
    out.push({t: k === 'cash' ? (d > 0 ? '+£' + d : '−£' + (-d)) : `${nm} ${d > 0 ? '+' : ''}${d}`, c: d > 0 ? 'good' : 'bad'});
  });
  [].concat(fx.item || []).forEach(k => { if (!has(k)){ G.items.push(k); out.push({t:'Packed: ' + ITEMS[k].n, c:'good'}); } });
  [].concat(fx.souv || []).forEach(k => { if (G.souv.indexOf(k) < 0){ G.souv.push(k); out.push({t:'Souvenir: ' + SOUVS[k].n, c:'good'}); } });
  [].concat(fx.flag || []).forEach(k => { G.flags[k] = true; });
  [].concat(fx.meet || []).forEach(k => { if (G.met.indexOf(k) < 0){ G.met.push(k); out.push({t:'Met ' + PEOPLE[k].n}); } });
  [].concat(fx.stamp || []).forEach(k => { if (giveStamp(k)) out.push({t:'Passport stamped: ' + STAMPS.find(s => s[0] === k)[1], c:'good'}); });
  return out;
}
function giveStamp(k){ if (!k || G.stamps.indexOf(k) >= 0) return false; G.stamps.push(k); SND.fx('stamp'); return true; }
function addLog(t){ G.log.unshift({d:dayNum(G.t), w:STOPS[G.stop].n, t}); if (G.log.length > 200) G.log.length = 200; }
function toast(chips){
  const box = $('#toasts');
  chips.forEach((c, i) => setTimeout(() => { const d = document.createElement('div'); d.className = 'toast ' + (c.c || ''); d.textContent = c.t; box.appendChild(d); setTimeout(() => d.remove(), 3400); }, i * 200));
}
function nextDep(dep, t){
  if (!dep || dep.self) return null;
  if (t <= dep.t0) return dep.t0;
  return dep.t0 + Math.ceil((t - dep.t0 - 1e-6) / dep.every) * dep.every;
}
function foggDiff(stop){ const f = STOPS[stop].fogg, a = G.arr[stop]; if (f === undefined || a === undefined) return null; return a - f; }
function foggStr(d){ if (d === null) return ''; const days = Math.abs(d) / 24; const n = Math.round(days * 2) / 2, s = days < 1 ? Math.round(Math.abs(d)) + ' hours' : n + (n === 1 ? ' day' : ' days'); return d > 0 ? s + ' behind Fogg' : s + ' ahead of Fogg'; }

// After anything that spends time: collapse if exhausted, and notice a missed departure.
function afterTime(){
  const notes = [];
  if (G.stats.spirits <= 0){
    addTime(11, true); G.stats.spirits = 35;
    notes.push('<b>You can\'t go on.</b> Somewhere between one sentence and the next you fall asleep where you sit, and the crew, who are kind people, let you. Eleven hours later you wake with a stiff neck and a much better attitude.');
    addLog('Collapsed with exhaustion. Slept eleven hours.');
  }
  const b = BEATS[G.beat];
  if (b && b.hub && G.depT !== null && G.t > G.depT + 1e-6){
    const s = STOPS[G.stop], was = G.depT;
    G.missed++; G.depT = nextDep(s.dep, G.t);
    notes.push(`<b>You've missed it.</b> The ${esc(s.dep.name)} left at ${clock(was, s.tz)} without you. The next one goes on <b>${prettyDate(G.depT, s.tz)} at ${clock(G.depT, s.tz)}</b>: ${dur(G.depT - was)} later. Clem looks at his schedule and says nothing, which is worse.`);
    addLog(`Missed the ${s.dep.name}.`);
    SND.fx('bad');
  }
  return notes;
}
function doArrive(k){
  const s = STOPS[k]; G.stop = k; G.tzOverride = null;
  const out = [];
  if (G.arr[k] !== undefined) return out;
  G.arr[k] = G.t;
  if (G.route.indexOf(k) < 0) G.route.push(k);
  if (s.stamp && giveStamp(s.stamp)) out.push({t:'Passport stamped: ' + STAMPS.find(x => x[0] === s.stamp)[1], c:'good'});
  if (has('notebook') && k !== 'london'){ G.stats.telly = clamp(G.stats.telly + 2, 0, 100); }
  G.depT = nextDep(s.dep, G.t);
  const fd = foggDiff(k); if (fd !== null) out.push({t:foggStr(fd), c: fd > 0 ? 'bad' : 'good'});
  addLog(`Arrived in ${s.n}, ${s.c}. Day ${dayNum(G.t)}.${fd !== null ? ' ' + foggStr(fd) + '.' : ''}`);
  G.checkpoints[k] = snapshot();
  return out;
}

// ── BEAT ENGINE ─────────────────────────────────────────────────────────────
function goBeat(id){
  const b = BEATS[id]; if (!b){ console.error('Missing beat', id); return; }
  const re = G.beat === id; G.beat = id; G.pending = null;
  if (re){ save(); render(); return; }
  let chips = [];
  if (b.adv){ addTime(b.adv, b.adv >= 8 || b.sleep); if (b.adv >= 8) G.stats.spirits = clamp(G.stats.spirits + 6, 0, 100); }
  if (b.tz !== undefined) G.tzOverride = b.tz;
  if (b.arrive) chips = chips.concat(doArrive(b.arrive));
  if (b.fx) chips = chips.concat(applyFx(typeof b.fx === 'function' ? b.fx(G) : b.fx));
  if (b.enter) b.enter(G);
  if (b.log) addLog(tx(b.log));
  const notes = afterTime();
  if (chips.length) toast(chips);
  if (notes.length){ G.pending = {text:notes.join('\n\n'), chips:[], next:id}; }
  save(); render(); window.scrollTo(0, 0);
  if (b.sfx) SND.fx(b.sfx);
}
function hubActs(b){
  return (b.acts || []).filter(a => (!a.if || a.if(G)) && (a.once === false || !G.done[G.beat + ':' + a.k]));
}
function departChoice(){
  const s = STOPS[G.stop], d = s.dep; if (!d) return null;
  const blocked = d.need && !flag(d.need);
  const when = G.depT === null ? 'whenever you like' : `${dstr(G.depT, s.tz)} · in ${dur(G.depT - G.t)}`;
  return {k:'__go', depart:true, cls:'go', disabled:blocked,
    t:`${d.mode} Board the ${d.name}`, sub: blocked ? d.needTxt : `${d.from} → ${d.to} · ${when}`};
}
function visibleChoices(b){
  if (b.hub){ const list = hubActs(b).slice(); const dc = departChoice(); if (dc) list.push(dc); return list; }
  return (b.choices ? tx(b.choices) : []).filter(c => !c.if || c.if(G));
}
function choose(i){
  const b = BEATS[G.beat], c = visibleChoices(b)[i]; if (!c || c.disabled) return;
  if (c.need && !c.need(G)) return;
  if (c.cost && G.stats.cash < c.cost) return;
  SND.fx('click');
  if (c.depart){ depart(); return; }
  if (c.game){ startGame(Object.assign({}, tx(c.game)), c); return; }
  let chips = [];
  const ch = hOf(c); if (ch) chips = chips.concat(applyFx({h:ch, sleep:c.sleep}));
  if (c.cost) chips = chips.concat(applyFx({cash:-c.cost}));
  chips = chips.concat(applyFx(typeof c.fx === 'function' ? c.fx(G) : c.fx));
  if (b.hub && c.once !== false) G.done[G.beat + ':' + c.k] = 1;
  if (c.act) c.act(G);
  if (c.log) addLog(tx(c.log));
  const next = typeof c.go === 'function' ? c.go(G) : (c.go || G.beat);
  const notes = afterTime();
  const res = [tx(c.res)].concat(notes).filter(Boolean).join('\n\n');
  if (res){ G.pending = {text:res, chips, next, photo:c.photo}; save(); render(); window.scrollTo(0, 0); }
  else { if (chips.length) toast(chips); goBeat(next); }
}
function continuePending(){ const n = G.pending.next; G.pending = null; if (n === G.beat){ save(); render(); window.scrollTo(0, 0); } else goBeat(n); }
function depart(){
  const s = STOPS[G.stop];
  if (G.depT !== null && G.depT > G.t){ const w = G.depT - G.t; addTime(w, w >= 7); }
  G.depT = null; G.awake = Math.min(G.awake, 6);
  SND.fx(s.dep.mode === '🚂' ? 'whistle' : s.dep.mode === '🚗' ? 'click' : 'horn');
  addLog(`Left ${s.n} on the ${s.dep.name}.`);
  goBeat(s.leg);
}

// ── GAMES (framework) ───────────────────────────────────────────────────────
const GAMES = {};
function startGame(cfg, choice){
  SND.ac(); UI.game = {cfg, choice};
  $('#inner').innerHTML = headHTML(BEATS[G.beat]) + `<div class="gwrap" id="gwrap"></div>
    <div class="center" style="margin-top:12px"><button class="btn ghost" id="gskip" style="font-size:1rem">Skip · let Nigel film whatever happens</button></div>`;
  UI.inst = GAMES[cfg.type](cfg, $('#gwrap'), res => finishGame(res)) || {};
  $('#gskip').onclick = () => finishGame({win: Math.random() < .5, score:.45, msg:'You leave it to chance, and to Nigel. Some of it is even usable.'});
  window.scrollTo(0, 0);
}
function finishGame(res){
  if (!UI.game) return;
  if (UI.inst && UI.inst.stop) UI.inst.stop();
  UI.inst = null; UI.keys = {};
  const {cfg, choice} = UI.game; UI.game = null;
  G.games[cfg.type + (cfg.id || '')] = Math.round((res.score || 0) * 100) / 100;
  let chips = [];
  const h = hOf(choice) || cfg.h || 0; if (h) chips = chips.concat(applyFx({h, sleep:choice.sleep}));
  if (choice.cost) chips = chips.concat(applyFx({cash:-choice.cost}));
  chips = chips.concat(applyFx(res.win ? cfg.fxWin : cfg.fxLose));
  if (cfg.telly) chips = chips.concat(applyFx({telly: Math.round(cfg.telly * clamp(res.score || 0, 0, 1))}));
  if (res.fx) chips = chips.concat(applyFx(res.fx));
  const b = BEATS[G.beat];
  if (b.hub && choice.once !== false) G.done[G.beat + ':' + choice.k] = 1;

function photoHTML(key, cap){
  const p = PHOTOS[key]; if (!p) return '';
  return `<figure class="polaroid"><div class="ph"><img src="${p[0]}" alt="${esc(cap || '')}" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="fallback" style="display:none">${esc(cap || '')}</div></div>
    <figcaption class="cap">${esc(cap || '')}</figcaption><div class="cr">Photo: <a href="${p[1]}" target="_blank" rel="noopener">${esc(p[2] || 'Wikimedia Commons')}</a> · ${esc(p[3])}</div></figure>`;
}
function headHTML(b){
  const st = STOPS[G.stop];
  const label = tx(b.label) || (b.hub ? `STOP ${G.route.length} · ${st.c.toUpperCase()}` : 'IN TRANSIT');
  return `<div class="head"><span class="tag">${esc(label)}</span><h2>${esc(tx(b.title) || st.n)}</h2>
    <div class="where">${prettyDate(G.t, curTz())} · ${clock(G.t, curTz())} local · Day ${dayNum(G.t)} of 80</div></div>`;
}
function paras(t, first){ return String(t).split(/\n\s*\n/).map((p, i) => `<p class="${first && i === 0 ? 'first' : ''}">${p.trim()}</p>`).join(''); }
function chipHTML(ch){ return ch && ch.length ? `<div class="chips">${ch.map(c => `<span class="chip ${c.c || ''}">${esc(c.t)}</span>`).join('')}</div>` : ''; }
function depBoardHTML(){
  const s = STOPS[G.stop], d = s.dep; if (!d) return '';
  const left = G.depT === null ? null : G.depT - G.t;
  const cls = left === null ? '' : left < 2 ? 'crit' : left < 6 ? 'tight' : '';
  return `<div class="dboard ${cls}"><div class="row">
    <div><div class="lbl">DEPARTS</div><div class="big">${G.depT === null ? 'ANY TIME' : clock(G.depT, s.tz)}</div><div class="via">${G.depT === null ? 'you set the pace' : dstr(G.depT, s.tz, false)}</div></div>
    <div><div class="lbl">${d.mode} ${esc(d.from.toUpperCase())}</div><div class="dest">${esc(d.name.toUpperCase())}</div><div class="via">to ${esc(d.to)}</div></div>
    <div class="cd"><div class="lbl">IN</div><div class="big ${left !== null && left < 2 ? 'blink' : ''}">${left === null ? '—' : dur(left).toUpperCase()}</div><div class="via">${left !== null && left < 2 ? 'BOARDING' : 'on time'}</div></div>
  </div></div>`;
}
function ticketHTML(c, i){
  let cls = ['ticket'], stub = '', sub = tx(c.sub) || '';
  if (c.depart){ cls.push('go'); stub = `GO<small>${G.depT === null ? 'now' : clock(G.depT, STOPS[G.stop].tz)}</small>`; }
  else {
    if (c.game) cls.push('game'); if (c.talk) cls.push('talk'); if (c.cls) cls.push(c.cls);
    const h = hOf(c);
    stub = h ? hrs(h) : (c.go && !BEATS[G.beat].hub ? '→' : '·');
    let small = [];
    if (c.cost) small.push('£' + c.cost);
    if (c.game) small.push('game');
    if (BEATS[G.beat].hub && G.depT !== null && h){
      if (G.t + h > G.depT + 1e-6){ cls.push('miss'); small.unshift('MISS IT'); }
      else if (G.t + h > G.depT - 1.5){ cls.push('warn'); small.unshift('cutting it fine'); }
    }
    if (small.length) stub += `<small>${small.join(' · ')}</small>`;
  }
  const dis = c.disabled || (c.cost && G.stats.cash < c.cost) || (c.need && !c.need(G));
  if (c.cost && G.stats.cash < c.cost) sub = (sub ? sub + ' · ' : '') + 'not enough money';
  return `<button class="${cls.join(' ')}" data-c="${i}" ${dis ? 'disabled' : ''}><span class="key">${i < 9 ? i + 1 : ''}</span><span class="main">${tx(c.t)}${sub ? `<small>${sub}</small>` : ''}</span><span class="stub">${stub}</span></button>`;
}
function render(){
  renderBoard(); renderRibbon(); renderSide();
  if (!G){ renderTitle(); return; }
  if (UI.game) return;
  const st = $('#inner'), b = BEATS[G.beat];
  if (b.ending){ st.innerHTML = renderEnding(); wireStage(); return; }
  let h = headHTML(b);
  if (G.pending){
    if (G.pending.photo) h += photoHTML(G.pending.photo, '');
    h += `<div class="text">${paras(G.pending.text, true)}</div>${G.pending.chips.length ? `<div class="result">${chipHTML(G.pending.chips)}</div>` : ''}
      <div class="choices"><button class="ticket go" data-cont><span class="main">Carry on</span><span class="stub">→</span></button></div>`;
    st.innerHTML = h; wireStage(); return;
  }
  if (b.special === 'pack'){ st.innerHTML = h + packHTML(); wirePack(); return; }
  const ph = tx(b.photo) || (b.hub ? STOPS[G.stop].photo : null);
  if (ph) h += photoHTML(ph, tx(b.cap) || STOPS[G.stop].n);
  const text = b.hub && G.done[G.beat + ':__seen'] && b.again ? tx(b.again) : tx(b.text);
  h += `<div class="text">${paras(text, true)}</div>`;
  if (b.hub){ G.done[G.beat + ':__seen'] = 1; h += depBoardHTML(); }
  const cs = visibleChoices(b);
  h += `<div class="choices">${cs.map(ticketHTML).join('')}</div><div class="clear"></div>`;
  st.innerHTML = h; wireStage();
}
function wireStage(){
  const st = $('#inner');
  st.querySelectorAll('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c));
  const cont = st.querySelector('[data-cont]'); if (cont) cont.onclick = continuePending;
  st.querySelectorAll('[data-new]').forEach(el => el.onclick = startNew);
  st.querySelectorAll('[data-load]').forEach(el => el.onclick = () => { G = tryLoad(); UI.prevFlap = {}; render(); });
  st.querySelectorAll('[data-cp]').forEach(el => el.onclick = () => restoreCheckpoint(el.dataset.cp));
}
function startNew(){ SND.stop(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = newGame(); closeModal(); UI.prevFlap = {}; SND.jingle(); goBeat('start'); }
function restoreCheckpoint(k){
  const cp = G.checkpoints[k]; if (!cp) return;
  const keep = G.checkpoints; G = JSON.parse(JSON.stringify(cp)); G.checkpoints = {};
  ORDER.forEach(o => { if (G.arr[o] !== undefined && keep[o]) G.checkpoints[o] = keep[o]; });
  G.pending = null; UI.game = null; if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null;
  save(); closeModal(); render(); toast([{t:'Back to your arrival in ' + STOPS[k].n, c:'time'}]);
}

// packing screen
function packHTML(){
  const sel = G.flags.packSel || [];
  return `<div class="text">${paras(`One bag each. The BBC's rule, and Fogg's: he took a carpet-bag with two shirts and three pairs of stockings. You have room for <b>three</b> things beyond the essentials. Choose carefully: some of these will matter a great deal somewhere between Dubai and Felixstowe.`, true)}</div>
    <div class="packgrid">${Object.keys(ITEMS).map(k => `<button class="packi ${sel.indexOf(k) >= 0 ? 'on' : ''}" data-pk="${k}"><span class="ic">${ITEMS[k].ic}</span><b>${esc(ITEMS[k].n)}</b>${esc(ITEMS[k].d)}</button>`).join('')}</div>
    <div class="center"><button class="btn" id="packdone" ${sel.length === 3 ? '' : 'disabled style="opacity:.5"'}>${sel.length === 3 ? 'Close the bag' : `Choose ${3 - sel.length} more`}</button></div>`;
}
function wirePack(){
  $('#inner').querySelectorAll('[data-pk]').forEach(el => el.onclick = () => {
    const sel = G.flags.packSel || (G.flags.packSel = []); const k = el.dataset.pk, i = sel.indexOf(k);
    if (i >= 0) sel.splice(i, 1); else if (sel.length < 3) sel.push(k); else { sel.shift(); sel.push(k); }
    SND.fx('click'); render();
  });
  const d = $('#packdone'); if (d) d.onclick = () => { if ((G.flags.packSel || []).length !== 3) return; G.flags.packSel.forEach(k => G.items.push(k)); addLog('Packed: ' + G.flags.packSel.map(k => ITEMS[k].n).join(', ') + '.'); delete G.flags.packSel; goBeat('london'); };
}

// ── passport panel ──────────────────────────────────────────────────────────
const TABS = [['itin','Itinerary'],['stamps','Stamps'],['bag','Luggage'],['people','Company'],['diary','Diary']];

  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${UI.tab === k ? 'on' : ''}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; renderSide(); });
  const p = $('#panel');
  if (!G){ p.innerHTML = `<div class="ptitle">The Rules</div><p style="font-size:.92rem;line-height:1.5">1. Leave the Reform Club, Pall Mall.<br>2. Go round the world.<br>3. No aeroplanes. Not one.<br>4. Be back at the Reform Club within 80 days.</p><p class="meta">Phileas Fogg did it in 1872 and won £20,000. You are doing it in 1988 for the BBC, which is not the same thing at all.</p>`; return; }
  let h = '';
  if (UI.tab === 'itin'){
    h = `<div class="ptitle">Itinerary</div><table class="itin"><tr><th>PLACE</th><th>ARRIVED</th><th>FOGG</th></tr>` +
      ORDER.filter(k => k !== 'suez' && k !== 'riyadh' && k !== 'felixstowe').map(k => {
        const s = STOPS[k], a = G.arr[k], d = foggDiff(k);
        return `<tr class="${k === G.stop ? 'now' : ''}"><td>${esc(s.n)}</td><td>${a !== undefined ? 'Day ' + dayNum(a) : '<span class="meta">—</span>'}</td><td>${s.fogg !== undefined ? (d !== null ? `<span class="${d > 0 ? 'behind' : 'ahead'}">${d > 0 ? '−' : '+'}${Math.round(Math.abs(d) / 12) / 2}d</span>` : 'Day ' + dayNum(s.fogg)) : ''}</td></tr>`;
      }).join('') + `</table><p class="meta">Fogg's column shows the day he reached the same point in the novel, or how far ahead (+) or behind (−) of him you were. ${G.missed} missed connection${G.missed === 1 ? '' : 's'} so far.</p>`;
  } else if (UI.tab === 'stamps'){
    h = `<div class="ptitle">Visas &amp; Entries (${G.stamps.length}/${STAMPS.length})</div><div class="stamps">` + STAMPS.map(([k, n, c], i) => G.stamps.indexOf(k) >= 0
      ? `<div class="stamp ${i % 3 === 1 ? 'sq' : ''}" style="color:${c};transform:rotate(${(i * 37 % 24) - 12}deg)"><small>ENTRY</small>${esc(n.toUpperCase())}<small>1988</small></div>`
      : `<div class="stamp empty ${i % 3 === 1 ? 'sq' : ''}"><small>${esc(n)}</small></div>`).join('') + `</div>`;
  } else if (UI.tab === 'bag'){
    h = `<div class="ptitle">In the Bag</div>` + (G.items.length ? G.items.map(k => `<div class="item"><div class="ic">${ITEMS[k].ic}</div><div><div class="nm">${esc(ITEMS[k].n)}</div><div class="ds">${esc(ITEMS[k].d)}</div></div></div>`).join('') : '<p class="meta">Not packed yet.</p>')
      + `<div class="ptitle" style="margin-top:12px">Souvenirs for the Referees (${G.souv.length})</div>` + (G.souv.length ? G.souv.map(k => `<div class="item"><div class="ic">${SOUVS[k].ic}</div><div><div class="nm">${esc(SOUVS[k].n)}</div><div class="ds">${esc(SOUVS[k].d)}</div></div></div>`).join('') : '<p class="meta">Nothing yet. Three referees are waiting in Pall Mall, and they will expect presents.</p>');
  } else if (UI.tab === 'people'){
    h = `<div class="ptitle">Company</div>` + G.met.map(k => { const c = PEOPLE[k]; return `<div class="person"><div class="av" style="background:${c.c}">${esc(c.n.replace(/^The /, '')[0])}</div><div><span class="nm">${esc(c.n)}</span><span class="rl">${esc(c.r)}</span><div class="ds">${esc(c.d)}</div></div></div>`; }).join('');
  } else if (UI.tab === 'diary'){
    h = `<div class="ptitle">Diary</div>` + (G.log.length ? G.log.map(l => `<div class="diary"><b>Day ${l.d}</b> · ${esc(l.w)}: ${esc(l.t)}</div>`).join('') : '<p class="meta">Nothing yet.</p>');
  }
  p.innerHTML = h;
}
function openModal(html){ $('#mbody').innerHTML = html; $('#modal').classList.remove('hidden'); }

// ── title, menu, ending ─────────────────────────────────────────────────────
function renderTitle(){
  const sv = tryLoad();
  $('#inner').innerHTML = `<div class="titlescr">${photoHTML('reform', 'The Reform Club, Pall Mall')}
    <span class="tag">BBC · 1988 · NO AEROPLANES</span>
    <h1>Around the World<br>in <span>80</span> Days</h1>
    <div class="sub">THE PALIN ROUTE · A GAME</div>
    <div class="rules">${paras(`It is Sunday the 25th of September, 1988. In 1872, in this very club, Phileas Fogg bet twenty thousand pounds that he could go round the world in eighty days. Now the BBC would like you to try it, using only what Fogg had: trains, boats, and whatever else floats, rolls or can be ridden.

You'll go by Orient Express, ferry, dhow, freighter, sleeper and container ship. Every departure runs to a <b>real timetable</b>: miss one, and you wait for the next. Every port is full of things worth filming, and every one of them costs <b>hours</b>. Keep your <b>Spirits</b> up and make good <b>Telly</b>, collect a souvenir for each of the three referees, and be back on the steps of the Reform Club before <b>10:30 on Wednesday 14 December</b>.`)}</div>
    <div class="clear"></div>
    <div class="btns">${sv ? `<button class="btn" data-load>Continue: Day ${dayNum(sv.t)}, ${esc(STOPS[sv.stop].n)}</button>` : ''}<button class="btn ${sv ? 'ghost' : ''}" data-new>Leave the Reform Club</button></div>
    <p class="meta" style="max-width:620px;margin:16px auto 0">An unofficial fan game after Michael Palin's 1989 BBC series and Jules Verne's novel. Events are dramatised, times are approximate and every word is new. Photographs are freely licensed pictures of the real places from Wikimedia Commons, credited on each one. They are not stills from the programme.</p></div>`;
  wireStage();
  const nb = $('#inner').querySelector('[data-new]');
  if (nb && sv) nb.onclick = () => { if (confirm('Start again from the Reform Club? Your saved journey will be lost.')) startNew(); };
}
function openMenu(){
  const cps = G ? ORDER.filter(k => G.checkpoints[k]) : [];
  openModal(`<div class="ptitle center" style="font-size:1.6rem">Menu</div><div class="choices" style="max-width:460px;margin:0 auto">
    <button class="ticket" id="mhelp"><span class="main">How to play</span><span class="stub">?</span></button>
    <button class="ticket" id="msnd"><span class="main">Sound: ${SND.on ? 'on' : 'off'}</span><span class="stub">♪</span></button>
    ${cps.length ? `<button class="ticket" id="mcp"><span class="main">Go back to an earlier arrival<small>${cps.length} places saved</small></span><span class="stub">↺</span></button>` : ''}
    <button class="ticket" id="mcred"><span class="main">Photo credits</span><span class="stub">©</span></button>
    <button class="ticket" id="mnew"><span class="main">Start again</span><span class="stub">⟲</span></button>
    ${G ? '<button class="ticket" id="mtitle"><span class="main">Title page</span><span class="stub">⌂</span></button>' : ''}
  </div><p class="meta center">Progress is saved after every step.</p>`);
  const q = id => document.getElementById(id);
  q('mhelp').onclick = () => openModal(`<div class="ptitle" style="font-size:1.5rem">How to play</div><div class="text">${paras(`<b>The clock</b> is everything. The board at the top shows the day, the local time and how long you have left to get back to Pall Mall. Going east, every clock you meet is a little further ahead than the last, as Fogg discovered. The departure board in each port shows when the next boat or train leaves.

<b>Tickets</b> are your choices. The stub shows how many hours each one takes. If it says <b>MISS IT</b>, doing it means watching your boat leave without you. Some departures run every day; some ships sail once a week. A missed connection can cascade round the planet.

<b>Spirits</b> fall when you stay up too long, get seasick or have a bad day. Sleep, food and kindness bring them back. At zero you collapse and lose eleven hours. <b>Telly</b> is how good the series will be: filming things, doing pieces to camera and playing the games all help. The <b>Float</b> is the BBC's money. Spend it wisely, or on a Bellini.

  q('mnew').onclick = () => { if (!G || confirm('Start again from the Reform Club? Your current journey will be lost.')) startNew(); };
  if (q('mtitle')) q('mtitle').onclick = () => { closeModal(); if (UI.inst && UI.inst.stop) UI.inst.stop(); UI.inst = null; UI.game = null; G = null; UI.prevFlap = {}; render(); };

function updateSoundBtn(){ $('#btnSound').style.opacity = SND.on ? 1 : .45; $('#btnSound').title = SND.on ? 'Sound on' : 'Sound off'; }

function renderEnding(){
  const e = G.ending, ok = e.t <= DEADLINE, spare = DEADLINE - e.t;
  const viewers = (4 + G.stats.telly * .085).toFixed(1);
  const refs = ['hewison', 'jones', 'gilliam'];
  const gifts = refs.map((r, i) => { const k = G.souv[i]; return k ? `<p><b>${PEOPLE[r].n}</b> gets the ${esc(SOUVS[k].n.toLowerCase())}, and ${SOUVS[k].gift}</p>` : `<p><b>${PEOPLE[r].n}</b> gets nothing at all, and says so, loudly.</p>`; }).join('');
  const verdict = ok
    ? (spare < 6 ? 'By a whisker. By a whisker of a whisker.' : spare < 30 ? 'Hours to spare. Fogg would have nodded once, which for Fogg is a standing ovation.' : 'Comfortably early, which nobody will believe.')
    : `${dur(-spare)} late. Phileas Fogg would have lost his twenty thousand pounds. The BBC, on the other hand, would like to know whether you'd consider a follow-up.`;
  return `<div class="endcard"><span class="tag">${ok ? 'MADE IT' : 'TOO LATE'} · REFORM CLUB · PALL MALL</span>
    <div class="bigt" style="margin-top:12px">${ok ? `${Math.floor(e.t / 24)} days, ${Math.floor(e.t % 24)} hours` : `Around the World in ${Math.ceil(e.t / 24)} Days`}</div>
    ${photoHTML('reform', ok ? 'Home, on the steps' : 'Home, eventually')}
    <div class="text" style="text-align:left">${paras(`${ok ? `You climb the steps of the Reform Club at ${clock(e.t, 0)} on ${prettyDate(e.t, 0)}, ${dur(spare)} inside the limit.` : `You climb the steps of the Reform Club at ${clock(e.t, 0)} on ${prettyDate(e.t, 0)}.`} ${verdict}

The three referees are waiting in the hall, with the crew's families, the press and a man from the club who would very much like the cameras to go home now.

${gifts}`, true)}</div><div class="clear"></div>
    <div class="stats"><div><b>${G.stamps.length}</b>passport stamps</div><div><b>${viewers}m</b>viewers (est.)</div><div><b>${G.missed}</b>missed connections</div><div><b>£${G.stats.cash}</b>left in the float</div><div><b>${G.souv.length}</b>souvenirs</div></div>
    <p class="meta">${G.stats.telly >= 70 ? 'The series is a sensation. Strangers will ask you about the dhow for the rest of your life.' : G.stats.telly >= 40 ? 'The series does nicely. The BBC talk vaguely about the North Pole.' : 'The series is "gently watchable", which a reviewer means kindly.'}</p>
    <div class="btns" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-new>Go round again</button>${ORDER.filter(k => G.checkpoints[k] && k !== 'reform' && k !== 'felixstowe').slice(-1).map(k => `<button class="btn ghost" data-cp="${k}">Back to ${esc(STOPS[k].n)}</button>`).join('')}</div></div>`;
}
