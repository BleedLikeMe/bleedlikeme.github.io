        interrupts:['A bus goes past', 'A pigeon lands on the camera', 'Somebody asks for directions to Trafalgar Square', 'A club porter clears his throat'],
        winText:'Clem says "lovely" in the voice that means "that will do". You have started.', loseText:'It\'s in the can, after a fashion. Nobody will notice the pigeon.'}},
    {k:'library', t:'Go and find Fogg\'s armchair in the library', h:.25, fx:{telly:3}, res:`There isn't one, of course. Fogg never existed. But a kindly member points out "the sort of chair he'd have sat in", and Nigel films it lovingly, and somewhere in the edit it will become Fogg's chair.`},
    {k:'tea', t:'One last cup of proper tea', h:.25, fx:{spirits:5}, res:`Served in china, with a saucer, in a room with a fire. You drink it slowly, like a man saying goodbye to a friend.`}
  ]};

// ── TO VENICE ───────────────────────────────────────────────────────────────
BEATS.vsoe1 = {title:'The Orient Express', label:'LEG 1 · VICTORIA TO FOLKESTONE', photo:'vsoe', cap:'The Pullman, heading for the coast',
  text:`The Venice Simplon-Orient-Express pulls out of Victoria with a lurch and a hiss, and you are off: eighty days starts now, in a carriage panelled in walnut, with a steward who calls you "sir" as if he means it.

Kent goes by in a blur of oast-houses. At Folkestone everyone transfers to the ferry, and the white cliffs slide away behind you. It is, you reflect, the last bit of Britain you'll see until December. Unless something goes very wrong.`,
  choices:[
    {t:'Have lunch in the Pullman car', fx:{spirits:8}, go:'vsoe2', res:'Smoked salmon and a glass of something cold, served with the confidence of a train that has never been late in its life.'},
    {t:'Interview your fellow passengers', fx:{telly:6}, go:'vsoe2', res:'An American couple on their honeymoon, a retired colonel and a woman who has done the trip fourteen times and never once looked out of the window. Lovely telly.'},
    {t:'Stand on deck and watch the cliffs go', fx:{spirits:4, telly:3}, go:'vsoe2', res:'The cliffs go. You feel absurdly emotional for a man who will be in France in ninety minutes.'}
  ]};
BEATS.vsoe2 = {adv:9, sleep:false, title:'Across France', label:'LEG 1 · BOULOGNE TO THE ALPS', photo:'pullman', cap:'Dinner jackets compulsory', fx:{stamp:'fr'},
  text:`At Boulogne the continental train is waiting: blue and gold sleeping cars, every one with a history. The French countryside darkens, and a steward appears with the news that dinner is in an hour and black tie is, naturally, expected.

You packed one bag. It does not contain a dinner jacket. The steward, who has seen everything, produces one from a cupboard, and it fits almost everywhere.`,
  choices:[
    {t:'Dress for dinner and dine like Fogg', fx:{spirits:10, telly:4}, go:'vsoe3', res:'Five courses, a pianist and a borrowed bow tie. Nigel films you looking out of the window at nothing in particular, which, you will learn, is the most useful shot in television.'},
    {t:'Talk to the steward about the train\'s history', fx:{telly:6}, go:'vsoe3', res:'Agatha Christie, kings, spies and a carriage that spent the war as a brothel. You suspect half of it is true. You suspect the steward suspects that too.'},
    {t:'Go to bed early: it\'s a long way', fx:{spirits:14, sleep:true}, go:'vsoe3', res:'The bunk is narrow and the rocking is perfect. You sleep the sleep of the innocent and the unfilmed.'}
  ]};
BEATS.vsoe3 = {adv:12, title:'Through the Alps', label:'LEG 1 · SWITZERLAND TO ITALY', photo:'vsoe', cap:'Somewhere in Austria', fx:{stamp:['ch','at']},
  text:`You wake in Switzerland, which is extraordinarily tidy, and by mid-morning you're climbing through Austria with snow on the peaks and cows wearing bells. Then the Brenner, and down into Italy, where the light goes gold and the station names get longer.

By late afternoon the lagoon opens out on either side of the causeway and there, floating on nothing, is Venice.`,
  choices:[
    {t:'Step off into Venice', h:7.5, go:'venice', fx:{spirits:4}},
    {t:'Do a quick piece about Fogg as you cross the causeway', h:7.5, go:'venice', fx:{telly:5}, res:'"Fogg didn\'t come this way," you tell the camera. "He went via Brindisi. But then Fogg didn\'t have the BBC\'s travel department." It will probably be cut.'}
  ]};

// ── VENICE ──────────────────────────────────────────────────────────────────
BEATS.venice = {hub:true, arrive:'venice', title:'Venice', cap:'The Grand Canal',
  text:`Venice in late September: a city that should have sunk years ago, and hasn't, out of sheer bloody-mindedness. Your hotel is down an alley so narrow that the crew have to carry the silver boxes in single file.

The ferry to Greece sails tomorrow evening. Between now and then is a whole day in one of the most beautiful cities on earth, and every hour of it can be spent only once.`,
  again:`Bells, water, pigeons. The ferry to Patras leaves from the Stazione Marittima, and Clem keeps tapping his watch, gently.`,
  acts:[
    {k:'barge', t:'Ride with the city\'s rubbish collectors on their barge', h:4, sub:'Venice from the bottom up',
      game:{type:'dodge', theme:'barge', title:'The Rubbish Barge', telly:14, fxWin:{spirits:4},
        winText:'The binmen of Venice adopt you as one of their own, for the morning. It is the best thing you\'ve filmed, and it smells like it.', loseText:'You collected some rubbish and one gondolier\'s hat. The gondolier wants it back.'}},
    {k:'gondola', t:'Take a gondola down the Grand Canal', h:1.5, cost:50, fx:{spirits:10, telly:4}, res:'The gondolier does not sing. You ask him to. He looks at you with deep Venetian pity and charges you extra for asking.'},
    {k:'ptc', t:'Do a piece to camera on the Rialto Bridge', h:1.5,
      game:{type:'ptc', id:'venice', title:'Piece to Camera: The Rialto', telly:10,
        script:['Day three,', 'and I\'m already', 'a week behind', 'with my laundry,', 'but bang on time', 'for Venice.'],
        interrupts:['A gondolier bursts into song', 'A tour group of forty walks through the shot', 'A pigeon investigates the microphone', 'The church bells start'],
        winText:'One take. The tourists applaud, thinking you are someone else.', loseText:'Take seven. A Japanese tour party now knows the script better than you.'}},
    {k:'glass', t:'Buy something in Murano glass for the referees', h:1, cost:25, fx:{souv:'glass'}, res:'A glass gondolier, six inches high, with a tiny glass oar. It will need to survive the Gulf, the Indian Ocean, the Pacific and the Atlantic. You wrap it in three pairs of socks.'},
    {k:'harry', t:'A Bellini at Harry\'s Bar', h:1.5, cost:30, fx:{spirits:12}, res:'Peach juice and prosecco, in the bar Hemingway propped up. It costs about the same as a small car. Clem pays, and writes it down in a different coloured ink.'},
    {k:'rain', t:'Film St Mark\'s Square in the rain', h:1, if:g => has('umbrella'), fx:{telly:6, spirits:2}, res:'The BBC umbrella earns its keep. The square floods slightly, the pigeons huddle, and you look, Nigel says, "like a man in a Fellini film who has lost the plot". He means it kindly.'},
    {k:'sleep', t:'Sleep in a proper bed', h:8, sleep:true, cost:60, fx:{spirits:25}, res:'Proper sheets, a window onto a canal and absolutely no movement. Enjoy it. It may be a while.'}
  ]};
BEATS.adriatic = {title:'Down the Adriatic', label:'LEG 2 · VENICE TO PATRAS', photo:'venice', cap:'Leaving the lagoon',
  text:`The ferry eases out past St Mark's, and Venice sinks into the evening behind you. A night and a day down the Adriatic: the coast of Yugoslavia on one side, Italy's heel somewhere over the horizon on the other.

The ship is full of lorry drivers, backpackers and a party of Greek grandmothers who adopt Nigel within the hour.`,
  choices:[
    {t:'Sleep on deck under the stars', h:36, sleep:true, fx:{spirits:12}, go:'greece', res:'Cold, damp and wonderful. You wake to dolphins, which may also have been a dream.'},
    {t:'Film the grandmothers\' card game', h:36, sleep:true, fx:{telly:8, spirits:4, cash:-10}, go:'greece', res:'They let you play. You lose ten pounds in a game whose rules change every time you seem about to win.'}
  ]};

// ── GREECE & CRETE ──────────────────────────────────────────────────────────
BEATS.greece = {hub:true, arrive:'greece', title:'Athens', cap:'Evzones, Athens',
  text:`Patras, then a bus through the hills, and Athens: hot, loud, and ringed with mountains. The overnight ferry to Crete leaves from Piraeus tomorrow evening.

You have a day and a half in Greece, which has been here for three thousand years and doesn't see what the hurry is.`,
  again:`Athens hums along. The ferry to Heraklion leaves from Piraeus in the evening.`,
  acts:[
    {k:'corinth', t:'Stop at the Corinth Canal', h:2, fx:{telly:5}, photo:'corinth', res:'A slot cut through solid rock, so deep and narrow it looks like the earth has been sliced with a cake knife. A ship squeezes through below you with inches to spare. You know the feeling.'},
    {k:'evzones', t:'Watch the Evzones change the guard', h:1.5, fx:{telly:6}, res:'Kilts, pompoms on their shoes and a slow-motion high-stepping march that would be ridiculous if it weren\'t so magnificent. You try it on the way back to the hotel. It is ridiculous.'},
    {k:'acropolis', t:'Climb up to the Acropolis', h:3, fx:{telly:4, spirits:5}, res:'The Parthenon, wrapped in scaffolding, like a great-aunt with a broken hip. Still the most perfect building you have ever seen.'},
    {k:'taverna', t:'Dinner in a taverna in the Plaka', h:2, cost:20, fx:{spirits:10}, res:'Grilled octopus, retsina that tastes of pine trees and a waiter who thinks the BBC is a type of cheese.'},
    {k:'phone', t:'Phone home', h:.5, cost:5, fx:{spirits:6}, res:'Everyone is fine. The cat is fine. They saw a trailer for the series and you looked "tired". It is day five.'},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:40, fx:{spirits:25}}
  ]};
BEATS.tocrete = {title:'The Night Boat', label:'LEG 3 · PIRAEUS TO HERAKLION', photo:'crete', cap:'Heraklion harbour',
  text:`The night ferry to Crete is a floating town: families, soldiers on leave, a man with a goat in a crate. Everyone settles down wherever there's space.`,
  choices:[
    {t:'Find a corner of the deck and sleep', h:10, sleep:true, fx:{spirits:8}, go:'crete'},
    {t:'Pay for a cabin', h:10, sleep:true, cost:30, fx:{spirits:16}, go:'crete', res:'A cabin the size of a wardrobe, with a porthole and a radiator that won\'t turn off. Bliss.'}
  ]};
BEATS.crete = {hub:true, arrive:'crete', title:'Heraklion', cap:'Heraklion old harbour',
  text:`Crete at dawn: the old Venetian fort on the harbour wall, fishing boats and the smell of strong coffee. The steamer for Alexandria sails this evening, and there's only one a couple of times a week, so do not miss it.

Word has got round that the BBC is in town. There's a British army detachment on the island, and they have sent an invitation.`,
  again:`The steamer for Alexandria is taking on cargo. Only a couple of sailings a week: this is not one to miss.`,
  acts:[
    {k:'tea', t:'Cream tea with the British soldiers', h:2, talk:true, fx:g => has('teabags') ? {spirits:16, telly:8} : {spirits:12, telly:6},
      res:g => has('teabags') ? 'Scones, jam, clotted cream, and the lads\' faces when you hand round your teabags. You are a hero. A sergeant from Doncaster nearly cries.' : 'Scones, jam, clotted cream and a sergeant from Doncaster who wants to know what Terry Jones is really like. Very English, very far from England.'},
    {k:'knossos', t:'Visit the palace of Knossos', h:3, fx:{telly:5, spirits:3}, res:'King Minos\'s palace, and the labyrinth, maybe. You get lost in a reconstructed corridor, which seems appropriate.'},
    {k:'swim', t:'Swim in the sea', h:1, fx:{spirits:8}, res:'Warm, clear and full of very small fish. The crew film you from the shore and refuse to say why they are laughing.'},
    {k:'sleep', t:'Sleep in a pension', h:6, sleep:true, cost:25, fx:{spirits:18}}
  ]};
BEATS.med = {title:'Across the Mediterranean', label:'LEG 4 · HERAKLION TO ALEXANDRIA', photo:'crete', cap:'Leaving Crete',
  text:`A day and a night across the eastern Mediterranean. Somewhere on the far side is Africa, and after that, the hard part.

At Alexandria you'll take the train straight on to Cairo.`,
  choices:[
    {t:'Read about Fogg\'s route', h:35, sleep:true, if:g => has('verne'), fx:{spirits:6, telly:2}, go:'egypt', res:'Fogg reached Suez on day seven. He spent the time playing whist. You are on day seven and nowhere near Suez. You put the book down.'},
    {t:'Watch the sea and think of nothing', h:35, sleep:true, fx:{spirits:10}, go:'egypt'},
    {t:'Film the crossing for the programme', h:35, sleep:true, fx:{telly:5, spirits:4}, go:'egypt'}
  ]};

// ── EGYPT ───────────────────────────────────────────────────────────────────
BEATS.egypt = {hub:true, arrive:'egypt', title:'Cairo', cap:'The Great Pyramid, Giza',
  text:`Cairo hits you like a warm towel: fourteen million people, all of them apparently driving at once, horns going like a brass band with a grievance.

The plan is simple. The pilgrim ferry to Jeddah leaves Suez on Wednesday evening. Suez is three hours by road. Between now and then, Egypt.`,
  again:`Cairo roars on. The car to Suez will need to leave in good time for Wednesday's ferry.`,
  acts:[
    {k:'pyr', t:'Piece to camera at the Pyramids', h:3, sub:'with camels',
      game:{type:'ptc', id:'giza', title:'Piece to Camera: Giza', telly:12,
        script:['The Great Pyramid', 'has stood here', 'for four and a half thousand years,', 'which is roughly', 'how long', 'I\'ve been waiting for a taxi.'],
        interrupts:['A camel walks into shot', 'A man tries to sell Nigel a scarab', 'The wind fills your mouth with sand', 'A camel walks OUT of shot, and then back IN'],
        winText:'A classic. Even the camel looks pleased.', loseText:'Nineteen takes. The camel is now a star and wants a percentage.'}},
    {k:'camel', t:'Ride a camel round the Pyramids', h:1, cost:10, fx:{spirits:3, telly:5}, res:'The camel\'s name is Canada Dry. It gets up back legs first, which nobody ever warns you about. You will never sit comfortably again.'},
    {k:'football', t:'Go to a football match in Cairo', h:3, fx:{spirits:8, telly:6}, res:'Eighty thousand people, flares, drums and a nil-nil draw that the crowd treats like the Second Coming. You are cheered into the stadium for no reason you ever discover.'},
    {k:'film', t:'Take a part in an Egyptian film', h:4, fx:{telly:12, spirits:-4}, res:'You are cast, at about ten minutes\' notice, as an English tourist. You have one line, in Arabic, which you deliver eleven times. The director clasps your hand and says you are a natural, then cuts your line.'},
    {k:'haggle', t:'Bargain for a present in the Khan el-Khalili bazaar', h:2, game:{type:'haggle', title:'Haggling in the Khan el-Khalili', item:'Papyrus of Tutankhamun', open:65, souv:'papyrus', telly:6}},
    {k:'felucca', t:'Sail a felucca on the Nile at sunset', h:2, cost:15, fx:{spirits:12, telly:3}, res:'The Nile turns pink, then gold, then black. The boatman sings, unasked. You could stay forever, if you didn\'t have a ferry to catch.'},
    {k:'sleep', t:'Sleep in the old hotel', h:8, sleep:true, cost:40, fx:{spirits:25}}
  ]};
BEATS.suezcancel = {adv:3, title:'Suez', label:'LEG 5 · CAIRO TO SUEZ', photo:'suez', cap:'The Suez Canal',
  text:`Three hours across the desert to Suez, and the shipping office at Port Tewfik, where a man behind a desk tells you, with great sympathy, that the ferry is cancelled.

Not delayed. Cancelled. Something about the pilgrim season, something about the ship. The next one is "tomorrow, probably". Clem goes very pale and starts doing sums on the back of an envelope.

This is the first real setback, and it is a long way from the last.`,
  log:'The ferry to Jeddah was cancelled. Waiting in Suez.',
  choices:[{t:'Find out about the next sailing', go:'suez'}]};
BEATS.suez = {hub:true, arrive:'suez', title:'Suez', label:'STRANDED · SUEZ', cap:'The Suez Canal',
  text:`The next ferry to Jeddah is confirmed, more or less, for the morning. Meanwhile, Suez: a town whose whole reason to exist is to watch other people go somewhere else.

Fogg came through here on day seven, by the way. He didn't even get off the boat.`,
  again:`Ships glide down the canal, going places. The pilgrim ferry is, apparently, coming.`,
  acts:[
    {k:'ships', t:'Watch the ships go down the canal', h:2, fx:{telly:5, spirits:2}, res:'Supertankers slide past the end of the street like buildings that have decided to move house. From a distance they seem to be sailing across the desert.'},
    {k:'office', t:'Argue for a cabin at the shipping office', h:1, fx:{spirits:-3, flag:'cabin'}, res:'Forty minutes of politeness, tea and paperwork. You leave with a cabin, a headache and a new admiration for the Egyptian civil service.'},
    {k:'pilgrims', t:'Drink tea with pilgrims on the quay', h:1.5, talk:true, fx:{telly:5, spirits:6}, res:'A family from Alexandria going to Mecca for the first time. The grandfather has saved for forty years. He asks why you are going round the world, and you find you don\'t have a very good answer.'},
    {k:'sleep', t:'Sleep in a Suez hotel', h:8, sleep:true, cost:20, fx:{spirits:20}}
  ]};
BEATS.redsea = {title:'The Red Sea', label:'LEG 6 · SUEZ TO JEDDAH', photo:'suez', cap:'Down the Gulf of Suez',
  text:`The pilgrim ferry is packed to the gunwales: families with bedrolls, old men in white, boys selling sweets. It is hot, it is crowded, and for two days the whole ship is full of a quiet, happy excitement that you can't share but can't help catching.`,
  choices:[
    {t:'Spend the voyage talking with the pilgrims', h:34, sleep:true, fx:{telly:8, spirits:6}, go:'jeddah'},
    {t:'Retreat to the cabin you argued for', h:34, sleep:true, if:g => flag('cabin'), fx:{spirits:16}, go:'jeddah'},
    {t:'Find a space on deck', h:34, sleep:true, if:g => !flag('cabin'), fx:{spirits:4}, go:'jeddah'}
  ]};

// ── ARABIA ──────────────────────────────────────────────────────────────────
BEATS.jeddah = {hub:true, arrive:'jeddah', title:'Jeddah', cap:'The road east',
  text:`Saudi Arabia does not do tourists. It barely does film crews. You have a transit visa and a list of things you mustn't film that is longer than the list of things you can.

The plan: drive across the whole peninsula, to Riyadh and on through Qatar to Dubai, and find a boat there for India. Nobody is quite sure which boat. The road is yours, whenever you're ready, but the trading dhows don't hang about.`,
  again:`Jeddah shimmers. The road east is waiting, whenever you are.`,
  acts:[
    {k:'permit', t:'Get the transit papers stamped', h:3, fx:{flag:'permit', spirits:-6}, sub:'you can\'t leave without them', res:'Four offices, three floors, two cups of very sweet tea and a stamp. The man with the stamp is not in a hurry. Nobody in the building is in a hurry, ever.'},
    {k:'jog', t:'Go for a run along the Corniche', h:1.5, fx:g => ({spirits:4 + heat(g), telly:5}), res:'The seafront is lined with huge modern sculptures, a whole open-air gallery of them, and you jog past them at dawn in shorts while Nigel films from a car. It is either art or a cry for help.'},
    {k:'souk', t:'Wander the old town souk', h:2, fx:g => ({telly:5, spirits:2 + heat(g)}), res:'Old coral-stone houses with wooden balconies leaning over the alleys, gold in the windows and spice in the air.'},
    {k:'sleep', t:'Sleep somewhere air-conditioned', h:8, sleep:true, cost:40, fx:{spirits:25}}
  ]};
BEATS.toriyadh = {title:'Across the Peninsula', label:'LEG 7 · JEDDAH TO RIYADH', photo:'desert', cap:'Nine hundred kilometres of this',
  text:`Nine hundred kilometres of road, straight as a ruler and hot enough to fry an egg on, if anyone had an egg. Camels watch from the verges with the expression of animals who have seen many television crews and survived them all.`,
  choices:[
    {t:'Drive straight through', h:14, fx:g => ({spirits:-6 + heat(g), telly:3}), go:'riyadh'},
    {t:'Sleep across the back seat', h:14, sleep:true, fx:{spirits:6}, go:'riyadh'}
  ]};
BEATS.riyadh = {hub:true, arrive:'riyadh', title:'Riyadh', cap:'Masmak fort, Riyadh',
  text:`Riyadh: glass towers going up out of the sand, and in the middle of them a mud-brick fort that looks like it was built by a child with infinite patience.

The road goes on east, through Qatar, to Dubai. The dhow captains of Dubai Creek aren't going to wait for a man from the BBC.`,
  again:`Riyadh glitters. Dubai is a long day's drive away.`,
  acts:[
    {k:'masmak', t:'Visit the Masmak fort', h:2, fx:{telly:5}, res:'Thick mud walls, a door with a spearhead still stuck in it, and a caretaker who tells the whole story of the fort\'s capture in 1902, acting out all the parts.'},
    {k:'camels', t:'Go to the camel market', h:2, fx:g => ({telly:6, spirits:3 + heat(g)}), res:'Two thousand camels and their owners, all shouting. A man offers you a very good price on a young female. You explain about the no-aeroplanes rule, and he points out that camels aren\'t aeroplanes. He has you there.'},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:40, fx:{spirits:25}}
  ]};
BEATS.qatar = {title:'Through Qatar', label:'LEG 8 · RIYADH TO DUBAI', photo:'desert', cap:'Border country',
  text:`East to the Gulf, through a border post into Qatar, out the other side and along the coast into the Emirates. Two more stamps, if the officials are in the mood.`,
  choices:[
    {t:'Stop for tea at the border', h:23, fx:{spirits:6, stamp:'qa'}, sleep:true, go:'dubai', res:'Mint tea, sweet as syrup, with border guards who want to know whether you have met the Queen.'},
    {t:'Push on without stopping', h:21, sleep:true, fx:g => ({spirits:-4 + heat(g), stamp:'qa'}), go:'dubai'}
  ]};

// ── DUBAI ───────────────────────────────────────────────────────────────────
BEATS.dubai = {hub:true, arrive:'dubai', title:'Dubai', cap:'Dhows on Dubai Creek',
  text:`Dubai Creek is lined with dhows: big wooden trading boats, three or four deep along the wharf, loading anything you can think of for Iran, Pakistan, Somalia, India. Fridges, tyres, bicycles, sacks of rice and, on one of them, a Mercedes.

Somewhere among them is a boat going to Bombay that might take six strangers and their silver boxes. Finding it is your job, and the tides won't wait for you.`,
  again:g => flag('dhow') ? `The Al Shama sits low in the water at the wharf, nearly loaded. She sails on the evening tide.` : `The Creek is busy with boats. None of them is yours yet.`,
  acts:[
    {k:'hunt', t:'Go down to the Creek and find a dhow', h:3, go:'hunt1', sub:'no boat, no India'},
    {k:'abra', t:'Cross the Creek by water taxi', h:.5, cost:1, fx:{spirits:4, telly:2}, res:'A little wooden abra, twenty people on a bench and a fare so small it hardly counts. The best value in the Gulf.'},
    {k:'gold', t:'Look round the gold souk', h:1, fx:{telly:3}, res:'Windows full of gold, by the kilo. You are not in the market for a gold belt. Nigel is, briefly.'},
    {k:'supplies', t:'Buy provisions for the voyage', h:1, cost:30, fx:{flag:'provisions', spirits:2}, res:'Bottled water, fruit, biscuits, and a vast amount of toilet roll. The crew\'s sound man is an experienced traveller.'},
    {k:'phrases', t:'Learn some Gujarati from the crew', h:2, if:g => flag('dhow'), game:{type:'memory', title:'Gujarati on the Wharf', telly:6, fxWin:{spirits:6, flag:'gujarati'}, winText:'Hassan is delighted. "Kem cho?" he says. "Majama!" you say. He embraces you.', loseText:'You have learned that "haa" is yes. Or possibly no. The crew enjoy watching you find out.'}},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:50, fx:{spirits:25}}
  ]};
BEATS.hunt1 = {title:'Dubai Creek', label:'DUBAI · FINDING A BOAT', photo:'creek', cap:'Dhows along the Creek',
  text:`Roger has a list of names, a list of agents and a list of reasons why each of them will say no. The first agent says no. The second says yes, then remembers that his boat is going to Somalia.

The dhows themselves are crewed mostly by men from Gujarat, on the north-west coast of India. They are as curious about you as you are about them.`,
  choices:[
    {t:'Keep working through Roger\'s list of agents', h:2, go:'hunt2', fx:{spirits:-4}},
    {t:'Go along the wharf and ask the crews yourself', h:2, go:'hunt2', fx:g => has('phrasebook') ? {telly:6, spirits:4} : {telly:6, spirits:-2},
      res:g => has('phrasebook') ? 'The phrasebook gets you as far as "hello" and "Bombay?", which is all you need. A crewman points along the wharf and grins.' : 'You point at boats and say "Bombay?" a great deal. Eventually someone points back.'}
  ]};
BEATS.hunt2 = {title:'The Al Shama', label:'DUBAI · FINDING A BOAT', photo:'dhow', cap:'A trading dhow under sail',
  text:`She is called the Al Shama: big, wooden and heavily loaded, with a high square stern and a crew of about fifteen. She is going to Bombay with a cargo of whatever it is, and she sails on the evening tide.

The nakhoda, her captain, looks at you, at the crew, at the silver boxes, and at Roger's money, for a long time.`,
  choices:[
    {t:'Agree the fare', cost:100, fx:{flag:'dhow', meet:['nakhoda', 'hassan', 'kasim', 'anwar', 'alimamoun']}, go:'dubai', log:'Found a dhow: the Al Shama, sailing for Bombay.',
      res:'He nods, once. You have a boat. There are no cabins, no beds, a toilet that hangs over the stern in a little wooden box, and absolutely no idea how long it will take. It is perfect.'},
    {t:'Try to bargain him down', if:g => has('phrasebook') || flag('gujarati'), cost:60, fx:{flag:'dhow', meet:['nakhoda', 'hassan', 'kasim', 'anwar', 'alimamoun'], spirits:4}, go:'dubai', log:'Found a dhow: the Al Shama, sailing for Bombay.',
      res:'Your three words of Gujarati make him laugh, and laughing makes him generous. You have a boat, at a price.'}
  ]};

// ── THE DHOW ────────────────────────────────────────────────────────────────
BEATS.dhow1 = {tz:4, title:'The Al Shama', label:'AT SEA · THE GULF', photo:'dhow', cap:'The Al Shama, outward bound', sfx:'horn',
  text:`The Al Shama slides down the Creek in the dusk, past the lights of Dubai, and out into the Gulf. The engine thumps, the deck tilts, and the crew settle in for the voyage as if it were a bus ride.

Then you clear the shelter of the land, and the sea begins to move. And so, a little later, does your stomach.`,
  log:'Sailed from Dubai on the dhow Al Shama.',
  choices:[
    {t:'Hold on to your dinner', sub:'keep the horizon level', game:{type:'seasick', title:'Keep It Down', telly:6, fxWin:{spirits:6}, fxLose:{spirits:-12},
      winText:'You stay upright, more or less, and the crew nod with something like respect.', loseText:'You lose your dinner over the side. Kasim watches, then pats you on the back with enormous sympathy and a grin like a shark.'}, go:'dhow2'},
    {t:'Lie down flat and stare at the sky', fx:g => has('patches') ? {spirits:2} : {spirits:-12}, go:'dhow2',
      res:g => has('patches') ? 'The patch behind your ear does its work. You feel woozy and, somehow, religious, but not sick.' : 'It doesn\'t help. Nothing helps. The night lasts about a month.'}
  ]};
BEATS.dhow2 = {adv:30, tz:4, title:'Day Two at Sea', label:'AT SEA · GULF OF OMAN', photo:'dhow', cap:'Life on deck',
  text:`You wake on the deck to a face upside down above yours, beaming. "Mi-kel Jack-son!" says Hassan, delighted, as he will every morning from now on. You never find out whether he thinks you are Michael Jackson, or just wants to be sure you know about him.

Ali Mamoun is already cooking on the fire in the stern: rice, dal and whatever came out of the sea. The crew eat together, squatting on the deck, and make room for you.`,
  choices:[
    {t:'Learn some Gujarati', if:g => !G.games.memory, game:{type:'memory', title:'Gujarati at Sea', telly:6, fxWin:{spirits:6, flag:'gujarati'}}, go:'dhow3'},
    {t:'Help Ali Mamoun cook', fx:{spirits:8, telly:4, souv:'spice'}, go:'dhow3', res:'You chop onions with a knife the size of a sword while he fishes, stirs, and tells you off. When you leave he gives you a twist of newspaper full of his spice mix. A real honour, you think. Possibly it\'s to stop you cooking anything ever again.'},
    {t:'Interview the nakhoda in the wheelhouse', fx:{telly:8}, go:'dhow3', res:'He has sailed these waters for forty years and has seen pirates, typhoons and once a submarine. He tells you about all of them in exactly the same tone of voice.'}
  ]};
BEATS.dhow3 = {adv:30, tz:5, title:'The Arabian Sea', label:'AT SEA · DAY THREE', photo:'dhow', cap:'Nothing but sea',
  text:g => `No land in any direction now. The deck is hot enough to cook on, and the crew rig an awning of sacking for the afternoons. Time stops meaning much. Clem stops looking at his watch, which is unsettling.

${has('walkman') ? 'In the evening Anwar notices your Walkman and wants to know, urgently, what is on it.' : 'In the evening someone tunes a crackly radio to the BBC World Service, and the whole crew listen to the shipping forecast for a sea a very long way away, in complete silence.'}`,
  choices:[
    {t:'Play Kasim some Bruce Springsteen', if:g => has('walkman'), fx:{telly:10, spirits:8}, go:'dhow4', res:'The old man listens with the headphones clamped to his ears and an expression of total concentration. Then he hands them back, nods, and says nothing at all. It is the best review the Boss has ever had.'},
    {t:'Play Anwar the Brahms violin concerto', if:g => has('walkman'), fx:{telly:9, spirits:8}, go:'dhow4', res:'Oistrakh, fiddling for his life, in the middle of the Arabian Sea. Anwar listens, frowning, then breaks into a huge smile. "Great disco!" he says.'},
    {t:'Listen to the World Service with the crew', if:g => !has('walkman'), fx:{telly:4, spirits:6}, go:'dhow4'},
    {t:'Write up your diary', if:g => has('notebook'), fx:{telly:5, spirits:4}, go:'dhow4', res:'Your pencil goes up and down with the waves. In years to come you will not be able to read a word of it, which is perhaps for the best.'},
    {t:'Sleep through the heat', fx:{spirits:10}, go:'dhow4'}
  ]};
BEATS.dhow4 = {adv:30, tz:5, title:'Dawn', label:'AT SEA · DAY FIVE', photo:'dhow', cap:'Sunrise on the Al Shama',
  text:`Sunrise, and Kasim is asleep on a coil of rope in the bows, a blanket over his head. Nigel creeps up to film him in the first light. Kasim opens one eye, regards the lens for a long time, and stares into it so steadily that Nigel is the one who looks away.

The wind is getting up. The nakhoda says something to the crew, and they start hauling on a sail, and then they look at you.`,
  choices:[
    {t:'Help the crew trim the sail', fx:{spirits:-4, flag:'fastdhow', telly:6}, go:'dhow5', res:'You haul when they haul and stop when they stop. Your hands are destroyed. But the Al Shama heels and picks up speed, and the nakhoda grunts at you. You think it\'s approval.'},
    {t:'Fish off the stern with Ali Mamoun', fx:{spirits:6, telly:4}, go:'dhow5', res:'The line twitches, the cry goes up, and the whole crew rush to see. A tuna! It is lunch within the hour.'},
    {t:'Stay in the shade', fx:{spirits:10}, go:'dhow5'}
  ]};
BEATS.dhow5 = {adv:30, tz:5.5, title:'Nearly India', label:'AT SEA · DAY SIX', photo:'dhow', cap:'The crew',
  text:g => `Washing is a bucket of sea water over the head. Shaving is optional and getting more optional. ${has('hat') ? 'Your Panama hat is the envy of the boat.' : 'The sun has turned your nose an interesting colour.'}

The crew are going home: most of them come from Mandvi, a port in Gujarat where dhows like this one have been built for centuries. Tonight is the last night at sea. Tomorrow, Bombay.`,
  fx:g => has('hat') ? {} : {spirits:-5},
  choices:[
    {t:'Ask the crew about their families', talk:true, fx:{telly:9, spirits:4}, go:'dhow6', res:'Photographs come out of wallets, wives, children, a new baby. Hassan shows you his house, on a photograph, very proudly. You show him yours. He is not impressed.'},
    {t:'Teach Hassan a song', fx:{spirits:8, telly:4}, go:'dhow6', res:'He learns the first line of "Always Look on the Bright Side of Life" and sings it at all hours for the rest of the voyage.'},
    {t:'Sit in the bows and watch for land', fx:{spirits:8}, go:'dhow6'}
  ]};
BEATS.dhow6 = {tz:5.5, title:'Bombay', label:'AT SEA · LANDFALL', photo:'gateway', cap:'Landfall at the Gateway of India',
  text:`In the night a glow comes up over the horizon, and by morning it is a coastline, then a city: smoke, towers, cranes, millions of people. Bombay.

The Al Shama noses into harbour. You've been at sea a week. Leaving the crew is harder than you expected. Hassan has tears in his eyes, or possibly diesel.`,
  choices:[
    {t:'Say goodbye to the crew of the Al Shama', h:g => flag('fastdhow') ? 38 : 50, sleep:true, fx:{spirits:6}, go:'bombay', log:'Landed in Bombay from the Al Shama.',
      res:g => flag('fastdhow') ? 'The extra sail paid off: you made the harbour twelve hours sooner than the nakhoda expected. He shakes your hand, which he hasn\'t done before.' : 'A last "Mi-kel Jack-son!" from the quay, and they are gone.'}
  ]};

// ── INDIA ───────────────────────────────────────────────────────────────────
BEATS.bombay = {hub:true, arrive:'bombay', title:'Bombay', cap:'Victoria Terminus, Bombay',
  text:g => `Bombay is everything, all at once and all the time: noise, colour, crowds, cows, a million taxis and the most beautiful railway station on earth. You're on dry land, which keeps moving for the first few hours.

Fogg was here on day eighteen. ${foggStr(foggDiff('bombay')) ? 'You are ' + foggStr(foggDiff('bombay')) + '.' : ''} The overnight express to Madras leaves Victoria Terminus tomorrow evening.`,
  again:`Bombay roars on. The Madras Express leaves Victoria Terminus in the evening.`,
  acts:[
    {k:'shave', t:'Get a shave from the blind barber', h:1, sub:'a cut-throat razor, and a lot of trust',
      game:{type:'shave', title:'A Close Shave', telly:12, fxWin:{spirits:8, meet:'barber'}, fxLose:{spirits:-6, meet:'barber'},
        winText:'Not a nick. The smoothest shave you have ever had, from a man who has never seen your face. You tip him far too much.', loseText:'Two small nicks, both entirely your fault for twitching. He dabs them with something that stings, and smiles.'}},
    {k:'snake', t:'Watch a snake charmer, and have a go', h:1, cost:5,
      game:{type:'simon', title:'The Snake Charmer', telly:9, fxWin:{spirits:5}, winText:'The cobra sways and rises, and so does the crowd. The charmer offers you a job.', loseText:'The cobra looks at you, then at its owner, then goes back into its basket in disgust.'}},
    {k:'astro', t:'Have your stars read by an astrologer', h:1.5, cost:10, fx:{souv:'horoscope', meet:'uppal', telly:6, spirits:4},
      res:'Jagjit Uppal studies your palm, your date of birth and the BBC for a long time. "You will complete your journey," he says at last, "but only just." Clem asks how just. Mr Uppal smiles.'},
    {k:'vt', t:'Watch the rush hour at Victoria Terminus', h:1, fx:{telly:6, spirits:-3}, res:'A cathedral of a station, Gothic towers and gargoyles, and a tide of a million commuters. You are carried thirty yards by the crowd before your feet touch the ground.'},
    {k:'gateway', t:'Walk to the Gateway of India', h:1, fx:{spirits:5, telly:2}, photo:'gateway', res:'The great arch on the waterfront, built for a king and used by everybody. A man tries to sell you a balloon, a map and his sister\'s hand in marriage, in that order.'},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:40, fx:{spirits:25}}
  ]};
BEATS.pune = {title:'The Madras Express', label:'LEG 10 · BOMBAY TO MADRAS', photo:'vt', cap:'Leaving Victoria Terminus',
  text:`Twenty-seven hours and a thousand miles, across the Deccan and down to the Bay of Bengal. You have a berth in a four-person compartment with an army officer, a businessman, and an enormous number of tiffin boxes.

The train climbs the Ghats in the dark and stops at Pune in the middle of the night, where the platform is full of men selling tea.`,
  choices:[
    {t:'Get off at Pune for chai and samosas', h:27, sleep:true, fx:{spirits:10}, go:'madras', res:'"Chai! Chai! Garam chai!" Hot, sweet and milky, served in a clay cup that you are supposed to smash when you\'ve finished. You smash it. It is very satisfying.'},
    {t:'Talk to the army officer all night', h:27, sleep:true, fx:{telly:7, spirits:2}, go:'madras', res:'He knew your schoolmaster\'s brother. Of course he did.'},
    {t:'Sleep the whole way', h:27, sleep:true, fx:{spirits:14}, go:'madras'}
  ]};
BEATS.madras = {hub:true, arrive:'madras', title:'Madras', cap:'Madras harbour',
  text:`Madras: hot, wide and on the very edge of India. In the harbour a rusty Yugoslav freighter is loading for Singapore. She has room for just two passengers, so only you and Nigel will sail with her. The rest of the crew will go ahead, by the means that are forbidden to you, and meet you in Singapore.

Ships like this sail when they're loaded, and not again for days. Do not miss her.`,
  again:`The freighter is nearly loaded. The next one is days away.`,
  acts:[
    {k:'marina', t:'Walk on the Marina beach', h:2, fx:{spirits:6, telly:3}, res:'Miles of sand, fishermen hauling nets, and families paddling in their best clothes.'},
    {k:'crew', t:'Say goodbye to the crew until Singapore', h:.5, talk:true, fx:{spirits:4}, res:'Clem gives you a list of instructions. Roger gives you a bottle of whisky. Nigel checks his film stock for the fifth time.'},
    {k:'sleep', t:'Sleep before the voyage', h:6, sleep:true, cost:30, fx:{spirits:18}}
  ]};
BEATS.bay1 = {title:'The Bay of Bengal', label:'LEG 11 · MADRAS TO SINGAPORE', photo:'boxship', cap:'A working ship',
  text:`The freighter is all rust and diesel and very friendly Yugoslavs. The captain eats with you each evening and talks about Dubrovnik as if it were heaven. For days there's nothing but flat grey sea, flying fish and the sound of the engine.`,
  choices:[
    {t:'Play chess with the captain', h:100, sleep:true, fx:{spirits:8}, go:'bay2', res:'He wins every game, and then lets you win one, so obviously that it is a kindness.'},
    {t:'Help out in the galley', h:100, sleep:true, fx:{spirits:6, telly:4}, go:'bay2'},
    {t:'Write and write', if:g => has('notebook'), h:100, sleep:true, fx:{telly:8, spirits:4}, go:'bay2'}
  ]};
BEATS.bay2 = {adv:0, tz:7, title:'The Strait of Malacca', label:'LEG 11 · TOWARDS SINGAPORE', photo:'singapore', cap:'Shipping lanes, Malacca',
  text:`Into the Strait of Malacca, one of the busiest shipping lanes in the world: tankers, container ships, fishing boats with no lights at all. The captain stays on the bridge all night.

You'll reach Singapore around midnight. Your next ship, the one to Hong Kong, leaves at a quarter to three in the morning.`,
  choices:[{t:'Watch for Singapore\'s lights', h:100.5, sleep:true, fx:{spirits:4}, go:'singapore'}]};

// ── SINGAPORE ───────────────────────────────────────────────────────────────
BEATS.singapore = {hub:true, arrive:'singapore', title:'Singapore', cap:'Singapore at night',
  text:`Midnight. Singapore glitters, damp and hot, and you have two hours and forty-five minutes in it. The crew are waiting on the quay with the news that the Hong Kong ship is anchored out in the roads and is getting steam up, and the launch to take you out is "around somewhere".

Two hours and forty-five minutes. Use them well.`,
  again:`The ship for Hong Kong is getting up steam in the roads.`,
  acts:[
    {k:'sling', t:'A Singapore Sling at Raffles', h:1, cost:15, fx:{spirits:10, telly:3}, res:'In the Long Bar, where it was invented, at one in the morning, with a ceiling fan turning slowly overhead. Somerset Maugham would have approved. Clem would not, but Clem is at the quay.'},
    {k:'phone', t:'Phone London from the dock office', h:.5, cost:8, fx:{spirits:6}, res:'It\'s teatime in London. Everyone wants to know about the dhow.'},
    {k:'eat', t:'Eat at a hawker stall', h:.75, cost:3, fx:{spirits:6}, res:'Satay, noodles and a lime juice, at a plastic table under a strip light. The best meal of the trip so far.'}
  ]};
BEATS.sgchase = {tz:8, title:'Singapore Roads', label:'LEG 12 · CHASING THE SHIP', photo:'singapore', cap:'The outer roads',
  text:`You get to the quay at a quarter to three, and the launch is there. The ship, however, is not where she was. Her anchor is up and her lights are moving.

The launch driver grins, opens the throttle and points at the darkness.`,
  choices:[
    {t:'Catch that ship!', game:{type:'dodge', theme:'launch', title:'Catch That Ship', telly:12, win:'sgaboard', lose:'sgaboard2', winText:'The launch thumps against her side, a rope ladder comes down, and you climb up it with your bag in your teeth. The crew follow, silver boxes and all.', loseText:'You lose her in the dark, and it takes the launch driver another hour, a great deal of shouting on the radio and most of your money to get you aboard.'}},
    {t:'Leave it to the launch driver', fx:{spirits:-4}, go:'sgaboard', res:'He does it with one hand, smoking. You arrive soaked but aboard.'}
  ]};
BEATS.sgaboard = {tz:8, title:'Aboard', label:'LEG 12 · SINGAPORE TO HONG KONG', photo:'boxship', cap:'Bound for Hong Kong',
  text:`You made it. Six days up the South China Sea now, past Vietnam and the Philippines, towards Hong Kong and the half-way mark.`,
  choices:[{t:'Find your cabin and sleep for a week', h:142, sleep:true, fx:{spirits:16}, go:'hongkong'}, {t:'Film life on board', h:142, sleep:true, fx:{spirits:8, telly:6}, go:'hongkong'}]};
BEATS.sgaboard2 = {tz:8, title:'Aboard, Just', label:'LEG 12 · SINGAPORE TO HONG KONG', photo:'boxship', cap:'Bound for Hong Kong', fx:{cash:-60, spirits:-8},
  text:`Aboard, soaked, and sixty pounds lighter after paying the launch driver's "night rate". But aboard. Six days up the South China Sea to Hong Kong.`,
  choices:[{t:'Dry off and sleep', h:142, sleep:true, fx:{spirits:14}, go:'hongkong'}]};

// ── HONG KONG ───────────────────────────────────────────────────────────────
BEATS.hongkong = {hub:true, arrive:'hongkong', title:'Hong Kong', cap:'Victoria Harbour',
  text:g => `Hong Kong, on day ${dayNum(G.t)}: halfway, give or take. The harbour is crammed with junks, ferries, sampans and liners, and the hills behind are crammed with skyscrapers. Everyone is in a hurry, which makes you feel at home.

Fogg was here on day thirty-five. You are ${foggStr(foggDiff('hongkong'))}. The night ferry up the Pearl River to Canton goes every evening.`,
  again:`Hong Kong rushes by. The ferry up the Pearl River leaves in the evening.`,
  acts:[
    {k:'party', t:'Throw a halfway party', h:3, cost:40, fx:{spirits:20, telly:4, meet:'basil'}, res:'Champagne on a junk in the harbour. Some of the crew who\'ve been with you since London are going home, and new faces take over, including Basil Pao, a photographer who seems to know everyone in Asia. Speeches are made. Not all of them are coherent.', log:'Halfway party. Basil Pao joined.'},
    {k:'races', t:'An evening at the races', h:3, game:{type:'race', title:'Happy Valley', telly:8}},
    {k:'ptc', t:'Piece to camera on Victoria Peak', h:2,
      game:{type:'ptc', id:'hk', title:'Piece to Camera: The Peak', telly:10,
        script:['Halfway round the world,', 'forty-two days gone,', 'and the only thing', 'I\'ve lost so far', 'is my sense', 'of what day it is.'],
        interrupts:['A helicopter flies past, which you can\'t take', 'The cloud comes down', 'A tour group asks you to take their photo', 'A tram bell rings, and goes on ringing']}},
    {k:'ferry', t:'Ride the Star Ferry across the harbour', h:1, cost:1, fx:{spirits:6, telly:3}, res:'Seven minutes of the best view in the world, for the price of a sweet.'},
    {k:'tailor', t:'Order a suit, to be ready by tonight', h:1, cost:80, fx:{spirits:6, flag:'suit'}, res:'Measured, chalked, pinned and promised by six o\'clock. It arrives at five to. You will wear it on the steps of the Reform Club.'},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:60, fx:{spirits:25}}
  ]};
BEATS.pearl = {tz:8, title:'Up the Pearl River', label:'LEG 13 · HONG KONG TO CANTON', photo:'pearl', cap:'The Pearl River',
  text:`The night ferry goes up the Pearl River into China. In the morning you'll be in Canton, and in a different world.`,
  choices:[{t:'Sleep in a bunk', h:10, sleep:true, fx:{spirits:10}, go:'canton'}, {t:'Stay up and watch China arrive', h:10, fx:{telly:5}, go:'canton'}]};
BEATS.canton = {hub:true, arrive:'canton', title:'Canton', cap:'The Pearl River at Canton',
  text:`Canton, which they now call Guangzhou: a million bicycles, and every one of them has a bell. The train to Shanghai leaves at half past eight this evening. Thirty-five hours, with thirteen stops.

The Cantonese, everyone says, will eat anything with four legs except a table. Someone has booked you a table at a restaurant that proves it.`,
  again:`Bicycles, bells and the smell of cooking. The 20:30 to Shanghai waits for no one.`,
  acts:[
    {k:'snake', t:'Eat at the snake restaurant', h:2, cost:10, fx:{telly:10, spirits:-6}, res:'The snake is chosen, live, from a cage. Its gall bladder is popped into a glass of rice wine, which you are then invited to drink. You drink it. The crew film your face. It will be on every trailer for the series.'},
    {k:'market', t:'Walk round the Qingping market', h:1.5, fx:{telly:6, spirits:-2}, res:'Herbs, roots, dried lizards, live turtles, and things in jars that you\'d rather not identify. A good place to lose your appetite.'},
    {k:'bikes', t:'Join the rush hour by bicycle', h:1, fx:{spirits:6, telly:4}, res:'Ten thousand cyclists and you, wobbling. Somebody rings their bell at you, then everybody does.'},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:20, fx:{spirits:25}}
  ]};
BEATS.trainchina = {tz:8, title:'The Train to Shanghai', label:'LEG 14 · CANTON TO SHANGHAI', photo:'steam', cap:'Steam, still, in 1988',
  text:`Thirty-five hours, one thousand eight hundred kilometres and thirteen stops. At every one, vendors crowd the platform selling food through the windows. The crew have given you a shopping list, and you have the time the train stands in the station, and not a second more.`,
  choices:[
    {t:'Do the crew\'s shopping, stop by stop', h:35, sleep:true, game:{type:'platform', title:'Thirteen Stops', telly:10, fxWin:{spirits:8}, winText:'The crew eat like kings. Basil declares you "the Passepartout of the platforms".', loseText:'The crew eat sunflower seeds for two days. Nobody complains, out loud.'}, go:'shanghai'},
    {t:'Sleep in your berth and let them fend for themselves', h:35, sleep:true, fx:{spirits:14}, go:'shanghai'}
  ]};
BEATS.shanghai = {hub:true, arrive:'shanghai', title:'Shanghai', cap:'The Bund, Shanghai',
  text:`Shanghai: the Bund, a mile of grand old banks and hotels along the river, built by foreigners who thought they would be here forever. Every morning the waterfront fills with people doing tai chi.

The ferry to Japan sails once or twice a week. This one leaves the day after tomorrow.`,
  again:`Shanghai bustles. The Japan ferry is loading.`,
  acts:[
    {k:'jazz', t:'Sit in with the old jazz band at the Peace Hotel', h:2, sub:'Basil knows the trumpeter',
      game:{type:'rhythm', lanes:3, song:'jazz', title:'The Peace Hotel Jazz Band', telly:12, fxWin:{souv:'cassette', spirits:8}, fxLose:{spirits:2},
        winText:'The band, average age about seventy, have been playing the same songs since before the revolution. They give you a cassette and tell you to come back any time.', loseText:'You play "Sweet Georgia Brown", or something next to it. The band are very kind.'}},
    {k:'herbal', t:'See a herbal doctor', h:1.5, cost:10, fx:{spirits:12, flag:'remedy'}, res:'He takes your pulse in six places, looks at your tongue and gives you a bag of bark, twigs and something that crackles. Boil it and drink it. It tastes like a pond, and you feel wonderful.'},
    {k:'taichi', t:'Join the tai chi on the Bund at dawn', h:1, fx:{spirits:8, telly:5}, res:'An old lady corrects your posture with a jab in the kidneys, firmly. Hundreds of people are moving slowly in silence, and the river slides past.'},
    {k:'ptc', t:'Piece to camera on the Bund', h:1.5,
      game:{type:'ptc', id:'bund', title:'Piece to Camera: The Bund', telly:10,
        script:['Shanghai,', 'where the buses are full,', 'the bicycles are fuller,', 'and I am', 'on the wrong side', 'of the road.'],
        interrupts:['Two hundred cyclists ring their bells', 'A ship\'s horn blasts from the river', 'A crowd gathers to stare at Nigel', 'Someone offers you a tea egg']}},
    {k:'sleep', t:'Sleep', h:8, sleep:true, cost:40, fx:{spirits:25}}
  ]};
BEATS.tojapan = {tz:8, title:'The East China Sea', label:'LEG 15 · SHANGHAI TO KOBE', photo:'boxship', cap:'Across the East China Sea',
  text:`Two days across the East China Sea on a ferry full of Japanese students and Chinese businessmen, and into the Inland Sea, which is so full of islands it hardly looks like sea at all.`,
  choices:[{t:'Practise your Japanese', h:46, sleep:true, fx:{spirits:6, telly:3}, go:'shinkansen'}, {t:'Catch up on sleep', h:46, sleep:true, fx:{spirits:14}, go:'shinkansen'}]};
BEATS.shinkansen = {tz:9, title:'The Bullet Train', label:'LEG 15 · KOBE TO TOKYO', photo:'shinkansen', cap:'Shinkansen', fx:{stamp:'jp'},
  text:`At Kobe you step off the ferry and onto the bullet train, which leaves at the exact second printed on the ticket and does a hundred and thirty miles an hour so smoothly you could balance a coin on the table. Mount Fuji goes past the window, wearing a hat of cloud.

After the dhow, it is like going from a horse to a rocket.`,
  choices:[
    {t:'Time the train between stations', h:6, fx:{telly:5}, go:'tokyo', res:'To the second. Every time. You are almost disappointed.'},
    {t:'Fall asleep, like everyone else', h:6, sleep:true, fx:{spirits:6}, go:'tokyo'}
  ]};

// ── JAPAN ───────────────────────────────────────────────────────────────────
BEATS.tokyo = {hub:true, arrive:'tokyo', title:'Tokyo', cap:'The bullet train',
  text:g => `Tokyo: neon, order, and more people than you thought could fit in one place without anyone shouting. Fogg reached Yokohama on day forty-three; you are ${foggStr(foggDiff('tokyo'))}. But the Pacific is where Fogg's time, and yours, gets eaten.

The container ship for Long Beach, California, sails from the docks in two days. Ships like her cross every week or so. If you miss this one, you won't need to bother with the rest of the series.`,
  again:`The container ship is loading at the docks. Every crane in Tokyo seems to be working on it.`,
  acts:[
    {k:'sushi', t:'Eat at a sushi bar', h:1.5, cost:40, fx:{spirits:10, telly:4}, res:'The chef slices, presses and places, one piece at a time, and watches you eat each one. You don\'t dare not finish.'},
    {k:'karaoke', t:'Sing at a karaoke bar', h:2, game:{type:'rhythm', lanes:1, song:'karaoke', title:'Karaoke', telly:12, fxWin:{spirits:10}, fxLose:{spirits:4},
      winText:'The salarymen rise to their feet. One of them gives you his business card, with both hands and a deep bow.', loseText:'Polite applause, the most crushing sound in Japan.'}},
    {k:'capsule', t:'Spend the night in a capsule hotel', h:7, sleep:true, cost:30, fx:{spirits:18, telly:8}, res:'A plastic tube with a mattress, a light and a small television. Like sleeping in a filing cabinet. You sleep better than you have since Venice.'},
    {k:'plastic', t:'Buy plastic food from a restaurant display', h:.5, cost:15, fx:{souv:'sushi'}, res:'The plastic sushi looks so real that a waiter tries to take it away from you.'},

// ── Dodge & go: the rubbish barge, the launch, Union Station, the last taxi ─
const DODGE = {
  barge:{help:'Steer with <b>← →</b> (or drag). Scoop up rubbish bags, and don\'t hit the gondolas.', bg:'#1d6170', bank:'#8a5a3a', mode:'collect', dur:30, target:12, speed:120,
    obs:[{w:16, h:70, c:'#111', p:.65, v:0, n:'gondola'}, {w:54, h:80, c:'#e8e4d8', p:.35, v:-30, n:'vaporetto'}], col:{r:11, c:'#2e5a2a'}, rate:1.1, crate:.9},
  launch:{help:'Steer with <b>← →</b> (or drag). Dodge the sampans and the buoys, and catch the ship before she clears the roads.', bg:'#0b1a2e', bank:null, mode:'dist', dur:40, dist:2600, speed:110,
    obs:[{w:26, h:46, c:'#6a4a2a', p:.5, v:10, n:'sampan'}, {w:16, h:16, c:'#d0352f', p:.35, v:0, n:'buoy', round:true}, {w:120, h:60, c:'#4a5466', p:.15, v:40, n:'tanker'}], col:null, rate:1.4},
  dash:{help:'Weave through the commuters with <b>← →</b> (or drag). Platform 4, and the doors are closing.', bg:'#cbbf9f', bank:'#8f7f5f', mode:'dist', dur:22, dist:1900, speed:115,
    obs:[{w:24, h:24, c:'#33415c', p:.55, v:20, n:'commuter', round:true}, {w:44, h:30, c:'#7a6a5a', p:.25, v:0, n:'trolley'}, {w:60, h:26, c:'#5a3a2a', p:.2, v:30, n:'family'}], col:null, rate:1.9},
  taxi:{help:'Steer the cab with <b>← →</b> (or drag). Miss the buses, catch the green lights. Pall Mall is three miles.', bg:'#3b3f46', bank:'#22262c', mode:'dist', dur:45, dist:3200, speed:120,
    obs:[{w:44, h:96, c:'#c8322f', p:.4, v:30, n:'bus'}, {w:30, h:50, c:'#111', p:.4, v:50, n:'cab'}, {w:14, h:26, c:'#e0b030', p:.2, v:70, n:'cyclist'}], col:{r:10, c:'#3ad06a', boost:true}, rate:1.3, crate:.5}
};
GAMES.dodge = (cfg, wrap, done) => {
  const T = DODGE[cfg.theme];
  const ui = gameShell(wrap, cfg.title, '', T.help);
  const W = 520, H = 480, {c, x} = mkCanvas(ui.body, W, H);
  const L = T.bank ? 60 : 10, R = W - (T.bank ? 60 : 10);
  let px = W / 2, tx = null, t = 0, prog = 0, slow = 0, boost = 0, hits = 0, got = 0, over = false, spawn = .5, cspawn = 1, scroll = 0;
  const obs = [], cols = [], fx = [];
  c.addEventListener('pointerdown', e => { tx = canvasPos(c, e)[0]; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') tx = canvasPos(c, e)[0]; });
  c.addEventListener('pointerup', () => { tx = null; });
  const PW = cfg.theme === 'taxi' ? 30 : cfg.theme === 'dash' ? 22 : 34, PH = cfg.theme === 'barge' ? 70 : cfg.theme === 'dash' ? 22 : 54, PY = H - 90;
  function finish(win){
    if (over) return; over = true;
    let score, msg, fxr = null;
    if (T.mode === 'collect'){ score = clamp((got - hits * 1.5) / T.target, 0, 1); win = score >= .55; msg = `You scooped up ${got} bag${got === 1 ? '' : 's'} and hit ${hits} boat${hits === 1 ? '' : 's'}.`; }
    else if (cfg.theme === 'taxi'){
      const frac = win ? t / T.dur : 1;
      const h = Math.round((.45 + frac * .9 + (win ? 0 : .5)) * 4) / 4;
      fxr = {h}; score = win ? clamp(1.2 - frac, 0, 1) : .2;
      msg = win ? `Through the traffic in ${Math.round(h * 60)} minutes, door to door.` : `Gridlock. It takes ${Math.round(h * 60)} minutes, and you walk the last bit.`;
    } else { score = win ? clamp(1 - hits * .12, .4, 1) : .2; msg = win ? (hits ? `Bumped ${hits} time${hits === 1 ? '' : 's'}, but you made it.` : 'Not a scratch.') : 'Not quite.'; }
    setTimeout(() => done({win, score, msg, fx:fxr}), 700);
  }
  function drawPlayer(){
    x.save(); x.translate(px, PY);
    if (cfg.theme === 'barge'){ x.fillStyle = '#3a3a2a'; x.fillRect(-PW / 2, -PH / 2, PW, PH); x.fillStyle = '#6a7a3a'; x.fillRect(-PW / 2 + 4, -PH / 2 + 6, PW - 8, PH - 20); x.fillStyle = '#ffc94a'; x.fillRect(-4, PH / 2 - 12, 8, 8); }
    else if (cfg.theme === 'launch'){ x.fillStyle = '#e8e4d8'; x.beginPath(); x.moveTo(0, -PH / 2); x.lineTo(PW / 2, -PH / 4); x.lineTo(PW / 2, PH / 2); x.lineTo(-PW / 2, PH / 2); x.lineTo(-PW / 2, -PH / 4); x.fill(); x.fillStyle = '#1f4f86'; x.fillRect(-8, -4, 16, 14);
      x.fillStyle = 'rgba(255,255,255,.3)'; x.fillRect(-PW / 2 - 4, PH / 2, PW + 8, 10 + Math.random() * 8); }
    else if (cfg.theme === 'taxi'){ x.fillStyle = '#111'; x.fillRect(-PW / 2, -PH / 2, PW, PH); x.fillStyle = '#ffc94a'; x.fillRect(-6, -PH / 2 + 4, 12, 6); x.fillStyle = '#9fbde0'; x.fillRect(-PW / 2 + 3, -PH / 2 + 12, PW - 6, 10); }
    else { x.fillStyle = '#d0352f'; x.beginPath(); x.arc(0, 0, PW / 2, 0, 7); x.fill(); x.fillStyle = '#fff'; x.font = '12px sans-serif'; x.textAlign = 'center'; x.fillText('MP', 0, 4); }
    if (slow > 0){ x.strokeStyle = '#ff6b5e'; x.lineWidth = 3; x.strokeRect(-PW / 2 - 4, -PH / 2 - 4, PW + 8, PH + 8); }
    x.restore();
  }
  const stop = ticker(dt => {
    if (over) return;
    t += dt;
    const sp = (UI.keys.left ? -1 : 0) + (UI.keys.right ? 1 : 0);
    if (sp) { px += sp * 300 * dt; tx = null; } else if (tx !== null) px += clamp(tx - px, -320 * dt, 320 * dt);
    px = clamp(px, L + PW / 2, R - PW / 2);
    slow = Math.max(0, slow - dt); boost = Math.max(0, boost - dt);
    const v = T.speed * (1 + t / T.dur * .6) * (slow > 0 ? .45 : 1) * (boost > 0 ? 1.6 : 1);
    prog += v * dt; scroll = (scroll + v * dt) % 80;
    spawn -= dt; if (spawn <= 0){ spawn = (1 / T.rate) * rnd(.6, 1.3) * (1 - t / T.dur * .3);
      let r = Math.random(), o = T.obs[0]; for (const ob of T.obs){ if (r < ob.p){ o = ob; break; } r -= ob.p; }
      obs.push({x:rnd(L + o.w / 2, R - o.w / 2), y:-o.h, o, dx:rnd(-1, 1) * (o.n === 'commuter' || o.n === 'cyclist' ? 30 : 8)}); }
    if (T.col){ cspawn -= dt; if (cspawn <= 0){ cspawn = (1 / (T.crate || 1)) * rnd(.6, 1.4); cols.push({x:rnd(L + 20, R - 20), y:-20}); } }
    obs.forEach(b => { b.y += (v - b.o.v) * dt; b.x = clamp(b.x + b.dx * dt, L + b.o.w / 2, R - b.o.w / 2);
      if (!b.hit && Math.abs(b.x - px) < (b.o.w + PW) / 2 - 3 && Math.abs(b.y - PY) < (b.o.h + PH) / 2 - 3){ b.hit = true; hits++; slow = .9; SND.fx('hit'); fx.push({x:px, y:PY - 30, t:.8, s:'Bump!'}); } });
    cols.forEach(k => { k.y += v * dt; if (!k.got && Math.abs(k.x - px) < PW / 2 + T.col.r && Math.abs(k.y - PY) < PH / 2 + T.col.r){ k.got = true; got++; if (T.col.boost){ boost = 1.2; fx.push({x:px, y:PY - 30, t:.8, s:'Green!'}); } else fx.push({x:px, y:PY - 30, t:.8, s:'+1'}); SND.fx('coin'); } });
    for (let i = obs.length - 1; i >= 0; i--) if (obs[i].y > H + 120) obs.splice(i, 1);
    for (let i = cols.length - 1; i >= 0; i--) if (cols[i].y > H + 30 || cols[i].got) cols.splice(i, 1);
    // draw
    x.fillStyle = T.bg; x.fillRect(0, 0, W, H);
    if (cfg.theme === 'launch'){ x.fillStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i < 40; i++){ const sy = (i * 53 + scroll * 1.5) % H; x.fillRect((i * 97) % W, sy, 2, 2); } }
    else if (cfg.theme === 'barge'){ x.strokeStyle = 'rgba(255,255,255,.12)'; for (let i = 0; i < 8; i++){ const sy = (i * 60 + scroll) % H; x.beginPath(); x.moveTo(L + 20, sy); x.quadraticCurveTo(W / 2, sy + 10, R - 20, sy); x.stroke(); } }
    else if (cfg.theme === 'taxi'){ x.fillStyle = '#d8d8d8'; for (let l = 1; l < 4; l++) for (let i = -1; i < 7; i++) x.fillRect(L + (R - L) * l / 4 - 2, i * 80 + scroll, 4, 40); }
    else { x.strokeStyle = 'rgba(0,0,0,.08)'; for (let i = -1; i < 7; i++){ x.beginPath(); x.moveTo(L, i * 80 + scroll); x.lineTo(R, i * 80 + scroll); x.stroke(); } }
    if (T.bank){ x.fillStyle = T.bank; x.fillRect(0, 0, L, H); x.fillRect(R, 0, W - R, H);
      x.fillStyle = 'rgba(0,0,0,.2)'; for (let i = -1; i < 7; i++){ x.fillRect(0, i * 80 + scroll, L, 4); x.fillRect(R, i * 80 + scroll + 40, W - R, 4); } }
    if (T.mode === 'dist'){
      const left = T.dist - prog;
      if (left < H + 100){ const gy = PY - left - 40;
        x.fillStyle = cfg.theme === 'launch' ? '#2a3240' : cfg.theme === 'taxi' ? '#c9c0a8' : '#5a5a5a';
        if (cfg.theme === 'launch'){ x.fillRect(L + 60, gy - 120, R - L - 120, 140); x.fillStyle = '#ffc94a'; for (let i = 0; i < 8; i++) x.fillRect(L + 80 + i * 36, gy - 100, 6, 6); }
        else { x.fillRect(L, gy - 30, R - L, 40); x.fillStyle = '#122339'; x.font = '20px Bebas Neue, sans-serif'; x.textAlign = 'center'; x.fillText(cfg.theme === 'taxi' ? 'THE REFORM CLUB' : 'PLATFORM 4 · LAKE SHORE LIMITED', W / 2, gy - 2); } }
    }
    cols.forEach(k => { x.fillStyle = T.col.c; x.beginPath(); x.arc(k.x, k.y, T.col.r, 0, 7); x.fill(); if (!T.col.boost){ x.fillStyle = '#1a3a1a'; x.fillRect(k.x - 3, k.y - T.col.r - 3, 6, 5); } });
    obs.forEach(b => { x.fillStyle = b.o.c; if (b.o.round){ x.beginPath(); x.arc(b.x, b.y, b.o.w / 2, 0, 7); x.fill(); }
      else { x.fillRect(b.x - b.o.w / 2, b.y - b.o.h / 2, b.o.w, b.o.h); if (b.o.n === 'gondola'){ x.fillStyle = '#c9a227'; x.fillRect(b.x - 3, b.y - b.o.h / 2, 6, 5); } if (b.o.n === 'bus'){ x.fillStyle = '#ffd9a0'; for (let i = 0; i < 4; i++) x.fillRect(b.x - b.o.w / 2 + 4, b.y - b.o.h / 2 + 8 + i * 20, b.o.w - 8, 8); } if (b.o.n === 'tanker'){ x.fillStyle = '#fff'; x.fillRect(b.x + b.o.w / 2 - 20, b.y - 20, 12, 30); } } });
    drawPlayer();
    for (let i = fx.length - 1; i >= 0; i--){ const f = fx[i]; f.t -= dt; f.y -= 30 * dt; if (f.t <= 0){ fx.splice(i, 1); continue; } x.fillStyle = `rgba(255,201,74,${f.t})`; x.font = '22px Bebas Neue, sans-serif'; x.textAlign = 'center'; x.fillText(f.s, f.x, f.y); }
    const rem = Math.max(0, T.dur - t);
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, W, 34); x.fillStyle = '#fff'; x.font = '18px Bebas Neue, sans-serif'; x.textAlign = 'left';
    x.fillText(T.mode === 'collect' ? `BAGS ${got}/${T.target}   BUMPS ${hits}` : `DISTANCE ${Math.min(100, Math.round(prog / T.dist * 100))}%   BUMPS ${hits}`, 10, 23);
    x.textAlign = 'right'; x.fillStyle = rem < 6 ? '#ff6b5e' : '#ffc94a'; x.fillText(`${rem.toFixed(1)}s`, W - 10, 23);
    if (T.mode === 'dist'){ x.fillStyle = '#22334d'; x.fillRect(10, 38, W - 20, 5); x.fillStyle = '#8fe3b7'; x.fillRect(10, 38, (W - 20) * Math.min(1, prog / T.dist), 5); }
    if (T.mode === 'dist' && prog >= T.dist) finish(true);
    else if (t >= T.dur) finish(T.mode === 'collect');
  });
  return {stop, held:true};
};

// ── Piece to camera ─────────────────────────────────────────────────────────
GAMES.ptc = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Say it in the right order: click the phrases one after another. A wrong one means "Cut!", and you start again from the top.');
  const LIMIT = 32;
  let t = 0, took = 1, pos = 0, over = false, block = 0, nextInt = rnd(4, 6), intText = '';
  const order = cfg.script.map((s, i) => i);
  let deck = shuffle(order.slice());
  ui.body.innerHTML = `<div class="ptcbox"><div class="rec">● REC · TAKE <span id="ptake">1</span></div><div class="said" id="psaid"><span style="color:#6b84a3">[Nigel points at you. You're on.]</span></div>
    <div class="chunks" id="pch"></div><div class="tbar"><i id="pbar" style="width:100%"></i></div><div class="interrupt hidden" id="pint"></div></div>`;
  const draw = () => { $('#pch').innerHTML = deck.map(i => `<button class="chunk ${i < pos ? 'used' : ''}" data-i="${i}">${esc(cfg.script[i])}</button>`).join('');
    $('#pch').querySelectorAll('[data-i]').forEach(b => b.onclick = () => press(+b.dataset.i)); };
  function press(i){
    if (over || block > 0) return;
    if (i === pos){ pos++; SND.fx('click'); $('#psaid').innerHTML = cfg.script.slice(0, pos).map(esc).join(' '); draw();
      if (pos === cfg.script.length){ over = true; ui.msg.textContent = '"…and cut. Lovely."';
        const score = clamp(1 - (took - 1) * .18 - (t / LIMIT) * .2, .3, 1); setTimeout(() => done({win:true, score, msg:`Got it in ${took} take${took === 1 ? '' : 's'}.`}), 900); } }
    else { took++; pos = 0; SND.fx('bad'); $('#ptake').textContent = took; $('#psaid').innerHTML = '<span style="color:#ff6b5e">"Cut! Sorry, sorry. From the top."</span>'; deck = shuffle(order.slice()); draw(); }
  }
  draw();
  const stop = ticker(dt => {
    if (over) return;
    t += dt; $('#pbar').style.width = Math.max(0, 100 - t / LIMIT * 100) + '%';
    if (block > 0){ block -= dt; if (block <= 0) $('#pint').classList.add('hidden'); }
    nextInt -= dt; if (nextInt <= 0 && block <= 0){ nextInt = rnd(5, 8); block = 1.6; intText = pick(cfg.interrupts); $('#pint').textContent = intText + '!'; $('#pint').classList.remove('hidden'); if (pos > 0){ took++; pos = 0; $('#ptake').textContent = took; $('#psaid').innerHTML = '<span style="color:#ffc94a">"Hold it… hold it… and again."</span>'; deck = shuffle(order.slice()); draw(); } }
    if (t >= LIMIT){ over = true; ui.msg.textContent = 'The light has gone.'; setTimeout(() => done({win:false, score:.2, msg:'The light goes before you get to the end. Clem says you can do it as a voice-over.'}), 900); }
  });
  return {stop, key:e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= deck.length){ press(deck[n - 1]); } }};
};

// ── Haggling ────────────────────────────────────────────────────────────────
GAMES.haggle = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Make offers. Too low and he takes offence; walk away at the right moment and he may call you back.');
  const open = cfg.open, min = Math.round(open * rnd(.2, .3)); let ask = open, pat = has('phrasebook') ? 5 : 4, over = false, lastOffer = 0;
  const lines = [];
  const say = s => { lines.push(s); if (lines.length > 6) lines.shift(); };
  say(`<b>The stallholder:</b> "My friend! For you, special price. ${cfg.item}, hand-painted, very old. £${open}."`);
  function deal(p){ over = true; say(`<b>The stallholder:</b> "Done! You are a hard man. My children will go hungry." <i>(They will not.)</i>`); draw();
    SND.fx('coin'); const score = clamp((open - p) / (open - min), 0, 1);
    setTimeout(() => done({win:true, score, msg:`You paid £${p} for the ${cfg.item.toLowerCase()}. ${score > .8 ? 'The stallholder looks genuinely impressed.' : score > .5 ? 'A respectable price.' : 'You were robbed, very charmingly.'}`, fx:{cash:-p, souv:cfg.souv}}), 1200); }
  function offer(o){
    if (over) return; lastOffer = o;
    if (o >= ask){ deal(ask); return; }
    if (o < min * .6){ pat -= 2; say(`<b>You:</b> "£${o}?"<br><b>The stallholder:</b> "${pick(['You insult me! You insult my father!', 'For this I could not buy the paper!', 'Ha! Ha! No.'])}"`); }
    else { pat--; const na = Math.max(min, Math.round(ask - (ask - o) * rnd(.35, .55)));
      if (na <= o){ deal(o); return; } ask = na; say(`<b>You:</b> "£${o}."<br><b>The stallholder:</b> "${pick(['For you, my friend… £', 'Impossible. But because I like you, £', 'You are killing me. £', 'Last price: £'])}${ask}."`); }
    if (pat <= 0){ over = true; say('<b>The stallholder</b> waves you away and turns to a German couple.'); draw(); setTimeout(() => done({win:false, score:.1, msg:'No deal. The German couple buy it.'}), 1200); return; }
    draw();
  }
  function walk(){ if (over) return;
    if (ask <= min * 1.35 || (ask <= min * 1.7 && Math.random() < .5)){ const p = Math.max(min, Math.round(ask * .85)); say(`You turn to go. <b>The stallholder:</b> "Wait! Wait. £${p}. Final."`); ask = p; pat = 1; draw(); }
    else { over = true; say('You walk away. Nobody calls you back.'); draw(); setTimeout(() => done({win:false, score:.1, msg:'You leave empty-handed, but proud.'}), 1100); } }
  function draw(){
    const opts = [.3, .5, .7].map(f => Math.max(1, Math.round(ask * f / (ask > 20 ? 5 : 1)) * (ask > 20 ? 5 : 1))).filter((v, i, a) => a.indexOf(v) === i && v < ask && v > lastOffer * .9);
    ui.body.innerHTML = `<div class="result" style="font-size:1rem;line-height:1.5">${lines.join('<br>')}</div>
      <p class="center" style="font-family:'Bebas Neue';font-size:1.6rem;margin:6px 0;color:var(--navy)">Asking: £${ask} ${has('phrasebook') && ask <= min * 1.3 ? '<small style="font:12px Special Elite;color:var(--good)">(your phrasebook says: he\'s close)</small>' : ''}</p>
      <div class="gbtns">${over ? '' : opts.map(o => `<button class="gbtn" data-o="${o}">Offer £${o}</button>`).join('') + `<button class="gbtn on" data-acc>Pay £${ask}</button><button class="gbtn" data-walk>Walk away</button>`}</div>
      <p class="meta center">His patience: ${'●'.repeat(Math.max(0, pat))}${'○'.repeat(Math.max(0, (has('phrasebook') ? 5 : 4) - pat))}</p>`;
    ui.body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => offer(+b.dataset.o));
    const a = ui.body.querySelector('[data-acc]'); if (a) a.onclick = () => deal(ask);
    const w = ui.body.querySelector('[data-walk]'); if (w) w.onclick = walk;
  }
  draw();
  return {};
};

// ── Seasickness ─────────────────────────────────────────────────────────────
GAMES.seasick = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Keep the horizon level: lean against the roll with <b>← →</b>, or hold the mouse or a finger on the side to lean that way. Survive 25 seconds.');
  const W = 600, H = 360, {c, x} = mkCanvas(ui.body, W, H);
  const amp = cfg.hard ? 1.35 : 1, k = (has('patches') ? .55 : 1) * (cfg.hard ? 1.15 : 1);
  let t = 0, lean = 0, q = 0, over = false, gust = 0, gv = 0, ptr = 0;
  c.addEventListener('pointerdown', e => { ptr = canvasPos(c, e)[0] < W / 2 ? -1 : 1; });
  c.addEventListener('pointerup', () => { ptr = 0; }); c.addEventListener('pointerleave', () => { ptr = 0; });
  const stop = ticker(dt => {
    if (over) return; t += dt;
    gv += rnd(-1, 1) * dt * 1.4; gv *= .97; gust = clamp(gust + gv * dt, -.25, .25);
    const roll = amp * (.3 * Math.sin(t * 1.15) + .17 * Math.sin(t * 2.4 + 1) + gust);
    const inp = (UI.keys.left ? -1 : 0) + (UI.keys.right ? 1 : 0) || ptr;
    lean = clamp(lean + inp * 1.25 * dt, -.7, .7);
