    x.fillStyle = '#9ec7ef'; x.fillRect(0, 0, W, H);
    x.save(); x.translate(W / 2, H / 2 + 20); x.rotate(eff);
    x.fillStyle = '#1f4f86'; x.fillRect(-W, 0, W * 2, H * 2);
    x.strokeStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 9; i++){ x.beginPath(); const yy = 12 + i * 22; x.moveTo(-W, yy); for (let xx = -W; xx < W; xx += 30) x.lineTo(xx, yy + Math.sin(xx * .05 + t * 3 + i) * 3); x.stroke(); }
    x.restore();
    x.fillStyle = '#6a4a2a'; x.fillRect(0, H - 60, W, 60); x.fillStyle = '#8a6a3a'; x.fillRect(0, H - 66, W, 10);
    for (let i = 0; i < 8; i++) x.fillRect(30 + i * 78, H - 110, 8, 50);
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, W, 34); x.fillStyle = '#fff'; x.font = '18px Bebas Neue, sans-serif'; x.textAlign = 'left';
    x.fillText('QUEASY', 10, 23); x.fillStyle = '#22334d'; x.fillRect(80, 12, 200, 12); x.fillStyle = q > 70 ? '#ff6b5e' : q > 40 ? '#ffc94a' : '#8fe3b7'; x.fillRect(80, 12, q * 2, 12);
    x.textAlign = 'right'; x.fillStyle = '#ffc94a'; x.fillText(`${Math.max(0, 25 - t).toFixed(1)}s`, W - 10, 23);
    x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '16px Special Elite, monospace'; x.fillText(Math.abs(eff) < .08 ? 'steady…' : eff > 0 ? 'lean right →' : '← lean left', W / 2, H - 22);
    if (q >= 100){ over = true; setTimeout(() => done({win:false, score:.15, msg:'Over the side it goes.'}), 500); }
    else if (t >= 25){ over = true; done({win:true, score:clamp(1 - q / 100, .3, 1), msg:'You kept it down.'}); }
  });
  return {stop, held:true};
};

// ── Gujarati memory ─────────────────────────────────────────────────────────
GAMES.memory = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Turn over two cards at a time and match each Gujarati word to its meaning.');
  const P = [['Kem cho?', 'How are you?'], ['Majama', 'I\'m fine'], ['Aavjo', 'Goodbye'], ['Aabhar', 'Thank you'], ['Haa', 'Yes'], ['Naa', 'No'], ['Paani', 'Water'], ['Chaa', 'Tea']];
  const cards = shuffle(P.flatMap(([g, e], i) => [{i, s:g, gu:true}, {i, s:e}]));
  let up = [], moves = 0, matched = 0, lock = false, over = false, peek = has('phrasebook');
  function draw(){
    ui.hud.textContent = `Moves: ${moves}`;
    ui.body.innerHTML = `<div class="cards">${cards.map((k, j) => `<button class="card ${k.done ? 'done' : (up.indexOf(j) >= 0 || peek) ? 'up' : ''} ${k.gu ? 'gu' : ''}" data-j="${j}">${esc(k.s)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-j]').forEach(b => b.onclick = () => flip(+b.dataset.j));
  }
  function flip(j){
    if (lock || over || peek || cards[j].done || up.indexOf(j) >= 0) return;
    up.push(j); SND.fx('click'); draw();
    if (up.length === 2){ moves++; lock = true; const [a, b] = up;
      if (cards[a].i === cards[b].i){ cards[a].done = cards[b].done = true; matched++; SND.fx('coin'); up = []; lock = false; draw();
        if (matched === P.length){ over = true; const score = clamp(1 - (moves - 8) / 16, .25, 1); setTimeout(() => done({win:score >= .45, score, msg:`All eight pairs in ${moves} moves.`}), 700); } }
      else setTimeout(() => { up = []; lock = false; draw(); }, 850); }
  }
  draw();
  if (peek){ ui.msg.textContent = 'Your phrasebook gives you a peek…'; setTimeout(() => { peek = false; ui.msg.textContent = ''; draw(); }, 2200); }
  return {};
};

// ── A close shave ───────────────────────────────────────────────────────────
GAMES.shave = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Keep perfectly still: keep the dot inside the barber\'s circle as it wanders (mouse, finger or arrow keys). Every stroke of the razor outside it is a nick.');
  const W = 600, H = 360, {c, x} = mkCanvas(ui.body, W, H);
  let t = 0, cx = W / 2, cy = H / 2, px = W / 2, py = H / 2, strokes = 0, nicks = 0, next = 2.4, over = false, flash = 0, flashOk = true, ph = rnd(0, 6);
  const R = 42, N = 10;
  c.addEventListener('pointermove', e => { const p = canvasPos(c, e); px = p[0]; py = p[1]; });
  c.addEventListener('pointerdown', e => { const p = canvasPos(c, e); px = p[0]; py = p[1]; });
  const stop = ticker(dt => {
    if (over) return; t += dt;
    const sp = 1 + strokes * .12;
    cx = W / 2 + Math.sin(t * .9 * sp + ph) * 150 + Math.sin(t * 2.1 * sp) * 40;
    cy = H / 2 + Math.cos(t * .7 * sp + ph) * 80 + Math.sin(t * 1.7 * sp + 2) * 25;
    const kx = (UI.keys.left ? -1 : 0) + (UI.keys.right ? 1 : 0), ky = (UI.keys.up ? -1 : 0) + (UI.keys.down ? 1 : 0);
    px = clamp(px + kx * 240 * dt, 0, W); py = clamp(py + ky * 240 * dt, 0, H);
    next -= dt; flash = Math.max(0, flash - dt);
    if (next <= 0){ next = 2.1; strokes++; const ok = Math.hypot(px - cx, py - cy) <= R; flash = .4; flashOk = ok; if (!ok){ nicks++; SND.fx('hit'); } else SND.tone(90, .08, 'sawtooth', .05);
      if (strokes >= N){ over = true; const score = clamp(1 - nicks / 5, 0, 1); setTimeout(() => done({win:nicks <= 1, score, msg:`${nicks} nick${nicks === 1 ? '' : 's'} in ${N} strokes.`}), 600); } }
    x.fillStyle = '#e8c9a8'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#fff'; for (let i = 0; i < 26; i++){ if (i < strokes * 2.6) continue; x.globalAlpha = .85; x.beginPath(); x.arc((i * 97) % W, (i * 61) % H, 40, 0, 7); x.fill(); } x.globalAlpha = 1;
    x.strokeStyle = flash > 0 ? (flashOk ? '#1f8a6e' : '#d0352f') : '#1f4f86'; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.stroke();
    if (flash > 0){ x.strokeStyle = 'rgba(200,210,220,.9)'; x.lineWidth = 6; x.beginPath(); x.moveTo(cx - 60, cy - 30); x.lineTo(cx + 60, cy + 30); x.stroke(); }
    x.fillStyle = '#d0352f'; x.beginPath(); x.arc(px, py, 7, 0, 7); x.fill();
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, W, 34); x.fillStyle = '#fff'; x.font = '18px Bebas Neue, sans-serif'; x.textAlign = 'left';
    x.fillText(`STROKE ${Math.min(N, strokes + 1)}/${N}   NICKS ${nicks}`, 10, 23); x.textAlign = 'right'; x.fillStyle = '#ffc94a'; x.fillText(`next stroke ${next.toFixed(1)}s`, W - 10, 23);
  });
  return {stop, held:true};
};

// ── The snake charmer ───────────────────────────────────────────────────────
GAMES.simon = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Watch the charmer\'s tune, then play it back on the pungi. The tune gets longer each round.');
  const NOTES = [[62, '#d0352f'], [65, '#ffc94a'], [69, '#1f8a6e'], [72, '#4a8fd8']], ROUNDS = 6;
  const seq = []; for (let i = 0; i < ROUNDS + 1; i++) seq.push(ri(0, 3));
  let round = 1, inp = 0, lives = 2, busy = true, over = false, timers = [];
  function draw(lit){
    ui.hud.textContent = `Round ${round}/${ROUNDS} · ${'♥'.repeat(lives)}`;
    const rise = (round - 1) / ROUNDS;
    ui.body.innerHTML = `<div class="center" style="font-size:${2.4 + rise * 3}rem;line-height:1;margin:6px 0;transition:font-size .4s">🐍</div>
      <div class="gbtns">${NOTES.map(([m, col], i) => `<button class="gbtn" data-n="${i}" style="width:90px;height:70px;border-color:${col};background:${lit === i ? col : '#fff'};color:${lit === i ? '#fff' : col};font-size:1.4rem">${'♪♫♩♬'[i]}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-n]').forEach(b => b.onclick = () => press(+b.dataset.n));
  }
  function play(){ busy = true; ui.msg.textContent = 'Listen…'; let d = 600;
    for (let i = 0; i <= round; i++){ const n = seq[i]; timers.push(setTimeout(() => { draw(n); SND.tone(NOTES[n][0], .35, 'sine', .2); }, d)); timers.push(setTimeout(() => draw(), d + 380)); d += 560; }
    timers.push(setTimeout(() => { busy = false; inp = 0; ui.msg.textContent = 'Your turn.'; }, d)); }
  function press(n){
    if (busy || over) return; SND.tone(NOTES[n][0], .3, 'sine', .2); draw(n); setTimeout(() => !over && draw(), 200);
    if (n !== seq[inp]){ lives--; SND.fx('bad');
      if (lives <= 0){ over = true; const score = (round - 1) / ROUNDS; return setTimeout(() => done({win:score >= .6, score, msg:`You got through ${round - 1} of ${ROUNDS} rounds.`}), 600); }
      ui.msg.textContent = 'The cobra hisses. Again…'; return play(); }
    inp++;
    if (inp > round){ round++;
      if (round > ROUNDS){ over = true; return setTimeout(() => done({win:true, score:1, msg:'Every round. The cobra is yours.'}), 600); }
      setTimeout(play, 500); }
  }
  draw(); play();
  return {stop:() => timers.forEach(clearTimeout), key:e => { const n = {'1':0, '2':1, '3':2, '4':3}[e.key]; if (n !== undefined) press(n); }};
};

// ── At the races ────────────────────────────────────────────────────────────
GAMES.race = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Pick a horse and a stake. Then cheer it home: click the track or press <b>Space</b> as fast as you can.');
  const HS = [['Kowloon Comet', 2, 52], ['Lucky Dragon', 3, 51], ['Passepartout', 5, 49.5], ['Slow Boat', 8, 48], ['Fogg Bound', 10, 47.5], ['Typhoon Mary', 12, 47]];
  let pickH = null, stake = 20, stop = () => {}, over = false, racing = false, cheer = 0;
  function choose(){
    ui.body.innerHTML = `<p class="center meta">Floodlights, a crowd of thirty thousand and more money changing hands than in the Bank of England.</p>
      <div class="gbtns">${HS.map(([n, o], i) => `<button class="gbtn ${pickH === i ? 'on' : ''}" data-h="${i}">${esc(n)} <small>${o}/1</small></button>`).join('')}</div>
      <div class="gbtns">${[10, 20, 50].map(s => `<button class="gbtn ${stake === s ? 'on' : ''}" data-s="${s}" ${G.stats.cash < s ? 'disabled' : ''}>£${s}</button>`).join('')}</div>
      <div class="center"><button class="btn" id="go" ${pickH === null || G.stats.cash < stake ? 'disabled style="opacity:.5"' : ''}>They're off!</button></div>`;
    ui.body.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { pickH = +b.dataset.h; choose(); });
    ui.body.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { stake = +b.dataset.s; choose(); });
    $('#go').onclick = () => { if (pickH !== null && G.stats.cash >= stake) run(); };
  }
  function run(){
    racing = true; ui.body.innerHTML = ''; const W = 600, H = 300, {c, x} = mkCanvas(ui.body, W, H);
    c.addEventListener('pointerdown', () => { cheer++; });
    const pos = HS.map(() => 0), FIN = 540; let t = 0, res = null; const vel = HS.map(h => h[2]);
    stop = ticker(dt => {
      if (over) return; t += dt;
      HS.forEach((h, i) => { vel[i] += rnd(-12, 12) * dt; vel[i] = clamp(vel[i], h[2] - 9, h[2] + 9); pos[i] += vel[i] * dt * (i === pickH ? 1 + Math.min(.14, cheer * .006) : 1); });
      cheer = Math.max(0, cheer - dt * 5);
      x.fillStyle = '#2a6a3a'; x.fillRect(0, 0, W, H); x.fillStyle = '#fff'; x.fillRect(FIN + 20, 0, 4, H);
      HS.forEach((h, i) => { const y = 30 + i * 44; x.fillStyle = 'rgba(255,255,255,.1)'; x.fillRect(0, y + 16, W, 1);
        x.font = '26px serif'; x.textAlign = 'left'; x.save(); x.translate(20 + pos[i], y + 10); x.scale(-1, 1); x.fillText('🏇', -30, 0); x.restore();
        x.fillStyle = i === pickH ? '#ffc94a' : '#fff'; x.font = '13px Special Elite, monospace'; x.fillText(h[0], 4, y - 10); });
      if (!res){ const win = pos.findIndex(p => p >= FIN); if (win >= 0){ res = win; over = true;
        const order = pos.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]).map(a => a[1]); const place = order.indexOf(pickH);
        const wonCash = place === 0 ? stake * HS[pickH][1] : -stake;
        setTimeout(() => done({win:place === 0, score:place === 0 ? 1 : place === 1 ? .5 : .2, fx:place === 0 ? {cash:wonCash, souv:'ticket'} : {cash:wonCash},
          msg:place === 0 ? `${HS[pickH][0]} wins by a nose! You collect £${wonCash}.` : `${HS[res][0]} wins. ${HS[pickH][0]} comes ${['first', 'second', 'third', 'fourth', 'fifth', 'last'][place]}. You lose £${stake}.`}), 900); } }
    });
  }
  choose();
  return {stop:() => stop(), key:e => { if (racing && e.key === ' '){ cheer++; e.preventDefault(); } }};
};

// ── Thirteen stops ──────────────────────────────────────────────────────────
GAMES.platform = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'At each stop, buy the thing on the crew\'s list before the train moves off.');
  const IT = ['🍊 oranges', '🥟 dumplings', '🥜 peanuts', '🌻 sunflower seeds', '🍵 tea', '🥚 tea eggs', '🍜 noodles', '🍌 bananas', '🍞 steamed buns', '🍶 rice wine', '📰 a newspaper', '🥢 chopsticks', '🍐 pears', '🍬 sweets'];
  const N = 13; let k = 0, ok = 0, over = false, t = 0, lim = 3.4, want = null, opts = [], state = 'go', stop = () => {};
  function stopAt(){
    if (k >= N){ over = true; const score = ok / N; return done({win:score >= .6, score, msg:`You bought ${ok} of the ${N} things on the list.`}); }
    want = pick(IT); opts = shuffle([want].concat(shuffle(IT.filter(i => i !== want)).slice(0, 3))); t = 0; lim = 3.4 - k * .1; state = 'stop';
    ui.hud.textContent = `Stop ${k + 1}/${N} · bought ${ok}`;
    ui.body.innerHTML = `<div class="result center"><span class="meta">The list says:</span><div style="font-family:'Bebas Neue';font-size:2rem;color:var(--navy)">${esc(want)}</div></div>
      <div class="gbtns">${opts.map((o, i) => `<button class="gbtn" data-o="${i}" style="font-size:1.15rem;min-width:150px">${esc(o)}</button>`).join('')}</div><div class="tbar"><i id="plbar" style="width:100%"></i></div>`;
    ui.body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => buy(+b.dataset.o));
  }
  function buy(i){ if (state !== 'stop') return; state = 'go'; const right = opts[i] === want; if (right){ ok++; SND.fx('coin'); } else SND.fx('bad');
    ui.msg.textContent = right ? 'Got it! Through the window it comes.' : `That's ${opts[i]}. The crew will be thrilled.`; k++; setTimeout(stopAt, 800); }
  stop = ticker(dt => { if (over || state !== 'stop') return; t += dt; const b = $('#plbar'); if (b) b.style.width = Math.max(0, 100 - t / lim * 100) + '%';
    if (t >= lim){ state = 'go'; SND.fx('whistle'); ui.msg.textContent = 'The whistle blows, and the train pulls out.'; k++; setTimeout(stopAt, 800); } });
  stopAt();
  return {stop:() => stop(), key:e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) buy(n - 1); }};
};

// ── Rhythm: the Peace Hotel band, and karaoke ───────────────────────────────
const SONGS = {
  jazz:{tempo:150, voice:'square', make(){ const sc = [60, 62, 63, 65, 67, 69, 70, 72, 74, 75], pat = [1, .5, .5, 1, 1, .5, .5, .5, .5, 1, 2]; const out = []; let p = 4;
    for (let bar = 0; bar < 4; bar++) pat.forEach(d => { p = clamp(p + ri(-2, 2), 0, sc.length - 1); out.push([sc[p], d]); }); return out; }},
  karaoke:{tempo:120, voice:'triangle', lyrics:[
    ['I', 'left', 'Pall', 'Mall', 'one', 'Sun-', 'day', 'morn'],
    ['with', 'a', 'bag', 'and', 'a', 'cam-', 'er-', 'a', 'crew'],
    ['I\'ve', 'been', 'sea-', 'sick', 'from', 'here', 'to', 'Bom-', 'bay'],
    ['and', 'I\'m', 'eigh-', 'ty', 'days', 'from', 'you']],
    mel:[[67, 69, 71, 72, 71, 69, 67, 64], [65, 64, 65, 67, 69, 67, 65, 64, 62], [64, 65, 67, 69, 71, 72, 74, 72, 71], [72, 71, 69, 67, 69, 67, 72]],
    make(){ const out = []; this.lyrics.forEach((ln, li) => ln.forEach((s, i) => out.push([this.mel[li][i], i === ln.length - 1 ? 2 : (i % 3 === 2 ? 1 : .75), li, i]))); return out; }}
};
GAMES.rhythm = (cfg, wrap, done) => {
  const S = SONGS[cfg.song], lanes = cfg.lanes || 3;
  const ui = gameShell(wrap, cfg.title, '', lanes === 1 ? 'Sing each syllable as it reaches the line: <b>Space</b>, or tap the screen.' : 'Hit the notes as they reach the line: <b>A S D</b> or <b>← ↓ →</b>, or tap the lanes.');
  const W = 600, H = 420, {c, x} = mkCanvas(ui.body, W, H), beat = 60 / S.tempo, LW = W / lanes, HIT = 360, SPD = 240;
  const notes = []; let tt = 2;
  S.make().forEach(([m, d, li, si]) => { notes.push({t:tt, m, lane:lanes === 1 ? 0 : (m < 64 ? 0 : m < 70 ? 1 : 2), li, si, hit:null}); tt += d * beat; });
  const END = tt + 1.5; let t = 0, good = 0, okc = 0, miss = 0, over = false, fl = [0, 0, 0];
  function press(l){ if (over) return; fl[l] = .15; let best = null, bd = .26;
    notes.forEach(n => { if (n.hit === null && n.lane === l){ const d = Math.abs(n.t - t); if (d < bd){ bd = d; best = n; } } });
    if (!best) return; best.hit = bd < .12 ? 'good' : 'ok'; best.hit === 'good' ? good++ : okc++; SND.tone(best.m, .25, S.voice, .12); }
  c.addEventListener('pointerdown', e => press(lanes === 1 ? 0 : Math.min(lanes - 1, Math.floor(canvasPos(c, e)[0] / LW))));
  const stop = ticker(dt => {
    if (over) return; t += dt;
    notes.forEach(n => { if (n.hit === null && t - n.t > .26){ n.hit = 'miss'; miss++; } });
    x.fillStyle = '#0b1a2e'; x.fillRect(0, 0, W, H);
    for (let l = 0; l < lanes; l++){ x.fillStyle = fl[l] > 0 ? 'rgba(255,201,74,.18)' : (l % 2 ? '#0e2240' : '#102748'); x.fillRect(l * LW, 0, LW, H); fl[l] = Math.max(0, fl[l] - dt); }
    x.fillStyle = '#ffc94a'; x.fillRect(0, HIT - 2, W, 4);
    x.fillStyle = '#6b84a3'; x.font = '16px Special Elite, monospace'; x.textAlign = 'center';
    if (lanes === 3) ['A ←', 'S ↓', 'D →'].forEach((k, l) => x.fillText(k, l * LW + LW / 2, HIT + 34)); else x.fillText('SPACE / TAP', W / 2, HIT + 34);
    notes.forEach(n => { if (n.hit && n.hit !== 'miss') return; const y = HIT - (n.t - t) * SPD; if (y < -30 || y > H + 20) return;
      const cx = n.lane * LW + LW / 2; x.fillStyle = n.hit === 'miss' ? '#334' : ['#4a8fd8', '#ffc94a', '#d0352f'][n.lane];
      if (lanes === 1){ x.beginPath(); x.ellipse(cx, y, 70, 16, 0, 0, 7); x.fill(); x.fillStyle = '#0b1a2e'; x.font = '18px Lora, serif'; x.fillText(S.lyrics[n.li][n.si], cx, y + 6); }
      else { x.beginPath(); x.ellipse(cx, y, 40, 12, 0, 0, 7); x.fill(); } });
    if (lanes === 1){ const cur = notes.find(n => n.t > t - .3) || notes[notes.length - 1];
      x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, 0, W, 50); x.font = '22px Lora, serif'; x.textAlign = 'center';
      const line = S.lyrics[cur.li];
      x.fillStyle = '#fff'; x.fillText(line.join(' ').replace(/- /g, ''), W / 2, 33); }
    else { x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, 0, W, 34); x.fillStyle = '#fff'; x.font = '18px Bebas Neue, sans-serif'; x.textAlign = 'left'; x.fillText(`GOOD ${good}   OK ${okc}   MISSED ${miss}`, 10, 23); }
    if (t > END){ over = true; const score = clamp((good + okc * .6) / notes.length, 0, 1);
      done({win:score >= .55, score, msg:`${good} spot-on, ${okc} near enough, ${miss} missed.`}); }
  });
  const KM = lanes === 1 ? {' ':0, Enter:0} : {a:0, s:1, d:2, A:0, S:1, D:2, ArrowLeft:0, ArrowDown:1, ArrowRight:2, j:0, k:1, l:2};
  return {stop, key:e => { const l = KM[e.key]; if (l !== undefined){ press(l); e.preventDefault(); } }};
};

// ── King Neptune's quiz ─────────────────────────────────────────────────────
GAMES.quiz = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Answer the court\'s questions. Four out of six, or it\'s the bucket.');
  const POOL = [
    ['What is the name of Phileas Fogg\'s manservant?', 'Passepartout', ['Fix', 'Proust', 'Aouda']],
    ['How much did Fogg bet that he could go round the world in eighty days?', '£20,000', ['£80', '£5,000', 'A guinea']],
    ['Which detective pursues Fogg round the world, convinced he\'s a bank robber?', 'Fix', ['Lestrade', 'Poirot', 'Bucket']],
    ['In what year is Fogg\'s journey set?', '1872', ['1815', '1901', '1888']],
    ['What nearly loses Fogg the bet at the very end?', 'He forgets the day gained crossing the Date Line', ['He misses a train in Kent', 'He gets lost in Pall Mall', 'He oversleeps']],
    ['How does Fogg cross the frozen plains of Nebraska?', 'On a sledge with a sail', ['By balloon', 'On an elephant', 'By canal']],
    ['What does Fogg do to the steamer Henrietta to keep her going?', 'Burns her woodwork as fuel', ['Rows her', 'Sells her', 'Tows her with whales']],
    ['Going east round the world, what do you gain?', 'A day', ['An hour', 'Nothing', 'A week']],
    ['What is the one rule of this journey?', 'No aeroplanes', ['No trains', 'No hats', 'No telly']],
    ['Through which canal did you look down in Greece?', 'The Corinth Canal', ['The Suez Canal', 'The Grand Canal', 'The Panama Canal']],
    ['What was the dhow that took you to Bombay called?', 'The Al Shama', ['The Henrietta', 'The Golden Hind', 'The Mi-kel Jack-son']],
    ['What does Hassan say every morning?', '"Mi-kel Jack-son!"', ['"Kem cho?"', '"Great disco!"', '"Bombay, Bombay!"']],
    ['In the novel, where does Fogg ride an elephant?', 'India', ['Egypt', 'Japan', 'Nebraska']],
    ['Which Python is NOT one of your three referees?', 'John Cleese', ['Terry Jones', 'Terry Gilliam', 'Neither Terry']]
  ];
  const qs = shuffle(POOL.slice()).slice(0, 6);
  let i = 0, right = 0, lock = false;
  function show(){
    if (i >= qs.length){ const score = right / qs.length; return done({win:right >= 4, score, msg:`${right} out of ${qs.length}.`}); }
    const [q, a, wr] = qs[i], opts = shuffle([a].concat(wr));
    ui.hud.textContent = `Question ${i + 1}/6 · right ${right}`;
    ui.body.innerHTML = `<div class="result" style="font-size:1.15rem">🔱 ${esc(q)}${has('verne') && i < 3 ? '<br><small class="meta">(You\'ve read the book. You have a feeling about this one.)</small>' : ''}</div>
      <div class="qopts">${opts.map(o => `<button data-a="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    ui.body.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      if (lock) return; lock = true; const ok = b.dataset.a === a; if (ok){ right++; SND.fx('coin'); } else SND.fx('bad');
      b.classList.add(ok ? 'right' : 'wrong'); ui.body.querySelectorAll('[data-a]').forEach(o => { if (o.dataset.a === a) o.classList.add('right'); });
      setTimeout(() => { lock = false; i++; show(); }, 1000); });
    if (has('verne') && i < 3){ ui.body.querySelectorAll('[data-a]').forEach(o => { if (o.dataset.a === a) o.style.boxShadow = '0 0 0 2px rgba(31,138,110,.35)'; }); }
  }
  show();
  return {};
};

// ── Up, up and away ─────────────────────────────────────────────────────────
GAMES.balloon = (cfg, wrap, done) => {
  const ui = gameShell(wrap, cfg.title, '', 'Hold <b>Space</b> (or hold the mouse or a finger on the screen) to fire the burner. High winds blow east, low winds blow back west. Land gently in the field with the flag.');
  const W = 600, H = 380, GY = 340, {c, x} = mkCanvas(ui.body, W, H);
  let bx = 60, by = GY, vy = 0, fuel = 100, t = 0, burn = false, up = false, over = false, maxUp = 0;
  const FX = 480;
  c.addEventListener('pointerdown', e => { burn = true; c.setPointerCapture(e.pointerId); }); c.addEventListener('pointerup', () => { burn = false; });
  const wind = y => y < 130 ? 34 : y < 230 ? 12 : -12;
  function land(){ over = true; const d = Math.abs(bx - FX), hard = vy > 48;
    const score = clamp((1 - Math.max(0, d - 30) / 220) * (hard ? .6 : 1), 0, 1);
    setTimeout(() => done({win:score >= .5, score, msg:`${d < 35 ? 'Right in the field' : Math.round(d) + ' yards from the flag'}${hard ? ', with a thump' : ', gently'}.`}), 500); }
  const stop = ticker(dt => {
    if (over) return; t += dt;
    const b = (burn || UI.keys.fire || UI.keys.up) && fuel > 0;
    if (b){ fuel = Math.max(0, fuel - 5.5 * dt); vy -= 34 * dt; } else vy += 15 * dt;
    vy = clamp(vy, -55, 60); by += vy * dt;
    if (by < 40){ by = 40; vy = Math.max(0, vy); }
    if (by >= GY){ by = GY; if (up && vy > 0){ land(); } vy = Math.min(0, vy); }
    if (GY - by > 30) up = true; maxUp = Math.max(maxUp, GY - by);
    if (up) bx += wind(by) * dt;
    if (bx > W + 10 || bx < -10){ over = true; setTimeout(() => done({win:false, score:.1, msg:'You drift right out of the valley. The chase truck finds you two hours later.'}), 400); }
    if (t > 75 && !over){ over = true; land(); }
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6aa8e8'); g.addColorStop(1, '#dbe8f7'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = '#e8eef6'; x.beginPath(); x.moveTo(0, 260); x.lineTo(120, 150); x.lineTo(220, 240); x.lineTo(330, 120); x.lineTo(450, 250); x.lineTo(540, 170); x.lineTo(W, 230); x.lineTo(W, GY); x.lineTo(0, GY); x.fill();
    x.fillStyle = '#7a9a6a'; x.fillRect(0, GY, W, H - GY); x.fillStyle = '#a8c890'; x.fillRect(FX - 40, GY, 80, 8);
    x.fillStyle = '#d0352f'; x.fillRect(FX, GY - 30, 3, 30); x.beginPath(); x.moveTo(FX + 3, GY - 30); x.lineTo(FX + 20, GY - 24); x.lineTo(FX + 3, GY - 18); x.fill();
    x.font = '13px Special Elite, monospace'; x.fillStyle = 'rgba(18,35,57,.6)'; x.textAlign = 'left';
    [[85, '→→ fast east'], [185, '→ east'], [290, '← west']].forEach(([y, s]) => x.fillText(s, 8, y));
    x.strokeStyle = 'rgba(18,35,57,.15)'; x.setLineDash([4, 6]); [130, 230].forEach(y => { x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }); x.setLineDash([]);
    x.save(); x.translate(bx, by - 52);
    x.fillStyle = '#d0352f'; x.beginPath(); x.ellipse(0, -10, 26, 32, 0, 0, 7); x.fill();
    x.fillStyle = '#ffc94a'; x.fillRect(-26, -14, 52, 7); x.fillStyle = '#1f4f86'; x.fillRect(-26, -2, 52, 6);
    x.strokeStyle = '#5a3a2a'; x.beginPath(); x.moveTo(-14, 16); x.lineTo(-8, 38); x.moveTo(14, 16); x.lineTo(8, 38); x.stroke();
    x.fillStyle = '#8a5a2a'; x.fillRect(-10, 38, 20, 14);
    if (b){ x.fillStyle = '#ffb14a'; x.beginPath(); x.moveTo(-4, 36); x.lineTo(0, 22 - Math.random() * 6); x.lineTo(4, 36); x.fill(); }
    x.restore();
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, W, 30); x.fillStyle = '#fff'; x.font = '16px Bebas Neue, sans-serif'; x.textAlign = 'left';
    x.fillText(`FUEL`, 10, 21); x.fillStyle = '#22334d'; x.fillRect(50, 10, 120, 10); x.fillStyle = fuel < 25 ? '#ff6b5e' : '#ffc94a'; x.fillRect(50, 10, fuel * 1.2, 10);
    x.fillStyle = '#fff'; x.textAlign = 'right'; x.fillText(`${up ? 'ALT ' + Math.round((GY - by) * 3) + ' FT · ' : 'ON THE GROUND · '}${Math.max(0, 75 - t).toFixed(0)}s`, W - 10, 21);
  });
  return {stop, held:true};
};

// ═══ BOOT ═══════════════════════════════════════════════════════════════════
$('#btnMenu').onclick = openMenu;
$('#btnSound').onclick = () => { SND.on = !SND.on; updateSoundBtn(); if (SND.on) SND.fx('good'); };
$('#modal .mclose').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
  if (UI.game && UI.inst){
    const d = KEYMAP[e.key];
    if (UI.inst.held && d){ UI.keys[d] = true; e.preventDefault(); }
    if (UI.inst.key) UI.inst.key(e);
    if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
    return;
  }
  if (G && !UI.game && /^[1-9]$/.test(e.key) && $('#modal').classList.contains('hidden')){
    const btns = $('#inner').querySelectorAll('.choices button:not([disabled])'); const all = $('#inner').querySelectorAll('.choices button');
    const b = all[+e.key - 1]; if (b && !b.disabled) b.click();
  }
  if (G && G.pending && (e.key === 'Enter' || e.key === ' ') && $('#modal').classList.contains('hidden')){ e.preventDefault(); continuePending(); }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) UI.keys[d] = false; if (UI.game && UI.inst && UI.inst.keyup) UI.inst.keyup(e); });
window.addEventListener('blur', () => { UI.keys = {}; });
updateSoundBtn();
G = null;
render();
