        html += `<button onclick="resolveCoalitionChoice('${o.id}')"><span class="mc-t">Form a coalition with ${o.name} — ${o.combined} seats combined</span><span class="mc-d">They want movement on ${area.name}. You'll split the difference between your positions, and Unity will take a hit.</span></button>`;
      } else {
        html += `<button disabled><span class="mc-t">${o.name} — ${o.seats} seats</span><span class="mc-d">Not enough for a majority even combined (${o.combined} of ${MAJORITY} needed).</span></button>`;
      }
    });
    html += `<button onclick="resolveCoalitionChoice('minority')"><span class="mc-t">Govern Alone as a Minority</span><span class="mc-d">No partner and no concessions — but a fragile Government, prone to collapse.</span></button>`;
    html += `<button onclick="resolveCoalitionChoice('decline')"><span class="mc-t">Decline — Remain in Opposition</span><span class="mc-d">Let another party attempt to form a Government instead.</span></button>`;
    html += `</div>`;
  } else if(ev.type==='hire-offer'){
    const cand = G.staffMarket.find(c=>c.id===ev.candId);
    if(!cand){ html += `<div class="mchoices"><button onclick="G.pendingEvent=null; closeModal(); render();">Close</button></div>`; }
    else {
      html += `<div class="mchoices">
        <button onclick="proposeHire('${cand.id}','low')"><span class="mc-t">Lowball — ${fmtMoney(Math.round(cand.salary*0.8))}/wk</span><span class="mc-d">Cheaper, but skilled candidates may refuse — and can walk away for good if insulted.</span></button>
        <button onclick="proposeHire('${cand.id}','standard')"><span class="mc-t">Standard Offer — ${fmtMoney(cand.salary)}/wk</span><span class="mc-d">Their asking rate. Very likely to be accepted.</span></button>

      </div>`;
    }
  } else if(ev.type==='byelection-result'){
    html += `<div class="mchoices"><button class="primary" onclick="G.pendingEvent=null; save(); closeModal(); render();">Continue</button></div>`;
  } else if(ev.type==='info'){
    html += `<div class="mchoices"><button class="primary" onclick="G.pendingEvent=null; save(); closeModal(); render();">Continue</button></div>`;
  } else if(ev.type==='gameover'){
    html += `<div class="mchoices"><button class="primary" onclick="closeModal(); render();">See Final Summary</button></div>`;
  } else if(ev.type==='election-result'){
    const rows = ev.ranked.map(([id,r])=>`<div class="pollbar-row"><span class="pname">${r.name}${id==='you'?' (You)':''}</span><div class="bar-outer"><div class="bar-inner" style="width:${r.seats/TOTAL_SEATS*100}%; background:${id==='you'?'var(--you)':id==='gov'?'var(--gov)':id==='opp'?'var(--opp)':'var(--oth)'}"></div></div><span class="pval">${r.seats}</span></div>`).join('');

    html += `<div class="mchoices"><button class="primary" onclick="continueAfterElection()">${G.won?'Begin Governing':'Continue'}</button></div>`;

}

function pollBar(id,name,val,colour){
  return `<div class="pollbar-row"><span class="pname">${name}</span><div class="bar-outer"><div class="bar-inner" style="width:${clamp(val,0,100)}%; background:${colour}"></div></div><span class="pval">${fmtPct(val)}</span></div>`;
}

function pollHistorySvg(){
  const hist = G.pollHistory;
  if(!hist || hist.length<2) return '<p class="small">Poll trend will appear here after a few weeks.</p>';
  const W=560, H=140, pad=8;
  const n = hist.length;
  const xStep = n>1 ? (W-2*pad)/(n-1) : 0;
  const colours = {you:'var(--you)', gov:'var(--gov)', opp:'var(--opp)', oth:'var(--oth)'};
  const lines = ['you','gov','opp','oth'].map(k=>{
    const pts = hist.map((h,i)=>{
      const x = pad + i*xStep;
      const y = (H-pad) - clamp(h[k],0,100)/100*(H-2*pad);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<polyline points="${pts}" fill="none" style="stroke:${colours[k]}; stroke-width:2.2;"/>`;
  }).join('');
  return `<div style="margin:10px 0 4px;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:130px; display:block;">${lines}</svg>
    <div class="small" style="margin-top:2px;">Poll trend, week ${hist[0].week}–${hist[n-1].week}</div>
  </div>`;
}

function renderSeatMosaic(){
  const parties = [
    {id:'you', n:G.seats, colour:'var(--you)', name:G.partyName},
    {id:'gov', n:G.rivals.find(r=>r.id==='gov').seats, colour:'var(--gov)', name:G.rivals.find(r=>r.id==='gov').name},
    {id:'opp', n:G.rivals.find(r=>r.id==='opp').seats, colour:'var(--opp)', name:G.rivals.find(r=>r.id==='opp').name},
    {id:'oth', n:G.rivals.find(r=>r.id==='oth').seats, colour:'var(--oth)', name:G.rivals.find(r=>r.id==='oth').name},
  ];
  let cells = '';
  parties.forEach(p=>{
    for(let i=0;i<p.n;i++) cells += `<div style="background:${p.colour};" title="${p.name}"></div>`;
  });
  const legend = parties.map(p=>`<span class="small"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.colour};margin-right:4px;vertical-align:middle;"></span>${p.name}: ${p.n}</span>`).join(' &nbsp; ');
  return `<div class="seatmosaic">${cells}</div><div class="flex" style="flex-wrap:wrap;">${legend}</div>`;
}

function renderUkMap(){
  const seatsByRegion = computeRegionalSeats();
  const govName = G.rivals.find(r=>r.id==='gov').name;
  const oppName = G.rivals.find(r=>r.id==='opp').name;
  const othName = G.rivals.find(r=>r.id==='oth').name;
  let blocks = '';
  REGIONS.forEach(r=>{
    const c = seatsByRegion[r.key];
    const total = c.you+c.gov+c.opp+c.oth;
    const pct = k=> total ? (c[k]/total*100) : 0;
    const title = `${r.name} — ${G.partyName} ${c.you}, ${govName} ${c.gov}, ${oppName} ${c.opp}, ${othName} ${c.oth}`;
    blocks += `<div class="ukregion" style="grid-column:${r.grid.col}; grid-row:${r.grid.row};" title="${title}">
      <div class="ukregion-label">${r.name}</div>
      <div class="ukregion-bar">
        <span style="width:${pct('you')}%; background:var(--you);"></span>
        <span style="width:${pct('gov')}%; background:var(--gov);"></span>
        <span style="width:${pct('opp')}%; background:var(--opp);"></span>
        <span style="width:${pct('oth')}%; background:var(--oth);"></span>
      </div>
    </div>`;
  });
  return `<div class="ukmapwrap"><div class="ukmap">${blocks}</div></div><p class="small">A stylised regional guide to where support leans, derived from your live polling — not individual constituencies.</p>`;
}

function renderOverview(){

  html += actionButton('Media Interview', 'Face the press on the record. Costs 1 AP.', 'actionMediaInterview()', G.ap<1);

  html += actionButton('Party Management', 'Shore up unity among your MPs. Costs 1 AP.', 'actionPartyManagement()', G.ap<1);
  if(!G.campaign){
    html += actionButton(G.governing?'Answer PMQs':'Face PMQs', G.governing?'Defend your record at the despatch box. Costs 1 AP.':'Challenge the PM directly. Costs 1 AP.', 'actionPMQs()', G.ap<1);
  }
  if(canTableNoConfidence()){
    html += actionButton('Table a Motion of No Confidence', 'Attempt to bring down a Government without a majority and force an early Election. Costs 1 AP.', 'tableNoConfidence()', G.ap<1);
  }
  html += `</div>`;

  }

  if(G.byElection){ html += renderByElectionCard(); }

    html += `<div class="card"><h3>General Election Campaign — ${G.campaign.weeksLeft} week(s) remaining</h3>` + campaignActionsHtml() + `</div>`;
  }

    html += `<div class="card"><h3>Government Departments${G.minorityGovt?' <span class="tag warn" style="margin-left:6px;">Minority Govt</span>':''}</h3>`;
    html += `<p class="small">Performance drifts toward the competence of whichever MP holds each portfolio — assign your Cabinet in the Party &amp; MPs tab. Unstaffed departments drift toward a poor baseline.</p>`;
    POLICY_AREAS.forEach(p=>{
      const dept = G.departments[p.key];
      const minister = G.mps.find(m=>m.portfolio===p.name);
      const perf = Math.round(dept.performance);
      const barColour = perf>=65 ? 'var(--green)' : perf>=40 ? 'var(--gold)' : 'var(--red)';
      html += `<div class="pollbar-row"><span class="pname">${p.name}${minister?'':' (vacant)'}</span><div class="bar-outer"><div class="bar-inner" style="width:${perf}%; background:${barColour}"></div></div><span class="pval">${perf}</span></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="card"><h3>Across the Country</h3>` + renderUkMap() + `</div>`;

  });
  html += `</div>`;
  return html;
}

  let html = `<div class="card"><h3>${G.governing?'Cabinet':'Shadow Cabinet'} (${cabinet.length}/${SHADOW_PORTFOLIOS.length} portfolios filled)</h3>`;

  html += `</div>`;

  html += `<div class="card"><h3>Backbenchers (${backbench.length})</h3>`;
  html += `<div class="field" style="margin-bottom:10px;"><input type="text" id="mpSearchInput" placeholder="Search by name or seat... (Enter to search)" value="${partyMpQuery.replace(/"/g,'&quot;')}"></div>`;

  const query = partyMpQuery.trim().toLowerCase();
  let shown = query
    ? backbench.filter(m=>m.name.toLowerCase().includes(query) || m.seat.toLowerCase().includes(query))
    : backbench.slice();
  shown.sort((a,b)=>b.competence-a.competence);

  let truncated = false;
  if(!query && !partyShowAllBackbench && shown.length>MP_LIST_COLLAPSE){
    shown = shown.slice(0,MP_LIST_COLLAPSE);
    truncated = true;
  }

  if(backbench.length===0) html += `<p class="small">No backbenchers — every MP holds a portfolio.</p>`;
  else if(shown.length===0) html += `<p class="small">No backbenchers match "${partyMpQuery}".</p>`;
  else html += mpTableRows(shown);

  if(truncated){
    html += `<button onclick="partyShowAllBackbench=true; render();" style="margin-top:8px;">Show all ${backbench.length} backbenchers</button>`;
  } else if(!query && partyShowAllBackbench && backbench.length>MP_LIST_COLLAPSE){
    html += `<button onclick="partyShowAllBackbench=false; render();" style="margin-top:8px;">Collapse list</button>`;
  }
  html += `</div>`;
  return html;
}
function loyaltyTag(v){
  if(v>=70) return `<span class="tag good">${v}</span>`;
  if(v>=40) return `<span class="tag warn">${v}</span>`;
  return `<span class="tag bad">${v}</span>`;
}

function moraleTag(v){
  if(v>=65) return `<span class="tag good">${Math.round(v)}</span>`;
  if(v>=30) return `<span class="tag warn">${Math.round(v)}</span>`;
  return `<span class="tag bad">${Math.round(v)}</span>`;
}

function renderStaff(){
  let html = `<div class="card"><h3>Current Staff (Weekly payroll: ${fmtMoney(G.staff.reduce((a,s)=>a+s.salary,0))})</h3>`;
  if(G.staff.length===0) html += `<p class="small">You have no campaign staff. Hire from the market below.</p>`;
  else {
    html += `<p class="small">Underpaid staff lose morale over time and can resign; a raise or a cut takes effect immediately. Skill shown includes the effect of how well they get on with the rest of the team.</p>`;
    html += `<div class="tblwrap"><table><tr><th>Name</th><th>Role</th><th>Personality</th><th>Skill</th><th>Salary/wk</th><th>Morale</th><th></th></tr>`;
    G.staff.forEach(s=>{
      const eff = Math.round(effectiveSkill(s));
      html += `<tr><td><a onclick="openStaffDetailModal('${s.id}'); return false;" href="#">${s.name}</a></td><td>${s.roleName}</td><td>${personalityLabel(s.personality)}</td><td>${eff}${eff!==s.skill?` <span class="small">(base ${s.skill})</span>`:''}</td><td>${fmtMoney(s.salary)}</td><td>${moraleTag(s.morale===undefined?70:s.morale)}</td>
        <td class="flex">
          <button onclick="giveRaise('${s.id}')">Raise</button>
          <button onclick="cutPay('${s.id}')">Cut Pay</button>
          <button class="danger" onclick="fireStaff('${s.id}')">Fire</button>
        </td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>Candidate Market</h3><p class="small">The market turns over every few months, so it's worth checking back.</p><div class="tblwrap"><table><tr><th>Name</th><th>Role</th><th>Personality</th><th>Skill</th><th>Asking Salary/wk</th><th></th></tr>`;
  G.staffMarket.forEach(c=>{
    html += `<tr><td>${c.name}</td><td>${c.roleName}</td><td>${personalityLabel(c.personality)}</td><td>${c.skill}</td><td>${fmtMoney(c.salary)}</td><td><button onclick="openHireOfferModal('${c.id}')" ${G.funds<Math.round(c.salary*1.6)?'disabled':''}>Make an Offer</button></td></tr>`;
  });
  html += `</table></div></div>`;
  return html;
}

function renderCampaign(){
  let html='';
  if(G.campaign){
    html += `<div class="card"><h3>General Election Campaign — ${G.campaign.weeksLeft} week(s) remaining</h3>${campaignActionsHtml()}</div>`;
  } else {
    html += `<div class="card"><h3>General Election</h3><p class="small">The current term runs to week ${G.termLength} (currently week ${G.termWeek}). ${canCallSnapElection()?'You may call a snap election at any time.':'You cannot call a snap election before week '+MIN_SNAP_WEEK+'.'}</p>`;
    if(canCallSnapElection()) html += `<button class="danger" onclick="callSnapElection()">Call a Snap General Election</button>`;
    html += `</div>`;
  }
  if(G.byElection){
    html += renderByElectionCard();
  } else if(!G.campaign) {
    html += `<div class="card"><h3>No Active By-Election</h3><p class="small">By-elections are triggered randomly — most likely when party unity is low, or when you expel one of your own MPs.</p></div>`;
  }
  html += `<div class="card"><h3>Election History</h3>`;
  if(G.electionHistory.length===0) html += `<p class="small">No General Elections held yet.</p>`;
  else {
    html += `<div class="tblwrap"><table><tr><th>Term</th><th>${G.partyName}</th><th>Govt</th><th>Opposition</th><th>Others</th><th>Outcome</th></tr>`;
    G.electionHistory.forEach(h=>{
      html += `<tr><td>${h.term}</td><td>${h.results.you.seats}</td><td>${h.results.gov.seats}</td><td>${h.results.opp.seats}</td><td>${h.results.oth.seats}</td><td>${h.outcome}</td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderMedia(){
  let html = `<div class="card"><h3>Reputation</h3>`;
  html += `<div class="statrow"><span class="lbl">Public Trust</span><b>${Math.round(G.trust)}%</b></div>`;
  html += `<div class="statrow"><span class="lbl">Leader Approval</span><b>${Math.round(G.approval)}%</b></div>`;
  html += `<div class="statrow"><span class="lbl">Party Unity</span><b>${Math.round(G.unity)}%</b></div>`;
  html += `<div class="statrow"><span class="lbl">Unresolved hidden favours</span><b>${G.hiddenFavours.length}</b></div>`;
  html += `</div>`;
  html += `<div class="card"><h3>Achievements</h3>`;
  if(!G.achievements || G.achievements.length===0) html += `<p class="small">None yet.</p>`;
  else html += G.achievements.map(a=>`<span class="tag good" style="margin:3px 4px 3px 0; display:inline-block;">🏆 ${a.label} <span class="small">(wk ${a.week})</span></span>`).join('');
  html += `</div>`;
  html += `<div class="card"><h3>News Archive</h3><div>`;
  G.newsFeed.slice(0,60).forEach(n=>{
    html += `<div style="padding:6px 0; border-bottom:1px dashed #232838;"><span class="small">Week ${n.week}</span> — ${n.msg}</div>`;
  });
  html += `</div></div>`;
  return html;
}

function renderFinances(){
  const payroll = G.staff.reduce((a,s)=>a+s.salary,0);
  let html = `<div class="card"><h3>Party Finances</h3>`;
  html += `<div class="statrow"><span class="lbl">Funds on hand</span><b>${fmtMoney(G.funds)}</b></div>`;
  html += `<div class="statrow"><span class="lbl">Weekly staff payroll</span><b>${fmtMoney(payroll)}</b></div>`;
  html += `<div class="statrow"><span class="lbl">Party members</span><b>${G.members.toLocaleString()}</b></div>`;
  html += `</div>`;
  html += `<div class="card"><h3>Hidden Favours (accepted, unexposed)</h3>`;
  if(G.hiddenFavours.length===0) html += `<p class="small">None. Your books are clean — for now.</p>`;
  else {
    html += `<div class="tblwrap"><table><tr><th>Donor</th><th>Amount</th><th>Taken (Week)</th><th>Exposure Risk</th></tr>`;
    G.hiddenFavours.forEach(f=>{
      html += `<tr><td>${f.donor}</td><td>${fmtMoney(f.amount)}</td><td>${f.weekTaken}</td><td>${Math.round(f.exposeChance*100)}%/wk</td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderLog(){
  const bar = document.getElementById('logbar');
  bar.innerHTML = G.newsFeed.slice(0,12).map(n=>`<div class="${n.cls}">Wk${n.week}: ${n.msg}</div>`).join('');
}

function renderGameOver(){
  const wrap = document.getElementById('gameScreen');
  const peakSeats = Math.max(G.seats, ...(G.electionHistory.map(h=>h.results.you.seats)), 0);
  wrap.innerHTML = `<div id="topbar"><div class="tb-party">${G.partyName} — GAME OVER</div></div>
    <div style="max-width:600px;margin:60px auto;padding:0 20px;">
      <div class="card"><h2>The End of an Era</h2>
      <p>${G.gameOverReason}</p>
      <p class="small">You led ${G.partyName} for ${G.week} weeks across ${G.termNumber} Parliament(s), reaching a peak of ${peakSeats} seats.</p>
      <button class="primary" onclick="resetGame()">Start a New Party</button>
      </div>
    </div>`;
}

function wireContentEvents(){
  document.querySelectorAll('.policySlider').forEach(el=>{
    el.addEventListener('change', e=>{
      changePolicy(el.dataset.policy, parseInt(el.value,10));
    });
  });
  document.querySelectorAll('[data-mpselect]').forEach(el=>{
    el.addEventListener('change', e=>{
      assignPortfolio(el.dataset.mpselect, el.value || null);
    });
  });
  const mpSearch = document.getElementById('mpSearchInput');
  if(mpSearch){
    mpSearch.addEventListener('change', ()=>{ partyMpQuery = mpSearch.value; render(); });
    mpSearch.addEventListener('keydown', e=>{ if(e.key==='Enter'){ partyMpQuery = mpSearch.value; render(); } });
  }
}

// ---------------------------------------------------------------------
// NAV / MENU WIRING
// ---------------------------------------------------------------------
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

document.getElementById('btnMenu').addEventListener('click', ()=>{
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h2>Menu</h2><div class="mbody">Game is auto-saved after every action.</div>
    <div class="mchoices">
      <button onclick="closeModal()">Resume</button>
      <button class="danger" onclick="if(confirm('Abandon this game and start over? This cannot be undone.')) resetGame();">Resign &amp; Start New Party</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay' && G && !G.pendingEvent) closeModal();
});

// ---------------------------------------------------------------------
// SETUP SCREEN WIRING
// ---------------------------------------------------------------------
let selectedLean='centre', selectedTier='rising', selectedTrait='orator';

function renderSetupOptions(){
  const leanWrap = document.getElementById('leanOptions');
  leanWrap.innerHTML = Object.entries(LEAN_PRESETS).map(([k,v])=>
    `<div class="opt-card ${k===selectedLean?'selected':''}" data-lean="${k}"><h4>${v.label}</h4><p>${v.desc}</p></div>`
  ).join('');
  const tierWrap = document.getElementById('tierOptions');
  tierWrap.innerHTML = Object.entries(TIER_PRESETS).map(([k,v])=>
    `<div class="opt-card ${k===selectedTier?'selected':''}" data-tier="${k}"><h4>${v.label}</h4><p>${v.desc}</p><p class="small">${v.seats} seats, ${fmtMoney(v.funds)}</p></div>`
  ).join('');
  const traitWrap = document.getElementById('traitOptions');
  traitWrap.innerHTML = Object.entries(LEADER_TRAITS).map(([k,v])=>
    `<div class="opt-card ${k===selectedTrait?'selected':''}" data-trait="${k}"><h4>${v.label}</h4><p>${v.desc}</p></div>`
  ).join('');
  leanWrap.querySelectorAll('[data-lean]').forEach(el=>el.addEventListener('click', ()=>{ selectedLean=el.dataset.lean; renderSetupOptions(); }));
  tierWrap.querySelectorAll('[data-tier]').forEach(el=>el.addEventListener('click', ()=>{ selectedTier=el.dataset.tier; renderSetupOptions(); }));
  traitWrap.querySelectorAll('[data-trait]').forEach(el=>el.addEventListener('click', ()=>{ selectedTrait=el.dataset.trait; renderSetupOptions(); }));
}

document.getElementById('setupForm').addEventListener('submit', e=>{
  e.preventDefault();
  const leaderName = document.getElementById('inLeaderName').value.trim() || 'The Leader';
  const partyName = document.getElementById('inPartyName').value.trim() || 'The New Party';
  newGame(leaderName, partyName, selectedLean, selectedTier, selectedTrait);
  showGameScreen();
});

function showGameScreen(){
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  render();
}

// ---------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------
(function init(){
  renderSetupOptions();
  if(tryLoad()){
    document.getElementById('continueRow').style.display='block';
    document.getElementById('btnContinue').addEventListener('click', showGameScreen);
  }
})();
</script>
