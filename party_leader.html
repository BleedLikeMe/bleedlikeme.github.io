<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Leader — Party Political Simulator</title>
<style>
:root{
  --bg:#0e1116; --panel:#161a22; --panel2:#1d2230; --border:#2a3040;
  --text:#e8eaf0; --muted:#8b93a7; --gold:#d4af37; --red:#c0392b; --green:#2ecc71;
  --blue:#3498db; --purple:#9b59b6; --you:#d4af37;
  --gov:#3498db; --opp:#c0392b; --oth:#7f8c8d;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Georgia',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
h1,h2,h3,h4{font-family:'Georgia',serif; margin:0 0 8px 0;}
button{
  font-family:inherit; cursor:pointer; background:var(--panel2); color:var(--text);
  border:1px solid var(--border); border-radius:6px; padding:8px 14px; font-size:14px;
}
button:hover:not(:disabled){background:#262c3d; border-color:var(--gold);}
button:disabled{opacity:0.4; cursor:not-allowed;}
button.primary{background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:bold;}
button.primary:hover:not(:disabled){background:#e6c34f;}
button.danger{border-color:var(--red);}
button.danger:hover:not(:disabled){background:#3a1f1f;}
input[type=text],input[type=number],select,textarea{
  font-family:inherit; background:#0b0d12; color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:8px 10px; font-size:14px; width:100%;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#2a3040;border-radius:6px;}

/* ===== Setup screen ===== */
#setupScreen{
  max-width:640px; margin:40px auto; padding:0 20px 60px;
}
.setup-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; margin-bottom:16px;}
.setup-title{text-align:center; margin-bottom:4px;}
.setup-sub{text-align:center; color:var(--muted); margin-bottom:24px; font-style:italic;}
.field{margin-bottom:16px;}
.field label{display:block; margin-bottom:6px; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:0.05em;}
.tier-options,.lean-options{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.trait-options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.opt-card{border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; background:#12151c; cursor:pointer;}
.opt-card.selected{border-color:var(--gold); background:#241f10;}
.opt-card h4{font-size:14px; margin-bottom:4px;}
.opt-card p{font-size:12px; color:var(--muted); margin:0;}

/* ===== Game shell ===== */
#gameScreen{display:none; min-height:100vh; flex-direction:column;}
#topbar{
  display:flex; align-items:center; gap:18px; background:var(--panel); border-bottom:2px solid var(--gold);
  padding:10px 18px; flex-wrap:wrap; position:sticky; top:0; z-index:20;
}
#topbar .tb-item{font-size:13px; color:var(--muted); white-space:nowrap;}
#topbar .tb-item b{color:var(--text); font-size:15px;}
#topbar .tb-party{font-family:Georgia,serif; font-size:18px; font-weight:bold; color:var(--gold); margin-right:auto;}
#apDots{display:flex; gap:4px;}
.apdot{width:12px;height:12px;border-radius:50%; background:#333; border:1px solid var(--border);}
.apdot.filled{background:var(--gold);}

#mainWrap{display:flex; flex:1; min-height:0;}
#nav{
  width:180px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  padding:12px 0; display:flex; flex-direction:column; gap:2px;
}
#nav button{
  background:none; border:none; border-radius:0; text-align:left; padding:12px 18px;
  border-left:3px solid transparent; color:var(--muted); font-size:14px;
}
#nav button.active{color:var(--gold); border-left-color:var(--gold); background:var(--panel2);}
#nav button:hover:not(.active){background:var(--panel2); color:var(--text);}

#content{flex:1; padding:20px 24px; overflow-y:auto; min-width:0;}
#logbar{
  background:#0b0d12; border-top:1px solid var(--border); padding:8px 18px; font-size:12.5px;
  color:var(--muted); max-height:90px; overflow-y:auto;
}
#logbar div{margin-bottom:2px;}
#logbar .lognew{color:var(--text);}

.card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px;}
.card h3{border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:14px; color:var(--gold); font-size:16px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

.statrow{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #232838; font-size:14px;}
.statrow:last-child{border-bottom:none;}
.statrow .lbl{color:var(--muted);}
.bar-outer{background:#0b0d12; border:1px solid var(--border); border-radius:5px; height:16px; overflow:hidden; flex:1; margin:0 10px;}
.bar-inner{height:100%; transition:width 0.4s;}
.pollbar-row{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px;}
.pollbar-row .pname{width:130px; flex-shrink:0;}
.pollbar-row .pval{width:48px; text-align:right; flex-shrink:0;}

.seatmosaic{display:grid; grid-template-columns:repeat(26,1fr); gap:2px; margin:10px 0;}
.seatmosaic div{aspect-ratio:1; border-radius:2px;}

.ukmapwrap{overflow-x:auto; margin:10px 0;}
.ukmap{display:grid; grid-template-columns:repeat(10,1fr); grid-auto-rows:40px; gap:5px; min-width:480px;}
.ukregion{background:#12151c; border:1px solid var(--border); border-radius:6px; padding:4px 6px; display:flex; flex-direction:column; justify-content:center; gap:3px; overflow:hidden;}
.ukregion-label{font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ukregion-bar{display:flex; height:9px; border-radius:4px; overflow:hidden; background:#0b0d12;}
.ukregion-bar span{height:100%;}

.actiongrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:700px){
  .actiongrid{grid-template-columns:1fr;}
  .tier-options,.lean-options,.trait-options{grid-template-columns:1fr;}
  #mainWrap{flex-direction:column;}
  #nav{
    width:100%; flex-direction:row; flex-wrap:wrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-right:none; border-bottom:1px solid var(--border); padding:4px 2px;
  }
  #nav button{border-left:none; border-bottom:3px solid transparent; padding:10px 12px; white-space:nowrap;}
  #nav button.active{border-left-color:transparent; border-bottom-color:var(--gold);}
  #content{padding:14px 16px;}
  #topbar{gap:10px; padding:8px 12px;}
  .pollbar-row .pname{width:96px;}
}
.action-btn{
  text-align:left; padding:14px; display:flex; flex-direction:column; gap:4px; border-radius:8px;
}
.action-btn .atitle{font-weight:bold; font-size:14px;}
.action-btn .adesc{font-size:12px; color:var(--muted); font-weight:normal;}

.slider-row{margin-bottom:18px;}
.slider-row .sl-head{display:flex; justify-content:space-between; margin-bottom:4px; font-size:13px;}
.slider-row input[type=range]{width:100%;}
.sl-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--muted);}

.tblwrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:8px 6px; text-align:left; border-bottom:1px solid #232838; white-space:nowrap;}
th{color:var(--muted); font-weight:normal; font-size:12px; text-transform:uppercase;}
tr:hover td{background:#1a1e29;}
.tag{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; border:1px solid var(--border);}
.tag.good{color:var(--green); border-color:var(--green);}
.tag.bad{color:var(--red); border-color:var(--red);}
.tag.warn{color:var(--gold); border-color:var(--gold);}

/* Modal overlay */
#overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:100;
  align-items:center; justify-content:center; padding:20px;
}
#overlay.show{display:flex;}
.modal{
  background:var(--panel); border:1px solid var(--gold); border-radius:12px; padding:24px;
  max-width:560px; width:100%; max-height:86vh; overflow-y:auto;
}
.modal h2{color:var(--gold); margin-bottom:10px;}
.modal .mbody{margin-bottom:18px; line-height:1.5; font-size:14.5px;}
.modal .mchoices{display:flex; flex-direction:column; gap:8px;}
.modal .mchoices button{text-align:left; padding:12px 14px;}
.modal .mchoices button .mc-t{font-weight:bold; display:block;}
.modal .mchoices button .mc-d{font-size:12px; color:var(--muted); font-weight:normal;}

.small{font-size:12px; color:var(--muted);}
#content a, .modal a{color:var(--gold); cursor:pointer; text-decoration:none;}
#content a:hover, .modal a:hover{text-decoration:underline;}
.right{text-align:right;}
.center{text-align:center;}
hr.sep{border:none; border-top:1px solid var(--border); margin:14px 0;}
.flex{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.spacer{flex:1;}
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setupScreen">
  <div class="setup-card">
    <h1 class="setup-title">THE LEADER</h1>
    <p class="setup-sub">Found a political party. Fight your way to Government.</p>
    <form id="setupForm">
      <div class="field">
        <label>Your Name (Party Leader)</label>
        <input type="text" id="inLeaderName" maxlength="30" placeholder="e.g. Morgan Reid" required>
      </div>
      <div class="field">
        <label>Party Name</label>
        <input type="text" id="inPartyName" maxlength="34" placeholder="e.g. The Forward Party" required>
      </div>
      <div class="field">
        <label>Political Leaning</label>
        <div class="lean-options" id="leanOptions"></div>
      </div>
      <div class="field">
        <label>Starting Position</label>
        <div class="tier-options" id="tierOptions"></div>
      </div>
      <div class="field">
        <label>Leader Trait</label>
        <div class="trait-options" id="traitOptions"></div>
      </div>
      <button type="submit" class="primary" style="width:100%; padding:12px; margin-top:8px;">Found Your Party</button>
    </form>
  </div>
  <div class="small center" id="continueRow" style="display:none;">
    <button id="btnContinue">Continue Saved Game</button>
  </div>
</div>

<!-- ============ GAME SHELL ============ -->
<div id="gameScreen">
  <div id="topbar">
    <div class="tb-party" id="tbParty">—</div>
    <div class="tb-item">Week <b id="tbWeek">1</b></div>
    <div class="tb-item">Funds <b id="tbFunds">£0</b></div>
    <div class="tb-item">Seats <b id="tbSeats">0</b>/650</div>
    <div class="tb-item">Poll <b id="tbPoll">0%</b></div>
    <div class="tb-item">Unity <b id="tbUnity">0%</b></div>
    <div class="tb-item">Trust <b id="tbTrust">0%</b></div>
    <div class="tb-item">AP <span id="apDots" class="apdot-wrap flex"></span></div>
    <button id="btnMenu" title="Save / Reset">☰</button>
  </div>
  <div id="mainWrap">
    <div id="nav">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="policies">Policies</button>
      <button data-tab="party">Party &amp; MPs</button>
      <button data-tab="staff">Staff</button>
      <button data-tab="campaign">Campaign</button>
      <button data-tab="media">Media &amp; News</button>
      <button data-tab="finances">Finances</button>
    </div>
    <div id="content"></div>
  </div>
  <div id="logbar"></div>
</div>

<!-- ============ MODAL ============ -->
<div id="overlay"><div class="modal" id="modalBox"></div></div>

<script>
'use strict';
/* =====================================================================
   THE LEADER — political party management simulator
   Single-file, self-contained. All state lives in G. Persisted to
   localStorage under 'theLeaderSave'.
===================================================================== */

// ---------------------------------------------------------------------
// CONSTANTS & DATA
// ---------------------------------------------------------------------
const TOTAL_SEATS = 650;
const MAJORITY = 326;
const TERM_LENGTH = 208;      // weeks in a full parliamentary term (~4 years)
const MIN_SNAP_WEEK = 52;     // earliest week a snap election may be called
const AP_PER_WEEK = 3;
const CAMPAIGN_PHASE_LEN = 4; // weeks of official campaign before an election resolves
const CONFERENCE_INTERVAL = 52;

// Policy axes: value -100 (left/liberal/permissive) .. +100 (right/conservative/strict)
const POLICY_AREAS = [
  {key:'economy',     name:'Economy & Tax',      lo:'High Tax, High Spend', hi:'Low Tax, Free Market'},
  {key:'immigration',  name:'Immigration',        lo:'Open Borders',         hi:'Strict Controls'},
  {key:'health',       name:'Health & NHS',       lo:'Fully Public',         hi:'Private Involvement'},
  {key:'environment',  name:'Environment',        lo:'Green Transition',     hi:'Growth First'},
  {key:'education',    name:'Education',          lo:'Comprehensive',       hi:'Selective/Academies'},
  {key:'crime',        name:'Crime & Justice',    lo:'Rehabilitation',      hi:'Tough Sentencing'},
  {key:'housing',      name:'Housing',            lo:"Renters' Rights",     hi:'Homeowner Incentives'},
  {key:'defence',      name:'Defence',            lo:'Reduced Spending',    hi:'Increased Spending'},
];

function zeroPolicyVec(v){ const o={}; POLICY_AREAS.forEach(p=>o[p.key]=v); return o; }

// Demographic groups. ideal = preferred policy position per axis. weight = how much they care (sums to 1).
const DEMOGRAPHICS = [
  {key:'working', name:'Working Class', size:20,
    ideal:{economy:-40,immigration:20,health:-60,environment:0,education:-20,crime:20,housing:-50,defence:0},
    weight:{economy:0.20,immigration:0.14,health:0.18,environment:0.06,education:0.10,crime:0.08,housing:0.16,defence:0.08}},
  {key:'middle', name:'Middle Class', size:18,
    ideal:{economy:10,immigration:10,health:-10,environment:10,education:10,crime:10,housing:10,defence:10},
    weight:{economy:0.16,immigration:0.10,health:0.14,environment:0.12,education:0.16,crime:0.10,housing:0.14,defence:0.08}},
  {key:'business', name:'Business Owners', size:9,
    ideal:{economy:70,immigration:0,health:40,environment:30,education:20,crime:20,housing:40,defence:20},
    weight:{economy:0.30,immigration:0.08,health:0.08,environment:0.08,education:0.10,crime:0.10,housing:0.16,defence:0.10}},
  {key:'youth', name:'Youth Voters', size:13,
    ideal:{economy:-30,immigration:-40,health:-50,environment:-70,education:-30,crime:-30,housing:-60,defence:-40},
    weight:{economy:0.14,immigration:0.10,health:0.14,environment:0.24,education:0.12,crime:0.04,housing:0.16,defence:0.06}},
  {key:'pensioners', name:'Pensioners', size:14,
    ideal:{economy:20,immigration:40,health:-40,environment:20,education:0,crime:50,housing:20,defence:40},
    weight:{economy:0.16,immigration:0.16,health:0.22,environment:0.04,education:0.04,crime:0.16,housing:0.10,defence:0.12}},
  {key:'rural', name:'Rural Communities', size:7,
    ideal:{economy:30,immigration:30,health:0,environment:10,education:0,crime:30,housing:10,defence:30},
    weight:{economy:0.18,immigration:0.16,health:0.10,environment:0.10,education:0.08,crime:0.16,housing:0.10,defence:0.12}},
  {key:'urban', name:'Urban Professionals', size:11,
    ideal:{economy:20,immigration:-30,health:-20,environment:-40,education:20,crime:-10,housing:-20,defence:-10},
    weight:{economy:0.18,immigration:0.10,health:0.12,environment:0.18,education:0.16,crime:0.08,housing:0.12,defence:0.06}},
  {key:'suburban', name:'Suburban Families', size:8,
    ideal:{economy:20,immigration:20,health:-10,environment:10,education:30,crime:20,housing:30,defence:10},
    weight:{economy:0.16,immigration:0.12,health:0.14,environment:0.10,education:0.20,crime:0.10,housing:0.12,defence:0.06}},
];

const LEAN_PRESETS = {
  left:   {economy:-55,immigration:-35,health:-65,environment:-35,education:-35,crime:-35,housing:-50,defence:-30, label:'Progressive Left', desc:'Redistribution, public services, open society.'},
  centre: {economy:0,immigration:0,health:0,environment:0,education:0,crime:0,housing:0,defence:0, label:'Centrist', desc:'Pragmatic, triangulating, few fixed dogmas.'},
  right:  {economy:55,immigration:45,health:35,environment:35,education:35,crime:45,housing:35,defence:40, label:'Conservative Right', desc:'Free markets, tradition, strong borders.'},
};

const TIER_PRESETS = {
  fringe:  {seats:3,   funds:18000,  members:1800,  label:'Fringe Movement', desc:'A handful of seats. Everything to prove.'},
  rising:  {seats:28,  funds:90000,  members:22000, label:'Rising Challenger', desc:'A real bench of MPs and growing momentum.'},
  official:{seats:185, funds:400000, members:120000, label:'Official Opposition', desc:'You already shadow the Government. Power is close.'},
};

const LEADER_TRAITS = {
  orator:    {label:'The Orator', desc:'Gifted at speeches, interviews, debates and PMQs.'},
  organiser: {label:'The Organiser', desc:'Builds party unity fast; smoother policy U-turns.'},
  fixer:     {label:'The Fixer', desc:'A natural at raising money, declared or otherwise.'},
  ideologue: {label:'The Ideologue', desc:'Conviction cuts both ways — bigger swings, for better or worse.'},
};

// MPs and staff each get one of these. Only people who actually work closely together —
// Cabinet/Shadow Cabinet MPs and hired staff — have their personalities interact; see
// personChemistry(). Backbenchers still carry a personality (for flavour, and because
// ambition/maverick-style traits feed rebellion odds) but aren't part of that inner circle.
const PERSONALITIES = [
  {key:'loyalist',  label:'Loyalist',  desc:'Steady and dutiful — values team cohesion above all.'},
  {key:'maverick',  label:'Maverick',  desc:'Independent-minded and unpredictable — no fan of being told what to do.'},
  {key:'networker', label:'Networker', desc:'Sociable and diplomatic — smooths over friction between others.'},
  {key:'workhorse', label:'Workhorse', desc:'Heads-down and reliable — largely indifferent to office politics.'},
  {key:'egotist',   label:'Egotist',   desc:'Ambitious and self-promoting — wants the credit, resents sharing it.'},
  {key:'cynic',     label:'Cynic',     desc:'Jaded and quick to grumble, but rarely rebels alone.'},
];
function randomPersonality(){ return choice(PERSONALITIES).key; }
function personalityLabel(key){
  const p = PERSONALITIES.find(p=>p.key===key);
  return p ? `<span title="${p.desc}">${p.label}</span>` : '—';
}

// Symmetric compatibility between two personality types, roughly -2 (clash) to +2 (synergy).
// Looked up either order; unlisted pairs default to neutral (0).
const PERSONALITY_COMPAT = {
  'loyalist|loyalist':1, 'loyalist|maverick':-1, 'loyalist|networker':1, 'loyalist|workhorse':1, 'loyalist|egotist':-1, 'loyalist|cynic':-1,
  'maverick|maverick':-1, 'maverick|networker':0, 'maverick|workhorse':0, 'maverick|egotist':-1, 'maverick|cynic':0,
  'networker|networker':1, 'networker|workhorse':1, 'networker|egotist':0, 'networker|cynic':-1,
  'workhorse|workhorse':1, 'workhorse|egotist':-1, 'workhorse|cynic':0,
  'egotist|egotist':-2, 'egotist|cynic':0,
  'cynic|cynic':-1,
};
function personalityCompat(a,b){
  if(!a || !b) return 0;
  if(PERSONALITY_COMPAT[a+'|'+b]!==undefined) return PERSONALITY_COMPAT[a+'|'+b];
  if(PERSONALITY_COMPAT[b+'|'+a]!==undefined) return PERSONALITY_COMPAT[b+'|'+a];
  return 0;
}

const RIVAL_TEMPLATES = [
  {id:'gov', name:'The Unity Party', colour:'var(--gov)', governing:true,
    stance:{economy:35,immigration:20,health:25,environment:10,education:15,crime:25,housing:20,defence:25}},
  {id:'opp', name:'New Horizon', colour:'var(--opp)', governing:false,
    stance:{economy:-30,immigration:-20,health:-45,environment:-20,education:-20,crime:-15,housing:-30,defence:-15}},
  {id:'oth', name:'Common Cause & Others', colour:'var(--oth)', governing:false,
    stance:{economy:5,immigration:60,health:0,environment:-10,education:0,crime:30,housing:10,defence:20}},
];

// A stylised schematic map of the UK's nations/regions, laid out roughly in their real
// compass positions (grid line-ranges, not true geographic boundaries — this game's seats
// are fictional). `demoMix` gives each region's rough demographic flavour, reusing the
// same DEMOGRAPHICS used for national polling, so regional colouring is derived from the
// live simulation rather than hard-coded per-party results.
const REGIONS = [
  {key:'scot',  name:'Scotland',              demoMix:{rural:0.55, working:0.45}, grid:{col:'5 / 9',  row:'1 / 3'}},
  {key:'ni',    name:'Northern Ireland',       demoMix:{rural:0.6,  working:0.4},  grid:{col:'1 / 4',  row:'2 / 4'}},
  {key:'ne',    name:'North East',             demoMix:{working:0.65, middle:0.35}, grid:{col:'7 / 10', row:'3 / 5'}},
  {key:'nw',    name:'North West',             demoMix:{working:0.55, urban:0.45}, grid:{col:'4 / 7',  row:'4 / 6'}},
  {key:'yorks', name:'Yorkshire & the Humber', demoMix:{working:0.6, middle:0.4},  grid:{col:'7 / 10', row:'5 / 7'}},
  {key:'wal',   name:'Wales',                  demoMix:{rural:0.6,  working:0.4},  grid:{col:'1 / 4',  row:'6 / 9'}},
  {key:'emid',  name:'East Midlands',          demoMix:{middle:0.5, rural:0.5},   grid:{col:'7 / 10', row:'7 / 9'}},
  {key:'wmid',  name:'West Midlands',          demoMix:{working:0.5, suburban:0.5}, grid:{col:'4 / 7', row:'7 / 9'}},
  {key:'east',  name:'East of England',        demoMix:{suburban:0.55, rural:0.45}, grid:{col:'7 / 11', row:'9 / 11'}},
  {key:'lon',   name:'London',                 demoMix:{urban:0.55, business:0.45}, grid:{col:'6 / 9', row:'11 / 13'}},
  {key:'se',    name:'South East',             demoMix:{suburban:0.5, business:0.5}, grid:{col:'4 / 11', row:'13 / 15'}},
  {key:'sw',    name:'South West',             demoMix:{rural:0.55, pensioners:0.45}, grid:{col:'1 / 6', row:'11 / 15'}},
];

function affinity(stanceVec, demo){
  let dist=0;
  POLICY_AREAS.forEach(p=>{
    const d = Math.abs((stanceVec[p.key]||0) - demo.ideal[p.key]);
    dist += d * (demo.weight[p.key]||0);
  });
  return clamp(100 - dist/2, 1, 100);
}

function calcPolls(){
  const parties = [{id:'you',stance:G.you.stance}].concat(G.rivals.map(r=>({id:r.id, stance:r.stance})));
  let youApprovalMod = (G.approval-50)*0.4 + (G.trust-50)*0.25 + G.momentum;
  if(G.leaderTrait==='ideologue') youApprovalMod *= 1.25;

  let totals = {you:0, gov:0, opp:0, oth:0};
  const demoBreak = {};
  DEMOGRAPHICS.forEach(demo=>{
    const scores = {};
    parties.forEach(p=>{
      let a = affinity(p.stance, demo);
      if(p.id==='you'){ a = clamp(a + youApprovalMod*0.5, 1, 140); }
      else { const r=G.rivals.find(r=>r.id===p.id); a = clamp(a + (r.momentum||0)*0.5, 1, 140); }
      scores[p.id]=Math.pow(a,1.6);
    });
    const sum = Object.values(scores).reduce((a,b)=>a+b,0);
    const shares = {};
    Object.keys(scores).forEach(k=>shares[k]=scores[k]/sum*100);
    demoBreak[demo.key] = shares;
    totals.you += shares.you * demo.size/100;
    totals.gov += shares.gov * demo.size/100;
    totals.opp += shares.opp * demo.size/100;
    totals.oth += shares.oth * demo.size/100;
  });
  const grand = totals.you+totals.gov+totals.opp+totals.oth;
  Object.keys(totals).forEach(k=>totals[k]=totals[k]/grand*100);
  G.polls = totals;
  G.demoSupport = demoBreak;
  G.momentum *= 0.85;
  G.rivals.forEach(r=>r.momentum = (r.momentum||0)*0.85);
}

// Largest-remainder allocation: splits `total` whole units across weighted buckets so the
// integer results always sum to exactly `total`, however uneven the weights are.
function allocateByWeight(weights, total){
  const sum = weights.reduce((a,b)=>a+b,0) || 1;
  const raw = weights.map(w=>w/sum*total);
  const floors = raw.map(Math.floor);
  let used = floors.reduce((a,b)=>a+b,0);
  let remainder = total - used;
  const order = raw.map((v,i)=>({i,frac:v-floors[i]})).sort((a,b)=>b.frac-a.frac);
  for(let i=0;i<remainder;i++) floors[order[i].i]++;
  return floors;
}

function seatsFromPollShare(shareMap){
  const keys = Object.keys(shareMap);
  const weights = keys.map(k=>Math.pow(Math.max(shareMap[k],0.5), 1.35));
  const alloc = allocateByWeight(weights, TOTAL_SEATS);
  const out={};
  keys.forEach((k,i)=>out[k]=alloc[i]);
  return out;
}

// Splits each party's TRUE national seat total across the 12 UK regions, weighted by
// each region's demographic mix (via the live `G.demoSupport` from calcPolls()). Because
// each party's own total is distributed independently with largest-remainder rounding,
// the regional totals always sum back to exactly that party's real seat count — this is
// a stylised regional guide layered on top of the real numbers, not a separate estimate.
function computeRegionalSeats(){
  const totals = {
    you: G.seats,
    gov: G.rivals.find(r=>r.id==='gov').seats,
    opp: G.rivals.find(r=>r.id==='opp').seats,
    oth: G.rivals.find(r=>r.id==='oth').seats,
  };
  const out = {};
  REGIONS.forEach(r=>{ out[r.key] = {you:0, gov:0, opp:0, oth:0}; });
  ['you','gov','opp','oth'].forEach(pid=>{
    const total = totals[pid];
    if(total<=0) return;
    const weights = REGIONS.map(r=>{
      let num=0, den=0;
      Object.entries(r.demoMix).forEach(([dk,w])=>{
        const shares = G.demoSupport[dk];
        const share = (shares && shares[pid]!=null) ? shares[pid] : 25;
        num += share*w; den += w;
      });
      return den ? num/den : 1;
    });
    const alloc = allocateByWeight(weights, total);
    REGIONS.forEach((r,i)=>{ out[r.key][pid] = alloc[i]; });
  });
  return out;
}

function staffSkill(roleKey){
  const s = G.staff.find(s=>s.role===roleKey);
  return s? effectiveSkill(s) : 0;
}

// The "inner circle": portfolio-holding MPs and hired staff — the people who actually
// work closely together day to day. Backbenchers keep a personality (for rebellion odds
// and flavour) but aren't part of this network; with dozens or hundreds of them, pairwise
// relationships wouldn't be meaningful or cheap to track.
function innerCircle(){
  return G.mps.filter(m=>m.portfolio).concat(G.staff);
}
// A person's average compatibility with everyone else in the inner circle, roughly -2..2.
function personChemistry(person){
  const circle = innerCircle();
  if(circle.length<=1) return 0;
  let total=0, count=0;
  circle.forEach(other=>{
    if(other===person) return;
    total += personalityCompat(person.personality, other.personality);
    count++;
  });
  return count ? total/count : 0;
}
function effectiveSkill(s){ return clamp(s.skill + personChemistry(s)*6, 0, 100); }
function effectiveCompetence(mp){ return clamp(mp.competence + personChemistry(mp)*6, 0, 100); }

function openHireOfferModal(candId){
  const cand = G.staffMarket.find(c=>c.id===candId);
  if(!cand) return;
  G.pendingEvent = {type:'hire-offer', candId, title:`Negotiate with ${cand.name}`,
    text:`${cand.name} is looking for work as a ${cand.roleName} (skill ${cand.skill}). Their asking salary is ${fmtMoney(cand.salary)}/week. What do you offer?`};
  showEventModal();
}
function proposeHire(candId, tier){
  const cand = G.staffMarket.find(c=>c.id===candId);
  G.pendingEvent = null;
  if(!cand){ closeModal(); render(); return; }
  const mult = tier==='low' ? 0.8 : tier==='high' ? 1.25 : 1.0;
  const offeredSalary = Math.round(cand.salary*mult);
  const signingFee = Math.round(offeredSalary*2);
  if(G.funds < signingFee){ alertModal('Cannot Afford', `That offer needs a signing fee of ${fmtMoney(signingFee)}.`); render(); return; }
  let acceptChance = 0.92;
  if(tier==='low') acceptChance = clamp(0.7 - cand.skill/200, 0.1, 0.75);
  else if(tier==='high') acceptChance = 0.99;
  if(Math.random() < acceptChance){
    G.funds -= signingFee;
    G.staff.push({id:uid(), name:cand.name, role:cand.role, roleName:cand.roleName, personality:cand.personality, skill:cand.skill, salary:offeredSalary, morale: tier==='high'?85:70});
    G.staffMarket = G.staffMarket.filter(c=>c.id!==candId);
    log(`Hired ${cand.name} as ${cand.roleName} at ${fmtMoney(offeredSalary)}/wk (signing fee ${fmtMoney(signingFee)}).`, 'lognew');
  } else {
    log(`${cand.name} turns down your offer of ${fmtMoney(offeredSalary)}/wk and stays on the market.`);
    if(tier==='low' && Math.random()<0.3){
      G.staffMarket = G.staffMarket.filter(c=>c.id!==candId);
      log(`${cand.name} is insulted by the lowball offer and withdraws from consideration entirely.`, 'lognew');
    }
  }
  save(); closeModal(); render();
}

function fireStaff(id){
  const s = G.staff.find(s=>s.id===id);

  G.staff = G.staff.filter(s=>s.id!==id);

}

function giveRaise(id){

}
function cutPay(id){

  s.salary = Math.max(200, Math.round(s.salary*0.85));

function pepTalkStaff(id){
  const s = G.staff.find(s=>s.id===id);
  if(!s) return;
  if(!spendAP(1)){ alertModal('No Action Points', 'A pep talk still takes an Action Point.'); return; }
  const oratorBonus = G.leaderTrait==='orator' ? 8 : 0;
  const roll = rand(0,100) + oratorBonus;
  const curMorale = s.morale===undefined ? 70 : s.morale;
  const headroom = 100-curMorale;
  let gain, text;
  if(roll>65){ gain = Math.round(headroom*0.3)+8; text = `${s.name} appreciates the personal encouragement.`; }
  else if(roll>30){ gain = Math.round(headroom*0.12)+3; text = `A decent chat with ${s.name}.`; }
  else { gain = -2; text = `The pep talk with ${s.name} falls a bit flat.`; }
  s.morale = clamp(curMorale+gain, 0, 100);
  log(`[Pep Talk] ${text} (${fmtSigned(gain)} morale)`);
  save(); render();
  openStaffDetailModal(id);
}

// Staff whose pay falls behind what their skill would fetch on the open market slowly
// lose morale, and can eventually quit; well-paid staff drift toward contentment.
function checkStaffMorale(){
  for(let i=G.staff.length-1;i>=0;i--){
    const s = G.staff[i];
    if(s.morale===undefined) s.morale = 70;
    const marketRate = 400 + s.skill*12;
    const chem = personChemistry(s);
    const target = clamp(50 + (s.salary-marketRate)/40 + chem*8, 5, 95);
    s.morale = clamp(s.morale + (target-s.morale)*0.1 + rand(-2,2), 0, 100);
    if(s.morale<15 && Math.random()<0.15){
      log(`${s.name} (${s.roleName}) resigns, fed up with being underpaid and undervalued.`, 'lognew');
      G.staff.splice(i,1);
      G.unity = clamp(G.unity-2,0,100);
    }
  }
}

// Cabinet/Shadow Cabinet MPs' loyalty drifts with how well their personality meshes with
// the rest of the inner circle, and the odd flavour line calls out a notable clash or
// friendship — the same chemistry that quietly shapes morale and effective competence.
function updateInnerCircleRelations(){
  const circle = innerCircle();
  if(circle.length<2) return;
  G.mps.filter(m=>m.portfolio).forEach(mp=>{
    const chem = personChemistry(mp);
    mp.loyalty = clamp(mp.loyalty + chem*1.5 + rand(-1,1), 0, 100);
  });
  if(Math.random() < 0.15){
    const a = choice(circle);
    const others = circle.filter(p=>p!==a);
    if(others.length){
      const b = choice(others);
      const compat = personalityCompat(a.personality, b.personality);
      if(compat<=-1) log(`[Team Dynamics] ${a.name} and ${b.name} are clashing behind the scenes — it's affecting the mood in the office.`);
      else if(compat>=1) log(`[Team Dynamics] ${a.name} and ${b.name} have struck up a strong working relationship.`);
    }
  }
}

// Keeps the candidate market from going stale: a couple of slots turn over periodically
// instead of the market only refreshing at General Elections.
function maybeRefreshStaffMarket(){
  if((G.week - (G.lastStaffRefreshWeek||0)) < 10) return;
  G.lastStaffRefreshWeek = G.week;
  const rotateOut = Math.min(2, G.staffMarket.length);
  for(let i=0;i<rotateOut;i++){
    if(Math.random()<0.6) G.staffMarket.shift();
  }
  let added = false;
  while(G.staffMarket.length<5){
    const role = choice(STAFF_ROLES);
    const skill = randi(35,95);
    G.staffMarket.push({id:uid(), name:randomName(), role:role.key, roleName:role.name, personality:randomPersonality(), skill, salary:Math.round(400+skill*12+rand(-100,100))});
    added = true;
  }
  if(added) log('New candidates appear on the staff market.');
}

function assignPortfolio(mpId, portfolio){
  const mp = G.mps.find(m=>m.id===mpId);
  if(!mp) return;
  const hadPortfolio = !!mp.portfolio;
  G.mps.forEach(m=>{
    if(m.id!==mpId && m.portfolio===portfolio){
      m.portfolio=null; m.role='Backbencher';
      if(portfolio && m.ambition>65){
        m.loyalty = clamp(m.loyalty-10,0,100);
        log(`${m.name} is aggrieved at being replaced as ${portfolio}.`);
      }
    }
  });
  mp.portfolio = portfolio || null;
  mp.role = portfolio ? ('Shadow '+portfolio) : 'Backbencher';
  if(portfolio && !hadPortfolio && mp.ambition>65){
    mp.loyalty = clamp(mp.loyalty+8,0,100);
    G.unity = clamp(G.unity+1,0,100);
    log(`${mp.name}'s ambition is satisfied by the promotion to ${portfolio} — their loyalty grows.`);
  } else if(!portfolio && hadPortfolio && mp.ambition>65){
    mp.loyalty = clamp(mp.loyalty-10,0,100);
    log(`${mp.name} is aggrieved at being demoted from their portfolio.`);
  }
  save(); render();
}

function fireMP(mpId){
  const mp = G.mps.find(m=>m.id===mpId);
  if(!mp) return;
  if(!confirm(`Expel ${mp.name} from the party? This triggers a by-election in ${mp.seat} and will damage unity.`)) return;
  G.mps = G.mps.filter(m=>m.id!==mpId);
  G.seats -= 1;
  G.unity = clamp(G.unity-8,0,100);
  log(`${mp.name} has been expelled from the party. A by-election looms in ${mp.seat}.`, 'lognew');
  startByElection(mp.seat, 'you');
  syncMpRosterToSeats();
  save(); render();
}

function meetOneToOne(mpId){
  const mp = G.mps.find(m=>m.id===mpId);
  if(!mp) return;
  if(!spendAP(1)){ alertModal('No Action Points', 'A private conversation still takes an Action Point. You have none left this week.'); return; }
  const oratorBonus = G.leaderTrait==='orator' ? 10 : 0;
  const roll = rand(0,100) + oratorBonus;
  const headroom = 100-mp.loyalty;
  let gain, text;
  if(roll>70){ gain = Math.round(headroom*0.35)+5; text = `${mp.name} responds well to the personal attention.`; }
  else if(roll>30){ gain = Math.round(headroom*0.15)+2; text = `A cordial enough chat with ${mp.name}.`; }
  else { gain = -3; text = `The conversation with ${mp.name} is awkward and doesn't land well.`; }
  mp.loyalty = clamp(mp.loyalty+gain,0,100);
  log(`[1-2-1] ${text} (${fmtSigned(gain)} loyalty)`);
  save(); render();
  openMpDetailModal(mpId);
}

function sendToChiefWhip(mpId){
  const mp = G.mps.find(m=>m.id===mpId);
  if(!mp) return;
  if(!spendAP(1)){ alertModal('No Action Points', 'Getting the whips involved still takes an Action Point.'); return; }
  const whip = G.mps.find(m=>m.portfolio==='Chief Whip');
  const whipSkill = whip ? effectiveCompetence(whip) : 25;
  const personaMod = mp.personality==='maverick' ? -15 : mp.personality==='loyalist' ? 15 : 0;
  const roll = rand(0,100) + (whipSkill-50)*0.4 + personaMod;
  const whipName = whip ? whip.name : "the Whips' Office";
  let gain, text;
  if(roll>65){ gain = randi(10,20); text = `${whipName} lays down the law — ${mp.name} falls into line.`; }
  else if(roll>30){ gain = randi(2,8); text = `${whipName} has a firm word with ${mp.name}. Some effect, but they're not fully won over.`; }
  else { gain = -randi(5,15); text = `${mp.name} resents being hauled in front of the whips and grows more resentful.`; }
  mp.loyalty = clamp(mp.loyalty+gain,0,100);
  log(`[Chief Whip] ${text} (${fmtSigned(gain)} loyalty)`, gain<0?'lognew':'');
  save(); render();
  openMpDetailModal(mpId);
}

// Keeps the individual MP roster (used for Shadow Cabinet/Cabinet assignment) in step
// with the authoritative `G.seats` count — call after anything that changes G.seats.
// Adds fresh backbenchers when the party grows (e.g. a General Election landslide);
// trims backbenchers (lowest competence first, portfolio-holders protected) when it shrinks.
function syncMpRosterToSeats(){
  if(G.mps.length < G.seats){
    const shuffledSeats = [...SEAT_NAMES].sort(()=>Math.random()-0.5);
    const toAdd = G.seats - G.mps.length;
    for(let i=0;i<toAdd;i++){
      G.mps.push({
        id:uid(), name:randomName(), seat:seatNameForIndex(randi(0,9999), shuffledSeats),
        loyalty:randi(45,90), competence:randi(30,90), ambition:randi(20,90), personality:randomPersonality(),
        role:'Backbencher', portfolio:null,
      });
    }
  } else if(G.mps.length > G.seats){
    const toRemove = G.mps.length - G.seats;
    const priority = G.mps.slice().sort((a,b)=>{
      const aHeld = a.portfolio?1:0, bHeld = b.portfolio?1:0;
      if(aHeld!==bHeld) return aHeld-bHeld; // backbenchers first
      return a.competence-b.competence; // weakest backbenchers first
    });
    const removeIds = new Set(priority.slice(0,toRemove).map(m=>m.id));
    G.mps = G.mps.filter(m=>!removeIds.has(m.id));
  }
}

// ---------------------------------------------------------------------
// CONSTITUENCIES — marginality belongs to the seat, not whoever currently
// holds it, so it's tracked by seat name and survives MP turnover (a death,
// an expulsion, a by-election loss). Its main mechanical payoff is scaling
// the incumbency-defence bonus in resolveByElection().
// ---------------------------------------------------------------------
function getSeatMarginality(seatName){
  if(G.seatMarginality[seatName]===undefined) G.seatMarginality[seatName] = randi(25,80);
  return G.seatMarginality[seatName];
}
function adjustSeatMarginality(seatName, delta){
  const cur = getSeatMarginality(seatName);
  G.seatMarginality[seatName] = clamp(cur+delta, 0, 100);
}
function marginalityTag(v){
  if(v>=65) return `<span class="tag good">Safe (${Math.round(v)})</span>`;
  if(v>=35) return `<span class="tag warn">Marginal (${Math.round(v)})</span>`;
  return `<span class="tag bad">Knife-edge (${Math.round(v)})</span>`;
}

function holdSurgery(mpId){
  const mp = G.mps.find(m=>m.id===mpId);
  if(!mp) return;
  if(!spendAP(1)){ alertModal('No Action Points', 'A constituency visit still takes an Action Point.'); return; }
  const oratorBonus = G.leaderTrait==='orator' ? 8 : 0;
  const roll = rand(0,100) + oratorBonus;
  let marginGain, text;
  if(roll>65){ marginGain = randi(5,10); text = `The surgery in ${mp.seat} goes brilliantly — a strong turnout and a warm reception.`; }
  else if(roll>30){ marginGain = randi(2,5); text = `A solid, well-attended surgery in ${mp.seat}.`; }
  else { marginGain = -1; text = `Turnout in ${mp.seat} is thin and a few awkward complaints dominate.`; }
  adjustSeatMarginality(mp.seat, marginGain);
  mp.loyalty = clamp(mp.loyalty+4,0,100);
  G.momentum += marginGain>5 ? 0.6 : 0.2;
  log(`[Constituency Surgery] ${text} (seat ${fmtSigned(marginGain)})`);
  save(); render();
  openMpDetailModal(mpId);
}

function fundCasework(mpId){
  const mp = G.mps.find(m=>m.id===mpId);
  if(!mp) return;
  const cost = 4000;
  if(G.funds<cost){ alertModal('Cannot Afford', `Funding local casework support costs ${fmtMoney(cost)}.`); return; }
  G.funds -= cost;

  save(); render();

function maybeTriggerCaseworkCrisis(){
  if(G.pendingEvent || G.campaign) return;
  if(G.mps.length===0) return;
  if(Math.random() > 0.05) return;
  const mp = choice(G.mps);
  G.pendingEvent = {type:'casework-crisis', mpId:mp.id, title:'Constituency Casework Crisis',
    text:`Local media report that ${mp.name}'s constituency office has a mounting backlog of unresolved casework in ${mp.seat}. How do you respond?`};
  showEventModal();
}
function resolveCaseworkCrisis(choice_){
  const mp = G.mps.find(m=>m.id===G.pendingEvent.mpId);
  if(!mp){ G.pendingEvent=null; closeModal(); render(); return; }
  if(choice_==='fund'){
    const cost = 8000;
    if(G.funds<cost){ alertModal('Cannot Afford', `Emergency casework funding costs ${fmtMoney(cost)}.`); return; }
    G.funds -= cost;
    adjustSeatMarginality(mp.seat, 10);
    mp.loyalty = clamp(mp.loyalty+5,0,100);
    log(`[Casework] You fund emergency support for ${mp.name}'s office. The backlog clears and local opinion improves.`, 'lognew');
  } else if(choice_==='visit'){
    if(!spendAP(1)){ alertModal('No Action Points','A personal intervention still takes an Action Point.'); return; }
    adjustSeatMarginality(mp.seat, 6);
    mp.loyalty = clamp(mp.loyalty+8,0,100);
    G.momentum += 0.5;
    log(`[Casework] You personally step in to help clear the backlog in ${mp.seat}. ${mp.name} is grateful, and it plays well locally.`, 'lognew');
  } else {
    adjustSeatMarginality(mp.seat, -10);
    mp.loyalty = clamp(mp.loyalty-5,0,100);
    G.momentum -= 0.5;
    log(`[Casework] The backlog goes unresolved. ${mp.name}'s standing in ${mp.seat} takes a hit.`, 'lognew');
  }
  G.pendingEvent = null;
  calcPolls(); save(); closeModal(); render();
}

// ---------------------------------------------------------------------
// WEEKLY ACTIONS (consume Action Points)
// ---------------------------------------------------------------------
function spendAP(n){
  if(G.ap < n) return false;
  G.ap -= n;
  return true;
}

function actionPublicMeeting(demoKey){
  if(!spendAP(1)) return;
  const demo = DEMOGRAPHICS.find(d=>d.key===demoKey);
  const oratorBonus = G.leaderTrait==='orator' ? 10 : 0;
  const roll = rand(0,100) + (G.trust-50)*0.2 + oratorBonus;
  let outcome;
  if(roll > 70){
    outcome = {title:'A Warm Reception', text:`Your town hall in front of ${demo.name.toLowerCase()} goes brilliantly. Applause, good local coverage, and a real sense of connection.`, approval:+3, momentum:+1.2, members:randi(80,220)};
  } else if(roll > 35){
    outcome = {title:"A Steady Meeting", text:`The meeting with ${demo.name.toLowerCase()} passes without incident. A few tough questions, mostly fielded well.`, approval:+1, momentum:+0.3};
  } else if(roll > 12){
    outcome = {title:'A Tense Crowd', text:`Questions from ${demo.name.toLowerCase()} turn hostile over your record. You survive it, but it wasn't pretty.`, approval:-1, momentum:-0.2};
  } else {
    outcome = {title:'A Public Gaffe', text:`You misspeak badly in front of ${demo.name.toLowerCase()}. Clips are already circulating online.`, approval:-4, momentum:-1.5, scandal:true};
  }
  G.approval = clamp(G.approval+outcome.approval,0,100);
  G.momentum += outcome.momentum;
  log(`[Public Meeting] ${outcome.title}: ${outcome.text}`);
  if(outcome.members){ G.members += outcome.members; log(`New members sign up following the event (+${outcome.members}).`); }
  if(outcome.scandal) queueMediaScandal('gaffe', demo.name);
  calcPolls(); save(); render();
}

function actionMediaInterview(){
  if(!spendAP(1)) return;
  const pressSkill = staffSkill('press');
  const oratorBonus = G.leaderTrait==='orator' ? 10 : 0;
  const roll = rand(0,100) + pressSkill*0.25 + (G.trust-50)*0.15 + oratorBonus;
  let outcome;
  if(roll>75){ outcome={title:'Commanding Performance', text:'You dominate the interview, landing every point on message.', approval:+4, trust:+2, momentum:+1.5}; }
  else if(roll>40){ outcome={title:'Solid Outing', text:'A workmanlike interview. Nothing gained, nothing lost.', approval:+1, trust:0, momentum:+0.2}; }
  else if(roll>15){ outcome={title:'Wobbly Answers', text:'You dodge a key question and it shows. Commentators are unimpressed.', approval:-2, trust:-1, momentum:-0.5}; }
  else { outcome={title:'Car-Crash Interview', text:'You are caught completely flat-footed on live television.', approval:-5, trust:-3, momentum:-1.8, scandal:true}; }
  G.approval = clamp(G.approval+outcome.approval,0,100);
  G.trust = clamp(G.trust+(outcome.trust||0),0,100);
  G.momentum += outcome.momentum;
  log(`[Media Interview] ${outcome.title}: ${outcome.text}`);
  if(outcome.scandal) queueMediaScandal('interview');
  calcPolls(); save(); render();
}

function actionFundraising(){
  if(!spendAP(1)) return;
  const fundSkill = staffSkill('fundraiser');
  const base = randi(3000,9000);
  let gain = Math.round(base * (1 + fundSkill/120) * clamp(0.75 + G.members/40000, 0.75, 1.5));
  if(G.leaderTrait==='fixer') gain = Math.round(gain*1.25);
  G.funds += gain;
  log(`[Fundraising Dinner] Raised ${fmtMoney(gain)} for the party.`);

    queueDonationOffer();
  } else {

  }

function actionPartyManagement(){
  if(!spendAP(1)) return;

  if(G.leaderTrait==='organiser') gain = Math.round(gain*1.5);
  G.unity = clamp(G.unity+gain,0,100);

function actionPMQs(){
  if(!spendAP(1)) return;
  const oratorBonus = G.leaderTrait==='orator' ? 10 : 0;
  const roll = rand(0,100) + oratorBonus + (G.trust-50)*0.1;
  let outcome;
  if(!G.governing){
    if(roll>72){ outcome={title:"A Direct Hit at PMQs", text:"Your questions land squarely on the Government's record. The chamber notices.", approval:3, momentum:1.5, govMomentum:-2}; }
    else if(roll>40){ outcome={title:'A Fair Exchange', text:'A workmanlike session at PMQs, neither side landing a killer blow.', approval:0.5, momentum:0.2, govMomentum:-0.2}; }
    else if(roll>15){ outcome={title:'Outmanoeuvred', text:'The Prime Minister brushes off your questions with ease.', approval:-2, momentum:-0.5, govMomentum:0.5}; }
    else { outcome={title:'A Bruising Session', text:'Your own backbenchers wince at how badly that went.', approval:-4, momentum:-1.5, govMomentum:1.5}; }
  } else {
    if(roll>72){ outcome={title:'Commanding the Despatch Box', text:'You bat away every question from the Opposition with total command.', approval:3, momentum:1.5}; }
    else if(roll>40){ outcome={title:'Holding the Line', text:'A competent defence of your record at the despatch box.', approval:0.5, momentum:0.2}; }
    else if(roll>15){ outcome={title:'On the Back Foot', text:'The Opposition land some real blows on your record today.', approval:-2, momentum:-0.5}; }

  log(`[PMQs] ${outcome.title}: ${outcome.text}`);

// ---------------------------------------------------------------------
// POLICY CHANGES
// ---------------------------------------------------------------------
function changePolicy(key, newValue){
  const old = G.you.stance[key];
  const delta = Math.abs(newValue-old);
  if(delta < 3){ G.you.stance[key]=newValue; calcPolls(); save(); render(); return; }
  if(G.ap < 1){ alertModal('No Action Points', 'Announcing a policy shift takes an Action Point. You have none left this week.'); render(); return; }
  spendAP(1);
  G.you.stance[key] = newValue;
  const area = POLICY_AREAS.find(p=>p.key===key);
  let unityHit = Math.round(delta/8);
  if(delta>60) unityHit += 5;
  if(G.leaderTrait==='organiser') unityHit = Math.round(unityHit*0.7);
  if(G.leaderTrait==='ideologue' && delta>30) unityHit = Math.round(unityHit*1.4);
  G.unity = clamp(G.unity-unityHit,0,100);
  log(`[Policy Announcement] You shift party policy on ${area.name} (${fmtSigned(newValue-old)}). Unity ${unityHit>0?'-'+unityHit:'unchanged'}.`, 'lognew');
  recordPartyVote(`Policy: ${area.name} (${fmtSigned(newValue-old)})`);
  calcPolls(); save(); render();
}

// ---------------------------------------------------------------------
// MP VOTING RECORDS — a lightweight per-MP history, generated whenever the
// party takes a collective decision (a policy announcement, a rebellion, a
// conference motion, a Budget). Not a full whipped-division simulation —
// each MP's position is drawn from their loyalty and personality, the same
// inputs that already drive rebellions and whipping elsewhere in the game.
// ---------------------------------------------------------------------
function mpVotePosition(mp){
  let ayeChance = 0.5 + (mp.loyalty-50)/150;
  if(mp.personality==='loyalist') ayeChance += 0.15;
  if(mp.personality==='maverick') ayeChance -= 0.15;
  if(mp.personality==='cynic') ayeChance -= 0.05;
  ayeChance = clamp(ayeChance, 0.05, 0.97);
  const r = Math.random();
  if(r < ayeChance) return 'aye';
  if(r < ayeChance+0.05) return 'abstain';
  return 'no';
}
function recordPartyVote(issue, overrides){
  G.mps.forEach(mp=>{
    const position = (overrides && overrides[mp.id]) || mpVotePosition(mp);
    if(!mp.votingRecord) mp.votingRecord = [];
    mp.votingRecord.unshift({week:G.week, issue, position});
    if(mp.votingRecord.length>20) mp.votingRecord.length = 20;
  });
}

// ---------------------------------------------------------------------
// DONATIONS / BRIBES
// ---------------------------------------------------------------------
function queueDonationOffer(){
  const donor = choice(DONOR_TYPES);
  const area = choice(POLICY_AREAS);
  const direction = Math.random()<0.5 ? 'hi' : 'lo';
  let amount = randi(15000,80000) + (G.tier==='official'?40000:0);
  if(G.leaderTrait==='fixer') amount = Math.round(amount*1.15);
  const ask = `soften your stance toward "${direction==='hi'?area.hi:area.lo}" on ${area.name}`;
  G.pendingEvent = {
    type:'donation', donor, area:area.key, direction, amount,
    title:'A Quiet Word After Dinner',
    text:`After the fundraiser, ${donor} pulls you aside. "I'd like to help the party — ${fmtMoney(amount)}, no complications — if you could ${ask}."`,
  };
  showEventModal();
}

function resolveDonation(choice_){
  const ev = G.pendingEvent;
  if(choice_==='decline'){
    G.trust = clamp(G.trust+2,0,100);
    log(`You decline the offer from ${ev.donor}. Word of your integrity spreads quietly.`);
  } else if(choice_==='open'){
    const openAmount = Math.round(ev.amount*0.5);
    G.funds += openAmount;
    log(`You accept ${fmtMoney(openAmount)} as a declared, public donation from ${ev.donor}. No favours attached.`);
  } else if(choice_==='quiet'){
    G.funds += ev.amount;
    const area = POLICY_AREAS.find(p=>p.key===ev.area);
    const nudge = ev.direction==='hi' ? 15 : -15;
    G.you.stance[ev.area] = clamp(G.you.stance[ev.area]+nudge, -100, 100);
    G.hiddenFavours.push({donor:ev.donor, amount:ev.amount, area:ev.area, weekTaken:G.week, exposeChance:0.045});
    log(`You quietly accept ${fmtMoney(ev.amount)} from ${ev.donor} and adjust course on ${area.name}. This won't stay buried forever.`, 'lognew');
  }
  G.pendingEvent=null;
  calcPolls(); save(); closeModal(); render();
}

function checkFavourExposure(){
  for(let i=G.hiddenFavours.length-1;i>=0;i--){
    const f = G.hiddenFavours[i];
    if(Math.random() < f.exposeChance){
      G.hiddenFavours.splice(i,1);
      exposeScandal(f);
      return;
    } else {
      f.exposeChance = Math.min(f.exposeChance*1.15, 0.4);
    }
  }
}

function exposeScandal(f){
  G.pendingEvent = {
    type:'exposure', favour:f,
    title:'SCANDAL: Cash for Favours',
    text:`An investigative journalist reveals a quiet ${fmtMoney(f.amount)} payment from ${f.donor} back in Week ${f.weekTaken}, and the policy shift that followed. The press wants a response.`,
  };
  showEventModal();
}

function resolveExposure(choice_){
  const f = G.pendingEvent.favour;
  if(choice_==='deny'){
    const roll = Math.random() + (G.trust-50)/200;
    if(roll>0.55){ G.trust=clamp(G.trust-6,0,100); log('Your denial mostly holds, though doubts linger.'); }
    else { G.trust=clamp(G.trust-16,0,100); G.approval=clamp(G.approval-8,0,100); log('Your denial collapses under scrutiny. The damage is severe.', 'lognew'); }
  } else if(choice_==='apologise'){
    G.trust=clamp(G.trust-8,0,100); G.unity=clamp(G.unity-3,0,100);
    log('You apologise publicly and repay the donation. Painful, but survivable.', 'lognew');
    G.funds = Math.max(0, G.funds - Math.round(f.amount*0.4));
  } else if(choice_==='blame'){
    G.trust=clamp(G.trust-10,0,100);
    G.unity=clamp(G.unity-10,0,100);
    log('You blame a since-departed aide for the arrangement. Trust falls; the party is furious at being thrown under the bus.', 'lognew');
  }
  G.momentum -= 2.5;
  G.pendingEvent=null;
  calcPolls(); save(); closeModal(); render();
}

// ---------------------------------------------------------------------
// RIVAL POLICY DRIFT — parties are not static; they recalibrate over time
// ---------------------------------------------------------------------
function driftRivals(){
  G.rivals.forEach(r=>{
    if(Math.random() > 0.35) return;
    const area = choice(POLICY_AREAS);
    const key = area.key;
    // the weighted-average ideal position on this axis across the whole electorate
    let num=0, den=0;
    DEMOGRAPHICS.forEach(d=>{ const w=(d.weight[key]||0)*d.size; num += d.ideal[key]*w; den += w; });
    const target = den ? num/den : 0;
    const cur = r.stance[key];
    const step = clamp((target-cur)*0.15, -8, 8) + rand(-3,3);
    r.stance[key] = clamp(cur+step, -100, 100);
    if(Math.abs(step) > 4){
      log(`[Policy Shift] ${r.name} recalibrates its position on ${area.name}.`);
    }
  });
}

// ---------------------------------------------------------------------
// GOVERNMENT DEPARTMENTS — only active once you form the Government
// ---------------------------------------------------------------------
function runDepartments(){
  if(!G.governing || !G.departments) return;
  let best=null, worst=null;
  POLICY_AREAS.forEach(p=>{
    const dept = G.departments[p.key];
    const minister = G.mps.find(m=>m.portfolio===p.name);
    const competence = minister ? effectiveCompetence(minister) : 30; // an unstaffed department drifts to a poor baseline
    const target = clamp(competence + rand(-5,5), 0, 100);
    dept.performance = clamp(dept.performance + (target-dept.performance)*0.12, 0, 100);
    if(!best || dept.performance>G.departments[best].performance) best=p.key;
    if(!worst || dept.performance<G.departments[worst].performance) worst=p.key;
  });
  const deliveryScore = POLICY_AREAS.reduce((a,p)=>a+G.departments[p.key].performance,0)/POLICY_AREAS.length;
  G.trust = clamp(G.trust + (deliveryScore-55)*0.01, 0, 100);
  G.approval = clamp(G.approval + (deliveryScore-55)*0.015, 0, 100);

  if(best && G.departments[best].performance>78 && Math.random()<0.10){
    log(`[Delivery] ${POLICY_AREAS.find(p=>p.key===best).name} is praised as a rare government success story.`, 'lognew');
    G.momentum += 0.8;
  }
  if(worst && G.departments[worst].performance<28 && Math.random()<0.10){
    log(`[Crisis] ${POLICY_AREAS.find(p=>p.key===worst).name} is under fire after another damaging report.`, 'lognew');
    G.momentum -= 0.8;
  }
  if(deliveryScore>=80) unlockAchievement('delivery80','Well-Oiled Machine — average departmental performance above 80');
}

// A floor motion: delegates can force a vote pulling policy back toward the
// platform the party was founded on (`G.founding`), wherever the leadership has
// drifted furthest from it. Only fires when that drift is actually meaningful.
function triggerConferenceMotion(){
  let bestKey=null, bestGap=-1;
  POLICY_AREAS.forEach(p=>{
    const gap = Math.abs(G.you.stance[p.key]-G.founding[p.key]);
    if(gap>bestGap){ bestGap=gap; bestKey=p.key; }
  });
  if(bestGap<15){
    log('[Party Conference] No major floor motions this year — the platform is still broadly in line with where the party began.');
    return;
  }
  const area = POLICY_AREAS.find(p=>p.key===bestKey);
  const pullsHigh = G.founding[bestKey] > G.you.stance[bestKey];
  G.pendingEvent = {type:'conference-motion', area:bestKey,
    title:'Conference Floor Motion',
    text:`Delegates have tabled a motion on ${area.name}, calling for the party to move back toward "${pullsHigh?area.hi:area.lo}" — closer to where ${G.partyName} first stood. It goes to a card vote on the conference floor.`};
  showEventModal();
}
function resolveConferenceMotion(choiceKey){
  const ev = G.pendingEvent;
  const key = ev.area;
  const area = POLICY_AREAS.find(p=>p.key===key);
  const gap = G.founding[key]-G.you.stance[key];
  if(choiceKey==='whip'){
    const organiserBonus = G.leaderTrait==='organiser' ? 10 : 0;
    const roll = rand(0,100) + (G.unity-50)*0.4 + organiserBonus;
    if(roll>50){
      G.unity = clamp(G.unity-3,0,100);
      log(`[Conference Motion] You whip hard and the platform holds. Some delegates leave grumbling.`, 'lognew');
    } else {
      G.you.stance[key] = clamp(G.you.stance[key] + gap*0.6, -100, 100);
      G.unity = clamp(G.unity-8,0,100);
      log(`[Conference Motion] The whipping operation fails — delegates defeat the leadership and ${area.name} policy shifts on the floor.`, 'lognew');
    }
  } else if(choiceKey==='accept'){
    G.you.stance[key] = clamp(G.you.stance[key] + gap*0.7, -100, 100);
    G.unity = clamp(G.unity+6,0,100);
    log(`[Conference Motion] You accept the motion. ${area.name} policy shifts to match the mood of the conference floor.`, 'lognew');
  } else {
    G.you.stance[key] = clamp(G.you.stance[key] + gap*0.3, -100, 100);
    G.unity = clamp(G.unity+2,0,100);
    log(`[Conference Motion] You broker a compromise on ${area.name}, moving some way toward the delegates without a full reversal.`, 'lognew');
  }
  recordPartyVote(`Conference motion: ${area.name}`);
  G.pendingEvent = null;
  calcPolls(); save(); closeModal(); render();
}

// ---------------------------------------------------------------------
// MP REBELLIONS
// ---------------------------------------------------------------------
function maybeTriggerRebellion(){
  if(G.pendingEvent) return;
  const pool = G.mps.filter(m=>!m.portfolio);
  if(pool.length===0) return;
  const chance = G.unity<55 ? 0.14 : 0.04;
  if(Math.random()>chance) return;
  // ambitious backbenchers passed over for a portfolio are the likeliest troublemakers —
  // mavericks are especially prone to it, loyalists especially reluctant
  const personaMult = m => m.personality==='maverick' ? 1.4 : m.personality==='loyalist' ? 0.6 : 1;
  const weights = pool.map(m=>Math.max(m.ambition,1)*personaMult(m));
  const total = weights.reduce((a,b)=>a+b,0);
  let roll = Math.random()*total;
  let mp = pool[0];
  for(let i=0;i<pool.length;i++){ if(roll<weights[i]){ mp=pool[i]; break; } roll-=weights[i]; }
  G.pendingEvent = {type:'rebellion', mp,
    title:'A Backbench Rebellion',
    text:`${mp.name} (${mp.seat}) is threatening to vote against the party line and is rallying others to join. How do you handle it?`};
  showEventModal();
}
function resolveRebellion(choice_){
  const mp = G.pendingEvent.mp;
  let instigatorVote = 'no';
  if(choice_==='whip'){
    const roll = Math.random() + (mp.loyalty)/200;
    if(roll>0.6){ G.unity=clamp(G.unity-3,0,100); log(`You whip hard. ${mp.name} falls into line, grumbling.`); instigatorVote='aye'; }
    else { G.unity=clamp(G.unity-10,0,100); mp.loyalty=clamp(mp.loyalty-20,0,100); log(`${mp.name} defies the whip anyway. The party looks divided.`, 'lognew'); }
  } else if(choice_==='free'){
    G.unity=clamp(G.unity+3,0,100); G.momentum-=0.5;
    log('You allow a free vote. Unity holds, though it looks a little chaotic to outsiders.');
  } else if(choice_==='concede'){
    G.unity=clamp(G.unity+6,0,100); mp.loyalty=clamp(mp.loyalty+15,0,100); G.momentum-=1;
    log(`You concede ground to ${mp.name}. Unity improves, but you look reactive.`);
    instigatorVote = 'aye';
  }
  recordPartyVote(`Backbench motion led by ${mp.name}`, {[mp.id]:instigatorVote});
  G.pendingEvent=null;
  calcPolls(); save(); closeModal(); render();
}

function maybeTriggerByElection(){
  if(G.byElection) return;
  if(G.campaign) return;
  if(G.pendingEvent) return;
  let chance = 0.05 + (100-G.unity)/100*0.05;
  if(Math.random() > chance) return;
  const holders = [{id:'you', seats:G.seats}].concat(G.rivals.map(r=>({id:r.id, seats:r.seats})));
  const total = holders.reduce((a,h)=>a+h.seats,0);
  if(total<=0) return;
  let roll = Math.random()*total;
  let holder = holders[0].id;
  for(const h of holders){ if(roll<h.seats){ holder=h.id; break;} roll-=h.seats; }
  const seatName = choice(SEAT_NAMES)+' '+choice(['North','South','East','West','Central']);
  startByElection(seatName, holder);
}

function selectByElectionCandidate(kind){

function campaignByElection(){
  if(!G.byElection || G.byElection.candidateQuality==null) return;
  if(!spendAP(1)){ alertModal('No Action Points','You have no Action Points left to campaign this week.'); return; }
  const mgrSkill = staffSkill('campaign');
  const gain = (8 + mgrSkill*0.1 + rand(-2,4)) * clamp(0.8 + G.members/60000, 0.8, 1.3);
  G.byElection.effort += gain;
  log(`[By-Election: ${G.byElection.seat}] Your campaign team pushes hard on the ground. Local momentum grows.`);
  save(); render();
}

function spendOnByElection(amount){
  if(!G.byElection || G.byElection.candidateQuality==null) return;
  if(G.funds < amount) return;
  G.funds -= amount;
  G.byElection.spend += amount;
  G.byElection.effort += amount/1200;
  log(`[By-Election: ${G.byElection.seat}] You commit ${fmtMoney(amount)} to the local campaign.`);
  save(); render();
}

function tickByElection(){
  if(!G.byElection) return;
  if(G.byElection.candidateQuality==null) return; // waiting on candidate selection
  G.byElection.weeksLeft -= 1;
  if(G.byElection.weeksLeft<=0){
    resolveByElection();
  }
}

// Shared by the actual by-election resolution and (for players who've hired a Pollster)
// a live win-probability estimate, so the displayed odds are never a separate guess.
function byElectionScores(be){
  const scores = {you:G.polls.you, gov:G.polls.gov, opp:G.polls.opp, oth:G.polls.oth};
  scores.you += be.effort*0.5 + ((be.candidateQuality||50)-50)*0.15;
  // incumbency defence scales with how safe the seat actually is (worth 6 at a
  // "neutral" marginality of 50, ranging up toward ~10 for safe seats and down
  // toward ~0 for a knife-edge one)
  scores[be.holder] += 6 + (getSeatMarginality(be.seat)-50)/8;
  const sum = Object.values(scores).reduce((a,b)=>a+Math.max(b,1),0);
  return {scores, sum};
}
function byElectionWinProbability(be){
  const {scores, sum} = byElectionScores(be);
  return Math.round(Math.max(scores.you,1)/sum*100);
}

function resolveByElection(){
  const be = G.byElection;
  const {scores, sum} = byElectionScores(be);
  let roll = Math.random()*sum;
  let winner='you';
  for(const k of Object.keys(scores)){ const v=Math.max(scores[k],1); if(roll<v){winner=k;break;} roll-=v; }

  const winnerName = winner==='you'? G.partyName : G.rivals.find(r=>r.id===winner).name;
  const holderName = be.holder==='you'? G.partyName : (G.rivals.find(r=>r.id===be.holder)?.name||'Others');
  const seatsBefore = G.seats;

  if(be.holder!==winner){
    if(be.holder==='you') G.seats -=1; else { const r=G.rivals.find(r=>r.id===be.holder); if(r) r.seats-=1; }
    if(winner==='you'){ G.seats+=1;
      G.mps.push({id:uid(), name:be.candidateName||randomName(), seat:be.seat, loyalty:randi(50,85), competence:randi(35,80), ambition:randi(20,80), personality:randomPersonality(), role:'Backbencher', portfolio:null});
    } else { const r=G.rivals.find(r=>r.id===winner); if(r) r.seats+=1; }
    syncMpRosterToSeats();
    adjustSeatMarginality(be.seat, randi(15,35) - getSeatMarginality(be.seat)); // freshly flipped, not yet entrenched
  } else {
    adjustSeatMarginality(be.seat, 4); // successfully defended — grows a little safer
  }
  const seatsAfter = G.seats;

  const won = winner==='you';
  const gain = won && be.holder!=='you';
  const lost = !won && be.holder==='you';
  if(won){
    G.momentum += (gain?4:1.5); G.approval=clamp(G.approval+(gain?5:2),0,100);
    if(gain) unlockAchievement('firstbygain','First Blood — gained a seat at a by-election');
  } else {
    G.momentum -= (lost?4:1); G.approval=clamp(G.approval-(lost?4:1),0,100);
  }

  let title, text;
  if(gain){
    title = 'Seat Gained!';
    text = `${G.partyName} GAINS ${be.seat} from ${holderName}! Your seat total rises from ${seatsBefore} to ${seatsAfter}.`;
  } else if(won){
    title = 'Seat Held';
    text = `${G.partyName} successfully defends ${be.seat}. It was already yours, so your seat total is unchanged at ${seatsAfter}.`;
  } else if(lost){
    title = 'Seat Lost';
    text = `${winnerName} takes ${be.seat} from you. Your seat total falls from ${seatsBefore} to ${seatsAfter}.`;
  } else {
    title = 'By-Election Lost';
    text = `${winnerName} wins ${be.seat} (previously held by ${holderName}). It was never your seat, so your total is unaffected, remaining at ${seatsAfter}.`;
  }

  log(`[By-Election Result: ${be.seat}] ${winnerName} wins the seat (previously ${holderName}).`, 'lognew');
  G.byElection = null;
  calcPolls();
  G.pendingEvent = {type:'byelection-result', title, text};
  save();
  showEventModal();
}

// ---------------------------------------------------------------------
// LEADERSHIP CHALLENGE
// ---------------------------------------------------------------------
function checkLeadershipChallenge(){
  if(G.unity < 20) G.lowUnityStreak++; else G.lowUnityStreak = Math.max(0,G.lowUnityStreak-1);
  const threshold = G.minorityGovt ? 2 : 4;
  if(G.lowUnityStreak >= threshold){
    G.lowUnityStreak = 0;
    triggerLeadershipChallenge();
  }
}

function triggerLeadershipChallenge(){
  const survivalChance = clamp((G.unity + G.approval)/2, 5, 90)/100;
  const roll = Math.random();
  if(roll < survivalChance){
    G.unity = clamp(G.unity+15,0,100);
    G.pendingEvent = {type:'info', title:'Leadership Challenge Survived',
      text:`Restless MPs force a confidence vote in your leadership. After a tense meeting, you survive — but you know the peace is fragile.`};
  } else {
    G.gameOver = true;
    G.gameOverReason = `Your own MPs voted no confidence in your leadership after ${G.week} weeks in charge of ${G.partyName}. You have been ousted.`;
    G.pendingEvent = {type:'gameover', title:'OUSTED', text:G.gameOverReason};
  }
  showEventModal();
  save();
}

// ---------------------------------------------------------------------
// MOTION OF NO CONFIDENCE — the mirror-image tool available to an Opposition
// ---------------------------------------------------------------------
function canTableNoConfidence(){
  if(G.governing || G.campaign || G.gameOver) return false;
  const govRival = G.rivals.find(r=>r.governing);
  if(!govRival || govRival.seats>=MAJORITY) return false;
  if((G.week - (G.lastNoConfidenceWeek||0)) < 26) return false;
  return true;
}
function tableNoConfidence(){
  if(!canTableNoConfidence()) return;
  if(!spendAP(1)) return;
  G.lastNoConfidenceWeek = G.week;
  const govRival = G.rivals.find(r=>r.governing);
  const shortfall = MAJORITY - govRival.seats;
  const weaknessBonus = clamp((50-G.polls[govRival.id])*0.4, -10, 20) + clamp(-(govRival.momentum||0), -10, 10);
  const chance = clamp(0.15 + shortfall*0.01 + weaknessBonus/100, 0.05, 0.75);
  if(Math.random() < chance){
    log(`[No Confidence] The Government loses a confidence vote in the Commons! A General Election is triggered immediately.`, 'lognew');
    G.momentum += 3;
    beginCampaignPhase();
  } else {
    log(`[No Confidence] Your motion of no confidence is defeated. The Government survives — for now.`, 'lognew');
    G.unity = clamp(G.unity-5,0,100);
    G.momentum -= 1.5;
  }
  calcPolls(); save(); render();
}

// ---------------------------------------------------------------------
// GENERAL ELECTION
// ---------------------------------------------------------------------
function canCallSnapElection(){
  return !G.campaign && !G.gameOver && G.termWeek >= MIN_SNAP_WEEK;
}

function callSnapElection(){
  if(!canCallSnapElection()) return;
  if(!confirm('Call a snap General Election now? This begins a 4-week national campaign and cannot be undone.')) return;
  const gambleRoll = rand(-3,3);
  G.momentum += gambleRoll;
  log(`You call a snap General Election, ${G.termLength-G.termWeek} weeks earlier than required.`, 'lognew');
  beginCampaignPhase();
}

function beginCampaignPhase(){
  G.campaign = {weeksLeft:CAMPAIGN_PHASE_LEN, manifestoLocked:false, debateDone:false, finalPushDone:false};
  G.byElection = null;
  log('=== THE GENERAL ELECTION CAMPAIGN BEGINS ===', 'lognew');
  save();
}

function campaignManifestoLaunch(){
  if(!G.campaign || G.campaign.manifestoLocked) return;
  if(!spendAP(1)) return;
  let bestFit = 0;
  DEMOGRAPHICS.forEach(d=>{ const a=affinity(G.you.stance,d); if(a>bestFit) bestFit=a; });
  const boost = clamp((bestFit-50)/10, -2, 4);
  G.momentum += boost;
  G.campaign.manifestoLocked = true;
  G.manifesto = {...G.you.stance};
  G.manifestoBroken = [];
  log(`[Manifesto Launch] You unveil your General Election manifesto. Reception: ${boost>=1?'strong':boost>=0?'mixed':'poor'}.`, 'lognew');
  calcPolls(); save(); render();
}

function campaignTvDebate(){
  if(!G.campaign || G.campaign.debateDone) return;
  if(!spendAP(1)) return;
  const pressSkill = staffSkill('press');
  const oratorBonus = G.leaderTrait==='orator' ? 10 : 0;
  const roll = rand(0,100) + pressSkill*0.2 + (G.trust-50)*0.2 + (G.approval-50)*0.15 + oratorBonus;
  let swing;
  if(roll>75){ swing=4.5; log("[TV Leaders' Debate] You land the standout moment of the night. Overnight polls swing your way.", 'lognew'); }
  else if(roll>45){ swing=1; log("[TV Leaders' Debate] A solid, unspectacular debate performance."); }
  else if(roll>20){ swing=-1.5; log("[TV Leaders' Debate] You struggle to land a punch. Rivals look sharper."); }
  else { swing=-4; log("[TV Leaders' Debate] A moment you misspeak becomes the only clip anyone shares.", 'lognew'); }
  G.momentum += swing;
  G.campaign.debateDone = true;
  calcPolls(); save(); render();
}

function campaignFinalPush(spend){
  if(!G.campaign || G.campaign.finalPushDone) return;
  if(G.funds < spend) return;
  G.funds -= spend;
  const boost = clamp(spend/15000, 0, 5);
  G.momentum += boost;
  G.campaign.finalPushDone = true;
  log(`[Final Push] You spend ${fmtMoney(spend)} on last-minute advertising and canvassing across the marginals.`, 'lognew');
  calcPolls(); save(); render();
}

function tickCampaignPhase(){
  if(!G.campaign) return;
  G.campaign.weeksLeft -= 1;
  if(G.campaign.weeksLeft<=0){
    runGeneralElection();
  }
}

function runGeneralElection(){
  calcPolls();
  const seatResult = seatsFromPollShare(G.polls);
  const results = {
    you:{name:G.partyName, seats:seatResult.you, poll:G.polls.you},
    gov:{name:G.rivals.find(r=>r.id==='gov').name, seats:seatResult.gov, poll:G.polls.gov},
    opp:{name:G.rivals.find(r=>r.id==='opp').name, seats:seatResult.opp, poll:G.polls.opp},
    oth:{name:G.rivals.find(r=>r.id==='oth').name, seats:seatResult.oth, poll:G.polls.oth},
  };
  const ranked = Object.entries(results).sort((a,b)=>b[1].seats-a[1].seats);
  const [leaderId, leaderRes] = ranked[0];

  if(leaderRes.seats >= MAJORITY){
    const formsGovt = (leaderId==='you');
    finishElection(results, ranked, leaderId==='you'?'majority-you':'majority-other', formsGovt, false, null, leaderId, false, false);
    return;
  }

  if(leaderId==='you'){
    // The player's party has the most seats but no majority — they choose how to proceed.
    const opts = G.rivals.map(r=>{
      const combined = leaderRes.seats + r.seats;
      let askKey=null, askAbs=-1;
      POLICY_AREAS.forEach(p=>{ const d=Math.abs(G.you.stance[p.key]-r.stance[p.key]); if(d>askAbs){askAbs=d; askKey=p.key;} });
      return {id:r.id, name:r.name, seats:r.seats, combined, viable: combined>=MAJORITY, askKey};
    });
    G.pendingEvent = {
      type:'coalition-talks', results, ranked, opts,
      title:'Coalition Talks',
      text:`${G.partyName} wins the most seats (${leaderRes.seats}) but falls short of the ${MAJORITY} needed for a majority. How do you proceed?`,
    };
    showEventModal();
    save();
    return;
  }

  // A rival leads and you are not in a position to negotiate — resolve automatically.
  const [secondId, secondRes] = ranked[1];
  let outcome, coalition=false, partnerName=null, juniorPartner=false;
  if(leaderRes.seats + secondRes.seats >= MAJORITY){
    coalition = true; partnerName = results[secondId].name;
    outcome = secondId==='you' ? 'coalition-you' : 'coalition-other';
    juniorPartner = (secondId==='you');
  } else {
    outcome = 'hung';
  }
  finishElection(results, ranked, outcome, false, coalition, partnerName, leaderId, juniorPartner, false);
}

function finishElection(results, ranked, outcome, formsGovt, coalition, partnerName, govId, juniorPartner, minorityGovt){
  G.minorityGovt = !!minorityGovt;
  G.governing = (govId==='you');
  G.rivals.forEach(r=>r.governing = (r.id===govId));
  if(G.governing && !G.departments){
    G.departments = {};
    POLICY_AREAS.forEach(p=>{ G.departments[p.key] = {performance:55}; });
  }

  G.electionHistory.push({term:G.termNumber, results, outcome, week:G.week});
  G.campaign = null;

  G.seats = results.you.seats;
  G.rivals.find(r=>r.id==='gov').seats = results.gov.seats;
  G.rivals.find(r=>r.id==='opp').seats = results.opp.seats;
  G.rivals.find(r=>r.id==='oth').seats = results.oth.seats;
  syncMpRosterToSeats();

  G.won = formsGovt;
  let verdict;
  if(formsGovt && G.minorityGovt) verdict = `${G.partyName} forms a fragile minority Government, without a formal coalition partner. You are the new Prime Minister — for now.`;
  else if(formsGovt && !coalition) verdict = `${G.partyName} wins an outright majority! You are the new Prime Minister.`;
  else if(formsGovt && coalition) verdict = `${G.partyName} leads a coalition with ${partnerName} and forms the Government. You are the new Prime Minister.`;
  else if(juniorPartner) verdict = `${G.partyName} enters Government as the junior coalition partner to ${results[ranked[0][0]].name}.`;
  else if(outcome==='hung') verdict = `No party wins a majority. Parliament is hung, and coalition talks leave ${G.partyName} out of Government.`;
  else verdict = `${ranked[0][1].name} wins the General Election. ${G.partyName} falls short and remains in opposition.`;

  G.pendingEvent = {
    type:'election-result', results, ranked, outcome, verdict,
    title: formsGovt ? 'VICTORY — YOU FORM THE GOVERNMENT' : 'ELECTION RESULT',
    text: verdict,
  };

  if(results.you.seats===0 && G.tier!=='fringe'){
    G.gameOverReason = `${G.partyName} is wiped out at the polls, losing every seat. ${G.leaderName} resigns as leader.`;
  }

  checkAchievements();
  showEventModal();
  save();
}

function resolveCoalitionChoice(choiceId){
  const ev = G.pendingEvent;
  const {results, ranked, opts} = ev;
  if(choiceId==='minority'){
    G.unity = clamp(G.unity-12,0,100);
    log(`${G.partyName} chooses to govern alone as a minority Government, without a formal coalition partner.`, 'lognew');
    G.pendingEvent = null;
    finishElection(results, ranked, 'minority-you', true, false, null, 'you', false, true);
    return;
  }
  if(choiceId==='decline'){
    log(`${G.partyName} declines to attempt a Government despite winning the most seats. Talks proceed without you.`, 'lognew');
    const govId = ranked[1][0];
    G.pendingEvent = null;
    finishElection(results, ranked, 'hung', false, false, null, govId, false, false);
    return;
  }
  const opt = opts.find(o=>o.id===choiceId);
  if(!opt || !opt.viable) return;
  const area = POLICY_AREAS.find(p=>p.key===opt.askKey);
  const rival = G.rivals.find(r=>r.id===choiceId);
  G.you.stance[opt.askKey] = Math.round((G.you.stance[opt.askKey] + rival.stance[opt.askKey])/2);
  G.unity = clamp(G.unity-10,0,100);
  log(`${G.partyName} agrees terms with ${rival.name}, conceding ground on ${area.name} in exchange for their support in Government.`, 'lognew');
  G.pendingEvent = null;
  finishElection(results, ranked, 'coalition-you', true, true, rival.name, 'you', false, false);
}

function continueAfterElection(){
  if(G.pendingEvent && G.pendingEvent.results && G.pendingEvent.results.you.seats===0 && G.tier!=='fringe'){
    G.gameOver = true;
    closeModal(); render(); save();
    return;
  }
  G.termNumber += 1;
  G.termWeek = 1;
  G.week += 1;
  G.ap = AP_PER_WEEK;
  G.momentum = 0;
  G.pendingEvent = null;
  refreshStaffMarket();
  calcPolls();
  log(`=== A new Parliament begins (Term ${G.termNumber}) ===`, 'lognew');
  closeModal(); save(); render();
}

// ---------------------------------------------------------------------
// WEEK ADVANCE
// ---------------------------------------------------------------------
function advanceWeek(){
  if(G.gameOver) return;
  if(G.pendingEvent) return;

  const payroll = G.staff.reduce((a,s)=>a+s.salary,0);
  G.funds -= payroll;
  if(G.funds < 0){
    G.unity = clamp(G.unity-5,0,100);
    log(`Payroll of ${fmtMoney(payroll)} pushes the party into debt. Unity suffers.`, 'lognew');
  }

  if(G.campaign){ tickCampaignPhase(); }
  else { tickByElection(); }

  if(!G.campaign) driftRivals();
  if(G.governing && !G.campaign) runDepartments();
  checkStaffMorale();
  updateInnerCircleRelations();
  if(!G.campaign) maybeRefreshStaffMarket();

  if(Math.random()<0.55) randomNationalEvent();

  if(!G.campaign && !G.pendingEvent && (G.week - (G.lastConferenceWeek||0)) >= CONFERENCE_INTERVAL){ triggerConference(); }
  if(G.governing && !G.campaign && !G.pendingEvent && (G.week - (G.lastBudgetWeek||0)) >= CONFERENCE_INTERVAL){ triggerBudget(); }
  if(!G.campaign && !G.pendingEvent && (G.week - (G.lastLocalElectionsWeek||0)) >= 26){ triggerLocalElections(); }
  if(!G.campaign && !G.pendingEvent) checkManifestoBreaches();
  if(!G.campaign && !G.pendingEvent) checkFavourExposure();
  if(!G.campaign && !G.pendingEvent) maybeTriggerByElection();
  if(!G.campaign && !G.pendingEvent) maybeTriggerRebellion();
  if(!G.campaign && !G.pendingEvent) maybeTriggerForeignCrisis();
  if(!G.campaign && !G.pendingEvent) maybeTriggerCaseworkCrisis();

  G.unity = clamp(G.unity + (60-G.unity)*0.02, 0, 100);
  G.trust = clamp(G.trust + (55-G.trust)*0.015, 0, 100);
  updateMembers();

  G.week += 1;
  if(!G.campaign) G.termWeek += 1;
  G.ap = AP_PER_WEEK;

  calcPolls();
  G.pollHistory.push({week:G.week, you:G.polls.you, gov:G.polls.gov, opp:G.polls.opp, oth:G.polls.oth});
  if(G.pollHistory.length>600) G.pollHistory.shift();
  checkAchievements();

  if(!G.pendingEvent) checkLeadershipChallenge();

  if(!G.campaign && !G.gameOver && !G.pendingEvent && G.termWeek >= G.termLength){
    log('The parliamentary term reaches its end. A General Election must now be held.', 'lognew');
    beginCampaignPhase();
  }

  save();
  render();
}

    if(G.governing){
      html += `<div class="mchoices">
        <button onclick="resolveForeignCrisis('intervene')"><span class="mc-t">Intervene Directly</span><span class="mc-d">High risk, high reward — decisive leadership or a costly overreach.</span></button>

      </div>`;
    } else {
      html += `<div class="mchoices">
        <button onclick="resolveForeignCrisis('support')"><span class="mc-t">Support the Government's Response</span><span class="mc-d">Statesmanlike, if it lands.</span></button>
        <button onclick="resolveForeignCrisis('criticise')"><span class="mc-t">Criticise Their Handling</span><span class="mc-d">Risky — can look opportunistic during a crisis.</span></button>
        <button onclick="resolveForeignCrisis('silent')"><span class="mc-t">Stay Silent</span><span class="mc-d">Safe, but forgettable.</span></button>
      </div>`;
    }
  } else if(ev.type==='casework-crisis'){
    html += `<div class="mchoices">
      <button onclick="resolveCaseworkCrisis('fund')"><span class="mc-t">Fund Emergency Support — ${fmtMoney(8000)}</span><span class="mc-d">Clears the backlog fully and improves local opinion.</span></button>

    </div>`;
  } else if(ev.type==='coalition-talks'){
    html += `<div class="mchoices">`;
    ev.opts.forEach(o=>{
      const area = POLICY_AREAS.find(p=>p.key===o.askKey);
