<title>Punchline Tombola</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  :root {

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d2438; --bg-deep: #161c2d; --ink: #f4ecd8; --ticket: #2a3350;

    }
  }
  :root[data-theme="dark"] {
    --bg: #1d2438; --bg-deep: #161c2d; --ink: #f4ecd8; --ticket: #2a3350;

  html, body { height: 100%; }
  body {

  .app {
    height: 100%;
    max-width: 560px;

    flex-direction: column;
    gap: 16px;
    padding-block: 16px 20px;

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

  h1 {

    font-weight: 400;

    margin: 0;

  .count {
    font-size: 0.8rem;

    letter-spacing: 0.08em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stage {
    flex: 1;
    display: grid;
    place-items: center;
    min-height: 0;
  }
  .ticket {
    position: relative;
    width: 100%;
    box-sizing: border-box;
    background: var(--ticket);
    border: 2px dashed var(--ticket-edge);
    border-radius: 6px;
    padding: 28px 24px 22px;
    box-shadow: 0 10px 0 -2px var(--bg-deep), 0 18px 30px rgba(0,0,0,0.18);
    transform: rotate(-1.2deg);
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 46%;
    justify-content: space-between;
    cursor: pointer;
  }
  /* punched holes on the ticket ends */
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 22px; height: 22px;
    margin-top: -11px;
    border-radius: 50%;
    background: var(--bg);
  }
  .ticket::before { left: -12px; }
  .ticket::after { right: -12px; }
  .no {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .line {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .hint {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0;
  }
  .ticket.pop { animation: pop 320ms cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop {
    0% { transform: rotate(-1.2deg) scale(0.92) translateY(10px); opacity: 0.4; }
    100% { transform: rotate(-1.2deg) scale(1) translateY(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .ticket.pop { animation: none; } }
  .controls {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
  }
  button {
    font-family: var(--font-ui);
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .draw {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 1.35rem;
    padding: 22px 16px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    transition: transform 80ms, box-shadow 80ms;
  }
  .draw:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .back {
    background: transparent;
    color: var(--ink);
    border: 2px solid currentColor;
    font-weight: 500;
    font-size: 1rem;
    padding: 0 18px;
  }
  .back:disabled { opacity: 0.35; cursor: default; }
  .reveal {
    grid-column: 1 / -1;
    background: var(--ink);
    color: var(--ticket);
    font-weight: 500;
    font-size: 1rem;
    padding: 14px 16px;
  }
  .reveal:disabled { opacity: 0.45; cursor: default; }
  .setup {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.4;
    color: var(--muted);
    font-style: italic;
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    text-wrap: pretty;
  }
  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .reset {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid currentColor;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .reset.armed {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
</style>

<div class="app">
  <header>
    <h1>Punchline Tombola</h1>
    <div class="meta">
      <span class="count" id="count"></span>
      <button class="reset" id="reset" type="button">Put all back</button>
    </div>
  </header>

  <main class="stage">
    <div class="ticket" id="ticket" role="button" tabindex="0" aria-live="polite" aria-label="Draw another punchline">
      <span class="no" id="no">Ticket No. 000</span>
      <p class="setup" id="setup" hidden></p>
      <p class="line" id="line">Because it was stapled to the chicken.</p>
      <p class="hint" id="hint">Read it out. Everyone guesses the joke that came before it.</p>
    </div>
  </main>

  <div class="controls">
    <button class="reveal" id="reveal" type="button" disabled>Reveal a possible setup</button>
    <button class="back" id="back" type="button" disabled>Back</button>
    <button class="draw" id="draw" type="button">Draw a punchline</button>
  </div>
</div>

let deck = [], pos = -1;

function shuffle(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && Array.isArray(s.deck) && s.deck.length === LINES.length) {
      deck = s.deck; pos = s.pos; return;
    }
  } catch (e) {}
  deck = shuffle(LINES.length); pos = -1;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ deck, pos })); } catch (e) {}
}

let revealed = false;

function showSetup() {
  const el = $("setup"), btn = $("reveal");
  const text = pos >= 0 ? SETUPS[LINES[deck[pos]]] : null;
  el.textContent = revealed && text ? text : "";
  el.hidden = !(revealed && text);
  btn.textContent = revealed && text ? "Hide the setup" : "Reveal a possible setup";
  btn.disabled = !text;
}

function reveal() {
  revealed = !revealed;
  showSetup();
}

function render(animate) {
  revealed = false;
  showSetup();
  const left = LINES.length - (pos + 1);
  $("count").textContent = left + " of " + LINES.length + " left";
  $("back").disabled = pos <= 0;
  if (pos < 0) return;
  const idx = deck[pos];
  $("no").textContent = "Ticket No. " + String(pos + 1).padStart(3, "0");
  $("line").textContent = LINES[idx];
  $("hint").textContent = left === 0 ? "That's the lot. The next draw reshuffles the drum." : "Tap the ticket or the button for another.";
  if (animate) {
    const t = $("ticket");
    t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
  }
}

function draw() {
  if (pos >= LINES.length - 1) { deck = shuffle(LINES.length); pos = -1; }
  pos++;
  save(); render(true);
}

function back() {
  if (pos > 0) { pos--; save(); render(true); }
}

// Two taps to reset, so a stray tap doesn't wipe the game.
let armTimer = null;
function reset() {
  const btn = $("reset");
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed");
    btn.textContent = "Tap again to confirm";
    armTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm();
  deck = shuffle(LINES.length); pos = -1;
  save(); render(false);
  $("no").textContent = "Fresh drum";
  $("line").textContent = "All " + LINES.length + " punchlines are back in the bag.";
  $("hint").textContent = "Tap the ticket or the button to start drawing.";
  const t = $("ticket");
  t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
}
function disarm() {
  clearTimeout(armTimer);
  const btn = $("reset");
  btn.classList.remove("armed");
  btn.textContent = "Put all back";
}
$("reset").addEventListener("click", reset);
$("reveal").addEventListener("click", reveal);

$("draw").addEventListener("click", draw);
$("back").addEventListener("click", back);
$("ticket").addEventListener("click", draw);
$("ticket").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); draw(); }
});

// Keep the screen awake during a game, if the browser allows it.
async function wake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
wake();
