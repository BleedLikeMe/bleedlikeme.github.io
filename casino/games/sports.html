<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Felt Sports Lounge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="vf-bridge.js"></script>
<style>
:root{--bg:#070b12;--panel:#0e1522;--panel2:#131c2c;--line:#22304a;--ink:#e8eef8;--mut:#8a9ab5;--live:#2bff88;--gold:#e5c26b;--up:#2bff88;--down:#ff5a6a;--acc:#3aa0ff}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% -10%,rgba(40,120,255,.22),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(40,255,140,.08),transparent 50%),var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0b1220,#070b12);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding:12px 18px 8px}
.brand h1{margin:0;font:900 28px Cinzel;letter-spacing:.14em;background:linear-gradient(180deg,#fff3c4,#e5c26b 50%,#9c6b1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font:700 10px Inter;letter-spacing:.36em;color:var(--mut)}
.brand .sp{flex:1}
.wallet{display:flex;gap:10px;align-items:center}
.wallet .w{padding:6px 12px;border-radius:10px;background:#050810;border:1px solid var(--line);text-align:right}
.wallet .w label{display:block;font:700 9px Inter;letter-spacing:.24em;color:var(--mut)}
.wallet .w b{font:600 20px Oswald;color:#ffe07a}
.fmtsel{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.fmtsel button{padding:7px 10px;border:none;background:#0a101b;color:var(--mut);font:700 11px Inter;letter-spacing:.08em}
.fmtsel button.on{background:var(--acc);color:#fff}
.ticker{height:30px;overflow:hidden;background:#03060c;border-top:1px solid #111a2a;position:relative}
.ticker .run{position:absolute;white-space:nowrap;top:0;line-height:30px;font:600 13px Oswald;letter-spacing:.06em;color:#ffcf6a;animation:tick 60s linear infinite;padding-left:100%}
.ticker .run span{margin-right:42px}
.ticker .run .lv{color:var(--live)}
@keyframes tick{to{transform:translateX(-100%)}}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:16px;padding:16px 18px 30px;max-width:1500px;margin:0 auto}
.nav{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:var(--panel);text-align:left;font:700 13px Inter}
.nav button:hover{border-color:var(--line)}
.nav button.on{background:linear-gradient(90deg,rgba(58,160,255,.25),rgba(58,160,255,.05));border-color:var(--acc)}
.nav button svg{width:22px;height:22px;flex:none}
.nav button .ct{margin-left:auto;font:600 11px Oswald;color:var(--mut);background:#050810;padding:1px 7px;border-radius:8px}
.nav button .ct.lv{color:#04170c;background:var(--live)}
.nav .note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel);font:500 11.5px/1.5 Inter;color:var(--mut)}

/* big screen */
.tv{position:relative;border-radius:20px;padding:12px;background:linear-gradient(180deg,#1b2233,#0a0e16);border:1px solid #2a3550;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.tv .screen{position:relative;aspect-ratio:16/6.6;border-radius:10px;overflow:hidden;background:#000;box-shadow:inset 0 0 40px rgba(0,0,0,.9)}
.tv .screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(170deg,rgba(255,255,255,.07),transparent 35%),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px)}
.tv .chan{position:absolute;left:22px;top:20px;z-index:3;display:flex;gap:6px;align-items:center;font:700 10px Inter;letter-spacing:.2em}
.tv .chan .live{padding:3px 8px;border-radius:5px;background:#e8182c;color:#fff;animation:blink 1.4s infinite}
.tv .chan .nm{padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}
@keyframes blink{50%{opacity:.55}}
.tvbar{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tvbar button{flex:none;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#0a101b;font:600 11.5px Inter;color:var(--mut);white-space:nowrap}
.tvbar button.on{border-color:var(--live);color:#fff}
.tvbar button .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;animation:blink 1.2s infinite}
.sbd{position:absolute;z-index:2;font-family:Oswald;color:#fff}
.goalflash{position:absolute;inset:0;display:grid;place-items:center;z-index:4;font:900 78px Cinzel;letter-spacing:.1em;color:#fff;text-shadow:0 0 20px #2bff88,0 0 40px #2bff88;animation:gf 1s ease-in-out infinite alternate;pointer-events:none;background:radial-gradient(ellipse,rgba(43,255,136,.25),transparent 70%)}
@keyframes gf{to{transform:scale(1.08)}}

/* events */
.sec-h{display:flex;align-items:center;gap:10px;margin:18px 2px 10px;font:800 12px Inter;letter-spacing:.24em;color:var(--mut)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h svg{width:16px;height:16px;flex:none}
.ev{border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.ev.live{border-color:rgba(43,255,136,.35)}
.evh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);font:600 11px Inter;letter-spacing:.06em;color:var(--mut)}
.evh svg{width:15px;height:15px}
.evh .when{margin-left:auto;font:600 12px Oswald;letter-spacing:.08em;color:#c8d4ea}
.evh .when.lv{color:var(--live)}
.evh .when.lv::before{content:"● ";animation:blink 1.2s infinite}
.evh .watch{padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:#0a101b;font:700 10px Inter;letter-spacing:.1em;color:var(--mut)}
.evh .watch:hover{color:#fff;border-color:var(--live)}
.evb{display:flex;align-items:center;gap:12px;padding:10px 12px}
.teams{flex:1;min-width:0}
.teams div{display:flex;align-items:center;gap:8px;padding:2px 0;font:600 14px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams .crest{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.teams .sc{margin-left:auto;font:700 17px Oswald;color:#fff;min-width:24px;text-align:right}
.teams .srv{width:7px;height:7px;border-radius:50%;background:#d8ff3a;flex:none}
.teams .tsets{margin-left:auto;display:flex;gap:6px;font:600 14px Oswald}
.teams .tsets i{font-style:normal;min-width:14px;text-align:center;color:#c8d4ea}
.teams .tsets i.pt{color:#ffe07a;min-width:22px}
.odds{display:flex;gap:6px;flex:none}
.ob{min-width:72px;padding:6px 8px;border-radius:9px;border:1px solid #2a3a58;background:linear-gradient(180deg,#17233a,#0f1828);display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s,border-color .15s}
.ob .lb{font:600 10px Inter;color:var(--mut);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob b{font:700 15px Oswald;color:#ffe07a;letter-spacing:.03em}
.ob:hover:not(:disabled){border-color:var(--acc)}
.ob.sel{background:linear-gradient(180deg,#2a7cff,#1650c0);border-color:#9cc8ff}
.ob.sel b,.ob.sel .lb{color:#fff}
.ob:disabled{opacity:.4;cursor:default}
.ob.up b::after{content:" ▲";color:var(--up);font-size:10px}
.ob.down b::after{content:" ▼";color:var(--down);font-size:10px}
.ob.susp b{color:var(--mut)}
.more{display:block;width:100%;padding:7px;border:none;border-top:1px solid var(--line);background:#0b111c;font:700 11px Inter;letter-spacing:.12em;color:var(--acc)}
.mkts{padding:4px 12px 12px;border-top:1px solid var(--line);background:#0b111c}
.mkt h5{margin:10px 0 6px;font:800 11px Inter;letter-spacing:.16em;color:var(--mut)}
.mkt .g{display:flex;flex-wrap:wrap;gap:6px}
.mkt .g .ob{flex:1 1 90px}
.result-tag{font:700 12px Oswald;letter-spacing:.1em;color:#ffe07a}
.runner{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #182236}
.runner:last-child{border-bottom:none}
.silk{width:28px;height:28px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.runner .rn{flex:1;min-width:0}
.runner .rn b{display:block;font:700 13px Inter}
.runner .rn small{font:500 11px Inter;color:var(--mut)}
.runner .ew{padding:6px 8px;border-radius:9px;border:1px solid #2a3a58;background:#0f1828;font:700 10px Inter;color:var(--mut)}
.runner .ew:hover{color:#fff;border-color:var(--acc)}
.nobets{padding:30px;text-align:center;color:var(--mut);font:500 14px Inter}

/* slip */
.side{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:12px}
.box{border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.tabs{display:flex}
.tabs button{flex:1;padding:11px;border:none;background:#0a101b;font:800 11px Inter;letter-spacing:.14em;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--acc);background:var(--panel)}
.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--acc);color:#fff;font:700 10px Inter}
.slip{padding:10px 12px 12px;max-height:calc(100vh - 210px);overflow:auto}
.leg{position:relative;padding:9px 30px 9px 10px;border-radius:10px;background:#0a101b;border:1px solid #1b2840;margin-bottom:8px}
.leg .x{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:none;background:#1b2840;color:var(--mut);font:700 12px Inter}
.leg .sel{font:700 13px Inter}
.leg .mk{font:500 11px Inter;color:var(--mut);margin-top:2px}
.leg .od{position:absolute;right:34px;top:9px;font:700 15px Oswald;color:#ffe07a}
.leg .od.chg{color:#ff9a6a}
.leg .st{display:flex;align-items:center;gap:6px;margin-top:7px}
.leg .st input{width:90px}
.leg .st small{font:500 11px Inter;color:var(--mut)}
input.stake{padding:7px 9px;border-radius:8px;border:1px solid #2a3a58;background:#050810;color:#fff;font:600 14px Oswald;outline:none}
input.stake:focus{border-color:var(--acc)}
.parlay{margin-top:4px;padding:10px;border-radius:12px;background:linear-gradient(180deg,rgba(58,160,255,.12),rgba(58,160,255,.04));border:1px solid rgba(58,160,255,.35)}
.parlay h6{margin:0 0 6px;font:800 11px Inter;letter-spacing:.16em;color:#9cc8ff;display:flex;justify-content:space-between}
.parlay h6 b{font:700 15px Oswald;color:#ffe07a;letter-spacing:0}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.quick button{padding:4px 9px;border-radius:7px;border:1px solid #2a3a58;background:#0a101b;font:600 11px Oswald;color:#c8d4ea}
.sum{display:flex;justify-content:space-between;font:600 13px Inter;color:var(--mut);margin:8px 2px 4px}
.sum b{color:#fff;font:700 15px Oswald}
.place{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(180deg,#2bff88,#13a456);color:#032312;font:900 14px Inter;letter-spacing:.14em;box-shadow:0 4px 0 #0a5a2e}
.place:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.clear{margin-top:6px;width:100%;padding:7px;border-radius:9px;border:1px solid var(--line);background:none;font:700 11px Inter;letter-spacing:.12em;color:var(--mut)}
.empty{padding:22px 10px;text-align:center;color:var(--mut);font:500 13px/1.5 Inter}
.bet{padding:10px;border-radius:12px;background:#0a101b;border:1px solid #1b2840;margin-bottom:8px}
.bet .bh{display:flex;justify-content:space-between;align-items:center;font:800 11px Inter;letter-spacing:.12em;color:var(--mut)}
.bet .badge{padding:2px 8px;border-radius:6px;font:800 10px Inter;letter-spacing:.12em}
.badge.open{background:#13243f;color:#9cc8ff}.badge.won{background:#0f3a22;color:var(--live)}.badge.lost{background:#3a1218;color:#ff8a96}.badge.void{background:#2a2a2a;color:#ccc}.badge.cashed{background:#3a2e0f;color:#ffd75e}
.bet .bl{margin-top:6px;font:500 12px/1.45 Inter;color:#c8d4ea}
.bet .bl .r{font-weight:800}
.bet .bl .W{color:var(--live)}.bet .bl .L{color:#ff8a96}.bet .bl .V{color:#bbb}.bet .bl .P{color:#9cc8ff}
.bet .bf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:600 12px Inter;color:var(--mut)}
.bet .bf b{color:#fff;font:700 14px Oswald}
.cash{padding:6px 10px;border-radius:8px;border:1px solid #b8862b;background:linear-gradient(180deg,#f1d37a,#b8862b);color:#1d1203;font:800 11px Inter;letter-spacing:.06em}
.cash:disabled{filter:grayscale(1) brightness(.5);cursor:default}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;z-index:2000;padding:12px 20px;border-radius:12px;max-width:calc(100vw - 32px);text-align:center;background:#0e1522;border:1px solid var(--acc);color:#fff;font:600 14px Inter;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.win{border-color:var(--live);box-shadow:0 0 30px rgba(43,255,136,.35)}
.resetrow{display:flex;justify-content:flex-end;gap:8px;padding:0 12px 12px}
.resetrow button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:none;font:700 10px Inter;letter-spacing:.12em;color:var(--mut)}

/* racing */
.horse .legs line{stroke-width:3.2;stroke-linecap:round}
.horse.run .lf{animation:legA .32s linear infinite}
.horse.run .lb{animation:legB .32s linear infinite}
@keyframes legA{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-24deg)}}
@keyframes legB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(28deg)}}
.horse.run .bodyg{animation:bob .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}

@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 330px}.nav{position:static;flex-direction:row;flex-wrap:wrap;grid-column:1 / -1}.nav .note{display:none}}
@media (max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.odds .ob{min-width:58px}.evb{flex-wrap:wrap}.odds{width:100%}.odds .ob{flex:1}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div><h1>SPORTS LOUNGE</h1><div class="sub">THE VELVET FELT · LIVE BETTING · 24 / 7</div></div>
    <div class="sp"></div>
    <div class="fmtsel" id="fmtsel"><button data-f="dec">DECIMAL</button><button data-f="frac">FRACTIONAL</button><button data-f="us">AMERICAN</button></div>
    <div class="wallet"><div class="w"><label>CHIPS</label><b id="bank">$0</b></div><div class="w"><label>IN PLAY</label><b id="inplay">$0</b></div></div>
  </div>
  <div class="ticker"><div class="run" id="ticker"></div></div>
</div>

<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main>
    <div class="tv">
      <div class="screen" id="screen"></div>
      <div class="tvbar" id="tvbar"></div>
    </div>
    <div id="events"></div>
  </main>
  <aside class="side">
    <div class="box">
      <div class="tabs"><button id="tabSlip" class="on">BET SLIP <span class="n" id="slipN">0</span></button><button id="tabBets">MY BETS <span class="n" id="betsN">0</span></button></div>
      <div class="slip" id="slipView"></div>
      <div class="slip" id="betsView" hidden></div>
      <div class="resetrow"><button id="resetBtn">NEW BANKROLL</button></div>
    </div>
  </aside>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let OFFSET = 0;
const now = () => Date.now() + OFFSET;

/* ================= deterministic randomness ================= */
function hash32(str){ let h = 1779033703 ^ str.length; for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rngFor = s => mulberry(hash32(s));
function gauss(r){ let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function pick2(r, n){ const a = Math.floor(r()*n); let b = Math.floor(r()*(n-1)); if (b >= a) b++; return [a, b]; }
function Phi(x){ const t = 1/(1+.2316419*Math.abs(x)), d = .3989423*Math.exp(-x*x/2); let p = d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x > 0 ? 1-p : p; }
const roundHalf = x => Math.floor(x) + .5;

/* ================= static data ================= */
const EPOCH = Date.UTC(2026, 0, 1);
const SPORT = {
  soccer:{name:'Football', league:'Velvet Premier League', period:150e3, offset:0},
  basket:{name:'Basketball', league:'Velvet Basketball Association', period:180e3, offset:40e3},
  tennis:{name:'Tennis', league:'Velvet Open · Hard Court', period:200e3, offset:80e3},
  racing:{name:'Horse Racing', league:'Velvet Downs', period:120e3, offset:20e3},
};
const HORIZON = 15*60e3, LOOKBACK = 12*60e3, RESULTS_FOR = 4*60e3;
const ICON = {
  soccer:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#111" stroke-width="1.2"/><path d="M12 7 L16 10 L14.5 15 L9.5 15 L8 10 Z" fill="#111"/><path d="M12 7 V3 M16 10 L20 9 M14.5 15 L17 19 M9.5 15 L7 19 M8 10 L4 9" stroke="#111" stroke-width="1.2"/></svg>`,
  basket:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f07a20" stroke="#5a2a00" stroke-width="1.2"/><path d="M2 12 H22 M12 2 V22 M5 4.5 C9 8 9 16 5 19.5 M19 4.5 C15 8 15 16 19 19.5" stroke="#5a2a00" stroke-width="1.2" fill="none"/></svg>`,
  tennis:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#d8ff3a" stroke="#6a7a10" stroke-width="1.2"/><path d="M4 6 C10 9 10 15 4 18 M20 6 C14 9 14 15 20 18" stroke="#fff" stroke-width="1.6" fill="none"/></svg>`,
  racing:`<svg viewBox="0 0 24 24"><path d="M6 3 C1 9 3 20 12 21 C21 20 23 9 18 3" stroke="#e5c26b" stroke-width="3.4" fill="none" stroke-linecap="round"/><circle cx="5" cy="9" r="1" fill="#5a3a00"/><circle cx="19" cy="9" r="1" fill="#5a3a00"/><circle cx="7" cy="15" r="1" fill="#5a3a00"/><circle cx="17" cy="15" r="1" fill="#5a3a00"/></svg>`,
  live:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#2bff88"/><circle cx="12" cy="12" r="9" fill="none" stroke="#2bff88" stroke-width="1.5" opacity=".5"/></svg>`,
  all:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="#3aa0ff"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#e5c26b"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#2bff88"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#ff5a6a"/></svg>`,
};
const CLUB_COLORS = ['#c8102e','#1f4fbf','#f2c200','#138a3c','#6b2b94','#111111','#ff7a00','#00a3c8','#8a1538','#ffffff','#0b2a5a','#7ac143','#d4af37','#e2007a','#5a3a1a','#9aa0a8'];
const mkTeams = (names, f) => names.map((n, i) => { const r = rngFor('team:' + n); return {name:n, short:n.split(' ')[0].slice(0,3).toUpperCase(), color:CLUB_COLORS[i % CLUB_COLORS.length], color2:CLUB_COLORS[(i*7+3) % CLUB_COLORS.length], ...f(r)}; });
const SOCCER = mkTeams(['Harbour City','Northgate Rovers','Ashford Athletic','Kingsbridge United','Redmoor FC','Castleton Albion','Westvale Town','Port Lennox','Millbrook Wanderers','Stanmoor City','Eastwick Rangers','Highfield Villa','Brackwater United','Oakhurst Forest','Dunmore Celtic','Lowfield Athletic'],
  r => ({att:.8 + r()*.42, def:.8 + r()*.42}));
const BASKET = mkTeams(['Metro Comets','Bayside Sharks','Desert Kings','Lakeshore Storm','Iron City Titans','Coastal Waves','Mountain Hawks','Capital Monarchs','River Rapids','Summit Bears','Harbor Knights','Neon Foxes'],

function soccerResult(ev, m, sel){

/* ---- basketball ---- */
function possDist(e){ const k = e/1.1, p3 = .11*k, p2 = .36*k, p1 = .07, p0 = 1 - p1 - p2 - p3; const mean = 3*p3 + 2*p2 + p1; return {p:[p0,p1,p2,p3], mean, v:9*p3 + 4*p2 + p1 - mean*mean}; }
const BMIN = 4000;
function genBasket(n){
  const r = rngFor('basket:' + n), [hi, ai] = pick2(r, BASKET.length), H = BASKET[hi], A = BASKET[ai];
  const dh = possDist(H.off*A.def + .02), da = possDist(A.off*H.def - .01);
  const poss = d => { const x = r(); return x < d.p[0] ? 0 : x < d.p[0] + d.p[1] ? 1 : x < d.p[0] + d.p[1] + d.p[2] ? 2 : 3; };

    if (m === mins && cum[m][0] === cum[m][1]) mins += 5;
  }

function basketState(ev, t){

/* ---- tennis ---- */
const TPT = 1600;
function tNew(server){ return {sets:[0,0], games:[0,0], pts:[0,0], tb:false, server, hist:[], done:false, tbs:0}; }
function tClone(s){ return {sets:[...s.sets], games:[...s.games], pts:[...s.pts], tb:s.tb, server:s.server, hist:s.hist.map(x => [...x]), done:s.done, tbs:s.tbs}; }

function tPoint(s, w){
  const l = 1 - w;
  if (s.tb){
    s.pts[w]++; const tot = s.pts[0] + s.pts[1];
    if (s.pts[w] >= 7 && s.pts[w] - s.pts[l] >= 2){ s.games[w]++; tEndSet(s, w); return; }
    if (tot % 2 === 1) s.server = 1 - s.server;
    return;
  }
  s.pts[w]++;
  if (s.pts[w] >= 4 && s.pts[w] - s.pts[l] >= 2){
    s.games[w]++; s.pts = [0,0]; s.server = 1 - s.server;
    const g = s.games;
    if ((g[w] >= 6 && g[w] - g[l] >= 2) || g[w] === 7) tEndSet(s, w);
    else if (g[0] === 6 && g[1] === 6){ s.tb = true; s.tbs = s.server; }
  }
}
function tPlay(s, P1, P2, r){ const p = s.server === 0 ? P1.sp : P2.sp; const w = r() < p ? s.server : 1 - s.server; tPoint(s, w); return w; }
function genTennis(n){
  const r = rngFor('tennis:' + n), [ai, bi] = pick2(r, PLAYERS.length), P1 = PLAYERS[ai], P2 = PLAYERS[bi];
  const s = tNew(r() < .5 ? 0 : 1), snaps = [tClone(s)], winners = [];
  while (!s.done){ winners.push(tPlay(s, P1, P2, r)); snaps.push(tClone(s)); }
  const start = slotStart('tennis', n), end = start + winners.length*TPT + 3000;
  const ev = {start, end, settleAt:end, home:P1, away:P2, snaps, winners, name:`${P1.name} v ${P2.name}`};
  // pre-match total games line from simulation

}
function tennisState(ev, t){
  const e = t - ev.start;
  if (e < 0) return {st:'pre', k:0, snap:ev.snaps[0], clock:''};
  const k = Math.min(ev.winners.length, Math.floor(e / TPT));
  const snap = ev.snaps[k];
  const st = k >= ev.winners.length ? 'ft' : 'live';
  return {st, k, snap, clock: st === 'ft' ? 'FINAL' : `SET ${snap.hist.length + 1}`};
}
const TCACHE = new Map();
function tennisModel(ev, s){
  const ck = ev.key + ':' + s.k;
  let P = TCACHE.get(ck);
  if (!P){
    const r = rngFor(ck), N = s.k === 0 ? 1500 : 400, c = {};
    const add = k => c[k] = (c[k] || 0) + 1/N;
    for (let i=0;i<N;i++){
      const x = tClone(s.snap); while (!x.done) tPlay(x, ev.home, ev.away, r);
      const w = x.sets[0] === 2 ? 'H' : 'A';
      add('mw:' + w);
      add('sets:' + x.sets.join('-'));
      const g = x.hist.reduce((a,h) => a + h[0] + h[1], 0); add('tg:' + (g > ev.tgLine ? 'O' : 'U'));

    {id:'tg', name:`Total Games ${ev.tgLine}`, line:ev.tgLine, sels:[['O',`Over ${ev.tgLine}`],['U',`Under ${ev.tgLine}`]]},
    {id:'set1', name:'First Set Winner', closed: s.snap.hist.length > 0, sels:[['H',H],['A',A]]},

function tennisResult(ev, m, sel){

/* ---- racing ---- */
function genRace(n){
  const r = rngFor('race:' + n), pool = HORSES.slice(), runners = [];
  for (let i=0;i<8;i++){
    const h = pool.splice(Math.floor(r()*pool.length), 1)[0];
    runners.push({no:i+1, name:h, rating:r(), k:.86 + r()*.32, c1:SILK[Math.floor(r()*SILK.length)], c2:SILK[Math.floor(r()*SILK.length)], pat:Math.floor(r()*4),
      form:Array.from({length:4}, () => 1 + Math.floor(r()*9)).join(''), coat:['#6b3a1a','#3a2210','#8a5a2a','#2a2a2a','#9a9a9a','#5a3018'][Math.floor(r()*6)], age:3 + Math.floor(r()*5)});
  }
  const perf = runners.map(x => x.rating + gauss(r)*.33), best = Math.max(...perf);
  runners.forEach((x, i) => x.T = 40 + (best - perf[i])*7);
  const order = runners.map((x,i) => i).sort((a,b) => runners[a].T - runners[b].T);
  // pricing by simulation
  const pr = rngFor('race-price:' + n), win = Array(8).fill(0), plc = Array(8).fill(0), N = 3000;
  for (let s=0;s<N;s++){
    const p = runners.map(x => x.rating + gauss(pr)*.33), o = p.map((v,i) => i).sort((a,b) => p[b] - p[a]);
    win[o[0]]++; plc[o[0]]++; plc[o[1]]++; plc[o[2]]++;
  }
  runners.forEach((x,i) => { x.pw = (win[i] + .5)/(N + 4); x.pp = Math.min(.97, (plc[i] + .5)/(N + 4)); });
  const start = slotStart('racing', n), finish = start + Math.max(...runners.map(x => x.T))*1000;
  return {start, end:finish + 25e3, settleAt:finish + 1500, finish, runners, order, title:RACE_NAMES[n % RACE_NAMES.length], dist:DISTS[(n*7) % DISTS.length],
    name:RACE_NAMES[n % RACE_NAMES.length]};
}
function raceState(ev, t){
  const e = (t - ev.start)/1000;
  if (e < 0) return {st:'pre', e, clock:''};
  if (t < ev.finish + 1000) return {st:'live', e, clock:'RUNNING'};
  return {st:'ft', e, clock:'RESULT'};
}
function raceModel(ev, s){
  return {markets:[
    {id:'win', name:'Win', main:true, sels:ev.runners.map((x,i) => [String(i), `${x.no}. ${x.name}`])},
    {id:'place', name:'Place (1st–3rd)', sels:ev.runners.map((x,i) => [String(i), `${x.no}. ${x.name}`])},
  ], p:(m, sel) => m === 'win' ? ev.runners[+sel].pw : ev.runners[+sel].pp, margin:{win:.16, place:.18}, susp: s.st !== 'pre'};
}
function raceResult(ev, m, sel){
  const pos = ev.order.indexOf(+sel);
  if (m === 'win') return pos === 0 ? 'W' : 'L';
  if (m === 'place') return pos <= 2 ? 'W' : 'L';
  return 'V';
}
const progress = (x, e) => e <= 0 ? 0 : e >= x.T ? 1 : Math.pow(e/x.T, x.k) + .004*Math.sin(e*2.1 + x.no)*Math.sin(Math.PI*e/x.T);

/* ================= unified API ================= */
const STATE = {soccer:soccerState, basket:basketState, tennis:tennisState, racing:raceState};
const MODEL = {soccer:soccerModel, basket:basketModel, tennis:tennisModel, racing:raceModel};
const RESULT = {soccer:soccerResult, basket:basketResult, tennis:tennisResult, racing:raceResult};
const MARGIN = {soccer:.05, basket:.05, tennis:.05, racing:.16};
function niceOdds(o){
  if (o < 1.01) o = 1.01;
  if (o < 3) return Math.round(o*100)/100;
  if (o < 10) return Math.round(o*20)/20;
  if (o < 50) return Math.round(o*2)/2;
  return Math.min(1000, Math.round(o));
}
function priced(ev, t = now()){
  const s = STATE[ev.sport](ev, t), md = MODEL[ev.sport](ev, s);
  const out = {s, susp:md.susp, markets:[], p:md.p, lookup:{}};
  for (const m of md.markets){
    const mg = (md.margin && md.margin[m.id]) ?? MARGIN[ev.sport];
    const sels = m.sels.map(([id, label]) => {
      const p = md.p(m.id, id, m.line);
      const odds = (p > .004 && p < .995 && !m.closed) ? niceOdds(1/(p*(1 + mg))) : null;
      return {id, label, p, odds};
    });
    const mk = {...m, sels};
    out.markets.push(mk);
    for (const x of sels) out.lookup[m.id + '|' + x.id] = {...x, line:m.line, mname:m.name, closed:!!m.closed};

function fracOf(o){
  const x = o - 1; let best = [Math.round(x), 1], err = Math.abs(x - best[0]);
  for (const d of [1,2,3,4,5,6,8,10,11,13,20,25,40]){ const nn = Math.round(x*d); const e = Math.abs(x - nn/d); if (nn > 0 && e < err - 1e-9){ best = [nn, d]; err = e; } }
  const g = (a, b) => b ? g(b, a % b) : a, gg = g(best[0], best[1]);
  return `${best[0]/gg}/${best[1]/gg}`;
}
function showOdds(o){
  if (o == null) return '—';
  if (S.fmt === 'frac') return o <= 1.01 ? '1/100' : fracOf(o);
  if (S.fmt === 'us') return o >= 2 ? '+' + Math.round((o-1)*100) : '-' + Math.round(100/(o-1));
  return o.toFixed(2);
}

/* ================= events listing ================= */
let filter = 'all', expanded = new Set(), watching = null, lastListSig = '', P = new Map();
function listEvents(t){
  const out = [];
  for (const sp of Object.keys(SPORT)){
    const per = SPORT[sp].period, off = SPORT[sp].offset;
    const n0 = Math.floor((t - LOOKBACK - EPOCH - off)/per), n1 = Math.floor((t + HORIZON - EPOCH - off)/per);
    for (let n=n0; n<=n1; n++){
      const ev = getEvent(sp + ':' + n);
      if (ev.end < t - RESULTS_FOR) continue;
      out.push(ev);
    }
  }
  // prune cache
  if (CACHE.size > 300){ for (const k of CACHE.keys()){ const e = CACHE.get(k); if (e.end < t - 30*60e3 && !S.bets.some(b => b.status === 'open' && b.legs.some(l => l.ev === k))) CACHE.delete(k); if (CACHE.size < 200) break; } }
  return out;
}

function placeBets(){
  const t = now();
  const legs = S.slip.map(l => ({...l, ...legInfo(l.k, t)}));
  const singles = legs.filter(l => (+S.stakes[l.k] || 0) > 0);
  const evs = new Set(legs.map(l => l.ev.key));
  const canParlay = legs.length >= 2 && evs.size === legs.length && legs.every(l => l.odds);
  const pst = canParlay ? (+S.parlayStake || 0) : 0;
  for (const l of singles.concat(pst ? legs : [])) if (!l.odds){ toast(`${l.x ? l.x.label : 'A selection'} is suspended right now.`); sfx.nope(); return; }
  const total = singles.reduce((a,l) => a + (+S.stakes[l.k]), 0) + pst;
  if (total <= 0){ toast('Enter a stake.'); return; }
  if (total > S.bank + 1e-9){ toast(`You need ${fmt(total)} but have ${fmt(S.bank)} in chips.`); sfx.nope(); return; }
  const mkLeg = l => ({ev:l.ev.key, m:l.m, sel:l.sel, line:l.x.line ?? null, odds:l.odds, label:l.x.label, mname:l.x.mname, evName:l.ev.name, res:null});
  let n = 0;
  for (const l of singles){ S.bets.unshift({id:S.nextId++, placed:t, stake:+S.stakes[l.k], type:'single', legs:[mkLeg(l)], odds:l.odds, status:'open'}); n++; }
  if (pst){ const o = niceParlay(legs.reduce((a,l) => a*l.odds, 1)); S.bets.unshift({id:S.nextId++, placed:t, stake:pst, type:'parlay', legs:legs.map(mkLeg), odds:o, status:'open'}); n++; }
  S.bank = fl(S.bank - total);
  S.slip = []; S.stakes = {}; S.parlayStake = 0;
  save(); sfx.chip(); renderSlip(); renderBets(); updateOddsButtons(t); ui();
  toast(`${n} bet${n>1?'s':''} placed · ${fmt(total)}. Good luck!`);
  showTab('bets');
}

/* ================= my bets / settlement / cash out ================= */
function legState(l, t){
  const ev = getEvent(l.ev);
  if (t >= ev.settleAt) return {done:true, r:RESULT[ev.sport](ev, l.m, l.sel, l.line)};
  return {done:false, ev};
}
function cashValue(b, t){
  if (b.status !== 'open') return null;
  let v = b.stake;
  for (const l of b.legs){
    const st = legState(l, t);
    if (st.done){ v *= st.r === 'W' ? l.odds : st.r === 'V' ? 1 : 0; continue; }
    const pr = P.get(l.ev) || priced(st.ev, t);
    if (pr.susp) return null;
    const p = pr.p(l.m, l.sel, l.line);
    v *= l.odds * p;
  }
  return fl(v * .92);
}
function settle(t){
  let changed = false;
  for (const b of S.bets){
    if (b.status !== 'open') continue;
    const st = b.legs.map(l => legState(l, t));
    st.forEach((x, i) => { if (x.done) b.legs[i].res = x.r; });
    if (st.some(x => x.done && x.r === 'L')){ b.status = 'lost'; b.ret = 0; changed = true; notify(b); continue; }
    if (st.every(x => x.done)){
      const odds = b.legs.reduce((a,l) => a * (l.res === 'W' ? l.odds : 1), 1);
      if (b.legs.every(l => l.res === 'V')){ b.status = 'void'; b.ret = b.stake; }
      else { b.status = 'won'; b.ret = fl(b.stake * odds); }
      S.bank = fl(S.bank + b.ret); changed = true; notify(b);
    }
  }
  if (changed){
    const open = S.bets.filter(b => b.status === 'open'), closed = S.bets.filter(b => b.status !== 'open').slice(0, 80);
    S.bets = open.concat(closed).sort((a,b) => b.placed - a.placed);
    save(); ui();
  }
  return changed;
}
let quietNotify = true;
function notify(b){
  if (quietNotify){ return; }
  if (b.status === 'won'){ toast(`🏆 Bet won! ${b.type === 'parlay' ? b.legs.length + '-leg parlay' : b.legs[0].label} returns ${fmt(b.ret)}`, true); sfx.win(); }
  else if (b.status === 'void') toast(`Bet void · stake ${fmt(b.ret)} returned`);
  else if (b.status === 'lost') sfx.lose();
}
function cashOut(id){

    if (ph === 'pre') return `${ev.sport === 'soccer' ? '⚽' : ev.sport === 'basket' ? '🏀' : '🎾'} ${ev.home.short} v ${ev.away.short} ${mmss(ev.start - t)}`;
    const cls = ph === 'live' ? 'lv' : '';
    if (ev.sport === 'tennis') return `<span class="${cls}">🎾 ${ev.home.name} ${s.snap.hist.map(h => h.join('-')).concat(ph === 'live' ? [s.snap.games.join('-')] : []).join(' ')} ${ev.away.name}</span>`;
    return `<span class="${cls}">${ev.sport === 'soccer' ? '⚽' : '🏀'} ${ev.home.short} ${s.sc[0]}–${s.sc[1]} ${ev.away.short} ${s.clock}</span>`;
  });
  const html = items.map(x => `<span>${x}</span>`).join('');
  if (renderTicker.last !== html && (!renderTicker.at || t - renderTicker.at > 15000)){ $('#ticker').innerHTML = html; renderTicker.last = html; renderTicker.at = t; }
}
function buildNav(){
  const items = [['all','All sports'],['live','In play'],['soccer','Football'],['basket','Basketball'],['tennis','Tennis'],['racing','Horse Racing']];
  $('#nav').innerHTML = items.map(([k, n]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${ICON[k]}<span>${n}</span><span class="ct ${k === 'live' ? 'lv' : ''}">0</span></button>`).join('') +
    `<div class="note">Fixtures run around the clock in speeded-up time: a football match lasts about 3 minutes, a race under a minute. Bets left open when you go settle automatically, and winnings are paid next time you visit the lounge.</div>`;
  $('#nav').onclick = e => { const b = e.target.closest('button[data-f]'); if (!b) return; filter = b.dataset.f; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b)); renderList(true); };
}
function ui(){
  $('#bank').textContent = fmt(S.bank);
  $('#inplay').textContent = fmt(S.bets.filter(b => b.status === 'open').reduce((a,b) => a + b.stake, 0));
  document.querySelectorAll('#fmtsel button').forEach(b => b.classList.toggle('on', b.dataset.f === S.fmt));
}
document.addEventListener('click', e => {
  const ob = e.target.closest('.ob[data-k]'); if (ob && !ob.disabled){ toggleSel(ob.dataset.k); return; }
  const mo = e.target.closest('[data-more]');
  if (mo){ const k = mo.dataset.more; expanded.has(k) ? expanded.delete(k) : expanded.add(k); renderList(true); return; }
  const w = e.target.closest('[data-watch]'); if (w){ watching = w.dataset.watch; tick(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const ew = e.target.closest('[data-ew]'); if (ew){ const [evk, i] = ew.dataset.ew.split('|'); eachWay(evk, i); return; }
});
$('#fmtsel').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.fmt = b.dataset.f; save(); ui(); prevOdds.clear(); document.querySelectorAll('.ob b').forEach(x => x.textContent = ''); updateOddsButtons(now()); renderSlip(); renderBets(); };
$('#resetBtn').onclick = () => { if (!confirm('Reset your chips to $1,000? Open bets stay open.')) return; S.bank = 1000; save(); ui(); };

/* ================= sound ================= */
const sfx = (() => {
  let ac = null;
  const ctx = () => { if (!ac){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, w, d, type='triangle', g=.1){ const a = ctx(); if (!a || !S.sound) return; const o = a.createOscillator(), gn = a.createGain(); o.type = type; const t = a.currentTime + w; o.frequency.setValueAtTime(f, t); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(g, t+.01); gn.gain.exponentialRampToValueAtTime(.0001, t+d); o.connect(gn).connect(a.destination); o.start(t); o.stop(t+d+.05); }
  function noise(d, f, q, g, w=0, swell=false){ const a = ctx(); if (!a || !S.sound) return; const len = Math.floor(a.sampleRate*d), buf = a.createBuffer(1, len, a.sampleRate), x = buf.getChannelData(0);
    for (let i=0;i<len;i++) x[i] = (Math.random()*2-1) * (swell ? Math.sin(Math.PI*i/len) : Math.pow(1-i/len, 2));
    const s = a.createBufferSource(); s.buffer = buf; const fl = a.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q; const gn = a.createGain(); gn.gain.value = g; s.connect(fl).connect(gn).connect(a.destination); s.start(a.currentTime + w); }
  return {
    click(){ noise(.03, 3000, 4, .4); },
    chip(){ noise(.045, 3800, 5, 1); noise(.04, 2700, 6, .6, .05); },
    nope(){ tone(200, 0, .15, 'square', .04); },
    win(){ [659,784,988,1319].forEach((f,i) => tone(f, i*.09, .35, 'triangle', .1)); },
    lose(){ tone(220, 0, .3, 'sine', .08); },
    goal(){ noise(2.2, 700, .6, 1.2, 0, true); tone(1900, 0, .25, 'sine', .08); tone(1900, .3, .5, 'sine', .08); },
    bell(){ for (let i=0;i<6;i++) tone(1320, i*.12, .1, 'square', .05); },
  };
})();
let toastT = 0;
function toast(m, win){ const t = $('#toast'); t.textContent = m; t.className = 'show' + (win ? ' win' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3500); }

/* ================= main loop ================= */
function tick(){
  const t = now();
  const evs = renderList(false);
  // price events referenced by slip/bets too
  for (const l of S.slip){ const k = l.k.split('|')[0]; if (!P.has(k) || !evs.some(e => e.key === k)) P.set(k, priced(getEvent(k), t)); }
  for (const b of S.bets) if (b.status === 'open') for (const l of b.legs) if (!evs.some(e => e.key === l.ev)) P.set(l.ev, priced(getEvent(l.ev), t));
  // drop slip selections whose event is over
  const before = S.slip.length;
  S.slip = S.slip.filter(l => { const ev = getEvent(l.k.split('|')[0]); return t < ev.end && !(ev.sport === 'racing' && t >= ev.start); });
  if (S.slip.length !== before){ save(); toast('A selection was removed from your slip because betting closed.'); }
  settle(t);
  if (!$('#slipView').hidden && !(document.activeElement && document.activeElement.classList.contains('stake'))) renderSlip();
  if (!$('#betsView').hidden) renderBets(); else $('#betsN').textContent = S.bets.filter(b => b.status === 'open').length;
  updateTV(evs, t);
  renderTicker(evs, t);
  ui();
}
window.__vf = {
  busy: () => false,
  bank: () => S.bank,
  onTable: () => 0,
  setBank: v => { S.bank = v; ui(); save(); },
  leave: () => { const n = S.bets.filter(b => b.status === 'open').length; return {ok:true, msg: n ? `Your ${n} open bet${n>1?'s':''} ${n>1?'stay':'stays'} live. Winnings are paid next time you visit the Sports Lounge.` : ''}; }
};
window.__sports = {setOffset: ms => { OFFSET = ms; tick(); }, getEvent, priced, S: () => S, now, settle, RESULT, STATE};

/* boot */
buildNav();
const t0 = now();
const settledBefore = S.bets.filter(b => b.status === 'open').length;
const bankBefore = S.bank;
settle(t0);
quietNotify = false;
const paid = fl(S.bank - bankBefore);
if (paid > 0) setTimeout(() => toast(`Welcome back! Bets settled while you were away paid ${fmt(paid)}.`, true), 600);
save();
renderSlip(); renderBets(); showTab(S.slip.length || !S.bets.some(b => b.status === 'open') ? 'slip' : 'bets');
tick();
setInterval(tick, 1000);
requestAnimationFrame(animateTV);
})();
</script>
